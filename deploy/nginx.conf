# Proxy HTTPS na frente do LAPE (certificado via certbot/Let's Encrypt).
# Sem HTTPS o cookie de sessao trafega em texto claro - nao publique assim.
server {
    listen 443 ssl;
    http2 on;
    server_name lape.udesc.br;

    ssl_certificate     /etc/letsencrypt/live/lape.udesc.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lape.udesc.br/privkey.pem;

    client_max_body_size 12M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # os agentes podem demorar alguns minutos
    }
}
server {
    listen 80;
    server_name lape.udesc.br;
    return 301 https://$host$request_uri;
}
