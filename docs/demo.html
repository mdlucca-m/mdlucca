<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPE - Laboratorio de Psicologia do Esporte e do Exercicio — Painel de indicadores</title>
<style>
/* ==========================================================================
   LAPE — sistema de design  ·  escuro por padrão, fosco, alta densidade

   A paleta categórica foi verificada por script para daltonismo e contraste
   sobre as superfícies em que o painel realmente desenha:
     escuro (#14161c): pior par adjacente ΔE 8,4 (protanopia) · 19,3 (normal)
     claro  (#fcfcfb): pior par adjacente ΔE 9,1 (protanopia) · 19,6 (normal)
   Três slots (azul, laranja, verde-água) também passam em "todos os pares",
   exigido por dispersão, bolha e mapa — por isso essas formas param em três.

   Sobre o degradê: ele veste a MOLDURA (fundo da página, barra superior,
   cabeçalho de cartão, aba ativa) e nunca o fundo onde há marca de dado.
   A área de plotagem é sempre a cor chapada que passou na verificação —
   um degradê ali mudaria o contraste de ponto a ponto e invalidaria o teste.

   Regras que valem em todo o painel:
   - Cor categórica segue a ENTIDADE, nunca a posição no ranking.
   - Nunca gerar uma nona cor: o excedente vira "Outros" ou vai para tabela.
   - Sequencial = um só matiz, claro→escuro. Divergente = dois polos + cinza.
   - Texto nunca veste a cor da série; a identidade vem da marca ao lado.
   ========================================================================== */

:root {
  color-scheme: dark;

  /* --- superfícies e tinta (escuro fosco) --- */
  --surface:        #14161c;   /* cartões e área de plotagem — cor verificada */
  --surface-raised: #1a1d25;   /* cabeçalho de tabela, chips, campos */
  --surface-hover:  #20242e;
  --surface-sunken: #0d0f14;   /* plano da página */
  --ink:            #f2f4f8;
  --ink-2:          #a9b1c2;
  --ink-muted:      #7b8496;
  --grid:           #232733;
  --axis:           #313746;
  --border:         #232733;
  --border-strong:  #313746;

  /* --- degradês da moldura (nunca sob marcas de dado) --- */
  --grad-page: radial-gradient(1200px 620px at 16% -8%, #18202f 0%, transparent 62%),
               radial-gradient(900px 520px at 96% 4%, #191b2b 0%, transparent 58%),
               linear-gradient(180deg, #0e1017 0%, #0d0f14 42%);
  --grad-bar:  linear-gradient(180deg, rgba(37,106,191,.14) 0%, rgba(20,22,28,0) 100%);
  --grad-card: linear-gradient(180deg, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 58%);
  --grad-kpi:  linear-gradient(135deg, rgba(57,135,229,.13) 0%, rgba(20,22,28,0) 55%);
  --grad-accent: linear-gradient(90deg, #3987e5 0%, #199e70 100%);

  /* --- ação --- */
  --accent:        #6da7ec;   /* 7,2:1 sobre a superfície — cor de texto/link */
  --accent-solid:  #256abf;   /* fundo de botão; texto branco a 5,4:1 */
  --accent-strong: #3987e5;
  --accent-wash:   #172436;
  --on-accent:     #ffffff;

  /* --- séries categóricas (ordem fixa; nunca reciclar) --- */
  --series-1: #3987e5;  /* azul       */
  --series-2: #d95926;  /* laranja    */
  --series-3: #199e70;  /* verde-água */
  --series-4: #c98500;  /* amarelo    */
  --series-5: #d55181;  /* magenta    */
  --series-6: #008300;  /* verde      */
  --series-7: #9085e9;  /* violeta    */
  --series-8: #e66767;  /* vermelho   */

  /* --- sequencial: um matiz. No escuro, mais claro = maior. --- */
  --seq-100: #0d366b; --seq-200: #184f95; --seq-300: #256abf; --seq-400: #3987e5;
  --seq-500: #5598e7; --seq-600: #86b6ef; --seq-700: #cde2fb;

  /* --- ordinal: etapas ordenadas (funil, faixas) --- */
  --ord-1: #cde2fb; --ord-2: #9ec5f4; --ord-3: #6da7ec; --ord-4: #3987e5;

  /* --- divergente: dois polos opostos + cinza neutro --- */
  --div-neg: #3987e5; --div-mid: #313746; --div-pos: #e66767;

  /* --- estado (reservado; nunca vira "série 9") --- */
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;

  /* --- forma --- */
  --radius:    14px;
  --radius-sm: 10px;
  --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.34);
  --shadow-lg: 0 2px 8px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.5);
  --ring:      inset 0 1px 0 rgba(255,255,255,.045);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

/* O modo claro é uma seleção própria, não uma inversão automática:
   os mesmos oito matizes, reposicionados para a superfície clara. */
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) {
    color-scheme: light;
    --surface:        #fcfcfb;
    --surface-raised: #f2f1ee;
    --surface-hover:  #eceae5;
    --surface-sunken: #f6f6f3;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --ink-muted:      #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         #dedcd4;
    --border-strong:  #c3c2b7;

    --grad-page: radial-gradient(1100px 560px at 14% -10%, #eaf1fb 0%, transparent 60%),
                 linear-gradient(180deg, #fbfbf9 0%, #f6f6f3 46%);
    --grad-bar:  linear-gradient(180deg, rgba(37,106,191,.07) 0%, rgba(252,252,251,0) 100%);
    --grad-card: linear-gradient(180deg, rgba(11,11,11,.018) 0%, rgba(11,11,11,0) 58%);
    --grad-kpi:  linear-gradient(135deg, rgba(42,120,214,.08) 0%, rgba(252,252,251,0) 55%);

    --accent:        #256abf;
    --accent-solid:  #256abf;
    --accent-strong: #1c5cab;
    --accent-wash:   #eaf2fd;

    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;

    --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5;
    --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;

    --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #1c5cab;
    --div-mid: #f0efec;

    --shadow:    0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.05);
    --shadow-lg: 0 2px 8px rgba(11,11,11,.08), 0 18px 48px rgba(11,11,11,.12);
    --ring:      inset 0 1px 0 rgba(255,255,255,.6);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --surface:        #fcfcfb;
  --surface-raised: #f2f1ee;
  --surface-hover:  #eceae5;
  --surface-sunken: #f6f6f3;
  --ink:            #0b0b0b;
  --ink-2:          #52514e;
  --ink-muted:      #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         #dedcd4;
  --border-strong:  #c3c2b7;

  --grad-page: radial-gradient(1100px 560px at 14% -10%, #eaf1fb 0%, transparent 60%),
               linear-gradient(180deg, #fbfbf9 0%, #f6f6f3 46%);
  --grad-bar:  linear-gradient(180deg, rgba(37,106,191,.07) 0%, rgba(252,252,251,0) 100%);
  --grad-card: linear-gradient(180deg, rgba(11,11,11,.018) 0%, rgba(11,11,11,0) 58%);
  --grad-kpi:  linear-gradient(135deg, rgba(42,120,214,.08) 0%, rgba(252,252,251,0) 55%);

  --accent:        #256abf;
  --accent-solid:  #256abf;
  --accent-strong: #1c5cab;
  --accent-wash:   #eaf2fd;

  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;

  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5;
  --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;

  --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #1c5cab;
  --div-mid: #f0efec;

  --shadow:    0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.05);
  --shadow-lg: 0 2px 8px rgba(11,11,11,.08), 0 18px 48px rgba(11,11,11,.12);
  --ring:      inset 0 1px 0 rgba(255,255,255,.6);
}

/* ==========================================================================
   base
   ========================================================================== */
* { box-sizing: border-box; }
html { background: var(--surface-sunken); min-height: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  background: var(--grad-page) fixed, var(--surface-sunken);
  color: var(--ink);
  font: 14.5px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
h1, h2, h3, h4 { line-height: 1.18; margin: 0; letter-spacing: -.016em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 5px; }
svg.icon { width: 1em; height: 1em; flex: none; display: block; }

/* --------------------------------------------------------------------------
   pastilha do ícone
   O traço é o mesmo; o que muda é a moldura — degradê do próprio tom, aro
   colorido e um halo curto por baixo. É cromo: dá cor e relevo à navegação e
   aos cartões sem tocar na paleta que governa as marcas dos gráficos.
   -------------------------------------------------------------------------- */
.ibadge {
  --tone: var(--accent-strong);
  --badge: 34px;
  position: relative; flex: none; display: inline-grid; place-items: center;
  width: var(--badge); height: var(--badge); border-radius: calc(var(--badge) * .32);
  color: var(--tone); font-size: calc(var(--badge) * .55);
  background:
    linear-gradient(148deg, color-mix(in srgb, var(--tone) 30%, transparent) 0%,
                            color-mix(in srgb, var(--tone) 6%, transparent) 72%),
    var(--surface-raised);
  border: 1px solid color-mix(in srgb, var(--tone) 42%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tone) 26%, transparent),
              0 6px 16px -9px color-mix(in srgb, var(--tone) 85%, transparent);
}
.ibadge svg.icon { stroke-width: 1.9; }
.ibadge.sm { --badge: 26px; border-radius: 8px; }
.ibadge.lg { --badge: 44px; }
.ibadge.xl { --badge: 60px; }
/* sólida: o tom vira fundo, para o item ativo e para o mural */
.ibadge.solid {
  color: var(--on-accent); border-color: transparent;
  background: linear-gradient(148deg, color-mix(in srgb, var(--tone) 92%, #fff) 0%, var(--tone) 78%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28),
              0 8px 20px -8px color-mix(in srgb, var(--tone) 90%, transparent);
}
/* halo que respira — só onde algo pede atenção agora */
.ibadge.pulsa::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit;
  border: 1px solid color-mix(in srgb, var(--tone) 60%, transparent);
  animation: halo 2.4s ease-out infinite;
}
@keyframes halo {
  0%   { transform: scale(.94); opacity: .85; }
  70%  { transform: scale(1.16); opacity: 0; }
  100% { transform: scale(1.16); opacity: 0; }
}

/* Os tons saem das mesmas rampas do tema: nenhuma cor nova entra no sistema. */
.ibadge.t-azul     { --tone: var(--series-1); }
.ibadge.t-laranja  { --tone: var(--series-2); }
.ibadge.t-verde    { --tone: var(--series-3); }
.ibadge.t-ambar    { --tone: var(--series-4); }
.ibadge.t-magenta  { --tone: var(--series-5); }
.ibadge.t-violeta  { --tone: var(--series-7); }
.ibadge.t-acento   { --tone: var(--accent-strong); }
.ibadge.t-bom      { --tone: var(--good); }
.ibadge.t-alerta   { --tone: var(--warning); }
.ibadge.t-grave    { --tone: var(--serious); }
.ibadge.t-critico  { --tone: var(--critical); }

/* ==========================================================================
   controles
   ========================================================================== */
label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
input, select, textarea {
  width: 100%; padding: 8px 11px; font: inherit; font-size: 13.5px;
  color: var(--ink); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  transition: border-color .12s, box-shadow .12s, background .12s;
}
input:hover, select:hover, textarea:hover { border-color: var(--ink-muted); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent-strong); background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-wash);
}
textarea { min-height: 84px; resize: vertical; }
input[type=checkbox] { width: auto; margin-right: 7px; accent-color: var(--accent-strong); }
button {
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius-sm);
  color: var(--ink); background: var(--surface-raised);
  border: 1px solid var(--border-strong); box-shadow: var(--ring);
  transition: background .12s, border-color .12s, color .12s, transform .1s;
}
button:hover { background: var(--surface-hover); border-color: var(--ink-muted); }
button:active { transform: translateY(1px); }
button.primary {
  background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent);
}
button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--surface-raised); color: var(--ink); }
button:disabled { opacity: .42; cursor: not-allowed; }
button:disabled:active { transform: none; }

/* ==========================================================================
   superfícies
   ========================================================================== */
.card {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 17px; box-shadow: var(--shadow), var(--ring);
}
/* o degradê fica numa camada acima do fundo e ABAIXO do conteúdo,
   com altura limitada ao cabeçalho — nunca sob a área de plotagem */
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 96px;
  background: var(--grad-card); pointer-events: none;
}
.card > * { position: relative; }
.card > h3 { font-size: 13.5px; font-weight: 700; }
.card > .hint { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.hint { font-size: 12px; color: var(--ink-2); }
.grid { display: grid; gap: 13px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(248px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
/* oito indicadores devem fechar duas fileiras de quatro, não cinco e três */
.grid.fixed4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .grid.fixed4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.full { grid-column: 1 / -1; }

/* ==========================================================================
   números
   Figuras proporcionais em valores grandes; tabulares só em colunas.
   ========================================================================== */
.kpi {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px 14px;
  box-shadow: var(--shadow), var(--ring);
  display: flex; flex-direction: column; gap: 1px;
}
.kpi::before { content: ""; position: absolute; inset: 0; background: var(--grad-kpi);
  pointer-events: none; }
.kpi > * { position: relative; }
.kpi .label { font-size: 10.5px; font-weight: 700; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: .07em;
  display: flex; align-items: center; gap: 6px; }
.kpi .label svg.icon { color: var(--accent); font-size: 13px; }
.kpi .label .ibadge { --badge: 24px; border-radius: 7px; }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.03em; line-height: 1.12;
  margin-top: 3px; }
.kpi .foot { font-size: 11.5px; color: var(--ink-muted); }
.kpi .spark { margin-top: 7px; }
/* tom do indicador: a cor reforça o rodapé, nunca informa sozinha */
.kpi.t-good { border-color: color-mix(in srgb, var(--good) 34%, var(--border)); }
.kpi.t-good .label svg.icon { color: var(--good); }
.kpi.t-bad { border-color: color-mix(in srgb, var(--critical) 34%, var(--border)); }
.kpi.t-bad .label svg.icon { color: var(--critical); }
.kpi.hero { grid-column: span 2; }
.kpi.hero .value { font-size: 52px; letter-spacing: -.036em; }
.delta { font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 3px;
  margin-top: 2px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--ink-muted); }

/* ==========================================================================
   tabelas
   ========================================================================== */
.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow), var(--ring); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--grid);
  vertical-align: top; }
th { background: var(--surface-raised); font-size: 11px; font-weight: 700; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  position: sticky; top: 0; z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th .dir { opacity: .6; font-size: 9px; margin-left: 3px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--surface-raised); }
tbody tr.clickable { cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.title { min-width: 250px; max-width: 520px; }
td small { display: block; color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
.empty { padding: 26px; text-align: center; color: var(--ink-muted); font-size: 13px; }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 12px; border-top: 1px solid var(--grid); font-size: 12px; color: var(--ink-2);
  flex-wrap: wrap; }
.tfoot .pager { display: flex; gap: 5px; align-items: center; }
.tfoot button { padding: 3px 9px; font-size: 11.5px; }

/* ==========================================================================
   selos e barras
   Cor de estado nunca vem sozinha: sempre com rótulo.
   ========================================================================== */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--surface-raised); color: var(--ink-2); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge.s-producao  { color: var(--series-1);
  border-color: color-mix(in srgb, var(--series-1) 38%, transparent);
  background: color-mix(in srgb, var(--series-1) 14%, transparent); }
.badge.s-submetido { color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 42%, transparent);
  background: color-mix(in srgb, var(--warning) 15%, transparent); }
.badge.s-aceito    { color: var(--series-3);
  border-color: color-mix(in srgb, var(--series-3) 38%, transparent);
  background: color-mix(in srgb, var(--series-3) 14%, transparent); }
.badge.s-publicado { color: var(--good);
  border-color: color-mix(in srgb, var(--good) 42%, transparent);
  background: color-mix(in srgb, var(--good) 14%, transparent); }
.badge.s-rejeitado { color: var(--critical);
  border-color: color-mix(in srgb, var(--critical) 42%, transparent);
  background: color-mix(in srgb, var(--critical) 14%, transparent); }
.badge.s-arquivado { color: var(--ink-muted); }

.prog { display: inline-flex; gap: 3px; align-items: center; }
.prog i { width: 12px; height: 6px; border-radius: 2px; background: var(--grid); display: block; }
.prog i.on { background: var(--seq-500); }
.prog i.sub { background: var(--warning); }

.meter { height: 8px; border-radius: 4px; background: var(--seq-100); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--seq-500); }

/* ==========================================================================
   gráficos
   ========================================================================== */
figure.chart { margin: 0; }
figure.chart figcaption { font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
svg.plot { display: block; width: 100%; height: auto; overflow: visible; }
/* formas redondas crescem em círculo: sem teto, viram um disco gigante no cartão */
svg.plot.round { max-width: 380px; margin-inline: auto; }
.plot .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
