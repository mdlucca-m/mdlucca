<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   ELASE — preparação física do voleibol masculino adulto.

   Porte fiel do sistema em Python: as contas são as mesmas, inclusive as
   RECUSAS. A regra que atravessa o arquivo inteiro é que um número inventado
   é pior do que número nenhum — ACWR com pouco histórico, Z sem base, humor
   sem coleta: tudo isso aparece como "—" com o motivo, nunca como zero.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Datas ──────────────────────────────────────────────────────────────── */
const hojeISO = () => new Date().toLocaleDateString("sv-SE");   // aaaa-mm-dd local
function dObj(s){ const [a,m,d] = s.split("-").map(Number); return new Date(a, m-1, d); }
function maisDias(s, n){
  const d = dObj(s); d.setDate(d.getDate() + n);
  return d.toLocaleDateString("sv-SE");
}
function diffDias(a, b){ return Math.round((dObj(a) - dObj(b)) / 86400000); }
function segundaDe(s){ const d = dObj(s); return maisDias(s, -((d.getDay() + 6) % 7)); }
function semanaDe(data, macro){ return Math.floor(diffDias(data, macro) / 7) + 1; }
function dataBR(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : (s||""); }
const DIA_SEM = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function diaSemana(s){ return DIA_SEM[dObj(s).getDay()]; }

/* ── Estatística de bolso ───────────────────────────────────────────────── */
const media = v => v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
function desvio(v){                       // AMOSTRAL (n−1); com n<2 não existe
  if (v.length < 2) return 0;
  const m = media(v);
  return Math.sqrt(v.reduce((a,x)=>a+(x-m)*(x-m),0) / (v.length-1));
}
function quartis(v){                      // menos de 5 pontos não é faixa
  const x = v.filter(i => i !== null && i !== undefined).map(Number).sort((a,b)=>a-b);
  if (x.length < 5) return null;
  const q = p => {
    const i = (x.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
    return lo === hi ? x[lo] : x[lo] + (x[hi]-x[lo])*(i-lo);
  };
  const q1 = q(.25), med = q(.5), q3 = q(.75), iqr = q3-q1;
  return {q1, mediana:med, q3, iqr, n:x.length, inf:q1-1.5*iqr, sup:q3+1.5*iqr};
}
function postos(v){                       // empate recebe a média — Spearman exige
  const ord = v.map((_,i)=>i).sort((a,b)=>v[a]-v[b]);
  const r = new Array(v.length).fill(0);
  let i = 0;
  while (i < ord.length){
    let j = i;
    while (j+1 < ord.length && v[ord[j+1]] === v[ord[i]]) j++;
    const p = (i+j)/2 + 1;
    for (let k=i; k<=j; k++) r[ord[k]] = p;
    i = j+1;
  }
  return r;
}
function spearman(a, b){
  /* Spearman e não Pearson: PSE e BRUMS são escalas ORDINAIS, e um único dia
     extremo entorta um Pearson inteiro. Menos de 6 pares não conclui nada. */
  const pares = [];
  for (let i=0;i<a.length;i++)
    if (a[i] !== null && a[i] !== undefined && b[i] !== null && b[i] !== undefined)
      pares.push([a[i], b[i]]);
  if (pares.length < 6) return null;
  const ra = postos(pares.map(p=>p[0])), rb = postos(pares.map(p=>p[1]));
  const ma = media(ra), mb = media(rb);
  let sxy=0, sxx=0, syy=0;
  for (let i=0;i<ra.length;i++){
    sxy += (ra[i]-ma)*(rb[i]-mb); sxx += (ra[i]-ma)**2; syy += (rb[i]-mb)**2;
  }
  if (!sxx || !syy) return null;
  const r = sxy/Math.sqrt(sxx*syy), n = pares.length;
  const t = Math.abs(r)*Math.sqrt((n-2)/Math.max(1e-9, 1-r*r));
  return {r, n, t, forte: Math.abs(r) >= .5 && t >= 2};
}

/* ── Periodização ───────────────────────────────────────────────────────── */
/* Os 8 blocos são UM macrociclo, não a temporada: eles voltam ao começo quantas
   vezes for preciso. O que faz o ciclo seguinte valer mais não é mudar o
   percentual — é o 1RM ter subido. Por isso a última sessão de cada Realização
   é um RETESTE. */
const BLOCOS_PADRAO = [
  {posicao:1, bloco:"Acumulação",   micro:"Incorporação", enfase:"Adaptação anatômica e técnica de LPO", intensidade:.62, volume:.75, plio:60},
  {posicao:2, bloco:"Acumulação",   micro:"Ordinário",    enfase:"Força máxima de base",                 intensidade:.72, volume:.88, plio:90},
  {posicao:3, bloco:"Acumulação",   micro:"CHOQUE",       enfase:"Pico de volume da acumulação",         intensidade:.78, volume:1.0,  plio:120},
  {posicao:4, bloco:"Descarga",     micro:"Recuperativo", enfase:"Assimilação e supercompensação",       intensidade:.66, volume:.45, plio:45},
  {posicao:5, bloco:"Transmutação", micro:"Ordinário",    enfase:"Força máxima",                         intensidade:.85, volume:.75, plio:90},
  {posicao:6, bloco:"Transmutação", micro:"Ordinário",    enfase:"Força-velocidade",                     intensidade:.90, volume:.70, plio:110},
  {posicao:7, bloco:"Transmutação", micro:"CHOQUE",       enfase:"Sobrecarga concentrada de potência",   intensidade:.93, volume:.85, plio:140},
  {posicao:8, bloco:"Realização",   micro:"Polimento",    enfase:"Expressão de potência",                intensidade:.95, volume:.42, plio:70},
];
const DIAS = [
  {off:0, hora:"09:00", tipo:"Força",    nome:"A", obj:"Força máxima"},
  {off:2, hora:"09:00", tipo:"Potência", nome:"B", obj:"Potência"},
  {off:4, hora:"09:00", tipo:"LPO",      nome:"C", obj:"Força-velocidade"},
];
/* Séries × reps do levantamento principal, escritos à mão e não derivados de
   fórmula — para você poder discordar de um número sem ter de entender uma conta. */
const PRINCIPAL = {1:[4,"6",150],2:[5,"5",180],3:[5,"4",180],4:[3,"4",150],
                   5:[5,"3",180],6:[4,"3",180],7:[4,"2",210],8:[3,"2",210]};
/* O levantamento olímpico anda atrás em percentual: quem trava a barra é a
   técnica, não a força. */
const OLIMPICO = {1:[4,"3",-.14],2:[5,"3",-.12],3:[5,"3",-.10],4:[3,"3",-.14],
                  5:[5,"2",-.08],6:[5,"2",-.06],7:[4,"2",-.05],8:[3,"2",-.05]};

const MOBILIDADE = {
  A:[["Mobilização de tornozelo na parede (knee-to-wall)",2,"8 cada lado",30],
     ["90/90 de quadril com rotação",2,"6 cada lado",30],
     ["Passagem de bastão sobre a cabeça",2,"10",30],
     ["Rotação torácica deitado (open book)",2,"8 cada lado",30]],
  B:[["Panturrilha alongada no step",2,"30 s",20],
     ["Alongamento de psoas ajoelhado",2,"30 s cada lado",20],
     ["Deslizamento na parede com elástico",2,"10",30],
     ["Extensão torácica no rolo",2,"8",30]],
  C:[["Agachamento profundo sustentado",3,"30 s",30],
     ["Agachamento cossaco",2,"6 cada lado",30],
     ["Adução horizontal de ombro (cross-body)",2,"30 s cada lado",20],
     ["Y-T-W no banco inclinado",2,"8 de cada",30]],
};
const EDUCATIVOS = {
  A:[["Agachamento overhead",3,"5",60],["Arranco de força (muscle snatch)",3,"3",60],
     ["Snatch balance",3,"3",60],["Arranco do alto (high hang)",3,"3",90]],
  B:[["Posição de recepção do clean (front rack)",2,"30 s",45],
     ["Clean do alto (tall clean)",3,"3",60],["Clean de força (muscle clean)",3,"3",60],
     ["Clean do joelho (hang)",3,"3",90]],
  C:[["Tríplice extensão com bastão",3,"6",45],["Push press",3,"5",90]],
};

function ex(nome, grupo, series, reps, pausa, o){
  return Object.assign({nome, grupo, series, reps:String(reps), pausa,
    pct_rm:null, ref1rm:null, tempo:null, rir:null, vel:null, obs:""}, o||{});
}
const posicaoNoCiclo = (sem, n) => ((sem-1) % n) + 1;
const cicloDe         = (sem, n) => Math.floor((sem-1)/n) + 1;
const eSemanaReteste  = (sem, n) => posicaoNoCiclo(sem, n) === n;
const vol = (b, n) => Math.max(2, Math.round(n * b.volume));
/* Contatos: o bloco define o TOTAL da semana, repartido entre os EXERCÍCIOS.
   Repartir por sessão e pôr dois exercícios pliométricos dentro dela estoura o
   alvo, porque cada um receberia a fatia inteira. */
const saltos = (b, fatia, porSerie) => Math.max(2, Math.round(b.plio * fatia / porSerie));

const ombro = () => ex("Rotadores do ombro com elástico","Força",3,15,60,{rir:3,
  obs:"Fortalecimento do manguito — isto NÃO é mobilidade, é força do estabilizador. As duas coisas entram, e são diferentes."});

const blocoMobilidade = s => MOBILIDADE[s].map(([n,se,r,p]) => ex(n,"Mobilidade",se,r,p));
function quantosEducativos(pos){   // na acumulação é treino; na realização é rampa
  if (pos <= 3) return 4;
  if (pos === 4) return 3;
  if (pos <= 6) return 3;
  return 2;
}
const blocoEducativo = (s, pos) => EDUCATIVOS[s].slice(0, quantosEducativos(pos))
  .map(([n,se,r,p]) => ex(n,"Educativo",se,r,p,

function sessaoB(b, pos, semana, n){

function sessaoReteste(){

  return [...blocoMobilidade("A"), ombro(),

function gerarSistema(blocos, macro, deSem, ateSem, ocupadasIn){
  /* Dia já prescrito é PULADO, nunca sobrescrito: regerar depois de ajustar um
     bloco não desfaz o seu ajuste. */
  const n = blocos.length;
  if (!n) return {sessoes:[], pulados:[]};
  const ocupadas = new Set(ocupadasIn || []);
  const sessoes = [], pulados = [];
  for (let semana = deSem; semana <= ateSem; semana++){
    const pos = posicaoNoCiclo(semana, n), b = blocos[pos-1], ciclo = cicloDe(semana, n);
    const inicio = maisDias(macro, 7*(semana-1));
    for (const dia of DIAS){
      const data = maisDias(inicio, dia.off);
      if (ocupadas.has(data)){ pulados.push(data); continue; }
      const reteste = eSemanaReteste(semana, n) && dia.nome === "C";
      const exs = reteste ? sessaoReteste()
                : dia.nome === "A" ? sessaoA(b, pos)
                : dia.nome === "B" ? sessaoB(b, pos, semana, n)
                : sessaoC(b, pos);
      sessoes.push({
        data, hora:dia.hora, tipo: reteste ? "Força" : dia.tipo,
        objetivo: reteste ? "Reteste de 1RM e salto" : dia.obj,
        bloco:b.bloco,
        notas:`Ciclo ${ciclo} · semana ${semana} (${pos}/${n}) · ${b.micro} · ${b.enfase}`
              + (reteste ? " · RETESTE" : ` · sessão ${dia.nome}`),
        exercicios: exs,
      });
      ocupadas.add(data);
    }
  }
  return {sessoes, pulados};
}

/* ── Custo de uma sessão ────────────────────────────────────────────────── */
/* Mobilidade, Educativo e Recuperação entram na DURAÇÃO, mas não somam
   tonelagem nem contato pliométrico: o que se faz ali é amplitude e padrão de
   movimento, e contar isso como carga mecânica falseia a conta. */
const SEM_CARGA = ["Mobilidade","Educativo","Recuperação"];
const PSE_TIPO = {"Força":7,"Potência":6.5,"LPO":7,"Pliometria":7,
                  "Técnico-Tático":7,"Recuperação":3,"Mobilidade":2};
function primeiroNumero(txt){
  const m = String(txt).match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}
function segundosDeTrabalho(reps){
  /* "30 s" é uma PERMANÊNCIA de 30 segundos, não 30 repetições. Tratar os dois
     igual fazia um alongamento de meio minuto virar 2 min na conta, e a
     mobilidade inteira inflava a duração prevista da sessão. */
  const txt = String(reps).toLowerCase(), n = primeiroNumero(txt);
  if (!n) return 24;
  if (/\d\s*s(eg|egundos)?\b/.test(txt)) return n;
  return n * 4;
}
function planoSessao(exs, tipo, durPrev){
  let series = 0, seg = 0, segPrep = 0, contatos = 0;
  for (const e of exs){
    const s = parseInt(e.series, 10);
    series += s;
    const t = s * ((e.pausa || 90) + segundosDeTrabalho(e.reps));
    seg += t;
    if (e.grupo === "Mobilidade" || e.grupo === "Educativo") segPrep += t;
    if (e.grupo === "Pliometria") contatos += s * primeiroNumero(e.reps);
  }
  /* A UA sai da duração ARREDONDADA de propósito: é o número que aparece na
     tela, e quem refizer a conta na mão tem de chegar no mesmo lugar. */
  const minutos = Math.round(durPrev ? durPrev : seg/60);
  const pse = PSE_TIPO[tipo] !== undefined ? PSE_TIPO[tipo] : 6;
  return {series, dur:minutos, contatos, dur_prep:Math.round(segPrep/60),
          pse, ua:Math.round(minutos*pse), estimada: !durPrev};
}

/* ── Carga ──────────────────────────────────────────────────────────────── */
function carga(sessoes, hoje){
  /* ACWR = aguda (7 d) ÷ crônica (média semanal de 28 d).
     Monotonia = média ÷ desvio das cargas diárias. Strain = monotonia × semanal. */
  const h = hoje || hojeISO();
  const linhas = sessoes.filter(s => s.carga_ua > 0).sort((a,b)=>a.data<b.data?-1:1);
  if (!linhas.length)
    return {n:0, total:0, aguda:0, cronica:0, acwr:0, monotonia:0,
            monotonia_indefinida:false, strain:0, semanal:0, hist_dias:0,
            diarias:[0,0,0,0,0,0,0], datas:[]};
  const soma = (ini, fim) => linhas.filter(x => x.data >= ini && x.data <= fim)
    .reduce((a,x)=>a+x.carga_ua, 0);
  const aguda = soma(maisDias(h,-6), h), cronica = soma(maisDias(h,-27), h)/4;
  const diarias = [], datas = [];
  for (let i=6;i>=0;i--){
    const dia = maisDias(h,-i);
    datas.push(dia);
    diarias.push(linhas.filter(x=>x.data===dia).reduce((a,x)=>a+x.carga_ua,0));
  }
  const md = media(diarias), sd = desvio(diarias), semanal = diarias.reduce((a,b)=>a+b,0);
  /* Com desvio ZERO a monotonia é matematicamente indefinida — e devolver 0
     seria a pior resposta possível: 0 se lê como "ótima variação" quando é o
     caso MÁXIMO, carga idêntica todo dia. */
  const mono = sd > 0 ? md/sd : (semanal > 0 ? null : 0);
  return {n:linhas.length, total:linhas.reduce((a,x)=>a+x.carga_ua,0),
    aguda, cronica, acwr: cronica > 0 ? aguda/cronica : 0,
    monotonia:mono, monotonia_indefinida: mono === null,
    strain: mono === null ? null : mono*semanal, semanal,
    hist_dias: diffDias(h, linhas[0].data) + 1, diarias, datas};
}
function zonaACWR(valor, hist){
  /* Ressalva que fica na tela: o ACWR é apoio à decisão, não diagnóstico — a
     literatura tem crítica metodológica séria a ele (Impellizzeri, 2020). */
  if (!valor) return {t:"Sem histórico", c:""};
  if (hist < 21) return {t:"Histórico curto", c:""};
  if (valor < .80) return {t:"Subcarga", c:"info"};
  if (valor <= 1.30) return {t:"Zona ideal", c:"good"};
  if (valor <= 1.50) return {t:"Atenção", c:"warn"};
  return {t:"Risco elevado", c:"crit"};
}

/* ── Humor (BRUMS) ──────────────────────────────────────────────────────── */
const BRUMS_ITENS = [
  ["Tensão",   ["Apreensivo","Nervoso","Ansioso","Preocupado"]],
  ["Depressão",["Deprimido","Infeliz","Desanimado","Triste"]],
  ["Raiva",    ["Irritado","Zangado","Mal-humorado","Com raiva"]],
  ["Vigor",    ["Animado","Com energia","Ativo","Disposto"]],
  ["Fadiga",   ["Esgotado","Sonolento","Cansado","Sem energia"]],
  ["Confusão", ["Confuso","Indeciso","Desnorteado","Inseguro"]],
];
const SUBESCALAS = BRUMS_ITENS.map(x=>x[0]);
const NEGATIVAS = ["Tensão","Depressão","Raiva","Fadiga","Confusão"];
const BRUMS_LISTA = [];                       // 24 itens, na ordem gravada
BRUMS_ITENS.forEach(([sub, itens]) => itens.forEach(i => BRUMS_LISTA.push([i, sub])));

function brumsPorData(diario, momento){
  /* {data: {subescala: soma, TMD}}. TMD = negativas − Vigor + 100; o 100 existe
     só para o número não ficar negativo, não tem significado clínico. */
  const fora = {};
  for (const chave of Object.keys(diario.b || {})){
    const [data, mom] = chave.split("|");
    if (mom !== (momento || "pre")) continue;
    const vals = diario.b[chave];
    if (!Array.isArray(vals) || vals.length !== 24) continue;
    const sub = {};
    SUBESCALAS.forEach(s => sub[s] = 0);
    vals.forEach((v, i) => sub[BRUMS_LISTA[i][1]] += (v || 0));
    sub.TMD = NEGATIVAS.reduce((a,s)=>a+sub[s],0) - sub.Vigor + 100;
    fora[data] = sub;
  }
  return fora;
}
function zMovel(datas, valores, janela, minimo){
  /* Z de cada ponto contra a janela ANTERIOR a ele. A janela não inclui o
     próprio ponto de propósito: comparar um valor com uma média que já o contém
     encolhe o desvio e esconde justamente o desvio que se quer enxergar. */
  janela = janela || 30; minimo = minimo || 5;
  return valores.map((x, i) => {
    const base = [];
    for (let j=0;j<i;j++) if (diffDias(datas[i], datas[j]) <= janela) base.push(valores[j]);
    if (base.length < minimo) return null;
    const s = desvio(base);
    return s > 0 ? (x - media(base))/s : null;
  });
}
function zHoje(diario, janela){
  /* Norma de GRUPO em humor engana: a Fadiga 10 do líbero pode ser a
     segunda-feira normal do central. A comparação é sempre dele com ele mesmo. */
  janela = janela || 30;
  const porData = brumsPorData(diario, "pre"), datas = Object.keys(porData).sort();
  return SUBESCALAS.concat(["TMD"]).map(sub => {
    const vals = datas.map(dt => porData[dt][sub]);
    if (vals.length < 6)
      return {subescala:sub, z:null, n:vals.length, valor: vals.length?vals[vals.length-1]:null,
              media:null, desvio:null, faixa:null, ruim:0};
    const zs = zMovel(datas, vals, janela);
    let ultimo = null;
    for (let i=zs.length-1;i>=0;i--) if (zs[i] !== null){ ultimo = zs[i]; break; }
    const i = vals.length-1, base = [];
    for (let j=0;j<i;j++) if (diffDias(datas[i], datas[j]) <= janela) base.push(vals[j]);
    return {subescala:sub, z:ultimo, valor:vals[i], n:base.length,
      media: base.length ? media(base) : null,
      desvio: base.length > 1 ? desvio(base) : null,
      faixa: quartis(vals),
      /* no Vigor, CAIR é que é ruim: o alerta é para baixo */
      ruim: sub === "Vigor" ? -(ultimo || 0) : (ultimo || 0)};
  });
}

/* ── Prontidão ──────────────────────────────────────────────────────────── */
const PESOS = {sono:.20, alerta:.15, dor:.15, humor:.25, carga:.15};
function prontidao(sessoes, diario, hoje){
  /* Componente que FALTA é excluído da média e o peso redistribuído — não entra
     como zero. Um atleta que não respondeu a BRUMS não é um atleta com humor
     péssimo. */
  const c = carga(sessoes, hoje);
  const datasW = Object.keys(diario.w || {}).sort();
  const w = datasW.length ? diario.w[datasW[datasW.length-1]] : {};
  const zs = {}; zHoje(diario).forEach(x => zs[x.subescala] = x);
  const zTmd = zs.TMD ? zs.TMD.z : null;

  const comp = {};
  const lim = x => Math.max(0, Math.min(100, x));
  if (w.sq !== undefined && w.sq !== null)
    comp.sono = lim((w.sq/5)*60 + Math.min((w.sh||0)/8, 1)*40);
  if (w.kss !== undefined && w.kss !== null) comp.alerta = lim((9-w.kss)/8*100);
  if (w.dor !== undefined && w.dor !== null) comp.dor = lim((10-w.dor)/10*100);
  if (zTmd !== null) comp.humor = lim(50 - zTmd*20 + 25);
  const z = zonaACWR(c.acwr, c.hist_dias);
  comp.carga = {good:100, warn:72, crit:45, info:78}[z.c] !== undefined
             ? {good:100, warn:72, crit:45, info:78}[z.c] : 100;

  const peso = Object.keys(comp).reduce((a,k)=>a+PESOS[k], 0);
  const valor = peso ? Object.keys(comp).reduce((a,k)=>a+comp[k]*PESOS[k], 0)/peso : null;

  const band = [];
  if (c.hist_dias >= 21 && c.acwr > 1.5) band.push(["ACWR acima de 1,50","crit"]);
  else if (c.hist_dias >= 21 && c.acwr > 0 && c.acwr < .8) band.push(["ACWR abaixo de 0,80","warn"]);
  if (c.monotonia === null && c.semanal > 0)
    band.push(["Carga idêntica todos os dias — nenhuma variação","crit"]);
  else if (c.monotonia !== null && c.monotonia > 2) band.push(["Monotonia acima de 2,0","warn"]);
  if (zTmd !== null && zTmd > 2) band.push(["Humor a mais de 2 desvios da própria base","crit"]);
  const comZ = zHoje(diario).filter(x => x.z !== null);
  const pior = comZ.length ? comZ.reduce((a,b)=> b.ruim > a.ruim ? b : a) : null;
  if (pior && pior.ruim >= 1.5) band.push([`${pior.subescala} atípica para ele`,"warn"]);
  if (w.dor !== undefined && w.dor !== null && w.dor >= 7)
    band.push(["Dor alta no último check-in","warn"]);

  const criticas = band.filter(b => b[1] === "crit").length;
  const nivel = (criticas || band.length >= 3) ? 2 : (band.length ? 1 : 0);
  return {valor, componentes:comp, carga:c, zona:z, bandeiras:band, nivel, z_tmd:zTmd};
}

/* ── Ficha do WhatsApp ──────────────────────────────────────────────────── */
/* Regra do bloco inteiro: o que não deu para entender fica EM BRANCO e é
   reportado. Chutar aqui significa um atleta com a estatura errada entrando no
   cálculo de carga, e ninguém percebendo. */
const CAMPOS_WA = [
  [1,"nome","Nome completo","txt",true],[2,"apelido","Como prefere ser chamado","txt",false],
  [3,"nasc","Data de nascimento","data",true],[4,"posicao","Posição","opc",true],
  [5,"camisa","Número da camisa","int",false],[6,"telefone","Telefone (WhatsApp)","txt",false],
  [7,"estatura","Estatura em cm","num",true],[8,"massa","Massa corporal em kg","num",true],
  [9,"anos_pratica","Anos de prática no voleibol","int",true],
  [10,"dominancia","Mão dominante","opc",false],
  [11,"perna_impulsao","Perna de impulsão","opc",false],
  [12,"emergencia","Contato de emergência","txt",true],
  [13,"lesoes","Lesões anteriores ou limitações","txt",false],
  [14,"obs","Algo mais que a comissão deva saber","txt",false],
  [15,"escolaridade","Escolaridade","opc",false],
];
const POSICOES = ["Levantador","Oposto","Ponteiro (Ponta)","Central","Líbero"];
const OPCOES = {
  posicao: POSICOES,
  dominancia: ["Destro","Canhoto","Ambidestro"],
  perna_impulsao: ["Esquerda","Direita","Simétrica"],
  escolaridade: ["Fundamental","Médio completo","Superior em andamento","Superior completo","Pós-graduação"],
};
const semAcento = s => String(s==null?"":s).toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g, "");
function limparWA(bruto, rotulo){
  let t = String(bruto==null?"":bruto).trim().replace(/^\s*\d{1,2}\s*[.)\]\-–—:]?\s*/, "");
  const i = t.lastIndexOf("—");                 // o separador da página é o travessão
  if (i >= 0) return t.slice(i+1).trim();
  const prim = semAcento(rotulo).replace(/\(/g," ").split(/\s+/)[0];
  if (prim && semAcento(t).startsWith(prim)){
    const m = t.match(/^[^:\-–]{0,70}[:\-–]\s*/);
    return m ? t.slice(m[0].length).trim() : "";
  }
  return t.trim();
}
function separarWA(texto){       // uma colada pode trazer vários atletas
  const blocos = []; let atual = null;
  for (const linha of String(texto||"").split("\n")){
    if (/^\s*1\s*[.)\]\-–—:]/.test(linha)){ atual = []; blocos.push(atual); }
    if (atual) atual.push(linha);
  }
  return blocos.filter(b=>b.length).map(b=>b.join("\n"));
}
function dataWA(s){
  const m = String(s||"").match(/(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})/);
  if (!m){ const t = String(s||"").trim(); return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : ""; }
  let [, d, mes, a] = m;
  if (a.length === 2) a = (parseInt(a,10) > 40 ? "19" : "20") + a;
  return `${a}-${String(+mes).padStart(2,"0")}-${String(+d).padStart(2,"0")}`;
}
function numeroWA(s){
  const m = String(s==null?"":s).trim().replace(",",".").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function variantesWA(opcao){
  /* "Ponteiro (Ponta)" é UMA posição com DOIS nomes de quadra, e o atleta
     escreve o que ele usa. Sem contar o que está entre parênteses como nome
     próprio, "ponta" não casava com nada — e era o mais provável de vir. */
  const base = semAcento(opcao).trim();
  const fora = [base, base.replace(/\(.*?\)/g, "").trim()];
  const dentro = base.match(/\(([^)]*)\)/);
  if (dentro) fora.push(dentro[1].trim());
  return fora.filter(Boolean);
}
function casarWA(valor, opcoes){       // "libero", "PONTEIRO", "ponta" caem certo
  const v = semAcento(valor).trim();
  if (!v) return null;
  for (const o of opcoes) if (variantesWA(o).indexOf(v) >= 0) return o;
  for (const o of opcoes)
    for (const s of variantesWA(o))
      if (s.startsWith(v) || v.startsWith(s.split(/\s+/)[0])) return o;
  for (const o of opcoes)
    for (const s of variantesWA(o))
      if (v.indexOf(s) >= 0 || s.indexOf(v) >= 0) return o;
  return null;
}
function lerWA(texto){
  const cru = {};
  for (const linha of String(texto||"").split("\n")){
    const m = linha.match(/^\s*(\d{1,2})\s*[.)\]\-–—:]/);
    if (!m) continue;
    const campo = CAMPOS_WA.find(c => c[0] === parseInt(m[1],10));
    if (campo && cru[campo[1]] === undefined) cru[campo[1]] = limparWA(linha, campo[2]);
  }
  const dados = {}, naoLidos = [];
  for (const [, chave, rotulo, tipo] of CAMPOS_WA){
    const v = (cru[chave] || "").trim();
    if (!v){ dados[chave] = (tipo === "num" || tipo === "int") ? null : ""; continue; }
    if (tipo === "num" || tipo === "int"){
      const x = numeroWA(v);
      dados[chave] = x === null ? null : (tipo === "int" ? Math.round(x) : x);
      if (x === null) naoLidos.push(`${rotulo} («${v}»)`);
    } else if (tipo === "data"){
      const x = dataWA(v); dados[chave] = x;
      if (!x) naoLidos.push(`${rotulo} («${v}»)`);
    } else if (tipo === "opc"){
      const x = casarWA(v, OPCOES[chave]); dados[chave] = x || "";
      if (!x) naoLidos.push(`${rotulo} («${v}»)`);
    } else dados[chave] = v;
  }
  const faltam = CAMPOS_WA.filter(([,ch,,,obr]) => obr && !String(dados[ch]==null?"":dados[ch]).trim())
    .map(c => c[2]);
  const vazio = !Object.keys(cru).some(k => String(cru[k]||"").trim());
  return {dados, faltam, naoLidos, vazio};
}
const lerVariasWA = texto =>
  (separarWA(texto).length ? separarWA(texto) : [texto]).map(lerWA).filter(r => !r.vazio);

/* ── Anamnese ───────────────────────────────────────────────────────────── */
/* O PAR-Q é uma triagem de PRONTIDÃO PARA ATIVIDADE FÍSICA, não um diagnóstico.
   A regra do próprio instrumento é dura e vale a pena respeitar: qualquer
   resposta "sim" significa liberação médica ANTES de carga. Um preparador que
   ignora isso está assumindo um risco que não é dele para assumir.
   Esta lista tem de ser idêntica à da área do atleta — há teste comparando. */
const PARQ = [
  "Algum médico já disse que você tem um problema no coração e que só deveria fazer atividade física sob supervisão médica?",
  "Você sente dor no peito quando faz atividade física?",
  "No último mês, você sentiu dor no peito quando NÃO estava fazendo atividade física?",
  "Você perde o equilíbrio por tontura ou já perdeu a consciência?",
  "Você tem algum problema ósseo ou articular que poderia piorar com a atividade física?",
  "Seu médico receita atualmente algum remédio para pressão ou para o coração?",
  "Você sabe de alguma outra razão pela qual não deveria fazer atividade física?",
];
const REGIOES = ["Ombro","Cotovelo","Punho ou mão","Lombar","Quadril","Coxa",
                 "Joelho","Perna","Tornozelo","Pé"];
const CONDICOES = ["Asma","Diabetes","Hipertensão","Problema cardíaco","Epilepsia",
                   "Tireoide","Anemia"];
const LADOS = ["Direito","Esquerdo","Os dois"];
const STATUS_LESAO = ["Recuperado","Em tratamento","Ainda limita"];
const EXP_LPO = ["Nenhuma","Iniciante","Intermediário","Avançado"];

/* A ordem É o protocolo da mensagem: o número na frente liga os dois lados. */
const CAMPOS_ANAMNESE = [].concat(
  PARQ.map((p, i) => [i+1, "parq" + (i+1), "PAR-Q " + (i+1), "sn"]),
  [[8,  "condicoes",   "Condições de saúde",             "lista"],
   [9,  "cirurgias",   "Cirurgias",                      "txt"],
   [10, "medicacao",   "Medicação contínua",             "txt"],
   [11, "alergias",    "Alergias",                       "txt"],
   [12, "lesoes",      "Lesões anteriores",              "lesoes"],
   [13, "dor_recor",   "Regiões que costumam doer",      "lista"],
   [14, "sono_hab",    "Horas de sono habitual",         "num"],
   [15, "fuma",        "Fuma",                           "sn"],
   [16, "alcool",      "Álcool",                         "txt"],
   [17, "anos_muscu",  "Anos de musculação",             "int"],
   [18, "exp_lpo",     "Experiência com levantamento olímpico", "opc"]]
);
const OPC_ANAMNESE = {exp_lpo: EXP_LPO};

function lerAnamnese(corpo){
  const cab = cabecalhoWA(corpo), n = numeradasWA(corpo);
  const dados = {}, naoLidos = [];
  for (const [i, chave, rot, tipo] of CAMPOS_ANAMNESE){
    const v = (n[i] || "").trim();
    if (!v){ dados[chave] = tipo === "lista" || tipo === "lesoes" ? [] : (tipo === "num" || tipo === "int" ? null : ""); continue; }
    if (tipo === "sn"){
      const s = semAcento(v);
      dados[chave] = /^s(im)?$/.test(s) ? true : /^n(ao)?$/.test(s) ? false : null;
      if (dados[chave] === null) naoLidos.push(`${rot} («${v}»)`);
    } else if (tipo === "num" || tipo === "int"){
      const x = numeroWA(v);
      dados[chave] = x === null ? null : (tipo === "int" ? Math.round(x) : x);
      if (x === null) naoLidos.push(`${rot} («${v}»)`);
    } else if (tipo === "lista"){
      dados[chave] = /^(nenhum|nenhuma|nao|não|-)$/i.test(v.trim()) ? []
        : v.split(";").map(s => s.trim()).filter(Boolean);
    } else if (tipo === "lesoes"){
      /* "Ombro|Direito|2024|30|Recuperado ; Tornozelo|Esquerdo|2023|10|Recuperado" */
      dados[chave] = /^(nenhuma|nenhum|nao|não|-)$/i.test(v.trim()) ? []
        : v.split(";").map(p => {
            const c = p.split("|").map(x => x.trim());
            if (c.length < 2) return null;
            return {regiao:c[0], lado:c[1] || "", ano:c[2] || "",
                    dias: c[3] ? Math.round(numeroWA(c[3]) || 0) : null,
                    status: c[4] || ""};
          }).filter(Boolean);
    } else if (tipo === "opc"){
      const x = casarWA(v, OPC_ANAMNESE[chave]);
      dados[chave] = x || "";
      if (!x) naoLidos.push(`${rot} («${v}»)`);
    } else dados[chave] = v;
  }
  const faltam = PARQ.map((_, i) => "parq" + (i+1))
    .filter(k => dados[k] === null || dados[k] === undefined).length
    ? ["as 7 perguntas do PAR-Q"] : [];
  return {tipo:"anamnese", corpo, quem:cab.quem, data:cab.data, dados, faltam,
          naoLidos, vazio: !Object.keys(n).length};
}

function bandeirasAnamnese(a){
  /* O que muda a conduta de hoje. Nada aqui é diagnóstico: é sinalização para
     o preparador perguntar antes de carregar. */
  if (!a) return [];
  const fora = [];
  const sins = PARQ.map((_, i) => a["parq" + (i+1)] === true);
  if (sins.some(Boolean))
    fora.push([`PAR-Q com ${sins.filter(Boolean).length} resposta(s) "sim" — `
      + `precisa de liberação médica antes de carga`, "crit"]);
  const ano = new Date().getFullYear();
  for (const l of (a.lesoes || [])){
    const recente = l.ano && (ano - parseInt(l.ano, 10)) <= 1;
    if (l.status === "Ainda limita")
      fora.push([`Lesão que ainda limita: ${l.regiao} ${l.lado || ""}`.trim(), "crit"]);
    else if (l.status === "Em tratamento")
      fora.push([`Em tratamento: ${l.regiao} ${l.lado || ""}`.trim(), "warn"]);
    else if (recente)
      fora.push([`Lesão no último ano: ${l.regiao} ${l.lado || ""} (${l.ano})`.trim(), "warn"]);
  }
  if ((a.dor_recor || []).length)
    fora.push([`Dor recorrente: ${(a.dor_recor || []).join(", ")}`, "warn"]);
  if (a.condicoes && a.condicoes.length)
    fora.push([`Condição declarada: ${a.condicoes.join(", ")}`, "warn"]);
  if (a.medicacao && !/^(nenhum|nenhuma|nao|não|-)$/i.test(a.medicacao.trim()))
    fora.push([`Medicação contínua: ${a.medicacao}`, "warn"]);
  return fora;
}

/* ── As mensagens que a área do atleta produz ───────────────────────────── */
/* Cadastro, check-in, humor e fim de sessão. Todas numeradas pelo mesmo motivo:
   legíveis para quem recebe no WhatsApp E automáticas para importar aqui. O
   cabeçalho diz o TIPO e DE QUEM, que é o que permite colar a semana inteira do
   elenco de uma vez. */
const TIPOS_WA = [
  {chave:"cadastro", rot:"Cadastro",       re:/cadastro/i},
  {chave:"anamnese", rot:"Anamnese",       re:/anamnese/i},
  {chave:"checkin",  rot:"Check-in",       re:/check\s*-?\s*in/i},
  {chave:"humor",    rot:"Humor (BRUMS)",  re:/humor|brums/i},
  {chave:"sessao",   rot:"Fim de sessão",  re:/fim\s+de\s+sess/i},
];
const CABECALHO_WA = /^\s*🏐\s*(.+?)\s+ELASE\b/i;

function separarMensagens(texto){
  /* Cada linha de cabeçalho começa uma mensagem nova. Sem nenhum cabeçalho,
     trata tudo como cadastro — é o caso de quem copiou só as linhas. */
  const linhas = String(texto || "").split("\n");
  const blocos = [];
  let atual = null;
  for (const linha of linhas){
    const m = linha.match(CABECALHO_WA);
    if (m){
      const achado = TIPOS_WA.find(t => t.re.test(m[1]));
      atual = {tipo: achado ? achado.chave : "cadastro", linhas: []};
      blocos.push(atual);
    }
    if (atual) atual.linhas.push(linha);
  }
  if (!blocos.length)
    return separarWA(texto).map(c => ({tipo:"cadastro", corpo:c}));
  return blocos.map(b => ({tipo:b.tipo, corpo:b.linhas.join("\n")}));
}
function cabecalhoWA(corpo){
  /* A segunda linha é "Apelido · dd/mm/aaaa". Sem ela, fica sem dono e sem data
     — e aí a tela pergunta, em vez de adivinhar. */
  const linhas = String(corpo || "").split("\n");
  for (const l of linhas.slice(1, 4)){
    const m = l.match(/^\s*(.*?)\s*·\s*(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})\s*$/);
    if (m) return {quem: m[1].trim(), data: dataWA(m[2])};
  }
  return {quem:"", data:""};
}
function numeradasWA(corpo){
  const fora = {};
  for (const linha of String(corpo || "").split("\n")){
    const m = linha.match(/^\s*(\d{1,2})\s*[.)\]\-–—:]/);
    if (!m) continue;
    const n = parseInt(m[1], 10);
    if (fora[n] === undefined) fora[n] = limparWA(linha, "");
  }
  return fora;
}
function lerMensagemWA(bloco){
  const {tipo, corpo} = bloco;
  if (tipo === "cadastro"){
    const r = lerWA(corpo);
    return Object.assign({tipo, corpo}, r, {quem: r.dados.apelido || r.dados.nome, data: ""});
  }
  if (tipo === "anamnese") return lerAnamnese(corpo);
  const cab = cabecalhoWA(corpo), n = numeradasWA(corpo);
  const naoLidos = [];
  const inteiro = (i, rot, min, max) => {
    const v = (n[i] || "").trim();
    if (!v) return null;
    const x = numeroWA(v);
    if (x === null || x < min || x > max){ naoLidos.push(`${rot} («${v}»)`); return null; }
    return Math.round(x);
  };
  if (tipo === "checkin"){
    const dados = {
      sq: inteiro(1, "Sono", 1, 5),
      sh: n[2] ? numeroWA(n[2]) : null,
      dor: inteiro(3, "Dor", 0, 10),
      es: inteiro(4, "Estresse", 0, 10),
      kss: inteiro(5, "Sonolência", 1, 9),
    };
    const faltam = [];
    if (dados.sq === null) faltam.push("Sono");
    if (dados.dor === null) faltam.push("Dor");
    if (dados.kss === null) faltam.push("Sonolência");
    return {tipo, corpo, quem:cab.quem, data:cab.data, dados, faltam, naoLidos,
            vazio: !Object.keys(n).length};
  }
  if (tipo === "humor"){
    const vals = BRUMS_LISTA.map((_, i) => inteiro(i+1, BRUMS_LISTA[i][0], 0, 4));
    const faltam = vals.filter(v => v === null).length
      ? [`${vals.filter(v => v === null).length} dos 24 itens`] : [];
    return {tipo, corpo, quem:cab.quem, data:cab.data, dados:{vals}, faltam, naoLidos,
            vazio: !Object.keys(n).length};
  }
  const dur = inteiro(1, "Duração", 1, DUR_MAX);
  const pseTxt = (n[2] || "").trim();
  const pse = pseTxt ? numeroWA(pseTxt) : null;
  if (pseTxt && (pse === null || pse < 0 || pse > 10)) naoLidos.push(`PSE («${pseTxt}»)`);
  const faltam = [];
  if (dur === null) faltam.push("Duração");
  if (pse === null || pse < 0 || pse > 10) faltam.push("PSE");
  return {tipo, corpo, quem:cab.quem, data:cab.data,
          dados:{dur, pse, tipoSessao:(n[3] || "").trim()}, faltam, naoLidos,
          vazio: !Object.keys(n).length};
}
function acharAtleta(quem){
  /* Casa pelo apelido ou pelo primeiro nome, sem acento. Duas pessoas com o
     mesmo primeiro nome devolvem nada, e a tela pergunta — dois atletas com
     dados trocados é pior que um clique a mais. */
  const q = semAcento(quem).trim();
  if (!q) return null;
  const lista = ativos();
  const casa = a => [a.apelido, a.nome, String(a.nome || "").split(/\s+/)[0]]
    .filter(Boolean).map(semAcento).indexOf(q) >= 0;
  const achados = lista.filter(casa);
  return achados.length === 1 ? achados[0] : null;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Armazenamento
   ───────────────────────────────────────────────────────────────────────────
   Dois modos, e a tela diz qual está valendo:
   · EQUIPE  — a capability `db`. Todo mundo que abre o app vê o mesmo banco,
               ao vivo. É o modo normal.
   · NESTE APARELHO — sem `db`. Tudo fica no navegador de quem abriu, e não
               chega a mais ninguém. Serve para experimentar sem estragar nada.
   ═══════════════════════════════════════════════════════════════════════════ */
const COLS = ["config","atletas","anamnese","prescricoes","sessoes","diario",
              "testes","biblioteca"];
const Store = {
  db: null, modo: "local", podeGravar: true, pronto: false,
  cache: {}, subs: [],
  _chaveLocal: "elase_v1",

  iniciarCache(){ COLS.forEach(c => this.cache[c] = this.cache[c] || {}); },

  lerLocal(){
    try {
      const cru = localStorage.getItem(this._chaveLocal);
      if (cru) Object.assign(this.cache, JSON.parse(cru));
    } catch (e) { /* aba anônima, armazenamento bloqueado: segue vazio */ }
    this.iniciarCache();
  },
  gravarLocal(){
    try { localStorage.setItem(this._chaveLocal, JSON.stringify(this.cache)); }
    catch (e) { /* sem espaço ou bloqueado: o app continua funcionando na memória */ }
  },

  all(col){ return Object.values(this.cache[col] || {}); },
  get(col, id){ return (this.cache[col] || {})[id] || null; },

  async set(col, id, obj){
    const corpo = Object.assign({}, obj);
    this.cache[col] = this.cache[col] || {};
    this.cache[col][id] = Object.assign({}, corpo, {id});
    if (this.db){
      try { await this.db.doc(col + "/" + id).set(corpo); }
      catch (e){ this.tratarErro(e); throw e; }
    } else this.gravarLocal();
    return this.cache[col][id];
  },
  async remover(col, id){
    delete (this.cache[col] || {})[id];
    if (this.db){
      try { await this.db.doc(col + "/" + id).delete(); }
      catch (e){ this.tratarErro(e); throw e; }
    } else this.gravarLocal();
  },
  tratarErro(e){
    const c = e && e.code;
    if (c === "invalid_argument"){
      /* Escrita bem-formada recusada = este visitante é leitor. Vira somente
         leitura pelo resto da visita, em vez de repetir o erro a cada toque. */
      this.podeGravar = false;
      pintarModo();
      avisarGlobal("Este link abriu em modo leitura: o que você digitar não é gravado para a equipe.");
    } else if (c === "quota_exceeded"){
      avisarGlobal("O banco do app está cheio. Apague sessões antigas na aba Prescrição.");
    } else if (c === "revoked"){
      this.db = null; this.modo = "local"; pintarModo();
      avisarGlobal("O acesso ao banco foi encerrado durante o uso. Recarregue a página.");
    }
  },

  async ligar(){
    let db = null, user = null;
    try { db = await claude.use("db"); } catch (e) { db = null; }
    try { user = await claude.use("user"); } catch (e) { user = null; }
    if (!db){ this.pronto = true; return; }
    this.db = db; this.modo = "equipe";
    if (user){
      const pode = await user.can("data.write").catch(()=>null);
      /* null = a plataforma não disse nada. Mantém os campos e deixa a primeira
         recusa decidir — nunca desabilitar por suposição. */
      if (pode === false) this.podeGravar = false;
    }
    /* UMA assinatura por coleção, no arranque. Nunca dentro de render. */
    for (const col of COLS){
      const un = db.collection(col).onSnapshot(snap => {
        const novo = {};
        snap.docs.forEach(d => { if (d.exists) novo[d.id] = Object.assign({}, d.data(), {id:d.id}); });
        this.cache[col] = novo;
        if (this.pronto) render();
      }, e => this.tratarErro(e));
      this.subs.push(un);
    }
    this.pronto = true;
  },
};

/* Um documento por dia para a equipe (id = a data) e, quando existir, um por
   atleta naquele dia (id = "data__atleta"). O individual GANHA do de equipe:
   é para isso que ele existe — o atleta com ombro em recuperação não pode
   receber o mesmo treino dos outros só porque o sistema não sabia separar. */
const idPresc = (data, atletaId) => atletaId ? data + "__" + atletaId : data;
const prescEquipe = d => Store.get("prescricoes", d);
function prescDoDia(data, atletaId){
  if (atletaId){
    const ind = Store.get("prescricoes", idPresc(data, atletaId));
    if (ind) return ind;
  }
  return prescEquipe(data);
}
const ehIndividual = p => !!(p && p.atleta_id);

function diarioDe(id){
  const d = Store.get("diario", id) || {};
  return {w: d.w || {}, b: d.b || {}};
}
function sessoesDe(id){
  /* Um documento por atleta e ANO: 12 documentos por temporada em vez de dois
     mil. O teto do banco é 5 000 documentos, e uma sessão por linha o estouraria
     em pouco mais de duas temporadas. */
  const fora = [];
  for (const doc of Store.all("sessoes")){
    if (doc.atleta !== id) continue;
    for (const data of Object.keys(doc.s || {}))
      fora.push(Object.assign({data}, doc.s[data]));
  }
  return fora.sort((a,b)=>a.data<b.data?-1:1);
}
const sessaoDe = (id, data) => sessoesDe(id).find(s => s.data === data) || null;
async function gravarSessao(id, data, dados){
  const ano = data.slice(0,4), docId = id + "_" + ano;
  const doc = Store.get("sessoes", docId) || {atleta:id, ano, s:{}};
  const s = Object.assign({}, doc.s || {});
  s[data] = Object.assign({}, s[data] || {}, dados);
  await Store.set("sessoes", docId, {atleta:id, ano, s});
}
async function gravarDiario(id, ramo, chave, valor){
  const d = diarioDe(id), copia = {w:Object.assign({},d.w), b:Object.assign({},d.b)};
  copia[ramo][chave] = valor;
  await Store.set("diario", id, copia);
}
const testesDe = id => ((Store.get("testes", id) || {}).lista || [])
  .slice().sort((a,b)=>a.data<b.data?1:-1);
function melhor1RM(id, exercicio){
  const l = testesDe(id).filter(t => t.tipo === "1RM" && t.exercicio === exercicio);
  return l.length ? l[0].valor : null;        // o MAIS RECENTE, não o maior
}
const bibl = () => (Store.get("biblioteca","lib") || {}).itens || {};
function infoEx(nome){
  const base = EXERCICIOS.find(e => e[0] === nome);

}

/* ── Gráfico: carga diária dos 7 dias ───────────────────────────────────── */
function barrasCarga(diarias, datas){
  /* Uma série só: o título já diz o que é, então não leva legenda. Rótulo
     direto apenas no maior valor — número em cima de toda barra vira ruído. */
  const L = 32, R = 8, T = 16, B = 26, A = 108, W = 320;
  const max = Math.max(...diarias, 1);
  const larg = (W - L - R) / 7, barra = larg - 2;   // 2px de respiro entre barras
  const iMax = diarias.indexOf(max);
  const barras = diarias.map((v, i) => {
    const h = Math.max(v > 0 ? 3 : 0, (v/max) * (A - T - B));
    const x = L + i*larg + 1, y = A - B - h;
    const cor = v > 0 ? "var(--blue)" : "transparent";
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barra.toFixed(1)}"
      height="${h.toFixed(1)}" rx="4" fill="${cor}"><title>${dataBR(datas[i])}: ${num(v)} UA</title></rect>`;
  }).join("");
  const rotulos = datas.map((d, i) =>
    `<text class="eixo" x="${(L + i*larg + larg/2).toFixed(1)}" y="${A-9}"
      text-anchor="middle">${DIA_SEM[dObj(d).getDay()].slice(0,3).toUpperCase()}</text>`).join("");
  const destaque = max > 0
    ? `<text class="valor" x="${(L + iMax*larg + larg/2).toFixed(1)}"
        y="${(A - B - Math.max(3,(A-T-B)) - 4).toFixed(1)}" text-anchor="middle">${num(max)}</text>` : "";
  return `<figure>
    <figcaption>Carga diária dos últimos 7 dias, em unidades arbitrárias (minutos × PSE)</figcaption>
    <svg viewBox="0 0 ${W} ${A}" width="100%" height="${A}" role="img"
      aria-label="Carga diária dos últimos sete dias">
      <line class="grade-linha" x1="${L}" y1="${A-B}" x2="${W-R}" y2="${A-B}"/>
      ${barras}${rotulos}${destaque}
      <text class="eixo" x="0" y="${T}">UA</text>
    </svg></figure>`;
}

/* ── Gráfico: evolução de uma medida ────────────────────────────────────── */
function linhaEvolucao(pontos, unidade, descricao){
  /* Eixo x em TEMPO, não em ordem: dois retestes numa semana e um seis meses
     depois não podem sair igualmente espaçados — isso faria uma estagnação
     parecer progresso constante. Uma série só, então sem legenda; rótulo direto
     no primeiro e no último ponto, que são os que a pessoa lê. */
  if (pontos.length < 2)
    return `<div class="nota">Uma medida só não é evolução. Lance o próximo
      reteste e a curva aparece.</div>`;
  const W = 320, A = 150, L = 8, R = 34, T = 22, B = 28;
  const vals = pontos.map(p => p.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || Math.max(1, Math.abs(max) * 0.1);
  const lo = min - span * 0.2, hi = max + span * 0.2;
  const t0 = pontos[0].data, tn = pontos[pontos.length-1].data;
  const total = Math.max(1, diffDias(tn, t0));
  const px = p => L + (W - L - R) * (diffDias(p.data, t0) / total);
  const py = v => (A - B) - (A - B - T) * ((v - lo) / (hi - lo));
  const caminho = pontos.map((p, i) => (i ? "L" : "M") + px(p).toFixed(1) + " " + py(p.valor).toFixed(1)).join(" ");
  const marcas = pontos.map(p =>
    `<circle cx="${px(p).toFixed(1)}" cy="${py(p.valor).toFixed(1)}" r="4.5"
      fill="var(--blue)" stroke="var(--card)" stroke-width="2">
      <title>${dataBR(p.data)}: ${num(p.valor,1)} ${esc(unidade)}</title></circle>`).join("");
  const ult = pontos[pontos.length-1], prim = pontos[0];
  const delta = ult.valor - prim.valor;
  const rotulo = (p, anc) =>
    `<text class="valor" x="${Math.min(W-2, Math.max(2, px(p) + (anc === "end" ? -7 : 7))).toFixed(1)}"
      y="${Math.max(11, py(p.valor) - 9).toFixed(1)}" text-anchor="${anc}">${num(p.valor,1)}</text>`;
  return `<figure>
    <figcaption>${esc(descricao)} — de ${dataBR(prim.data)} a ${dataBR(ult.data)},
      ${delta >= 0 ? "+" : "−"}${num(Math.abs(delta),1)} ${esc(unidade)}</figcaption>
    <svg viewBox="0 0 ${W} ${A}" width="100%" height="${A}" role="img"
      aria-label="${esc(descricao)} ao longo do tempo">
      <line class="grade-linha" x1="${L}" y1="${A-B}" x2="${W-R}" y2="${A-B}"/>
      <path d="${caminho}" fill="none" stroke="var(--blue)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${marcas}${rotulo(prim,"start")}${rotulo(ult,"end")}
      <text class="eixo" x="${L}" y="${A-9}">${dataBR(prim.data)}</text>
      <text class="eixo" x="${W-R}" y="${A-9}" text-anchor="end">${dataBR(ult.data)}</text>
      <text class="eixo" x="${W-R+4}" y="${T}">${esc(unidade)}</text>
    </svg></figure>`;
}

/* ── Gráfico: desvio do humor ───────────────────────────────────────────── */
function faixaZ(linhas){
  /* Divergente de propósito: o zero tem significado (a própria média do atleta),
     e o sinal separa "pior que o normal dele" de "melhor". Dois tons e um
     cinza neutro no meio — nunca um arco-íris. */
  const com = linhas.filter(l => l.z !== null);
  if (!com.length) return "";
  const W = 320, LH = 22, L = 74, R = 14, A = com.length*LH + 30;
  const meio = L + (W - L - R)/2, escala = (W - L - R)/2 / 3;   // ±3 desvios
  const corpo = com.map((l, i) => {
    const y = 22 + i*LH, z = Math.max(-3, Math.min(3, l.ruim));
    const larg = Math.abs(z)*escala, x = z >= 0 ? meio : meio - larg;
    const cor = z >= 0 ? "var(--quente)" : "var(--blue)";
    return `<text class="eixo" x="0" y="${y+11}">${esc(l.subescala)}</text>
      <rect x="${x.toFixed(1)}" y="${y+3}" width="${Math.max(larg,2).toFixed(1)}" height="13"
        rx="4" fill="${cor}"><title>${esc(l.subescala)}: ${l.z.toFixed(2)} desvios (n=${l.n})</title></rect>
      <text class="valor" x="${W-R+2}" y="${y+14}" text-anchor="end">${l.z.toFixed(1)}</text>`;
  }).join("");
  return `<figure>
    <figcaption>Desvio de hoje em relação à base do próprio atleta. À direita é
    pior que o normal dele; no Vigor o sinal já está invertido.</figcaption>
    <svg viewBox="0 0 ${W} ${A}" width="100%" height="${A}" role="img"
      aria-label="Desvio do humor em relação à base do atleta">
      <line x1="${meio}" y1="14" x2="${meio}" y2="${A-8}" stroke="var(--neutro)" stroke-width="2"/>
      <text class="eixo" x="${meio}" y="10" text-anchor="middle">MÉDIA DELE</text>
      ${corpo}</svg></figure>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Abas
   ═══════════════════════════════════════════════════════════════════════════ */
function telaInicio(){
  const c = cfg(), lista = ativos(), hoje = hojeISO();
  const p = prescDoDia(hoje);
  const sem = semanaDe(hoje, c.macro_inicio), bl = blocos();
  const pos = posicaoNoCiclo(sem, bl.length), b = bl[pos-1];
  const plano = p ? planoSessao(p.exercicios || [], p.tipo, p.dur_prev) : null;

  const painel = lista.map(a => {
    const pr = prontidao(sessoesDe(a.id), diarioDe(a.id), hoje);
    const [rot, cor] = NIVEIS[pr.nivel];
    const feita = sessaoDe(a.id, hoje);
    return {a, pr, rot, cor, feita};
  }).sort((x,y) => (y.pr.nivel - x.pr.nivel) || ((x.pr.valor||101) - (y.pr.valor||101)));

  const alertas = painel.filter(x => x.pr.nivel > 0);

  return `<div class="cabeca">
      <h2>${esc(c.equipe)}</h2>
      <p>${dataBR(hoje)}, ${diaSemana(hoje)} · semana ${sem} da temporada ·
      ciclo ${cicloDe(sem, bl.length)}, posição ${pos} de ${bl.length} ·
      ${esc(b.bloco)} / ${esc(b.micro)}</p>
    </div>

    ${p ? `<div class="cartao">
      <h3>Sessão de hoje</h3>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:baseline">
        <div><div class="rotulo">Tipo</div><b style="font-size:17px">${esc(p.tipo)}</b></div>
        <div><div class="rotulo">Objetivo</div><b style="font-size:17px">${esc(p.objetivo||"—")}</b></div>
        <div><div class="rotulo">Previsto</div><b style="font-size:17px">${plano.dur} min</b></div>
        <div><div class="rotulo">Séries</div><b style="font-size:17px">${plano.series}</b></div>
        ${plano.contatos ? `<div><div class="rotulo">Contatos</div><b style="font-size:17px">${plano.contatos}</b></div>` : ""}
      </div>
      <p style="color:var(--ink-3);font-size:13px;margin:11px 0 0">${esc(p.notas||"")}</p>
      <button class="bt larga" data-ir="sessao" style="margin-top:12px">Abrir a sessão</button>
    </div>` : `<div class="nota">Não há sessão prescrita para hoje.
      ${UI.liberado ? "Gere as semanas na aba <b>Sistema</b>." : "Fale com a comissão."}</div>`}

    ${(() => {
      /* Saúde declarada é uma condição PERMANENTE, não o estado de hoje: fica
         num cartão próprio, acima da prontidão, porque muda o que pode ser
         prescrito e não o quanto. Some quando não há nada. */
      const saude = lista.map(a => ({a, band: bandeirasAnamnese(anamneseDe(a.id))}))
        .filter(x => x.band.some(b => b[1] === "crit"));
      const semAnamnese = lista.filter(a => !anamneseDe(a.id));
      if (!saude.length && !semAnamnese.length) return "";
      return `<div class="cartao"><h3>Saúde declarada</h3>
        ${saude.map(x => `<div class="nota crit"><b>${esc(x.a.apelido||x.a.nome)}</b> —
          ${x.band.filter(b => b[1]==="crit").map(b => esc(b[0])).join(" · ")}</div>`).join("")}
        ${semAnamnese.length ? `<div class="nota aten"><b>Sem anamnese:</b>
          ${semAnamnese.map(a => esc(a.apelido||a.nome)).join(", ")}.
          Prescrever carga sem saber o histórico é assumir um risco que dá para não correr.</div>` : ""}
      </div>`;
    })()}

    ${alertas.length ? `<div class="cartao">

function listaExercicios(exs, s, a, soLeitura){
  const feitas = (s && s.series) || {};
  return exs.map((e, i) => {
    const info = infoEx(e.nome);
    const prep = SEM_CARGA.indexOf(e.grupo) >= 0;
    const rm = e.ref1rm ? melhor1RM(a.id, e.ref1rm) : null;
    const alvo = (rm && e.pct_rm) ? Math.round(rm * e.pct_rm / 2.5) * 2.5 : null;
    const pres = [
      `${e.series} × ${esc(e.reps)}`,
      e.pct_rm ? `${Math.round(e.pct_rm*100)}%` : "",
      alvo ? `≈ ${num(alvo,1)} kg` : (e.pct_rm && !rm ? "sem 1RM lançado" : ""),
      e.rir !== null && e.rir !== undefined ? `RIR ${e.rir}` : "",
      e.tempo ? `tempo ${esc(e.tempo)}` : "",
      e.vel ? `${esc(e.vel)} m/s` : "",
      `pausa ${e.pausa}s`,
    ].filter(Boolean).join(" · ");

    /* Os campos extras aparecem só onde a prescrição pede. O jump squat manda
       "acima de 1,0 m/s" e o acessório manda RIR 2 — sem um lugar para anotar,
       o sistema pedia um dado e jogava fora. Mostrar os dois em todo exercício
       encheria a tela de caixa vazia; mostrar onde foi prescrito faz a tela
       perguntar exatamente o que ela cobrou. */
    const extras = [];
    if (e.vel) extras.push(["vel", "m/s", "decimal"]);
    if (e.rir !== null && e.rir !== undefined) extras.push(["rir", "RIR", "decimal"]);

    let linhas = "";
    if (!soLeitura){
      linhas = `<div class="series">` + Array.from({length: e.series}, (_, k) => {
        const ch = i + "_" + (k+1), f = feitas[ch] || {};
        return `<div class="serie">
          <span class="n">${k+1}</span>
          ${prep ? `<span style="grid-column:2/4;font-size:12.5px;color:var(--ink-4)">${esc(e.reps)}</span>`
                 : `<input inputmode="decimal" placeholder="kg" data-serie="${ch}" data-campo="carga" value="${f.carga!==undefined&&f.carga!==null?f.carga:(alvo||"")}">
                    <input inputmode="numeric" placeholder="reps" data-serie="${ch}" data-campo="reps" value="${f.reps!==undefined&&f.reps!==null?f.reps:""}">`}
          <button type="button" class="tick" data-tick="${ch}"
            aria-pressed="${f.feita?"true":"false"}" aria-label="marcar série ${k+1} como feita">✓</button>
        </div>
        ${(!prep && extras.length) ? `<div class="serie extra">
          <span class="n"></span>
          ${extras.map(([campo, rot, modo]) =>
            `<input inputmode="${modo}" placeholder="${esc(rot)}" data-serie="${ch}"
              data-campo="${campo}" value="${f[campo]!==undefined&&f[campo]!==null?f[campo]:""}">`).join("")}
          ${extras.length === 1 ? "<span></span>" : ""}<span></span>
        </div>` : ""}`;
      }).join("") + `</div>`;
    }

    return `<div class="ex ${prep?"prep":""}">
      <div class="tit"><b>${esc(e.nome)}</b>
        <span class="selo">${esc(e.grupo)}</span></div>
      <div class="pres">${pres}</div>
      ${e.obs ? `<div class="obs">${esc(e.obs)}</div>` : ""}
      ${info.dica ? `<div class="dica">${esc(info.dica)}</div>` : ""}
      <div style="margin-top:9px">
        ${info.proprio
          ? `<video class="videoEx" controls preload="none" playsinline
               src="${esc(info.video)}"></video>`
          : `<a class="bt alt mini" href="${esc(info.video || buscaVideo(e.nome))}"
               target="_blank" rel="noopener">${info.video ? "▶ Vídeo do clube" : "▶ Ver o movimento"}</a>`}
      </div>
      ${linhas}
    </div>`;
  }).join("");
}

/* ── Desempenho ─────────────────────────────────────────────────────────── */
function serieTeste(id, tipo, exercicio){
  return testesDe(id).filter(t => t.tipo === tipo && t.exercicio === exercicio)
    .map(t => ({data:t.data, valor:t.valor}))
    .sort((a,b) => a.data < b.data ? -1 : 1);
}
function posicaoNoElenco(valores, meu){
  /* Comparação INTERNA, com o próprio elenco. Não publico tabela normativa de
     salto ou de força para voleibol: os valores variam demais por nível, sexo,
     idade e função, e um número inventado com cara de norma é pior que nenhum.
     Aqui o que se diz é "onde ele está entre os seus", que é verdade. */
  const v = valores.filter(x => x !== null && x !== undefined).sort((a,b)=>a-b);
  if (v.length < 3 || meu === null || meu === undefined) return null;
  const abaixo = v.filter(x => x < meu).length;
  return {pos: v.length - abaixo, de: v.length,
          pct: Math.round(100 * abaixo / (v.length - 1 || 1)),
          mediana: v[Math.floor(v.length/2)]};
}
function telaDesempenho(){
  const a = meuAtleta();
  if (!a) return `<div class="cabeca"><h2>Desempenho</h2></div>
    <div class="vazio">Nenhum atleta cadastrado ainda.</div>`;
  const lista = ativos();
  const escolhido = UI.exDesemp || "Agachamento";
  const refs = ["Agachamento","Agachamento frontal","Supino","Stiff com barra",
                "Remada serrote","Arranco","Clean","Clean pull"];

  /* Força relativa: quilos por quilo de corpo. É o número que compara um central
     de 201 cm com um líbero de 178 — o absoluto não compara. */
  const linhas = refs.map(r => {
    const rm = melhor1RM(a.id, r);
    const rel = (rm && a.massa) ? rm / a.massa : null;
    const todos = lista.map(x => {
      const m = melhor1RM(x.id, r);
      return (m && x.massa) ? m / x.massa : null;
    });
    return {ref:r, rm, rel, rank: posicaoNoElenco(todos, rel)};
  }).filter(x => x.rm !== null);

  const ag = melhor1RM(a.id, "Agachamento"), sup = melhor1RM(a.id, "Supino");
  const cmj = serieTeste(a.id, "Salto", "CMJ");
  const evol = serieTeste(a.id, "1RM", escolhido);

  const rankSalto = (() => {
    const meu = cmj.length ? cmj[cmj.length-1].valor : null;
    const todos = lista.map(x => {
      const s = serieTeste(x.id, "Salto", "CMJ");
      return s.length ? s[s.length-1].valor : null;
    });
    return posicaoNoElenco(todos, meu);
  })();

  return `<div class="cabeca"><h2>Desempenho · ${esc(a.apelido||a.nome)}</h2>

function telaSistema(){
  const c = cfg(), bl = blocos(), hoje = hojeISO();
  const semAtual = Math.max(1, semanaDe(hoje, c.macro_inicio));
  const ocupadas = prescricoes().map(p => p.data);
  const de = UI.sisDe || semAtual, ate = UI.sisAte || (semAtual + 7);
  const previa = gerarSistema(bl, c.macro_inicio, de, ate, ocupadas);

  const porSemana = {};
  for (const s of previa.sessoes){
    const sem = semanaDe(s.data, c.macro_inicio);
    const p = planoSessao(s.exercicios, s.tipo, s.dur_prev);
    const r = porSemana[sem] || (porSemana[sem] = {sem, ua:0, contatos:0, min:0, n:0});
    r.ua += p.ua; r.contatos += p.contatos; r.min += p.dur; r.n++;
  }
  const semanas = Object.keys(porSemana).map(Number).sort((a,b)=>a-b).map(s => {
    const r = porSemana[s], pos = posicaoNoCiclo(s, bl.length);
    return Object.assign(r, {pos, ciclo:cicloDe(s, bl.length), bloco:bl[pos-1],
      alvo: bl[pos-1].plio, reteste: eSemanaReteste(s, bl.length)});
  });

  return `<div class="cabeca"><h2>Sistema de treinamento</h2>
      <p>Os ${bl.length} blocos são um macrociclo, não a temporada: eles voltam
      ao começo sem teto. O que faz o ciclo seguinte valer mais não é mudar o
      percentual — é o 1RM ter subido, e por isso a última sessão de cada
      Realização é um reteste.</p></div>

    <div class="cartao"><h3>Gerar</h3>
      <div class="dupla">
        <label for="sisDe"><span>Da semana</span>
          <input id="sisDe" inputmode="numeric" value="${de}"></label>
        <label for="sisAte"><span>Até a semana</span>
          <input id="sisAte" inputmode="numeric" value="${ate}"></label>
      </div>
      <p style="color:var(--ink-3);font-size:13px;margin:0 0 12px">
        Início do macrociclo: <b>${dataBR(c.macro_inicio)}</b> ·
        hoje é a semana <b>${semAtual}</b>.
        ${previa.pulados.length ? `<br><b>${previa.pulados.length} dia(s) já prescrito(s)</b>
          serão pulados, nunca sobrescritos.` : ""}</p>
      <button class="bt larga" id="btGerar">Gerar ${previa.sessoes.length} sessões</button>
      <p class="aviso" id="avGerar" hidden></p>
    </div>

    <div class="cartao"><h3>O que isso custa, semana a semana</h3>
      <div class="rolagem"><table>
        <thead><tr><th>Sem</th><th>Bloco</th><th class="num">Sessões</th>
          <th class="num">Minutos</th><th class="num">UA</th>
          <th class="num">Contatos</th><th class="num">Alvo</th></tr></thead>
        <tbody>${semanas.map(s => {
          const erro = s.alvo ? Math.abs(s.contatos - s.alvo) / s.alvo : 0;
          return `<tr>
            <td>${s.sem}${s.reteste?' <span class="selo warn">reteste</span>':""}</td>
            <td>${esc(s.bloco.bloco)}<br><span style="color:var(--ink-4);font-size:11.5px">${esc(s.bloco.micro)}</span></td>
            <td class="num">${s.n}</td><td class="num">${s.min}</td><td class="num">${num(s.ua)}</td>
            <td class="num" style="color:${erro>.15?"var(--warn-i)":"var(--ink)"}">${s.contatos}</td>
            <td class="num" style="color:var(--ink-4)">${s.alvo}</td></tr>`;
        }).join("")}</tbody></table></div>
      <p style="color:var(--ink-4);font-size:12px;margin:9px 0 0">Contatos
      pliométricos contra o alvo do bloco. O total da semana é repartido entre os
      exercícios, não entre as sessões — repartir por sessão e pôr dois exercícios
      pliométricos dentro dela estoura o alvo.</p>
    </div>

    <div class="cartao"><h3>Os blocos</h3>
      <div class="rolagem"><table>
        <thead><tr><th>#</th><th>Bloco</th><th>Micro</th><th class="num">Int.</th>
          <th class="num">Vol.</th><th class="num">Contatos</th></tr></thead>
        <tbody>${bl.map(b => `<tr><td>${b.posicao}</td><td>${esc(b.bloco)}</td>
          <td>${esc(b.micro)}<br><span style="color:var(--ink-4);font-size:11.5px">${esc(b.enfase)}</span></td>
          <td class="num">${Math.round(b.intensidade*100)}%</td>
          <td class="num">${num(b.volume,2)}</td><td class="num">${b.plio}</td></tr>`).join("")}
        </tbody></table></div>
    </div>`;

/* ── Render ─────────────────────────────────────────────────────────────── */
/* NUNCA redesenhar entre o dedo encostar e o dedo soltar.
   O `change` de um campo de texto dispara no BLUR — quer dizer, no instante em
   que o dedo toca o botão ao lado. Se esse change redesenha a tela, o botão é
   destruído entre o pointerdown e o pointerup, o navegador não tem mais em que
   disparar o `click`, e o primeiro toque simplesmente não faz nada. O atleta
   toca, não acontece nada, ele toca de novo. Encontrei isto rodando o app, não
   lendo o código: o teste clicava e a sessão não era gerada.
   O adiamento vai para um setTimeout e não para o próprio pointerup, porque o
   `click` nasce no MESMO turno do pointerup — redesenhar ali teria o mesmo
   efeito. */
let emToque = false, renderAdiado = false, relogioToque = null;
function render(){
  if (emToque){ renderAdiado = true; return; }
  desenhar();
}
function iniciarToque(){
  emToque = true;
  clearTimeout(relogioToque);
  /* Se nenhum clique vier — rolagem, toque longo, dedo arrastado para fora —
     o desenho não pode ficar preso para sempre. */
  relogioToque = setTimeout(liberarToque, 700);
}
function liberarToque(){
  clearTimeout(relogioToque);
  emToque = false;
  if (renderAdiado){ renderAdiado = false; desenhar(); }
}
/* Abre no primeiro sinal de dedo, pelos DOIS caminhos: um celular pode mandar
   só `touchstart`, e o navegador sintetiza os eventos de ponteiro depois. */
document.addEventListener("pointerdown", iniciarToque, true);
document.addEventListener("touchstart", iniciarToque, true);
/* Solta no CLIQUE, que é o último evento da sequência — soltar no pointerup
   não bastaria, porque o clique nasce no mesmo turno dele. O setTimeout deixa
   o manipulador de clique do app terminar antes do desenho. */
const soltarDepois = () => setTimeout(liberarToque, 0);
document.addEventListener("click", soltarDepois, true);
document.addEventListener("pointercancel", soltarDepois, true);
document.addEventListener("touchcancel", soltarDepois, true);

function desenhar(){
  const c = cfg();
  document.getElementById("mcEquipe").textContent = (c.equipe || "").toUpperCase();
  document.getElementById("mcCat").textContent = c.categoria + " · " + c.temporada;
  pintarModo();
  pintarNav();

  const alvo = UI.aba === "__pin" ? "inicio" : UI.aba;
  const nome = ABAS.find(a => a.id === alvo) ? alvo : "inicio";
  /* Esvaziar as abas que saem, e não só escondê-las: o HTML antigo continuaria
     no documento com os MESMOS ids, e getElementById devolve o primeiro em
     ordem de documento — que seria o escondido. */
  for (const a of ABAS){
    const sec = document.getElementById("s-" + a.id);
    sec.hidden = true;
    if (a.id !== nome) sec.innerHTML = "";
  }
  const el = document.getElementById("s-" + nome);
  el.hidden = false;

  const conteudo = UI.aba === "__pin" ? telaPin()
    : alvo === "inicio" ? telaInicio()
    : alvo === "sessao" ? telaSessao()
    : alvo === "bemestar" ? telaBemestar()
    : alvo === "analise" ? telaAnalise()
    : alvo === "desempenho" ? telaDesempenho()
    : alvo === "testes" ? telaTestes()
    : alvo === "exercicios" ? telaExercicios()
    : alvo === "elenco" ? telaElenco()
    : alvo === "prescricao" ? telaPrescricao()
    : alvo === "sistema" ? telaSistema()

document.addEventListener("click", async ev => {

  if (!alvo) return;

  const aba = alvo.getAttribute("data-aba") || alvo.getAttribute("data-ir");
  if (aba){ UI.aviso = ""; ir(aba); return; }

  /* Likert e ticks: estado no próprio botão, gravação no botão de gravar. */
  const grupoEscala = alvo.closest("[data-escala],[data-brums]");
  if (grupoEscala && alvo.hasAttribute("data-v")){
    grupoEscala.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
    alvo.setAttribute("aria-pressed","true");
    return;
  }
  if (alvo.hasAttribute("data-pse")){
    alvo.closest(".likert").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
    alvo.setAttribute("aria-pressed","true");
    const bt = document.getElementById("btFechar");
    if (bt) bt.disabled = false;
    return;
  }
  if (alvo.hasAttribute("data-tick")){
    const ligado = alvo.getAttribute("aria-pressed") === "true";
    alvo.setAttribute("aria-pressed", ligado ? "false" : "true");
    await gravarSerieDaTela(alvo.getAttribute("data-tick"));
    return;
  }

  const id = alvo.id;

  if (id === "btPin"){
    if (valor("pinCampo") === cfg().pin){
      UI.liberado = true; guardar("elase_pin","1",true); ir("elenco");
    } else mostrarAviso("avPin","PIN incorreto.");
    return;
  }
  if (id === "btSair"){
    UI.liberado = false;
    try { sessionStorage.removeItem("elase_pin"); } catch (e) {}
    ir("inicio"); return;
  }

  if (id === "btCheckin"){
    const a = meuAtleta();
    await gravarSessao(a.id, hojeISO(), {
      tipo: (prescDoDia(hojeISO(), a.id)||{}).tipo || "", check_in: new Date().toISOString(),
      check_out: null, dur_min: 0, pse: null, carga_ua: 0, tonelagem: 0,
      contatos: 0, series: {}});
    render(); return;
  }

  if (id === "btFechar"){ await fecharSessao(); return; }
  if (id === "btWell"){ await gravarWellness(); return; }
  if (id === "btBrums"){ await gravarBrums(); return; }
  if (id === "btTeste"){ await lancarTeste(); return; }
  if (id === "btAtleta"){ await criarAtleta(); return; }
  if (id === "btGerar"){ await gerarSemanas(); return; }
  if (id === "btLerWA"){ lerFichas(); return; }
  if (id === "btCfg"){ await gravarConfig(); return; }
  if (id === "btBackup"){ await baixarBackup(); return; }

  const verP = alvo.getAttribute("data-ver-presc");
  if (verP){ const d = document.getElementById("pex-"+verP); if (d) d.hidden = !d.hidden; return; }

  const apagarP = alvo.getAttribute("data-apagar-presc");
  if (apagarP){
    const alvoP = Store.get("prescricoes", apagarP);
    if (!confirm("Apagar a sessão de " + dataBR(alvoP ? alvoP.data : apagarP) + "?")) return;
    await Store.remover("prescricoes", apagarP); render(); return;
  }

  const editarP = alvo.getAttribute("data-editar-presc");
  if (editarP){
    const alvoP = Store.get("prescricoes", editarP);
    if (!alvoP) return;
    UI.editPresc = editarP;
    /* Cópia profunda: enquanto ele edita, o documento no banco fica intacto.
       Sair sem gravar tem de sair sem gravar mesmo. */
    UI.rascunho = JSON.parse(JSON.stringify(alvoP.exercicios || []));
    ir("prescricao");
    return;
  }
  const criarInd = alvo.getAttribute("data-individual");
  if (criarInd){ await criarIndividual(criarInd); return; }

  const mover = alvo.getAttribute("data-mover");
  if (mover){
    const [i, d] = mover.split(":").map(Number);
    const j = i + d;
    if (!UI.rascunho || j < 0 || j >= UI.rascunho.length) return;
    const tmp = UI.rascunho[i]; UI.rascunho[i] = UI.rascunho[j]; UI.rascunho[j] = tmp;
    render(); return;
  }
  const tirarEx = alvo.getAttribute("data-tirar-ex");
  if (tirarEx !== null && tirarEx !== undefined && tirarEx !== ""){
    UI.rascunho.splice(parseInt(tirarEx, 10), 1);
    render(); return;
  }
  if (id === "btAddEx"){
    const nome = valor("novoEx");
    const info = infoEx(nome);
    UI.rascunho.push({nome, grupo: info.grupo, series: 3, reps: "8", pausa: 90,
      pct_rm: null, ref1rm: info.ref1rm, tempo: null, rir: null, vel: null, obs: ""});
    render(); return;
  }
  if (id === "btCopiarPlano"){
    const txt = document.getElementById("msgPlano").textContent;
    try {
      await navigator.clipboard.writeText(txt);
      mostrarAviso("avPlano", "Copiado. Cole na conversa com o atleta.", true);
    } catch (e) {
      mostrarAviso("avPlano", "Não deu para copiar sozinho: selecione o texto abaixo.", true);
    }

  }
  if (id === "btGravarPresc"){ await gravarPresc(); return; }
  if (id === "btCancelarPresc"){
    UI.editPresc = null; UI.rascunho = null; ir("prescricao"); return;
  }
  const apagarA = alvo.getAttribute("data-apagar-atleta");
  if (apagarA){
    const at = atleta(apagarA);
    if (!confirm("Apagar " + (at.apelido||at.nome) + " e tudo que ele registrou?")) return;
    await Store.remover("atletas", apagarA);
    await Store.remover("diario", apagarA).catch(()=>{});
    render(); return;
  }
  const trocar = alvo.getAttribute("data-status");
  if (trocar){
    const at = atleta(trocar);
    await Store.set("atletas", trocar,
      Object.assign({}, at, {status: at.status === "Inativo" ? "Ativo" : "Inativo"}));
    render(); return;

  const alc = alvo.getAttribute("data-alcance");
  if (alc){ await lancarAlcances(alc); return; }

  const vid = alvo.getAttribute("data-video");
  if (vid){
    const atualI = infoEx(vid);
    const novo = prompt("Endereço do vídeo para «" + vid + "»:", atualI.video || "");
    if (novo === null) return;
    const itens = Object.assign({}, bibl());
    itens[vid] = Object.assign({}, itens[vid] || {}, {video: novo.trim()});
    await Store.set("biblioteca","lib",{itens});
    render(); return;
  }
  const filmei = alvo.getAttribute("data-filmei");
  if (filmei){ escolherVideo(filmei); return; }

  const apagarT = alvo.getAttribute("data-apagar-teste");
  if (apagarT !== null && apagarT !== undefined && apagarT !== ""){
    const a = meuAtleta(), lista = testesDe(a.id).slice();
    lista.splice(parseInt(apagarT,10), 1);
    await Store.set("testes", a.id, {lista});
    render(); return;
  }
});

async function gravarSerieDaTela(chave){
  const a = meuAtleta(), hoje = hojeISO(), s = sessaoDe(a.id, hoje);
  if (!s || s.check_out) return;
  const decimal = campo => {
    const el = document.querySelector(`[data-serie="${chave}"][data-campo="${campo}"]`);
    if (!el) return undefined;
    const x = parseFloat(String(el.value).replace(",", "."));
    return Number.isFinite(x) ? x : null;
  };
  const tick = document.querySelector(`[data-tick="${chave}"]`);
  const series = Object.assign({}, s.series || {});
  const campoR = document.querySelector(`[data-serie="${chave}"][data-campo="reps"]`);
  const reps = campoR ? parseInt(campoR.value, 10) : null;
  const registro = {
    carga: decimal("carga") === undefined ? null : decimal("carga"),
    reps: Number.isFinite(reps) ? reps : null,
    feita: tick ? tick.getAttribute("aria-pressed") === "true" : false,
  };
  /* Só grava velocidade e RIR quando o exercício os pediu: campo ausente não
     vira null no banco, senão toda série carregaria duas colunas vazias. */
  const vel = decimal("vel"), rir = decimal("rir");
  if (vel !== undefined) registro.vel = vel;
  if (rir !== undefined) registro.rir = rir;
  series[chave] = registro;
  await gravarSessao(a.id, hoje, {series});
}

const DUR_MAX = 300;
async function fecharSessao(){
  const a = meuAtleta(), hoje = hojeISO(), s = sessaoDe(a.id, hoje);
  if (!s) return;
  const escolhido = document.querySelector('[data-pse][aria-pressed="true"]');
  if (!escolhido){ mostrarAviso("avFechar","Escolha a PSE antes de encerrar."); return; }
  const pse = parseFloat(escolhido.getAttribute("data-pse"));
  const dur = parseInt(valor("durFim"), 10);
  if (!Number.isFinite(dur) || dur < 1 || dur > DUR_MAX){
    mostrarAviso("avFechar", `A duração precisa estar entre 1 e ${DUR_MAX} minutos.`);
    return;
  }
  const p = prescDoDia(hoje, a.id), exs = (p && p.exercicios) || [];
  let tonelagem = 0, contatos = 0;
  for (const chave of Object.keys(s.series || {})){
    const [iEx] = chave.split("_").map(Number);
    const e = exs[iEx];
    if (!e) continue;
    const f = s.series[chave];
    if (!f.feita) continue;
    if (SEM_CARGA.indexOf(e.grupo) < 0 && f.carga && f.reps) tonelagem += f.carga * f.reps;
    if (e.grupo === "Pliometria") contatos += f.reps || primeiroNumero(e.reps);
  }
  await gravarSessao(a.id, hoje, {
    check_out: new Date().toISOString(), dur_min: dur, pse,
    carga_ua: Math.round(dur * pse), tonelagem: Math.round(tonelagem), contatos});
  ir("analise");
}

  lista.push({data, tipo, exercicio: exn, valor: v, unidade: valor("tUni")});
  await Store.set("testes", a.id, {lista});
  /* Massa medida hoje passa a ser a massa do atleta: a força relativa divide
     pelo peso de HOJE, não pelo que ele pesava no cadastro. O histórico fica
     nos testes, então a curva não se perde ao atualizar a ficha. */
  if (tipo === "Massa" && data >= (ultimaMassa(a.id) || "")){
    await Store.set("atletas", a.id, Object.assign({}, a, {massa: v}));
  }

async function gerarSemanas(){
  const c = cfg(), de = parseInt(valor("sisDe"),10), ate = parseInt(valor("sisAte"),10);
  if (!Number.isFinite(de) || !Number.isFinite(ate) || de < 1 || ate < de){
    mostrarAviso("avGerar","Informe um intervalo de semanas válido."); return;
  }
  if (ate - de > 51){ mostrarAviso("avGerar","No máximo 52 semanas por vez."); return; }
  const ocupadas = prescricoes().map(p => p.data);
  const {sessoes, pulados} = gerarSistema(blocos(), c.macro_inicio, de, ate, ocupadas);
  for (const s of sessoes)
    await Store.set("prescricoes", s.data, {
      data: s.data, hora: s.hora, tipo: s.tipo, objetivo: s.objetivo,
      bloco: s.bloco, notas: s.notas, exercicios: s.exercicios});
  mostrarAviso("avGerar",
    `${sessoes.length} sessões gravadas` + (pulados.length ? `, ${pulados.length} dia(s) já ocupado(s) foram pulados.` : "."), true);
  setTimeout(render, 900);
}
