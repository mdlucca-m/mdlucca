/* ── Cópia de segurança ─────────────────────────────────────────────────── */
const FORMATO_BACKUP = "elase-backup";
function montarBackup(){
  const colecoes = {};
  for (const col of COLS) colecoes[col] = Store.cache[col] || {};
  return {formato: FORMATO_BACKUP, versao: 1, gerado_em: new Date().toISOString(),
          equipe: cfg().equipe, temporada: cfg().temporada, colecoes};
}
async function baixarBackup(){
  const texto = JSON.stringify(montarBackup(), null, 1);
  const nome = `elase-${cfg().temporada}-${hojeISO()}.json`;
  let dl = null;
  try { dl = await claude.use("downloads"); } catch (e) { dl = null; }
  if (!dl){
    /* Sem o canal de download, o arquivo vai para a tela para ser copiado —
       melhor um texto feio do que nenhuma cópia. */
    mostrarBackupNaTela(texto,
      "Este visualizador não salva arquivos. Copie o texto abaixo e guarde num arquivo .json.");
    return;
  }
  try {
    await dl.save({filename: nome, data: texto});
    mostrarAviso("avBackup", `Cópia de ${(texto.length/1024).toFixed(0)} KB salva.`, true);
  } catch (e) {
    const c = e && e.code;
    if (c === "declined"){ mostrarAviso("avBackup", "Você cancelou. Nada foi salvo."); return; }
    if (c === "rate_limited"){ mostrarAviso("avBackup", "Espere um instante e tente de novo."); return; }
    mostrarBackupNaTela(texto, "Não deu para salvar o arquivo aqui. Copie o texto abaixo.");
  }
}
function mostrarBackupNaTela(texto, motivo){
  const pre = document.getElementById("backupTexto");
  if (!pre) return;
  pre.textContent = texto;
  pre.hidden = false;
  mostrarAviso("avBackup", motivo);
}
function validarBackup(obj){
  /* Um arquivo errado restaurado por cima da temporada é pior que nenhum
     backup. Confere o formato antes de tocar em qualquer coisa. */
  if (!obj || obj.formato !== FORMATO_BACKUP) return "Este arquivo não é uma cópia do ELASE.";
  if (!obj.colecoes || typeof obj.colecoes !== "object") return "A cópia está sem as coleções.";
  for (const col of Object.keys(obj.colecoes)){
    if (COLS.indexOf(col) < 0) return `A cópia traz uma coleção desconhecida: ${col}.`;
    const c = obj.colecoes[col];
    if (!c || typeof c !== "object" || Array.isArray(c)) return `A coleção ${col} está corrompida.`;
    for (const id of Object.keys(c))
      if (!c[id] || typeof c[id] !== "object" || Array.isArray(c[id]))
        return `O documento ${col}/${id} está corrompido.`;
  }
  return "";
}
async function restaurarBackup(arquivo){
  let obj;
  try { obj = JSON.parse(await arquivo.text()); }
  catch (e) { mostrarAviso("avRestaurar", "Não consegui ler o arquivo: não é JSON válido."); return; }
  const erro = validarBackup(obj);
  if (erro){ mostrarAviso("avRestaurar", erro); return; }

  const conta = Object.keys(obj.colecoes)
    .reduce((a,c) => a + Object.keys(obj.colecoes[c]).length, 0);
  const quando = String(obj.gerado_em || "").slice(0, 10);
  if (!confirm(`Restaurar ${conta} documento(s) da cópia de ${dataBR(quando) || "data desconhecida"}?`
      + `\n\nO que existir hoje com o mesmo identificador será substituído.`)) return;

  let n = 0, falhas = 0;
  for (const col of Object.keys(obj.colecoes)){
    for (const id of Object.keys(obj.colecoes[col])){
      const corpo = Object.assign({}, obj.colecoes[col][id]);
      delete corpo.id;
      try { await Store.set(col, id, corpo); n++; }
      catch (e) { falhas++; }
    }
  }
  mostrarAviso("avRestaurar", falhas
    ? `${n} documento(s) restaurado(s), ${falhas} falharam. Veja o aviso no topo da tela.`
    : `${n} documento(s) restaurado(s).`, !falhas);
  setTimeout(render, 1600);
}

/* ── Mandar o plano ajustado para o celular do atleta ───────────────────── */
/* A área do atleta é PÚBLICA, e página pública não pode ler o banco da equipe.
   Então o plano não é buscado: ele VIAJA. O que vai no link é o suficiente para
   o celular dele montar exatamente a sessão que você ajustou, referenciando
   cada exercício pelo índice no catálogo compartilhado.
   É sincronização manual, e a tela diz isso: você manda quando ajusta. */
const SEP_EX = ";", SEP_CAMPO = "|", SEP_SESSAO = "~";
function limparCampo(s){
  /* Os separadores não podem aparecer dentro de um valor, senão o outro lado
     lê o campo partido ao meio. Trocados por espaço, e não removidos, para
     "8 cada lado" nunca virar "8cadalado". */
  return String(s == null ? "" : s).replace(/[;|~\n\r]/g, " ").trim();
}
function codificarPlano(sessoes){
  const fora = [], semCatalogo = [];
  for (const p of sessoes){
    const exs = [];
    for (const e of (p.exercicios || [])){
      const i = CATALOGO.indexOf(e.nome);
      if (i < 0){ semCatalogo.push(e.nome); continue; }
      exs.push([i, parseInt(e.series, 10) || 1, limparCampo(e.reps),
                parseInt(e.pausa, 10) || 0,
                e.pct_rm ? Math.round(e.pct_rm * 100) : ""].join(SEP_CAMPO));
    }
    fora.push([p.data, limparCampo(p.tipo), limparCampo(p.objetivo),
               exs.join(SEP_EX)].join(SEP_SESSAO));
  }
  return {codigo: fora.join("\n"), semCatalogo};
}
function planoParaAtleta(atletaId, de, ate){
  const sessoes = [];
  for (let d = de; d <= ate; d = maisDias(d, 1)){
    const p = prescDoDia(d, atletaId || null);
    if (p) sessoes.push(p);
  }
  return sessoes;
}
function linkDoAtleta(codigo){
  const base = cfg().link_atleta;
  const sep = base.indexOf("?") >= 0 ? "&" : "?";
  return base + sep + "plano=" + encodeURIComponent(codigo);
}

/* ── Vídeo filmado pelo clube ───────────────────────────────────────────── */
/* O vídeo do preparador vale mais que um do YouTube: o atleta reconhece o
   companheiro, a sala e o equipamento, e a correção é feita com as palavras
   dele. O arquivo fica no armazenamento do próprio app, não no repositório —
   é a imagem dos atletas. */
function escolherVideo(nome){
  const campo = document.createElement("input");
  campo.type = "file";
  campo.accept = "video/*";
  campo.onchange = async () => {
    const arq = campo.files && campo.files[0];
    if (arq) await enviarVideo(nome, arq);
  };
  campo.click();
}
async function enviarVideo(nome, arq){
  let assets = null;
  try { assets = await claude.use("assets"); } catch (e) { assets = null; }
  if (!assets){
    avisarGlobal("Este acesso não envia arquivos. Use “fixar um endereço” "
      + "com um link do vídeo, ou abra o app como dono para enviar.");
    return;
  }
  if (arq.size > 20 * 1024 * 1024){
    /* O teto do armazenamento é 20 MiB. Quinze segundos de vídeo de celular
       cabem com folga; o que estoura é vídeo não cortado. */
    avisarGlobal(`“${arq.name}” tem ${(arq.size/1048576).toFixed(0)} MB e o teto é 20 MB. `
      + "Corte o vídeo no próprio celular: quinze segundos bastam.");
    return;
  }
  avisarGlobal(`Enviando “${arq.name}”…`);
  try {
    const r = await assets.upload(arq);
    const itens = Object.assign({}, bibl());
    itens[nome] = Object.assign({}, itens[nome] || {}, {video: r.url, video_proprio: true});
    await Store.set("biblioteca", "lib", {itens});
    UI.aviso = "";
    render();
  } catch (e) {
    avisarGlobal("Não deu para enviar o vídeo: " + ((e && e.message) || "erro desconhecido"));
  }
}

/* ── Editar e individualizar a prescrição ───────────────────────────────── */
async function criarIndividual(data){
  const base = prescEquipe(data);
  if (!base) return;
  const lista = ativos();
  if (!lista.length){ alert("Cadastre um atleta antes."); return; }
  const nomes = lista.map((a, i) => `${i+1}. ${a.apelido || a.nome}`).join("\n");
  const escolha = prompt(`Plano individual de ${dataBR(data)} para quem?\n\n${nomes}\n\nDigite o número:`);
  if (escolha === null) return;
  const i = parseInt(escolha, 10) - 1;
  if (!(i >= 0 && i < lista.length)){ alert("Número fora da lista."); return; }
  const a = lista[i], docId = idPresc(data, a.id);
  if (Store.get("prescricoes", docId)){
    alert(`${a.apelido || a.nome} já tem plano próprio nesse dia. Use "ajustar".`);
    return;
  }
  /* Começa como cópia do plano da equipe: individualizar quase nunca é começar
     do zero, é tirar o que machuca e manter o resto. */
  await Store.set("prescricoes", docId, {
    data, hora: base.hora, tipo: base.tipo, objetivo: base.objetivo,
    bloco: base.bloco, atleta_id: a.id,
    notas: (base.notas || "") + " · plano individual",
    exercicios: JSON.parse(JSON.stringify(base.exercicios || []))});
  UI.editPresc = docId;
  UI.rascunho = JSON.parse(JSON.stringify(base.exercicios || []));
  render();
}
function aplicarEdicao(i, campo, valorCru){
  if (!UI.rascunho || !UI.rascunho[i]) return;
  const e = UI.rascunho[i];
  if (campo === "series"){
    const n = parseInt(valorCru, 10);
    e.series = Number.isFinite(n) && n > 0 ? n : 1;
  } else if (campo === "pausa"){
    const n = parseInt(valorCru, 10);
    e.pausa = Number.isFinite(n) && n >= 0 ? n : 0;
  } else if (campo === "pct_rm"){
    const n = parseFloat(String(valorCru).replace(",", "."));
    /* Vazio é "sem percentual", e não zero: exercício sem referência de 1RM é
       comum e não deve virar 0% na tela do atleta. */
    e.pct_rm = Number.isFinite(n) && n > 0 ? Math.min(n, 150) / 100 : null;
  } else e.reps = String(valorCru || "").trim() || "1";
}
async function gravarPresc(){
  const p = Store.get("prescricoes", UI.editPresc);
  if (!p) return;
  if (!UI.rascunho.length){
    mostrarAviso("avPresc", "Uma sessão sem exercício nenhum não é uma sessão. Apague o dia em vez disso.");
    return;
  }
  await Store.set("prescricoes", UI.editPresc,
    Object.assign({}, p, {exercicios: UI.rascunho, ajustada_em: new Date().toISOString()}));
  mostrarAviso("avPresc", "Gravado.", true);
  UI.editPresc = null; UI.rascunho = null;
  setTimeout(render, 700);
}

async function gravarConfig(){
  /* O gerador conta os dias a partir do início do macrociclo: sessão A no dia
     0, B no 2, C no 4. Começar numa quarta jogaria o treino para quarta, sexta
     e domingo sem ninguém pedir, então a data é encaixada na segunda daquela
     semana — e a tela diz que encaixou, em vez de mudar por baixo. */
  const pedido = valor("cfMacro") || hojeISO();
  const macro = segundaDe(pedido);
  await Store.set("config","main",{
    equipe: valor("cfEquipe") || "ELASE Voleibol",
    categoria: valor("cfCat") || "Masculino · Adulto",
    temporada: valor("cfTemp") || String(new Date().getFullYear()),
    macro_inicio: macro,
    pin: valor("cfPin") || "1234",
    link_atleta: valor("cfLink") || cfg().link_atleta});
  mostrarAviso("avCfg", macro === pedido ? "Gravado."
    : `Gravado. O início foi encaixado na segunda-feira da semana: ${dataBR(macro)}.`, true);
  setTimeout(render, 1400);
}

/* ── Arranque ───────────────────────────────────────────────────────────── */
/* A página pinta IMEDIATAMENTE com o que houver, e o banco da equipe acende
   depois, quando (e se) responder. Nada aqui espera permissão para aparecer. */
Store.iniciarCache();
Store.lerLocal();
lerPrefs();
render();

(async () => {
  try { await Store.ligar(); }
  catch (e) { Store.pronto = true; }
  if (!Store.get("config","main") && Store.podeGravar){
    /* Primeira abertura: a temporada começa na segunda desta semana. */
    try { await Store.set("config","main", cfg()); } catch (e) {}
  }
  render();
})();
