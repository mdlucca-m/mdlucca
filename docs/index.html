/* ====================================================================== */
/* infográfico por linha de pesquisa                                      */
/* ====================================================================== */
/* O painel sabia dizer quanto o laboratório produz. Não sabia dizer o que
   ele ESTUDA -- e a linha de pesquisa é justamente o recorte pelo qual a
   coordenação pensa, o avaliador pergunta e o bolsista escolhe onde
   entrar.

   Cada linha ganha um cartão com desenho próprio: o ícone não é enfeite,
   é o que faz "Fibromialgia" e "Qualidade do ar" se distinguirem sem ler
   a palavra. O cartão inteiro é botão: abre a tabela dinâmica com os
   artigos daquela linha, que é a pergunta seguinte de quem olha. */

/* O desenho de cada linha. A chave é normalizada (sem acento, minúscula)
   e casa por PALAVRA INTEIRA, nunca por trecho solto: com busca por
   trecho, "ar" achava "sedentário" e "declarada", e duas linhas que nada
   têm com qualidade do ar ganhavam o desenho de pulmão. Frase de mais de
   uma palavra continua valendo -- "psicologia do esporte" casa dentro de
   "Psicologia do Esporte e do Exercício".

   Sem verbete, o ícone é neutro: linha nova não fica sem cartão, fica sem
   desenho próprio. */
const ICONE_DA_LINHA = [
  ["fibromialgia", "dor"], ["dor", "dor"], ["reumatic|reumatolog", "dor"],
  ["qualidade do ar", "pulmao"], ["poluicao|poluentes", "pulmao"],
  ["respirator|pulmonar", "pulmao"],
  ["cancer|oncolog", "fita"], ["mama", "fita"],
  ["envelhecimento|envelhecer", "envelhecimento"], ["idoso|idosos", "envelhecimento"],
  ["fisioterapia|reabilitacao", "coracao"],
  ["exergame|exergames", "apresentacao"], ["escola|escolar|escolas", "apresentacao"],
  ["psicologia do esporte", "trofeu"],
  /* "Desempenho no Esporte" contém as duas palavras; a mais específica
     ganha, senão toda linha de rendimento vira troféu genérico. */
  ["desempenho|rendimento|performance", "subida"],
  ["esporte|esportiva|atleta|atletas", "trofeu"],
  ["psicologia do exercicio", "halteres"], ["exercicio", "halteres"],
  ["atividade fisica|sedentario|sedentarismo", "corrida"],
  ["cognicao|neurociencia", "cerebro"], ["saude mental|depressao|ansiedade|humor", "cerebro"],
  ["treinamento", "halteres"], ["qualidade de vida|bem-estar|saude", "coracao"],
];
function iconeDaLinha(nome) {
  const bruto = String(nome || "");
  if (/sem linha/i.test(bruto)) return "aviso";
  const chave = bruto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const achado = ICONE_DA_LINHA.find(function (par) {
    return new RegExp("(^|[^a-z])(" + par[0] + ")([^a-z]|$)").test(chave);
  });
  return achado ? achado[1] : "linhas";
}

/* A tabela dinâmica de uma linha, na gaveta. É a mesma `dataTable` do
   resto do painel -- com ordenação, busca e exportação -- e não uma
   listinha de leitura: quem abre isto quer trabalhar o recorte. */
function abrirLinha(nome, doSet) {
  const publicados = doSet.filter(function (a) { return a.status === "publicado"; });
  const citacoes = doSet.map(bestCitations);
  const anos = Array.from(new Set(publicados.map(function (a) { return a.year_published; })
    .filter(Boolean))).sort();
  const pessoas = new Set();
  (D.authorship || []).forEach(function (l) {
    if (doSet.some(function (a) { return a.id === l.a; })) pessoas.add(l.m); });

  openDrawer(nome, [
    el("div", { class: "drawer-sub", text: doSet.length + " artigo(s) nesta linha, "
      + publicados.length + " publicado(s)." }),
    el("div", { class: "grid g4", style: "margin:16px 0" }, [
      kpi({ label: "Artigos", value: C.fmt(doSet.length), icon: "producao" }),
      kpi({ label: "Publicados", value: C.fmt(publicados.length), icon: "livro" }),
      kpi({ label: "Citações", value: C.fmt(citacoes.reduce(function (a, b) { return a + b; }, 0)),
        icon: "citacao" }),
      kpi({ label: "Pessoas", value: C.fmt(pessoas.size), icon: "pessoas" }),
    ]),
    anos.length > 1 ? card("Publicações por ano nesta linha", null, C.columns({
      labels: anos.map(String),
      series: [{ label: "Publicados", values: anos.map(function (y) {
        return publicados.filter(function (a) { return a.year_published === y; }).length; }) }],
      mono: true, height: 170, file: "linha-" + nome.slice(0, 20) })) : null,
    el("div", { style: "margin-top:14px" }, dataTable({
      file: "artigos-da-linha", sortKey: "citacoes", sortDir: -1, pageSize: 12,
      /* a linha inteira abre o artigo -- o mesmo gesto do resto do painel */
      onRow: function (r) { showArticle(r); },
      cols: [
        { k: "title", label: "Artigo", wide: true, render: function (r) {
          return cut(r.title, 72); } },
        { k: "status", label: "Situação", render: function (r) { return badge(r.status); } },
        { k: "year_published", label: "Ano", num: true },
        { k: "journal", label: "Periódico", render: function (r) {
          return r.journal ? cut(r.journal, 30) : "—"; } },
        { k: "citacoes", label: "Citações", num: true,
          sortValue: bestCitations, render: function (r) {
            return C.fmt(bestCitations(r)); } },
      ],
      rows: doSet,
    })),
    el("div", { style: "margin-top:14px;display:flex;gap:8px;flex-wrap:wrap" }, [
      el("button", { type: "button", class: "primary", text: "Filtrar o painel por esta linha",
        onclick: function () {
          STATE.linha = nome; buildToolbar(); closeDrawer(); render(); } }),
      el("button", { type: "button", text: "Ver todas as linhas",
        onclick: function () { closeDrawer(); go("linhas"); } }),
    ]),
  ].filter(Boolean));
}

/* Os cartões, um por linha. Ordenados pelo tamanho, porque a primeira
   pergunta é sempre "qual é a maior" -- e cortados em doze, porque um
   mosaico de quarenta cartões não é um infográfico, é uma lista. */
function infograficoDasLinhas(rows) {
  const porLinha = new Map();
  rows.forEach(function (a) {
    const nome = a.research_line || "Sem linha declarada";
    if (!porLinha.has(nome)) porLinha.set(nome, []);
    porLinha.get(nome).push(a);
  });
  const linhas = Array.from(porLinha.entries())
    .sort(function (a, b) { return b[1].length - a[1].length; })
    .slice(0, 12);
  if (!linhas.length) return null;

  const maior = linhas[0][1].length;
  return el("div", { class: "linhagrade" }, linhas.map(function (par, i) {
    const nome = par[0], doSet = par[1];
    const publicados = doSet.filter(function (a) { return a.status === "publicado"; }).length;
    const producao = doSet.filter(function (a) { return a.status === "em_producao"; }).length;
    const avaliacao = doSet.length - publicados - producao;
    const citacoes = doSet.reduce(function (t, a) { return t + bestCitations(a); }, 0);
    const cor = C.serie(i);
    const cartao = el("button", {
      class: "linhacard", type: "button",
      title: "Abrir os artigos de " + nome,
      onclick: function () { abrirLinha(nome, doSet); },
    });
    cartao.style.setProperty("--cor", cor);
    cartao.appendChild(el("div", { class: "topo" }, [
      Icons.badge(iconeDaLinha(nome), null, 34),
      el("b", { text: nome }),
    ]));
    cartao.appendChild(el("div", { class: "numeros" }, [
      el("span", {}, [el("b", { text: C.fmt(doSet.length) }), el("i", { text: "artigos" })]),
      el("span", {}, [el("b", { text: C.fmt(publicados) }), el("i", { text: "publicados" })]),
      el("span", {}, [el("b", { text: C.fmt(citacoes) }), el("i", { text: "citações" })]),
    ]));
    /* A barra é a única comparação entre cartões: sem ela, doze caixas do
       mesmo tamanho dizem que as doze linhas têm o mesmo peso. */
    const trilho = el("div", { class: "linhatrilho" });
    [[publicados, "Publicados", C.token("--seq-600")],
     [producao, "Em produção", C.token("--seq-400")],
     [avaliacao, "Em avaliação", C.token("--seq-200")]].forEach(function (parte) {
      if (parte[0] <= 0) return;
      const pedaco = el("i", { title: parte[1] + ": " + parte[0] });
      pedaco.style.width = (100 * parte[0] / maior) + "%";
      pedaco.style.background = parte[2];
      trilho.appendChild(pedaco);
    });
    cartao.appendChild(trilho);
    cartao.appendChild(el("span", { class: "abrir" }, [
      Icons.get("explorar", 13), el("span", { text: "ver os artigos" })]));
    return cartao;
  }));
}

/* Quantas publicações cada linha somou, ano a ano. É aqui que aparece o
   cruzamento: a linha que passou a outra, e em que ano -- a informação
   que nem o mosaico nem a rosca conseguem dar, porque nenhum dos dois
   tem eixo do tempo. */
function corridaDasLinhas(rows) {
  const publicados = rows.filter(function (a) {
    return a.status === "publicado" && a.year_published; });
  if (publicados.length < 4) return null;
  const anos = Array.from(new Set(publicados.map(function (a) {
    return Number(a.year_published); }))).sort(function (a, b) { return a - b; });
  if (anos.length < 3) return null;
  const porLinha = counter(publicados, function (a) {
    return a.research_line || "Sem linha declarada"; }).slice(0, 5);
  if (porLinha.length < 2) return null;
  const series = porLinha.map(function (x, i) {
    let soma = 0;
    return { label: cut(x.label, 26), color: C.serie(i),
      values: anos.map(function (y) {
        soma += publicados.filter(function (a) {
          return Number(a.year_published) === y
            && (a.research_line || "Sem linha declarada") === x.label; }).length;
        return soma;
      }) };
  });
  return { labels: anos.map(String), series: series, height: 280,
    file: "corrida-das-linhas",
    caption: "publicações acumuladas por linha de pesquisa" };
}

view("visao", "Painel", "", "Retrato do laboratório no recorte atual.", function (host) {
  const o = D.overview;
  const rows = articles();
  const published = rows.filter(function (a) { return a.status === "publicado"; });
  const currentYear = new Date().getFullYear();
  const years = [];
  for (let y = currentYear - o.window + 1; y <= currentYear; y++) years.push(y);
  const perYear = years.map(function (y) {
    return published.filter(function (a) { return a.year_published === y; }).length; });
  const windowTotal = perYear.reduce(function (a, b) { return a + b; }, 0);
  const media = windowTotal / o.window;
  const hist = (D.history && D.history.series) || {};
  const measured = function (metric) {
    return hist[metric] && hist[metric].delta_30d ? hist[metric].delta_30d : null; };
  const sparkOf = function (metric) {
    return hist[metric] && hist[metric].values.length > 1 ? hist[metric].values : null; };

  /* ---- leituras: o que cada número quer dizer -----------------------
     Todas saem do recorte atual, não de constante escrita à mão. Um painel
     que só mostra número obriga cada pessoa a interpretar sozinha. */
  const emProducao = rows.filter(function (a) { return a.status === "em_producao"; });
  const emAvaliacao = rows.filter(function (a) {
    return a.status === "submetido" || a.status === "em_revisao"; });
  const esperaMaxima = Math.max.apply(null, (D.submitted || [])
    .map(function (a) { return daysSince(a.last_submitted_on || a.first_submission_on) || 0; })
    .concat([0]));
  const publicadosNoAno = published.filter(function (a) {
    return Number(a.year_published) === currentYear; }).length;
  const ritmo = media > 0 ? publicadosNoAno / media : 0;
  const escritaLonga = median(emProducao.map(function (a) { return daysSince(a.started_on); })
    .filter(function (d) { return d !== null; }));
  const publicaram = new Set((D.authorship || []).filter(function (l) {
    const artigo = (D.articles || []).find(function (a) { return a.id === l.a; });
    return artigo && Number(artigo.year_published) >= currentYear - 1;
  }).map(function (l) { return l.m; })).size;
  const terminando = ((D.projects && D.projects.items) || []).filter(function (pj) {
    const d = daysSince(pj.ended_on);
    return pj.status === "em_andamento" && d !== null && d > -366 && d < 0;
  }).length;
  const hMediano = median((D.researchers || []).filter(function (m) { return !m.is_external; })
    .map(function (m) { return m.h_index; }));
  const comFomento = ((D.projects && D.projects.items) || [])
    .filter(function (pj) { return pj.funder; }).length;

  host.appendChild(el("div", { class: "grid g4 fixed4" }, [
    kpi({ label: "Artigos no recorte", value: C.fmt(rows.length), icon: "producao",
      ir: "explorar",
      foot: (D.articles || []).length + " no banco todo",
      delta: measured("artigos"), deltaNote: "em 30 dias", spark: sparkOf("artigos"),
      leitura: rows.length ? {
        texto: "estão publicados; " + C.fmt(emProducao.length + emAvaliacao.length)
          + " ainda em curso.",
        forte: Math.round(100 * published.length / rows.length) + "%",
      } : null }),
    kpi({ label: "Em produção", icon: "linha", value: C.fmt(emProducao.length),
      ir: "producao",
      foot: "manuscritos em escrita", delta: measured("em_producao"), deltaNote: "em 30 dias",
      leitura: escritaLonga !== null ? {
        texto: "é o tempo mediano de escrita já decorrido neste grupo.",
        forte: dur(escritaLonga),
      } : null }),
    kpi({ label: "Submetidos", icon: "submissao", value: C.fmt(emAvaliacao.length),
      ir: "submetidos",
      foot: "aguardando parecer", delta: measured("submetidos"), deltaNote: "em 30 dias",
      leitura: esperaMaxima > 0 ? {
        sinal: esperaMaxima > 180 ? "desce" : "parado",
        forte: dur(esperaMaxima),
        texto: "é a espera do mais antigo — o que decide se é hora de cobrar.",
      } : null }),
    kpi({ label: "Publicados", icon: "livro", value: C.fmt(published.length),
      ir: "publicacoes",
      foot: windowTotal + " nos últimos " + o.window + " anos",
      delta: measured("publicados"), deltaNote: "em 30 dias",
      spark: sparkOf("publicados") || perYear, sparkColor: C.token("--series-1"),
      leitura: media > 0 ? {
        sinal: ritmo >= 1 ? "sobe" : (ritmo >= 0.6 ? "parado" : "desce"),
        forte: C.fmt(publicadosNoAno) + " em " + currentYear,
        texto: "contra média de " + dec(media, 1) + " por ano na janela.",
      } : null }),
    kpi({ label: "Média por ano", icon: "subida", value: dec(media, 2),
      ir: "temporal",
      foot: "publicações/ano na janela",
      leitura: { texto: "Mede o ritmo da janela inteira; um ano fraco não a derruba, "
        + "e é por isso que ela serve de régua." } }),
    kpi({ label: "Pesquisadores", icon: "pessoas", value: C.fmt(o.n_members),
      ir: "pesquisadores",
      foot: o.n_collaborators + " colaboradores externos",
      leitura: publicaram ? {
        forte: C.fmt(publicaram),
        texto: "assinaram algo publicado nos últimos dois anos.",
      } : null }),
    kpi({ label: "Projetos", icon: "projeto", value: C.fmt(o.n_projects),
      ir: "projetos",
      foot: o.n_projects_active + " em andamento",
      leitura: terminando ? {
        sinal: "desce",
        forte: C.fmt(terminando),
        texto: "termina" + (terminando > 1 ? "m" : "") + " nos próximos doze meses.",
      } : (comFomento ? {
        forte: C.fmt(comFomento),
        texto: "com financiadora declarada; nenhum vence nos próximos doze meses.",
      } : null) }),
    kpi({ label: "Maior índice h", icon: "alvo", value: C.fmt(o.best_h_index),
      ir: "equipe",
      foot: "entre os integrantes",
      leitura: hMediano !== null ? {
        forte: dec(hMediano, 0),
        texto: "é a mediana da equipe — o topo diz menos do que ela.",
      } : null }),
  ]));
  if (D.history && !D.history.available) {
    host.appendChild(el("div", { class: "note info", style: "margin-top:14px", html:
      "As setas de variação aparecem depois da segunda execução do lakehouse — é dele que "
      + "vem o histórico medido. Rode <span class='mono'>lape_agent.py lake</span>." }));
  }

  /* ---- segunda fileira: os indicadores que contagem não dá ------------
     Os oito de cima dizem QUANTO. Estes dizem o que o quanto não diz:
     se o laboratório lidera ou participa, se o impacto está concentrado
     em poucos artigos, se a produção depende de poucas pessoas e se ela
     é recente. Nenhum deles é contagem -- e é por isso que valem o
     espaço de uma segunda fileira. */
  const citados = published.map(bestCitations).filter(function (c) { return c > 0; });
  const semCitacao = published.length - citados.length;
  /* Índice h da COLEÇÃO, e não de uma pessoa: h artigos com pelo menos h
     citações cada. É o número que se pede de um grupo de pesquisa, e o
     painel só tinha o de pessoa. */
  const ordenadas = published.map(bestCitations).sort(function (a, b) { return b - a; });
  let hLab = 0;
  while (hLab < ordenadas.length && ordenadas[hLab] >= hLab + 1) hLab++;
  /* Primeira autoria: alguém do LAPE assina em primeiro lugar.

     O indicador que eu queria era "primeiro OU último autor", que é como
     a área lê liderança. O último autor não é calculável aqui: a tabela
     de autoria só guarda quem é do laboratório, então o maior
     `author_order` que ela conhece é o último DOS NOSSOS, e não o último
     da lista -- um integrante em terceiro lugar entre oito autores seria
     contado como sênior. Medir primeiro autor é menos, e é verdade. */
  const daCasa = new Set((D.researchers || []).filter(function (r) { return !r.is_external; })
    .map(function (r) { return r.id; }));
  const lideranca = rows.filter(function (a) {
    return (D.authorship || []).some(function (l) {
      return l.a === a.id && l.o === 1 && daCasa.has(l.m); });
  }).length;
  /* Concentração: quanto da produção sai das três pessoas mais ativas.
     Alta concentração não é mérito nem defeito -- é risco, e é o tipo de
     coisa que nenhum outro número do painel mostra. */
  const porPessoa = new Map();
  (D.authorship || []).forEach(function (l) {
    if (!daCasa.has(l.m)) return;
    porPessoa.set(l.m, (porPessoa.get(l.m) || 0) + 1);
  });
  const topo3 = Array.from(porPessoa.values()).sort(function (a, b) { return b - a; })
    .slice(0, 3).reduce(function (a, b) { return a + b; }, 0);
  const totalAssinaturas = Array.from(porPessoa.values())
    .reduce(function (a, b) { return a + b; }, 0);
  const concentracao = totalAssinaturas ? Math.round(100 * topo3 / totalAssinaturas) : null;
  /* Renovação: quanto da produção total saiu no último triênio. */
  const trienio = published.filter(function (a) {
    return Number(a.year_published) >= currentYear - 2; }).length;
  const instituicoes = new Set((D.researchers || [])
    .filter(function (r) { return r.is_external && r.institution; })
    .map(function (r) { return r.institution; }));
  const nLinhas = new Set(rows.map(function (a) { return a.research_line; })
    .filter(Boolean)).size;
  const medianaCit = median(published.map(bestCitations));

  host.appendChild(el("div", { class: "grid g4 fixed4", style: "margin-top:13px" }, [
    kpi({ label: "Índice h do laboratório", icon: "citacao",
      value: hLab ? C.fmt(hLab) : "—", ir: "citacoes",
      foot: hLab ? hLab + " artigos com " + hLab + "+ citações cada"
        : "nenhuma citação registrada ainda",
      leitura: { texto: "É o h da coleção do LAPE, e não o de uma pessoa — "
        + "é este que se pede de um grupo de pesquisa." } }),
    kpi({ label: "Primeira autoria", icon: "orientacao",
      value: rows.length ? Math.round(100 * lideranca / rows.length) + "%" : "—",
      ir: "equipe", foot: C.fmt(lideranca) + " de " + C.fmt(rows.length) + " artigos",
      leitura: { texto: "Artigos em que alguém do LAPE assina em primeiro lugar. "
        + "Separa produção do laboratório de participação na produção dos "
        + "outros. Autoria sênior exigiria saber quantos autores o artigo "
        + "tem ao todo, e o banco só guarda os nossos." } }),
    kpi({ label: "Citações por artigo", icon: "barras",
      value: medianaCit === null ? "—" : dec(medianaCit, 1), ir: "citacoes",
      foot: "mediana entre os publicados",
      leitura: published.length ? {
        sinal: semCitacao > published.length / 2 ? "desce" : "parado",
        forte: C.fmt(semCitacao) + " sem citação",
        texto: "de " + published.length + " publicados. A mediana não se deixa "
          + "levar por um artigo muito citado; a média sim.",
      } : null }),
    kpi({ label: "Concentração da produção", icon: "aviso",
      value: concentracao === null ? "—" : concentracao + "%",
      ir: "equipe", tone: concentracao !== null && concentracao >= 70 ? "bad" : null,
      foot: "assinada pelas 3 pessoas mais ativas",
      leitura: { texto: "Quanto maior, mais a produção depende de poucas pessoas — "
        + "é risco, e não mérito nem defeito." } }),
    kpi({ label: "Renovação", icon: "atualizar",
      value: published.length ? Math.round(100 * trienio / published.length) + "%" : "—",
      ir: "temporal", foot: C.fmt(trienio) + " nos últimos três anos",
      leitura: { texto: "Quanto da produção total saiu no último triênio: diz se o "
        + "laboratório produz hoje ou vive de acervo." } }),
    kpi({ label: "Instituições parceiras", icon: "instituicao",
      value: C.fmt(instituicoes.size), ir: "rede",
      foot: C.fmt(o.n_collaborators) + " coautores de fora",
      leitura: { texto: "Coautoria externa é o que leva o trabalho do laboratório "
        + "para fora dele." } }),
    kpi({ label: "Linhas com produção", icon: "linhas",
      value: C.fmt(nLinhas), ir: "linhas",
      foot: "no recorte atual",
      leitura: { texto: "Linha declarada sem nenhum artigo é linha que existe no "
        + "cadastro e não na bancada." } }),
    kpi({ label: "Em formação", icon: "tese",
      value: C.fmt((D.members || []).filter(function (m) {
        return !m.is_external && m.active !== 0 && !m.left_on
          && EM_FORMACAO.indexOf(m.role) >= 0; }).length),
      ir: "formacao", foot: "orientandos ativos",
      leitura: { texto: "Cada um com uma entrega e um prazo — em Pessoas → "
        + "Formação e prazos." } }),
  ]));

  const segItems = topN(counter(rows, segmentOf), 7);
  const segLabel = (SEGMENTOS.find(function (x) { return x.id === STATE.segmento; }) || {}).label || "";
  host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
    card("Produção por " + segLabel.toLowerCase(),
      "Muda com o seletor “Segmentar por” na barra de filtros.",
      C.donut({ items: segItems, unit: "artigos", file: "producao-por-segmento",
        onSelect: function (item) { aplicarSegmento(item.label); },
        table: { cols: [{ label: segLabel, k: "label" }, { label: "Artigos", k: "value", num: true }],
          rows: segItems } })),
    card("Publicações por ano", "Coluna: publicações do ano. Régua: média da janela.",
      C.columns({
        labels: years.map(String),
        series: [{ label: "Publicações", values: perYear, color: C.token("--series-1") }],
        reference: media > 0 ? Math.round(media * 10) / 10 : null, referenceLabel: "média",
        file: "publicacoes-por-ano",
        onSelect: function (label) { STATE.ano = label; buildToolbar(); render(); },
        table: { cols: [{ label: "Ano", k: "ano" }, { label: "Publicações", k: "n", num: true }],
          rows: years.map(function (y, i) { return { ano: y, n: perYear[i] }; }) } })),
  ]));

  const submetidos = rows.filter(function (a) {
    return ["submetido", "em_revisao", "aceito", "publicado", "rejeitado"].indexOf(a.status) >= 0;
  }).length;
  const aceitos = rows.filter(function (a) {
    return a.status === "aceito" || a.status === "publicado"; }).length;
  const steps = [
    { label: "Iniciados", value: rows.length },
    { label: "Submetidos", value: submetidos },
    { label: "Aceitos", value: aceitos },
    { label: "Publicados", value: published.length },
  ];
  /* composição da produção ao longo da janela: o total e de que ele é feito */
  const comp = STATUS_ORDER.filter(function (st) {
    return rows.some(function (a) { return a.status === st; });
  }).map(function (st, i) {
    return {
      label: STATUS_LABEL[st] || st, color: C.token("--series-" + ((i % 8) + 1)),
      values: years.map(function (y) {
        return rows.filter(function (a) {
          return a.status === st && String(DIM_ACCESSOR.ano(a)) === String(y);
        }).length;
      }),
    };
  });
  const noAno = perYear[perYear.length - 1] || 0;
  const teto = Math.max(Math.max.apply(null, perYear.concat([1])), Math.ceil(media) || 1);
  host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
    card("Ritmo do ano corrente", "Publicações de " + currentYear
      + " contra o melhor ano da janela. A marca externa é a média.",
      C.gauge({
        value: noAno, max: teto, unit: "publicações em " + currentYear,
        bands: media > 0 ? [{ to: media, color: C.token("--warning") },
          { to: teto, color: C.token("--good") }] : [],
        caption: null, file: "ritmo",
        table: { cols: [{ label: "Ano", k: "ano" }, { label: "Publicações", k: "n", num: true }],
          rows: years.map(function (y, i) { return { ano: y, n: perYear[i] }; }) },
      })),
    card("Composição da produção por ano", "Cada faixa é um estágio do ciclo; o topo é o total do ano.",
      comp.length ? C.area({
        labels: years.map(String), series: comp, height: 250, file: "composicao",
        table: {
          cols: [{ label: "Ano", k: "ano" }].concat(comp.map(function (c) {
            return { label: c.label, k: c.label, num: true }; })),
          rows: years.map(function (y, i) {
            const row = { ano: y };
            comp.forEach(function (c) { row[c.label] = c.values[i]; });
            return row;
          }),
        },
      }) : C.empty("Sem produção na janela.")),
  ]));

  const linhas = topN(counter(rows, function (a) { return a.research_line || "Sem linha"; }), 8);
  host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
    card("Funil da produção", "Quantos manuscritos chegam a cada etapa do ciclo.",
      C.funnel({ steps: steps, file: "funil",
        table: { cols: [{ label: "Etapa", k: "label" }, { label: "Artigos", k: "value", num: true }],
          rows: steps } })),
    /* Era um treemap: retângulos coloridos proporcionais ao número de
       artigos. Ele respondia UMA pergunta -- qual linha é maior -- e
       ocupava um cartão inteiro para isso, num mosaico em que comparar
       duas áreas vizinhas de formatos diferentes é justamente o que o
       olho faz pior.

       O fluxo responde duas no mesmo espaço: o peso de cada linha (a
       espessura da faixa) e para onde essa produção foi (a coluna da
       direita). Uma linha com quinze artigos dos quais quatro ainda estão
       em produção não é a mesma coisa que uma com quinze publicados, e o
       mosaico pintava as duas com o mesmo tamanho de caixa. */
    card("Da linha de pesquisa à prateleira",
      "A espessura é o número de artigos; a coluna da direita, onde eles estão.",
      C.sankey(fluxoDasLinhas(rows))),
  ]));

  /* ---- o que o laboratório estuda, linha por linha -------------------- */
  const mosaico = infograficoDasLinhas(rows);
  if (mosaico) {
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "As linhas de pesquisa, uma a uma",
      "Cada cartão abre os artigos daquela linha numa tabela que ordena, "
      + "busca e exporta. A barra compara o tamanho entre as linhas.",
      mosaico)));
  }

  /* A corrida: qual linha passou qual, e em que ano. É a única figura do
     painel com eixo do tempo E identidade de linha ao mesmo tempo -- o
     mosaico e a rosca mostram o hoje, e o hoje não conta a virada. */
  const corrida = corridaDasLinhas(rows);
  if (corrida) {
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "A corrida entre as linhas",
      "Publicações acumuladas por linha. Os anéis marcam onde uma passou a "
      + "outra e onde cada uma virou.",
      linhaAnalitica(corrida, { maximo: 5 }))));
  }
});

/* Onde o laboratório quer chegar, e se vai.

   O painel sabia contar o que aconteceu e não sabia dizer se isso é muito
   ou pouco -- 13 publicações só se interpreta ao lado de quanto se
   pretendia. A meta é declarada pela coordenação em Administração; aqui
   ela só é medida. */
view("metas", "Objetivos do ano", "", "O que o laboratório declarou como meta, "
  + "quanto já saiu, em que ritmo, e onde o ano provavelmente termina.",
  function (host) {
    const M = D.metas || {};
    const itens = M.indicadores || [];
    if (!itens.length) {
      host.appendChild(card("Objetivos do ano", null,
        el("div", { class: "empty", text: "Nenhum indicador disponível." })));
      return;
    }

    const comMeta = itens.filter(function (i) { return i.meta; });
    if (!comMeta.length) {
      host.appendChild(card("Nenhuma meta declarada para " + M.ano, null, [
        el("p", { class: "hint", text: "A coordenação declara as metas do ano em "
          + "Área do integrante › Conta › Administração. Sem meta, o painel conta "
          + "o que aconteceu mas não tem como dizer se é perto ou longe de onde o "
          + "laboratório queria chegar." }),
      ]));
    }

    /* O veredito é estado, e estado leva cor reservada com rótulo e ícone
       ao lado -- nunca cor sozinha. */
    const TOM = {
      "alcançada": { tom: "good", icone: "aceite" },
      "no ritmo atual, alcança": { tom: "good", icone: "subida" },
      "depende do fim do ano": { tom: "warning", icone: "aviso" },
      "no ritmo atual, não alcança": { tom: "serious", icone: "aviso" },
      "não alcançada": { tom: "serious", icone: "aviso" },
      "sem meta declarada": { tom: null, icone: "alvo" },
    };

    const linhas = itens.map(function (i) {
      const pj = i.projecao || {};
      /* A escala do trilho tem de caber a meta E o topo da faixa: se o
         trilho terminasse na meta, uma projeção que a ultrapassa sairia
         encostada na borda e pareceria empate. */
      const teto = Math.max(i.meta || 0, pj.ate || 0, i.realizado || 0, 1);
      const pct = function (v) { return (100 * (v || 0) / teto).toFixed(1) + "%"; };
      const trilho = el("div", { class: "meta-trilho" }, [
        el("div", { class: "faixa" }),
        el("div", { class: "feito" }),
        i.meta ? el("div", { class: "marca" }) : null,
      ].filter(Boolean));
      trilho.style.setProperty("--feito", pct(i.realizado));
      trilho.style.setProperty("--de", pct(pj.de));
      trilho.style.setProperty("--largura",
        (100 * Math.max(0, (pj.ate || 0) - (pj.de || 0)) / teto).toFixed(1) + "%");
      if (i.meta) trilho.style.setProperty("--meta", pct(i.meta));

      const estado = TOM[i.veredito] || {};
      const recado = [];
      if (i.meta) {
        recado.push(i.realizado + " de " + i.meta);
        if (i.precisa_por_mes)
          recado.push("precisa de " + C.fmt(i.precisa_por_mes) + "/mês até dezembro");
      } else {
        recado.push(i.realizado + " no ano");
      }
      if (i.ritmo_mes) recado.push("ritmo atual " + C.fmt(i.ritmo_mes) + "/mês");

      return el("div", { class: "meta-linha" }, [
        el("div", { class: "topo" }, [
          el("span", {}, [el("b", { text: i.rotulo }),
            el("span", { class: "hint", text: "  " + i.ajuda })]),
          el("span", { class: "badge" + (estado.tom ? " " + estado.tom : ""),
            text: i.veredito }),
        ]),
        trilho,
        el("div", { class: "hint", text: recado.join(" · ") }),
        /* De onde veio a faixa. Projeção sem método declarado é palpite
           passando por medida -- e a diferença entre os dois métodos muda
           o número, às vezes muito. */
        pj.metodo === "sazonal"
          ? el("div", { class: "hint", text: "projeção " + pj.de + "–" + pj.ate
              + " · pelo histórico do próprio laboratório: em " + pj.anos_de_base
              + " ano(s) anteriores, " + Math.round(100 * pj.fatia) + "% do ano já "
              + "tinha acontecido a esta altura" })
          : (pj.metodo === "linear"
            ? el("div", { class: "hint", text: "projeção " + pj.de + "–" + pj.ate
                + " · regra proporcional ao tempo decorrido, porque ainda não há "
                + "histórico com mês suficiente para medir como os anos do "
                + "laboratório se distribuem" })
            : null),
      ].filter(Boolean));
    });

    host.appendChild(card("Objetivos de " + M.ano,
      M.corrente ? "faltam " + M.meses_restantes + " mês(es) para fechar o ano"
                 : "ano fechado",
      [
        el("div", {}, linhas),
        el("div", { class: "meta-legenda hint" }, [
          el("span", {}, [el("i", { style: "background:var(--accent-strong)" }),
            el("span", { text: "já aconteceu" })]),
          el("span", {}, [el("i", { style: "background:repeating-linear-gradient("
            + "135deg,var(--ink-muted) 0 2px,transparent 2px 6px)" }),
            el("span", { text: "onde o ano deve terminar" })]),
          el("span", {}, [el("i", { style: "background:var(--ink);width:2px" }),
            el("span", { text: "meta" })]),
        ]),
      ]));
  });

view("explorar", "Explorar dados", "", "Escolha a medida, o recorte e a quebra: o gráfico e a tabela "
  + "se refazem na hora, direto da camada analítica.", function (host) {
    const cat = D.catalog || { measures: [], dimensions: [] };
    if (!cat.measures.length) {
      host.appendChild(el("div", { class: "note", text:
        "Camada analítica ainda não construída. Rode: python3 scripts/lape_agent.py lake" }));
      return;
    }
    const box = el("div", { class: "card" });
    const controls = el("div", { class: "explorer-controls" });
    const out = el("div", { style: "margin-top:18px" });
    /* Até aqui o explorador só conhecia ARTIGO, e as listas de medida e
       recorte vinham soltas no catálogo. Agora há três conjuntos, cada um
       com as suas — e trocar de conjunto tem de trocar as duas listas
       JUNTO: uma medida de fomento com um recorte de artigo não é uma
       combinação inválida que o servidor recusa, é uma tela que oferece o
       que não existe. */
    /* O payload nunca traz o conjunto da bancada -- ele viaja para docs/
       e para o link público, e lá o dado deixa de ter dono. Quem alcança
       a bancada descobre o conjunto perguntando ao servidor, que sabe
       quem está do outro lado. É a mesma regra das telas da bancada. */
    let conjuntos = cat.datasets || [];
    if (LIVE) {
      fetch("/api/catalog", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (vivo) {
          if (!vivo || !vivo.datasets) return;
          if (vivo.datasets.length === conjuntos.length) return;
          conjuntos = vivo.datasets;
          montarControles();
        })
        .catch(function () { /* sem servidor, fica o que veio no arquivo */ });
    }
    const state = { conjunto: "artigos", medida: "artigos", por: "linha",
                    quebra: "", forma: "colunas" };

    function conjuntoAtual() {
      return conjuntos.find(function (c) { return c.id === state.conjunto; })
        || { measures: cat.measures, dimensions: cat.dimensions,
             padrao_medida: "artigos", padrao_recorte: "linha" };
    }

    function pick(label, options, key, onChange) {
      const sel = el("select", { "aria-label": label, onchange: function (ev) {
        state[key] = ev.target.value; onChange(); } });
      options.forEach(function (opt) {
        sel.appendChild(el("option", { value: opt.id, text: opt.label }));
      });
      sel.value = state[key];
      return el("div", { class: "field" }, [el("label", { text: label }), sel]);
    }

    async function run() {
      out.classList.add("reloading");
      let result;
      if (LIVE) {
        const params = new URLSearchParams({ conjunto: state.conjunto,
          medida: state.medida, por: state.por, limite: "40" });
        if (state.quebra) params.set("quebra", state.quebra);
        /* Os filtros do painel são de ARTIGO. Mandá-los para os outros
           conjuntos daria 400 em "filtro desconhecido" -- e a tela cairia
           no cálculo local, que nem sabe fazer estas contas. */
        if (state.conjunto === "artigos") {
          if (STATE.linha) params.set("linha", STATE.linha);
          if (STATE.ano) params.set("ano", STATE.ano);
          if (STATE.status) params.set("status", STATE.status);
          if (STATE.integrante) params.set("integrante", STATE.integrante);
        }
        try {
          const response = await fetch("/api/query?" + params.toString());
          if (response.ok) {
            result = await response.json();
          } else if (state.conjunto === "artigos") {
            result = localQuery(state.medida, state.por, state.quebra);
          } else {
            /* O cálculo no navegador só sabe somar artigos. Cair nele
               para bancada ou fomento devolveria números de outro
               assunto, com aparência de resposta -- pior do que dizer que
               não deu. */
            const erro = await response.json().catch(function () { return {}; });
            result = { rows: [], erro: response.status === 403
              ? "As medidas da bancada são da coordenação."
              : (erro.error || "não foi possível consultar") };
          }
        } catch (err) {
          result = state.conjunto === "artigos"
            ? localQuery(state.medida, state.por, state.quebra)
            : { rows: [], erro: "sem conexão com o servidor" };
        }
      } else if (state.conjunto === "artigos") {
        result = localQuery(state.medida, state.por, state.quebra);
      } else {
        result = { rows: [], erro:
          "Bancada e fomento leem o servidor ao vivo: não viajam em arquivo." };
      }
      draw(result);
      out.classList.remove("reloading");
    }

    function draw(result) {
      out.innerHTML = "";
      if (result.erro) {
        out.appendChild(C.empty(result.erro));
        return;
      }
      const rows = result.rows.filter(function (r) { return r.valor !== null; });
      if (!rows.length) {
        out.appendChild(C.empty("Nenhum resultado para esta combinação."));
        return;
      }
      const tableSpec = {
        cols: [{ label: result.by_label, k: "dim1" }]
          .concat(result.split ? [{ label: result.split_label, k: "dim2" }] : [])
          .concat([{ label: result.measure_label, k: "valor", num: true }]),
        rows: rows,
      };
      const file = "explorar-" + result.measure + "-por-" + result.by;

      if (result.split) {
        const dim1 = Array.from(new Set(rows.map(function (r) { return r.dim1; }))).slice(0, 12);
        const dim2 = Array.from(new Set(rows.map(function (r) { return r.dim2; }))).slice(0, 8);
        out.appendChild(C.columns({
          mode: state.forma === "barras" ? "agrupado" : "empilhado",
          labels: dim1.map(function (d) { return cut(String(d), 14); }),
          series: dim2.map(function (d2) {
            return { label: String(d2), values: dim1.map(function (d1) {
              const found = rows.find(function (r) { return r.dim1 === d1 && r.dim2 === d2; });
              return found ? Number(found.valor) || 0 : 0;
            }) };
          }),
          height: 320, file: file, table: tableSpec,
          caption: result.measure_label + " por " + result.by_label.toLowerCase()
            + ", quebrado por " + result.split_label.toLowerCase() + ".",
        }));
      } else if (state.forma === "barras") {
        out.appendChild(C.bars({
          items: rows.slice(0, 20).map(function (r, i) {
            return { label: String(r.dim1), value: Number(r.valor) || 0, rank: i + 1 }; }),
          mono: true, labelWidth: 230, labelChars: 34, unit: result.unit, file: file,
          table: tableSpec,
          caption: result.measure_label + " por " + result.by_label.toLowerCase() + ".",
        }));
      } else if (state.forma === "rosca") {
        out.appendChild(C.donut({
          items: topN(rows.map(function (r) {
            return { label: String(r.dim1), value: Number(r.valor) || 0 }; }), 7),
          unit: result.unit, file: file, table: tableSpec,
          caption: result.measure_label + " por " + result.by_label.toLowerCase() + ".",
        }));
      } else if (state.forma === "arvore") {
        out.appendChild(C.treemap({
          items: topN(rows.map(function (r) {
            return { label: String(r.dim1), value: Number(r.valor) || 0 }; }), 12),
          unit: result.unit, height: 320, file: file, table: tableSpec,
        }));
      } else {
        out.appendChild(C.columns({
          labels: rows.slice(0, 16).map(function (r) { return cut(String(r.dim1), 14); }),
          series: [{ label: result.measure_label,
            values: rows.slice(0, 16).map(function (r) { return Number(r.valor) || 0; }),
            color: C.token("--series-1") }],
          height: 320, file: file, table: tableSpec,
          caption: result.measure_label + " por " + result.by_label.toLowerCase() + ".",
        }));
      }
      /* Média e taxa não somam entre recortes: 40% + 60% não são 100% de
         nada. O servidor devolve `total: null` nesses casos, e a linha
         some -- em vez de mostrar um número que não quer dizer nada. */
      const onde = result.local ? " · calculado no navegador"
                                : " · calculado na camada analítica";
      out.appendChild(el("div", { class: "hint", style: "margin-top:12px",
        text: (result.total === null || result.total === undefined
          ? "Medida que não se soma entre recortes" + onde
          : "Total no recorte: " + C.fmt(Math.round(result.total * 100) / 100)
            + " " + (result.unit || "") + onde) }));
      if (result.nota) {
        out.appendChild(el("div", { class: "hint", text: result.nota }));
      }
    }

    /* A barra do painel recorta ARTIGO: ano, linha, situação, integrante.
       Ela ficava visível nesta tela em qualquer conjunto, e anunciava
       "19 de 19 artigos" ao lado de um gráfico de 461 medições -- dois
       números verdadeiros dizendo coisas diferentes, um contradizendo o
       outro. Fora de artigos ela sai: filtro que não filtra nada só
       confunde. */
    function ajustarBarra() {
      const barra = document.getElementById("toolbar");
      if (barra) barra.hidden = state.conjunto !== "artigos";
    }

    function montarControles() {
      controls.innerHTML = "";
      const conj = conjuntoAtual();
      if (conjuntos.length > 1) {
        controls.appendChild(pick("Conjunto", conjuntos, "conjunto", function () {
          const novo = conjuntoAtual();
          state.medida = novo.padrao_medida;
          state.por = novo.padrao_recorte;
          state.quebra = "";
          ajustarBarra();
          ajustarBarra();
    montarControles();
          run();
        }));
      }
      controls.appendChild(pick("Medida", conj.measures, "medida", run));
      controls.appendChild(pick("Recortar por", conj.dimensions, "por", run));
      controls.appendChild(pick("Quebrar por",
        [{ id: "", label: "— sem quebra —" }].concat(conj.dimensions), "quebra", run));
      controls.appendChild(pick("Forma", [
        { id: "colunas", label: "Colunas" }, { id: "barras", label: "Barras" },
        { id: "rosca", label: "Rosca" }, { id: "arvore", label: "Treemap" },
      ], "forma", run));
    }
    montarControles();
    box.appendChild(controls);
    box.appendChild(out);
    host.appendChild(box);
    host.appendChild(el("div", { class: "note info", style: "margin-top:16px", html:
      "As mesmas combinações estão na API: <span class='mono'>GET /api/query?conjunto=fomento"
      + "&medida=captado&por=agencia</span> — útil para levar os números para o Excel, o R ou o Power BI." }));
    run();
  });

view("organograma", "Organograma", "Pessoas e projetos",

/* Organograma em colunas, e não em árvore SVG: com vinte pessoas, uma árvore
   desenhada fica com três mil pixels de largura, e a raiz — centrada sobre
   todos os filhos — vai parar no meio, fora da tela. Em colunas, cada
   orientador ocupa uma faixa com a sua gente embaixo, e o desenho cabe. */
function organogramaEmColunas(org) {
  const gente = org.people || [];
  const porId = new Map(gente.map(function (p) { return [p.id, p]; }));
  const filhos = new Map();
  (org.edges || []).forEach(function (e) {
    if (e.kind !== "orientacao") return;
    if (!filhos.has(e.from)) filhos.set(e.from, []);
    filhos.get(e.from).push(e.to);
  });

  function cartao(pessoa, classe) {
    const node = el("button", {
      class: classe, type: "button",
      title: "Abrir a ficha de " + pessoa.full_name,
      onclick: function () { showResearcher(pessoa.id); },
    }, [
      el("b", { text: pessoa.short_name || pessoa.full_name }),
      el("small", { text: [pessoa.role_label, pessoa.research_line
        ? cut(pessoa.research_line, 26) : null].filter(Boolean).join(" · ") }),
    ]);
    const marcas = el("span", { class: "org-marks" });
    if (pessoa.thesis_due_on) {
      marcas.appendChild(el("span", { class: "org-chip", text: dt(pessoa.thesis_due_on) }));
    }
    if (pessoa.scholarship) {
      marcas.appendChild(el("span", { class: "org-chip soft",
        text: cut(pessoa.scholarship, 18) }));
    }
    if (pessoa.co_advisor) {
      marcas.appendChild(el("span", { class: "org-chip soft",
        text: "coorient.: " + cut(pessoa.co_advisor, 16) }));
    }
    if (marcas.childNodes.length) node.appendChild(marcas);
    return node;
  }

  /* Um orientando que também orienta (o pós-doutorado, quase sempre) aparece
     uma vez só, com a sua gente recuada abaixo dele. */
  const desenhados = new Set();
  function ramo(id, nivel) {
    if (desenhados.has(id) || nivel > 3) return null;
    desenhados.add(id);
    const pessoa = porId.get(id);
    if (!pessoa) return null;
    const linha = el("li", { class: "org-kid n" + Math.min(nivel, 3) },
      cartao(pessoa, "org-card small"));
    const netos = (filhos.get(id) || []).map(function (f) { return ramo(f, nivel + 1); })
      .filter(Boolean);
    if (netos.length) linha.appendChild(el("ul", { class: "org-kids" }, netos));
    return linha;
  }

  const caixa = el("div", { class: "org" });
  const raiz = (org.roots || []).map(function (id) { return porId.get(id); })
    .find(function (p) { return p && p.role === "coordenacao"; });
  if (raiz) {
    desenhados.add(raiz.id);
    caixa.appendChild(el("div", { class: "org-top" }, cartao(raiz, "org-card boss")));
    caixa.appendChild(el("div", { class: "org-stem" }));
  }

  /* Uma coluna por quem orienta -- a coordenação inclusive: ela aparece no
     topo por coordenar, e ganha coluna própria por orientar, que são duas
     coisas diferentes. Sem essa coluna, quem ela orienta sumia do desenho. */
  const colunas = (org.orientadores || []).map(function (o) {
    const pessoa = porId.get(o.id);
    if (!pessoa) return null;
    const ehRaiz = raiz && o.id === raiz.id;
    if (!ehRaiz && desenhados.has(o.id)) return null;
    desenhados.add(o.id);
    const kids = (filhos.get(o.id) || []).map(function (f) { return ramo(f, 1); })
      .filter(Boolean);
    const cabeca = ehRaiz
      ? el("div", { class: "org-card ghost" }, [
        el("b", { text: "Orientação direta" }),
        el("small", { text: pessoa.short_name || pessoa.full_name }),
      ])
      : cartao(pessoa, "org-card");
    return el("div", { class: "org-branch" }, [
      cabeca,
      kids.length ? el("ul", { class: "org-kids" }, kids)
        : el("p", { class: "org-vazio", text: "sem orientandos declarados" }),
    ]);
  }).filter(Boolean);

  const sobra = gente.filter(function (p) { return !desenhados.has(p.id); });
  if (sobra.length) {
    colunas.push(el("div", { class: "org-branch solta" }, [
      el("div", { class: "org-card ghost" }, [
        el("b", { text: "Sem orientação declarada" }),
        el("small", { text: sobra.length + (sobra.length === 1 ? " pessoa" : " pessoas") }),
      ]),
      el("ul", { class: "org-kids" }, sobra.map(function (p) {
        return el("li", { class: "org-kid n1" }, cartao(p, "org-card small"));
      })),
    ]));
  }

  const trilho = el("div", { class: "org-branches" }, colunas);
  /* a barra horizontal precisa nascer no centro da primeira coluna e morrer
     no centro da última: sem saber quantas são, o CSS erraria as duas pontas */
  trilho.style.setProperty("--n", String(Math.max(colunas.length, 1)));
  if (!raiz) trilho.classList.add("sem-topo");
  caixa.appendChild(el("div", { class: "org-scroll" }, trilho));
  return caixa;
}

/* ====================================================================== */
/* formação e prazos                                                      */
/* ====================================================================== */
/* O organograma responde "quem responde a quem". Esta tela responde a
   outra pergunta, que nenhuma das vinte e quatro respondia: QUANDO.

   Bolsa que vence e defesa que chega são os dois únicos compromissos do
   laboratório com data marcada e sem volta -- um artigo atrasado sai no
   mês seguinte, uma bolsa vencida não volta. Até aqui esses dois campos
   estavam no banco, apareciam numa coluna de tabela ordenável, e não
   existia nenhum lugar onde alguém visse "faltam doze dias".

   Quem vê esta tela é só a coordenação: ver bolsa e prazo de defesa de
   uma pessoa é diferente de ver a produção dela, e o corte já estava
   declarado no servidor (ver SO_DA_COORDENACAO em metrics.py). */

/* Quem está em formação. Mesma lista de mapping.ORIENTADOS -- há teste
   que reprova a divergência --, e daqui saem tanto esta tela quanto a
   contagem "em formação" do Resumo, que antes tinha a sua própria cópia
   sem pós-doutorado nem voluntário. */
const EM_FORMACAO = ["pos_doutorado", "doutorando", "mestrando", "bolsista_ic",
  "bolsista_extensao", "voluntario", "graduando"];

/* Situações em que o prazo parou de correr. Contar uma tese defendida
   como "prazo vencido" é transformar quem entregou em pendência. */
const TESE_ENCERRADA = ["concluida", "trancada"];

/* As faixas de urgência. Aqui a cor É estado -- é para isso que a paleta
   de estado existe -- e vem sempre com rótulo e desenho ao lado, porque
   cor sozinha não nomeia nada e não sobrevive a uma impressão. */
const FAIXAS_DE_PRAZO = [
  { id: "vencido", rotulo: "Prazo vencido", cor: "--critical", icone: "aviso",
    cabe: function (d) { return d !== null && d < 0; } },
  { id: "noventa", rotulo: "Vence em até 90 dias", cor: "--warning", icone: "prazo",
    cabe: function (d) { return d !== null && d >= 0 && d <= 90; } },
  { id: "ano", rotulo: "Vence dentro de um ano", cor: "--series-1", icone: "calendario",
    cabe: function (d) { return d !== null && d > 90 && d <= 365; } },
  { id: "longe", rotulo: "Mais de um ano", cor: "--good", icone: "relogio",
    cabe: function (d) { return d !== null && d > 365; } },
  { id: "sem", rotulo: "Sem prazo declarado", cor: "--ink-muted", icone: "aviso",
    cabe: function (d) { return d === null; } },
];

/* Dias que faltam. Negativo é atraso -- e o sinal importa, porque "faltam
   -40 dias" e "venceu há 40 dias" são a mesma conta e leituras diferentes. */
function diasAte(iso) {
  const passados = daysSince(iso);
  return passados === null ? null : -passados;
}
function faixaDe(dias) {
  return FAIXAS_DE_PRAZO.find(function (f) { return f.cabe(dias); }) || FAIXAS_DE_PRAZO[4];
}
/* "faltam 12 dias" / "venceu há 3 meses" / "sem prazo" */
function quantoFalta(dias) {
  if (dias === null) return "sem prazo";
  if (dias < 0) return "venceu há " + dur(-dias);
  if (dias === 0) return "é hoje";
  return "faltam " + dur(dias);
}

view("formacao", "Formação e prazos", "Pessoas e projetos",
  "Bolsa que vence e defesa que chega: o que tem data marcada e não espera "
  + "a próxima reunião.", function (host) {
    const org = D.org || {};

    /* Sem os campos, a tela não tem do que falar -- e o motivo muda a
       frase: ou a coordenação não está logada, ou ninguém declarou nada. */
    if (org.restrito) {
      host.appendChild(el("div", { class: "note", html:
        "<b>Prazos e bolsas são visíveis só para a coordenação.</b> "
        + "Estes campos não viajam no arquivo exportado nem no mural — eles "
        + "aparecem apenas na sessão autenticada de quem coordena. "
        + (LIVE ? "Entre com um acesso de coordenação para vê-los."
          : "Abra o painel pelo servidor do laboratório, com login.") }));
      return;
    }

    const gente = (org.people || []).filter(function (p) {
      return p.active !== 0 && EM_FORMACAO.indexOf(p.role) >= 0; });

    if (!gente.length) {
      host.appendChild(el("div", { class: "note", html:
        "<b>Ninguém em formação no cadastro.</b> Orientandos entram pela "
        + "<a href='/app#equipe'>área do integrante</a>, apontando o orientador. "
        + "Sem isso, nem o organograma nem esta tela têm o que mostrar." }));
      return;
    }

    /* Cada pessoa ganha as duas contas que a tela inteira usa. */
    const linhas = gente.map(function (p) {
      const encerrada = TESE_ENCERRADA.indexOf(p.thesis_status) >= 0;
      const dias = encerrada ? null : diasAte(p.thesis_due_on);
      return {
        id: p.id, nome: p.full_name, vinculo: p.role_label,
        orientador: p.advisor, titulo: p.thesis_title, tipo: p.thesis_kind,
        situacao: p.thesis_status, encerrada: encerrada,
        prazo: encerrada ? null : (p.thesis_due_on || null), dias: dias,
        faixa: encerrada ? null : faixaDe(dias).id,
        bolsa: p.scholarship || null, bolsa_ate: p.scholarship_until || null,
        bolsa_dias: p.scholarship_until ? diasAte(p.scholarship_until) : null,
        linha: p.research_line, artigos: p.n_articles || 0,
      };
    });

    const ativas = linhas.filter(function (r) { return !r.encerrada; });
    const conta = function (teste) { return ativas.filter(teste).length; };
    const vencidos = conta(function (r) { return r.faixa === "vencido"; });
    const noventa = conta(function (r) { return r.faixa === "noventa"; });
    const noAno = conta(function (r) {
      return r.dias !== null && r.dias >= 0 && r.dias <= 365; });
    const semPrazo = conta(function (r) { return r.dias === null; });
    const comBolsa = linhas.filter(function (r) { return r.bolsa; });
    const bolsaVencendo = comBolsa.filter(function (r) {
      return r.bolsa_dias !== null && r.bolsa_dias <= 90; });
    const proxima = ativas.filter(function (r) { return r.dias !== null && r.dias >= 0; })
      .sort(function (a, b) { return a.dias - b.dias; })[0];

    /* ------------------------------ indicadores ------------------------------ */
    const porNivel = counter(gente, function (p) { return p.role_label; });
    host.appendChild(el("div", { class: "grid g5" }, [
      kpi({ label: "Em formação", value: C.fmt(gente.length), icon: "orientacao",
        ir: "organograma", foot: porNivel.length + " níveis de vínculo",
        segmentos: porNivel.slice(0, 4).map(function (x) {
          return { rotulo: x.label, valor: x.value }; }) }),
      kpi({ label: "Entregam em 12 meses", value: C.fmt(noAno), icon: "tese",
        foot: proxima ? "a próxima: " + dt(proxima.prazo) + " · " + quantoFalta(proxima.dias)
          : "nenhuma data à frente" }),
      kpi({ label: "Prazo vencido", value: C.fmt(vencidos), icon: "aviso",
        tone: vencidos ? "bad" : null,
        foot: vencidos ? "sem conclusão registrada" : "nenhum prazo estourado" }),
      kpi({ label: "Bolsa vence em 90 dias", value: C.fmt(bolsaVencendo.length),
        icon: "bolsa",
        foot: comBolsa.length ? "de " + comBolsa.length + " com bolsa declarada"
          : "nenhuma bolsa declarada" }),
      kpi({ label: "Sem prazo declarado", value: C.fmt(semPrazo), icon: "prazo",
        foot: "prazo em branco não cobra" }),
    ]));

    /* ------------------------------ urgência ------------------------------ */
    /* A leitura mais honesta desta tela num parágrafo, antes dos gráficos. */
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "Em que pé está cada prazo",
      "A cor aqui é estado, e não identidade — vem sempre com rótulo ao lado.",
      [
        C.bars({
          items: FAIXAS_DE_PRAZO.map(function (f) {
            return { label: f.rotulo, color: C.token(f.cor),
              value: ativas.filter(function (r) { return r.faixa === f.id; }).length };
          }).filter(function (x) { return x.value > 0; }),
          unit: "pessoa(s)", labelWidth: 220, labelChars: 30, file: "prazos-por-faixa",
          emptyMessage: "Ninguém com trabalho em andamento.",
        }),
        leituraDe(vencidos
          ? { sinal: "desce", forte: vencidos + " prazo(s) vencido(s)",
              texto: "sem conclusão registrada. Prazo vencido que na verdade já "
                + "foi defendido é cadastro desatualizado, não atraso." }
          : (noventa
            ? { sinal: "parado", forte: noventa + " entrega(s) nos próximos 90 dias",
                texto: "e nenhum prazo estourado." }
            : { sinal: "sobe", forte: "Nenhum prazo estourado",
                texto: "e nada vencendo nos próximos 90 dias." })),
      ])));

    /* ------------------------------ calendário ------------------------------ */
    /* Doze meses à frente, mês a mês. A contagem por faixa diz quantos;
       só o calendário diz se eles estão espalhados ou empilhados em
       novembro -- e é isso que decide se a banca cabe na agenda. */
    const hoje = new Date();
    const meses = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
      meses.push({ chave: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"),
        rotulo: C.MESES[d.getMonth()] + (d.getMonth() === 0 || i === 0
          ? "/" + String(d.getFullYear()).slice(2) : "") });
    }
    const noMes = function (lista, campo) {
      return meses.map(function (m) {
        return lista.filter(function (r) {
          return r[campo] && String(r[campo]).slice(0, 7) === m.chave; }).length;
      });
    };
    const defesas = noMes(ativas, "prazo");
    const bolsas = noMes(comBolsa, "bolsa_ate");
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "Os próximos doze meses",
      "Entregas e fins de bolsa, mês a mês. Duas medidas diferentes, duas cores.",
      [
        C.columns({ labels: meses.map(function (m) { return m.rotulo; }),
          series: [
            { label: "Entregas previstas", values: defesas },
            { label: "Bolsas terminando", values: bolsas },
          ],
          height: 230, unit: "pessoa(s)", file: "calendario-da-formacao",
          caption: "prazos declarados nos próximos doze meses" }),
        defesas.concat(bolsas).some(function (v) { return v > 0; }) ? null
          : el("div", { class: "hint", text: "Nenhuma data declarada cai nos "
              + "próximos doze meses." }),
      ].filter(Boolean))));

    /* ------------------------------ bolsas e carga ------------------------------ */
    const porAgencia = counter(comBolsa, "bolsa");
    /* A carga total já está no organograma. O que falta lá é o tempo:
       seis orientandos com entrega em 2029 e três com entrega neste
       semestre são cargas iguais na contagem e nada parecidas na agenda
       de quem vai para a banca. A barra dividida mostra as duas. */
    const orientadores = [];
    counter(gente, function (p) { return p.advisor || "sem orientador apontado"; })
      .forEach(function (o) {
        const seus = gente.filter(function (p) {
          return (p.advisor || "sem orientador apontado") === o.label; });
        const perto = seus.filter(function (p) {
          const d = TESE_ENCERRADA.indexOf(p.thesis_status) >= 0
            ? null : diasAte(p.thesis_due_on);
          return d !== null && d <= 365; }).length;
        orientadores.push({ label: o.label, value: o.value, partes: [
          { rotulo: "entrega em até 12 meses", valor: perto, cor: C.token("--seq-600") },
          { rotulo: "depois disso ou sem prazo", valor: o.value - perto,
            cor: C.token("--seq-200") },
        ] });
      });
    host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
      card("Bolsas por agência", comBolsa.length
        ? "Quem paga a formação da equipe."
        : "Nenhuma bolsa declarada no cadastro.",
        C.bars({ items: topN(porAgencia, 7), mono: true, unit: "bolsista(s)",
          labelWidth: 190, file: "bolsas-por-agencia",
          emptyMessage: "Nenhuma bolsa declarada." })),
      card("De quem é a carga que vence",
        "Cada barra é um orientador; a primeira parte são as entregas dos "
        + "próximos 12 meses.",
        [
          C.bars({ items: orientadores.slice(0, 8), mono: true, unit: "orientando(s)",
            labelWidth: 210, file: "carga-por-orientador",
            emptyMessage: "Ninguém com orientador apontado." }),
          C.legend([
            { label: "Entrega em até 12 meses", color: C.token("--seq-600") },
            { label: "Depois disso ou sem prazo", color: C.token("--seq-200") },
          ]),
        ]),
    ]));

    /* ------------------------------ a agenda ------------------------------ */
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "Agenda de formação",
      "Uma linha por pessoa, da mais urgente para a mais folgada. "
      + "Ordene por qualquer coluna.",
      dataTable({
        file: "formacao", sortKey: "dias", sortDir: 1, pageSize: 20,
        cols: [
          { k: "nome", label: "Pessoa", wide: true, render: function (r) {
            return el("div", {}, [
              r.nome,
              el("small", { text: [r.vinculo, r.orientador ? "orienta: " + r.orientador : null]
                .filter(Boolean).join(" · ") })]); } },
          { k: "titulo", label: "Trabalho", wide: true, render: function (r) {
            return r.titulo ? cut(r.titulo, 56) : "título em definição"; } },
          { k: "situacao", label: "Situação", render: function (r) {
            return TESE_SITUACAO[r.situacao] || r.situacao || "—"; } },
          { k: "prazo", label: "Prazo", render: function (r) { return dt(r.prazo); } },
          { k: "dias", label: "Quanto falta",
            sortValue: function (r) {
              /* sem prazo vai para o fim, e não para o começo: quem não
                 declarou data não é o caso mais urgente da lista */
              return r.dias === null ? 1e9 : r.dias; },
            render: function (r) {
              if (r.encerrada) return el("span", { class: "hint", text: "entregue" });
              const f = faixaDe(r.dias);
              const chip = el("span", { class: "prazo-chip" });
              chip.style.setProperty("--faixa", "var(" + f.cor + ")");
              chip.appendChild(Icons.get(f.icone, 13));
              chip.appendChild(el("span", { text: quantoFalta(r.dias) }));
              return chip; } },
          { k: "bolsa", label: "Bolsa", render: function (r) {
            if (!r.bolsa) return "—";
            return el("div", {}, [r.bolsa, r.bolsa_ate
              ? el("small", { text: "até " + dt(r.bolsa_ate)
                  + " · " + quantoFalta(r.bolsa_dias) })
              : el("small", { text: "sem vigência declarada" })]); } },
        ],
        rows: linhas,
      }))));
  });

const TESE_SITUACAO = {
  em_andamento: "Em andamento", coleta: "Coleta de dados", analise: "Análise de dados",
  qualificacao: "Qualificação", defesa_marcada: "Defesa marcada", concluida: "Concluída",
  trancada: "Trancada",
};

view("linhas", "Linhas de pesquisa", "Pessoas e projetos",
  "Cada linha reúne artigos, pessoas, projetos e atividades. Clique para filtrar o painel.",
  function (host) {
    const rows = D.research_lines || [];
    if (!rows.length) {
      host.appendChild(el("div", { class: "note", html:
        "<b>Nenhuma linha cadastrada ainda.</b> Cadastre em <a href='/app#linhas'>Área do integrante "
        + "→ Linhas de pesquisa</a> ou na aba “Linhas de Pesquisa” da planilha de cadastros." }));
      return;
    }
    host.appendChild(el("div", { class: "grid g3" }, rows.map(function (line) {
      const node = el("div", { class: "card clickable", tabindex: "0" }, [
        el("h3", { text: line.name }),
        el("div", { class: "hint", text: line.description
          || (line.coordinator ? "Coordenação: " + line.coordinator : "—") }),
        el("div", { class: "grid g4", style: "gap:8px;margin-top:14px" }, [

      const fire = function () { STATE.linha = line.name; buildToolbar(); go("producao"); };

    host.appendChild(el("div", { style: "margin-top:16px" }, card(

          { label: "Submetidos", k: "n_submitted", num: true },
          { label: "Publicados", k: "n_published", num: true }], rows: rows },

    /* Radar por ano. Todos os eixos são a mesma coisa — artigos num ano —,
       que é a única situação em que o radar não engana. */
    const anoAtual = new Date().getFullYear();
    const janela = [];
    for (let y = anoAtual - Math.min(D.overview.window, 6) + 1; y <= anoAtual; y++) janela.push(y);
    const todos = articles();
    const perfis = rows.slice(0, 4).map(function (line, i) {

        values: janela.map(function (y) {

      };
    }).filter(function (perfil) {
      return perfil.values.some(function (v) { return v > 0; });
    });
    if (perfis.length && janela.length >= 3) {
      host.appendChild(el("div", { style: "margin-top:16px" }, card(
        "Perfil de cada linha ao longo da janela",
        "Cada eixo é um ano e a unidade é a mesma em todos: artigos. "
        + "Quanto mais para fora, mais produção naquele ano.",

view("publicacoes", "Publicações", "Produção",
  "Estudos publicados, com total e média anual na janela de análise.", function (host) {
    const o = D.overview;
    const published = articles().filter(function (a) { return a.status === "publicado"; });
    const currentYear = new Date().getFullYear();
    const years = [];
    for (let y = currentYear - o.window + 1; y <= currentYear; y++) years.push(y);
    const perYear = years.map(function (y) {
      return published.filter(function (a) { return a.year_published === y; }).length; });
    const total = perYear.reduce(function (a, b) { return a + b; }, 0);
    let running = 0;
    const cumulative = perYear.map(function (v) { running += v; return running; });
    const allYears = Array.from(new Set(published.map(function (a) { return a.year_published; })
      .filter(Boolean))).sort();

    host.appendChild(el("div", { class: "grid g4" }, [

      kpi({ label: "Total no recorte", value: C.fmt(published.length), foot: "todos os anos" }),
      kpi({ label: "Melhor ano",
        value: total ? years[perYear.indexOf(Math.max.apply(null, perYear))] : "—" }),
    ]));

          series: [{ label: "Publicações", values: perYear, color: C.token("--series-1") }],
          file: "publicacoes-ano", height: 220,
          onSelect: function (label) { STATE.ano = label; buildToolbar(); render(); } }),
        C.lines({ labels: years.map(String),
          series: [{ label: "Acumulado", values: cumulative, color: C.token("--series-3"), area: true }],
          height: 170, file: "publicacoes-acumulado" }),
      ]),
      card("Série histórica completa", "Todos os anos com publicação registrada.",
        allYears.length ? C.columns({

            return published.filter(function (a) { return a.year_published === y; }).length; }),

          unit: "artigo(s)", file: "periodicos" }))));

    /* Quem esteve no topo em cada ano. O gráfico lê a inclinação: subiu, caiu
       ou sumiu do quadro. Sem posição num ano, a linha simplesmente não passa por lá. */
    const anosBump = years.filter(function (y, i) { return perYear[i] > 0; });
    if (anosBump.length >= 2) {
      const porAno = anosBump.map(function (y) {
        const doAno = published.filter(function (a) { return a.year_published === y; });
        const contagem = new Map();
        doAno.forEach(function (a) {
          (D.researchers || []).forEach(function (person) {
            const set = MEMBER_ARTICLES.get(person.id);
            if (set && set.has(a.id)) {
              contagem.set(person.id, (contagem.get(person.id) || 0) + 1);
            }

        return Array.from(contagem.entries()).sort(function (a, b) { return b[1] - a[1]; });
      });

      porAno.forEach(function (lista) {
        lista.slice(0, 5).forEach(function (par) { noTopo.add(par[0]); });

          color: C.token("--series-" + ((i % 8) + 1)),
          onClick: function () { showResearcher(id); },
          values: porAno.map(function (lista) {
            const pos = lista.findIndex(function (par) { return par[0] === id; });
            return pos >= 0 && pos < 6 ? pos + 1 : null;

          C.bump({
            labels: anosBump.map(String), series: pessoas, file: "ranking-anual",
            table: {
              cols: [{ label: "Integrante", k: "quem" }].concat(anosBump.map(function (y) {
                return { label: String(y), k: String(y) }; })),
              rows: pessoas.map(function (x) {
                const row = { quem: x.label };
                anosBump.forEach(function (y, i) {
                  row[String(y)] = x.values[i] ? x.values[i] + "º" : "—";
                });
                return row;
              }),
            },
          }))));
      }

    /* A lista do que já saiu. Faltava: a aba Publicações tinha os gráficos
       e nenhuma tabela, e era justamente aqui que alguém ia procurar o
       artigo publicado para abrir. */
