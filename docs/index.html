  list.forEach(function (item) {
    const k = typeof key === "function" ? key(item) : item[key];
    if (k === null || k === undefined || k === "") return;
    map.set(k, (map.get(k) || 0) + 1);
  });
  return Array.from(map, function (pair) { return { label: String(pair[0]), value: pair[1] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
/* nunca gerar uma nona cor: o excedente vira "Outros" */
function topN(items, n) {
  if (items.length <= n) return items;
  const head = items.slice(0, n);
  const tail = items.slice(n).reduce(function (a, b) { return a + b.value; }, 0);
  if (tail) head.push({ label: "Outros (" + (items.length - n) + ")", value: tail, muted: true });
  return head;
}

/* ------------------------------------------------------------- recortes */
const MEMBER_ARTICLES = new Map();
function indexAuthorship() {
  MEMBER_ARTICLES.clear();
  (D.authorship || []).forEach(function (link) {
    if (!MEMBER_ARTICLES.has(link.m)) MEMBER_ARTICLES.set(link.m, new Set());
    MEMBER_ARTICLES.get(link.m).add(link.a);
  });
}
indexAuthorship();

function articles() {
  const set = STATE.integrante ? MEMBER_ARTICLES.get(Number(STATE.integrante)) : null;
  return (D.articles || []).filter(function (a) {
    if (STATE.linha && a.research_line !== STATE.linha) return false;
    if (STATE.ano && String(a.year_published) !== STATE.ano) return false;
    if (STATE.status && a.status !== STATE.status) return false;
    if (set && !set.has(a.id)) return false;
    if (STATE.busca) {
      const hay = ((a.title || "") + " " + (a.authors || "") + " " + (a.journal || "")
        + " " + (a.research_line || "")).toLowerCase();
      if (!hay.includes(STATE.busca)) return false;
    }
    return true;
  });
}
function filtersActive() {
  return !!(STATE.linha || STATE.ano || STATE.integrante || STATE.status || STATE.busca);
}
function segmentOf(article) {
  return DIM_ACCESSOR[STATE.segmento] ? DIM_ACCESSOR[STATE.segmento](article)
    : (STATUS_LABEL[article.status] || article.status);
}

/* ==================================================================== */
/* explorador: as mesmas medidas e dimensões da camada ouro              */
/* ==================================================================== */
const DIM_ACCESSOR = {
  linha: function (a) { return a.research_line || "Sem linha"; },
  status: function (a) { return STATUS_LABEL[a.status] || a.status; },
  ano: function (a) { return a.year_published ? String(a.year_published)
    : (a.started_on ? String(a.started_on).slice(0, 4) : "Sem ano"); },
  ano_publicacao: function (a) { return a.year_published ? String(a.year_published) : "Sem ano"; },
  periodico: function (a) { return a.journal || "Sem periódico"; },
  qualis: function (a) { return a.qualis || "Sem Qualis"; },
  tipo_estudo: function (a) { return a.study_type || "Não informado"; },
  responsavel: function (a) {
    return a.lead_name || (a.authors || "").split(";")[0].trim() || "Sem responsável"; },
  idioma: function (a) { return a.language || "Não informado"; },
  fonte: function (a) { return a.source || "planilha"; },
};
const MEASURE_FN = {
  artigos: function (list) { return list.length; },
  publicados: function (list) {
    return list.filter(function (a) { return a.status === "publicado"; }).length; },
  submetidos: function (list) {
    return list.filter(function (a) { return a.status === "submetido" || a.status === "em_revisao"; }).length; },
  em_producao: function (list) {
    return list.filter(function (a) { return a.status === "em_producao"; }).length; },
  citacoes: function (list) {
    return list.reduce(function (acc, a) { return acc + bestCitations(a); }, 0); },
  citacoes_media: function (list) {
    return list.length ? Math.round(100 * list.reduce(function (acc, a) {
      return acc + bestCitations(a); }, 0) / list.length) / 100 : 0; },
  tentativas: function (list) {
    return list.reduce(function (acc, a) { return acc + (a.submission_attempts || 0); }, 0); },
  recusas: function (list) {
    return list.reduce(function (acc, a) { return acc + (a.rejections || 0); }, 0); },
  dias_ate_publicar: function (list) {
    const v = list.map(function (a) { return a.days_start_to_publication; })
      .filter(function (x) { return x !== null && x !== undefined; });
    return v.length ? Math.round(10 * v.reduce(function (a, b) { return a + b; }, 0) / v.length) / 10 : null; },
  dias_ate_aceite: function (list) {
    const v = list.map(function (a) { return a.days_submission_to_acceptance; })
      .filter(function (x) { return x !== null && x !== undefined; });
    return v.length ? Math.round(10 * v.reduce(function (a, b) { return a + b; }, 0) / v.length) / 10 : null; },
  autores_medio: function (list) {
    return list.length ? Math.round(100 * list.reduce(function (acc, a) {
      return acc + (a.authors ? a.authors.split(";").length : 0); }, 0) / list.length) / 100 : 0; },
};

/* Mesma resposta da rota /api/query, calculada aqui — usada na exportação
   estática e como reserva quando a rede falha. */
function localQuery(measure, by, split) {
  const rows = articles();
  const dimA = DIM_ACCESSOR[by] || DIM_ACCESSOR.linha;
  const fn = MEASURE_FN[measure] || MEASURE_FN.artigos;
  const buckets = new Map();
  rows.forEach(function (a) {
    const k1 = dimA(a);
    const k2 = split ? (DIM_ACCESSOR[split] || DIM_ACCESSOR.status)(a) : null;
    const key = k1 + "␀" + (k2 === null ? "" : k2);
    if (!buckets.has(key)) buckets.set(key, { dim1: k1, dim2: k2, items: [] });
    buckets.get(key).items.push(a);
  });
  const out = Array.from(buckets.values()).map(function (b) {
    const row = { dim1: b.dim1, valor: fn(b.items) };
    if (split) row.dim2 = b.dim2;
    return row;
  }).sort(function (a, b) { return (b.valor || 0) - (a.valor || 0); });
  const cat = (D.catalog && D.catalog.measures || []).find(function (m) { return m.id === measure; });
  const dimCat = (D.catalog && D.catalog.dimensions || []).find(function (m) { return m.id === by; });
  const splitCat = (D.catalog && D.catalog.dimensions || []).find(function (m) { return m.id === split; });
  return {
    measure: measure, measure_label: cat ? cat.label : measure, unit: cat ? cat.unit : "",
    by: by, by_label: dimCat ? dimCat.label : by,
    split: split, split_label: splitCat ? splitCat.label : null,
    rows: out, total: out.reduce(function (a, r) { return a + (r.valor || 0); }, 0),
    local: true,
  };
}

/* ==================================================================== */
/* peças de UI                                                           */
/* ==================================================================== */
function card(title, hint, kids) {
  return el("div", { class: "card" }, [
    title ? el("h3", { text: title }) : null,
    hint ? el("div", { class: "hint", text: hint }) : null,
    el("div", { style: title || hint ? "margin-top:14px" : null },
      Array.isArray(kids) ? kids : [kids]),
  ]);
}
/* {texto, sinal: "sobe"|"desce"|"parado", forte: "trecho em destaque"} */
function leituraDe(spec) {
  if (typeof spec === "string") spec = { texto: spec };
  const node = el("div", { class: "leitura" });
  if (spec.sinal) {
    node.appendChild(el("span", { class: "sinal " + spec.sinal,
      text: spec.sinal === "sobe" ? "▲ " : (spec.sinal === "desce" ? "▼ " : "■ ") }));
  }
  if (spec.forte) node.appendChild(el("b", { text: spec.forte + " " }));
  node.appendChild(document.createTextNode(spec.texto));
  return node;
}

/* Uma curva que se explica.

   Um gráfico de linhas mostra o percurso e cala sobre o percurso: quem
   lê tem de achar a olho onde a série virou, onde duas se cruzaram e
   onde uma passou da meta -- e é exatamente aí que está a notícia.

   Aqui o desenho vem com os três achados marcados em cima da curva e
   escritos por extenso embaixo dela. As frases saem do MESMO corte das
   marcas, então o texto nunca fala de um ponto que o gráfico não está
   marcando.

   `opts.limites` desenha as linhas de referência e também procura as
   travessias delas. */
function linhaAnalitica(spec, opts) {
  opts = opts || {};
  const leitura = C.marcosDaCurva(spec.labels || [], spec.series || [], opts);
  const cheio = {};
  for (const k in spec) cheio[k] = spec[k];
  cheio.marks = (spec.marks || []).concat(leitura.marks);
  if (opts.limites) cheio.limites = opts.limites;
  const grafico = C.lines(cheio);
  if (!leitura.notas.length) return grafico;
  return el("div", {}, [
    grafico,
    el("ul", { class: "achados" }, leitura.notas.map(function (nota) {
      return el("li", { text: nota }); })),
    leitura.total > leitura.notas.length
      ? el("div", { class: "hint", text: "Mostrando os " + leitura.notas.length
          + " achados mais recentes, de " + leitura.total + "." })
      : null,
  ].filter(Boolean));
}

/* O número sobe até o seu valor quando aparece.

   Dá vida ao painel sem custar honestidade, com três cuidados. O texto
   COMEÇA já escrito com o valor final: quem tem o movimento desligado, ou
   um leitor de tela, lê o número certo desde o primeiro quadro -- a
   contagem só acontece por cima de algo que já está correto. Ela dura
   meio segundo e termina exatamente no valor, nunca perto dele. E só
   entra em número puro: "16,3 meses" e "—" ficam como estão, porque
   animar um texto que não é número é remexer em texto.

   Sem a guarda de `prefers-reduced-motion` isto seria exatamente o tipo
   de efeito que atrapalha quem pediu para não ter efeito. */
function contarAte(node, texto) {
  if (typeof texto !== "string" && typeof texto !== "number") return;
  const bruto = String(texto);
  const limpo = bruto.replace(/\./g, "").replace(",", ".");
  const alvo = Number(limpo);
  if (!isFinite(alvo) || alvo <= 0 || !/^[\d.,]+$/.test(bruto)) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const inicio = performance.now();
  const passo = function (agora) {
    const t = Math.min(1, (agora - inicio) / 520);
    /* desacelera no fim: o número chega, não freia de repente */
    const suave = 1 - Math.pow(1 - t, 3);
    node.textContent = t < 1 ? C.fmt(Math.round(alvo * suave)) : bruto;
    if (t < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function kpi(spec) {
  /* Um numero grande num painel de parede levanta sempre a mesma
     pergunta: "quais sao esses treze?". Com `ir`, o cartao inteiro vira
     botao e leva a tabela que responde -- a mesma que ja existe, com
     ordenacao, busca e exportacao. Sem `ir` ele continua sendo um <div>:
     cartao que parece clicavel e nao e custa mais que cartao inerte. */
  const navega = !!spec.ir;
  const node = el(navega ? "button" : "div", {
    class: "kpi" + (spec.hero ? " hero" : "") + (spec.tone ? " t-" + spec.tone : "")
      + (navega ? " clicavel" : ""),
    type: navega ? "button" : null,
    title: navega ? "Abrir " + labelOf(spec.ir) : null,
    onclick: navega ? function () {
      if (spec.filtro) Object.assign(STATE, spec.filtro);
      if (spec.filtro) { buildToolbar(); updateCount(); }
      go(spec.ir);
    } : null,
  });
  const label = el("div", { class: "label" });
  /* o ícone é decorativo: quem nomeia o indicador é o rótulo ao lado */
  if (spec.icon) label.appendChild(Icons.badge(spec.icon,
    spec.tone === "good" ? "bom" : (spec.tone === "bad" ? "critico" : null), null));
  label.appendChild(el("span", { text: spec.label }));
  node.appendChild(label);
  const valor = el("div", { class: "value", text: spec.value });
  node.appendChild(valor);
  contarAte(valor, spec.value);
  if (spec.delta !== undefined && spec.delta !== null && spec.delta !== 0) {
    const up = spec.delta > 0;
    const good = spec.lowerIsBetter ? !up : up;
    node.appendChild(el("span", {
      class: "delta " + (good ? "up" : "down"),
      text: (up ? "▲ " : "▼ ") + dec(Math.abs(spec.delta), spec.deltaDecimals === undefined ? 0 : spec.deltaDecimals)
        + (spec.deltaNote ? " " + spec.deltaNote : ""),
    }));
  }
  /* Do que este número é feito. Um KPI que mostra só o total obriga quem
     lê a abrir outra tela para saber a composição -- e a composição é
     quase sempre a pergunta seguinte: "116 artigos, mas quantos saíram?".
     A faixa responde sem clique nenhum, e a legenda diz qual parte é qual,
     porque cor sozinha não nomeia coisa alguma. */
  const seg = (spec.segmentos || []).filter(function (x) { return x.valor > 0; });
  if (seg.length > 1) {
    const soma = seg.reduce(function (t, x) { return t + x.valor; }, 0);
    const faixa = el("div", { class: "kpi-seg" }, seg.map(function (x, i) {
      const parte = el("i", { title: x.rotulo + ": " + C.fmt(x.valor) });
      parte.style.width = (100 * x.valor / soma).toFixed(2) + "%";
      parte.style.background = x.cor || C.serie(i);
      return parte;
    }));
    node.appendChild(faixa);
    node.appendChild(el("div", { class: "kpi-seg-leg" }, seg.map(function (x, i) {
      const ponto = el("i");
      ponto.style.background = x.cor || C.serie(i);
      return el("span", {}, [ponto, el("span", { text: x.rotulo + " " + C.fmt(x.valor) })]);
    })));
  }
  if (spec.foot) node.appendChild(el("div", { class: "foot", text: spec.foot }));
  if (navega) {
    const seta = el("span", { class: "kpi-ir", "aria-hidden": "true" },
      [Icons.get("proximo", 13), el("span", { text: labelOf(spec.ir) })]);
    node.appendChild(seta);
  }
  /* minigráfico só quando ele diz alguma coisa: uma linha reta em zero é ruído */
  const spark = spec.spark || [];
  if (spark.length > 1 && Math.max.apply(null, spark) > 0) {
    node.appendChild(el("div", { class: "spark" }, C.sparkline(spark, { color: spec.sparkColor })));
  }
  /* A leitura fecha o cartão. É a frase curta que diz o que o número quer
     dizer — sem ela, cada pessoa que olha o painel interpreta por conta
     própria, e cada uma interpreta de um jeito. */
  if (spec.leitura) node.appendChild(leituraDe(spec.leitura));
  return node;
}

/* Tabela dinâmica: ordena, busca, pagina e exporta. */
function dataTable(spec) {
  const cols = spec.cols;
  const all = spec.rows || [];
  if (!all.length) return el("div", { class: "tw" }, C.empty(spec.emptyMessage));
  const state = { key: spec.sortKey || null, dir: spec.sortDir || -1, page: 0,
    size: spec.pageSize || 25, term: "" };
  const wrap = el("div");
  const tableBox = el("div", { class: "tw" });
  const tbody = el("tbody");
  const foot = el("div", { class: "tfoot" });

  function filtered() {
    if (!state.term) return all;
    return all.filter(function (row) {
      return cols.some(function (c) {
        const v = c.sortValue ? c.sortValue(row) : row[c.k];
        return v !== null && v !== undefined && String(v).toLowerCase().includes(state.term);
      });
    });
  }
  function sorted(rows) {
    if (!state.key) return rows;
    const col = cols.find(function (c) { return (c.k || c.label) === state.key; });
    return rows.slice().sort(function (a, b) {
      const va = col.sortValue ? col.sortValue(a) : a[col.k];
      const vb = col.sortValue ? col.sortValue(b) : b[col.k];
      if (va === vb) return 0;
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * state.dir;
      return String(va).localeCompare(String(vb), "pt-BR") * state.dir;
    });
  }
  function paint() {
    const rows = sorted(filtered());
    const pages = Math.max(1, Math.ceil(rows.length / state.size));
    state.page = Math.min(state.page, pages - 1);
    const slice = rows.slice(state.page * state.size, (state.page + 1) * state.size);
    tbody.innerHTML = "";
    slice.forEach(function (row, i) {
      /* A tabela entra linha a linha, como as marcas do grafico entram
         barra a barra. Nao e enfeite: `paint()` roda de novo a cada
         ordenacao, a cada filtro, a cada troca de pagina e a cada vez que
         o servidor avisa que o dado mudou -- e sem o movimento, trocar a
         ordem de uma tabela de doze linhas nao se distingue de nada ter
         acontecido. O `--passo` e o mesmo dos graficos, com o mesmo teto:
         a partir da decima linha o atraso para de crescer, senao uma
         pagina de cinquenta levaria dois segundos para terminar. */
      const tr = el("tr", spec.onRow ? { class: "clickable entra-linha", tabindex: "0" }
                                     : { class: "entra-linha" });
      tr.style.setProperty("--passo", String(i));
      if (spec.onRow) {
        tr.addEventListener("click", function () { spec.onRow(row); });
        tr.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); spec.onRow(row); }
        });
      }
      cols.forEach(function (c) {
        const td = el("td", { class: [c.num ? "num" : "", c.wide ? "title" : ""].join(" ").trim() || null });
        const value = c.render ? c.render(row, state.page * state.size + i) : row[c.k];
        if (value instanceof Node) td.appendChild(value);
        else td.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    foot.innerHTML = "";
    foot.appendChild(el("span", {
      text: rows.length + (rows.length === 1 ? " registro" : " registros")
        + (pages > 1 ? " · página " + (state.page + 1) + " de " + pages : ""),
    }));
    const pager = el("div", { class: "pager" });
    if (pages > 1) {
      pager.appendChild(el("button", { type: "button", text: "‹", disabled: state.page === 0,
        "aria-label": "Página anterior", onclick: function () { state.page -= 1; paint(); } }));
      pager.appendChild(el("button", { type: "button", text: "›", disabled: state.page >= pages - 1,
        "aria-label": "Próxima página", onclick: function () { state.page += 1; paint(); } }));
    }
    pager.appendChild(el("button", {
      type: "button", text: "CSV", class: "no-print",
      onclick: function () {
        C.csv((spec.file || "lape") + ".csv", cols.map(function (c) {
          return { label: c.label, get: c.sortValue || function (row) { return row[c.k]; } };
        }), rows);
      },
    }));
    foot.appendChild(pager);
  }

  const head = el("tr", {}, cols.map(function (c) {
    const key = c.k || c.label;
    const th = el("th", { class: (c.num ? "num " : "") + (c.k || c.sortValue ? "sortable" : "") });
    th.appendChild(document.createTextNode(c.label));
    const dirMark = el("span", { class: "dir", text: "" });
    th.appendChild(dirMark);
    if (c.k || c.sortValue) {
      th.addEventListener("click", function () {
        state.dir = state.key === key ? -state.dir : -1;
        state.key = key;
        head.querySelectorAll(".dir").forEach(function (x) { x.textContent = ""; });
        dirMark.textContent = state.dir === 1 ? "▲" : "▼";
        paint();
      });
    }
    return th;
  }));
  tableBox.appendChild(el("table", {}, [el("thead", {}, head), tbody]));

  if (spec.search !== false) {
    wrap.appendChild(el("div", { class: "rowbar" }, [
      spec.title ? el("h3", { text: spec.title }) : el("span"),
      el("input", { class: "search no-print", type: "search",
        placeholder: spec.searchPlaceholder || "Filtrar nesta tabela…",
        "aria-label": "Filtrar tabela",
        oninput: function (ev) { state.term = ev.target.value.toLowerCase(); state.page = 0; paint(); } }),
    ]));
  }
  wrap.appendChild(tableBox);
  wrap.appendChild(foot);
  paint();
  return wrap;
}

  content.push(dataTable({
    search: false, pageSize: 12, sortKey: "year_published",
    file: "artigos-" + (person.short_name || person.full_name),
    cols: [
      { k: "title", label: "Título", wide: true, render: function (r) {
        return el("div", {}, [cut(r.title, 68),
          el("small", { text: [r.journal, r.year_published].filter(Boolean).join(" · ") })]);
      } },
      { k: "status", label: "Situação", render: function (r) { return badge(r.status); } },
      { label: "Citações", num: true, sortValue: bestCitations,
        render: function (r) { return bestCitations(r) || "—"; } },
    ],
    rows: own, emptyMessage: "Sem artigos registrados.",
  }));
  if (person.coauthors && person.coauthors.length) {
    content.push(el("h4", { text: "Coautores mais frequentes" }));

  content.push(el("div", { class: "drawer-actions" }, [

}

/* ==================================================================== */
/* onde o artigo mora fora daqui                                         */
/* ==================================================================== */
/* Nada disto é cadastrado à mão: o endereço de cada base se monta do
   identificador que o artigo já tem. Um DOI vira o endereço do próprio
   artigo na editora; o id do Scopus vira o registro no Scopus; e assim por
   diante. Onde não há identificador nenhum, sobra a busca pelo título — que
   não é o artigo, e por isso vem rotulada como busca, não como link. */
/* 10.5555 é o prefixo que a Crossref reserva para teste: nenhum DOI que
   comece assim existe de verdade. É o que a massa de demonstração usa, e
   por isso ele nunca é oferecido como "abrir o artigo" — um link que leva
   à página de erro do doi.org parece defeito do sistema, não dado de
   mentira. */
function doiDeExemplo(doi) { return /^10\.5555\//.test(doi); }

function linksDoArtigo(a) {
  const links = [];
  const doi = (a.doi || "").replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").trim();
  if (doi && !doiDeExemplo(doi)) {
    links.push({ rotulo: "Abrir o artigo", icone: "livro", forte: true,
      titulo: "Página do artigo na editora, pelo DOI " + doi,
      url: "https://doi.org/" + encodeURI(doi) });
  }
  if (a.url && a.url !== "https://doi.org/" + doi && !doiDeExemplo(
        a.url.replace(/^https?:\/\/(dx\.)?doi\.org\//i, ""))) {
    links.push({ rotulo: doi ? "Link cadastrado" : "Abrir o artigo", icone: "conectar",
      forte: !doi, url: a.url });
  }
  if (a.scopus_id) {
    links.push({ rotulo: "Scopus", icone: "citacao",
      url: "https://www.scopus.com/record/display.uri?origin=resultslist&eid="
        + encodeURIComponent(a.scopus_id) });
  }
  if (a.wos_id) {
    links.push({ rotulo: "Web of Science", icone: "citacao",
      url: "https://www.webofscience.com/wos/woscc/full-record/"
        + encodeURIComponent(a.wos_id) });
  }
  if (doi && !doiDeExemplo(doi)) {
    links.push({ rotulo: "OpenAlex", icone: "dados",
      url: "https://openalex.org/works/doi:" + encodeURI(doi) });
  }
  if (!links.length && a.title) {
    const termo = encodeURIComponent('"' + a.title + '"');
    links.push({ rotulo: "Procurar no Google Acadêmico", icone: "explorar", busca: true,
      url: "https://scholar.google.com/scholar?q=" + termo });
    links.push({ rotulo: "Procurar na PubMed", icone: "explorar", busca: true,
      url: "https://pubmed.ncbi.nlm.nih.gov/?term=" + termo });
  }
  return links;
}

/* Um ícone discreto ao lado do título: um clique e a pessoa está no artigo,
   sem passar pela ficha.

   Quando não há endereço certo, o ícone continua ali — só que de lupa, e
   dizendo que é busca. A primeira versão não mostrava nada nesse caso, e
   uma linha sem ícone nenhum não explica coisa alguma: quem procurava o
   link concluía que ele estava quebrado. */
function atalhoExterno(a) {
  const destino = linksDoArtigo(a)[0];
  if (!destino) return null;
  const link = el("a", {
    href: destino.url, target: "_blank", rel: "noopener",
    class: destino.busca ? "atalho-externo busca" : "atalho-externo",
    title: destino.busca
      ? "Sem DOI cadastrado: procura o título nas bases, em vez de abrir o artigo"
      : (destino.titulo || destino.rotulo),
    "aria-label": destino.rotulo + ": " + cut(a.title, 60),
    onclick: function (ev) { ev.stopPropagation(); },   /* não abre a ficha junto */
  }, Icons.get(destino.busca ? "explorar" : "conectar", 13));
  return link;
}

/* A coluna de título com o atalho ao lado. Existe para o atalho aparecer
   em toda tabela de artigo, e não só numa: era o que estava acontecendo. */
function tituloComAtalho(r, subtitulo) {
  return el("div", {}, [
    el("div", { class: "com-atalho" }, [el("span", { text: r.title }), atalhoExterno(r)]),
    subtitulo ? el("small", { text: subtitulo }) : null,
  ]);
}

/* Por que não há link — em português, e específico. "Sem DOI cadastrado"
   não ajuda quem tem um artigo que ainda está sendo escrito: nesse caso o
   DOI não existe em lugar nenhum, e não há o que cadastrar. */
function porQueNaoHaLink(a) {
  if (a.status === "publicado") {
    return "Publicado, mas sem DOI nem identificador de base cadastrado. "
      + "Cadastre o DOI na ficha do artigo, ou rode o rastreador para ele "
      + "buscar pelo título — daí o link passa a abrir o artigo direto.";
  }
  return "O DOI só passa a existir quando a revista publica o artigo. "
    + "Enquanto ele estiver em produção ou em avaliação, não há endereço "
    + "para abrir — o que vai acima é uma busca pelo título.";
}

function showArticle(article) {
  const content = [
    el("div", { class: "drawer-sub", text: article.authors || "—" }),
    el("div", { style: "margin:12px 0;display:flex;gap:6px;flex-wrap:wrap" }, [
      badge(article.status),
      article.research_line ? el("span", { class: "badge", text: article.research_line }) : null,
      article.qualis ? el("span", { class: "badge", text: "Qualis " + article.qualis }) : null,
    ]),
    el("div", { class: "grid g4", style: "margin:14px 0" }, [
      kpi({ label: "Tentativas", value: C.fmt(article.submission_attempts || 0) }),
      kpi({ label: "Recusas", value: C.fmt(article.rejections || 0) }),
      kpi({ label: "Citações", value: bestCitations(article) || "—" }),
      kpi({ label: "Início→pub.", value: dur(article.days_start_to_publication) }),
    ]),
  ];
  const marcos = [
    ["Início", article.started_on], ["1ª submissão", article.first_submission_on],
    ["Aceite", article.accepted_on], ["Publicação", article.published_on],
  ].filter(function (p) { return p[1]; });
  if (marcos.length > 1) {
    const first = new Date(marcos[0][1]).getTime();
    content.push(el("h4", { text: "Linha do tempo do manuscrito" }));
    content.push(C.bars({
      items: marcos.map(function (m, i) {
        return { label: m[0], value: Math.round((new Date(m[1]).getTime() - first) / 86400000),
          note: dt(m[1]), color: C.ord(i) };
      }),
      labelWidth: 140, unit: "dias desde o início", rowH: 26,
      caption: "Dias decorridos desde o início do artigo.",
    }));
  }
  const facts = [
    ["Código interno", article.internal_code], ["Periódico", article.journal],
    ["Fator de impacto", article.impact_factor], ["Tipo de estudo", article.study_type],
    ["Responsável", article.lead_name], ["Início", dt(article.started_on)],
    ["1ª submissão", dt(article.first_submission_on)], ["Aceite", dt(article.accepted_on)],
    ["Publicação", dt(article.published_on)], ["WoS", article.wos_citations],
    ["Scopus", article.scopus_citations], ["OpenAlex", article.openalex_citations],
  ].filter(function (p) { return p[1] !== null && p[1] !== undefined && p[1] !== "—" && p[1] !== ""; });
  const dl = el("dl", { class: "facts" });
  facts.forEach(function (pair) {
    dl.appendChild(el("dt", { text: pair[0] }));
    dl.appendChild(el("dd", { text: String(pair[1]) }));
  });
  content.push(el("h4", { text: "Ficha" }));
  content.push(dl);
  const destinos = linksDoArtigo(article);
  if (destinos.length) {
    content.push(el("h4", { text: destinos[0].busca ? "Procurar o artigo" : "Onde ler" }));
    /* Âncora de verdade, não `window.open`: bloqueador de pop-up derruba
       janela aberta por script, e aí o botão não faz nada -- que é como um
       link quebrado se parece. Com <a> ainda dá para abrir em outra aba e
       copiar o endereço. */
    content.push(el("div", { class: "drawer-actions" }, destinos.map(function (d) {
      const link = el("a", { href: d.url, target: "_blank", rel: "noopener",
        class: "botao-destino" + (d.forte ? " primary" : ""),
        title: d.titulo || null });
      link.appendChild(Icons.get(d.icone, 15));
      link.appendChild(el("span", { text: d.rotulo }));
      return link;
    })));
    if (destinos[0].busca) {
      content.push(el("div", { class: "hint", style: "margin-top:8px",
        text: porQueNaoHaLink(article) }));
    }
  }
  openDrawer(cut(article.title, 90), content);
}

function buildToolbar() {
  const bar = document.getElementById("toolbar");
  bar.innerHTML = "";
  const years = Array.from(new Set((D.articles || [])
    .map(function (a) { return a.year_published; }).filter(Boolean)))
    .sort(function (a, b) { return b - a; });
  const lines = (D.research_lines || []).map(function (l) { return l.name; });
  const people = (D.researchers || []).filter(function (r) { return r.n_articles > 0; });

  function select(placeholder, options, key, label) {
    const node = el("select", { "aria-label": label,
      onchange: function (ev) { STATE[key] = ev.target.value; render(); } });
    node.appendChild(el("option", { value: "", text: placeholder }));
    options.forEach(function (opt) {
      const value = typeof opt === "object" ? opt.value : opt;
      const text = typeof opt === "object" ? opt.label : opt;
      node.appendChild(el("option", { value: value, text: text }));
    });

  /* o ano é o filtro que todo mundo procura primeiro: fica em botões */
  const yearGroup = el("div", { class: "segmented", role: "group", "aria-label": "Ano" });
  [{ value: "", label: "Todos" }].concat(years.slice(0, 6).map(function (y) {
    return { value: String(y), label: String(y) };
  })).forEach(function (opt) {
    yearGroup.appendChild(el("button", {
      type: "button", text: opt.label, class: STATE.ano === opt.value ? "on" : null,
      "aria-pressed": String(STATE.ano === opt.value),
      onclick: function () { STATE.ano = opt.value; buildToolbar(); render(); },
    }));
  });

  bar.appendChild(el("span", { class: "flabel", text: "Ano" }));
  bar.appendChild(yearGroup);
  bar.appendChild(select("Todas as linhas", lines, "linha", "Linha de pesquisa"));
  bar.appendChild(select("Todas as situações",
    STATUS_ORDER.map(function (x) { return { value: x, label: STATUS_LABEL[x] }; }),
    "status", "Situação"));
  bar.appendChild(select("Todos os integrantes",
    people.map(function (p) { return { value: String(p.id), label: p.short_name || p.full_name }; }),
    "integrante", "Integrante"));
  const campoBusca = el("input", {
    class: "search", id: "busca", type: "search", value: STATE.busca, "aria-label": "Buscar",
    placeholder: "Buscar título, autor, revista…",
    oninput: function (ev) { STATE.busca = ev.target.value.toLowerCase(); render(); },
  });
  bar.appendChild(el("div", { class: "buscabox" }, [
    Icons.get("explorar", 15), campoBusca,
    el("kbd", { class: "atalho", text: "/" }),
  ]));
  bar.appendChild(el("button", { class: "clear", type: "button", text: "Limpar",
    disabled: !filtersActive(),
    onclick: function () {
      STATE.linha = STATE.ano = STATE.integrante = STATE.status = STATE.busca = "";
      buildToolbar();
      render();
    } }));

  const segSelect = select("", SEGMENTOS.map(function (x) {
    return { value: x.id, label: x.label }; }), "segmento", "Segmentar por");
  segSelect.value = STATE.segmento;
  bar.appendChild(el("div", { class: "segwrap" }, [
    el("span", { class: "flabel", text: "Segmentar por" }), segSelect]));
  bar.appendChild(el("span", { class: "fcount", id: "fcount" }));
  updateCount();
}

/* O laboratório inteiro numa página.

   O painel é navegado: vinte e uma telas, uma de cada vez, cada uma
   respondendo bem a uma pergunta. Isso serve para trabalhar e não serve
   para olhar -- quem chega querendo saber como o laboratório está teria
   de percorrer seis seções e juntar de cabeça.

   Esta tela é o contrário: tudo à vista, cada cartão com UMA pergunta e a
   resposta lida em segundos. O que ela não é: um amontoado de números. Um
   número sozinho não informa -- 13 publicações é muito ou pouco conforme
   a meta, o ano anterior e o tamanho da equipe --, então cada cartão traz
   a leitura junto, que é o que o modelo que inspirou esta tela não tinha. */
/* Qual curva está sendo lida -- e a escolha vale para as DUAS telas que
   a leem, o Resumo e o "Cálculo da curva". Quem troca para "Citações" no
   Resumo e abre o cálculo completo encontra Citações lá: a alternativa
   seria a tela de detalhe mostrar outra curva que não a que fez a pessoa
   clicar. */
const ESTADO_DO_CALCULO = { serie: "acervo" };

/* A leitura em cálculo, em tamanho de canto de tela.

   Os mesmos números da tela "Cálculo da curva" -- velocidade, aceleração,
   limiar e acumulado -- no lugar onde o painel já é olhado todo dia. A
   tela cheia continua existindo, com a curva, a derivada trecho a trecho
   e a explicação de cada operação; daqui sai o link para ela.

   O CÁLCULO NÃO MORA AQUI, nem aqui nem lá: vem de `/api/curva`, que
   chama o `estatistica.py`. Refazer a derivada em JavaScript daria duas
   implementações da mesma conta, e elas divergiriam no dia em que alguém
   consertasse uma só.

   Sem API -- que é o caso da página estática exportada -- o bloco
   simplesmente não aparece. Não fica um recado de erro no cartão de
   identidade do laboratório por causa de um enfeite. */
function leituraEmCalculo() {
  const bloco = el("div", {});

  function desenhar(d) {
    bloco.textContent = "";
    bloco.setAttribute("class", "leitura-calculo");
    const serie = d.serie || {};

    const escolha = el("select", { "aria-label": "Curva a ler",
      onchange: function (ev) {
        ESTADO_DO_CALCULO.serie = ev.target.value;
        buscar();
      } },
      (d.disponiveis || []).map(function (x) {
        return el("option", { value: x.code, text: x.rotulo,
          selected: x.code === serie.code ? "selected" : null });
      }));
    bloco.appendChild(el("div", { class: "topo" }, [
      el("span", { class: "lab", text: "COMO VAI" }), escolha]));

    if (d.aviso) {
      bloco.appendChild(el("div", { class: "hint", text: d.aviso }));
      return;
    }

    /* ---- velocidade: o último trecho da derivada ---- */
    /* `derivada.agora` não existe: `taxa_de_variacao` devolve `trechos` e
       `geral`, e a velocidade de agora é o último trecho. Ler `.agora`
       aqui daria `undefined` e o medidor desenharia zero -- que se lê
       "parado", e é outra coisa. */
    const taxas = (d.derivada && d.derivada.trechos) || [];
    const vel = taxas.length ? taxas[taxas.length - 1].taxa : null;
    /* A régua é o maior ritmo da própria janela, e não um número redondo
       escolhido por mim: a agulha em 60% do próprio recorde diz algo; em
       60% de um 20 inventado, não diz nada. É a mesma régua da tela
       cheia, de propósito -- dois medidores da mesma coisa com escalas
       diferentes fazem a pessoa achar que os números discordam. */
    const teto = Math.max.apply(null, taxas.map(function (t) {
      return Math.abs(t.taxa); }).concat([1]));
    const ace = d.aceleracao || {};
    const limiteAce = Math.max.apply(null, (ace.trechos || []).map(function (t) {
      return Math.abs(t.aceleracao); }).concat([1]));

    const medidores = el("div", { class: "medidores" });
    /* Sem unidade DENTRO destes dois: a 146px de largura, "publicações/ano³"
       não cabe no desenho e vaza para fora do quadro. A unidade vai na
       frase abaixo, onde a linha tem a largura do cartão -- e a legenda de
       cada medidor já diz qual dos dois é qual. */
    medidores.appendChild(vel === null
      ? C.empty("sem dois anos não há velocidade")
      : C.gauge({ value: Math.max(0, vel), max: Math.ceil(teto),
          display: (vel > 0 ? "+" : "") + C.fmt(vel),
          color: C.token(vel < 0 ? "--div-neg-4" : "--accent-strong"),
          caption: "velocidade" }));
    medidores.appendChild(ace.agora === null || ace.agora === undefined
      ? C.empty("sem três anos não há aceleração")
      : C.acelerometro({ value: ace.agora, limite: Math.ceil(limiteAce),
          caption: "aceleração" }));
    bloco.appendChild(medidores);

    /* ---- a frase, que é o que a pessoa de fato lê ---- */
    /* Subir e perder força ao mesmo tempo é o caso que o número sozinho
       esconde, e é o caso mais comum num laboratório que vem crescendo. */
    const sobe = vel !== null && vel > 0, desce = vel !== null && vel < 0;
    const freia = ace.agora < 0, ganha = ace.agora > 0;
    bloco.appendChild(leituraDe({
      sinal: vel === null ? "parado" : (sobe ? "sobe" : (desce ? "desce" : "parado")),
      forte: vel === null ? "sem leitura"
        : (sobe ? "+" : "") + C.fmt(vel) + " " + (serie.unidade_taxa || "por ano"),
      texto: vel === null ? ""
        : (sobe && freia ? "— ainda sobe, mas cada ano sobe menos"
           : (sobe && ganha ? "— e ganhando força"
              : (desce && ganha ? "— ainda desce, mas a queda diminui"
                 : (desce && freia ? "— e caindo mais rápido"
                    : "— ritmo constante")))),
    }));

    /* O velocímetro trava em zero para baixo -- ele mede quanto de um
       alvo se andou, e andar menos que nada não existe. Com ritmo
       negativo o ponteiro encosta no zero, e ponteiro no zero se lê
       "parado", que é outra coisa: o número ao lado é o que vale. A tela
       cheia diz isso num aviso; aqui cabe uma linha. */
    if (desce) {
      bloco.appendChild(el("div", { class: "note warn", text:
        "o ponteiro encosta no zero porque a escala começa nele — "
        + "a curva está descendo" }));
    }

    if (ace.agora !== null && ace.agora !== undefined) {
      bloco.appendChild(el("div", { class: "hint", text: "aceleração: "
        + (ace.agora > 0 ? "+" : "") + C.fmt(ace.agora) + " "
        + (serie.unidade_aceleracao || "por ano²") }));
    }

    /* ---- limiar: só o que a coordenação declarou ---- */
    if (d.limiar) {
      bloco.appendChild(leituraDe({
        sinal: d.limiar.terminou_do_lado_bom ? "sobe" : "desce",
        forte: d.limiar.terminou_do_lado_bom ? "acima da meta" : "abaixo da meta",
        texto: "de " + C.fmt(d.limiar.valor) + " " + (serie.unidade || ""),
      }));
    } else {
      /* Sem meta declarada não se inventa linha de corte. Uma linha num
         número redondo que ninguém escolheu é pior que nenhuma: quem olha
         supõe que o laboratório a declarou, e passa a se comparar com ela. */
      bloco.appendChild(el("div", { class: "hint",
        text: "sem meta declarada para esta curva" }));
    }

    /* ---- acumulado: integral onde ela significa algo, soma onde não ---- */
    /* "acumulado na janela: 50 publicações", e não "50 publicações
       somados": o particípio teria de concordar com a unidade, que muda
       de série para série -- publicações e citações são femininas,
       artigos-ano é masculino. Com a unidade no fim da frase, não há
       concordância para errar. */
    const acum = d.integral && d.integral.incremental !== null
      ? "acumulado na janela: " + C.fmt(d.integral.incremental)
        + " " + (d.integral.unidade || "")
      : (d.soma ? "acumulado na janela: " + C.fmt(d.soma.total)
          + " " + d.soma.unidade : null);
    if (acum) bloco.appendChild(el("div", { class: "hint", text: acum }));

    bloco.appendChild(el("button", { class: "ghost mini", type: "button",
      onclick: function () { go("calculo"); } },
      [el("span", { text: "ver o cálculo completo" }), Icons.get("proximo", 13)]));
  }

  function buscar() {
    fetch("/api/curva?serie=" + encodeURIComponent(ESTADO_DO_CALCULO.serie || "acervo"),
          { headers: { Accept: "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) desenhar(d); })
      .catch(function () { /* sem API, sem bloco -- e sem recado de erro */ });
  }
  buscar();
  return bloco;
}

view("resumo", "Resumo", "", "O laboratório inteiro numa página: onde está, "
  + "para onde vai e o que vence primeiro.", function (host) {
    const o = D.overview || {};
    const M = D.metas || {};
    const rows = articles();
    const publicados = rows.filter(function (a) { return a.status === "publicado"; });
    const ano = new Date().getFullYear();
    const noAno = publicados.filter(function (a) {
      return Number(a.year_published) === ano; }).length;
    const anterior = publicados.filter(function (a) {
      return Number(a.year_published) === ano - 1; }).length;

    /* ---------------- identidade ---------------- */
    /* O nome, a instituição e o lema ocupam uns 180px, e este cartão é
       esticado pela grade até a altura do vizinho -- que é o cartão dos
       indicadores, alto. Sobravam uns 320px de cartão vazio no canto mais
       visível da primeira tela do painel, e cartão vazio num painel de
       parede não se lê como "sobrou espaço": lê-se como "não carregou".
       O espaço agora leva a leitura em cálculo da curva do laboratório. */
    const capa = el("div", { class: "card resumo-capa" }, [
      el("div", { class: "marca" }, [
        Icons.badge("painel", null, 30),
        el("div", {}, [
          el("h3", { style: "margin:0", text: o.lab_name || "LAPE" }),
          el("div", { class: "hint", text: o.institution || "" }),
        ]),
      ]),
      el("p", { class: "lema", text: "Ciência para pessoas mais ativas e saudáveis." }),
      el("div", { class: "hint", text: "Atualizado em " + dt(o.generated_at) }),
      leituraEmCalculo(),
    ]);

    /* ---------------- números ---------------- */
    const numero = function (valor, rotulo, pe) {
      return el("div", { class: "resumo-num" }, [
        el("b", { text: C.fmt(valor) }),
        el("span", { text: rotulo }),
        pe ? el("i", { text: pe }) : null,
      ].filter(Boolean));
    };
    /* Contagem sozinha não informa. O que se quer saber olhando este
       cartão não é quantos manuscritos estão em produção -- é se eles
       estão andando, e a mediana da idade responde isso: metade está há
       mais tempo do que ela na bancada. */
    const emEscrita = rows.filter(function (a) { return a.status === "em_producao"; });
    const idadeMediana = median(emEscrita.map(function (a) {
      return daysSince(a.started_on); }).filter(function (d) { return d !== null; }));
    /* A série por ano e a meta são usadas pelos indicadores E pelo gráfico
       de produção; ficam aqui em cima, antes dos dois. */
    const anos = [];
    for (let y = ano - 5; y <= ano; y++) anos.push(y);
    const serie = anos.map(function (y) {
      return publicados.filter(function (a) { return Number(a.year_published) === y; }).length;
    });
    const metaPub = (M.indicadores || []).find(function (i) {
      return i.codigo === "publicacoes"; }) || {};
    const variacao = anterior ? Math.round(100 * (noAno - anterior) / anterior) : null;

    /* Indicadores, e não números soltos. Cada um traz de que é feito
       (a faixa), como vem se comportando (o minigráfico) e quanto mudou
       (a variação) -- que é o que separa um número exibido de um número
       lido. */
    const porAno = function (filtro) {
      return anos.map(function (y) {
        return rows.filter(function (a) {
          return Number(a.year_published) === y && filtro(a); }).length; });
    };
    const citTotal = Math.max(o.scopus_total || 0, o.wos_total || 0, o.openalex_total || 0);
    const campoCit = (o.scopus_total || 0) >= (o.wos_total || 0)
      ? "scopus_citations" : "wos_citations";
    const citPorAno = anos.map(function (y) {
      return rows.filter(function (a) { return Number(a.year_published) === y; })
        .reduce(function (t, a) { return t + (a[campoCit] || a.openalex_citations || 0); }, 0);
    });
    const orientandos = (D.members || []).filter(function (m) {
      return !m.is_external && m.active !== 0 && !m.left_on
        && EM_FORMACAO.indexOf(m.role) >= 0; }).length;

    const numeros = card("O LAPE em números", "toda a produção registrada", [
      el("div", { class: "grid g3" }, [
        kpi({ label: "Artigos", value: C.fmt(rows.length), icon: "producao",
          ir: "explorar", foot: "registrados no banco",
          segmentos: [
            { rotulo: "publicados", valor: o.n_published || 0 },
            { rotulo: "em produção", valor: o.n_in_progress || 0 },
            { rotulo: "em avaliação", valor: o.n_submitted || 0 },
          ] }),
        kpi({ label: "Publicados em " + ano, value: C.fmt(noAno), icon: "livro",
          ir: "publicacoes",
          delta: anterior ? noAno - anterior : null, deltaNote: "vs " + (ano - 1),
          spark: porAno(function (a) { return a.status === "publicado"; }),
          sparkColor: C.token("--accent-strong"),
          foot: metaPub.meta ? "meta do ano: " + metaPub.meta : "sem meta declarada" }),
        /* O minigráfico deste cartão DESCE, e descia sem explicação: são
           citações por ano de PUBLICAÇÃO, e o artigo de 2026 ainda não
           teve tempo de ser citado. Sem a frase, a linha caindo se lê
           como perda de qualidade -- e é o contrário: é o trabalho novo
           aparecendo baixo por ser novo. */
        kpi({ label: "Citações", value: C.fmt(citTotal), icon: "citacao",
          ir: "citacoes", spark: citPorAno, sparkColor: C.token("--accent-strong"),
          foot: citTotal ? "na melhor base disponível" : "nenhuma base respondeu ainda",
          leitura: citTotal ? { sinal: "parado", forte: "por ano de publicação",
            texto: "— o ano recente aparece baixo por ser recente, e não por ser fraco" }
            : null }),
        kpi({ label: "Pessoas", value: C.fmt((o.n_members || 0) + (o.n_collaborators || 0)),
          icon: "pessoas", ir: "pesquisadores",
          foot: orientandos + " em formação",
          segmentos: [
            { rotulo: "do LAPE", valor: o.n_members || 0 },
            { rotulo: "coautores", valor: o.n_collaborators || 0 },
          ] }),
      ]),
      idadeMediana !== null && emEscrita.length
        ? leituraDe({ sinal: "parado", forte: "Metade do que está em produção",
            texto: "começou há mais de " + dur(idadeMediana) + "." })
        : null,
    ].filter(Boolean));

    /* ---------------- produção do ano ---------------- */
    const producao = card("Produção científica", "publicações por ano", [
      C.columns({ labels: anos.map(String),
        series: [{ label: "Publicados", values: serie }],
        mono: true, height: 220, caption: null }),
      leituraDe({
        sinal: variacao === null ? "parado" : (variacao >= 0 ? "sobe" : "desce"),
        forte: noAno + " em " + ano,
        texto: anterior
          ? "contra " + anterior + " em " + (ano - 1)
            + (variacao !== null ? " (" + (variacao >= 0 ? "+" : "") + variacao + "%)" : "")
          : "primeiro ano com publicação registrada",
      }),
      metaPub.projecao && metaPub.projecao.metodo !== "fechado"
        ? el("div", { class: "hint", text: "o ano deve terminar entre "
            + metaPub.projecao.de + " e " + metaPub.projecao.ate
            + (metaPub.meta ? " · meta " + metaPub.meta : "") })
        : null,
    ].filter(Boolean));

    /* ---------------- impacto ---------------- */
    /* `let`, e nao `const`: a linha de baixo REATRIBUI. Com `const` isto e
       `TypeError: Assignment to constant variable`, e o Resumo -- a
       primeira tela do painel -- morre inteiro, em branco.

       E o defeito so acordava no dia bom: exige Scopus e WoS zeradas E a
       OpenAlex com numero, que e exatamente o estado de quem acabou de
       apertar "Conferir as citacoes agora" sem ter as chaves das duas
       pagas. Ou seja: a tela quebrava no primeiro sucesso. */
    let base = (o.scopus_total || 0) >= (o.wos_total || 0)
      ? { total: o.scopus_total, campo: "scopus_citations", nome: "Scopus" }
      : { total: o.wos_total, campo: "wos_citations", nome: "Web of Science" };
    if (!base.total && o.openalex_total)
      base = { total: o.openalex_total, campo: "openalex_citations", nome: "OpenAlex" };
    const citados = rows.filter(function (a) { return (a[base.campo] || 0) > 0; })
      .sort(function (a, b) { return (b[base.campo] || 0) - (a[base.campo] || 0); });
    const cinco = citados.slice(0, 5);
    /* Sem citação nenhuma o cartão virava três zeros lado a lado, que não
       é informação -- é a ausência dela ocupando o lugar de um cartão.
       Aqui ele diz o que falta para o número existir. */
    const impacto = !base.total ? card("Impacto científico", null, [
      el("div", { class: "empty", text: "Ainda sem citação registrada em nenhuma base." }),
      el("div", { class: "hint", text: "As citações entram pelo DOI do artigo: a "
        + "OpenAlex vem sozinha na atualização, a Scopus e a Web of Science pedem a "
        + "chave da universidade. " + rows.filter(function (a) { return !a.doi; }).length
        + " artigo(s) ainda estão sem DOI." }),
    ]) : card("Impacto científico", "citações na " + base.nome, [
      el("div", { class: "resumo-nums" }, [
        numero(base.total || 0, "citações"),
        numero(citados.length, "artigos citados", "de " + rows.length),
        /* Índice h zero ao lado de mil citações não é zero -- é ninguém
           ter calculado nem declarado ainda, e são coisas diferentes. */
        numero(o.best_h_index || "—", "maior índice h",
          o.best_h_index ? null : "ainda não declarado"),
      ]),
      /* A curva mostra o que três números não mostram: a citação chega
         com atraso, então o ano recente aparece baixo por ser recente e
         não por ser fraco. Sem a curva, alguém lê o último ano como queda
         de qualidade. */
      citPorAno.some(function (v) { return v > 0; })
        ? C.area({ labels: anos.map(String),
            series: [{ label: "Citações", values: citPorAno }],
            mono: true, height: 150, caption: "citações recebidas, por ano de publicação" })
        : null,
      /* Cinco, e nao um. Um artigo campeao sozinho nao responde a pergunta
         que se faz olhando este cartao -- se o impacto do laboratorio esta
         concentrado num trabalho ou espalhado. O trilho de cada linha e
         proporcional ao primeiro colocado: cinco trilhos parecidos contam
         uma historia, um trilho cheio e quatro tocos contam outra.

         Sao os cinco do RECORTE atual, e nao do acervo inteiro: filtrou
         por ano ou por linha de pesquisa, o cartao acompanha. E chegam
         sozinhos, sem recarregar: a tela inteira se redesenha quando o
         servidor avisa que a citacao mudou. */
      cinco.length ? el("div", { class: "top5" },
        [el("div", { class: "hint", text: "os mais citados na " + base.nome })].concat(
          cinco.map(function (a, i) {
            const n = a[base.campo] || 0;
            const barra = el("i");
            barra.style.setProperty("--pct", (100 * n / (cinco[0][base.campo] || 1)) + "%");
            const linha = el("div", { class: "linha", title: a.title }, [
              el("div", { class: "posto", text: String(i + 1) }),
              el("div", {}, [
                el("div", { class: "titulo", text: a.title }),
                el("div", { class: "pe", text: [a.journal, a.year_published]
                  .filter(Boolean).join(" · ") }),
                el("div", { class: "trilho" }, barra),
              ]),
              el("div", { class: "n", text: C.fmt(n) }),
            ]);
            linha.onclick = function () { showArticle(a); };
            return linha;
          }))) : null,
      /* Citação demora: o artigo deste ano ainda não teve tempo de ser
         citado, e comparar a colheita dele com a de 2019 puniria o
         trabalho novo por ser novo. */
      citados.length ? el("div", { class: "hint",
        text: "a citação chega com atraso — o artigo recente ainda não teve "
            + "tempo de ser citado, e isso não é sinal de qualidade" }) : null,
    ].filter(Boolean));

    /* ---------------- linhas de pesquisa ---------------- */
    const linhas = (D.research_lines || []).map(function (l) {
      const meus = rows.filter(function (a) { return a.research_line === l.name; });
      return { nome: l.name, ativa: l.active !== 0, total: meus.length,
        publicados: meus.filter(function (a) { return a.status === "publicado"; }).length,
        producao: meus.filter(function (a) { return a.status === "em_producao"; }).length,
        avaliacao: meus.filter(function (a) {
          return a.status === "submetido" || a.status === "em_revisao"; }).length };
    }).filter(function (x) { return x.ativa || x.total; })
      .sort(function (a, b) { return b.total - a.total; });
    const semLinha = rows.filter(function (a) { return !a.research_line; }).length;
    /* Uma fileira de barras de comprimento zero parece gráfico e não diz
       nada. Quando nenhuma linha tem artigo, o que há para contar é
       justamente que a classificação não foi feita. */
    const comArtigo = linhas.filter(function (x) { return x.total > 0; });
    const areas = card("Por linha de pesquisa", "onde a produção está", [
      comArtigo.length
        /* Barra horizontal, e composta. Horizontal porque "Fibromialgia e
           doenças reumáticas" não cabe embaixo de uma coluna -- em
           coluna o rótulo gira e colide com a legenda. Composta porque
           duas linhas com dez artigos cada não são a mesma coisa se uma
           tem dez publicados e a outra tem dez ainda em produção, e o
           total sozinho apaga essa diferença. */
        ? C.bars({ items: comArtigo.slice(0, 8).map(function (x) {
            return { label: x.nome, value: x.total, partes: [
              { rotulo: "publicados", valor: x.publicados },
              { rotulo: "em produção", valor: x.producao },
              { rotulo: "em avaliação", valor: x.avaliacao },
            ] }; }),
            unit: "artigos", labelWidth: 210, labelChars: 30, rowH: 32,
            caption: "artigos por linha, repartidos por situação" })
        : el("div", { class: "empty",
            text: "Nenhum artigo está associado a uma linha de pesquisa." }),
      /* O que está fora de qualquer linha é a informação que falta, e ela
         não aparece em gráfico nenhum de composição. */
      comArtigo.length ? el("div", { class: "kpi-seg-leg", style: "margin-top:2px" },
        ["publicados", "em produção", "em avaliação"].map(function (rotulo, i) {
          const ponto = el("i");
          ponto.style.background = C.serie(i);
          return el("span", {}, [ponto, el("span", { text: rotulo })]);
        })) : null,
      semLinha ? leituraDe({ sinal: "parado",
        forte: semLinha + " artigo(s)",
        texto: "estão sem linha de pesquisa e não entram em nenhuma barra acima" })
        : null,
    ].filter(Boolean));

    /* ---------------- equipe ---------------- */
    const equipe = (D.members || []).filter(function (m) {
      return !m.is_external && m.active !== 0 && !m.left_on; });
    const porVinculo = {};
    equipe.forEach(function (m) {
      const nome = VINCULO_NOME[m.role] || "sem vínculo declarado";
      porVinculo[nome] = (porVinculo[nome] || 0) + 1;
    });
    const semVinculo = equipe.filter(function (m) { return !m.role; }).length;
    /* Era uma tabela de duas colunas dentro de um cartão de 300px: os
       vínculos ficavam espremidos num canto, com o número colado no rótulo,
       e não se lia nada de longe. Agora cada vínculo é um cartão com
       desenho e número grande, e o conjunto ocupa a largura toda — é a
       mesma peça que o resto do painel usa para contar coisa. */
    const ordem = Object.keys(porVinculo).sort(function (a, b) {
      return porVinculo[b] - porVinculo[a]; });
    const pessoas = card("Nossa equipe", equipe.length + " integrantes e "
      + (o.n_collaborators || 0) + " coautores", [
      el("div", { class: "grid g4" }, ordem.map(function (nome) {
        const semDeclarar = nome === "sem vínculo declarado";
        return kpi({
          label: nome, value: C.fmt(porVinculo[nome]),
          icon: semDeclarar ? "aviso" : (ICONE_DO_VINCULO[nome] || "pessoa"),
          tone: semDeclarar ? "bad" : null,
          ir: "organograma",
          foot: semDeclarar ? "não aparecem no organograma" : null,
        });
      })),
      /* Coautor não é integrante: quem assinou um artigo com o laboratório
         não virou parte dele, e contar os dois juntos inflava a equipe. */
      el("div", { class: "hint", style: "margin-top:12px",
        text: "coautor é quem assinou artigo conosco sem "
        + "ser do grupo — os dois números são contados separados" }),
      /* Sem vínculo declarado quase nunca é gente da casa que esqueceu de
         preencher: é coautor que entrou pela lista de autores de um artigo.
         Por isso a leitura não para no diagnóstico e diz onde se resolve —
         em lote, e sem apagar ficha nenhuma. */
      semVinculo ? el("div", { class: "note", style: "margin-top:12px" }, [
        el("b", { text: semVinculo + " pessoa(s) sem vínculo declarado. " }),
        el("span", { text: "Elas contam como integrantes e não aparecem no "
          + "organograma. Quase sempre são coautores que entraram pela lista "
          + "de autores de um artigo — " }),
        LIVE ? el("a", { href: "/app#admin",
          text: "dá para separá-las de uma vez em Administração" })
          : el("span", { text: "separe-as em Administração" }),
        el("span", { text: ", sem apagar ficha nenhuma." }),
      ]) : null,
    ].filter(Boolean));
    pessoas.className = "card largo";

    /* ---------------- objetivos ---------------- */
    const comMeta = (M.indicadores || []).filter(function (i) { return i.meta; });
    const objetivos = card("Objetivos de " + (M.ano || ano),
      M.corrente ? "faltam " + M.meses_restantes + " mês(es)" : "ano fechado",
      comMeta.length ? comMeta.map(function (i) {
        const pj = i.projecao || {};
        const teto = Math.max(i.meta || 0, pj.ate || 0, i.realizado || 0, 1);
        const pct = function (v) { return (100 * (v || 0) / teto).toFixed(1) + "%"; };
        const trilho = el("div", { class: "meta-trilho", style: "height:14px" }, [
          el("div", { class: "faixa" }), el("div", { class: "feito" }),
          el("div", { class: "marca" }),
        ]);
        trilho.style.setProperty("--feito", pct(i.realizado));
        trilho.style.setProperty("--de", pct(pj.de));
        trilho.style.setProperty("--largura",
          (100 * Math.max(0, (pj.ate || 0) - (pj.de || 0)) / teto).toFixed(1) + "%");
        trilho.style.setProperty("--meta", pct(i.meta));
        return el("div", { class: "meta-linha", style: "margin-bottom:12px" }, [
          el("div", { class: "topo" }, [
            el("span", { text: i.rotulo }),
            el("span", { class: "hint", text: i.realizado + " de " + i.meta }),
          ]),
          trilho,
          el("div", { class: "hint", text: i.veredito
            + (i.precisa_por_mes ? " · precisa de " + C.fmt(i.precisa_por_mes)
                + "/mês" : "") }),
        ]);
      }) : [el("div", { class: "empty",
        text: "Nenhuma meta declarada. A coordenação declara em Área do "
            + "integrante › Administração." })]);

    /* ---------------- o que vem a seguir ---------------- */
    const proximos = ((D.agenda || {}).upcoming || []).slice(0, 5);
    const parados = (D.submitted || []).map(function (a) {
      /* `daysSince` devolve fração de dia. Sem arredondar, a tela mostrava
         "550.8450484837963 d" ao lado do título -- treze casas decimais
         para uma espera que ninguém mede em segundos. */
      return { titulo: a.title,
        dias: Math.round(daysSince(a.last_submitted_on || a.first_submission_on)) };
    }).filter(function (x) { return x.dias !== null && x.dias > 90; })
      .sort(function (a, b) { return b.dias - a.dias; }).slice(0, 4);
    const seguir = card("O que vem a seguir", "compromissos e o que está esperando", [
      proximos.length ? el("ul", { class: "agenda" }, proximos.map(function (e) {
        return el("li", {}, [
          el("span", { class: "hint", text: dt(e.starts_on || e.date) }),
          el("span", { text: e.title || e.titulo }),
        ]);
      })) : el("div", { class: "hint", text: "Nenhum compromisso nos próximos dias." }),
      /* Submissão parada é o que some do radar: ninguém é lembrado do
         artigo que não deu notícia, e é justamente ele que precisa de
         cobrança. */
      parados.length ? el("div", { style: "margin-top:12px" }, [
        el("div", { class: "hint", text: "esperando resposta há mais de 90 dias" }),
        el("ul", { class: "agenda" }, parados.map(function (x) {
          return el("li", {}, [
            el("span", { class: "badge warning", text: x.dias + " d" }),
            el("span", { text: x.titulo }),
          ]);
        })),
      ]) : null,
    ].filter(Boolean));

    /* Os cartões com gráfico ocupam duas colunas. Numa coluna só as
       barras saem com dez pixels de altura e o rótulo do ano ilegível --
       gráfico que não se lê é enfeite ocupando o lugar de um número. */
    numeros.classList.add("largo");
    producao.classList.add("largo");
    areas.classList.add("largo");
    objetivos.classList.add("largo");
    host.appendChild(el("div", { class: "grid resumo" },
      [capa, numeros, producao, impacto, areas, pessoas, objetivos, seguir]));
  });

/* A produção de cada linha de pesquisa, e para onde ela foi.

   Devolve a especificação de um fluxo: à esquerda uma faixa por linha,
   com espessura proporcional ao número de artigos; à direita as três
   situações. O que estiver fora de qualquer linha entra como "Sem linha",
   porque o que falta classificar é informação e não pode sumir do
   desenho -- num mosaico de áreas ele simplesmente não aparecia. */
function fluxoDasLinhas(rows) {
  const SITUACAO = [
    { id: "sit_publicado", rotulo: "Publicado",
      casa: function (a) { return a.status === "publicado"; } },
    { id: "sit_producao", rotulo: "Em produção",
      casa: function (a) { return a.status === "em_producao"; } },
    { id: "sit_avaliacao", rotulo: "Em avaliação",
      casa: function (a) { return a.status === "submetido" || a.status === "em_revisao"; } },
  ];
  const porLinha = new Map();
  rows.forEach(function (a) {
    const nome = a.research_line || "Sem linha";
    if (!porLinha.has(nome)) porLinha.set(nome, []);
    porLinha.get(nome).push(a);
  });
  /* Oito faixas é o que se lê; o resto vira uma só. Vinte faixas de dois
     pixels não são um gráfico, são um pente. */
  const ordenadas = Array.from(porLinha.entries())
    .sort(function (a, b) { return b[1].length - a[1].length; });
  const principais = ordenadas.slice(0, 8);
  const resto = ordenadas.slice(8);
  if (resto.length) {
    principais.push(["Outras " + resto.length + " linhas",
      resto.reduce(function (t, x) { return t.concat(x[1]); }, [])]);
  }

  const nodes = [];
  const links = [];
  principais.forEach(function (par, i) {
    const id = "linha_" + i;
    nodes.push({ id: id, label: cut(par[0], 26), depth: 0, color: C.serie(i) });
    SITUACAO.forEach(function (sit) {
      const quantos = par[1].filter(sit.casa).length;
      if (quantos) links.push({ source: id, target: sit.id, value: quantos });
    });
  });
  SITUACAO.forEach(function (sit, i) {
    const usada = links.some(function (l) { return l.target === sit.id; });
    if (usada) nodes.push({ id: sit.id, label: sit.rotulo, depth: 1, color: C.serie(i) });
  });
  return { nodes: nodes, links: links, height: 320, unit: "artigos", file: "linhas",
    caption: "artigos por linha de pesquisa e situação" };
}

/* ====================================================================== */
/* a história do laboratório                                              */
/* ====================================================================== */
/* Todo painel de dados responde "como estamos". Nenhum responde "quem
   somos" -- e é essa a primeira pergunta de quem chega: o bolsista no
   primeiro dia, o avaliador da Capes, o parceiro que abre o link.

   Daí esta aba ser feita de caixa e ícone, e não de gráfico. O texto é
   da coordenação e está aqui inteiro, mas quebrado em unidades que se
   leem de relance: um marco, um pilar, uma linha, um público, um
   benefício. Quem tem trinta segundos lê os desenhos; quem tem cinco
   minutos lê os parágrafos. As duas leituras contam a mesma história.

   Os números vêm do banco, não do texto: "37 anos" e "116 publicações"
   se corrigem sozinhos no ano que vem, enquanto uma data escrita à mão
   envelhece calada. */
const HISTORIA = {
  fundado_em: 1989,
  /* Três nomes, um laboratório. A sequência é o que explica por que o
     LAPE é mais velho do que o nome LAPE. */
  marcos: [
    { quando: "Outubro de 1989", icone: "semente",
      titulo: "O primeiro núcleo de pesquisa do CEFID",
      texto: "O Prof. Dr. Alexandro Andrade cria o 1º Núcleo de Pesquisa do "
        + "CEFID/UDESC — a semente de tudo o que veio depois." },
    { quando: "Agosto de 1990", icone: "cerebro",
      titulo: "Laboratório de Aprendizagem Motora",

/* Uma caixa: pastilha com o ícone em cima, título, e texto opcional.
   É a peça de que a aba inteira é feita -- muda o conteúdo, não a forma. */
function hcaixa(spec) {
  return el("div", { class: "hcaixa" + (spec.classe ? " " + spec.classe : "") }, [
    Icons.badge(spec.icone, spec.tom || null, null),
    el("b", { text: spec.titulo }),
    spec.texto ? el("p", { text: spec.texto }) : null,
    spec.seta ? el("span", { class: "hseta " + spec.seta,
      text: spec.seta === "sobe" ? "▲ aumenta" : "▼ reduz" }) : null,
  ].filter(Boolean));
}

/* A entrada escalonada. Um cartão que aparece de uma vez é um cartão;
   dezoito que aparecem em cascata são uma história sendo contada. Custa
   um índice por caixa, para no fim e não volta -- e some por inteiro
   para quem pediu menos movimento (ver `prefers-reduced-motion` no
   tema). */
function hanimar(host) {
  host.querySelectorAll(".hcaixa, .hmarco").forEach(function (node, i) {
    node.classList.add("entrando");
    node.style.setProperty("--passo", String(i % 10));
  });
  return host;
}

/* Os capítulos. A história inteira continua aqui -- o que muda é que ela
   deixou de ser uma página de rolagem longa e virou navegação: um índice
   de ícones-botão, e cada capítulo com a sua própria página, com voltar,
   anterior e próximo.

   O motivo é de leitura, não de estética. Uma página de dois metros de
   altura é lida pelo primeiro terço e abandonada; ninguém manda o link
   dela para um avaliador dizendo "veja o parágrafo sete". Em capítulo,
   cada parte cabe numa tela, tem endereço próprio (#historia/equipe) e
   pode ser mandada sozinha.

   `monta` recebe o hospedeiro e desenha o conteúdo do capítulo -- o mesmo
   conteúdo que antes estava empilhado na página única. */
const CAPITULOS = [
  { id: "origem", icone: "semente", titulo: "De onde viemos",
    resumo: "Três nomes, um laboratório: do núcleo de pesquisa de 1989 ao LAPE." },
  { id: "fazemos", icone: "experimento", titulo: "O que fazemos",
    resumo: "Ensino, pesquisa e extensão — as três pernas, cada uma com entrega." },
  { id: "linhas", icone: "linhas", titulo: "As linhas de pesquisa",
    resumo: "O território da Psicologia do Esporte e do Exercício onde trabalhamos." },
  { id: "objetivo", icone: "alvo", titulo: "Nosso objetivo",
    resumo: "O que as ações do laboratório se propõem a mudar, e em quem." },
  { id: "publico", icone: "comunidade", titulo: "Quem atendemos",
    resumo: "O público que passa pelos projetos de pesquisa e de extensão." },
  { id: "efeitos", icone: "coracao", titulo: "O que o exercício muda",
    resumo: "Os oito efeitos observados em quem é atendido pelo programa." },
  { id: "equipe", icone: "pessoas", titulo: "A equipe e a coordenação",
    resumo: "Quem faz, de onde vêm as bolsas e quem orienta o conjunto." },
];
function capituloDe(id) {
  return CAPITULOS.find(function (c) { return c.id === id; }) || null;
}

    const aberto = capituloDe((location.hash || "").split("/")[1] || "");
