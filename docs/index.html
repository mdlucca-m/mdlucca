<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPE - Laboratorio de Psicologia do Esporte e do Exercicio — Painel de indicadores</title>
<style>
/* ==========================================================================
   LAPE — sistema de design  ·  escuro por padrão, fosco, alta densidade

   A paleta categórica foi verificada por script para daltonismo e contraste
   sobre as superfícies em que o painel realmente desenha:
     escuro (#070c14): pior par adjacente ΔE 8,4 (protanopia) · 19,3 (normal)
     claro  (#fcfcfb): pior par adjacente ΔE 9,1 (protanopia) · 19,6 (normal)
   Três slots (azul, laranja, verde-água) também passam em "todos os pares",
   exigido por dispersão, bolha e mapa — por isso essas formas param em três.

   Sobre o degradê: ele veste a MOLDURA (fundo da página, barra superior,
   cabeçalho de cartão, aba ativa) e nunca o fundo onde há marca de dado.
   A área de plotagem é sempre a cor chapada que passou na verificação —
   um degradê ali mudaria o contraste de ponto a ponto e invalidaria o teste.

   Regras que valem em todo o painel:
   - Cor categórica segue a ENTIDADE, nunca a posição no ranking.
   - Nunca gerar uma nona cor: o excedente vira "Outros" ou vai para tabela.
   - Sequencial = um só matiz, claro→escuro. Divergente = dois polos + cinza.
   - Texto nunca veste a cor da série; a identidade vem da marca ao lado.
   ========================================================================== */

/* ==========================================================================
   O que nao muda de tema
   Raio, tipografia, o degrade do acento, e as cores de ESTADO. Estas
   ultimas ficam aqui de proposito: bom, alerta, grave e critico significam
   a mesma coisa nos dois fundos, e um verde que muda de tom conforme o tema
   convidaria alguem a usa-lo como cor de serie -- que e justamente o que
   elas nao sao. Os polos do divergente tambem: so o cinza do meio muda.
   ========================================================================== */
:root {
  --grad-accent: linear-gradient(90deg, #2fa8dd 0%, #9085e9 100%);
  --malha-passo: 46px;
  --on-accent:     #ffffff;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --radius:    14px;
  --radius-sm: 10px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --div-neg: #3987e5; --div-pos: #e66767;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  /* --- superfícies e tinta ---------------------------------------------
     O plano do fundo é quase preto com um viés frio; os cartões sobem em
     degraus curtos. A área de plotagem (--surface) é opaca de propósito:
     nenhum degradê passa por baixo de marca de dado, senão a mesma altura
     de barra muda de cor conforme onde ela cai na tela.
     A paleta de séries foi reconferida contra esta superfície — o validador
     aprova as cinco checagens sobre #070c14. */
  --surface:        #070c14;   /* cartões e área de plotagem — cor verificada */
  --surface-raised: #0f1724;   /* cabeçalho de tabela, chips, campos */
  --surface-hover:  #16202e;
  --surface-sunken: #02040a;   /* plano da página */
  --ink:            #f3f7ff;
  --ink-2:          #bccada;
  --ink-muted:      #8e9db3;
  --grid:           #1f2b3c;
  --axis:           #38485f;
  --border:         #26344a;
  --border-strong:  #38485f;

  /* --- degradês da moldura (nunca sob marcas de dado) ---
     Duas luzes frias nas quinas altas e uma quente embaixo: a leitura é a
     do laboratório — cognição em cima, esforço embaixo. */
  --grad-page: radial-gradient(1100px 620px at 12% -10%, rgba(47,168,221,.16) 0%, transparent 60%),
               radial-gradient(900px 560px at 92% 2%, rgba(144,133,233,.14) 0%, transparent 58%),
               radial-gradient(1000px 700px at 60% 108%, rgba(217,89,38,.09) 0%, transparent 62%),
               linear-gradient(180deg, #04070e 0%, #02040a 46%);
  --grad-bar:  linear-gradient(180deg, rgba(47,168,221,.13) 0%, rgba(7,12,20,0) 100%);
  --grad-card: linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,0) 62%);
  --grad-kpi:  linear-gradient(135deg, rgba(47,168,221,.15) 0%, rgba(7,12,20,0) 58%);
  /* malha fina de fundo: dá profundidade sem competir com nada */
  --grad-malha: linear-gradient(rgba(47,168,221,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47,168,221,.045) 1px, transparent 1px);
  --aurora: .5;

  /* --- ação --- */
  --accent:        #6fd0f6;   /* 11,2:1 sobre a superfície — cor de texto/link */
  --accent-solid:  #12799f;   /* fundo de botão; texto branco a 4,9:1 */
  --accent-strong: #3bb4e8;   /* 8,3:1 — aro, traço, barra de progresso */
  --accent-wash:   #0a2331;
  /* brilho: só em cromo, e curto. Halo permanente vira ruído. */
  --glow:      0 0 0 1px rgba(47,168,221,.28), 0 0 22px -6px rgba(47,168,221,.55);
  --glow-forte: 0 0 0 1px rgba(47,168,221,.42), 0 0 34px -6px rgba(47,168,221,.75);

  /* --- séries categóricas (ordem fixa; nunca reciclar) ---
     Conferidas pelo validador sobre #070c14: faixa de luminosidade, piso de
     croma, separação para daltonismo e contraste — as cinco passam. */
  --series-1: #3987e5;  /* azul       */
  --series-2: #d95926;  /* laranja    */
  --series-3: #199e70;  /* verde-água */
  --series-4: #c98500;  /* amarelo    */
  --series-5: #d55181;  /* magenta    */
  --series-6: #008300;  /* verde      */
  --series-7: #9085e9;  /* violeta    */
  --series-8: #e66767;  /* vermelho   */

  /* --- sequencial: um matiz. No escuro, mais claro = maior. --- */
  --seq-100: #0d366b; --seq-200: #184f95; --seq-300: #256abf; --seq-400: #3987e5;
  --seq-500: #5598e7; --seq-600: #86b6ef; --seq-700: #cde2fb;

  /* --- ordinal: etapas ordenadas (funil, faixas) --- */
  --ord-1: #cde2fb; --ord-2: #9ec5f4; --ord-3: #6da7ec; --ord-4: #3987e5;

  /* --- divergente: dois polos opostos + cinza neutro --- */
  /* Quatro degraus de cada lado, interpolados em OKLab a partir do meio.
     Os polos NAO sao os mesmos nos dois modos: cada um foi escurecido ou
     clareado ate que o rotulo dentro da celula passasse de 4,6:1 -- e a
     celula de correlacao mais forte que mais precisa ser lida, e era
     justamente a que reprovava. A tinta de cada degrau vai em
     --div-tinta-*, porque nos degraus fortes ela vira escura. */
  --div-mid: #2a3648;
  --div-neg-1: #30496c; --div-neg-2: #345d93;
  --div-neg-3: #3772bb; --div-neg-4: #3987e5;
  --div-pos-1: #584451; --div-pos-2: #845058;
  --div-pos-3: #b25b5f; --div-pos-4: #e26464;
  --div-tinta-fraca: #e8edf4;   /* sobre os degraus 1 a 3 */
  --div-tinta-forte: #10161f;   /* sobre o degrau 4, que e claro */

  /* --- estado (reservado; nunca vira "série 9") --- */

  /* --- forma --- */
  --shadow:    0 1px 2px rgba(0,0,0,.6), 0 12px 34px rgba(0,0,0,.44);
  --shadow-lg: 0 2px 8px rgba(0,0,0,.7), 0 28px 68px rgba(0,0,0,.58);
  --ring:      inset 0 1px 0 rgba(255,255,255,.055);
}

/* O CLARO é o PADRÃO, e o escuro é a escolha.

   Esta folha já foi das duas maneiras mais de uma vez, e o motivo de cada
   volta importa mais do que qual está valendo agora.

   No começo ela seguia `prefers-color-scheme`, e no Windows do laboratório
   -- que está no claro -- o tema escuro nunca aparecia para ninguém. A
   correção foi fixar um padrão em vez de perguntar ao sistema, e o padrão
   escolhido foi o escuro. Depois o laboratório pediu o claro, e o padrão
   virou claro. Depois pediu escuro de novo, mais fundo e mais contrastado.
   Agora pediu claro outra vez, e o padrão voltou para cá.

   O que NÃO mudou em nenhuma das voltas, e é a regra de verdade: não se
   pergunta ao sistema operacional. É isso que faz a tela ser a mesma na
   sala, no projetor e no PDF que sai daqui -- e é isso que não se deve
   desfazer numa próxima troca de padrão.

   COMO A TROCA É FEITA, para a próxima volta ser de uma linha: o padrão é
   o bloco de seletor NU (`:root`), e a escolha é o bloco com atributo
   (`:root[data-theme="..."]`). Inverter o padrão é mover o `:root` de um
   cabeçalho para o outro -- e nada mais. A especificidade resolve o
   resto: `:root[data-theme="dark"]` (0,2,0) sempre vence o `:root` (0,1,0),
   qualquer que seja a ordem no arquivo.

   Trocar o padrão aqui, e não no JavaScript, é o que faz o claro valer
   TAMBÉM no instantâneo, no relatório e no mural -- que leem esta folha e
   nunca executam o painel. */
:root, :root[data-theme="light"] {
  color-scheme: light;
  /* BRANCO, e branco mesmo. Este bloco ja foi um creme (#f6f6f3) com um
     degrade azulado por cima, herdado de quando o claro era a excecao e
     precisava "ter vida". Pedido no claro, o creme le como papel velho e
     o degrade tinge a tela inteira -- e num mural de corredor, a dois
     metros, e o tingimento que se ve primeiro, nao o dado.

     A pagina e o cartao sao os dois brancos. O que separa um do outro
     passa a ser a borda e a sombra, e nao um tom de fundo: com fundo
     branco, qualquer cinza de cartao que seja visivel a dois metros ja
     e cinza demais de perto.

     Os cinzas todos eram QUENTES (tinham amarelo dentro), para casar com
     o creme. Sobre branco eles amarelam sozinhos, entao viraram neutros.
     A cor da marca e a dos graficos nao mudaram. */
  --surface:        #ffffff;   /* cartoes e area de plotagem */
  --surface-raised: #f4f4f6;   /* cabecalho de tabela, chips, campos */
  --surface-hover:  #ebebef;
  --surface-sunken: #ffffff;   /* plano da pagina */
  --ink:            #0b0b0c;
  --ink-2:          #52525b;
  --ink-muted:      #8a8a93;
  --grid:           #e8e8ec;
  --axis:           #c3c3cb;
  --border:         #e4e4e9;
  --border-strong:  #c3c3cb;

  /* Sem tinta na pagina. O gradiente continua existindo como token porque
     o escuro usa o dele; aqui ele e branco sobre branco, e nao `none` --
     `none` dentro do atalho `background` ja quebrou esta linha uma vez. */
  --grad-page: linear-gradient(180deg, #ffffff 0%, #ffffff 100%);
  --grad-bar:  linear-gradient(180deg, rgba(14,111,150,.05) 0%, rgba(255,255,255,0) 100%);
  --grad-card: linear-gradient(180deg, rgba(11,11,12,.016) 0%, rgba(11,11,12,0) 58%);
  --grad-kpi:  linear-gradient(135deg, rgba(14,111,150,.07) 0%, rgba(255,255,255,0) 55%);

  --accent:        #0e6f96;
  --accent-solid:  #0e6f96;
  --accent-strong: #0b6386;
  --accent-wash:   #e6f4fa;
  --glow:       0 0 0 1px rgba(14,111,150,.16), 0 6px 18px -8px rgba(14,111,150,.34);
  --glow-forte: 0 0 0 1px rgba(14,111,150,.26), 0 10px 26px -8px rgba(14,111,150,.46);
  --grad-malha: linear-gradient(rgba(14,111,150,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14,111,150,.03) 1px, transparent 1px);
  /* O mural tem um borrao colorido em movimento atras de tudo. Sobre
     fundo escuro ele e um brilho; sobre branco e uma mancha azul-lilas
     que toma a parede. Zero aqui, e a forca cheia no escuro. */
  --aurora: 0;

  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;

  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5;
  --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;

  --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #1c5cab;

  --div-mid: #f0f0f3;
  --div-neg-1: #c5d8ef; --div-neg-2: #9bc0ef;
  --div-neg-3: #6fa7ee; --div-neg-4: #408dec;
  --div-pos-1: #f2ceca; --div-pos-2: #f1ada8;
  --div-pos-3: #ed8b87; --div-pos-4: #e66767;
  /* no claro todo degrau le melhor com tinta escura */
  --div-tinta-fraca: #1c2430; --div-tinta-forte: #1c2430;

  --shadow:    0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.05);
  --shadow-lg: 0 2px 8px rgba(11,11,11,.08), 0 18px 48px rgba(11,11,11,.12);
  --ring:      inset 0 1px 0 rgba(255,255,255,.6);
}

/* ==========================================================================
   base
   ========================================================================== */
/* `plotbox` e so o metro: ele nasce em JavaScript (charts.js, `responsivo`)
   para o grafico saber a largura do cartao antes de desenhar. Como nunca
   teve regra nenhuma, entrava na coluna flexivel de um cartao como um
   bloco de `min-height: auto` -- um bloco que se recusa a encolher abaixo
   do proprio conteudo. Num cartao mais baixo que o grafico ele empurrava
   o SVG para fora em cima e embaixo, e o `overflow: hidden` do cartao
   cortava os dois extremos: sumiam o topo das barras, o rodape com os
   nomes do eixo, e o titulo do cartao ficava atras da barra.

   Nao aparecia em tela grande, onde o cartao calha de ser mais alto que o
   grafico. Aparecia em notebook, e aparecia com a escala do Windows em
   125% -- que e a maioria das telas de quem usa isto. Era o "nao da para
   ver nada".

   Sendo o metro, ele repassa o tamanho que recebeu e nao impoe o seu.
   Onde o pai nao for uma coluna flexivel -- o painel, onde os cartoes
   crescem com o conteudo --, `flex` simplesmente nao se aplica e ele
   continua um bloco de altura automatica, como era. */
.plotbox { display: flex; flex-direction: column; flex: 1 1 0;
  min-height: 0; min-width: 0; }

* { box-sizing: border-box; }
html { background: var(--surface-sunken); min-height: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; position: relative;
  background: var(--grad-page) fixed, var(--surface-sunken);
  color: var(--ink);
  font: 14.5px/1.5 var(--sans);
  font-variant-numeric: tabular-nums;   /* número que não dança ao atualizar */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
/* Malha fina, esmaecendo para baixo. Fica atrás de todo o conteúdo e some
   antes da metade da tela: profundidade no topo, silêncio onde estão os
   dados. Nunca por baixo de uma área de plotagem, que é opaca. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--grad-malha);
  background-size: var(--malha-passo, 46px) var(--malha-passo, 46px);
  mask-image: linear-gradient(180deg, #000 0%, transparent 62%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 62%);
}
body > * { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
h1, h2, h3, h4 { line-height: 1.15; margin: 0; letter-spacing: -.022em; font-weight: 680; }
h1 { letter-spacing: -.03em; }
/* Rótulo de eixo, de coluna, de indicador: caixa alta curta e espaçada. É o
   que separa "o que é este número" de "o número" sem gritar. */
.rotulo, .flabel, .kpi .label, .placar th, thead th {
  text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
}
/* Leitura analítica: a frase curta que diz o que o número quer dizer.
   Um painel que só mostra número obriga cada pessoa a interpretar sozinha —
   e cada uma interpreta de um jeito. */
.leitura { font-size: 12px; line-height: 1.45; color: var(--ink-2); margin-top: 6px;
  padding-top: 6px; border-top: 1px solid var(--grid); }
.leitura b { color: var(--ink); font-weight: 650; }
.leitura .sinal { font-weight: 700; }
.leitura .sinal.sobe { color: var(--good); }
.leitura .sinal.desce { color: var(--critical); }
.leitura .sinal.parado { color: var(--ink-muted); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px;
  border-radius: 5px; box-shadow: var(--glow); }
svg.icon { width: 1em; height: 1em; flex: none; display: block; }

/* --------------------------------------------------------------------------
   pastilha do ícone
   O traço é o mesmo; o que muda é a moldura — degradê do próprio tom, aro
   colorido e um halo curto por baixo. É cromo: dá cor e relevo à navegação e
   aos cartões sem tocar na paleta que governa as marcas dos gráficos.
   -------------------------------------------------------------------------- */
.ibadge {
  --tone: var(--accent-strong);
  --badge: 34px;
  position: relative; flex: none; display: inline-grid; place-items: center;
  width: var(--badge); height: var(--badge); border-radius: calc(var(--badge) * .32);
  color: var(--tone); font-size: calc(var(--badge) * .55);
  background:
    linear-gradient(148deg, color-mix(in srgb, var(--tone) 30%, transparent) 0%,
                            color-mix(in srgb, var(--tone) 6%, transparent) 72%),
    var(--surface-raised);
  border: 1px solid color-mix(in srgb, var(--tone) 42%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tone) 26%, transparent),
              0 6px 16px -9px color-mix(in srgb, var(--tone) 85%, transparent);
}
.ibadge svg.icon { stroke-width: 1.9; }
.ibadge.sm { --badge: 26px; border-radius: 8px; }

/* ---- o logotipo do laboratorio ----
   O mesmo arquivo serve a cinco lugares de tamanhos diferentes: o selo da
   navegacao, o cabecalho do mural, a tela de entrada, o convite e o
   aplicativo. Ele preenche o quadrado que ja existia, sem deformar --
   `contain`, e nao `cover`: um logotipo cortado ao meio para caber e pior
   do que um logotipo com margem.

   O quadrado colorido some quando ha imagem: um logotipo desenhado tem
   fundo proprio, e o azul do tema por tras dele viraria uma moldura que
   ninguem pediu. */
.logo-img { width: 100%; height: 100%; object-fit: contain; display: block;
  border-radius: inherit; }
.tem-logo, .logo:has(.logo-img), .brand .logo:has(.logo-img),
.marca .selo:has(.logo-img) {
  background: var(--surface) !important; color: inherit;
  padding: 2px; overflow: hidden; }
/* Placa branca atras da imagem, nos dois temas. A escolha nao e neutra e
   vale explicar: um logotipo desenhado em preto sobre branco -- que e o
   caso da arte do LAPE, e o caso da maioria -- desaparece por completo
   sobre o fundo escuro do painel. A placa custa uma moldura desnecessaria
   a quem tiver um logotipo claro; a falta dela custa o logotipo inteiro a
   quem tiver um escuro. No tema claro a placa some contra a superficie,
   que ja e quase branca. */
.logo-img { background: #fff; }
.ibadge.lg { --badge: 44px; }
.ibadge.xl { --badge: 60px; }
/* sólida: o tom vira fundo, para o item ativo e para o mural */
.ibadge.solid {
  color: var(--on-accent); border-color: transparent;
  background: linear-gradient(148deg, color-mix(in srgb, var(--tone) 92%, #fff) 0%, var(--tone) 78%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28),
              0 8px 20px -8px color-mix(in srgb, var(--tone) 90%, transparent);
}
/* halo que respira — só onde algo pede atenção agora */
.ibadge.pulsa::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit;
  border: 1px solid color-mix(in srgb, var(--tone) 60%, transparent);
  animation: halo 2.4s ease-out infinite;
}
@keyframes halo {
  0%   { transform: scale(.94); opacity: .85; }
  70%  { transform: scale(1.16); opacity: 0; }
  100% { transform: scale(1.16); opacity: 0; }
}

/* Os tons saem das mesmas rampas do tema: nenhuma cor nova entra no sistema. */
.ibadge.t-azul     { --tone: var(--series-1); }
.ibadge.t-laranja  { --tone: var(--series-2); }
.ibadge.t-verde    { --tone: var(--series-3); }
.ibadge.t-ambar    { --tone: var(--series-4); }
.ibadge.t-magenta  { --tone: var(--series-5); }
.ibadge.t-violeta  { --tone: var(--series-7); }
.ibadge.t-acento   { --tone: var(--accent-strong); }
.ibadge.t-bom      { --tone: var(--good); }
.ibadge.t-alerta   { --tone: var(--warning); }
.ibadge.t-grave    { --tone: var(--serious); }
.ibadge.t-critico  { --tone: var(--critical); }

/* ==========================================================================
   controles
   ========================================================================== */
label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
input, select, textarea {
  width: 100%; padding: 8px 11px; font: inherit; font-size: 13.5px;
  color: var(--ink); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  transition: border-color .12s, box-shadow .12s, background .12s;
}
input:hover, select:hover, textarea:hover { border-color: var(--ink-muted); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent-strong); background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-wash);
}
textarea { min-height: 84px; resize: vertical; }
input[type=checkbox] { width: auto; margin-right: 7px; accent-color: var(--accent-strong); }
/* `a.botao-destino` divide a aparencia com <button> de proposito: os
   destinos externos precisam ser ancora de verdade (bloqueador de pop-up
   derruba janela aberta por script), mas devem parecer botao. */
button, a.botao-destino {
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius-sm);
  color: var(--ink); background: var(--surface-raised);
  border: 1px solid var(--border-strong); box-shadow: var(--ring);
  transition: background .12s, border-color .12s, color .12s, transform .1s;
}
a.botao-destino { text-decoration: none; }
button:hover, a.botao-destino:hover { background: var(--surface-hover);
  border-color: var(--ink-muted); text-decoration: none; }
button:active, a.botao-destino:active { transform: translateY(1px); }
button.primary, a.botao-destino.primary {
  background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent-solid) 86%, #fff) 0%, var(--accent-solid) 100%);
  border-color: color-mix(in srgb, var(--accent-strong) 70%, transparent);
  color: var(--on-accent); box-shadow: var(--ring), var(--glow);
}
button.primary:hover, a.botao-destino.primary:hover { background: var(--accent-strong);
  border-color: var(--accent-strong); box-shadow: var(--ring), var(--glow-forte); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--surface-raised); color: var(--ink); }
button:disabled { opacity: .42; cursor: not-allowed; }
button:disabled:active { transform: none; }

/* ==========================================================================
   superfícies
   ========================================================================== */
.card {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 17px; box-shadow: var(--shadow), var(--ring);
}
/* o degradê fica numa camada acima do fundo e ABAIXO do conteúdo,
   com altura limitada ao cabeçalho — nunca sob a área de plotagem */
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 96px;
  background: var(--grad-card); pointer-events: none;
}
/* fio de luz na borda superior: dá o acabamento de painel sem pesar */
.card::after {
  content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
  background: linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--accent-strong) 55%, transparent), transparent);
  pointer-events: none;
}
.card:hover { border-color: color-mix(in srgb, var(--accent-strong) 26%, var(--border)); }
.card > * { position: relative; }
.card > h3 { font-size: 13.5px; font-weight: 700; }
.card > .hint { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.hint { font-size: 12px; color: var(--ink-2); }
.grid { display: grid; gap: 13px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(248px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
/* oito indicadores devem fechar duas fileiras de quatro, não cinco e três */
.grid.fixed4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .grid.fixed4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.full { grid-column: 1 / -1; }

/* ==========================================================================
   números
   Figuras proporcionais em valores grandes; tabulares só em colunas.
   ========================================================================== */
.kpi {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px 14px;
  box-shadow: var(--shadow), var(--ring);
  display: flex; flex-direction: column; gap: 1px;
}
.kpi::before { content: ""; position: absolute; inset: 0; background: var(--grad-kpi);
  pointer-events: none; }
.kpi > * { position: relative; }
.kpi .label { font-size: 10.5px; font-weight: 700; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: .07em;
  display: flex; align-items: center; gap: 6px; }
.kpi .label svg.icon { color: var(--accent); font-size: 13px; }
.kpi .label .ibadge { --badge: 24px; border-radius: 7px; }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.03em; line-height: 1.12;
  margin-top: 3px; }
.kpi .foot { font-size: 11.5px; color: var(--ink-muted); }
/* O minigráfico é referência, não protagonista: ele mostra a forma dos
   últimos anos ao lado do número, e não pode crescer até competir com
   ele. Sem o teto, o SVG de 132x30 esticava para a largura do cartão --
   ampliação de duas vezes e meia, com o traço engrossando junto. */
.kpi .spark { margin-top: 7px; max-width: 168px; }
.kpi .spark svg { max-height: 32px; }
/* tom do indicador: a cor reforça o rodapé, nunca informa sozinha */
.kpi.t-good { border-color: color-mix(in srgb, var(--good) 34%, var(--border)); }
.kpi.t-good .label svg.icon { color: var(--good); }
.kpi.t-bad { border-color: color-mix(in srgb, var(--critical) 34%, var(--border)); }
.kpi.t-bad .label svg.icon { color: var(--critical); }
.kpi.hero { grid-column: span 2; }
.kpi.hero .value { font-size: 52px; letter-spacing: -.036em; }
.delta { font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 3px;
  margin-top: 2px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--ink-muted); }

/* ==========================================================================
   tabelas
   ========================================================================== */
.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow), var(--ring); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--grid);
  vertical-align: top; }
th { background: var(--surface-raised); font-size: 11px; font-weight: 700; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  position: sticky; top: 0; z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th .dir { opacity: .6; font-size: 9px; margin-left: 3px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--surface-raised); }
tbody tr.clickable { cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.title { min-width: 250px; max-width: 520px; }
td small { display: block; color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
.empty { padding: 26px; text-align: center; color: var(--ink-muted); font-size: 13px; }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 12px; border-top: 1px solid var(--grid); font-size: 12px; color: var(--ink-2);
  flex-wrap: wrap; }
.tfoot .pager { display: flex; gap: 5px; align-items: center; }
.tfoot button { padding: 3px 9px; font-size: 11.5px; }

/* ==========================================================================
   selos e barras
   Cor de estado nunca vem sozinha: sempre com rótulo.
   ========================================================================== */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--surface-raised); color: var(--ink-2); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge.s-producao  { color: var(--series-1);
  border-color: color-mix(in srgb, var(--series-1) 38%, transparent);
  background: color-mix(in srgb, var(--series-1) 14%, transparent); }
.badge.s-submetido { color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 42%, transparent);
  background: color-mix(in srgb, var(--warning) 15%, transparent); }
.badge.s-aceito    { color: var(--series-3);
  border-color: color-mix(in srgb, var(--series-3) 38%, transparent);
  background: color-mix(in srgb, var(--series-3) 14%, transparent); }
.badge.s-publicado { color: var(--good);
  border-color: color-mix(in srgb, var(--good) 42%, transparent);
  background: color-mix(in srgb, var(--good) 14%, transparent); }
.badge.s-rejeitado { color: var(--critical);
  border-color: color-mix(in srgb, var(--critical) 42%, transparent);
  background: color-mix(in srgb, var(--critical) 14%, transparent); }
.badge.s-arquivado { color: var(--ink-muted); }

.prog { display: inline-flex; gap: 3px; align-items: center; }
.prog i { width: 12px; height: 6px; border-radius: 2px; background: var(--grid); display: block; }
.prog i.on { background: var(--seq-500); }
.prog i.sub { background: var(--warning); }

.meter { height: 8px; border-radius: 4px; background: var(--seq-100); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--seq-500); }

/* ==========================================================================
   gráficos
   ========================================================================== */
figure.chart { margin: 0; }
figure.chart figcaption { font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
svg.plot { display: block; width: 100%; height: auto; overflow: visible; }
/* formas redondas crescem em círculo: sem teto, viram um disco gigante no cartão */
svg.plot.round { max-width: 380px; margin-inline: auto; }
/* Gráfico cuja largura sai do conteúdo -- uma célula por mês, uma por
   semana. Esticá-lo até o container o amplia duas vezes, e a célula vira
   um bloco com o rótulo engrossado junto. */
svg.plot.natural { width: auto; max-width: 100%; margin-inline: auto; }
/* O organograma tem a largura que a equipe tiver. Encolher tudo até caber
   deixaria o nome ilegível; quem rola é a caixa, nunca a página. */
.scrollx { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
svg.plot.tree { width: auto; max-width: none; }
/* ---- controles do simulador de cenarios ---- */
.cen-controles { display: grid; gap: 14px; margin-bottom: 18px; padding: 15px 16px;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  align-items: end; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface-raised); }
.cen-controle { display: grid; gap: 7px; }
.cen-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cen-valor { font-size: 15px; font-weight: 750; color: var(--accent);
  font-variant-numeric: tabular-nums; }
.cursor-cenario { width: 100%; padding: 0; background: transparent; border: none;
  box-shadow: none; accent-color: var(--accent-strong); cursor: pointer; }
.cursor-cenario:hover, .cursor-cenario:focus { background: transparent; }
/* De onde veio o numero, na propria linha em que ele e arrastado. Uma
   nota de rodape dizendo "alguns valores sao suposicoes" nao impede
   ninguem de ler a linha tracejada como previsao. */
.cen-base { display: flex; align-items: flex-start; gap: 5px; font-size: 11px;
  line-height: 1.35; color: var(--ink-muted); }
.cen-base svg.icon { flex: none; margin-top: 1px; color: var(--good); }
.cen-base.suposicao { color: var(--warning); }
.cen-base.suposicao svg.icon { color: var(--warning); }

/* ---- cartao que leva a uma tabela ---- */
/* O <button> herda o visual do cartao; sem isto ele volta a ser botao. */
button.kpi { width: 100%; text-align: left; display: block; padding: 15px 16px;
  font: inherit; cursor: pointer; }
button.kpi:hover { border-color: var(--accent-strong); background: var(--surface-hover); }
button.kpi:active { transform: translateY(1px); }
.kpi-ir { display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
  font-size: 11.5px; font-weight: 650; color: var(--ink-muted);
  transition: color .14s, gap .14s; }
.kpi-ir svg.icon { font-size: 12px; }
button.kpi:hover .kpi-ir { color: var(--accent); gap: 8px; }
button.kpi:focus-visible .kpi-ir { color: var(--accent); }

/* ---- o pais que acabou de mudar, no mapa ao vivo ---- */
.plot .acendeu { animation: acende 1.6s ease-out 1; }
@keyframes acende {
  0%   { opacity: .25; }
  35%  { opacity: 1; }
  100% { opacity: 1; }
}
/* ---- o pais escolhido a mao: o mapa tem de LOCALIZA-LO ----
   `acendeu` pisca e passa ("isto mudou agora"); `emfoco` fica ("e este que
   voce esta olhando"). Com um pais em foco, os demais recuam -- e o recuo
   e de opacidade, nao de cor: trocar a cor do pais mentiria sobre quantos
   artigos ele tem, que e a unica coisa que a cor diz neste mapa. */
.plot:has(.emfoco) g:not(.emfoco):not(.mira-foco) { opacity: .55;
  transition: opacity .35s ease; }
.plot .mira-foco { animation: mira 2.4s ease-out infinite; transform-box: fill-box;
  transform-origin: center; }
@keyframes mira {
  0%   { opacity: .55; }
  40%  { opacity: 1; }
  100% { opacity: .55; }
}
.plot .emfoco { opacity: 1; animation: chega .5s cubic-bezier(.16,.84,.3,1) 1; }
@keyframes chega {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.012); }
  100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .plot .cresce { animation: none; }
  .plot .acendeu { animation: none; }
  .plot .emfoco { animation: none; }
  .plot .mira-foco { animation: none; opacity: 1; }
  .plot:has(.emfoco) g:not(.emfoco):not(.mira-foco) { transition: none; }
  button.kpi:hover .kpi-ir { gap: 5px; }
}

/* o fluxograma tem largura propria: encolher para caber apaga a letra */
svg.plot.fluxo { width: auto; max-width: none; }
svg.plot.tree .node { cursor: default; }
svg.plot.tree .lab { font-size: 13px; fill: var(--ink); }
svg.plot.tree .tick { font-size: 11px; }
/* Sem linhas de grade, a pedido da coordenacao. A regra fica aqui, e nao
   apagada la no charts.js, porque e uma decisao de aparencia e nao de
   dado: para trazer de volta basta apagar o `display: none`.

   O que NAO sai junto: os numeros da escala (`.tick`), a linha do zero
   (`.axis-line`) e o rotulo em cima de cada barra. Sao eles que respondem
   "quanto" depois que a grade some -- tirar a grade sem eles nao deixaria
   o grafico limpo, deixaria o grafico mudo.

   `.estrutura` e o esqueleto de quem nao tem eixo: a teia do radar diz
   onde fica cada variavel, e os meridianos do globo sao a geografia. Sem
   eles nao sobra um grafico limpo -- sobra uma mancha solta no branco. */
.plot .grid-line { display: none; }
.plot .estrutura { stroke: var(--grid); stroke-width: 1; fill: none;
  shape-rendering: crispEdges; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.plot .tick { font-size: 10.5px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.plot .lab { font-size: 10.5px; fill: var(--ink-2); }
.plot .val { font-size: 10.5px; fill: var(--ink-2); font-weight: 650;
  font-variant-numeric: tabular-nums; }
.plot .hero { font-size: 34px; fill: var(--ink); font-weight: 800;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.plot .mark { transition: opacity .12s; }
.plot .mark:hover, .plot .mark:focus-visible { opacity: .82; }
.plot .hit { fill: transparent; cursor: pointer; }
.plot .crosshair { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
.plot .ring { stroke: var(--surface); stroke-width: 2; }
/* entrada dos gráficos: a marca cresce da linha de base ao ser desenhada */
.plot .grow { animation: grow .42s cubic-bezier(.22,.9,.3,1) both; transform-origin: center bottom; }
@keyframes grow { from { transform: scaleY(.02); opacity: .35; } to { transform: scaleY(1); opacity: 1; } }

/* A marca entra, uma depois da outra, na ordem em que é lida.

   O escalonamento tem teto: a partir da décima marca o atraso para de
   crescer. Sem o teto, um gráfico de trinta barras levaria dois segundos
   para terminar de aparecer, e esperar um gráfico carregar não é efeito
   -- é lentidão com música.

   A animação é de OPACIDADE e escala, e termina em 1: nenhuma marca fica
   parada num tamanho que não seja o do seu valor, em nenhum quadro depois
   do fim. Marca que repousa menor do que o dado é gráfico mentindo. */
.plot .cresce {
  animation: entra .5s cubic-bezier(.22,.9,.3,1) both;
  animation-delay: calc(min(var(--passo, 0), 9) * 45ms);
  transform-origin: center;
}
@keyframes entra {
  from { opacity: 0; transform: scale(.94); }
  to   { opacity: 1; transform: scale(1); }
}

/* A tabela entra linha a linha, no mesmo ritmo das marcas do grafico.
   Vale a cada repintura -- ordenar, filtrar, virar pagina, ou o servidor
   avisar que o dado mudou --, que e quando o movimento informa: sem ele,
   reordenar uma tabela de doze linhas nao se distingue de nada ter
   acontecido. Sem deslocamento horizontal e com opacidade terminando em
   1: linha que repousa translucida e tabela parecendo carregando. */
tbody tr.entra-linha {
  animation: entra-linha .34s cubic-bezier(.22,.9,.3,1) both;
  animation-delay: calc(min(var(--passo, 0), 9) * 28ms);
}
@keyframes entra-linha {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  tbody tr.entra-linha { animation: none; }
}

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px;
  font-size: 12px; color: var(--ink-2); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .swatch.line { width: 14px; height: 3px; border-radius: 2px; }
.legend .item.off { opacity: .4; }
.legend.clickable .item { cursor: pointer; }

.scale { display: flex; align-items: center; gap: 8px; margin-top: 10px;
  font-size: 11px; color: var(--ink-muted); }
.scale .ramp { height: 9px; width: 128px; border-radius: 5px; }

/* A nota da hachura na matriz de correlacao. A amostra vem antes do
   texto porque o leitor bate o olho na celula hachurada e procura o que
   aquilo quer dizer -- e procura pela APARENCIA, nao pela frase. */
.scale-nota { display: flex; align-items: center; gap: 7px; margin-top: 6px;
  font-size: 11px; color: var(--ink-muted); }
.amostra-hachura { width: 16px; height: 12px; border-radius: 3px; flex: none;
  border: 1px solid var(--grid); background-color: var(--surface-raised);
  background-image: repeating-linear-gradient(45deg,
    var(--grid) 0 2px, transparent 2px 6px); }

.chart-tools { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
.chart-tools button { padding: 3px 9px; font-size: 11px; }
.table-twin { margin-top: 10px; display: none; }
.table-twin.on { display: block; }

.tip { position: fixed; z-index: 90; pointer-events: none; max-width: 300px;
  background: var(--surface-raised); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 9px 11px; font-size: 12px; color: var(--ink-2);
  opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip .tip-title { font-weight: 700; color: var(--ink); margin-bottom: 5px; font-size: 12.5px; }
.tip .row { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
.tip .key { width: 12px; height: 3px; border-radius: 2px; flex: none; align-self: center; }
.tip .row .v { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .row .n { color: var(--ink-2); }

/* ==========================================================================
   avisos
   ========================================================================== */
.note { background: var(--surface-raised); border: 1px solid var(--border);
  border-left: 3px solid var(--warning); border-radius: var(--radius-sm);
  padding: 11px 14px; font-size: 12.5px; color: var(--ink-2); }
.note b { color: var(--ink); }
.note.info { border-left-color: var(--series-1); }
.note.ok { border-left-color: var(--good); }
.mono { font-family: var(--mono); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
  z-index: 95; max-width: min(560px, 92vw); padding: 12px 18px; font-size: 13.5px;
  background: var(--surface-raised); border: 1px solid var(--border-strong);
  border-left: 4px solid var(--good); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); opacity: 0; transition: .18s; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.erro { border-left-color: var(--critical); }

/* A escala do mapa coroplético: sem ela a cor do país é só uma cor. */
.legenda-mapa { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-top: 10px; font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; }
.legenda-mapa .chave { display: inline-flex; align-items: center; gap: 6px; }
.legenda-mapa .chave i { width: 15px; height: 11px; border-radius: 3px;
  border: 1px solid var(--border-strong); }
.legenda-mapa .unidade { color: var(--ink-muted); }

/* Qual versao esta no ar. Discreta ate alguem procurar por ela -- que e
   exatamente quando "sera que atualizou?" aparece. */
.marca-versao { position: fixed; left: 10px; bottom: 8px; z-index: 90;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
  color: var(--ink-muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px;
  opacity: .38; transition: opacity .16s; pointer-events: auto;
  user-select: all; cursor: default; }
.marca-versao:hover { opacity: 1; }

/* --------------------------------------------------------------------
   Ícones que respondem
   Um ícone que não reage ao ponteiro é desenho; um que reage é botão. O
   movimento é curto de propósito -- o painel tem dezenas deles na tela ao
   mesmo tempo, e um salto grande em cada um vira formigueiro.
   Quem pediu menos movimento no sistema não recebe nenhum.
   -------------------------------------------------------------------- */
button svg.icon, a svg.icon, .clicavel svg.icon {
  transition: color .15s ease, transform .15s cubic-bezier(.2,.9,.3,1.4); }
button:hover svg.icon, a:hover svg.icon, .clicavel:hover svg.icon {
  transform: scale(1.14); }
button:active svg.icon, a:active svg.icon { transform: scale(.96); }
button:focus-visible svg.icon, a:focus-visible svg.icon { color: var(--accent); }

/* O azul acende onde a pessoa está: só no foco e no toque, e some. Halo
   permanente em tudo vira ruído e some junto com o significado. */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: none; box-shadow: var(--glow); border-radius: var(--radius-sm); }

@media (prefers-reduced-motion: reduce) {
  button svg.icon, a svg.icon, .clicavel svg.icon { transition: color .15s ease; }
  button:hover svg.icon, a:hover svg.icon, .clicavel:hover svg.icon,
  button:active svg.icon, a:active svg.icon { transform: none; }
}

@media print {
  body { background: #fff; }
  .no-print, .marca-versao { display: none !important; }
  .card, .tw, .kpi { box-shadow: none; break-inside: avoid; }
  .card::before, .kpi::before { display: none; }
  section { break-inside: avoid; page-break-inside: avoid; }
}


/* ---- a bandeira que treme ----
   Fica no tema, e nao numa tela so: o painel e a area do integrante mostram
   as mesmas bandeiras, e ter a animacao em um lugar deixaria metade do
   sistema com pano parado ao lado de pano ao vento.

   E enfeite, e por isso fica LONGE do dado: nenhuma marca de grafico se
   mexe -- numero que balanca e numero dificil de ler. */
.tremula { display: inline-block; line-height: 1; transform-origin: left center;
  animation: tremular 2.4s ease-in-out infinite; }
@keyframes tremular {
  0%, 100% { transform: perspective(60px) rotateY(0deg) skewY(0deg); }
  25%      { transform: perspective(60px) rotateY(-14deg) skewY(1.2deg); }
  50%      { transform: perspective(60px) rotateY(0deg) skewY(0deg); }
  75%      { transform: perspective(60px) rotateY(14deg) skewY(-1.2deg); }
}
@media (prefers-reduced-motion: reduce) {
  .tremula { animation: none; }
}


/* ---- a bandeira desenhada ----
   Vem em SVG, e nao como emoji: o Windows nao tem bandeira de pais no
   conjunto de emoji -- ele desenha o par de indicadores regionais como as
   duas letras do codigo, e a lista aparecia como "US BR AU". */
.bandeira-svg { width: 21px; height: 14px; display: block; border-radius: 2px; }
.tremula.grande .bandeira-svg { width: 30px; height: 20px; }
/* a pastilha do pais sem desenho: o codigo, mas de proposito */
.bandeira-svg.sem-desenho { opacity: .85; }

/* Progresso contra a meta do ano.

   Três coisas no mesmo trilho: o que já saiu (barra cheia), onde o ano
   provavelmente termina (faixa) e onde está a meta (marca). Separá-las em
   três números obrigaria quem lê a fazer a comparação de cabeça, e a
   pergunta é sempre a mesma -- a faixa alcança a marca?

   A faixa é deliberadamente pálida e listrada: ela é palpite, e palpite
   não pode ter o mesmo peso visual do que aconteceu. */
.meta-trilho {
  position: relative;
  height: 22px;
  border-radius: 999px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  overflow: hidden;
}
.meta-trilho .feito {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 999px;
  background: var(--accent-strong);
  width: var(--feito, 0%);
}
.meta-trilho .faixa {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--de, 0%);
  width: var(--largura, 0%);
  background: repeating-linear-gradient(
    135deg, var(--ink-muted) 0 2px, transparent 2px 6px);
  opacity: .38;
}
.meta-trilho .marca {
  position: absolute;
  top: -3px;
  bottom: -3px;
  left: var(--meta, 100%);
  width: 2px;
  background: var(--ink);
}
.meta-linha { display: grid; gap: 6px; margin-bottom: 18px; }
.meta-linha .topo {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.meta-linha .topo b { font-size: 16px; }
.meta-legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
.meta-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.meta-legenda i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

/* Resumo: o laboratório inteiro numa página.

   Cartões de altura própria numa grade que se reflui. Não há coluna
   fixa: numa tela estreita a grade vira uma coluna só e nada é cortado,
   porque quem abre isto no celular precisa do mesmo conteúdo. */
.resumo { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.resumo .card { align-content: start; }
/* O cartão com gráfico ocupa duas colunas; numa tela que só cabe uma, a
   regra se desfaz sozinha e ele volta a ocupar a largura inteira. */
@media (min-width: 1000px) { .resumo .largo { grid-column: span 2; } }
/* `align-content: start`, e nao `center`: com a leitura em calculo dentro,
   o cartao tem conteudo do topo ao pe. Centrado, ele empurrava tudo para
   o meio e deixava folga igual em cima e embaixo -- o que fazia o nome do
   laboratorio flutuar longe da borda do cartao. */
.resumo-capa { display: grid; gap: 10px; align-content: start; }

/* A leitura em calculo no pe do cartao de identidade: os dois medidores
   lado a lado, e as frases embaixo. Os medidores sao SVG com viewBox, e
   por isso encolhem sozinhos para a largura da coluna -- 150px cada numa
   coluna de 330. */
.leitura-calculo { display: grid; gap: 7px; margin-top: 4px; padding-top: 12px;
  border-top: 1px solid var(--border); }
.leitura-calculo .topo { display: flex; align-items: center; gap: 8px; }
.leitura-calculo .topo select { flex: 1 1 0; min-width: 0; }
.leitura-calculo .medidores { display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; align-items: end; }
.leitura-calculo .medidores > figure { margin: 0; min-width: 0; }
.leitura-calculo .medidores figcaption { font-size: 11px; }
.leitura-calculo .leitura { margin: 0; }
.leitura-calculo button.mini { justify-self: start; padding: 5px 9px;
  font-size: 12.5px; }
.resumo-capa .marca { display: flex; gap: 12px; align-items: center; }
.resumo-capa .lema { margin: 0; font-size: 15px; color: var(--ink-2); }
.resumo-nums {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 14px 10px;
}
.resumo-num { display: grid; gap: 1px; }
.resumo-num b { font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.resumo-num span { font-size: 12px; color: var(--ink-2); }
.resumo-num i { font-size: 11px; font-style: normal; color: var(--ink-muted); }
.resumo-topo {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  display: grid; gap: 3px;
}
.resumo-topo b { font-size: 13px; line-height: 1.35; }

/* Os cinco mais citados, no Resumo. Um por linha: posto, titulo, e o
   numero a direita sobre um trilho proporcional ao primeiro colocado --
   que e o que deixa ver de relance se o topo e disparado ou se os cinco
   andam juntos. O trilho e um so matiz (e uma medida, nao cinco
   identidades) e o numero veste tinta de texto, nunca a cor da barra. */
.top5 { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  display: grid; gap: 8px; }
.top5 .linha { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto;
  align-items: center; gap: 10px; cursor: pointer; }
.top5 .linha:hover .titulo { color: var(--accent-strong); }
.top5 .posto { font-size: 11px; font-weight: 700; color: var(--ink-muted);
  font-variant-numeric: tabular-nums; text-align: right; }
.top5 .titulo { font-size: 12.5px; line-height: 1.3; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.top5 .pe { font-size: 11px; color: var(--ink-muted); }
.top5 .n { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--ink); text-align: right; }
.top5 .trilho { height: 4px; border-radius: 99px; margin-top: 4px;
  background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.top5 .trilho i { display: block; height: 100%; border-radius: 99px;
  width: var(--pct, 0%); background: var(--accent); }

/* A caixa que o gráfico mede antes de se desenhar. Precisa ter largura
   própria e não pode ser encolhida pelo conteúdo: `min-width: 0` numa
   grade é o que impede o SVG de empurrar a coluna. */
.plotbox { width: 100%; min-width: 0; }

/* A composição de um indicador, numa faixa só.

   Fina de propósito: ela explica o número que está acima, não compete com
   ele. O intervalo de 2px entre as partes é o que impede duas cores
   vizinhas de se lerem como uma faixa contínua. */
.kpi-seg {
  display: flex;
  gap: 2px;
  height: 6px;
  margin-top: 10px;
  border-radius: 999px;
  overflow: hidden;
}
.kpi-seg i { display: block; height: 100%; border-radius: 2px; }
.kpi-seg-leg {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  margin-top: 7px; font-size: 11px; color: var(--ink-2);
}
.kpi-seg-leg span { display: inline-flex; align-items: center; gap: 5px; }
.kpi-seg-leg i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

/* ==========================================================================
   VIDA: ícone que reage e botão que responde
   ==========================================================================
   O que se anima aqui é CROMO -- selo de ícone, botão, aba. Nunca marca de
   dado: uma barra que pulsa muda de tamanho aos olhos de quem olha, e o
   tamanho da barra é o próprio dado.

   Toda regra desta seção é de `transition` ou de animação curta disparada
   por hover ou por foco. Nada fica pulsando sozinho para sempre: halo
   permanente vira ruído, e numa tela de parede que fica ligada o dia
   inteiro vira ruído que ninguém consegue desligar. */

.ibadge {
  transition: transform .18s cubic-bezier(.22,.9,.3,1),
              box-shadow .18s, border-color .18s;
}
/* O selo responde ao passar do mouse no que o contém -- no cartão, na
   linha da tabela, no botão. Reagir só sobre si mesmo faria o alvo ser o
   ícone de 34px em vez do cartão inteiro. */
.kpi:hover .ibadge,
button:hover .ibadge,
.navitem:hover .ibadge,
tr:hover .ibadge {
  transform: translateY(-1px) scale(1.06);
  border-color: color-mix(in srgb, var(--tone) 68%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tone) 34%, transparent),
              0 10px 22px -10px color-mix(in srgb, var(--tone) 95%, transparent);
}
/* A aba ativa mantém o selo um pouco à frente: é sinal de ONDE se está,
   e por isso não é hover -- é estado. */
.navitem.active .ibadge {
  transform: scale(1.04);
  border-color: color-mix(in srgb, var(--tone) 72%, transparent);
}

/* O traço do ícone engrossa de leve junto: dá a sensação de foco sem
   mexer no tamanho do desenho. */
.ibadge svg.icon { transition: stroke-width .18s; }
.kpi:hover .ibadge svg.icon,
button:hover .ibadge svg.icon { stroke-width: 2.2; }

/* ---- botões ---- */
/* O brilho entra na borda e cresce por baixo; o corpo do botão não muda de
   cor no hover além do que já mudava. Botão que troca de cor inteira a
   cada passada de mouse cansa numa tela usada o dia todo. */
button, a.botao-destino {
  transition: background .12s, border-color .12s, color .12s,
              transform .1s, box-shadow .18s;
}
button:hover, a.botao-destino:hover {
  box-shadow: var(--ring), 0 0 0 1px color-mix(in srgb, var(--accent-strong) 34%, transparent),
              0 8px 20px -12px color-mix(in srgb, var(--accent-strong) 90%, transparent);
}
button:focus-visible, a.botao-destino:focus-visible {
  outline: none;
  box-shadow: var(--ring), 0 0 0 2px var(--accent-strong);
}
/* O primário ganha um facho que atravessa uma vez ao ser apontado. Uma
   vez: laço infinito num botão é pisca-pisca. */
button.primary { position: relative; overflow: hidden; }
button.primary::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 38%,
              color-mix(in srgb, #fff 26%, transparent) 50%, transparent 62%);
  transform: translateX(-130%);
  pointer-events: none;
}
button.primary:hover::after { animation: facho .62s ease-out 1; }
@keyframes facho { to { transform: translateX(130%); } }

/* ---- a aba e o item de menu ---- */
.navitem { transition: background .14s, color .14s, transform .12s; }
.navitem:hover { transform: translateX(2px); }

@media (prefers-reduced-motion: reduce) {
  .ibadge,
  .kpi:hover .ibadge,
  button:hover .ibadge,
  .navitem:hover .ibadge,
  tr:hover .ibadge,
  .navitem:hover { transform: none; transition: none; }
  .ibadge svg.icon,
  .kpi:hover .ibadge svg.icon,
  button:hover .ibadge svg.icon { stroke-width: 1.9; transition: none; }
  button.primary:hover::after { animation: none; }
}

/* ======================================================================
   HISTÓRIA — a aba que se lê por desenho antes de texto
   ======================================================================
   Um painel de dados inteiro em gráfico não sabe dizer quem é o
   laboratório. Esta seção veste a aba de história: caixa com pastilha,
   trilho de linha do tempo e prosa em largura de leitura. Nada aqui é
   marca de dado -- as cores são as mesmas pastilhas de cromo já usadas
   no menu e nos KPIs, e a paleta validada continua mandando no gráfico.
   ---------------------------------------------------------------------- */
.hcapa { display: grid; gap: 12px; }
.hcapa .marca { display: flex; gap: 14px; align-items: center; }
.hcapa .marca h3 { margin: 0; font-size: 19px; line-height: 1.25; }
.hcapa .lema {
  margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2);
  max-width: 78ch;
}

/* ---- a caixa, peça de que a aba é feita ---- */
.hgrade {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
}
.hgrade.tres { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.hgrade.compacta { grid-template-columns: repeat(auto-fit, minmax(min(100%, 196px), 1fr)); }
.hcaixa {
  display: grid; gap: 7px; align-content: start; min-width: 0;
  padding: 15px 15px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-raised);
  transition: border-color .16s, transform .16s, box-shadow .16s;
}
.hcaixa:hover {
  border-color: color-mix(in srgb, var(--accent-strong) 32%, var(--border));
  transform: translateY(-2px);
  box-shadow: var(--glow);
}
.hcaixa b { font-size: 13.5px; line-height: 1.35; color: var(--ink); }
.hcaixa p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
/* A seta diz o sentido do efeito, e o texto ao lado o repete: seta
   sozinha é sinal por forma só, e forma só não se lê em impressão. */
.hseta {
  font-size: 11.5px; font-weight: 650; color: var(--ink-muted);
  letter-spacing: .01em;
}

/* ---- o trilho da linha do tempo ---- */
.htempo {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: 20px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
}
.hmarco {
  display: grid; gap: 6px; align-content: start; min-width: 0;
  padding-top: 46px; position: relative;
}
/* O fio que liga um marco ao seguinte. Ele nasce no ponto e morre antes
   do próximo, para que a linha do tempo seja lida como sequência e não
   como quatro cartões soltos; o último não tem fio, porque não há para
   onde ir. */
.hmarco::before {
  content: ""; position: absolute; left: 0; right: -12px; top: 19px;
  height: 2px; background: linear-gradient(90deg,
    color-mix(in srgb, var(--accent-strong) 55%, transparent), var(--border));
}
.hmarco:last-child::before { right: auto; width: 38px; }
.hponto {
  position: absolute; top: 0; left: 0;
  background: var(--surface); border-radius: 12px;
}
.hquando {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent);
}
.hmarco b { font-size: 14px; line-height: 1.3; }
.hmarco p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
@media (max-width: 720px) {
  .htempo { grid-template-columns: 1fr; gap: 24px; }
  .hmarco { padding-top: 2px; padding-left: 52px; }
  .hmarco::before {
    left: 18px; right: auto; top: 44px; bottom: -26px;
    width: 2px; height: auto;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent-strong) 55%, transparent), var(--border));
  }
  .hmarco:last-child::before { display: none; }
  .hponto { top: 0; }
}

/* ---- prosa, destaque e etiquetas ---- */
.hprosa {
  margin: 0 0 10px; font-size: 13px; line-height: 1.65; color: var(--ink-2);
  max-width: 68ch;
}
.hprosa:last-child { margin-bottom: 0; }
.hdestaque {
  display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px;
  padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid color-mix(in srgb, var(--accent-strong) 26%, var(--border));
  background: var(--accent-wash);
}
.hdestaque p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.hdestaque b { display: block; font-size: 14px; margin-bottom: 3px; color: var(--ink); }
.hdestaque p + p { margin-top: 5px; }
.hchips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
.hchip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; font-size: 11.5px; font-weight: 650;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-raised); color: var(--ink-2);
}
.hchip svg.icon { color: var(--accent); }

/* ---- a entrada em cascata ----
   O quadro final da animação NÃO fixa transform: se fixasse, o valor da
   animação venceria o `translateY` do :hover no cascata e a caixa
   deixaria de levantar depois de entrar. Por isso `backwards` (que só
   pinta o estado inicial durante o atraso) e um keyframe com `from`
   apenas -- o `to` é o estilo próprio do elemento. */
.hcaixa.entrando, .hmarco.entrando {
  animation: surge .42s cubic-bezier(.16,.84,.3,1) backwards;
  animation-delay: calc(var(--passo, 0) * 45ms);
}
@keyframes surge { from { opacity: 0; transform: translateY(9px); } }
@media (prefers-reduced-motion: reduce) {
  .hcaixa.entrando, .hmarco.entrando { animation: none; }
  .hcaixa, .hcaixa:hover { transition: none; transform: none; box-shadow: none; }
}

/* ======================================================================
   FORMAÇÃO E PRAZOS — a etiqueta de urgência
   ----------------------------------------------------------------------
   Aqui a cor é ESTADO, não identidade: é o uso para o qual a paleta de
   estado existe, e por isso ela nunca aparece como cor de série num
   gráfico. A etiqueta carrega desenho e texto além da cor -- cor sozinha
   não nomeia nada, não sobrevive à impressão e não se lê sem enxergar
   vermelho.
   ---------------------------------------------------------------------- */
.prazo-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 650; white-space: nowrap;
  /* O TEXTO fica em tinta de texto, e nunca no tom do estado. Âmbar sobre
     o fundo claro dá 1,9:1 -- ilegível --, e é exatamente o tom que a
     faixa de 90 dias usa. Quem carrega o estado é o desenho e o aro ao
     lado, que não precisam passar em contraste de texto. */
  color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--faixa, var(--border)) 45%, transparent);
  background: color-mix(in srgb, var(--faixa, var(--surface)) 12%, transparent);
}
.prazo-chip svg.icon { flex: none; color: var(--faixa, var(--ink-2)); }

/* ======================================================================
   ACHADOS DA CURVA — o que o gráfico de linhas passou a dizer
   ----------------------------------------------------------------------
   A lista fica ABAIXO do desenho e nunca dentro dele: anotação sobre a
   figura disputa espaço com o dado, e a frase inteira não cabe ali. Cada
   item corresponde a uma marca no gráfico, na mesma ordem.
   ---------------------------------------------------------------------- */
.achados {
  margin: 12px 0 0; padding: 0; list-style: none;
  display: grid; gap: 5px;
}
.achados li {
  position: relative; padding-left: 18px;
  font-size: 12px; line-height: 1.5; color: var(--ink-2);
}
.achados li::before {
  content: ""; position: absolute; left: 4px; top: 7px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-strong);
}

/* ======================================================================
   LINHAS DE PESQUISA — o mosaico que é botão
   ----------------------------------------------------------------------
   Cada cartão é um <button>: quem olha um cartão de linha quer, logo em
   seguida, os artigos dela. Cartão que parece clicável e não é custa mais
   que cartão inerte, então este é clicável de verdade — com foco visível,
   porque teclado também navega.
   ---------------------------------------------------------------------- */
.linhagrade {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 252px), 1fr));
}
.linhacard {
  display: grid; gap: 10px; align-content: start; min-width: 0;
  padding: 14px 15px 13px; text-align: left; width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-raised); color: inherit; font: inherit;
  cursor: pointer;
  transition: border-color .16s, transform .16s, box-shadow .16s;
}
.linhacard:hover {
  border-color: color-mix(in srgb, var(--cor, var(--accent-strong)) 45%, var(--border));
  transform: translateY(-2px);
  box-shadow: var(--glow);
}
.linhacard:focus-visible {
  outline: 2px solid var(--accent-strong); outline-offset: 2px;
}
.linhacard .topo { display: flex; gap: 10px; align-items: center; min-width: 0; }
.linhacard .topo b {
  font-size: 13px; line-height: 1.3; color: var(--ink);
  overflow-wrap: anywhere;
}
.linhacard .numeros { display: flex; gap: 16px; flex-wrap: wrap; }
.linhacard .numeros span { display: grid; }
.linhacard .numeros b {
  font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.linhacard .numeros i { font-style: normal; font-size: 11px; color: var(--ink-muted); }
/* A barra é a única comparação ENTRE cartões: sem ela, doze caixas do
   mesmo tamanho afirmam que as doze linhas têm o mesmo peso. A escala é
   comum (a maior linha ocupa 100%), senão cada barra mentiria sozinha. */
.linhatrilho {
  display: flex; gap: 2px; height: 7px; border-radius: 4px;
  background: var(--grid); overflow: hidden;
}
.linhatrilho i { display: block; height: 100%; border-radius: 2px; }
.linhacard .abrir {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 650; color: var(--accent);
}
@media (prefers-reduced-motion: reduce) {
  .linhacard, .linhacard:hover { transition: none; transform: none; box-shadow: none; }
}

/* ======================================================================
   ÁRVORE DE ÍCONES — hierarquia em trilho, não em SVG
   ----------------------------------------------------------------------
   Uma árvore desenhada de verdade (raiz centrada sobre os filhos) fica com
   milhares de pixels de largura assim que passa de uma dúzia de folhas, e
   a raiz vai parar fora da tela. O trilho com recuo cabe em 390px, se lê
   de cima para baixo e continua sendo hierarquia.
   ---------------------------------------------------------------------- */
.arv, .arv-ramo { list-style: none; margin: 0; padding: 0; }
.arv-ramo {
  margin-left: 17px; padding-left: 18px;
  border-left: 1px solid var(--border);
}
.arv.compacta .arv-ramo { margin-left: 13px; padding-left: 14px; }
.arv-item { position: relative; margin-top: 4px; }
/* a cotovelinha que liga o trilho ao nó */
.arv-ramo > .arv-item::before {
  content: ""; position: absolute; left: -18px; top: 20px;
  width: 14px; height: 1px; background: var(--border);
}
.arv.compacta .arv-ramo > .arv-item::before { left: -14px; width: 11px; }

.arv-no {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent;
  color: inherit; font: inherit; text-align: left; min-width: 0;
}
.arv-no.clicavel { cursor: pointer; transition: background .14s, border-color .14s; }
.arv-no.clicavel:hover {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--accent-strong) 30%, var(--border));
}
.arv-no.clicavel:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }
.arv-texto { display: grid; min-width: 0; flex: 1; }
.arv-texto b { font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
.arv-texto small { font-size: 11px; color: var(--ink-muted); overflow-wrap: anywhere; }
.arv-valor {
  font-style: normal; font-size: 11.5px; font-weight: 700; flex: none;
  font-variant-numeric: tabular-nums; color: var(--ink-2);
  padding: 1px 8px; border-radius: 999px; background: var(--surface-raised);
}
.arv-no svg.icon { flex: none; color: var(--ink-muted); }
/* O nó que ninguém escuta fica apagado — e diz isso pelo `title`, não só
   pela opacidade: contraste baixo sozinho não é informação. */
.arv-no.mudo { opacity: .55; }

/* ======================================================================
   HISTÓRIA EM CAPÍTULOS — índice de ícones-botão e página de capítulo
   ----------------------------------------------------------------------
   Uma página de dois metros é lida pelo primeiro terço e abandonada, e
   ninguém manda o link dela dizendo "veja o parágrafo sete". Em capítulo,
   cada parte cabe numa tela e tem endereço próprio.
   ---------------------------------------------------------------------- */
.capgrade {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 244px), 1fr));
}
.capcard {
  position: relative; display: grid; gap: 8px; align-content: start;
  min-width: 0; width: 100%; text-align: left;
  padding: 16px 15px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-raised); color: inherit; font: inherit;
  cursor: pointer;
  transition: border-color .16s, transform .16s, box-shadow .16s;
}
.capcard:hover {
  border-color: color-mix(in srgb, var(--accent-strong) 38%, var(--border));
  transform: translateY(-2px); box-shadow: var(--glow);
}
.capcard:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.capcard b { font-size: 14px; line-height: 1.3; }
.capcard p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.capnum {
  position: absolute; top: 12px; right: 14px;
  font-size: 22px; font-weight: 800; line-height: 1;
  color: color-mix(in srgb, var(--ink-muted) 45%, transparent);
  font-variant-numeric: tabular-nums;
}
.capcard .abrir {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: 11.5px; font-weight: 650; color: var(--accent);
}

.capbarra {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.capvoltar { display: inline-flex; align-items: center; gap: 6px; }
.captopo { display: flex; gap: 14px; align-items: center; }
.captopo h3 { margin: 0; font-size: 20px; line-height: 1.25; }
.captopo p { margin: 3px 0 0; }
.capnav {
  display: flex; justify-content: space-between; gap: 10px;
  margin-top: 22px; flex-wrap: wrap;
}
.capnav .navbtn { display: inline-flex; align-items: center; gap: 7px; }
@media (prefers-reduced-motion: reduce) {
  .capcard, .capcard:hover { transition: none; transform: none; box-shadow: none; }
}

/* ======================================================================
   LIGAR ARTIGO A LINHA PELO TÍTULO — a lista de conferência
   ----------------------------------------------------------------------
   Cada item traz a evidência junto: quais palavras do título casaram com
   quais da linha. Proposta sem evidência ao lado é palpite, e palpite não
   se confere — só se aceita ou se recusa no escuro.
   ---------------------------------------------------------------------- */
.sugestao {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 11px; margin-bottom: 6px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-raised); cursor: pointer;
}
.sugestao:hover { border-color: color-mix(in srgb, var(--accent-strong) 30%, var(--border)); }
.sugestao input { margin-top: 3px; flex: none; }
.sugestao span { display: grid; gap: 3px; min-width: 0; }
.sugestao b { font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
.sugestao small { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.listinha { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.listinha li b { font-size: 12.5px; font-weight: 600; display: block; }
.listinha li small { font-size: 11.5px; color: var(--ink-muted); }

/* ======================================================================
   SERVIDOR VELHO — a faixa que explica o "rota não encontrada"
   ----------------------------------------------------------------------
   As telas são lidas do disco a cada acesso; as rotas, só quando o
   processo sobe. Depois de um `git pull` sem reiniciar, a tela nova bate
   numa API antiga e o erro que aparece não diz a ninguém o que fazer.
   Esta faixa diz. Fica no topo, atravessa a página e não se fecha: ela
   descreve um estado que só some reiniciando.
   ---------------------------------------------------------------------- */
.faixa-velha {
  display: grid; gap: 3px;
  padding: 12px 18px; font-size: 13px; line-height: 1.5;
  color: var(--ink);
  background: color-mix(in srgb, var(--warning) 14%, var(--surface));
  border-bottom: 2px solid var(--warning);
}
.faixa-velha b { font-weight: 750; }
.faixa-velha small { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ======================================================================
   A BANCADA — matriz de coleta e barra de protocolo
   ----------------------------------------------------------------------
   A matriz é a tela de trabalho de quem coleta: uma linha por código, uma
   coluna por momento. A cor diz o estado e vem SEMPRE com a palavra
   dentro da pastilha — quem imprime a matriz para levar à sala de coleta
   leva em preto e branco, e cor sozinha não sobrevive a isso.
   ---------------------------------------------------------------------- */
.bancbarra {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  margin-bottom: 4px;
}
.bancbarra select { width: auto; min-width: 240px; }

.matriz { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.matriz th, .matriz td {
  padding: 7px 10px; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.matriz thead th {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-muted);
  background: var(--surface-raised); position: sticky; top: 0;
}
.matriz tbody tr:hover { background: var(--surface-hover); }

.cel {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 650; white-space: nowrap;
  color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--tomcel, var(--border)) 45%, transparent);
  background: color-mix(in srgb, var(--tomcel, var(--surface)) 13%, transparent);
}
.cel-feita    { --tomcel: var(--good); }
.cel-falta    { --tomcel: var(--axis); }
.cel-atrasada { --tomcel: var(--critical); }
.cel-fora     { --tomcel: var(--ink-muted); opacity: .7; }
.legenda-cel {
  display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px;
  font-size: 11.5px; color: var(--ink-2);
}
.legenda-cel span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-cel i.cel { width: 14px; height: 11px; padding: 0; border-radius: 3px; }

/* O relatório é feito para sair impresso: sem cromo, com o texto largo. */
.relatorio h3 { margin: 0 0 4px; font-size: 18px; }
.relatorio .achados { margin-top: 14px; }
.relatorio .placar { margin-top: 16px; width: 100%; }

/* ======================================================================
   O TESTE — o valor-p sem estrela e sem negrito
   ----------------------------------------------------------------------
   Estrela e negrito fazem o trabalho de interpretação sozinhos, e quase
   sempre fazem errado: 0,049 e 0,051 são o mesmo estudo. O p aparece
   grande porque é o que se procura, e em tinta de texto porque não é um
   estado bom nem ruim — é uma medida.
   ---------------------------------------------------------------------- */
.teste {
  padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface-raised);
  display: grid; gap: 5px;
}
.teste + .teste { margin-top: 10px; }
.teste-topo {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.teste-topo b { font-size: 13px; }
.teste-p {
  font-size: 18px; font-weight: 750; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.teste-p i { font-style: italic; font-weight: 500; color: var(--ink-2); }
.teste .hint { font-size: 11.5px; line-height: 1.45; }

/* ======================================================================
   FOMENTO — a lista de editais e de vigências
   ----------------------------------------------------------------------
   Cada item é uma linha com o nome à esquerda e o prazo à direita, e o
   prazo é a coluna que o olho procura. Por isso ele fica encostado na
   borda direita, alinhado entre os itens: uma lista em que o prazo
   flutua conforme o tamanho do nome obriga a ler item por item.
   ---------------------------------------------------------------------- */
.fom-lista { display: grid; gap: 8px; }
.fom-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface-raised);
}
.fom-corpo { display: grid; gap: 2px; min-width: 0; flex: 1 1 240px; }
.fom-corpo b { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.fom-corpo small { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.fom-corpo a { font-size: 11.5px; justify-self: start; }


/* ==========================================================================
   estrutura do painel
   ========================================================================== */
.layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
/* o trilho é sticky e mede 100vh; quem pinta a coluna até o rodapé é a grade */
@media (min-width: 981px) {
  .layout { background: linear-gradient(90deg, var(--surface) 0 243px,
    var(--border) 243px 244px, transparent 244px); }
  nav.side { background: none; border-right: none; }
}

nav.side { position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; }
nav.side .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 18px; }
nav.side .brand .logo { width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  font-weight: 800; font-size: 13px; letter-spacing: .02em; }
nav.side .brand b { display: block; font-size: 15px; }
nav.side .brand small { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 400; }
/* seis seções, uma linha cada: ícone, nome e quantas sub-abas há dentro */
nav.side .navitem { display: flex; align-items: center; gap: 10px; width: 100%;
  text-align: left; background: none; border: none; box-shadow: none; padding: 9px 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13.5px; font-weight: 550;
  position: relative; }
/* pastilha no lugar do traço solto: cada seção passa a ter cor própria, e a
   navegação deixa de ser uma lista cinza de seis linhas iguais */
nav.side .navitem .ibadge { --badge: 30px; }
nav.side .navitem:hover .ibadge { filter: brightness(1.12); }
nav.side .navitem.active .ibadge { box-shadow:
  inset 0 1px 0 color-mix(in srgb, var(--tone) 30%, transparent),
  0 0 0 1px color-mix(in srgb, var(--tone) 46%, transparent),
  0 6px 18px -8px color-mix(in srgb, var(--tone) 90%, transparent); }
nav.side .navitem em { margin-left: auto; font-style: normal; font-size: 11px;
  color: var(--ink-muted); background: var(--surface-raised); border-radius: 999px;
  padding: 1px 7px; font-variant-numeric: tabular-nums; }
nav.side .navitem:hover { background: var(--surface-raised); color: var(--ink); }
nav.side .navitem.active { background: var(--accent-wash); color: var(--accent); font-weight: 700;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-strong) 22%, transparent); }
nav.side .navitem.active::before { content: ""; position: absolute; left: -12px; top: 8px;
  bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
