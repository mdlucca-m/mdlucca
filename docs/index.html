      const barra = el("div", { class: "explorer-controls" });
      const escolha = el("select", {}, (BANCADA.dados.instrumentos || []).map(function (i) {
        return el("option", { value: String(i.id), text: i.nome });
      }));
      escolha.value = String(BANCADA.instrumentoAlfa);
      escolha.addEventListener("change", function () {
        BANCADA.instrumentoAlfa = Number(escolha.value);
        BANCADA.momentoAlfa = null;
        render();
      });
      barra.appendChild(el("div", { class: "field" },
        [el("label", { text: "Instrumento" }), escolha]));

      if ((r.momentos || []).length > 1) {
        const qual = el("select", {}, r.momentos.map(function (m) {
          return el("option", { value: String(m.id), text: m.nome }); }));
        qual.value = String(r.momento_id);
        qual.addEventListener("change", function () {
          BANCADA.momentoAlfa = Number(qual.value); render(); });
        barra.appendChild(el("div", { class: "field" },
          [el("label", { text: "Momento" }), qual]));
      }
      caixa.appendChild(barra);

      if (r.aviso) {
        caixa.appendChild(el("div", { class: "note" }, [
          el("b", { text: "Sem itens declarados. " }),
          el("span", { text: r.aviso }),
        ]));
      }
      (r.escalas || []).forEach(function (e) {
        caixa.appendChild(blocoDaEscala(e));
      });
      caixa.appendChild(formularioDeItens(r));
    }).catch(function (err) {
      caixa.innerHTML = "";
      caixa.appendChild(el("div", { class: "empty", text:
        err.message === "permissao" ? "A bancada é só da coordenação."
                                    : "Não foi possível calcular: " + err.message }));
    });
  });

/* Declarar item a item um questionário de trinta perguntas seriam trinta
   formulários. Aqui se cola a lista inteira: uma linha por item, com o
   que o laboratório já tem escrito no papel. */
function formularioDeItens(r) {
  const area = el("textarea", { rows: "6", class: "search",
    style: "width:100%;font-family:var(--mono);font-size:12px",
    placeholder: "T1 | Tensão | Sinto-me tenso\nT2 | Tensão | Sinto-me nervoso\n"
      + "T3* | Tensão | Sinto-me calmo\nV1 | Vigor | Sinto-me animado" });
  const aviso = el("div", { class: "hint", style: "margin-top:8px" });
  const gravar = el("button", { class: "primary", type: "button",
    text: "Declarar itens", onclick: function () {
      const itens = area.value.split("\n").map(function (linha) {
        const partes = linha.split("|").map(function (x) { return x.trim(); });
        if (!partes[0]) return null;
        /* O asterisco marca o item invertido. É a notação que cabe numa
           linha colada -- e o item invertido é o que mais derruba alfa
           sem que ninguém entenda por quê. */
        const invertido = /\*\s*$/.test(partes[0]);
        return { code: partes[0].replace(/\*\s*$/, ""),
                 subescala: partes[1] || null, enunciado: partes[2] || null,
                 invertido: invertido };
      }).filter(Boolean);
      if (!itens.length) { aviso.textContent = "Cole ao menos um item."; return; }
      gravar.disabled = true;
      aviso.textContent = "Gravando…";
      fetch("/api/bancada", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ o_que: "itens",
          instrumento_id: BANCADA.instrumentoAlfa, itens: itens }) })
        .then(function (resp) { return resp.json().then(function (d) {
          if (!resp.ok) throw new Error(d.error || ("HTTP " + resp.status));
          return d; }); })
        .then(function () { render(); })
        .catch(function (err) { aviso.textContent = "Não deu para gravar: " + err.message; })
        .finally(function () { gravar.disabled = false; });
    } });
  return card("Declarar os itens deste instrumento",
    "Uma linha por item: código | subescala | enunciado. "
    + "Um asterisco no código marca item invertido (T3*).",
    el("div", {}, [area, el("div", { style: "margin-top:10px" }, [gravar]), aviso]));
}

/* ======================================================================
   CORRELACAO ENTRE INSTRUMENTOS
   ----------------------------------------------------------------------
   Nao e um mapa de calor bonito: e a tela onde mais se inventa achado.
   Tres defesas, todas visiveis na propria tela em vez de escondidas num
   rodape que ninguem le:

     · o n de cada celula, porque ele MUDA de par para par;
     · a correcao de multiplos testes, porque 28 pares a 5% produzem
       uma correlacao "significativa" e meia por puro sorteio;
     · o intervalo, porque com vinte pessoas um r de 0,45 vai de 0,00 a
       0,75 -- ou seja, nao se sabe quase nada.
   ====================================================================== */
function seletorDeMomento(r) {
  const lista = r.momentos || [];
  if (lista.length < 2) return el("span");
  const escolha = el("select", {}, lista.map(function (m) {
    return el("option", { value: String(m.id), text: m.nome });
  }));
  escolha.value = String(r.momento_id);
  escolha.addEventListener("change", function () {
    BANCADA.momento = Number(escolha.value);
    render();
  });
  return el("div", { class: "bancbarra" }, [
    el("span", { class: "flabel", text: "Momento" }), escolha,
  ]);
}

function leituraDaMatriz(r) {
  if (!r.pares || !r.pares.length) return null;
  const forte = r.pares.filter(function (x) { return x.sobrevive; })
    .sort(function (a, b) { return Math.abs(b.r) - Math.abs(a.r); })[0];
  if (!forte) {
    return { sinal: "desce", forte: "Nenhuma correlação sobrevive à correção.",
      texto: "Foram " + r.testes + " pares testados de uma vez. A " + r.brutos
        + " com p abaixo de 0,05 esperava-se " + dec(r.esperados_por_sorteio, 1)
        + " só por sorteio, e nenhuma resistiu ao ajuste. Ler qualquer uma "
        + "delas como achado seria ler ruído." };
  }
  /* "andam juntos" com r negativo diz o CONTRÁRIO do número: eles andam
     em sentidos opostos, e no VO2 essa é justamente a boa notícia --
     mais aptidão, menos dor. A frase segue o sinal. */
  return { sinal: "neutro",
    forte: forte.a + (forte.r < 0 ? " e " + forte.b + " andam em sentidos opostos (r = "
                                  : " e " + forte.b + " andam juntos (r = ")
           + dec(forte.r, 2) + ").",
    texto: "Com " + forte.n + " pares completos, o intervalo de 95% vai de "
      + dec(forte.ic[0], 2) + " a " + dec(forte.ic[1], 2) + ". "
      + r.sobreviventes + " de " + r.testes + " pares sobrevivem à correção." };
}

/* O perfil de PERMISSAO de quem esta olhando -- `user_role`, e nao `role`.
   `role` e o vinculo academico ("Professor(a)", "Mestrando(a)") e nao
   concede nada; ler o campo errado ja custou dois defeitos nesta casa,
   nos dois casos deixando a coordenacao sem ver o que e dela. */
const RANQUE = { leitura: 0, integrante: 1, coordenacao: 2, admin: 3 };
function podeVer(minimo) {
  const meu = USER && USER.user_role;
  return (RANQUE[meu] || 0) >= (RANQUE[minimo] || 0);
}

/* ======================================================================
   O LAPE se sustenta?
   ----------------------------------------------------------------------
   Um laboratorio academico nao e limitado por dinheiro antes de ser
   limitado por GENTE COM PRAZO: bolsa termina, tese e defendida, e a
   pessoa vai embora levando o manuscrito que estava escrevendo.

   A pergunta que esta tela responde nao e "quantos vao sair" -- a lista
   de integrantes ja responde. E quantos manuscritos EM CURSO ficam sem
   ninguem quando os prazos chegarem. Um manuscrito em que todos os
   autores do laboratorio saem nao tem quem o termine; um em que alguem
   fica tem. A diferenca entre os dois e a unica coisa aqui que muda uma
   decisao -- e nenhuma media de "producao por pesquisador" a mostra,
   porque media trata pessoas como intercambiaveis.

   O CALCULO NAO MORA AQUI: vem de `/api/sustentabilidade`, que chama o
   `sustentabilidade.py` -- o que tem os testes.

   E a tela e SO DA COORDENACAO, por rota ao vivo. Bolsa e prazo de tese
   nao sao dado de producao, sao dado da vida de uma pessoa, e o payload
   do painel vai inteiro para dentro do HTML exportado e para a TV do
   mural. E a mesma regra do `metrics.SO_DA_COORDENACAO`.
   ====================================================================== */
const ESTADO_SUSTENTA = { meses: 12 };

view("sustenta", "O LAPE se sustenta?", "Pessoas",
  "Quem tem prazo para sair, e quais manuscritos em curso ficam sem dono quando "
  + "esses prazos chegarem.", function (host) {
    if (!LIVE) {
      host.appendChild(el("div", { class: "note", text:
        "Esta tela lê o servidor ao vivo: prazo de bolsa e de tese não viajam "
        + "em arquivo exportado." }));
      return;
    }
    if (!podeVer("coordenacao")) {
      host.appendChild(el("div", { class: "note", text:
        "Só a coordenação vê esta tela: ela mostra prazo de bolsa e de tese "
        + "de cada pessoa, que é dado da vida de alguém e não de produção." }));
      return;
    }
    const palco = el("div");
    host.appendChild(palco);

    function desenhar(d) {
      palco.textContent = "";
      const t = d.trabalho, p = d.pessoas;

      /* ---- a janela, que muda a resposta ---- */
      palco.appendChild(el("div", { class: "toolbar", style: "margin-bottom:14px" }, [
        el("span", { class: "lab", text: "JANELA" }),
        el("div", { class: "segmented", role: "group", "aria-label": "Janela" },
          [6, 12, 24].map(function (m) {
            return el("button", { type: "button",
              class: d.janela_meses === m ? "on" : "",
              text: m + " meses", onclick: function () {
                ESTADO_SUSTENTA.meses = m; buscar(); } });
          })),
        el("span", { class: "hint", text: "de hoje até " + dt(p.limite) }),
      ]));

      /* ---- as tres caixas, e a primeira e a que decide ---- */
      /* Cor de estado aqui é legítima: "sem dono" É um estado ruim, e não
         a identidade de uma série. Órfão em crítico, parcial em alerta,
         firme em bom -- e o número ao lado de cada um, porque cor sozinha
         não nomeia coisa alguma. */
      palco.appendChild(el("div", { class: "grid g3 sec" }, [
        kpi({ label: "Ficam sem dono", value: C.fmt(t.orfaos.length),
          icon: "aviso", tone: t.orfaos.length ? "bad" : "good",
          foot: "todos os autores do LAPE saem na janela",
          leitura: { sinal: t.orfaos.length ? "desce" : "parado",
            forte: t.orfaos.length
              ? t.orfaos.length + " de " + t.em_curso + " em curso"
              : "nenhum",
            texto: t.orfaos.length
              ? "— não há quem termine" : "— todo manuscrito tem quem o termine" } }),
        kpi({ label: "Perdem gente", value: C.fmt(t.parciais.length),
          icon: "pessoas", tone: t.parciais.length ? "warn" : null,
          foot: "alguém sai, alguém fica",
          leitura: { sinal: "parado", forte: "perdem tempo",
            texto: "— não perdem dono" } }),
        kpi({ label: "Firmes", value: C.fmt(t.firmes.length),
          icon: "aceite", tone: "good",
          foot: "ninguém sai na janela" }),
      ]));

      /* ---- o que fazer agora ---- */
      if (t.orfaos.length) {
        palco.appendChild(card("Sem dono quando o prazo chegar",
          "Cada um destes precisa de uma decisão: quem assume, ou o que se "
          + "faz com o manuscrito.",
          el("div", {}, t.orfaos.map(function (x) {
            return el("div", { class: "note warn" }, [
              el("b", { text: (x.code ? x.code + " · " : "") + x.titulo }),
              el("div", { class: "hint", text: "saem: " + x.saindo.map(function (s) {
                return s.quem + " (" + dt(s.quando) + ", " + s.motivo + ")"; })
                .join(" · ") }),
            ]);
          }))));
      }

      /* ---- de quem depende o que esta em curso ---- */
      /* Um "18" sozinho convida a pergunta "18 de quem?". A contagem por
         PESSOA responde onde agir: um unico prazo pode tocar quase tudo
         que esta na bancada, e nesse caso a decisao e sobre aquela pessoa
         -- nao sobre dezoito manuscritos. */
      const toca = {};
      t.orfaos.concat(t.parciais).forEach(function (x) {
        x.saindo.forEach(function (sai) {
          const a = toca[sai.quem] || (toca[sai.quem] = {
            quem: sai.quem, quando: sai.quando, motivo: sai.motivo, n: 0 });
          a.n += 1;
        });
      });
      const porPessoa = Object.keys(toca).map(function (k) { return toca[k]; })
        .sort(function (a, b) { return b.n - a.n; });
      if (porPessoa.length) {
        palco.appendChild(card("De quem depende o que está em curso",
          "Quantos manuscritos em curso têm esta pessoa entre os autores — "
          + "e ela tem prazo dentro da janela.",
          [
            C.bars({ items: porPessoa.map(function (x) {
                return { label: x.quem, value: x.n }; }),
              mono: true, caption: "manuscritos em curso" }),
            el("div", { class: "hint", text: porPessoa.map(function (x) {
              return x.quem + ": " + x.motivo + " em " + dt(x.quando);
            }).join(" · ") }),
          ]));
      }

      /* ---- quem sai ---- */
      palco.appendChild(card("Quem tem prazo nos próximos " + d.janela_meses + " meses",
        p.saem.length ? null : "Ninguém, pelas datas declaradas.",
        p.saem.length ? dataTable({
          cols: [
            { k: "quem", label: "Quem" },
            { k: "vinculo", label: "Vínculo" },
            { k: "quando", label: "Quando", render: function (r) { return dt(r.quando); } },
            { k: "motivo", label: "Motivo" },
            { k: "dias", label: "Faltam", num: true, render: function (r) {
              return r.ja_passou ? el("span", { class: "badge bad",
                text: "venceu há " + Math.abs(r.dias) + " d" })
                : dur(r.dias); } },
          ],
          rows: p.saem, sortKey: "quando", sortDir: 1, pageSize: 20,
          file: "prazos-do-lape",
        }) : null));

      /* ---- entradas e saidas: o saldo, com sinal ---- */
      /* O saldo, e não duas séries: a pergunta é se o laboratório repõe
         quem forma. Acima do zero cresceu, abaixo encolheu -- e os dois
         números crus vão na legenda, porque saldo zero com 5 entradas e 5
         saídas não é o mesmo laboratório que saldo zero com 0 e 0. */
      const r = d.renovacao || [];
      palco.appendChild(card("Repõe quem forma?",
        "Formar gente é perder gente por construção — a saída de quem "
        + "defendeu é um sucesso. O que a série mostra é se a reposição acompanha.",
        [
          C.columns({ labels: r.map(function (x) { return String(x.ano); }),
            series: [{ label: "saldo", values: r.map(function (x) { return x.saldo; }) }],
            mono: true, height: 200, caption: "entradas menos saídas, por ano" }),
          el("div", { class: "hint", text: r.map(function (x) {
            return x.ano + ": " + x.entraram + " entraram, " + x.sairam + " saíram";
          }).join(" · ") }),
        ]));

      /* ---- a ressalva, que não é rodapé ---- */
      if (p.sem_prazo.length) {
        palco.appendChild(card("Sem prazo declarado (" + p.sem_prazo.length + ")",
          "Estes NÃO contam como quem fica.",
          [
            el("div", { class: "note info", text: p.sem_prazo.map(function (x) {
              return x.quem; }).join(", ") }),
            el("div", { class: "hint", text:
              "Ausência de data não é permanência: é ausência de data. Declarar "
              + "o fim da bolsa e o prazo da tese no cadastro de cada pessoa é o "
              + "que faz esta tela responder de verdade." }),
          ]));
      }
      palco.appendChild(el("div", { class: "hint", style: "margin-top:4px" }, [
        el("span", { text: "Esta tela cruza prazo com manuscrito em curso. A lista "
          + "de quem está em formação, com bolsa e defesa de cada um, está em " }),
        el("button", { class: "ghost mini", type: "button",
          text: "Formação e prazos",
          onclick: function () { go("formacao"); } }),
      ]));

      if (t.sem_autoria_interna) {
        palco.appendChild(el("div", { class: "note info", text:
          t.sem_autoria_interna + " manuscrito(s) em curso não têm nenhum autor "
          + "do LAPE identificado — nem entram como firmes nem como órfãos, "
          + "porque não há o que afirmar. Confira a autoria deles." }));
      }

      /* ---- o dinheiro tem dono, e é outra tela ---- */
      const dinheiro = d.dinheiro;
      if (dinheiro) {
        const fecham = (dinheiro.fecham_logo || []).length;
        const terminam = (dinheiro.terminam_logo || []).length;
        const ir = el("button", { class: "ghost", type: "button",
          onclick: function () { go("fomento"); } },
          [el("span", { text: "abrir Fomento" }), Icons.get("proximo", 13)]);
        palco.appendChild(card("E o dinheiro",
          "A captação tem tela própria — aqui fica só o que vence.",
          [
            leituraDe({ sinal: (fecham || terminam) ? "desce" : "parado",
              forte: fecham + " edital(is) fechando",
              texto: "· " + terminam + " vigência(s) terminando" }),
            ir,
          ]));
      }
    }

    function buscar() {
      palco.textContent = "";
      palco.appendChild(el("div", { class: "hint", text: "lendo os prazos…" }));
      fetch("/api/sustentabilidade?meses=" + encodeURIComponent(ESTADO_SUSTENTA.meses),
            { headers: { Accept: "application/json" } })
        .then(function (resp) { return resp.ok ? resp.json() : null; })
        .then(function (d) {
          if (!d) { palco.textContent = ""; palco.appendChild(
            C.empty("Não deu para ler os prazos agora.")); return; }
          desenhar(d);
        })
        .catch(function () {
          palco.textContent = "";
          palco.appendChild(C.empty("Não deu para ler os prazos agora."));
        });
    }
    buscar();
  });

view("correlacoes", "Correlações", "Bancada",
  "Como os instrumentos andam juntos, com o n de cada par e a correção de múltiplos testes.",
  function (host) {
    if (!LIVE) {
      host.appendChild(el("div", { class: "note", text:
        "Esta tela lê o servidor ao vivo: medida de participante não viaja em arquivo." }));
      return;
    }
    const caixa = el("div");
    host.appendChild(caixa);
    caixa.appendChild(el("div", { class: "empty", text: "Calculando…" }));

    bancadaBuscar("/api/bancada" + (BANCADA.protocolo
      ? "?protocolo=" + BANCADA.protocolo : "")).then(function (dados) {
      BANCADA.dados = dados;
      if (!BANCADA.protocolo && (dados.protocolos || []).length) {
        BANCADA.protocolo = dados.protocolos[0].id;
      }
      return bancadaBuscar("/api/bancada/correlacoes?protocolo=" + BANCADA.protocolo
        + (BANCADA.momento ? "&momento=" + BANCADA.momento : "")
        + "&metodo=" + (BANCADA.metodoCorr || "spearman"));
    }).then(function (r) {
      caixa.innerHTML = "";
      const barra = el("div", { class: "explorer-controls" });
      barra.appendChild(seletorDeProtocolo());
      barra.appendChild(seletorDeMomento(r));

      /* Spearman por padrao porque escala clinica e ordinal. A troca fica
         a vista: quem quiser a relacao reta pede, e compara. */
      const metodo = BANCADA.metodoCorr || "spearman";
      barra.appendChild(el("div", { class: "segmented", role: "group",
        "aria-label": "Método de correlação" }, [
        el("button", { type: "button", class: metodo === "spearman" ? "on" : "",
          text: "Spearman (postos)", onclick: function () {
            BANCADA.metodoCorr = "spearman"; render(); } }),
        el("button", { type: "button", class: metodo === "pearson" ? "on" : "",
          text: "Pearson (reta)", onclick: function () {
            BANCADA.metodoCorr = "pearson"; render(); } }),
      ]));
      caixa.appendChild(barra);

      if (r.aviso) {
        caixa.appendChild(el("div", { class: "empty", text: r.aviso }));
        return;
      }

      const leitura = leituraDaMatriz(r);
      if (leitura) caixa.appendChild(leituraDe(leitura));

      caixa.appendChild(el("div", { class: "grid g4", style: "margin:16px 0" }, [
        kpi({ label: "Pares testados", value: C.fmt(r.testes) }),
        kpi({ label: "Com p < 0,05", value: C.fmt(r.brutos) }),
        kpi({ label: "Sobrevivem à correção", value: C.fmt(r.sobreviventes),
              tone: r.sobreviventes ? "good" : null }),
        kpi({ label: "Esperados por sorteio", value: dec(r.esperados_por_sorteio, 1) }),
      ]));

      caixa.appendChild(C.matriz({
        caption: "Correlação de " + (metodo === "spearman" ? "Spearman" : "Pearson")
          + (r.momento ? " · " + r.momento : ""),
        nomes: r.nomes, pares: r.pares, testes: r.testes,
        emptyMessage: "sem instrumentos suficientes neste momento",
        table: {
          cols: [{ k: "a", label: "Instrumento" }, { k: "b", label: "Instrumento" },
                 { k: "n", label: "Pares" },
                 // o r cru sai com ponto decimal; o resto da tabela usa
                 // vírgula, e duas convenções na mesma linha é erro de leitura
                 { k: "r", label: "r", get: function (x) { return dec(x.r, 2); } },
                 { k: "ic", label: "IC 95%", get: function (x) {
                     return x.ic ? dec(x.ic[0], 2) + " a " + dec(x.ic[1], 2) : "—"; } },
                 { k: "p", label: "p", get: function (x) { return pValor(x.p); } },
                 { k: "p_ajustado", label: "p corrigido",
                   get: function (x) { return pValor(x.p_ajustado); } }],
          rows: r.pares,
        },
      }));

      /* Onde os dois metodos discordam, o numero nao e o problema: o
         dado e. Discordancia grande aponta valor distante ou relacao
         curva, e as duas se veem no diagrama de dispersao, nunca na
         matriz. */
      const discordam = (r.pares || []).filter(function (x) { return x.discorda; });
      if (discordam.length) {
        caixa.appendChild(el("div", { class: "note" }, [
          el("b", { text: "Olhe a dispersão destes pares. " }),
          el("span", { text: "Spearman e Pearson discordam em "
            + discordam.length + " par(es): "
            + discordam.map(function (x) { return x.a + " × " + x.b; }).join("; ")
            + ". A diferença costuma ser um valor distante puxando a reta, ou uma "
            + "relação que sobe e depois desce — nenhuma das duas aparece na matriz." }),
        ]));
      }

      caixa.appendChild(el("div", { class: "hint", text:
        "Correlação não é causa, e aqui menos ainda: todas as medidas são do mesmo "
        + "momento, então nenhuma vem antes da outra no tempo." }));
    }).catch(function (err) {
      caixa.innerHTML = "";
      caixa.appendChild(el("div", { class: "empty", text:
        err.status === 403
          ? "A bancada é só da coordenação."
          : "Não foi possível calcular: " + err.message }));
    });
  });

function _leituraDoPoder(linhas, r, plano) {
  const medio = linhas.find(function (x) { return x.d === 0.5; }) || {};
  const alcanca = (medio.poder_atual || 0) >= 0.8;
  if (alcanca) {
    return { sinal: "sobe", forte: "A amostra alcança um efeito médio.",
      texto: "Com " + r.menor_grupo + " no menor grupo, um efeito de d = 0,5 "
        + "seria detectado em " + Math.round(medio.poder_atual * 100) + "% das vezes." };
  }
  return { sinal: "desce",
    forte: "A amostra só alcança efeito a partir de d = "
      + dec(plano.menor_detectavel_80, 2) + ".",
    texto: "Um efeito médio (d = 0,5) seria detectado em apenas "
      + Math.round((medio.poder_atual || 0) * 100) + "% das vezes com "
      + r.menor_grupo + " no menor grupo. Para chegar a 80% seriam precisos "
      + (medio.n80 || "—") + (r.plano && r.plano.pareado ? " pessoas." : " por grupo.") };
}

/* Um formulário de uma linha para cada coisa que se declara. Os seis
   formulários desta tela têm a mesma forma e mudam só os campos; escrever
   seis à mão seria seis lugares para divergir. */
function formularioSimples(oQue, campos, rota) {
  const entradas = {};
  const linha = el("div", { class: "explorer-controls" });
  campos.forEach(function (spec) {
    let node;
    if (spec.opcoes) {
      node = el("select", {}, (spec.opcoes || []).map(function (o) {
        return el("option", { value: o.code, text: o.label }); }));
    } else {
      node = el("input", { class: "search", type: spec.tipo || "text",
        placeholder: spec.exemplo || "" });
    }
    entradas[spec.campo] = node;
    linha.appendChild(el("div", { class: "field" },
      [el("label", { text: spec.rotulo }), node]));
  });
  const aviso = el("div", { class: "hint", style: "margin-top:8px" });
  const gravar = el("button", { class: "primary", type: "button", text: "Gravar",
    onclick: function () {
      const corpo = { o_que: oQue };
      for (const chave in entradas) {
        const bruto = entradas[chave].value;
        if (bruto === "") continue;
        corpo[chave] = isNaN(Number(bruto)) || entradas[chave].type !== "number"
          ? bruto : Number(bruto);
      }
      gravar.disabled = true;
      aviso.textContent = "Gravando…";
      fetch(rota || "/api/bancada", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo) })
        .then(function (r) { return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; }); })
        .then(function () { render(); })
        .catch(function (err) { aviso.textContent = "Não deu para gravar: " + err.message; })
        .finally(function () { gravar.disabled = false; });
    } });
  linha.appendChild(gravar);
  return el("div", { style: "margin-top:14px" }, [linha, aviso]);
}

/* ordem de leitura do painel inteiro — governa as setas "anterior/próxima" */
const ORDER = SECTIONS.reduce(function (acc, sec) { return acc.concat(sec.views); }, []);
function viewOf(id) { return VIEWS.find(function (v) { return v.id === id; }) || null; }
function sectionOf(id) {
  return SECTIONS.find(function (sec) { return sec.views.indexOf(id) >= 0; }) || SECTIONS[0];
}
function labelOf(id) { const v = viewOf(id); return v ? v.label : id; }

let current = ORDER[0];
const HOST = document.getElementById("view");

/* "/" põe o foco na busca e Esc a esvazia — o par que todo painel de dados
   tem, e que dispensa levar a mão ao mouse para filtrar. O atalho não rouba
   a tecla de quem já está escrevendo num campo. */
document.addEventListener("keydown", function (ev) {
  const alvo = ev.target;
  const escrevendo = alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA"
    || alvo.tagName === "SELECT" || alvo.isContentEditable);
  const campo = document.getElementById("busca");
  if (ev.key === "/" && !escrevendo && campo) {
    ev.preventDefault();
    campo.focus();
    campo.select();
  } else if (ev.key === "Escape" && campo && document.activeElement === campo) {
    campo.value = "";
    STATE.busca = "";
    campo.blur();
    buildToolbar();
    render();
  }
});

function buildNav() {
  const nav = document.getElementById("nav");
  nav.querySelectorAll(".navitem, .railfoot").forEach(function (n) { n.remove(); });
  const active = sectionOf(current);
  SECTIONS.forEach(function (sec) {
    const on = sec.id === active.id;
    const btn = el("button", {
      class: "navitem" + (on ? " active" : ""), type: "button", "data-section": sec.id,
      title: sec.label, "aria-current": on ? "page" : null,
      onclick: function () { go(sec.views[0]); },
    });
    btn.appendChild(Icons.badge(sec.icon, null, null));
    btn.appendChild(el("span", { text: sec.label }));
    btn.appendChild(el("em", { text: String(sec.views.length) }));
    nav.appendChild(btn);
  });
  nav.appendChild(el("div", { class: "railfoot no-print",
    text: "Alt + 1…" + SECTIONS.length + " troca de seção." }));
}

function buildSubnav() {
  const bar = document.getElementById("subnav");
  bar.innerHTML = "";
  const sec = sectionOf(current);
  bar.appendChild(el("span", { class: "secname" }, [Icons.get(sec.icon, 15),
    el("b", { text: sec.label })]));
  sec.views.forEach(function (id) {
    const v = viewOf(id);
    if (!v) return;
    const on = id === current;
    const btn = el("button", {
      class: "subitem" + (on ? " on" : ""), type: "button", "data-view": id,
      "aria-current": on ? "page" : null,
      onclick: function () { go(id); },
    });
    btn.appendChild(Icons.get(VIEW_ICON[id] || "linha", 15));
    btn.appendChild(el("span", { text: v.label }));
    bar.appendChild(btn);
  });
}

/* O endereço pode ter uma segunda parte: "#historia/equipe" é a aba
   `historia` aberta no capítulo `equipe`. Quem roteia só entende a
   primeira; a segunda é da aba, que a lê de `location.hash`. Sem esta
   separação, colar o link de um capítulo caía no Resumo -- porque
   `viewOf("historia/equipe")` não existe e o roteador desistia. */
function abaDe(hash) {
  return String(hash || "").replace("#", "").split("/")[0];
}

function go(id) {
  if (!viewOf(abaDe(id))) id = ORDER[0];
  current = abaDe(id);
  /* o endereço guarda o id inteiro, com a segunda parte quando houver */
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  buildNav();
  buildSubnav();
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* Plotagem sob demanda: só a sub-aba visível é desenhada, com o recorte atual. */
function render() {
  const v = viewOf(current) || VIEWS[0];
  const barra = document.getElementById("toolbar");
  if (barra) barra.hidden = SEM_FILTROS.indexOf(v.id) >= 0;
  C.hideTip();
  HOST.innerHTML = "";
  const title = el("h2", {});
  title.appendChild(Icons.badge(VIEW_ICON[v.id] || "linha", null, null));
  title.appendChild(el("span", { text: v.label }));
  HOST.appendChild(el("header", { class: "viewhead" }, [
    title,
    v.lead ? el("p", { class: "lead", text: v.lead }) : null,
  ]));
  const body = el("div");
  HOST.appendChild(body);
  try {
    v.render(body);
  } catch (err) {
    body.appendChild(el("div", { class: "note", text: "Falha ao desenhar esta aba: " + err.message }));
    if (window.console) console.error(err);
  }

  /* pontes para o mesmo assunto em outras seções */
  const related = (RELATED[v.id] || []).filter(function (id) { return id !== v.id && viewOf(id); });
  if (related.length) {
    const chips = el("div", { class: "related no-print" },
      [el("span", { class: "flabel", text: "Continue por" })]);
    related.forEach(function (id) {
      const chip = el("button", { type: "button", class: "chip", onclick: function () { go(id); } });
      chip.appendChild(Icons.get(VIEW_ICON[id] || "linha", 14));
      chip.appendChild(el("span", { text: labelOf(id) }));
      chips.appendChild(chip);
    });
    HOST.appendChild(chips);
  }

  const idx = ORDER.indexOf(v.id);
  const prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const back = el("span"), fwd = el("span");
  const nav = el("nav", { class: "secnav no-print", "aria-label": "Navegar entre sub-abas" });
  if (prev) {
    const b = el("button", { type: "button", class: "navbtn",
      onclick: function () { go(prev); } });
    b.appendChild(el("span", { class: "arrow", text: "←" }));
    b.appendChild(el("span", { text: labelOf(prev) }));
    nav.appendChild(b);
  } else nav.appendChild(back);
  if (next) {
    const b = el("button", { type: "button", class: "navbtn",
      onclick: function () { go(next); } });
    b.appendChild(el("span", { text: labelOf(next) }));
    b.appendChild(el("span", { class: "arrow", text: "→" }));
    nav.appendChild(b);
  } else nav.appendChild(fwd);
  HOST.appendChild(nav);
  updateCount();
}

/* ==================================================================== */
/* tempo real                                                            */
/* ==================================================================== */
/* Dois caminhos, na ordem: o servidor empurra por SSE (/api/stream) e o
   painel redesenha no mesmo segundo; se o navegador ou um proxy no meio
   não segurar a conexão, cai para a conferência periódica em /api/state.
   A sondagem nunca é desligada de todo — ela é a rede de proteção. */
const REFRESH_MS = 25000;        /* sem SSE: confere a cada 25 s */
const REFRESH_SLOW_MS = 120000;  /* com SSE: só para não perder nada */
const SETTLE_MS = 700;           /* junta uma rajada de eventos num só redesenho */
let refreshTimer = null;
let settleTimer = null;
let stream = null;
let lastStamp = null;
let autoOn = LIVE;
let streamOn = false;
let lastEvent = null;

function stampOf(state) {
  return [state.articles, state.members, state.submissions, state.events, state.projects,
    state.pending_discoveries,
    (state.last_ingest && state.last_ingest[0] || {}).run_at].join("|");
}
async function checkForUpdates(force) {
  if (!LIVE) return;
  try {
    const response = await fetch("/api/state", { headers: { Accept: "application/json" } });
    if (!response.ok) return;
    const state = await response.json();
    const stamp = stampOf(state);
    if (!force && lastStamp !== null && stamp === lastStamp) { markFresh(state); return; }
    lastStamp = stamp;
    await reload(state);
  } catch (err) { /* rede instável: tenta no próximo ciclo */ }
}
async function reload(state) {
  const app = document.getElementById("app");
  app.classList.add("reloading");   /* segura o desenho anterior — sem esqueleto, sem salto */
  try {
    const response = await fetch("/api/metrics", { headers: { Accept: "application/json" } });
    if (!response.ok) return;
    const fresh = await response.json();
    fresh.session = D.session;
    fresh.geo = D.geo;
    fresh.mundo = D.mundo;
    D = fresh;
    indexAuthorship();
    buildToolbar();
    render();
    markFresh(state);
  } finally {
    app.classList.remove("reloading");
  }
}
function markFresh(state) {
  const node = document.getElementById("freshness");
  if (!node) return;
  const now = new Date();
  node.classList.toggle("push", streamOn);
  node.textContent = (streamOn ? "ao vivo" : "conferindo") + " · "
    + String(now.getHours()).padStart(2, "0") + ":"
    + String(now.getMinutes()).padStart(2, "0")
    + (lastEvent ? " · " + lastEvent : "")
    + (state && state.pending_discoveries
      ? " · " + state.pending_discoveries + " achados pendentes" : "");
}

/* Uma rajada (o curador cadastra dez artigos seguidos) vira um redesenho só. */
function settle() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(function () { checkForUpdates(true); }, SETTLE_MS);
}
function openStream() {
  if (!LIVE || !autoOn || typeof EventSource === "undefined") return;
  try { stream = new EventSource("/api/stream"); } catch (err) { return; }
  stream.addEventListener("pronto", function () {
    streamOn = true;
    startAuto();
    markFresh(null);
  });
  stream.addEventListener("mudanca", function (ev) {
    try {
      const data = JSON.parse(ev.data);
      lastEvent = data.event || null;
    } catch (err) { lastEvent = null; }
    pulse();
    settle();
  });
  stream.addEventListener("error", function () {
    /* o EventSource reconecta sozinho; o que muda aqui é o ritmo da sondagem */
    streamOn = false;
    startAuto();
    markFresh(null);
  });
}
function closeStream() {
  if (stream) { stream.close(); stream = null; }
  streamOn = false;
}
/* sinal de que algo chegou, antes mesmo do redesenho terminar */
function pulse() {
  const node = document.getElementById("freshness");
  if (!node) return;
  node.classList.remove("pulse");
  void node.offsetWidth;
  node.classList.add("pulse");
}

function buildHeader() {
  const o = D.overview;
  document.getElementById("labName").textContent = o.lab_name;
  const meta = document.getElementById("labMeta");
  meta.innerHTML = "";
  [o.institution, "Atualizado em " + o.generated_at, "Janela de " + o.window + " anos"]
    .forEach(function (text) { meta.appendChild(el("span", { class: "pill", text: text })); });
  if (LIVE) meta.appendChild(el("span", { class: "pill live", id: "freshness", text: "ao vivo" }));

  const actions = document.getElementById("actions");
  actions.innerHTML = "";
  if (LIVE) {
    const link = el("a", { href: "/app" });
    link.appendChild(el("button", { class: "primary", type: "button",
      text: USER ? "Área do integrante" : "Entrar" }));
    actions.appendChild(link);
    if (USER) {
      const analitico = el("a", { href: "/panorama",
        title: "Painel analítico: o que o laboratório estuda, como isso se move no "
          + "tempo e o que ainda não foi olhado" });
      analitico.appendChild(el("button", { type: "button", text: "Panorama" }));
      actions.appendChild(analitico);
      const triagem = el("a", { href: "/triagem",
        title: "Triagem de revisão sistemática: importar as buscas, decidir "
          + "pelo teclado e ver o PRISMA sair sozinho" });
      triagem.appendChild(el("button", { type: "button", text: "Triagem" }));
      actions.appendChild(triagem);
    }
    const tv = el("a", { href: "/mural", target: "_blank", rel: "noopener",
      title: "Tela para projetor ou TV da sala: gira sozinha" });
    tv.appendChild(el("button", { type: "button", text: "Modo mural" }));
    actions.appendChild(tv);
    actions.appendChild(el("button", { type: "button", text: "Atualizar agora",
      onclick: function (ev) {
        ev.target.disabled = true;
        checkForUpdates(true).finally(function () { ev.target.disabled = false; });
      } }));
    const auto = el("button", { type: "button", text: "Tempo real: ligado",
      title: "Receber as mudanças do servidor assim que acontecem",
      onclick: function () {
        autoOn = !autoOn;
        auto.textContent = autoOn ? "Tempo real: ligado" : "Tempo real: desligado";
        if (autoOn) { openStream(); startAuto(); }
        else { closeStream(); clearInterval(refreshTimer); }
        markFresh(null);
      } });
    auto.prepend(Icons.get("raio", 14));
    actions.appendChild(auto);
  }
  actions.appendChild(el("button", { type: "button", text: "Imprimir",
    onclick: function () { print(); } }));
  if (USER) actions.appendChild(el("span", { class: "pill", text: USER.full_name }));

  document.getElementById("foot").textContent =
    "Painel do " + o.lab_name + " gerado em " + o.generated_at
    + ". Fontes: planilhas do laboratório, Currículo Lattes, OpenAlex, Crossref, Scopus e Web of Science.";
}
function startAuto() {
  clearInterval(refreshTimer);
  if (!autoOn) return;
  refreshTimer = setInterval(function () {
    if (document.visibilityState === "visible") checkForUpdates(false);
  }, streamOn ? REFRESH_SLOW_MS : REFRESH_MS);
}

function setupTheme() {
  const toggle = document.getElementById("themeToggle");
  let stored = null;
  try { stored = localStorage.getItem("lape-theme"); } catch (e) { /* janela privada */ }
  if (stored) document.documentElement.setAttribute("data-theme", stored);
  toggle.addEventListener("click", function () {
    /* Sem escolha gravada, o painel está CLARO -- a folha não segue o
       sistema. Perguntar ao sistema aqui faria o primeiro clique num
       Windows escuro "trocar para claro" estando já claro, e nada mudava.
       A leitura é do atributo, e é por isso que ela acompanha a troca do
       padrão: quem não escolheu nada não tem atributo, e cai no padrão --
       basta que a comparação aqui nomeie o OUTRO tema, o que está no
       `:root[data-theme="..."]` da folha, e nunca o padrão. */
    const claro = document.documentElement.getAttribute("data-theme") !== "dark";
    const next = claro ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("lape-theme", next); } catch (e) { /* ignora */ }
    render();   /* os gráficos leem as cores dos tokens: basta redesenhar */
  });
}

function boot() {
  buildHeader();
  buildToolbar();
  const asked = abaDe(location.hash);
  current = viewOf(asked) ? asked : ORDER[0];
  buildNav();
  buildSubnav();
  render();
  setupTheme();

  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeDrawer(); });
  addEventListener("hashchange", function () {
    const id = abaDe(location.hash);
    if (id && id !== current) go(id);
    else if (id === current) render();   /* mudou só o capítulo */
  });
  /* teclado: alterna a seção sem tirar a mão do teclado */
  addEventListener("keydown", function (ev) {
    if (ev.altKey && ev.key >= "1" && ev.key <= String(SECTIONS.length)) {
      ev.preventDefault();
      go(SECTIONS[Number(ev.key) - 1].views[0]);
    }
  });
  const toTop = document.getElementById("toTop");
  addEventListener("scroll", function () { toTop.classList.toggle("on", scrollY > 600); });
  toTop.addEventListener("click", function () { scrollTo({ top: 0, behavior: "smooth" }); });

  if (LIVE) { markFresh(null); openStream(); startAuto(); }
  addEventListener("beforeunload", closeStream);
}
boot();

</script>
</body>
</html>
