/* ======================================================================
   CÁLCULO DA CURVA — derivada, aceleração, integral e limiar
   ======================================================================
   Um mapa visual: cada painel responde UMA pergunta sobre a mesma curva,
   e cada pergunta é uma operação diferente sobre ela.

     nível      onde estamos          a curva
     derivada   a que velocidade      velocímetro
     2ª deriv.  acelerando ou freando acelerômetro
     integral   quanto se acumulou    área (só onde ela significa algo)
     limiar     quando cruzou a meta  a linha de corte

   O CÁLCULO NÃO MORA AQUI. Ele vem de `/api/curva`, que chama o
   `estatistica.py` -- o mesmo código que tem os testes. Refazer a
   integral em JavaScript daria duas implementações da mesma conta, e as
   duas divergiriam no dia em que alguém consertasse uma. */

view("calculo", "Cálculo da curva", "Produção",
  "A mesma curva lida de quatro maneiras: nível, velocidade, aceleração e "
  + "acumulado. Cada painel é uma operação, e cada operação responde uma "
  + "pergunta que as outras não respondem.", function (host) {
    /* A curva escolhida sobrevive ao redesenho da tela -- e a tela
       redesenha a cada aviso do servidor. Sem isto, quem escolhesse
       "Citacoes" voltaria para "Acervo" sozinho no primeiro evento de
       tempo real, no meio da leitura. */
    const estado = { serie: (ESTADO_DO_CALCULO.serie || "acervo") };
    const palco = el("div");
    host.appendChild(palco);

    function desenhar(d) {
      palco.textContent = "";
      const serie = d.serie || {};
      const pontos = d.pontos || [];
      const anos = pontos.map(function (p) { return String(p.t); });
      const valores = pontos.map(function (p) { return p.v; });

      /* --------------- escolher a curva --------------- */
      const escolha = el("select", { "aria-label": "Curva a analisar",
        onchange: function (ev) {
          estado.serie = ev.target.value;
          ESTADO_DO_CALCULO.serie = estado.serie;
          buscar();
        } },
        (d.disponiveis || []).map(function (x) {
          return el("option", { value: x.code, text: x.rotulo,
            selected: x.code === serie.code ? "selected" : null });
        }));
      palco.appendChild(el("div", { class: "toolbar", style: "margin-bottom:14px" }, [
        el("span", { class: "lab", text: "CURVA" }), escolha,
        el("span", { class: "hint", text: serie.kind === "estoque"
          ? "é um nível: sobe e não desce"
          : "é um ritmo: pode subir e descer" }),
      ]));

      if (d.aviso) {
        palco.appendChild(card(null, null, el("div", { class: "empty", text: d.aviso })));
        return;
      }

      /* --------------- 1. a curva --------------- */
      const limiar = d.limiar;
      const aCurva = card("A curva — " + serie.rotulo, serie.explica, [
        C.area({ labels: anos,
          series: [{ label: serie.rotulo, values: valores }],
          mono: true, height: 260,
          reference: limiar ? limiar.valor : null,
          referenceLabel: limiar ? "meta" : null,
          caption: serie.unidade + " por ano" }),
      ]);

      /* --------------- 2. velocímetro --------------- */
      const taxas = (d.derivada && d.derivada.trechos) || [];
      const agora = taxas.length ? taxas[taxas.length - 1].taxa : null;
      const teto = Math.max.apply(null, taxas.map(function (t) {
        return Math.abs(t.taxa); }).concat([1]));
      /* A régua do ponteiro é o MAIOR ritmo que este laboratório já teve,
         e não um número redondo escolhido por mim. Um velocímetro com
         escala inventada mede a invenção: a agulha em 60% de 20 não diz
         nada se ninguém nunca chegou perto de 20. Em 60% do próprio
         recorde, diz. */
      const velocimetro = card("Derivada — a que velocidade",
        "O ritmo do último ano, contra o maior ritmo da janela.", [
        agora === null
          ? C.empty("Sem dois anos seguidos não há velocidade.")
          : C.gauge({ value: Math.max(0, agora), max: Math.ceil(teto),
              display: (agora > 0 ? "+" : "") + C.fmt(agora),
              unit: serie.unidade_taxa || "por ano",
              color: C.token(agora < 0 ? "--div-neg-4" : "--accent-strong"),
              caption: "velocidade atual" }),
        leituraDe({
          sinal: agora === null ? "parado" : (agora > 0 ? "sobe" : (agora < 0 ? "desce" : "parado")),
          forte: agora === null ? "—" : (agora > 0 ? "+" : "") + C.fmt(agora) + " por ano",
          texto: agora === null ? "" : (d.derivada.geral !== null
            ? "média da janela: " + (d.derivada.geral > 0 ? "+" : "")
              + C.fmt(d.derivada.geral) + " por ano"
            : ""),
        }),
        /* Ritmo negativo num velocímetro de zero a máximo encosta no zero
           e se lê "parado", que é outra coisa. Então quando ele é negativo
           a frase diz, com todas as letras, para onde está indo. */
        agora !== null && agora < 0 ? el("div", { class: "note warn", text:
          "Ritmo negativo: a curva está DESCENDO. O ponteiro encosta no zero "
          + "porque a escala começa nele — o número ao lado é o que vale." }) : null,
      ].filter(Boolean));

      /* --------------- 3. acelerômetro --------------- */
      const ace = d.aceleracao || {};
      const limiteAce = Math.max.apply(null, (ace.trechos || []).map(function (t) {
        return Math.abs(t.aceleracao); }).concat([1]));
      const acelerometro = card("Aceleração — acelerando ou freando",
        "A derivada da derivada. Uma curva pode estar subindo e perdendo "
        + "força ao mesmo tempo, e isso a velocidade sozinha não mostra.", [
        ace.agora === null || ace.agora === undefined
          ? C.empty(ace.aviso || "Sem três anos não há aceleração.")
          /* `unidade_aceleracao`, e nao `unidade_taxa`: derivar muda a
             unidade. Com a da taxa, este medidor mostrava aceleração
             rotulada "artigos/ano" -- a unidade da VELOCIDADE. O
             ponteiro estava certo e o rótulo mentia, que é o pior dos
             dois: quem lê confere o número no rótulo. */
          : C.acelerometro({ value: ace.agora, limite: Math.ceil(limiteAce),
              unit: serie.unidade_aceleracao || "por ano²",
              caption: "aceleração" }),
        ace.agora !== null && ace.agora !== undefined ? leituraDe({
          sinal: ace.agora > 0 ? "sobe" : (ace.agora < 0 ? "desce" : "parado"),
          forte: ace.agora > 0 ? "ganhando força"
            : (ace.agora < 0 ? "perdendo força" : "ritmo constante"),
          texto: agora !== null && agora > 0 && ace.agora < 0
            ? "ainda sobe, mas cada ano sobe menos do que o anterior"
            : (agora !== null && agora < 0 && ace.agora > 0
               ? "ainda desce, mas a queda está diminuindo"
               : (ace.geral !== null && ace.geral !== undefined
                  ? "na janela inteira: " + (ace.geral > 0 ? "+" : "") + C.fmt(ace.geral)
                  : "")),
        }) : null,
      ].filter(Boolean));

      /* --------------- 4. a derivada, trecho a trecho --------------- */
      const daTaxa = taxas.length ? card("A derivada ano a ano",
        "Cada coluna é a variação de um ano para o outro. Acima do zero "
        + "cresceu, abaixo encolheu.", [
        C.columns({ labels: taxas.map(function (t) { return String(t.ate); }),
          series: [{ label: "variação", values: taxas.map(function (t) { return t.taxa; }) }],
          mono: true, height: 200, caption: serie.unidade_taxa || "por ano" }),
      ]) : null;

      /* --------------- 5. integral ou soma --------------- */
      let acumulado;
      if (d.integral && d.integral.bruta !== null) {
        acumulado = card("Integral — área sob a curva",
          "Num nível, a área mede EXPOSIÇÃO: quanto de produção o "
          + "laboratório manteve de pé ao longo da janela.", [
          el("div", { class: "resumo-nums" }, [
            el("div", { class: "resumo-num" }, [
              el("b", { text: C.fmt(d.integral.bruta) }),
              el("span", { text: d.integral.unidade || "área" }),
              el("i", { text: "área bruta" })]),
            el("div", { class: "resumo-num" }, [
              el("b", { text: C.fmt(d.integral.media_no_tempo) }),
              el("span", { text: serie.unidade }),
              el("i", { text: "média no período" })]),
            el("div", { class: "resumo-num" }, [
              el("b", { text: C.fmt(d.integral.duracao) }),
              el("span", { text: "anos" }),
              el("i", { text: "duração da janela" })]),
          ]),
          /* A área incremental desconta o ponto de partida, e é a que
             responde "o que ESTE período fez" -- num laboratório de vinte
             anos, a bruta é dominada pelo acervo que já existia antes da
             janela e premia o passado. */
          el("div", { class: "note info", html:
            "<b>" + C.fmt(d.integral.incremental) + " " + (d.integral.unidade || "")
            + "</b> descontando o nível de partida ("
            + C.fmt(d.integral.base) + "). É esta que responde o que a janela "
            + "acrescentou — a bruta é dominada pelo que já existia antes dela." }),
        ]);
      } else if (d.soma) {
        acumulado = card("Acumulado — a soma, e não a integral",
          "Aqui a integral seria um erro, e por isso ela não aparece.", [
          el("div", { class: "resumo-nums" }, [
            el("div", { class: "resumo-num" }, [
              el("b", { text: C.fmt(d.soma.total) }),
              el("span", { text: d.soma.unidade }),
              /* "acumulado", e nao "somados": a unidade muda de genero de
                 uma serie para outra, e o participio concordaria errado
                 em metade delas. */
              el("i", { text: "acumulado na janela" })]),
          ]),
          el("div", { class: "note info", text: d.soma.porque }),
        ]);
      } else {
        acumulado = null;
      }

      /* --------------- 6. limiar --------------- */
      let oLimiar;
      if (limiar) {
        oLimiar = card("Limiar — a meta declarada",
          limiar.de_onde + ": " + C.fmt(limiar.valor) + " " + serie.unidade, [
          leituraDe({
            sinal: limiar.terminou_do_lado_bom ? "sobe" : "desce",
            forte: limiar.terminou_do_lado_bom ? "acima da meta" : "abaixo da meta",
            texto: limiar.cruzou_em
              ? "cruzou por volta de " + C.fmt(limiar.cruzou_em)
                + (limiar.estimado ? " (estimado entre duas medições)" : "")
              : (limiar.comecou_do_lado_bom
                 ? "já estava acima no início da janela"
                 : "ainda não cruzou nesta janela"),
          }),
          limiar.voltou ? el("div", { class: "note warn", text:
            "Cruzou e voltou: passou da meta em algum ano e caiu abaixo "
            + "depois. Olhando só o começo e o fim, isso desaparece." }) : null,
        ].filter(Boolean));
      } else {
        /* Sem meta declarada NÃO se desenha uma linha de corte. Uma linha
           num número redondo que ninguém escolheu é pior que nenhuma:
           quem olha supõe que o laboratório a declarou, e passa a se
           comparar com ela. */
        oLimiar = card("Limiar — sem meta declarada",
          "Não há linha de corte para esta curva.", [
          el("div", { class: "note info", html:
            "O limiar sai da <b>meta declarada pela coordenação</b>, em "
            + "\"Objetivos do ano\" — e de nenhum outro lugar. Desenhar uma linha "
            + "num número redondo escolhido por mim faria quem olha supor que o "
            + "laboratório a declarou, e se comparar com ela." }),
        ]);
      }

      aCurva.classList.add("largo");
      palco.appendChild(el("div", { class: "grid resumo" },
        [aCurva, velocimetro, acelerometro, daTaxa, acumulado, oLimiar].filter(Boolean)));
    }

    function buscar() {
      palco.textContent = "";
      palco.appendChild(el("div", { class: "hint", text: "calculando…" }));
      fetch("/api/curva?serie=" + encodeURIComponent(estado.serie),
            { headers: { Accept: "application/json" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) { palco.textContent = ""; palco.appendChild(
            C.empty("Não deu para calcular a curva agora.")); return; }
          desenhar(d);
        })
        .catch(function () {
          palco.textContent = "";
          palco.appendChild(C.empty("Não deu para calcular a curva agora."));
        });
    }
    buscar();
  });

view("equipe", "Por integrante", "Métricas internas",
  "Envolvimento de cada pessoa nos artigos do recorte atual.", function (host) {
    const rows = articles();
    /* Esta tela é HISTÓRICO, e por isso quem saiu do laboratório continua
       aqui: os artigos que a pessoa escreveu ela escreveu mesmo, e apagá-la
       falsificaria o passado. O que muda é o rótulo -- "(saiu)" ao lado do
       nome --, para ninguém ler uma coluna alta como equipe de hoje. O
       mural, que fala no presente, filtra de verdade. */
    const counts = (D.researchers || []).map(function (person) {
      const set = MEMBER_ARTICLES.get(person.id) || new Set();
      const own = rows.filter(function (a) { return set.has(a.id); });
      const saiu = person.active === 0 || !!person.left_on;
      return Object.assign({}, person, {
        saiu: saiu,
        full_name: person.full_name + (saiu ? " (saiu)" : ""),
        short_name: (person.short_name || person.full_name) + (saiu ? " (saiu)" : ""),
        f_total: own.length,
        f_published: own.filter(function (a) { return a.status === "publicado"; }).length,
        f_progress: own.filter(function (a) { return a.status === "em_producao"; }).length,
        f_submitted: own.filter(function (a) {
          return a.status === "submetido" || a.status === "em_revisao"; }).length,
      });
    }).filter(function (p) { return p.f_total > 0; })
      .sort(function (a, b) { return b.f_total - a.f_total; });
    const top = counts.slice(0, 14);
    host.appendChild(card("Envolvimento por etapa",
      "Cada coluna é uma pessoa; as faixas mostram em que etapa estão os artigos dela.",
      C.columns({
        mode: "empilhado",
        labels: top.map(function (r) { return cut(r.short_name || r.full_name, 12); }),
        series: [
          { label: "Em produção", values: top.map(function (r) { return r.f_progress; }) },
          { label: "Submetidos", values: top.map(function (r) { return r.f_submitted; }) },
          { label: "Publicados", values: top.map(function (r) { return r.f_published; }) },
        ],
        height: 300, file: "equipe-etapas",
        onSelect: function (label) {
          const person = top.find(function (r) {
            return cut(r.short_name || r.full_name, 12) === label; });
          if (person) showResearcher(person.id);
        },
        table: { cols: [{ label: "Integrante", k: "full_name" },
          { label: "Em produção", k: "f_progress", num: true },
          { label: "Submetidos", k: "f_submitted", num: true },
          { label: "Publicados", k: "f_published", num: true }], rows: top },
      })));
    /* realizado contra a média do laboratório: quem está acima e quem está abaixo */
    if (counts.length > 1) {
      const meta = Math.round(10 * counts.reduce(function (acc, r) { return acc + r.f_total; }, 0)
        / counts.length) / 10;
      host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
        card("Cada um contra a média do laboratório",
          "A barra é o que a pessoa tem; o traço, a média de " + dec(meta, 1) + " artigo(s).",
          C.bullet({
            items: top.map(function (r) {
              return { label: r.short_name || r.full_name, value: r.f_total, target: meta,
                max: top[0].f_total, onClick: function () { showResearcher(r.id); } };
            }),
            file: "equipe-meta",
            table: { cols: [{ label: "Integrante", k: "full_name" },
              { label: "Artigos", k: "f_total", num: true }], rows: top },
          })),
        card("Índice h e produção", "Duas medidas que costumam andar juntas — quando não andam, vale olhar.",
          C.scatter({
            points: counts.filter(function (r) { return r.h_index; }).map(function (r) {
              return { x: r.f_total, y: r.h_index, label: r.short_name || r.full_name,
                onSelect: function () { showResearcher(r.id); } };
            }),
            xLabel: "artigos no recorte", yLabel: "índice h", height: 280, file: "h-producao",
            emptyMessage: "Nenhum índice h preenchido ainda. Rode o rastreador na tarefa 'perfis'.",
          })),
      ]));
    }
    host.appendChild(el("div", { style: "margin-top:16px" }, dataTable({
      title: "Integrantes no recorte", file: "equipe", sortKey: "f_total",
      onRow: function (r) { showResearcher(r.id); },
      cols: [
        { k: "full_name", label: "Integrante", wide: true, render: function (r) {
          return el("div", {}, [r.full_name,
            el("small", { text: [r.role, r.research_line].filter(Boolean).join(" · ") || "—" })]); } },
        { k: "f_total", label: "Artigos", num: true },
        { k: "f_progress", label: "Em produção", num: true },
        { k: "f_submitted", label: "Submetidos", num: true },
        { k: "f_published", label: "Publicados", num: true },
        { k: "n_projects", label: "Projetos", num: true },
        { k: "h_index", label: "Índice h", num: true },
      ],
      rows: counts, emptyMessage: "Ninguém corresponde aos filtros atuais.",
    })));
  });

view("tempos", "Tempos do ciclo", "Métricas internas",
  "Quanto tempo cada etapa leva, do início do artigo até a publicação.", function (host) {
    const rows = articles();
    const grupos = [
      { label: "Início → publicação", key: "days_start_to_publication" },
      { label: "Submissão → aceite", key: "days_submission_to_acceptance" },
      { label: "Aceite → publicação", key: "days_acceptance_to_publication" },
    ].map(function (g) {
      return { label: g.label, values: rows.map(function (a) { return a[g.key]; })
        .filter(function (v) { return v !== null && v !== undefined; }).map(Number) };
    });
    const comDados = grupos.filter(function (g) { return g.values.length; });
    const ICONE = ["relogio", "submissao", "aceite"];
    host.appendChild(el("div", { class: "grid g3" }, grupos.map(function (g, i) {
      return kpi({ label: g.label, icon: ICONE[i],
        value: g.values.length ? dur(median(g.values)) : "—",
        foot: g.values.length ? g.values.length + " artigo(s) com as duas datas" : "sem dados" });
    })));

    /* Cascata do ciclo. Só entram os artigos com as quatro datas: aí as médias
       das etapas somam exatamente a média do total, e a leitura fecha. */
    const completos = rows.filter(function (a) {
      return a.started_on && a.first_submission_on && a.accepted_on && a.published_on;
    });
    if (completos.length) {
      const dias = function (de, ate) {
        return Math.round((new Date(ate) - new Date(de)) / 86400000);
      };
      const medio = function (fn) {
        return Math.round(completos.reduce(function (acc, a) { return acc + fn(a); }, 0)
          / completos.length);
      };
      const etapas = [
        { label: "Escrita", value: medio(function (a) { return dias(a.started_on, a.first_submission_on); }) },
        { label: "Revisão", value: medio(function (a) { return dias(a.first_submission_on, a.accepted_on); }) },
        { label: "Produção", value: medio(function (a) { return dias(a.accepted_on, a.published_on); }) },
      ];
      etapas.push({ label: "Total", value: etapas.reduce(function (acc, e) { return acc + e.value; }, 0),
        total: true });
      host.appendChild(el("div", { style: "margin-top:16px" }, card(
        "Onde o tempo é gasto", "Média de dias por etapa nos " + completos.length
        + " artigo(s) com as quatro datas preenchidas — por isso as etapas somam o total.",
        C.waterfall({ items: etapas, height: 260, file: "cascata-do-ciclo",
          table: { cols: [{ label: "Etapa", k: "label" }, { label: "Dias", k: "value", num: true }],
            rows: etapas } }))));
    }
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "Distribuição de cada etapa", "Caixa: intervalo interquartil. Traço: mediana. Pontos: artigos.",
      comDados.length ? C.distribution({ groups: comDados, labelWidth: 200, file: "tempos" })
        : C.empty("Preencha as datas de início, submissão, aceite e publicação."))));
    const valores = grupos[0].values;
    if (valores.length) {
      const bins = [[0, 180, "< 6 meses"], [180, 365, "6-12 meses"], [365, 730, "1-2 anos"],
        [730, 1095, "2-3 anos"], [1095, Infinity, "> 3 anos"]];
      host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" }, [
        card("Do início à publicação", "Quantos artigos em cada faixa de tempo.",
          C.columns({ labels: bins.map(function (b) { return b[2]; }),
            series: [{ label: "Artigos", values: bins.map(function (b) {
              return valores.filter(function (v) { return v >= b[0] && v < b[1]; }).length; }),
              color: C.token("--series-1") }],
            height: 240, file: "faixas-tempo" })),
        card("Tentativas × tempo", "Quantas submissões cada artigo exigiu e quanto tempo levou.",
          C.scatter({
            points: rows.filter(function (a) { return a.days_start_to_publication; })
              .map(function (a) {
                return { x: a.submission_attempts || 0, y: Math.round(a.days_start_to_publication),
                  label: cut(a.title, 60), onSelect: function () { showArticle(a); } }; }),
            xLabel: "tentativas de submissão", yLabel: "dias até publicar", height: 280,
            file: "tentativas-tempo" })),
      ]));
    }
    host.appendChild(el("div", { style: "margin-top:16px" }, dataTable({
      title: "Artigos publicados ou aceitos", file: "tempos-artigos", sortKey: "published_on",
      onRow: showArticle,
      cols: [
        { k: "title", label: "Artigo", wide: true,
          render: function (r) { return tituloComAtalho(r); } },
        { k: "journal", label: "Revista" },
        { k: "started_on", label: "Início", render: function (r) { return dt(r.started_on); } },
        { k: "first_submission_on", label: "1ª submissão",
          render: function (r) { return dt(r.first_submission_on); } },
        { k: "accepted_on", label: "Aceite", render: function (r) { return dt(r.accepted_on); } },
        { k: "published_on", label: "Publicação", render: function (r) { return dt(r.published_on); } },
        { k: "days_start_to_publication", label: "Início→pub.", num: true,
          render: function (r) { return dur(r.days_start_to_publication); } },
        { k: "submission_attempts", label: "Tentativas", num: true },
      ],
      rows: rows.filter(function (a) { return a.status === "publicado" || a.status === "aceito"; }),
      emptyMessage: "Nenhum artigo publicado ou aceito neste recorte.",
    })));
  });

view("submissoes", "Submissões e recusas", "Métricas internas",
  "Histórico de envios: quantas tentativas cada artigo exigiu, o intervalo entre elas e por que foi recusado.",

function fluxoSubmissoes() {
  const sub = D.submissions;
  if (!sub.per_journal.length) return null;
  const revistas = sub.per_journal.slice(0, 6);
  const nodes = [{ id: "envio", label: "Submissões", depth: 0, color: C.token("--series-1") }];
  const links = [];
  revistas.forEach(function (j, i) {
    nodes.push({ id: "j" + i, label: cut(j.journal, 24), depth: 1, color: C.serie(i % 8) });
    links.push({ source: "envio", target: "j" + i, value: j.n, group: i % 8 });
  });
  const desfechos = [
    { id: "aceito", label: "Aceito", color: C.token("--good"),
      get: function (j) { return j.accepted; } },
    { id: "recusado", label: "Recusado", color: C.token("--critical"),
      get: function (j) { return j.rejected; } },
    { id: "aguardando", label: "Em avaliação", color: C.token("--warning"),
      get: function (j) { return Math.max(0, j.n - j.accepted - j.rejected); } },
  ];
  desfechos.forEach(function (d) {
    if (revistas.reduce(function (a, j) { return a + d.get(j); }, 0) > 0) {
      nodes.push({ id: d.id, label: d.label, depth: 2, color: d.color });
    }
  });
  revistas.forEach(function (j, i) {
    desfechos.forEach(function (d) {
      const v = d.get(j);
      if (v > 0) links.push({ source: "j" + i, target: d.id, value: v, group: i % 8 });
    });
  });
  return C.sankey({ nodes: nodes, links: links, unit: "submissão(ões)", height: 330,
    file: "fluxo-submissoes",
    table: { cols: [{ label: "Revista", k: "journal" }, { label: "Submissões", k: "n", num: true },
      { label: "Aceitas", k: "accepted", num: true }, { label: "Recusadas", k: "rejected", num: true }],
      rows: sub.per_journal } });
}

/* O contorno do mundo é 70 kB e não muda; vem uma vez por sessão e fica.
   Pedi-lo a cada redesenho faria o painel ao vivo buscá-lo de minuto em
   minuto sem necessidade nenhuma. */
let mundoPedido = false;
function pedirMundo() {
  if (mundoPedido) return;
  mundoPedido = true;
  fetch("/api/geo/mundo.json")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (dados) {
      D.mundo = (dados || {}).paises || [];
      if (current === "espacial") render();
    })
    .catch(function () { mundoPedido = false; });
}

/* O que mudou desde o último desenho. Num painel de parede, "ao vivo" que
   não se vê é o mesmo que parado: sem isto, um artigo novo da Noruega
   muda um número que ninguém estava olhando. */
let paisesAntes = null;
function paisesQueMudaram(valores) {
  const antes = paisesAntes;
  paisesAntes = Object.assign({}, valores);
  if (!antes) return [];          /* o primeiro desenho não pisca nada */
  return Object.keys(valores).filter(function (k) { return valores[k] !== antes[k]; });
}

/* ==================================================================== */
/* cenários: o que teria de mudar, e o que isso pediria                 */
/* ==================================================================== */
/* Um simulador de cenários é o lugar mais fácil de mentir num painel.
   Ele desenha o futuro com a mesma tinta do passado, e de longe as duas
   linhas são uma só. Três regras seguram isso aqui:

     · o projetado é TRACEJADO e sem marcador — o ponto redondo é reservado
       ao que foi medido;
     · toda projeção sai como FAIXA, nunca como linha só: dizer "dá entre
       9 e 15" é a única frase honesta sobre um ano que não aconteceu;
     · todo parâmetro diz de onde veio, e o que não pôde ser medido é
       rotulado como suposição na própria tela, não numa nota de rodapé.  */

/* O estado dos controles vive fora da função que desenha: o painel se
   redesenha a cada evento ao vivo, e um cenário que se apaga sozinho a
   cada artigo cadastrado não serviria para conversar com ninguém. */
const CENARIO = { ritmo: null, pesquisadores: null, atraso: null, horizonte: null };

/* A conta inteira, isolada de propósito para poder ser testada no Node.
   `ritmoBase` é o que o laboratório faz hoje; `alvo`, o que o cenário
   pede. O atraso é a rampa entre os dois — nada muda no dia em que se
   decide mudar. */
function projetarCenario(base, ajuste) {
  const hoje = base.ano_corrente;
  const anos = base.anos.slice();
  const serie = base.serie.slice();
  const ultimoReal = serie.length ? serie[serie.length - 1] : 0;
  const escala = ajuste.pesquisadoresBase > 0
    ? ajuste.pesquisadores / ajuste.pesquisadoresBase : 1;
  const alvo = ajuste.ritmo * escala;
  const rampaMeses = Math.max(ajuste.atraso, 1);

  const futuros = [];
  for (let k = 1; k <= ajuste.horizonte; k++) futuros.push(hoje + k);
  const valorEm = function (ano, taxa) {
    const meses = (ano - hoje) * 12;
    const fracao = Math.max(0, Math.min(1, meses / rampaMeses));
    return ultimoReal + (taxa - ultimoReal) * fracao;
  };

  /* A linha do cenário repete o realizado até hoje e só então se separa:
     duas séries que começam em pontos diferentes do eixo não se ligam, e
     um cenário que nasce solto no meio do gráfico não se lê. */
  const linha = serie.slice();
  const baixo = serie.slice();
  const alto = serie.slice();
  futuros.forEach(function (ano) {
    linha.push(round1(valorEm(ano, alvo)));
    baixo.push(round1(valorEm(ano, alvo * 0.7)));
    alto.push(round1(valorEm(ano, alvo * 1.3)));
  });

  /* Quando a velocidade volta a ser positiva: o primeiro ano projetado
     que supera o anterior. É a pergunta que o cenário existe para
     responder, e ela não se lê no desenho. */
  let viraEm = null;
  for (let i = serie.length; i < linha.length; i++) {
    if (linha[i] > linha[i - 1] + 1e-9) { viraEm = anos.concat(futuros)[i]; break; }
  }
  const acumulado = round1(linha.slice(serie.length)
    .reduce(function (a, b) { return a + b; }, 0));

  return {
    anos: anos.concat(futuros), linha: linha, baixo: baixo, alto: alto,
    corte: serie.length,            /* onde o medido acaba */
    alvo: round1(alvo), ultimoReal: ultimoReal, viraEm: viraEm,
    chegaEm: linha[linha.length - 1], acumulado: acumulado,
    porPessoa: ajuste.pesquisadores > 0
      ? round1(alvo / ajuste.pesquisadores * 10) / 10 : null,
  };
}
function round1(v) { return Math.round(v * 10) / 10; }

function controleDeCenario(par, valor, aoMudar) {
  const campo = el("input", {
    type: "range", min: String(par.minimo), max: String(par.maximo),
    step: String(par.passo), value: String(valor), class: "cursor-cenario",
    "aria-label": par.rotulo,
    oninput: function (ev) { aoMudar(Number(ev.target.value)); },
  });
  const unidade = function (v) {
    return Math.abs(v) === 1 && par.unidade_um ? par.unidade_um : par.unidade; };
  const lido = el("b", { class: "cen-valor",
    text: dec(valor, par.passo < 1 ? 1 : 0) + " " + unidade(valor) });
  return el("div", { class: "cen-controle" }, [
    el("div", { class: "cen-topo" }, [
      el("span", { class: "flabel", text: par.rotulo }), lido]),
    campo,
    /* de onde veio o número, na própria linha em que ele é arrastado */
    el("div", { class: "cen-base" + (par.medido ? "" : " suposicao") }, [
      Icons.get(par.medido ? "qualidade" : "aviso", 12),
      el("span", { text: (par.medido ? "medido: " : "suposição: ") + par.base }),
    ]),
  ]);
}

/* árvore de ícones — o organograma hierárquico reaproveitável            */
/* ====================================================================== */
/* Peça de framework, e não desenho de uma tela só: recebe uma raiz com
   filhos e devolve a hierarquia inteira, em qualquer profundidade.

   Por que trilho e recuo, e não caixas ligadas por linhas desenhadas:
   uma árvore com vinte folhas desenhada em SVG fica com três mil pixels
   de largura e a raiz -- centrada sobre todos os filhos -- vai parar no
   meio, fora da tela. Foi a mesma razão que pôs o organograma das pessoas
   em colunas. O trilho cabe em 390px e continua sendo hierarquia.

   Cada nó pode ser botão: `ir` leva a uma aba, `onClick` faz qualquer
   coisa, e sem os dois o nó é um <div> inerte -- nó que parece clicável e
   não é custa mais que nó inerte.

   { icone, rotulo, nota, valor, tom, ir, filtro, onClick, filhos: [] } */
function arvoreDeIcones(raiz, opts) {
  opts = opts || {};
  function no(item, nivel) {
    const navega = !!(item.ir || item.onClick);
    const node = el(navega ? "button" : "div", {
      class: "arv-no" + (navega ? " clicavel" : "") + (item.classe ? " " + item.classe : ""),
      type: navega ? "button" : null,
      title: item.titulo || (item.ir ? "Abrir " + labelOf(item.ir) : null),
      onclick: navega ? function () {
        if (item.onClick) return item.onClick(item);
        if (item.filtro) { Object.assign(STATE, item.filtro); buildToolbar(); updateCount(); }
        go(item.ir);
      } : null,
    });
    node.appendChild(Icons.badge(item.icone || "linhas", item.tom || null,
      nivel === 0 ? 38 : 28));
    const texto = el("span", { class: "arv-texto" }, [
      el("b", { text: item.rotulo }),
      item.nota ? el("small", { text: item.nota }) : null,
    ].filter(Boolean));
    node.appendChild(texto);
    if (item.valor !== undefined && item.valor !== null) {
      node.appendChild(el("em", { class: "arv-valor", text: String(item.valor) }));
    }
    if (navega) node.appendChild(Icons.get("proximo", 13));

    const filhos = item.filhos || [];
    if (!filhos.length) return el("li", { class: "arv-item" }, node);
    return el("li", { class: "arv-item" }, [
      node,
      el("ul", { class: "arv-ramo" }, filhos.map(function (f) { return no(f, nivel + 1); })),
    ]);
  }
  return el("ul", { class: "arv" + (opts.compacta ? " compacta" : "") }, [no(raiz, 0)]);
}

/* O caminho de um evento até o n8n, desenhado.

   A aba de automação tinha tudo em tabela: os eventos numa lista, os
   destinos noutra, as entregas numa terceira. Nenhuma das três mostra o
   que alguém precisa saber antes de montar um fluxo -- QUE evento sai de
   onde, e QUEM está escutando. É uma hierarquia, e hierarquia se lê em
   árvore, não em três tabelas que o leitor cruza de cabeça.

   Os eventos vêm agrupados por família (o prefixo antes do ponto), porque
   treze eventos numa fila só é lista; em cinco famílias é mapa. */
const FAMILIA_DO_EVENTO = {
  artigo: { rotulo: "Artigos", icone: "producao" },
  submissao: { rotulo: "Submissões", icone: "submissao" },
  projeto: { rotulo: "Projetos", icone: "projeto" },
  integrante: { rotulo: "Pessoas", icone: "pessoas" },
  evento: { rotulo: "Agenda", icone: "calendario" },
  descoberta: { rotulo: "Achados", icone: "achado" },
  agente: { rotulo: "Agentes", icone: "automacao" },
  lake: { rotulo: "Camada analítica", icone: "dados" },
  dados: { rotulo: "Painel", icone: "atualizar" },
};
/* Para onde cada família leva quem clicar: o ícone é botão de navegação,
   e não enfeite — é o que transforma o mapa em atalho. */
const ABA_DA_FAMILIA = {
  artigo: "publicacoes", submissao: "submissoes", projeto: "projetos",
  integrante: "pesquisadores", evento: "calendario", descoberta: "descobertas",
  agente: "automacao", lake: "qualidade", dados: "visao",
};

function arvoreDaAutomacao(a) {
  const porEvento = counter(a.recent || [], "event");
  const quantos = new Map(porEvento.map(function (x) { return [x.label, x.value]; }));
  const familias = new Map();
  (a.events || []).forEach(function (ev) {
    const chave = String(ev.id).split(".")[0];
    if (!familias.has(chave)) familias.set(chave, []);
    familias.get(chave).push(ev);
  });

  const ramos = Array.from(familias.entries()).map(function (par) {
    const chave = par[0], eventos = par[1];
    const meta = FAMILIA_DO_EVENTO[chave] || { rotulo: chave, icone: "raio" };
    const somaDaFamilia = eventos.reduce(function (t, ev) {
      return t + (quantos.get(ev.id) || 0); }, 0);
    return {
      icone: meta.icone, rotulo: meta.rotulo,
      nota: eventos.length + " evento(s) no catálogo",
      valor: somaDaFamilia || null,
      ir: ABA_DA_FAMILIA[chave] || null,
      filhos: eventos.map(function (ev) {
        /* Quem escuta este evento: o destino assinado nele, mais os que
           assinaram "*" — sem isso, um fluxo que escuta tudo aparecia
           como se não escutasse nada. */
        const ouvintes = (a.webhooks || []).filter(function (w) {
          return w.active && (w.event === ev.id || w.event === "*"); });
        return {
          icone: "raio", rotulo: ev.id, nota: ev.label,
          valor: quantos.get(ev.id) || null,
          classe: ouvintes.length ? null : "mudo",
          titulo: ouvintes.length
            ? "Escutado por: " + ouvintes.map(function (w) { return w.name; }).join(", ")
            : "Nenhum destino escuta este evento",
          filhos: ouvintes.map(function (w) {
            return { icone: "conectar", rotulo: w.name, tom: "verde",
              nota: cut(w.url, 52) + (w.event === "*" ? " · assina tudo" : ""),
              valor: w.deliveries || null };
          }),
        };
      }),
    };
  });

  return arvoreDeIcones({
    icone: "painel", rotulo: "LAPE", tom: "acento",
    nota: "o banco emite; o n8n escuta",
    filhos: ramos,
  });
}

view("automacao", "Automação", "Governança",
  "Os eventos que o LAPE emite, para onde eles vão e o que voltou de cada entrega.",
  function (host) {
    if (!LIVE) {
      host.appendChild(el("div", { class: "note",
        text: "Esta aba lê o servidor em tempo real. No arquivo exportado ela fica vazia — "
          + "abra o painel publicado para cadastrar e conferir os webhooks." }));
      return;
    }
    const box = el("div");
    host.appendChild(box);
    box.appendChild(el("div", { class: "empty", text: "Consultando a automação…" }));

    function post(url, body) {
      return fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
          return data;
        });
      });
    }
    function load() {
      fetch("/api/automation?limite=60", { headers: { Accept: "application/json" } })
        .then(function (r) {
          if (r.status === 401 || r.status === 403) throw new Error("permissao");
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(draw)
        .catch(function (err) {
          box.innerHTML = "";
          box.appendChild(el("div", { class: "note", text: err.message === "permissao"
            ? "Só a coordenação vê a automação. Entre com um login de coordenação para cadastrar webhooks."
            : "Não foi possível ler a automação agora: " + err.message }));
        });
    }

    function draw(a) {
      box.innerHTML = "";
      const falhas = a.deliveries.filter(function (d) { return d.status !== "ok"; }).length;
      const ativos = a.webhooks.filter(function (w) { return w.active; }).length;
      box.appendChild(el("div", { class: "grid g4" }, [
        kpi({ label: "Destinos ativos", value: C.fmt(ativos), icon: "conectar",
          foot: a.webhooks.length + " cadastrado(s)" }),
        kpi({ label: "Eventos no catálogo", value: C.fmt(a.events.length), icon: "raio",
          foot: "assine '*' para receber todos" }),
        kpi({ label: "Entregas com erro", value: C.fmt(falhas), icon: "aviso",
          foot: "nas últimas " + a.deliveries.length + " tentativas",
          tone: falhas ? "bad" : "good" }),
        kpi({ label: "Painéis ao vivo", value: C.fmt(a.subscribers), icon: "atualizar",
          foot: a.signing ? "mensagens assinadas" : "sem segredo configurado" }),
      ]));

      /* O mapa antes das tabelas: quem chega aqui precisa ver QUE evento
         sai de onde e QUEM escuta, antes de cadastrar mais um destino. */
      box.appendChild(el("div", { style: "margin-top:16px" }, card(
        "O caminho de um evento até o n8n",
        "Família do evento, evento e quem o escuta. O evento apagado é o que "

/* abas internas de um cartão */
function tabbed(items) {
  const nav = el("div", { class: "tabs" });
  const panes = el("div");
  items.forEach(function (item, i) {
    const pane = el("div", { class: "tabpane" + (i === 0 ? " on" : "") },
      Array.isArray(item.content) ? item.content : [item.content]);
    const btn = el("button", { type: "button", text: item.label, class: i === 0 ? "on" : null,
      onclick: function () {
        nav.querySelectorAll("button").forEach(function (b) { b.classList.remove("on"); });
        panes.querySelectorAll(".tabpane").forEach(function (p) { p.classList.remove("on"); });
        btn.classList.add("on");
        pane.classList.add("on");
      } });
    nav.appendChild(btn);
    panes.appendChild(pane);
  });
  return el("div", {}, [nav, panes]);
}

function aplicarSegmento(label) {
  if (STATE.segmento === "linha") STATE.linha = label;
  else if (STATE.segmento === "ano" || STATE.segmento === "ano_publicacao") STATE.ano = label;
  else if (STATE.segmento === "status") {
    const found = Object.keys(STATUS_LABEL).find(function (k) { return STATUS_LABEL[k] === label; });
    if (found) STATE.status = found;
  } else return;
  buildToolbar();
  render();
}

/* A BANCADA — coleta de dados com participantes                          */
/* ====================================================================== */
/* O painel inteiro até aqui é sobre o artigo pronto. Esta seção é sobre o
   que foi medido para escrevê-lo: a escala de dor de quarenta mulheres com
   fibromialgia, na linha de base e depois de dezesseis semanas.

   Duas decisões atravessam as sete telas:

   1. ELAS LEEM DO SERVIDOR, SEMPRE. Nada daqui entra no payload do painel
      — e é por isso que participante nenhum viaja no arquivo exportado que
      vai para docs/, nem no mural que fica numa TV. No arquivo exportado
      estas telas aparecem vazias, dizendo por quê.
   2. NINGUÉM É NOMEADO. O participante é um código. Não há nome no banco,
      não há nome na API e não há nome aqui. */

const BANCADA = { dados: null, protocolo: null, instrumento: null,
  pareado: false, erro: null };

function bancadaBuscar(caminho) {
  return fetch(caminho, { headers: { Accept: "application/json" } })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("permissao");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
}

/* Todas as sete telas começam igual: exigem servidor ao vivo, exigem
   coordenação e precisam do catálogo. Em vez de repetir isso sete vezes,
   `bancadaTela` cuida da moldura e chama `desenhar(dados, host)` quando
   há o que desenhar. */
function bancadaTela(host, desenhar, opts) {
  opts = opts || {};
  if (!LIVE) {
    host.appendChild(el("div", { class: "note", text:
      "Esta tela lê o servidor ao vivo. No arquivo exportado ela fica vazia — "
      + "e isso é de propósito: dado de participante não viaja em arquivo que "
      + "se manda por e-mail ou se publica." }));
    return;
  }
  const caixa = el("div");
  host.appendChild(caixa);
  caixa.appendChild(el("div", { class: "empty", text: "Consultando a bancada…" }));

  /* O protocolo escolhido precisa estar decidido ANTES da busca: é ele que
     traz a matriz e a aderência. Quando ninguém escolheu ainda -- e ninguém
     escolheu na primeira tela que se abre --, a primeira ida ao servidor
     traz só o catálogo, o primeiro protocolo vira o escolhido, e a segunda
     traz o que a tela desenha. Custa um pedido a mais uma vez por sessão;
     desenhar sem a matriz custava a tela inteira dizendo "sem momentos
     declarados" num protocolo que tem três. */
  function buscar(segundaTentativa) {
    const alvo = "/api/bancada"
      + (BANCADA.protocolo ? "?protocolo=" + BANCADA.protocolo : "");
    return bancadaBuscar(alvo).then(function (dados) {
      BANCADA.dados = dados;
      if (!BANCADA.protocolo && (dados.protocolos || []).length && !segundaTentativa) {
        BANCADA.protocolo = dados.protocolos[0].id;
        return buscar(true);
      }
      return dados;
    });
  }

  buscar(false).then(function (dados) {
    caixa.innerHTML = "";
    if (!opts.semSeletor) caixa.appendChild(seletorDeProtocolo());
    if (!(dados.protocolos || []).length) {
      caixa.appendChild(el("div", { class: "note", html:
        "<b>Nenhum protocolo declarado ainda.</b> Um protocolo é o estudo e os "
        + "momentos em que ele mede — linha de base, 16 semanas, seguimento. "
        + "Sem momentos declarados não existe “falta medir”: existe só o que "
        + "já foi coletado. Comece em <b>Gerenciamento avançado</b>." }));
      if (!opts.sempre) return;
    }
    desenhar(dados, caixa);
  }).catch(function (err) {
    caixa.innerHTML = "";
    caixa.appendChild(el("div", { class: "note", text: err.message === "permissao"
      ? "A bancada é só da coordenação. Dado de participante não é produção "
        + "científica: é escala de dor e sintoma depressivo de gente."
      : "Não foi possível ler a bancada agora: " + err.message }));
  });
}

function seletorDeProtocolo() {
  const dados = BANCADA.dados || {};
  const lista = dados.protocolos || [];
  if (!lista.length) return el("span");
  if (!BANCADA.protocolo && lista.length) BANCADA.protocolo = lista[0].id;
  const escolha = el("select", {}, lista.map(function (p) {
    return el("option", { value: String(p.id),
      text: p.nome + " · " + p.n_participantes + " participante(s)" });
  }));
  escolha.value = String(BANCADA.protocolo);
  escolha.addEventListener("change", function () {
    BANCADA.protocolo = Number(escolha.value);
    BANCADA.instrumento = null;
    render();
  });
  return el("div", { class: "bancbarra" }, [
    el("span", { class: "flabel", text: "Protocolo" }), escolha,
  ]);
}

function protocoloAtual() {
  const dados = BANCADA.dados || {};
  return (dados.protocolos || []).find(function (p) {
    return p.id === BANCADA.protocolo; }) || null;
}

/* Registrar uma medida sem sair da tela. O formulário é curto de propósito:
   quem está com a prancheta na mão não preenche doze campos. */
function formularioDeMedida(dados) {
  const gente = dados.participantes || [];
  const instrumentos = (dados.instrumentos || []).filter(function (i) { return i.ativo; });
  const momentos = (dados.matriz || {}).momentos || [];
  if (!gente.length || !instrumentos.length) {
    return card("Registrar uma medida", null, el("div", { class: "empty", text:
      !gente.length ? "Nenhum participante inscrito neste protocolo."
        : "Nenhum instrumento declarado." }));
  }
  const quem = el("select", {}, gente.map(function (p) {
    return el("option", { value: String(p.id),
      text: p.codigo + (p.grupo ? " · " + p.grupo : "") }); }));
  const oque = el("select", {}, instrumentos.map(function (i) {
    return el("option", { value: String(i.id),
      text: i.nome + (i.unidade ? " (" + i.unidade + ")" : "") }); }));
  const quando = el("select", {}, momentos.map(function (mo) {
    return el("option", { value: String(mo.id), text: mo.nome }); }));
  const valor = el("input", { type: "number", step: "any", class: "search",
    placeholder: "valor" });
  const aviso = el("div", { class: "hint", style: "margin-top:8px" });
  const gravar = el("button", { class: "primary", type: "button", text: "Gravar medida",
    onclick: function () {
      if (valor.value === "") { valor.focus(); return; }
      gravar.disabled = true;
      aviso.textContent = "Gravando…";
      fetch("/api/bancada", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ o_que: "medida",
          participante_id: Number(quem.value), instrumento_id: Number(oque.value),
          momento_id: Number(quando.value), valor: Number(valor.value) }) })
        .then(function (r) { return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; }); })
        .then(function () { valor.value = ""; render(); })
        .catch(function (err) { aviso.textContent = "Não deu para gravar: " + err.message; })
        .finally(function () { gravar.disabled = false; });
    } });
  return card("Registrar uma medida",
    "O valor é conferido contra a faixa declarada do instrumento — 77 numa "
    + "escala de 0 a 10 é recusado aqui, e não descoberto na análise.", [
      el("div", { class: "explorer-controls" }, [
        el("div", { class: "field" }, [el("label", { text: "Participante" }), quem]),
        el("div", { class: "field" }, [el("label", { text: "Instrumento" }), oque]),
        el("div", { class: "field" }, [el("label", { text: "Momento" }), quando]),
        el("div", { class: "field" }, [el("label", { text: "Valor" }), valor]),
        gravar,
      ]),
      aviso,
    ]);
}

              render: function (r) { return r.motivo_saida || "—"; } },
          ],
          rows: gente,
        }))));
    });
  });

view("medidas", "Visualização do painel", "Bancada",

function desenharAnalise(a, host) {
  if (a.aviso) {
    host.appendChild(el("div", { class: "note", text: a.aviso }));
    return;
  }
  if (!a.series.length) {
    host.appendChild(el("div", { class: "empty", text: "Sem medidas neste recorte." }));
    return;
  }
  /* A curva por grupo, com a FAIXA do intervalo de confiança em volta.
     Uma linha de médias desenhada sozinha afirma que a média é o valor;
     ela é uma estimativa, e a largura da faixa é o quanto ela pode estar
     errada. Duas curvas cujas faixas se sobrepõem inteiras não estão
     separadas, por mais que as linhas pareçam distantes — e é isso que o
     gráfico sem faixa escondia. */
  const series = a.series.map(function (s, i) {
    const medias = s.pontos.map(function (p) { return p.media; });
    const alto = s.pontos.map(function (p) {
      return p.ic ? p.ic.ate : p.media; });
    const baixo = s.pontos.map(function (p) {
      return p.ic ? p.ic.de : p.media; });
    return { label: s.grupo, color: C.serie(i), values: medias,
      band: { alto: alto, baixo: baixo } };
  });
  host.appendChild(card(a.instrumento.nome,
    (a.direcao ? a.direcao.charAt(0).toUpperCase() + a.direcao.slice(1) + ". " : "")
    + "A linha é a média; a faixa, o intervalo de confiança de 95% dela.",
    linhaAnalitica({
      labels: a.momentos.map(function (m) { return m.nome; }),
      series: series, height: 280, file: "analise-" + a.instrumento.code,
      caption: a.instrumento.nome + " por momento e grupo, com IC95%",
    }, { maximo: 4 })));

  /* A tabela é obrigatória aqui, e não um extra: média sem n e sem desvio
     não se publica, não se confere e não entra em meta-análise. */
  const linhas = [];
  a.series.forEach(function (s) {
    s.pontos.forEach(function (p) {
      linhas.push({ grupo: s.grupo, momento: p.momento, n: p.n,
        media: p.media, dp: p.dp, ep: p.erro_padrao, ic: p.ic,
        mediana: p.mediana, minimo: p.minimo, maximo: p.maximo });
    });
  });
  host.appendChild(el("div", { style: "margin-top:16px" }, card(
    "Os números",
    "DP descreve as participantes; EP e IC descrevem a média. Confundir os "
    + "dois é o erro mais comum destas tabelas.",
    [
      dataTable({
        file: "medidas-" + a.instrumento.code, search: false, pageSize: 20,
        cols: [
          { k: "grupo", label: "Grupo" }, { k: "momento", label: "Momento" },
          { k: "n", label: "n", num: true },
          { k: "media", label: "Média", num: true, render: function (r) {
            return r.media === null ? "—" : dec(r.media, 2); } },
          { k: "dp", label: "DP", num: true, render: function (r) {
            return r.dp === null ? "—" : dec(r.dp, 2); } },
          { k: "ep", label: "EP", num: true, render: function (r) {
            return r.ep === null || r.ep === undefined ? "—" : dec(r.ep, 2); } },
          { k: "ic", label: "IC 95% da média", sortValue: function (r) {
            return r.ic ? r.ic.de : null; },
            render: function (r) {
              return r.ic ? dec(r.ic.de, 2) + " a " + dec(r.ic.ate, 2) : "—"; } },
          { k: "mediana", label: "Mediana", num: true, render: function (r) {
            return r.mediana === null ? "—" : dec(r.mediana, 2); } },
          { k: "minimo", label: "Mín.", num: true },
          { k: "maximo", label: "Máx.", num: true },
        ],
        rows: linhas,
      }),
      /* O mal-entendido que esta nota existe para evitar é o mais comum da
         área: ler "IC95% de 6,1 a 9,0" como "95% das participantes estão
         entre 6,1 e 9,0". Isso é o DP que descreve; o IC é sobre a média. */
      el("div", { class: "note", style: "margin-top:14px" }, [
        el("b", { text: "DP, EP e IC não são a mesma coisa. " }),
        el("span", { text: "O DP diz o quanto as participantes se espalham, "
          + "e não encolhe com mais gente. O EP (DP dividido pela raiz de n) "
          + "diz o quanto esta média tende a errar a média da população, e "
          + "esse encolhe. O IC é a faixa construída a partir do EP — e "
          + "“IC de 6,1 a 9,0” nunca quer dizer que 95% das participantes "
          + "estão entre 6,1 e 9,0." }),
      ]),
    ])));

  /* ---- o teorema do limite central, com os dados desta coleta ---- */
  a.series.forEach(function (s) {
    const r = s.reamostragem;
    if (!r || !r.ic || !(r.histograma || []).length) return;
    const ponto = s.pontos.slice().reverse().find(function (p) { return p.ic; });
    if (!ponto) return;
    /* O veredito vem do servidor, e não de uma comparação feita aqui: ele
       compara LARGURAS e não só as pontas -- a primeira versão desta tela
       dizia "concordam" para um par em que um intervalo tinha o dobro da
       largura do outro -- e conhece o caso em que nenhum dos dois vale. */
    const v = s.veredito_do_tlc || { veredito: "poucos", texto: "" };
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "O teorema do limite central em " + s.grupo,
      "Reamostrando " + C.fmt(r.reamostras) + " vezes as " + r.n
      + " medidas do último momento: cada sorteio dá uma média, e é a "
      + "distribuição dessas médias que o teorema descreve. Aqui ela é "
      + "mostrada, e não suposta.",
      [
        C.columns({
          labels: r.histograma.map(function (h) { return dec(h.de, 1); }),
          series: [{ label: "Reamostragens", values: r.histograma.map(function (h) {
            return h.n; }) }],
          mono: true, height: 200, file: "tlc-" + s.grupo,
          caption: "médias de " + C.fmt(r.reamostras) + " amostras sorteadas com reposição",
        }),
        el("div", { class: "resumo-nums", style: "margin-top:14px" }, [
          el("div", { class: "resumo-num" }, [
            el("b", { text: dec(ponto.ic.de, 2) + " a " + dec(ponto.ic.ate, 2) }),
            el("span", { text: "IC 95% por t de Student" }),
            el("i", { text: "supõe a média aproximadamente normal" })]),
          el("div", { class: "resumo-num" }, [
            el("b", { text: dec(r.ic.de, 2) + " a " + dec(r.ic.ate, 2) }),
            el("span", { text: "IC 95% por reamostragem" }),
            el("i", { text: "não supõe distribuição nenhuma" })]),
          el("div", { class: "resumo-num" }, [
            el("b", { text: dec(r.dp_das_medias, 3) }),
            el("span", { text: "DP das médias sorteadas" }),
            el("i", { text: "é o erro padrão, medido" })]),
        ]),
        leituraDe({
          sinal: v.veredito === "concordam" ? "sobe"
            : (v.veredito === "discordam" ? "desce" : "parado"),
          forte: v.veredito === "concordam" ? "Os dois intervalos concordam."
            : (v.veredito === "discordam" ? "Os dois intervalos discordam."
              : "Não há n para comparar."),
          texto: v.texto,
        }),
      ])));
  });

  /* O teste fica ENTRE as médias e o efeito, que é a ordem em que se lê:
     o que mudou, se a mudança se sustenta, e de que tamanho ela foi. */
  if (a.teste) {
    const palco = el("div", { style: "margin-top:16px" });
    host.appendChild(palco);
    desenharTestes(a.teste, palco);
  }

  host.appendChild(el("div", { class: "grid g2", style: "margin-top:16px" },
    a.series.map(function (s) {
      const e = s.efeito || {};
      return card("Efeito em " + s.grupo,
        "Do primeiro ao último momento declarado.", [
          el("div", { class: "resumo-nums" }, [
            el("div", { class: "resumo-num" }, [
              el("b", { text: e.g === null || e.g === undefined
                ? (e.d === null || e.d === undefined ? "—" : dec(e.d, 2))
                : dec(e.g, 2) }),
              el("span", { text: e.g === null || e.g === undefined
                ? "d de Cohen" : "g de Hedges" }),
              /* Cohen exagera o efeito em amostra pequena — cerca de 4%
                 com dez por grupo, e mais conforme encolhe. A correção é
                 conhecida desde 1981; não aplicá-la é publicar um efeito
                 maior do que o medido. O d fica ao lado para conferência. */
              el("i", { text: e.d === null || e.d === undefined ? ""
                : "corrigido do viés · d = " + dec(e.d, 2) })]),
            el("div", { class: "resumo-num" }, [
              el("b", { text: e.ic_d ? dec(e.ic_d.de, 2) + " a " + dec(e.ic_d.ate, 2)
                : "—" }),
              el("span", { text: "IC 95% do efeito" }),
              el("i", { text: e.cruza_zero ? "atravessa o zero" : "não atravessa o zero" })]),
            el("div", { class: "resumo-num" }, [
              el("b", { text: e.delta === undefined || e.delta === null
                ? "—" : dec(e.delta, 2) }),
              el("span", { text: "diferença das médias" })]),
            el("div", { class: "resumo-num" }, [
              el("b", { text: C.fmt(Math.min((e.antes || {}).n || 0,
                (e.depois || {}).n || 0)) }),
              el("span", { text: "menor n" })]),
          ]),
          /* Intervalo que abrange o zero é o mesmo que dizer "pode não ter
             havido efeito nenhum" -- e é exatamente a frase que o d
             sozinho, exibido com duas casas, não deixa ninguém ler. */
          e.cruza_zero ? el("div", { class: "note", style: "margin-top:12px" }, [
            el("b", { text: "O intervalo atravessa o zero. " }),
            el("span", { text: "Com estes dados, “não houve efeito” continua "
              + "sendo uma explicação compatível com o que foi medido." }),
          ]) : null,
          /* O aviso não é rodapé: um d de 0,82 calculado com seis pessoas
             se parece exatamente com um calculado com sessenta, e vai para
             a dissertação do mesmo jeito. */
          e.instavel ? el("div", { class: "note", style: "margin-top:12px" }, [
            el("b", { text: "Número instável. " }),
            el("span", { text: e.motivo || "gente de menos para esta conta." }),
          ]) : null,
        ].filter(Boolean));
    })));
}

/* O resultado do teste, e por que foi ESTE teste.

   O valor-p sozinho é a metade que engana: um p de 0,03 obtido com teste
   t sobre dado torto não vale mais do que nenhum. Por isso cada bloco
   traz, na mesma altura, o que foi conferido e o caminho que isso abriu.

   E o p vem SEM estrela, sem negrito e sem "significativo". A palavra faz
   o trabalho todo de interpretação sozinha, e quase sempre faz errado:
   0,049 e 0,051 são o mesmo estudo. O que decide é o intervalo do efeito,
   que está no cartão ao lado. */
function pValor(p) {
  if (p === null || p === undefined) return "—";
  return p < 0.001 ? "< 0,001" : dec(p, 3);
}

function blocoDeTeste(t, porque, extra) {
  if (!t) return null;
  if (t.p === null || t.p === undefined) {
    return el("div", { class: "hint", text: t.aviso || "sem dados para o teste" });
  }
  const partes = [];
  if (t.t !== undefined) partes.push("t = " + dec(t.t, 3) + " · gl = " + t.gl);
  if (t.z !== undefined) partes.push("z = " + dec(t.z, 3));
  if (t.u !== undefined) partes.push("U = " + t.u);
  if (t.w !== undefined && t.z !== undefined) partes.push("W = " + t.w);
  if (t.f !== undefined) partes.push("F = " + dec(t.f, 3)
    + " · gl = " + t.gl1 + ", " + t.gl2);
  if (t.qui2 !== undefined) partes.push("χ² = " + dec(t.qui2, 3) + " · gl = " + t.gl);
  if (t.eta2_parcial !== undefined) partes.push("η² parcial = " + dec(t.eta2_parcial, 3));
  return el("div", { class: "teste" }, [
    el("div", { class: "teste-topo" }, [
      el("b", { text: t.teste }),
      /* "p = < 0,001" é um sinal a mais do que cabe: quando o valor é um
         limite, o próprio "<" é o operador. */
      el("span", { class: "teste-p" }, [
        el("i", { text: "p" }),
        el("span", { text: (t.p < 0.001 ? " " : " = ") + pValor(t.p) })]),
    ]),
    partes.length ? el("div", { class: "hint", text: partes.join("  ·  ") }) : null,
    porque ? el("div", { class: "hint", text: "Por que este teste: " + porque })
      : null,
    t.aviso ? el("div", { class: "hint", text: "⚠ " + t.aviso }) : null,
    extra || null,
  ].filter(Boolean));
}

/* O Q-Q: cada ponto é um valor; a linha é onde ele cairia se a
   distribuição fosse normal. Quanto mais os pontos se afastam dela, menos
   o teste paramétrico se sustenta — e isso se vê num relance, enquanto o
   valor-p do teste de normalidade não diz nada com n pequeno e reprova
   tudo com n grande. */
function desenharQQ(checagem) {
  const pontos = (checagem || {}).qq || [];
  if (pontos.length < 3) return null;
  return C.scatter({
    points: pontos.map(function (p) {
      return { x: p.esperado, y: p.observado }; }),
    xLabel: "esperado sob normalidade", yLabel: "observado",
    height: 200, diagonal: true, mono: true, deZero: false,
    file: "qq", caption: "cada ponto é uma medida; a diagonal é a normal perfeita",
  });
}

function desenharTestes(teste, host) {
  if (!teste || teste.aviso) {
    host.appendChild(el("div", { class: "note",
      text: (teste && teste.aviso) || "sem teste para este recorte" }));
    return;
  }
  /* ---- dentro de cada grupo: mudou do começo ao fim? ---- */
  host.appendChild(el("div", { class: "grid g2" }, (teste.dentro || [])
    .map(function (b) {
      return card("Mudança dentro de " + b.grupo,
        b.pares + " pessoa(s) medidas nos dois momentos"
        + (b.medidos_no_inicio !== b.pares || b.medidos_no_fim !== b.pares
          ? " · " + b.medidos_no_inicio + " no início e " + b.medidos_no_fim
            + " no fim" : ""),
        [
          /* Perder gente entre os momentos não é detalhe: quem desistiu
             costuma ser justamente quem piorou, e a média do fim fica
             melhor do que o tratamento foi. */
          (b.medidos_no_inicio > b.pares) ? el("div", { class: "note" }, [
            el("b", { text: (b.medidos_no_inicio - b.pares) + " pessoa(s) saíram "
              + "entre os dois momentos. " }),
            el("span", { text: "Elas ficam de fora do teste pareado, que compara "
              + "cada pessoa com ela mesma. Se quem saiu foi quem piorou, o que "
              + "sobra parece melhor do que o tratamento foi." }),
          ]) : null,
          b.teste ? blocoDeTeste(b.teste, b.porque) : el("div", { class: "hint",
            text: b.aviso || "sem pares suficientes" }),
          b.ao_longo ? el("div", { style: "margin-top:14px" }, [
            el("div", { class: "hint", text: "Ao longo dos " + teste.momentos.length
              + " momentos:" }),
            blocoDeTeste(b.ao_longo, null),
            b.ao_longo_sem_suposicao ? blocoDeTeste(b.ao_longo_sem_suposicao,
              "o mesmo sem supor normalidade nem esfericidade — se os dois "
              + "discordam, vale este") : null,
          ]) : null,
          b.normalidade && b.normalidade.qq ? el("details", { style: "margin-top:12px" }, [
            el("summary", { text: "conferir a normalidade das diferenças" }),
            el("div", { class: "hint", style: "margin:8px 0",
              text: b.normalidade.p === null
                ? (b.normalidade.aviso || "")
                : "D'Agostino-Pearson: p = " + pValor(b.normalidade.p)
                  + " · assimetria " + dec(b.normalidade.assimetria, 2)
                  + " · curtose " + dec(b.normalidade.curtose, 2)
                  + (b.normalidade.aviso ? " — " + b.normalidade.aviso : "") }),
            desenharQQ(b.normalidade),
          ]) : null,
        ].filter(Boolean));
    })));

  /* ---- entre os grupos, no fim ---- */
  const e = teste.entre;
  if (e) {
    host.appendChild(el("div", { style: "margin-top:16px" }, card(
      "Diferença entre os grupos em " + e.momento,
      e.grupos.join(" × "),
      [
        blocoDeTeste(e.teste, e.porque),
        el("details", { style: "margin-top:12px" }, [
          el("summary", { text: "conferir as suposições" }),
          el("div", { class: "hint", style: "margin-top:8px",
            text: "Levene (variâncias): p = " + pValor((e.variancias || {}).p)
              + ((e.variancias || {}).iguais === false
                ? " — diferentes, então o teste usou Welch"
                : " — compatíveis com variâncias iguais") }),
          el("div", { class: "grid g2", style: "margin-top:10px" },
            e.grupos.map(function (g) {
              const chk = (e.normalidade || {})[g] || {};
              return el("div", {}, [
                el("div", { class: "hint", text: g + ": "
                  + (chk.p === null || chk.p === undefined
                    ? (chk.aviso || "sem n para testar")
                    : "p = " + pValor(chk.p)) }),
                desenharQQ(chk),
              ].filter(Boolean));
            })),
        ]),
      ].filter(Boolean))));
  }

  /* A nota que evita o uso errado do que está acima. */
  host.appendChild(el("div", { class: "note", style: "margin-top:16px" }, [
    el("b", { text: "O valor-p não mede o tamanho do efeito. " }),
    el("span", { text: "Ele responde “com que frequência eu veria uma diferença "
      + "destas se não houvesse diferença nenhuma” — e com muita gente até uma "
      + "diferença irrelevante sai com p pequeno. Quanto o exercício mudou está "
      + "no cartão de efeito, com o intervalo ao lado. Os dois juntos é que se "
      + "leem; 0,049 e 0,051 são o mesmo estudo." }),
  ]));
}

/* ---------------------------------------------------------------- 4/7 */
view("ano_bancada", "Resumo anual da análise", "Bancada",

/* A conta que deveria vir ANTES da coleta, e que quase sempre é feita
   depois — quando já não muda nada.

   Um estudo com seis por grupo só detecta efeito gigante. Se o efeito
   real for médio, ele vai dar "sem diferença significativa" com altíssima
   probabilidade, e essa frase será lida como "o exercício não funcionou".
   Não foi: o estudo nunca teve como saber.

   Esta tela não mostra "poder observado" — o poder calculado a partir do
   efeito que se mediu. Ele é função monótona do próprio valor-p: não
   acrescenta informação nenhuma e dá a impressão de acrescentar. A
   pergunta que vale é a outra, e é a que está aqui: qual é o MENOR efeito
   que este n consegue detectar. */

/* ======================================================================
   FOMENTO — editais, prazos e vigencia
   ----------------------------------------------------------------------
   A aba existe por causa de UMA coisa: prazo. Dinheiro de pesquisa se
   perde de duas maneiras, e nenhuma delas e "o projeto era ruim" --
   e o edital que fechou sem ninguem ver, e a vigencia que terminou com
   a prestacao de contas por fazer.

   Por isso o alto da tela nao e o total captado (que e passado e nao se
   pode mudar): sao os dois relogios.

   Aqui as cores de estado SAO legitimas, ao contrario da matriz de
   correlacao: "fecha em cinco dias" e um ESTADO, e nao a identidade de
   uma serie. E o caso para que --warning e --critical existem.
   ====================================================================== */
var FOMENTO = { dados: null, carregando: false, erro: null, aba: "prazos" };

function dinheiro(v) {
  if (v === null || v === undefined) return "—";
  return "R$ " + Number(v).toLocaleString("pt-BR",
    { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* O chip de prazo é o mesmo da aba de Formação, e de propósito: bolsa
   que vence, defesa que chega e edital que fecha são a mesma pergunta
   ("quanto falta?") e devem ter a mesma aparência. Reescrever um
   segundo chip aqui criaria dois jeitos de mostrar urgência no mesmo
   painel -- e um deles ia divergir do outro na primeira mudança. */
function chipDePrazo(dias) {
  const f = faixaDe(dias);
  const chip = el("span", { class: "prazo-chip" });
  chip.style.setProperty("--faixa", "var(" + f.cor + ")");
  chip.appendChild(Icons.get(f.icone, 13));
  chip.appendChild(el("span", { text: quantoFalta(dias) }));
  return chip;
}

function linhaDeEdital(e) {
  const corpo = el("div", { class: "fom-corpo" }, [
    el("b", { text: e.nome }),
    el("small", { text: [e.agencia, e.modalidade,
      e.valor_teto ? "até " + dinheiro(e.valor_teto) : null]
      .filter(Boolean).join(" · ") || "sem detalhes declarados" }),
  ]);
  const item = el("div", { class: "fom-item" }, [
    corpo, chipDePrazo(e.dias),
  ]);
  if (e.url) {
    const link = el("a", { href: e.url, target: "_blank",
      rel: "noopener noreferrer", text: "abrir edital" });
    corpo.appendChild(link);
  }
  return item;
}

function linhaDeVigencia(v) {
  return el("div", { class: "fom-item" }, [

function blocoDeAprovacao(a) {
  /* Uma taxa de aprovacao com poucas submissoes julgadas nao e taxa: e
     acaso com sinal de porcentagem. O servidor recusa o numero e manda o
     porque; a tela mostra o porque, e nao um traco mudo. */
  if (!a.decididas && !a.pendentes) {
    /* "seriam 0% ou 100% conforme a próxima" não faz sentido quando não
       há nenhuma: a frase do mínimo é para quem já começou. */
    return el("div", { class: "empty", text:
      "Nenhuma submissão registrada ainda. Registre também as recusadas: "
      + "sem elas não existe taxa de aprovação, só a lembrança de quem "
      + "aprovou." });
  }
  if (a.taxa === null) {
    return el("div", { class: "note" }, [
      el("b", { text: "Ainda não há taxa de aprovação. " }),
      el("span", { text: a.aviso }),
    ]);
  }
  /* Sem seta: não há valor de referência para taxa de aprovação em
     edital -- ela varia com a agência, a modalidade e o ano, e 50% pode
     ser excelente num Universal e ruim num interno. Apontar para cima ou
     para baixo seria inventar um padrão que o sistema não tem. */
  return leituraDe({
    sinal: "neutro",
    forte: "Taxa de aprovação de " + dec(a.taxa, 1) + "%.",
    texto: a.aprovadas + " aprovada(s) em " + a.decididas + " julgada(s)"
      + (a.pendentes ? ", com " + a.pendentes + " ainda sem resposta "
         + "(pendente não é recusa, e por isso não entra na conta)." : "."),
  });
}

/* ======================================================================
   IMPORTAR A PLANILHA DA BANCADA
   ----------------------------------------------------------------------
   Onze telas na Bancada e nenhum jeito de encher: 40 participantes x 10
   itens x 3 momentos são 1.200 digitações. Ninguém faz, e o laboratório
   já tem tudo em Excel.

   Copiar e colar, e não subir arquivo: funciona de qualquer máquina, não
   depende de o arquivo estar no servidor, e o pesquisador já sabe fazer.

   E dois passos, sempre. O primeiro CONFERE e mostra o que entendeu de
   cada coluna, o que vai criar e o que vai SOBRESCREVER. Só o segundo
   grava. Dado de participante não se desfaz com Ctrl+Z.
   ====================================================================== */
var IMPORTE = { plano: null, texto: "", erro: null, feito: null };

function blocoDaConferencia(p) {
  const caixa = el("div");

  caixa.appendChild(leituraDe({
    sinal: "neutro",
    forte: "Formato " + p.formato + ", " + p.participantes.length
      + " participante(s) e " + p.n_medidas + " medida(s).",
    texto: "Nada foi gravado ainda. Confira o que o sistema entendeu de cada "
      + "coluna antes de aplicar.",
  }));

  caixa.appendChild(el("div", { class: "grid g4", style: "margin:14px 0" }, [
    kpi({ label: "Participantes novos", value: C.fmt(p.participantes_novos) }),
    kpi({ label: "Já inscritos", value: C.fmt(p.participantes_existentes) }),
    kpi({ label: "Medidas a criar", value: C.fmt(p.medidas_a_criar) }),
    kpi({ label: "Medidas a sobrescrever", value: C.fmt(p.medidas_a_sobrescrever),
          tone: p.medidas_a_sobrescrever ? "bad" : null }),
  ]));

  if (p.medidas_a_sobrescrever) {
    caixa.appendChild(el("div", { class: "note" }, [
      el("b", { text: "Isto vai por cima de medida que já existe. " }),
      el("span", { text: p.medidas_a_sobrescrever + " valor(es) já estão no banco "
        + "para as mesmas pessoas, instrumentos e momentos, e serão substituídos "
        + "pelos da planilha. Se a intenção era acrescentar, e não corrigir, "
        + "confira antes de aplicar." }),
    ]));
  }

  if ((p.instrumentos_novos || []).length || (p.momentos_novos || []).length) {
    caixa.appendChild(el("div", { class: "note" }, [
      el("b", { text: "Vai declarar o que ainda não existe. " }),
      el("span", { text: [
        p.instrumentos_novos.length ? "Instrumentos: " + p.instrumentos_novos.join(", ") : null,
        p.momentos_novos.length ? "Momentos: " + p.momentos_novos.join(", ") : null,
      ].filter(Boolean).join(" · ") + ". Um erro de digitação no cabeçalho vira "
        + "um instrumento novo — vale conferir os nomes." }),
    ]));
  }

  /* A ordem dos momentos decide o que é "antes" e o que é "depois" no
     gráfico e no teste pareado. Quando ela veio da ordem das linhas, e
     não de um sufixo reconhecido, a tela pede conferência em vez de
     fingir que sabe. */
  if (p.momentos.length > 1) {
    caixa.appendChild(el("div", { class: "hint",
      text: "Ordem dos momentos: " + p.momentos.join(" → ")
        + " (" + p.ordem_dos_momentos + ")."
        + (p.ordem_dos_momentos === "sufixo das colunas" ? ""
           : " Confira: é ela que define o antes e o depois.") }));
  }

  caixa.appendChild(card("O que o sistema entendeu de cada coluna", null,
    el("div", { class: "fom-lista" }, (p.colunas || []).map(function (c) {
      const marcado = (p.preenchimento || []).find(function (x) {
        return x.coluna === c.coluna; });
      return el("div", { class: "fom-item" }, [
        el("div", { class: "fom-corpo" }, [
          el("b", { text: c.coluna }),
          el("small", { text: c.papel === "medida"
            ? "medida de " + c.instrumento
              + (c.momento_no_nome ? " · momento " + c.momento_no_nome : "")
            : (c.papel === "ignorada" ? "ignorada — não é medida nem identificação"
                                      : c.papel) }),
        ]),
        marcado ? el("span", { class: "prazo-chip",
          text: marcado.faltam ? "faltam " + marcado.faltam + " de " + marcado.linhas
                               : marcado.linhas + " preenchidas" }) : el("span"),
      ]);
    }))));

  if ((p.problemas || []).length) {
    caixa.appendChild(card("O que não deu para ler",
      "Estas linhas não entram. Nada aqui é adivinhado.",
      el("ul", { class: "listinha" }, p.problemas.slice(0, 40).map(function (x) {
        return el("li", {}, el("small", { text: x })); }))));
  }
  return caixa;
}

/* ======================================================================
   CONFIABILIDADE — alfa de Cronbach
   ----------------------------------------------------------------------
   A pergunta que vem ANTES de qualquer teste: "este questionário está
   medindo uma coisa só, com esta amostra?". Instrumento inconsistente
   invalida a média, o efeito e a correlação calculados em cima dele.

   O alfa sai por SUBESCALA, e não só no total: subescalas medem coisas
   diferentes de propósito, e o alfa do instrumento inteiro mistura
   construtos. O número que o revisor pede é o de cada subescala.

   A tela diz três coisas que a planilha comum não diz: que o alfa é
   LIMITE INFERIOR (não a confiabilidade em si), que ele CRESCE com o
   número de itens, e que acima de 0,95 costuma ser redundância.
   ====================================================================== */
function faixaDoAlfa(a) {
  /* Faixas de leitura, não de aprovação. O ponto de corte "0,70" virou
     regra de bolso sem que ninguém verifique o k: 0,70 com quatro itens
     é outra coisa que 0,70 com quarenta. Por isso a tela sempre mostra
     o k ao lado. */
  if (a === null || a === undefined) return { rotulo: "—", tom: null };
  if (a >= 0.95) return { rotulo: "possivelmente redundante", tom: "alerta" };
  if (a >= 0.80) return { rotulo: "boa", tom: "bom" };
  if (a >= 0.70) return { rotulo: "aceitável", tom: "bom" };
  if (a >= 0.60) return { rotulo: "limítrofe", tom: "alerta" };
  return { rotulo: "baixa", tom: "critico" };
}

function blocoDaEscala(e) {
  const caixa = el("div", { class: "card" });
  const faixa = faixaDoAlfa(e.alfa);
  caixa.appendChild(el("h3", { text: e.escala }));

  if (e.alfa === null) {
    caixa.appendChild(el("div", { class: "empty",
      text: e.aviso || "sem dados suficientes" }));
    return caixa;
  }

  caixa.appendChild(el("div", { class: "grid g4", style: "margin:12px 0" }, [
    /* Sem `hero`: o cartão grande ocupa duas colunas e empurrava o
       intervalo sozinho para a linha de baixo -- e o intervalo é
       justamente o que impede de ler o alfa como número exato. Os
       quatro ficam lado a lado, que é como se comparam. */
    kpi({ label: "Alfa de Cronbach", value: dec(e.alfa, 2),
          tone: faixa.tom === "bom" ? "good" : (faixa.tom === "critico" ? "bad" : null) }),
    kpi({ label: "Itens", value: C.fmt(e.k) }),
    kpi({ label: "Pessoas", value: C.fmt(e.n) }),
    kpi({ label: "Intervalo de 95%",
          value: e.ic ? dec(e.ic[0], 2) + " a " + dec(e.ic[1], 2) : "—" }),
  ]));

  caixa.appendChild(leituraDe({
    sinal: "neutro",
    forte: "Consistência " + faixa.rotulo + " (α = " + dec(e.alfa, 2)
           + ", com " + e.k + " itens).",
    texto: "O alfa é um LIMITE INFERIOR da confiabilidade, e não a "
      + "confiabilidade: ele supõe que todos os itens medem a mesma coisa "
      + "com o mesmo peso, e quando isso não vale ele subestima. Leia "
      + "como \u201cpelo menos " + dec(e.alfa, 2) + "\u201d. E ele cresce com o "
      + "número de itens: compare só com instrumentos de tamanho parecido.",
  }));

  if (e.aviso) {
    caixa.appendChild(el("div", { class: "note", text: e.aviso }));
  }

  /* O item que atrapalha. "Alfa sem ele" acima do alfa atual é o sinal:
     ou o item mede outra coisa, ou está invertido e ninguém marcou. */
  const problemas = (e.itens || []).filter(function (i) {
    return i.alfa_sem_ele !== null && i.alfa_sem_ele > e.alfa + 0.02;
  });
  if (problemas.length) {
    caixa.appendChild(el("div", { class: "note" }, [
      el("b", { text: "Item que puxa para baixo. " }),
      el("span", { text: "Tirar " + problemas.map(function (i) {
        return i.code; }).join(", ") + " subiria o alfa. Antes de tirar, "
        + "confira se o item não é invertido sem estar marcado: é a causa "
        + "mais comum, e a que não se resolve apagando a pergunta." }),
    ]));
  }

  caixa.appendChild(C.table(
    [{ label: "Item", k: "code" },
     { label: "Enunciado", k: "enunciado",
       get: function (i) { return i.enunciado || "—"; } },
     { label: "Invertido", k: "invertido",
       get: function (i) { return i.invertido ? "sim" : "—"; } },
     { label: "r com o resto", k: "r_com_o_resto", num: true,
       get: function (i) { return dec(i.r_com_o_resto, 2); } },
     { label: "Alfa sem ele", k: "alfa_sem_ele", num: true,
       get: function (i) { return i.alfa_sem_ele === null ? "—" : dec(i.alfa_sem_ele, 2); } }],
    e.itens || []));
  return caixa;
}
