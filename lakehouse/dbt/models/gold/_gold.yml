version: 2
models:
  - name: athlete_day
    description: "Média atleta-dia (todos os momentos) — unidade de análise."
    columns:
      - name: ID
        tests: [not_null]
      - name: vigor
        tests: [not_null]
  - name: daily_group
    columns:
      - name: dia
        tests: [not_null, unique]
  - name: risk_features
    columns:
      - name: risco_amanha
        tests:
          - accepted_values: {values: [0, 1], quote: false}
