<title>Sinal e Ruído no Handebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ground:#EEF2F0; --ground-2:#E4EAE7; --card:#FBFCFB; --card-2:#F5F8F6;
  --inset:#0D1719; --inset-2:#132226; --inset-ink:#DCE8E5; --inset-mut:#7E9A96;
  --ink:#14201E; --ink-2:#54635F; --ink-3:#87968F; --rule:#D8E0DC; --rule-2:#C3CFCA;
  --sinal:#0F6E5C; --sinal-2:#0A5245; --sinal-luz:#E2F0EB;
  --c1:#2166AC; --c2:#1A9070; --c3:#E0952B; --c4:#C1440E; --c5:#8A4FBF; --c6:#A31E52;
  --bom:#1A7F5A; --atencao:#C88A1E; --critico:#B3341A;
  --r:10px; --rail:224px; --top:64px;
  --sombra:0 1px 2px rgba(20,32,30,.05), 0 8px 24px -12px rgba(20,32,30,.18);
  --sombra-2:0 2px 4px rgba(20,32,30,.06), 0 18px 48px -20px rgba(20,32,30,.26);
  --disp:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",system-ui,sans-serif;
  --corpo:"Source Serif 4",Georgia,"Times New Roman",serif;
  --dado:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--disp);
  height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
::selection{background:#BFE3D8}
:focus-visible{outline:2px solid var(--sinal);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh}
.rail{background:linear-gradient(168deg,#0D1719 0%,#122225 46%,#0E1B1D 100%);
  color:var(--inset-ink);display:flex;flex-direction:column;position:relative;overflow:hidden}
.rail::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 12% 0%, rgba(26,144,112,.20), transparent 62%),
             radial-gradient(90% 50% at 90% 100%, rgba(33,102,172,.16), transparent 60%)}
.marca{padding:18px 18px 14px;position:relative;z-index:1;border-bottom:1px solid rgba(220,232,229,.10)}
.marca b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.marca span{display:block;font-family:var(--dado);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--inset-mut);margin-top:6px}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;flex:1;overflow-y:auto}
.nav .grupo{font-family:var(--dado);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#5E7A76;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px;
  color:#B9CDC9;transition:background .16s,color .16s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:rgba(220,232,229,.07);color:#E6F1EE}
.nav button[aria-current="true"]{background:rgba(26,144,112,.20);color:#FFF;font-weight:600}
.nav button[aria-current="true"] svg{opacity:1;color:#5FD3AC}
.rodape{padding:12px 18px 16px;position:relative;z-index:1;border-top:1px solid rgba(220,232,229,.10);
  font-family:var(--dado);font-size:10px;color:#5E7A76;line-height:1.7}

.main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.topo{height:var(--top);flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:rgba(251,252,251,.82);backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--rule);z-index:20}
.topo h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
.topo .sub{font-family:var(--dado);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.espaco{flex:1}
.seg{display:inline-flex;background:var(--ground-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:6px;font-size:12.5px;
  cursor:pointer;color:var(--ink-2);transition:background .16s,color .16s,box-shadow .16s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sombra)}
.tela{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px 28px;scroll-behavior:smooth}
.tela::-webkit-scrollbar{width:10px}
.tela::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:99px;border:3px solid var(--ground)}
[hidden]{display:none!important}

/* ---------- blocos ---------- */
.grade{display:grid;gap:14px}
.cartao{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--sombra);padding:16px 18px;min-width:0}
.cartao>h3{margin:0 0 3px;font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.cartao>p.leg{margin:0 0 12px;font-family:var(--dado);font-size:10.5px;color:var(--ink-3);line-height:1.5}
.kpi{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--sinal))}
.kpi .rot{font-family:var(--dado);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.kpi .val{font-family:var(--dado);font-size:27px;font-weight:600;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1}
.kpi .val small{font-size:14px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.kpi .nota{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--dado);font-size:10px;
  letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid currentColor;text-transform:uppercase}
.pill.bom{color:var(--bom)} .pill.at{color:var(--atencao)} .pill.cr{color:var(--critico)}
.pill.neu{color:var(--ink-3)}
.tag{display:inline-block;font-family:var(--dado);font-size:10px;padding:2px 7px;border-radius:5px;
  background:var(--ground-2);color:var(--ink-2)}
.prosa{font-family:var(--corpo);font-size:14.5px;line-height:1.68;color:#25332F;max-width:66ch}
.prosa p{margin:0 0 12px}
.prosa strong{font-weight:600;color:var(--ink)}

/* ---------- instrumento (a única superfície escura) ---------- */
.instr{position:relative;background:linear-gradient(160deg,var(--inset) 0%,var(--inset-2) 60%,#0B1518 100%);
  border-radius:var(--r);border:1px solid #24383B;overflow:hidden;color:var(--inset-ink);
  box-shadow:var(--sombra-2)}
.instr canvas.chuva{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.instr .conteudo{position:relative;z-index:2;padding:16px 18px}
.instr h3{margin:0 0 2px;font-size:13.5px;font-weight:600;color:#EAF3F1}
.instr p.leg{margin:0 0 10px;font-family:var(--dado);font-size:10.5px;color:var(--inset-mut)}
.instr .ctrl{display:flex;align-items:center;gap:10px;margin-top:10px}
.instr .ctrl button{background:rgba(26,144,112,.18);border:1px solid rgba(95,211,172,.35);
  color:#9FE7CE;border-radius:7px;padding:5px 13px;font-size:12px;cursor:pointer;
  font-family:var(--dado);letter-spacing:.04em;transition:background .16s}
.instr .ctrl button:hover{background:rgba(26,144,112,.30)}
.instr .ctrl .marcador{font-family:var(--dado);font-size:11px;color:var(--inset-mut);
  font-variant-numeric:tabular-nums}
.instr input[type=range]{flex:1;accent-color:#5FD3AC;background:transparent}

/* ---------- tabelas ---------- */
.tabwrap{overflow:auto;max-height:100%;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{position:sticky;top:0;background:var(--card-2);font-family:var(--dado);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);z-index:2;
  border-bottom:1px solid var(--rule-2);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td.num{font-family:var(--dado);font-variant-numeric:tabular-nums;text-align:right}
tbody tr:hover{background:var(--sinal-luz)}
tbody tr:last-child td{border-bottom:0}

/* ---------- controles ---------- */
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--rule-2);background:var(--card);border-radius:99px;padding:5px 12px;
  font-size:12px;cursor:pointer;transition:all .16s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--sinal);color:var(--sinal)}
.chip[aria-pressed="true"]{background:var(--sinal);border-color:var(--sinal);color:#fff;font-weight:600}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--cc,var(--ink-3));display:inline-block}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
input[type=search],select{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--rule-2);background:var(--card);color:var(--ink);min-width:180px}
input[type=search]:focus,select:focus{border-color:var(--sinal);outline:none;box-shadow:0 0 0 3px var(--sinal-luz)}

/* ---------- gráficos ---------- */
svg{display:block;max-width:100%;overflow:visible}
.cartao>svg,.cartao svg.g{max-width:860px}
.grade{align-items:start}
.eixo{font-family:var(--dado);font-size:9.5px;fill:var(--ink-3)}
.rotdir{font-family:var(--disp);font-size:11px;font-weight:600}
.grid{stroke:var(--rule);stroke-width:1}
.dica{position:fixed;pointer-events:none;z-index:99;background:#0D1719;color:#EAF3F1;
  border-radius:8px;padding:8px 11px;font-family:var(--dado);font-size:11px;line-height:1.55;
  box-shadow:0 8px 28px -8px rgba(0,0,0,.55);opacity:0;transition:opacity .12s;max-width:280px}
.dica b{color:#7FE0C0;font-weight:600}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--ink-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- fluxo / organograma ---------- */
.fluxo{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.no{flex:1;min-width:120px;background:var(--card);border:1.5px solid var(--nc,var(--rule-2));
  border-radius:9px;padding:11px 12px;position:relative}
.no b{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--nc,var(--ink))}
.no span{font-size:11px;color:var(--ink-2);line-height:1.45;display:block}
.seta{align-self:center;color:var(--rule-2);flex:none}

.linha-tempo{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{border-radius:9px;padding:10px 9px;border:1.5px solid var(--dc);background:var(--db);position:relative;cursor:pointer;transition:transform .16s,box-shadow .16s}
.dia:hover{transform:translateY(-2px);box-shadow:var(--sombra-2)}
.dia b{display:block;font-size:12.5px;font-weight:700}
.dia .tp{font-size:10.5px;font-weight:600;color:var(--dc);margin:2px 0 6px}
.dia .mt{font-family:var(--dado);font-size:10px;color:var(--ink-2);line-height:1.6;font-variant-numeric:tabular-nums}

details{border:1px solid var(--rule);border-radius:9px;background:var(--card);margin-bottom:8px}
summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:9px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink-3);
  border-bottom:1.6px solid var(--ink-3);transform:rotate(-45deg);transition:transform .18s}
details[open] summary::before{transform:rotate(45deg)}
details .corpo{padding:0 14px 14px;font-size:13px;line-height:1.6;color:var(--ink-2)}
a{color:var(--sinal);text-decoration:none;border-bottom:1px solid rgba(15,110,92,.28)}
a:hover{border-bottom-color:var(--sinal)}
.ref{padding:11px 0;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:baseline}
.ref .n{font-family:var(--dado);font-size:10.5px;color:var(--ink-3);flex:none;width:26px}
.ref .txt{font-family:var(--corpo);font-size:13px;line-height:1.55;color:#25332F}
.ref .lk{display:flex;gap:6px;flex:none;align-items:center}
.mini{font-family:var(--dado);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule-2);border-radius:5px;padding:2px 7px;color:var(--ink-2);white-space:nowrap}
.mini:hover{border-color:var(--sinal);color:var(--sinal)}
pre{background:var(--inset);color:#CFE3DF;border-radius:9px;padding:14px;overflow:auto;
  font-family:var(--dado);font-size:11px;line-height:1.6;max-height:340px;margin:0}
@media (max-width:1100px){:root{--rail:64px}.marca b,.marca span,.nav button span.rot,.nav .grupo,.rodape{display:none}
  .nav button{justify-content:center}}
</style>

er 1","vies":"Pondera duplamente os atletas que responderam duas vezes e simplesmente os que responderam uma."},{"sigla":"U-AD","nome":"Par atleta-dia","n":166,"regra":"Um valor por atleta e por dia. D1 teve coleta única e vale a primeira resposta de cada atleta; de D2 a D7 o valor é a média do primeiro registro do dia (pré) e do último (pós).","usada_em":"Artigos 1 e 2 (unidade adotada)","vies":"Cada atleta pesa igual em cada dia; elimina a pseudorreplicação."},{"sigla":"U-PAR","nome":"Subamostra pareada","n":143,"regra":"Apenas os 21 atletas com medida em D1 e em D7.","usada_em":"Uma das gerações intermediárias","vies":"Sem viés de ponderação, mas perde 22% dos pares e restringe a inferência aos assíduos."}],"auditoria":[{"id":"D1","titulo":"Fonte de dados trocada","achado":"A base usada em todas as gerações anteriores descendia de COLETAS.xlsx, que carrega um desalinhamento de linhas em 28 registros de dois atletas.","correcao":"A base V2 parte da aba «Diário - Treino» do export do formulário, designada FONTE-VERDADE pela auditoria do autor.","impacto":"Diferença máxima nas médias diárias: 0,30 ponto (PTH em D3). Nenhuma conclusão se inverte.","gravidade":"média"},{"id":"D2","titulo":"Coluna de data corrompida","achado":"A coluna «Data», preenchida pelo respondente, contém datas de nascimento e erros de digitação: 55 registros trazem ano anterior a 2020. Por esse campo, 84 dos 457 registros seriam inutilizáveis (68 caem fora da semana e 16 estão em branco), e 88 divergem do dia obtido pelo carimbo.","correcao":"O dia passou a ser definido pelo carimbo de data/hora, com fronteira às 04h00.","impacto":"Seis registros lançados entre 00h e 01h de 22/04 retornaram ao dia 1, ao qual pertencem: todos são de atletas que já haviam respondido na noite de 21/04.","gravidade":"alta"},{"id":"D3","titulo":"Registros órfãos","achado":"Quatro registros receberam o rótulo «Não Identificado» na coluna padronizada, o que criou um vigésimo oitavo atleta fantasma na contagem ingênua.","correcao":"Dois foram recuperados por correspondência exata no dicionário de variantes e dois pelo nome curado em COLETAS.xlsx para o mesmo carimbo. Os quatro voltaram aos donos (A01, A01, A04, A07).","impacto":"O elenco é de 27 atletas, não 28. Nenhum atleta-dia foi criado ou perdido.","gravidade":"média"},{"id":"D4","titulo":"Unidade de análise não declarada: a causa raiz","achado":"As sete gerações de manuscrito misturam quatro unidades de análise distintas sem declará-las. A mesma classificação, sobre os mesmos dados, produz variações do perfil iceberg entre D1 e D7 que vão de −0,6 a −18,0 pontos percentuais conforme a unidade escolhida.","correcao":"Os dois artigos novos declaram o par atleta-dia como unidade única e reportam a matriz de reconciliação como resultado.","impacto":"Explica integralmente as divergências que bloqueavam a submissão.","gravidade":"crítica"},{"id":"D5","titulo":"Denominadores incompatíveis na comparação D1×D7","achado":"Uma das gerações comparou 27 atletas em D1 contra 37 registros de apenas 21 atletas em D7.","correcao":"A comparação passou a ser pareada, restrita aos 21 atletas com as duas medidas, e o contraste agregado passou a usar um registro por atleta-dia.","impacto":"A variação do iceberg deixa de ser um artefato de contagem.","gravidade":"crítica"},{"id":"D6","titulo":"Janela de coleta do dia 7","achado":"Em D7 todos os 46 registros ocorrem entre 08h e 14h; não existe medida noturna.","correcao":"O contraste pré/pós de D7 passa a ser descrito como manhã contra início da tarde.","impacto":"Não altera número algum, mas corrige a interpretação do custo do último dia.","gravidade":"baixa"},{"id":"Q1","titulo":"Coluna «Data» autorreferida diverge do carimbo","achado":"88 de 440 registros com data declarada divergem do dia obtido pelo carimbo; o conjunto inclui datas de nascimento.","correcao":"O dia passa a ser derivado exclusivamente do carimbo de data e hora, com virada às 4h.","impacto":"88 de 440","gravidade":"alta"},{"id":"Q2","titulo":"Nome em texto livre sem padronização","achado":"67 grafias distintas para 48 nomes canônicos, 15 deles com mais de uma grafia.","correcao":"A identidade passa a vir da coluna padronizada, e a codificação A01–A27 é feita na importação.","impacto":"15 de 48","gravidade":"alta"},{"id":"Q3","titulo":"Registros excedentes ao protocolo de coleta","achado":"O protocolo previa uma coleta em D1 e duas de D2 a D7; a distribuição observada vai de 1 a 6 registros por par atleta-dia, e 17 pares consecutivos ocorrem em 30 minutos ou menos. A conferência pelo carimbo (V2_proto) mostra de 7 a 10 janelas de coleta do elenco por dia, e não duas.","correcao":"De D2 a D7 valem o primeiro registro do dia (pré) e o último (pós); os registros intermediários deixam de compor o valor diário. O pré não exige hora da manhã, porque 59 dos 139 atletas-dia só responderam a partir do meio-dia, sem registro anterior naquele dia. Em D1, de coleta única, vale a primeira resposta de cada atleta: as 21 respostas tardias são repetição, e não segunda coleta, pois 21 dos 22 atletas da janela tardia já haviam respondido às 20h42. Ao todo, 285 dos 456 registros compõem os valores diários.","impacto":"79 de 166","gravidade":"alta"},{"id":"Q4","titulo":"Rótulo do domínio da sonolência de Epworth","achado":"A coluna da planilha é rotulada «Epworth Total (0-24)», mas o formulário aplicou seis das oito situações da escala, de modo que o máximo possível é 18. O máximo observado é 18.","correcao":"O domínio declarado passa a 0 a 18, e o texto passa a dizer que é uma aplicação de seis itens.","impacto":"6 de 8","gravidade":"média"},{"id":"Q5","titulo":"Escores calculados da planilha","achado":"As nove colunas calculadas foram reconstruídas por fórmula a partir dos itens em 4113 conferências, com 0 divergências.","correcao":"Nada a corrigir. A pontuação da planilha está correta, e as divergências entre versões do manuscrito não vêm do escore.","impacto":"0 de 4113","gravidade":"nenhuma"},{"id":"Q6","titulo":"Cerca de Tukey inaplicável a subescala com piso","achado":"Em Confusão, T de Confusão o intervalo interquartil é zero, de modo que a cerca de Tukey classifica como discrepante todo valor diferente do piso. O z modificado também falha, porque o desvio absoluto mediano é zero.","correcao":"Nessas subescalas a triagem passa a ser feita pelo domínio admissível e pela comparação intraindividual, e não por regra de dispersão.","impacto":"2 de 19","gravidade":"método"}],"referencia":[{"id":1,"autores":"BEEDIE, C","ano":2000,"titulo":"The profile of mood states and athletic performance: two meta-analyses","veiculo":"journal of applied sport psychology","doi":"10.1080/10413200008404213","url_doi":"https://doi.org/10.1080/10413200008404213","abnt":"BEEDIE, C. J.; TERRY, P. C.; LANE, A. M. The profile of mood states and athletic performance: two meta-analyses. Journal of Applied Sport Psychology, v. 12, n. 1, p. 49-68, 2000."},{"id":2,"autores":"BELGACEM, A","ano":2026,"titulo":"Impact of competitive anxiety on mood, sleep, and physical activity levels in young karate athletes","veiculo":null,"doi":"10.1097/MD.0000000000048435","url_doi":"https://doi.org/10.1097/MD.0000000000048435","abnt":"BELGACEM, A.; SALEM, A.; YILDIZ, M. et al. Impact of competitive anxiety on mood, sleep, and physical activity levels in young karate athletes. Medicine, v. 105, 2026."},{"id":3,"autores":"BIRD, S","ano":2025,"titulo":"Wellness, mood, sleep, and performance in a women's national basketball team during international competition","veiculo":null,"doi":"10.5114/jhk/200117","url_doi":"https://doi.org/10.5114/jhk/200117","abnt":"BIRD, S. P.; PARSONS-SMITH, R. L.; KING, R. et al. Wellness, mood, sleep, and performance in a women's national basketball team during international competition. Journal of Human Kinetics, 2025."},{"id":4,"autores":"BJØRNDAL, C","ano":2021,"titulo":"An examination of training load, match activities, and health problems in Norwegian youth elite handball players ov 555555555554,"Raiva":6.388888888888889,"Vigor":3.3333333333333335,"Fadiga":10.166666666666666,"Confusão":1.1111111111111112,"TMD":19.333333333333332},{"perfil":"Everest invertido","n":3,"risco":true,"Tensão":2.6666666666666665,"Depressão":13.333333333333334,"Raiva":11.333333333333334,"Vigor":1.0,"Fadiga":14.0,"Confusão":3.0,"TMD":43.333333333333336}],"VEREDICTO":{"pth":{"rho":-0.4219916483708314,"p":1.752903856724241e-06,"mecanico":true},"tensao":{"rho":-0.13176684939307715,"p":0.1531563853535742,"mecanico":false},"ganho_tensao":0.0818965517241379,"texto":"O corte pelo PTH tem componente mecânico: quem amanhece com PTH baixo tende a subir por reversão à média (ρ = −0,422, p < 0,001). O corte pela tensão não tem: a tensão da manhã não prediz a própria variação (ρ = −0,132, p = 0,153). Acrescentar a tensão ao PTH eleva a AUC de 0,659 para 0,740, de modo que a tensão matinal carrega informação própria: alguma tensão pela manhã protege, e a ausência completa de tensão em atleta já muito favorável antecede a queda vespertina."}},"crispdm":{"FASES":[{"id":"negocio","n":1,"nome":"Entendimento do problema","pergunta":"O que a comissão técnica precisa decidir, e em que prazo?","feito":["A pergunta foi fixada em uma forma verificável: como as seis dimensões do humor se comportam ao longo dos sete dias finais de pré-temporada, e se a medida da manhã antecipa o estado da noite.","O desfecho de interesse foi definido como a faixa de risco do perfil de humor, não como escore bruto, porque a comissão age sobre atletas, não sobre médias.","O horizonte de decisão é de horas: a medida da manhã precisa informar a sessão do mesmo dia."],"copiloto":"Formular hipóteses concorrentes e escrever o critério de falseamento de cada uma antes de olhar os dados.","humano":"A escolha do desfecho clinicamente relevante e do horizonte de decisão. Nenhum modelo decide o que importa para a equipe.","artefatos":["texto/A1T.py","texto/A2T.py"]},{"id":"dados","n":2,"nome":"Entendimento dos dados","pergunta":"O que existe de fato, e o que cada linha significa?","feito":["456 registros de 27 atletas ao longo de sete dias, de duas coletas diárias a partir do dia 2.","218 abas e 282.776 células das planilhas de origem foram catalogadas em camada de acervo. com raspagem de nomes próprios na importação.","Quatro unidades de análise coexistiam nas versões anteriores: registro (U-R), primeira e última (U-286), par atleta-dia (U-AD) e subamostra pareada (U-PAR).","12 achados de auditoria foram registrados, dois deles críticos.","Segunda passagem, sobre a qualidade do dado: os nove escores calculados foram reconstruídos por fórmula a partir dos itens e confrontados com a base de origem em 4113 conferências, sem divergência.","Completude integral no nível do item (nenhuma célula ausente em 20.108 respostas), mas a cobertura da grade atleta-dia recua a 78% do elenco em D4 e D7. A falta é de comparecimento, não de item.","O nome em texto livre traz 67 grafias para 48 nomes canônicos; a identidade passa a vir da coluna padronizada."],"copiloto":"Ler as sete versões do manuscrito e as seis planilhas em paralelo, reproduzir cada número divergente e localizar a regra que o gerou; depois reconstruir por fórmula, desde o item, todo escore calculado.","humano":"A decisão de adotar o par atleta-dia (U-AD) como unidade canônica, e de declarar as outras três em vez de escondê-las.","artefatos":["analise/V2_audit.py","analise/V2_qual.py","scripts/colher_planilhas.py","base/esquema.sql"]},{"id":"preparacao","n":3,"nome":"Preparação dos dados","pergunta":"Como transformar planilhas em uma base que responda perguntas?","feito":["A regra do dia fisiológico (virada às 4h) resolveu os registros de madrugada sem descartá-los.","Registros órfãos foram reconciliados por dicionário de variantes do nome e, quando insuficiente, pelo carimbo de tempo curado.","A base única em SQLite tem três camadas (canônica, de resultados e de acervo), com 1309 pares pré-pós e 305 resultados em formato longo.","Anonimização A01–A27 dentro da rotina de importação: nenhum nome sai do script.","Triagem de discrepantes por ordem declarada: domínio da escala primeiro, depois cerca de Tukey, escore z e escore z modificado. Nenhum valor fora do domínio em 456 registros.","Em subescala com efeito de piso o intervalo interquartil é nulo e a cerca de Tukey rotula 19,5% da amostra: o critério é inaplicável, e a triagem passa a ser intraindividual.","Correção aplicada: o domínio da sonolência de Epworth passou de 0 a 24 para 0 a 18, porque o formulário aplicou seis das oito situações da escala."],"copiloto":"Escrever a rotina de reconciliação, a raspagem de nomes e o esquema de três camadas; verificar que zero nomes completos sobrevivem.","humano":"A curadoria dos registros ambíguos, a regra da virada às 4h, que é decisão de fisiologia e não de programação, e a recusa em aplicar regra de dispersão a variável com piso.","artefatos":["analise/base_v2.py","scripts/construir_base.py","atualizar.sh"]},{"id":"modelagem","n":4,"nome":"Modelagem","pergunta":"A medida da manhã antecipa o estado da noite?","feito":["119 pares atleta-dia, 27 atletas, 61 eventos (51,3%).","Alvo e preditores separados no tempo: a previsão não é circular.","Validação cruzada agrupada por atleta (StratifiedGroupKFold): nenhum atleta aparece ao mesmo tempo no treino e no teste.","Duas linhas de base obrigatórias: a classe majoritária e a regra trivial de já estar em risco pela manhã.","Quatro modelos: árvore de decisão, floresta aleatória, XGBoost e regressão logística."],"copiloto":"Montar a matriz, escrever o protocolo de validação agrupada e rodar o intervalo de confiança por reamostragem agrupada.","humano":"A exigência de que existisse uma linha de base trivial. Sem ela, uma AUC de 0,80 pareceria descoberta quando é sobretudo persistência do estado matinal.","artefatos":["analise/V2_ml.py","analise/V2_ml2.py"]},{"id":"avaliacao","n":5,"nome":"Avaliação","pergunta":"O ganho é real, ou é aritmética do desenho?","feito":["O ganho de AUC sobre a regra trivial não exclui zero em nenhum modelo (melhor caso, XGBoost: +0,033, IC 95% [−0,047, +0,109]).","Reversão à média testada em todas as dimensões: o corte pelo PTH é parcialmente mecânico (ρ = −0,422, p < 0,001).","O corte pela tensão não é mecânico (ρ = −0,132, p = 0,153) e acrescenta +0,082 de AUC sobre o PTH sozinho.","No subgrupo acionável, isto é, entre os que começam o dia fora da faixa de risco, o intervalo de confiança exclui o acaso.","Reconferência por dois caminhos de código independentes: 65 de 65 conferências coincidem, incluídas as que sustentam os dois artigos e a base da modelagem."],"copiloto":"Propor e executar o diagnóstico de reversão à média e a sequência de modelos aninhados antes de qualquer redação.","humano":"A recusa em relatar a folha mais forte como achado clínico antes do diagnóstico. O modelo não sabe que precisa desconfiar de si.","artefatos":["analise/V2_ml3.py","analise/V2_qual.py","analise/V2_conf.py"]},{"id":"implantacao","n":6,"nome":"Implantação","pergunta":"Como isso vira rotina da comissão técnica, e não um relatório único?","feito":["Um comando reconstrói tudo: base, perfis, análises, banco, acervo e figuras (atualizar.sh).","Consulta por linha de comando sobre a base única. com busca em texto completo sobre 282.776 células.","Dois artigos e 63 referências com DOI verificado contra o registro do periódico.","Painel de apresentação com as duas trilhas de artigo, a auditoria e esta trilha de modelagem."],"copiloto":"Escrever a automação, o exportador do painel e a resolução de DOI; manter tudo reprodutível a partir da fonte.","humano":"A decisão sobre o que entra em repositório aberto: as planilhas com nomes reais não acompanham a submissão.","artefatos":["atualizar.sh","scripts/consultar.py","painel/painel.html"]}],"REGRAS":[{"t":"A pergunta antes do dado","d":"A hipótese e o critério de falseamento são escritos antes de olhar o resultado. O contrário produz achado por garimpo."},{"t":"A unidade de análise é declarada","d":"Sete versões divergiam por quatro unidades não declaradas, sem um único erro de aritmética. Declarar a unidade é metade da reprodutibilidade."},{"t":"Toda comparação tem linha de base","d":"Um modelo só ganha crédito contra a regra trivial que qualquer preparador aplicaria de cabeça."},{"t":"Validação agrupada por indivíduo","d":"Com 27 atletas e 119 observações, dividir por linha e não por atleta infla a AUC pela memorização do atleta."},{"t":"O contraintuitivo é diagnosticado, não narrado","d":"A folha mais forte foi submetida ao teste de reversão à média antes de virar frase."},{"t":"A regra de triagem tem de caber na distribuição","d":"A cerca de Tukey rotulou 19,5% da amostra como discrepante em uma subescala cujo interquartil é nulo. Critério de dispersão não se aplica a variável com piso."},{"t":"O anonimato começa na importação","d":"O nome não sai do script. A raspagem é verificada, não presumida."}],"N":{"atleta":27,"registro":456,"atleta_dia":166,"pre_pos":1309,"resultado":305,"aba":218,"celula":282776,"referencia":63,"auditoria":12,"significativo":130}},"qual":{"DICIONARIO":[{"v":"atleta","tipo":"nominal","escala":"código A01–A27","dominio":"27 níveis","origem":"Nome Padronizado, codificado"},{"v":"dia","tipo":"ordinal","escala":"D1–D7","dominio":"1 a 7","origem":"carimbo de data e hora, virada às 4h"},{"v":"tipo_estimulo","tipo":"nominal","escala":"4 níveis","dominio":"Basal, HIIT, Amistoso, Técnico/força","origem":"planejamento do microciclo"},{"v":"periodo","tipo":"nominal","escala":"4 níveis","dominio":"madrugada, manhã, tarde, noite","origem":"hora do carimbo"},{"v":"momento","tipo":"nominal","escala":"3 níveis","dominio":"pré, pós, único","origem":"ordem do registro no dia"},{"v":"sensacao_fisica","tipo":"ordinal","escala":"Likert de 5","dominio":"Muito mal a Muito bem","origem":"item do formulário"},{"v":"sensacao_mental","tipo":"ordinal","escala":"Likert de 5","dominio":"Muito mal a Muito bem","origem":"item do formulário"},{"v":"item BRUMS (24)","tipo":"ordinal","escala":"Likert de 5","dominio":"0 a 4","origem":"itens 5 a 28 do formulário"},{"v":"item Epworth (6)","tipo":"ordinal","escala":"Likert de 4","dominio":"0 a 3","origem":"itens 32 a 37"},{"v":"item PSS (14)","tipo":"ordinal","escala":"Likert de 5","dominio":"0 a 4","origem":"itens 38 a 51, sete deles invertidos"},{"v":"Tensão…Confusão","tipo":"discreta","escala":"soma de 4 itens","dominio":"0 a 16","origem":"calculada por fórmula"},{"v":"TMD","tipo":"discreta","escala":"composto","dominio":"−16 a 80","origem":"calculada por fórmula"},{"v":"Fad.Física","tipo":"discreta","escala":"numérica direta","dominio":"0 a 10","origem":"item único"},{"v":"Fad.Mental","tipo":"discreta","escala":"numérica direta","dominio":"0 a 10","origem":"item único"},{"v":"Epworth","tipo":"discreta","escala":"soma de 6 itens","dominio":"0 a 24","origem":"calculada por fórmula"},{"v":"PSS","tipo":"discreta","escala":"soma de 14 itens","dominio":"0 a 56","origem":"calculada por fórmula, com inversão"},{"v":"TQR","tipo":"ordinal","escala":"Borg 6–20","dominio":"6 a 20","origem":"item único"},{"v":"escore T","tipo":"contínua","escala":"padronizada","dominio":"real","origem":"(x − média normativa) ÷ desvio × 10 + 50"},{"v":"média diária","tipo":"contínua","escala":"média de 1 a 2 registros","dominio":"0 a 16","origem":"agregação do par atleta-dia"},{"v":"hora decimal","tipo":"contínua","escala":"0 a 24 h","dominio":"real","origem":"carimbo de data e hora"}],"FORMULAS":[{"id":"F1","nome":"Subescala do BRUMS","formula":"S_k = Σ_{i∈k} x_i,  x_i ∈ {0,1,2,3,4},  |k| = 4  ⇒  S_k ∈ [0, 16]","nota":"Quatro itens por subescala, sem inversão e sem peso."},{"id":"F2","nome":"Perturbação total do humor","formula":"PTH = (Tensão + Depressão + Raiva + Fadiga + Confusão) − Vigor  ⇒  PTH ∈ [−16, 80]","nota":"Sem a constante 100 que algumas versões acrescentam."},{"id":"F3","nome":"Escore T normativo","formula":"T_k = (S_k − μ_k) ÷ σ_k × 10 + 50","nota":"μ e σ das <script>
/* ============================ base ============================ */
const D = window.__DADOS__;
const CAT = ['#2166AC','#1A9070','#E0952B','#C1440E','#8A4FBF','#A31E52'];
const CV  = {'Tensão':'#2166AC','Depressão':'#1A9070','Raiva':'#E0952B','Vigor':'#C1440E',
             'Fadiga':'#8A4FBF','Confusão':'#A31E52','TMD':'#14201E'};
const CPERF = {'Iceberg':'#2166AC','Superfície':'#1A9070','Submerso':'#E0952B',
               'Barbatana de tubarão':'#C1440E','Iceberg invertido':'#8A4FBF','Everest invertido':'#A31E52',
               'Favorável':'#1A7F5A','Neutra':'#87968F','De risco':'#B3341A'};
const CEST = {'Basal':'#87968F','HIIT':'#C1440E','Amistoso':'#2166AC','Técnico/força':'#1A9070'};
const FUNDO= {'Basal':'#F0F2F1','HIIT':'#FBEDE7','Amistoso':'#E9F0F7','Técnico/força':'#E6F2ED'};
const SUB  = ['Tensão','Depressão','Raiva','Vigor','Fadiga','Confusão'];
const V7   = SUB.concat(['TMD']);
const rot  = v => v === 'TMD' ? 'PTH' : v;
const nb   = (x,d=2) => x==null||Number.isNaN(x) ? '—' : x.toFixed(d).replace('.',',').replace('-','−');
const pb   = p => p==null||Number.isNaN(p) ? '—' : (p<0.001 ? 'p < 0,001' : 'p = '+p.toFixed(3).replace('.',','));
const el   = (t,a={},...f)=>{const n=document.createElement(t);
  for(const[k,v] of Object.entries(a)){ if(k==='html')n.innerHTML=v; else if(k==='txt')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v); else if(v!=null)n.setAttribute(k,v);}
  f.flat().forEach(c=>c!=null&&n.append(c)); return n;};
const NS='http://www.w3.org/2000/svg';
/* texto SVG: cria, escreve e devolve o nó (Node.append devolve undefined) */
const stx=(pai,a,conteudo)=>{const n=document.createElementNS(NS,'text');
  for(const[k,v] of Object.entries(a)) if(v!=null) n.setAttribute(k,v);
  n.textContent=conteudo; pai.append(n); return n;};
const s = (t,a={},...f)=>{const n=document.createElementNS(NS,t);
  for(const[k,v] of Object.entries(a)) if(v!=null) n.setAttribute(k,v);
  f.flat().forEach(c=>c!=null&&n.append(c)); return n;};
const dia   = d => D.dia.find(x=>x.dia===d);
const serie = v => D.serie.filter(x=>x.variavel===v).sort((a,b)=>a.dia-b.dia);
const serieP= p => D.serie_perfil.filter(x=>x.perfil===p).sort((a,b)=>a.dia-b.dia);
const res   = f => D.resultado.filter(r=>Object.entries(f).every(([k,v])=>
                Array.isArray(v)?v.includes(r[k]):r[k]===v));

/* ---------- camada de dica ---------- */
const dica = document.getElementById('dica');
function comDica(node, html){
  node.style.cursor='default';
  node.addEventListener('pointerenter',e=>{dica.innerHTML=html;dica.style.opacity='1';mover(e);});
  node.addEventListener('pointermove',mover);
  node.addEventListener('pointerleave',()=>{dica.style.opacity='0';});
  function mover(e){
    const r=dica.getBoundingClientRect();
    let x=e.clientX+14, y=e.clientY+14;
    if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-8) y=e.clientY-r.height-14;
    dica.style.left=x+'px'; dica.style.top=y+'px';
  }
}

/* ============================ gráficos ============================ */
/* série diária com banda de piso de ruído, suavização e choques */
function grafSerie(vars, {alt=190, larg=560, perfil=false, faixas=true}={}){
  const M={t:16,r:64,b:26,l:40}, W=larg, H=alt;
  const px=d=>M.l+(d-1)/6*(W-M.l-M.r);
  const dados=vars.map(v=>({v, pts:(perfil?serieP(v):serie(v)),
                            cor:(perfil?CPERF[v]:CV[v])}));
  const vals=dados.flatMap(d=>d.pts.flatMap(p=>[p.media??p.prevalencia, p.suavizado]));
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.18||1;
  lo-=pad; hi+=pad;
  if(perfil) lo=Math.max(lo,0);
  else if(!vars.includes('TMD')) lo=Math.max(lo,0);
  const py=y=>M.t+(1-(y-lo)/(hi-lo))*(H-M.t-M.b);
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',role:'img',class:'g'});
  if(faixas) for(let d=1;d<=7;d++){
    const t=dia(d).tipo_estimulo;
    g.append(s('rect',{x:px(d)-((W-M.l-M.r)/12),y:M.t,width:(W-M.l-M.r)/6,
      height:H-M.t-M.b,fill:FUNDO[t],opacity:.85}));
  }
  for(let i=0;i<=4;i++){const y=M.t+i/4*(H-M.t-M.b);
    g.append(s('line',{x1:M.l,x2:W-M.r,y1:y,y2:y,class:'grid'}));
    stx(g,{x:M.l-7,y:y+3.4,'text-anchor':'end',class:'eixo'},nb(hi-(hi-lo)*i/4,perfil?0:1));
  }
  for(let d=1;d<=7;d++) stx(g,{x:px(d),y:H-8,'text-anchor':'middle',class:'eixo'},'D'+d);
  const fins=[];
  dados.forEach(({v,pts,cor})=>{
    const piso=pts[0].piso_ruido, base=(pts[0].media??pts[0].prevalencia);
    if(dados.length===1){
      g.append(s('rect',{x:M.l,y:py(base+piso),width:W-M.l-M.r,height:Math.abs(py(base-piso)-py(base+piso)),
        fill:'#87968F',opacity:.13}));
      g.append(s('line',{x1:M.l,x2:W-M.r,y1:py(base),y2:py(base),stroke:'#87968F','stroke-width':1.2,
        'stroke-dasharray':'4 4'}));
      const obs=pts.map(p=>`${px(p.dia)},${py(p.media??p.prevalencia)}`).join(' ');
      g.append(s('polyline',{points:obs,fill:'none',stroke:cor,'stroke-width':1.4,opacity:.42}));
      pts.forEach(p=>g.append(s('circle',{cx:px(p.dia),cy:py(p.media??p.prevalencia),r:3,
        fill:'#FBFCFB',stroke:cor,'stroke-width':1.4,opacity:.6})));
    }
    const sm=pts.map(p=>`${px(p.dia)},${py(p.suavizado)}`).join(' ');
    g.append(s('polyline',{points:sm,fill:'none',stroke:cor,'stroke-width':dados.length===1?3.4:2.4,
      'stroke-linejoin':'round','stroke-linecap':'round'}));
    pts.forEach(p=>{
      if(p.e_choque && dados.length===1){
        const a=pts[p.dia-2];
        g.append(s('line',{x1:px(a.dia),y1:py(a.suavizado),x2:px(p.dia),y2:py(p.suavizado),
          stroke:'#14201E','stroke-width':1.7,'stroke-dasharray':'1.5 2.6'}));
        g.append(s('circle',{cx:(px(a.dia)+px(p.dia))/2,cy:(py(a.suavizado)+py(p.suavizado))/2,r:4.2,
          fill:'#14201E',stroke:'#FBFCFB','stroke-width':1.6}));
      }
      const alvo=s('circle',{cx:px(p.dia),cy:py(p.suavizado),r:9,fill:'transparent'});
      comDica(alvo,`<b>${rot(v)} · D${p.dia}</b><br>${dia(p.dia).tipo_estimulo}<br>`+
        (perfil?`prevalência ${nb(p.prevalencia,1)}%`:`média ${nb(p.media)}`)+
        `<br>suavizado ${nb(p.suavizado,2)}<br>piso ±${nb(p.piso_ruido,2)}`+
        (p.e_choque?'<br>transição de choque':''));
      g.append(alvo);
    });
    fins.push({y:py(pts[6].suavizado), cor, txt:rot(v)});
  });
  fins.sort((a,b)=>a.y-b.y);
  const MIN=13; let ant=-1e9;
  fins.forEach(f=>{ f.yr=Math.max(f.y,ant+MIN); ant=f.yr; });
  const desl=fins.length?Math.max(0,fins[fins.length-1].yr-(H-M.b+4)):0;
  fins.forEach(f=>{
    const y=f.yr-desl;
    if(Math.abs(y-f.y)>1.5)
      g.append(s('polyline',{points:`${W-M.r},${f.y} ${W-M.r+4},${f.y} ${W-M.r+4},${y} ${W-M.r+7},${y}`,
        fill:'none',stroke:f.cor,'stroke-width':1}));
    stx(g,{x:W-M.r+10,y:y+4,fill:f.cor,class:'rotdir'},f.txt);
  });
  return g;
}

/* barras horizontais com valor */
function grafBarras(itens,{alt=null,larg=520,dominio=null,unid='',ref=null}={}){
  const M={t:8,r:66,b:24,l:118}, n=itens.length, hl=26, H=(alt||M.t+M.b+n*hl), W=larg;
  const mx=dominio??Math.max(...itens.map(i=>Math.abs(i.valor)))*1.1;
  const mn=Math.min(0,...itens.map(i=>i.valor));
  const x0=M.l+(mn<0? (0-mn)/(mx-mn)*(W-M.l-M.r):0);
  const px=v=>M.l+(v-mn)/(mx-mn)*(W-M.l-M.r);
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  if(ref!=null) g.append(s('line',{x1:px(ref),x2:px(ref),y1:M.t,y2:H-M.b,stroke:'#B3341A',
    'stroke-width':1.5,'stroke-dasharray':'4 3'}));
  itens.forEach((it,i)=>{
    const y=M.t+i*hl, h=15, x=Math.min(px(it.valor),x0), w=Math.abs(px(it.valor)-x0);
    const b=s('rect',{x,y:y+4,width:Math.max(w,2),height:h,rx:4,fill:it.cor||'#0F6E5C',
      opacity:it.esmaecido?.32:.92});
    comDica(b,it.dica||`<b>${it.nome}</b><br>${nb(it.valor,2)}${unid}`);
    g.append(b);
    stx(g,{x:M.l-9,y:y+15,'text-anchor':'end',class:'eixo',fill:it.cor||'#54635F'},it.nome);
    stx(g,{x:(it.valor>=0?x+w+7:x-7),y:y+15,'text-anchor':it.valor>=0?'start':'end',
      class:'eixo',fill:'#54635F'},(it.rotulo??nb(it.valor,2)+unid));
  });
  if(mn<0) g.append(s('line',{x1:x0,x2:x0,y1:M.t,y2:H-M.b,stroke:'#87968F','stroke-width':1.2}));
  return g;
}

/* rosca */
function grafRosca(fatias,{tam=150,espessura=26,centro=null}={}){
  const R=tam/2, r=R-espessura, tot=fatias.reduce((a,b)=>a+b.valor,0);
  const g=s('svg',{viewBox:`0 0 ${tam} ${tam}`,width:tam,height:tam});
  let ang=-Math.PI/2;
  fatias.forEach(f=>{
    const a2=ang+f.valor/tot*Math.PI*2, gap=0.012;
    const p=(rr,a)=>[tam/2+rr*Math.cos(a),tam/2+rr*Math.sin(a)];
    const [x1,y1]=p(R,ang+gap),[x2,y2]=p(R,a2-gap),[x3,y3]=p(r,a2-gap),[x4,y4]=p(r,ang+gap);
    const grande=(a2-ang)>Math.PI?1:0;
    const path=s('path',{d:`M${x1},${y1}A${R},${R} 0 ${grande} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${grande} 0 ${x4},${y4}Z`,
      fill:f.cor,opacity:.92});
    comDica(path,`<b>${f.nome}</b><br>${nb(f.valor,1)}%`);
    g.append(path); ang=a2;
  });
  if(centro){
    stx(g,{x:tam/2,y:tam/2-1,'text-anchor':'middle',
      style:'font-family:var(--dado);font-size:19px;font-weight:600;fill:var(--ink)'},centro.val);
    stx(g,{x:tam/2,y:tam/2+14,'text-anchor':'middle',
      style:'font-family:var(--dado);font-size:9px;letter-spacing:.1em;fill:var(--ink-3)'},centro.rot);
  }
  return g;
}

/* velocímetro: |Δ| em unidades do piso de ruído */
function grafVelocimetro(v){
  const d=serie(v)[0], razao=Math.abs(d?0:0);
  const S=D.resultado.find(r=>r.dominio==='série'&&r.variavel===v);
  const val=S?S.efeito:0, tam=132, cx=tam/2, cy=tam/2+12, R=52;
  const g=s('svg',{viewBox:`0 0 ${tam} ${tam*0.78}`,width:'100%',class:'g',style:'max-width:300px;margin:6px auto 0'});
  const a0=Math.PI*0.92, a1=Math.PI*0.08, mx=6;
  const ang=x=>a0+(Math.min(x,mx)/mx)*(a1-a0);
  const arco=(de,ate,cor,w)=>{
    const p1=[cx+R*Math.cos(de),cy-R*Math.sin(de)], p2=[cx+R*Math.cos(ate),cy-R*Math.sin(ate)];
    return s('path',{d:`M${p1[0]},${p1[1]}A${R},${R} 0 ${Math.abs(ate-de)>Math.PI?1:0} 1 ${p2[0]},${p2[1]}`,
      fill:'none',stroke:cor,'stroke-width':w,'stroke-linecap':'round'});
  };
  g.append(arco(a0,a1,'#E4EAE7',10));
  g.append(arco(a0,ang(1),'#D8E0DC',10));
  g.append(arco(ang(1),ang(val),val>1?(CV[v]||'#0F6E5C'):'#B3341A',10));
  const a=ang(val);
  g.append(s('line',{x1:cx,y1:cy,x2:cx+(R-14)*Math.cos(a),y2:cy-(R-14)*Math.sin(a),
    stroke:'#14201E','stroke-width':2.4,'stroke-linecap':'round'}));
  g.append(s('circle',{cx,cy,r:4,fill:'#14201E'}));
  const t1=ang(1);
  g.append(s('line',{x1:cx+(R-9)*Math.cos(t1),y1:cy-(R-9)*Math.sin(t1),
    x2:cx+(R+9)*Math.cos(t1),y2:cy-(R+9)*Math.sin(t1),stroke:'#B3341A','stroke-width':1.6}));
  stx(g,{x:cx,y:cy+22,'text-anchor':'middle',
    style:'font-family:var(--dado);font-size:20px;font-weight:600;fill:var(--ink)'},nb(val,1)+'×');
  stx(g,{x:cx,y:cy+34,'text-anchor':'middle',
    style:'font-family:var(--dado);font-size:8.5px;letter-spacing:.1em;fill:var(--ink-3)'},'DO PISO');
  return g;
}

/* mapa de calor das derivadas */
function grafDerivadas(){
  const M={t:26,r:8,b:8,l:78}, cw=64, ch=27, W=M.l+6*cw+M.r, H=M.t+6*ch+M.b;
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  const mx=2.4;
  const cor=x=>{const t=Math.max(-1,Math.min(1,x/mx));
    return t>=0 ? `rgb(${Math.round(251-131*t)},${Math.round(252-184*t)},${Math.round(251-237*t)})`
                : `rgb(${Math.round(251+(33-251)*-t)},${Math.round(252+(102-252)*-t)},${Math.round(251+(172-251)*-t)})`;};
  for(let t=1;t<=6;t++) stx(g,{x:M.l+(t-1)*cw+cw/2,y:M.t-9,'text-anchor':'middle',
    class:'eixo',fill:CEST[dia(t+1).tipo_estimulo],style:'font-weight:600'},`D${t}→${t+1}`);
  SUB.forEach((v,i)=>{
    const pts=serie(v), piso=pts[0].piso_ruido;
    stx(g,{x:M.l-8,y:M.t+i*ch+ch/2+3.6,'text-anchor':'end',class:'eixo',fill:CV[v],
      style:'font-weight:600'},v);
    for(let t=1;t<=6;t++){
      const d1=pts[t].derivada1/piso;
      const x=M.l+(t-1)*cw, y=M.t+i*ch;
      const forte=Math.abs(d1)>1;
      const c=s('rect',{x:x+1,y:y+1,width:cw-2,height:ch-2,rx:3,fill:cor(d1),
        stroke:forte?'#14201E':'transparent','stroke-width':forte?1.6:0});
      comDica(c,`<b>${v} · D${t}→D${t+1}</b><br>1.ª derivada ${nb(pts[t].derivada1,3)}<br>`+
        `em unidades do piso: ${nb(d1,2)}<br>${forte?'excede o piso — choque':'dentro do ruído'}`);
      g.append(c);
      stx(g,{x:x+cw/2,y:y+ch/2+3.4,'text-anchor':'middle',class:'eixo',
        fill:Math.abs(d1)>1.5?'#FBFCFB':'#14201E',style:forte?'font-weight:600':''},nb(d1,2));
    }
  });
  return g;
}

/* ============================ instrumento ao vivo ============================ */
function instrumento(){
  const box=el('div',{class:'instr'});
  const cv=el('canvas',{class:'chuva'});
  const cont=el('div',{class:'conteudo'});
  box.append(cv,cont);
  cont.append(el('h3',{txt:'Leitura do microciclo, dia a dia'}),
    el('p',{class:'leg',txt:'Reprodução cronológica das séries medidas — não é transmissão ao vivo: '+
      'o painel percorre os sete dias já coletados, um por segundo.'}));
  const tela=el('div'); cont.append(tela);
  const ctrl=el('div',{class:'ctrl'});
  const bt=el('button',{txt:'▶  Reproduzir'});
  const marc=el('span',{class:'marcador'});
  const range=el('input',{type:'range',min:1,max:7,step:1,value:7,'aria-label':'dia do microciclo'});
  ctrl.append(bt,range,marc); cont.append(ctrl);

  let d=7, tocando=false, timer=null;
  function pinta(){
    tela.innerHTML='';
    const p=D.painel.find(x=>x.dia===d), dd=dia(d);
    const linha=el('div',{style:'display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:center'});
    const esq=el('div');
    esq.append(el('div',{style:`font-family:var(--dado);font-size:10px;letter-spacing:.14em;color:${CEST[dd.tipo_estimulo]};text-transform:uppercase`,
      txt:dd.tipo_estimulo}));
    esq.append(el('div',{style:'font-size:28px;font-weight:700;letter-spacing:-.6px;margin:2px 0 4px',
      txt:`Dia ${d}`}));
    esq.append(el('div',{style:'font-family:var(--dado);font-size:11px;color:#7E9A96;line-height:1.7',
      html:`${dd.data.split('-').reverse().join('/')} · ${dd.n_atletas} atletas · ${dd.n_registros} registros<br>`+
           `janela ${dd.janela} · carga acumulada ${nb(dd.carga_acumulada,1)} h`}));
    const dir=el('div',{style:'display:grid;grid-template-columns:repeat(3,1fr);gap:10px'});
    [['Vigor',p.vigor,'#E08A5E'],['Fadiga',p.fadiga,'#B79BE0'],['Risco',p.pct_risco+'%','#E07A5F']]
      .forEach(([r,v,c])=>{
        dir.append(el('div',{},
          el('div',{style:'font-family:var(--dado);font-size:9px;letter-spacing:.12em;color:#7E9A96;text-transform:uppercase',txt:r}),
          el('div',{style:`font-family:var(--dado);font-size:21px;font-weight:600;color:${c};font-variant-numeric:tabular-nums`,
            txt:typeof v==='number'?nb(v,2):v})));
      });
    linha.append(esq,dir); tela.append(linha);
    /* sparkline do PTH até o dia corrente */
    const W=520,H=54, pts=D.painel.filter(x=>x.dia<=d);
    const todos=D.painel.map(x=>x.pth), lo=Math.min(...todos)-1, hi=Math.max(...todos)+1;
    const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'margin-top:12px'});
    for(let k=1;k<=7;k++){
      const x=8+(k-1)/6*(W-16);
      g.append(s('line',{x1:x,x2:x,y1:4,y2:H-4,stroke:'#24383B','stroke-width':1}));
    }
    const px=k=>8+(k-1)/6*(W-16), py=v=>6+(1-(v-lo)/(hi-lo))*(H-12);
    g.append(s('polyline',{points:pts.map(x=>`${px(x.dia)},${py(x.pth)}`).join(' '),
      fill:'none',stroke:'#5FD3AC','stroke-width':2.2,'stroke-linejoin':'round'}));
    const u=pts[pts.length-1];
    g.append(s('circle',{cx:px(u.dia),cy:py(u.pth),r:4.5,fill:'#5FD3AC',stroke:'#0D1719','stroke-width':2}));
    stx(g,{x:px(u.dia)+(d>5?-8:8),y:py(u.pth)-9,'text-anchor':d>5?'end':'start',
      style:'font-family:var(--dado);font-size:10px;fill:#9FE7CE'},'PTH '+nb(u.pth,1));
    tela.append(g);
    marc.textContent=`D${d} / 7`;
    range.value=d;
  }
  bt.addEventListener('click',()=>{
    tocando=!tocando; bt.textContent=tocando?'❚❚  Pausar':'▶  Reproduzir';
    if(tocando){ if(d>=7) d=0;
      timer=setInterval(()=>{ d++; if(d>7){d=7;clearInterval(timer);tocando=false;bt.textContent='▶  Reproduzir';}
        pinta(); },1000); }
    else clearInterval(timer);
  });
  range.addEventListener('input',()=>{ clearInterval(timer); tocando=false; bt.textContent='▶  Reproduzir';
    d=+range.value; pinta(); });
  pinta();
  requestAnimationFrame(()=>chuva(cv));
  return box;
}

/* condensação sobre o vidro do instrumento */
function chuva(cv){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=cv.getContext('2d'); let W,H,gotas=[],raf;
  function medir(){ const r=cv.getBoundingClientRect();
    W=cv.width=Math.max(1,r.width*devicePixelRatio); H=cv.height=Math.max(1,r.height*devicePixelRatio);
    gotas=Array.from({length:Math.round(r.width*r.height/2600)},()=>nova(true)); }
  const nova=(disperso)=>({x:Math.random()*W, y:disperso?Math.random()*H:-10*devicePixelRatio,
    r:(0.6+Math.random()*2.1)*devicePixelRatio, v:(0.06+Math.random()*0.5)*devicePixelRatio,
    a:0.10+Math.random()*0.30});
  function passo(){
    ctx.clearRect(0,0,W,H);
    for(const g of gotas){
      g.y+=g.v; if(g.y>H+8){ Object.assign(g,nova(false)); }
      const gr=ctx.createRadialGradient(g.x-g.r*.32,g.y-g.r*.32,g.r*.12,g.x,g.y,g.r);
      gr.addColorStop(0,`rgba(190,235,224,${g.a*0.85})`);
      gr.addColorStop(1,`rgba(120,180,172,${g.a*0.12})`);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,6.2832); ctx.fill();
      if(g.r>1.6*devicePixelRatio){ ctx.fillStyle=`rgba(230,250,244,${g.a*0.5})`;
        ctx.beginPath(); ctx.arc(g.x-g.r*.34,g.y-g.r*.36,g.r*.22,0,6.2832); ctx.fill(); }
    }
    raf=requestAnimationFrame(passo);
  }
  medir(); passo();
  const ro=new ResizeObserver(medir); ro.observe(cv);
}

  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  const lx=p=>M.l+(Math.log10(Math.max(p,2e-5))-Math.log10(2e-5))/(0-Math.log10(2e-5))*(W-M.l-M.r);
  const py=i=>M.t+i*((H-M.t-M.b)/7)+((H-M.t-M.b)/7)/2;
  g.append(s('rect',{x:M.l,y:M.t,width:lx(.05)-M.l,height:H-M.t-M.b,fill:'#E9F5F0'}));
  g.append(s('line',{x1:lx(.05),x2:lx(.05),y1:M.t,y2:H-M.b,stroke:'#1A7F5A','stroke-width':1.6,'stroke-dasharray':'5 4'}));
  [1e-4,1e-3,1e-2,1e-1,1].forEach(t=>{
    g.append(s('line',{x1:lx(t),x2:lx(t),y1:M.t,y2:H-M.b,class:'grid'}));
    stx(g,{x:lx(t),y:H-M.b+15,'text-anchor':'middle',class:'eixo'},t===1?'1':'10⁻'+Math.abs(Math.log10(t)));
  });
  const VIAS=[['Friedman','#2166AC',v=>res({dominio:'tendência',via:'não paramétrica',variavel:v,recorte:'D1..D7'})[0]],
              ['ANOVA-MR com GG','#E0952B',v=>res({dominio:'tendência',via:'paramétrica',variavel:v})[0]],
              ['Modelo misto','#1A9070',v=>res({dominio:'tendência',via:'modelo misto',variavel:v})[0]]];
  V7.forEach((v,i)=>{
    const ps=VIAS.map(([,,f])=>f(v)).filter(Boolean);
    stx(g,{x:M.l-10,y:py(i)+4,'text-anchor':'end',class:'eixo',fill:CV[v],style:'font-weight:600;font-size:11px'},rot(v));
    const xs=ps.map(r=>lx(r.p));
    g.append(s('line',{x1:Math.min(...xs),x2:Math.max(...xs),y1:py(i),y2:py(i),stroke:'#C3CFCA','stroke-width':2.2}));
    const disc=new Set(ps.map(r=>r.p<.05)).size>1;
    if(disc){
      g.append(s('rect',{x:W-M.r+8,y:py(i)-8,width:96,height:16,rx:4,fill:'#B3341A',opacity:.12}));
      stx(g,{x:W-M.r+56,y:py(i)+4,'text-anchor':'middle',class:'eixo',fill:'#B3341A',
        style:'font-weight:600'},'discordam');
    }
    ps.forEach((r,j)=>{
      const cc=s('circle',{cx:lx(r.p),cy:py(i)+(j-1)*6,r:6,fill:VIAS[j][1],stroke:'#FBFCFB','stroke-width':1.8});
      comDica(cc,`<b>${rot(v)} · ${VIAS[j][0]}</b><br>${r.teste}<br>${r.rotulo_estatistica} = ${nb(r.estatistica,3)}<br>${pb(r.p)}<br>n = ${r.n}`);
      g.append(cc);
    });
  });
  c.append(g);
  const lg=el('div',{class:'legenda'});
  VIAS.forEach(([n,cor],i)=>lg.append(el('span',{},el('i',{style:`background:${cor}`}),
    n+(i===2?'  ·  n = 166':'  ·  n = 19'))));
  c.append(lg);
  return c;
}

      el('div',{style:'font-size:11px;line-height:1.5;color:var(--ink-3);font-style:italic',txt:u.vies}));
    gU.append(c);
  });
  c1.append(gU);
  /* haltere: iceberg D1 → D7 por unidade */
  const D17={'U-R':[35.4,21.7],'U-286':[22.2,21.6],'U-AD':[37.0,19.0],'U-PAR':[28.6,19.0]};
  const W=660,H=170,M={t:16,r:110,b:32,l:74};
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  const px=v=>M.l+(v-16)/(48-16)*(W-M.l-M.r), py=i=>M.t+i*((H-M.t-M.b)/4)+((H-M.t-M.b)/4)/2;
  [20,25,30,35,40,45].forEach(v=>{g.append(s('line',{x1:px(v),x2:px(v),y1:M.t,y2:H-M.b,class:'grid'}));
    stx(g,{x:px(v),y:H-M.b+15,'text-anchor':'middle',class:'eixo'},v+'%');});
  Object.entries(D17).forEach(([u,[d1,d7]],i)=>{
    const cor=CU[u];
    stx(g,{x:M.l-10,y:py(i)+4,'text-anchor':'end',class:'eixo',fill:cor,style:'font-weight:600;font-size:11.5px'},u);

    const a=s('circle',{cx:px(d1),cy:py(i),r:7,fill:'#FBFCFB',stroke:cor,'stroke-width':2.6});
    comDica(a,`<b>${u} · dia 1</b><br>iceberg em ${nb(d1,1)}%`);
    const b=s('circle',{cx:px(d7),cy:py(i),r:7,fill:cor});
    comDica(b,`<b>${u} · dia 7</b><br>iceberg em ${nb(d7,1)}%`);
    g.append(a,b);
    stx(g,{x:W-M.r+10,y:py(i)+4,class:'eixo',fill:cor,style:'font-weight:600;font-size:12px'},nb(d7-d1,1)+' p.p.');
  });
  c1.append(el('div',{style:'font-family:var(--dado);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px',
    txt:'Variação do perfil iceberg entre o dia 1 e o dia 7'}));
  c1.append(g);
  c1.append(el('div',{class:'legenda'},
    el('span',{},el('i',{style:'background:transparent;border:2px solid #87968F;border-radius:99px'}),'círculo vazado = dia 1'),
    el('span',{},el('i',{style:'background:#87968F;border-radius:99px'}),'círculo cheio = dia 7')));
  f.append(c1);

  const c2=el('div',{class:'cartao'});
  c2.append(el('h3',{txt:`Os ${D.auditoria.length} achados e o que foi feito com cada um`}),
    el('p',{class:'leg',txt:'D1 a D6 vêm da auditoria de procedência, que pergunta de onde vem cada número. Q1 a Q6 vêm da auditoria de qualidade, que pergunta se o número está certo. A tela de qualidade abre cada um deles.'}));
  const GRAV={'crítica':'cr','alta':'cr','média':'at','baixa':'neu','nenhuma':'bom','método':'neu'};
  const wrap=el('div',{style:'margin-top:10px'});
  D.auditoria.forEach(a=>{
    const d=el('details');
    d.append(el('summary',{},el('span',{class:'tag',style:'font-family:var(--dado)',txt:a.id}),
      el('span',{class:'pill '+GRAV[a.gravidade],txt:a.gravidade}),
      el('span',{txt:a.titulo})));
    d.append(el('div',{class:'corpo'},
      el('div',{style:'font-family:var(--dado);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--critico);margin-bottom:3px',txt:'achado'}),
      el('p',{style:'margin:0 0 10px',txt:a.achado}),
      el('div',{style:'font-family:var(--dado);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--bom);margin-bottom:3px',txt:'correção'}),
      el('p',{style:'margin:0 0 10px',txt:a.correcao}),
      el('div',{style:'font-family:var(--dado);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px',txt:'impacto'}),
      el('p',{style:'margin:0',txt:a.impacto})));

   ['Pares atleta-dia',cont.atleta_dia,'#E0952B'],['Pares pré/pós',119,'#C1440E'],
   ['Resultados',cont.resultado,'#8A4FBF'],['Abas no acervo',cont.aba,'#A31E52'],
   ['Células',cont.celula.toLocaleString('pt-BR'),'#87968F'],['Referências',cont.referencia,'#0F6E5C']]
  .forEach(([r,v,c])=>k.append(el('div',{class:'kpi',style:`--k:${c}`},
    el('div',{class:'rot',txt:r}),el('div',{class:'val',txt:String(v)}))));
  f.append(k);

  const c=el('div',{class:'cartao'});
  c.append(el('h3',{txt:'Explorador de resultados'}),
    el('p',{class:'leg',txt:'Os 305 testes do estudo em formato longo. Filtre, ordene pelas colunas, busque por texto.'}));
  const fl=el('div',{class:'filtros'});
  const busca=el('input',{type:'search',placeholder:'buscar variável, teste, recorte…','aria-label':'buscar'});
  const selD=el('select',{'aria-label':'domínio'}); const selV=el('select',{'aria-label':'via'});
  selD.append(el('option',{value:'',txt:'todos os domínios'}));
  [...new Set(D.resultado.map(r=>r.dominio))].sort().forEach(x=>selD.append(el('option',{value:x,txt:x})));
  selV.append(el('option',{value:'',txt:'todas as vias'}));
  [...new Set(D.resultado.map(r=>r.via))].sort().forEach(x=>selV.append(el('option',{value:x,txt:x})));
  const soSig=el('button',{class:'chip','aria-pressed':'false',txt:'só significativos'});
  fl.append(busca,selD,selV,soSig);
  const cnt=el('span',{style:'font-family:var(--dado);font-size:11px;color:var(--ink-3);margin-left:auto'});
  fl.append(cnt);
  c.append(fl);
  const tab=el('div',{class:'tabwrap',style:'max-height:calc(100dvh - 430px)'});
  c.append(tab);
  let ordem={col:'dominio',asc:true};
  const COLS=[['variavel','Variável'],['recorte','Recorte'],['via','Via'],['teste','Teste'],
    ['estatistica','Estatística'],['p','p'],['p_ajustado','p ajustado'],['efeito','Efeito'],['n','n']];
  function desenha(){
    const q=busca.value.trim().toLowerCase();
    let rs=D.resultado.filter(r=>
      (!selD.value||r.dominio===selD.value)&&(!selV.value||r.via===selV.value)&&
      (soSig.getAttribute('aria-pressed')!=='true'||r.significativo)&&
      (!q||[r.variavel,r.teste,r.recorte,r.dominio,r.via].join(' ').toLowerCase().includes(q)));
    rs.sort((a,b)=>{const x=a[ordem.col],y=b[ordem.col];
      const v=(x==null?1:y==null?-1:typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt'));
      return ordem.asc?v:-v;});
    cnt.textContent=rs.length+' de '+D.resultado.length;
    tab.innerHTML='';
    const t=el('table');
    t.append(el('thead',{},el('tr',{},...COLS.map(([k2,r2])=>el('th',{txt:r2+(ordem.col===k2?(ordem.asc?' ↑':' ↓'):''),
      onclick:()=>{ordem=(ordem.col===k2)?{col:k2,asc:!ordem.asc}:{col:k2,asc:true};desenha();}})))));
    const tb=el('tbody');
    rs.slice(0,400).forEach(r=>tb.append(el('tr',{},
      el('td',{style:`font-weight:600;color:${CV[r.variavel]||'var(--ink)'}`,txt:rot(r.variavel||'—')}),
      el('td',{style:'white-space:normal;max-width:190px',txt:r.recorte||'—'}),
      el('td',{},el('span',{class:'tag',txt:r.via})),
      el('td',{style:'white-space:normal;max-width:220px',txt:r.teste}),
      el('td',{class:'num',txt:(r.rotulo_estatistica?r.rotulo_estatistica+' = ':'')+nb(r.estatistica,3)}),
      el('td',{class:'num'},r.p==null?'—':el('span',{class:'pill '+(r.p<.05?'bom':'neu'),
        txt:r.p<0.001?'<0,001':nb(r.p,3)})),
      el('td',{class:'num',txt:r.p_ajustado==null?'—':nb(r.p_ajustado,3)}),
      el('td',{class:'num',txt:r.efeito==null?'—':(r.rotulo_efeito?r.rotulo_efeito+' = ':'')+nb(r.efeito,3)}),
      el('td',{class:'num',txt:r.n??'—'}))));
    t.append(tb); tab.append(t);
  }
  [busca,selD,selV].forEach(x=>x.addEventListener('input',desenha));
  soSig.addEventListener('click',()=>{soSig.setAttribute('aria-pressed',
    soSig.getAttribute('aria-pressed')==='true'?'false':'true');desenha();});
  desenha();
  f.append(c);
  return f;
};

TELAS.refs=()=>{

  c.append(el('h3',{txt:'Referências dos dois artigos'}),
    el('p',{class:'leg',html:`${D.referencia.length} referências · <b>${comDoi}</b> com DOI verificado contra o registro do periódico. `+
      `As cinco sem ligação são anteriores ao DOI ou não foram localizadas — e aparecem assim, em vez de receberem um identificador inventado.`}));
  const fl=el('div',{class:'filtros'});
  const busca=el('input',{type:'search',placeholder:'buscar autor, título, periódico…','aria-label':'buscar referência'});
  const soDoi=el('button',{class:'chip','aria-pressed':'false',txt:'só com DOI'});
  const cnt=el('span',{style:'font-family:var(--dado);font-size:11px;color:var(--ink-3);margin-left:auto'});
  fl.append(busca,soDoi,cnt); c.append(fl);
  const lista=el('div',{style:'max-height:calc(100dvh - 320px);overflow:auto;padding-right:6px'});
  function desenha(){
    const q=busca.value.trim().toLowerCase();
    const rs=D.referencia.filter(r=>(!q||(r.abnt||'').toLowerCase().includes(q))&&
      (soDoi.getAttribute('aria-pressed')!=='true'||r.doi));
    cnt.textContent=rs.length+' de '+D.referencia.length;
    lista.innerHTML='';
    rs.forEach(r=>{
      const lk=el('div',{class:'lk'});
      if(r.url_doi){
        lk.append(el('a',{class:'mini',href:r.url_doi,target:'_blank',rel:'noopener',txt:'DOI'}));
        lk.append(el('a',{class:'mini',href:'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(r.doi),
          target:'_blank',rel:'noopener',txt:'PubMed'}));
        lk.append(el('a',{class:'mini',href:'https://scholar.google.com/scholar?q='+encodeURIComponent(r.titulo||''),
          target:'_blank',rel:'noopener',txt:'Scholar'}));
        lk.append(el('a',{class:'mini',href:'https://openalex.org/works?filter=doi:'+encodeURIComponent(r.doi),
          target:'_blank',rel:'noopener',txt:'OpenAlex'}));
      } else {
        lk.append(el('span',{class:'mini',style:'opacity:.5',txt:'sem DOI'}));
        lk.append(el('a',{class:'mini',href:'https://scholar.google.com/scholar?q='+encodeURIComponent(r.titulo||''),
          target:'_blank',rel:'noopener',txt:'Scholar'}));
      }
      lista.append(el('div',{class:'ref'},
        el('span',{class:'n',txt:String(r.id).padStart(2,'0')}),
        el('span',{class:'txt',style:'flex:1',txt:r.abnt}), lk));
    });
  }
  busca.addEventListener('input',desenha);
  soDoi.addEventListener('click',()=>{soDoi.setAttribute('aria-pressed',
    soDoi.getAttribute('aria-pressed')==='true'?'false':'true');desenha();});
  desenha(); c.append(lista); f.append(c);
  return f;
};

/* ---- barra horizontal de AUC com intervalo de confiança ---- */
function grafAUC(itens,{larg=560,ref=null,rotRef=''}={}){
  const M={t:16,r:60,b:26,l:186}, hl=30, H=M.t+M.b+itens.length*hl, W=larg;
  const lo=0.40, hi=1.0, px=v=>M.l+(v-lo)/(hi-lo)*(W-M.l-M.r);
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  [0.5,0.6,0.7,0.8,0.9,1.0].forEach(v=>{
    g.append(s('line',{x1:px(v),x2:px(v),y1:M.t-6,y2:H-M.b,stroke:'#E4E9E7','stroke-width':1}));
    stx(g,{x:px(v),y:H-M.b+15,'text-anchor':'middle',class:'eixo'},nb(v,1));
  });
  if(ref!=null){
    g.append(s('line',{x1:px(ref),x2:px(ref),y1:M.t-8,y2:H-M.b,stroke:'#B3341A','stroke-width':1.6,'stroke-dasharray':'4 3'}));
    stx(g,{x:px(ref),y:M.t-12,'text-anchor':'middle',class:'eixo',fill:'#B3341A'},rotRef);
  }
  itens.forEach((it,i)=>{
    const y=M.t+i*hl+hl/2, c=it.cor||'#2166AC';
    stx(g,{x:M.l-10,y:y+4,'text-anchor':'end',style:`font-family:var(--disp);font-size:12px;fill:${it.base?'#87968F':'#25332F'};font-weight:${it.base?400:600}`},it.nome);
    if(it.ic) g.append(s('line',{x1:px(it.ic[0]),x2:px(it.ic[1]),y1:y,y2:y,stroke:c,'stroke-width':2,opacity:.42,'stroke-linecap':'round'}));
    const r=s('circle',{cx:px(it.valor),cy:y,r:6,fill:c,stroke:'#FBFCFB','stroke-width':2});
    comDica(r,`<b>${it.nome}</b><br>AUC ${nb(it.valor,3)}${it.ic?`<br>IC 95% [${nb(it.ic[0],3)}, ${nb(it.ic[1],3)}]`:''}`);
    g.append(r);
    stx(g,{x:W-M.r+8,y:y+4,style:'font-family:var(--dado);font-size:11.5px;font-variant-numeric:tabular-nums',fill:c},nb(it.valor,3));
  });
  return g;
}

/* ---- a árvore desenhada ---- */
function grafArvore(){
  const W=880, H=330, g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g',style:'max-width:880px'});
  const nos=ML2.ARVORE;
  const porProf={}; nos.forEach(n=>{(porProf[n.prof]=porProf[n.prof]||[]).push(n);});
  const maxP=Math.max(...nos.map(n=>n.prof));
  const pos=new Map();
  Object.keys(porProf).forEach(p=>{
    const fila=porProf[p], y=28+ (+p)*((H-70)/maxP);
    fila.forEach((n,i)=>pos.set(n,{x:(W/(fila.length+1))*(i+1), y}));
  });
  /* ligações: um nó filho compartilha o caminho do pai mais o próprio corte */
  nos.forEach(n=>{
    if(!n.caminho.length) return;
    const pai=nos.find(m=>m.caminho.length===n.caminho.length-1 &&
      m.caminho.every((c,i)=>c===n.caminho[i]));
    if(!pai) return;
    const a=pos.get(pai), b=pos.get(n);
    g.append(s('path',{d:`M${a.x},${a.y+16} C${a.x},${(a.y+b.y)/2} ${b.x},${(a.y+b.y)/2} ${b.x},${b.y-18}`,
      fill:'none',stroke:'#CDD6D2','stroke-width':1.6}));
    const corte=n.caminho[n.caminho.length-1];
    const lado=corte.includes('≤')?'sim':'não';
    stx(g,{x:(a.x+b.x)/2+(b.x<a.x?-14:14),y:(a.y+b.y)/2+3,'text-anchor':'middle',class:'eixo'},lado);
  });
  nos.forEach(n=>{
    const p=pos.get(n), risco=n.p, c=risco>=.66?'#B3341A':risco<=.20?'#1A7F5A':'#E0952B';
    if(n.tipo==='no'){
      const w=Math.max(126,n.var.length*6.4+16);
      g.append(s('rect',{x:p.x-w/2,y:p.y-18,width:w,height:36,rx:8,fill:'#FFFFFF',stroke:'#CDD6D2','stroke-width':1.4}));
      stx(g,{x:p.x,y:p.y-2,'text-anchor':'middle',style:'font-size:11.5px;font-weight:600;fill:#25332F'},n.var);
      stx(g,{x:p.x,y:p.y+11,'text-anchor':'middle',class:'eixo'},'corte em '+nb(n.limiar,1));
    }else{
      const w=104;
      const r=s('rect',{x:p.x-w/2,y:p.y-19,width:w,height:38,rx:8,fill:c,opacity:.13,stroke:c,'stroke-width':1.6});
      comDica(r,`<b>Folha</b><br>${n.n} pares atleta-dia<br>risco previsto ${(risco*100).toFixed(0)}%<br><i>${n.caminho.join(' e ')}</i>`);
      g.append(r);
      stx(g,{x:p.x,y:p.y-1,'text-anchor':'middle',style:`font-family:var(--dado);font-size:15px;font-weight:600;fill:${c}`},(risco*100).toFixed(0)+'%');
      stx(g,{x:p.x,y:p.y+13,'text-anchor':'middle',class:'eixo'},'n = '+n.n);
    }
  });
  return g;
}

/* ---- organograma das seis fases ---- */
function fluxoCrisp(){

  c3.append(grafAUC(Object.entries(sg).map(([k,v],i)=>({nome:k, valor:v.auc, ic:v.ic, cor:CAT[i]})),

    el('p',{html:'A leitura prática é esta: a medida da manhã não acrescenta nada sobre quem já amanhece mal — a comissão técnica já sabe. '+
      'Ela acrescenta sobre <strong>quem amanhece bem e ainda assim vai terminar o dia em risco</strong>, e o marcador que separa esses dois grupos '+
      'não é a fadiga nem o vigor: é a ausência completa de tensão matinal, que converge com o achado dos dois artigos de que a tensão, '+
      'neste elenco, se comporta como ativação e não como sofrimento.'})));
  g3.append(c3); f.append(g3);

};

            'crítica':'#8B1A1A','método':'#8A4FBF'};

/* ---- caixa e bigodes de uma variável, a partir dos quantis já calculados ---- */
function grafCaixa(u,{larg=520,alt=132,cor='#2166AC'}={}){
  const M={t:16,r:24,b:34,l:24}, W=larg, H=alt;
  const lo=Math.min(u.minimo,u.tukey_moderado[0]), hi=Math.max(u.maximo,u.tukey_moderado[1]);
  const px=v=>M.l+(v-lo)/(hi-lo||1)*(W-M.l-M.r), y=M.t+26, h=34;
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  const cerca=s('rect',{x:px(u.tukey_moderado[0]),y:y-8,width:Math.max(px(u.tukey_moderado[1])-px(u.tukey_moderado[0]),1),
    height:h+16,fill:'#B3341A',opacity:.05});
  g.append(cerca);
  g.append(s('line',{x1:px(u.minimo),x2:px(u.maximo),y1:y+h/2,y2:y+h/2,stroke:'#87968F','stroke-width':1.4}));
  [u.minimo,u.maximo].forEach(v=>g.append(s('line',{x1:px(v),x2:px(v),y1:y+6,y2:y+h-6,stroke:'#87968F','stroke-width':1.4})));
  const cx0=px(u.q1), cw=Math.max(px(u.q3)-px(u.q1),2);
  const bx=s('rect',{x:cx0,y,width:cw,height:h,rx:4,fill:cor,opacity:.82});
  comDica(bx,`<b>${rot(u.variavel)}</b><br>Q1 ${nb(u.q1)} · Md ${nb(u.mediana)} · Q3 ${nb(u.q3)}<br>`+
    `IQR ${nb(u.iqr)}${u.iqr_nulo?' — nulo':''}<br>cerca de Tukey [${nb(u.tukey_moderado[0])}, ${nb(u.tukey_moderado[1])}]`);
  g.append(bx);
  g.append(s('line',{x1:px(u.mediana),x2:px(u.mediana),y1:y,y2:y+h,stroke:'#FBFCFB','stroke-width':2.4}));
  g.append(s('circle',{cx:px(u.media),cy:y+h/2,r:4,fill:'#FBFCFB',stroke:cor,'stroke-width':2}));
  // âncoras que caem no mesmo ponto (piso da escala) são fundidas, para não colidirem
  const anc=[];
  [['mín',u.minimo],['Q1',u.q1],['Md',u.mediana],['Q3',u.q3],['máx',u.maximo]].forEach(([r,v])=>{
    const perto=anc.find(a=>Math.abs(px(a.v)-px(v))<16);
    if(perto) perto.rot.push(r); else anc.push({v, rot:[r]});
  });
  anc.forEach(a=>{
    stx(g,{x:px(a.v),y:H-12,'text-anchor':'middle',class:'eixo'},nb(a.v,1));
    stx(g,{x:px(a.v),y:M.t-2,'text-anchor':'middle',class:'eixo'},a.rot.join(' = '));
  });
  return g;
}

/* ---- fronteira eficiente: carga da semana contra o pior dia de vigor ---- */
function grafFronteira({larg=540,alt=250}={}){
  const FR=OT.FRONTEIRA.filter(x=>x.viavel!==false);
  const INV=OT.FRONTEIRA.filter(x=>x.viavel===false);
  const M={t:16,r:22,b:38,l:52}, W=larg, H=alt;
  const xs=OT.FRONTEIRA.map(f=>f.carga).concat([OT.OBSERVADO.total]);
  const ys=FR.map(f=>f.vigor_minimo).concat([OT.OBSERVADO.vigor_minimo]);
  const x0=Math.min(...xs)-1, x1=Math.max(...xs)+1;
  const pad=(Math.max(...ys)-Math.min(...ys))*0.22 || 0.02;
  const y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
  const px=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r), py=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',class:'g'});
  if(INV.length){
    const lim=OT.CARGA_MINIMA_ESTRUTURAL;
    g.append(s('rect',{x:M.l,y:M.t,width:Math.max(px(lim)-M.l,0),height:H-M.t-M.b,fill:'#B3341A',opacity:.05}));
    g.append(s('line',{x1:px(lim),x2:px(lim),y1:M.t,y2:H-M.b,stroke:'#B3341A','stroke-width':1.5,'stroke-dasharray':'4 3'}));
    stx(g,{x:px(lim)-6,y:M.t+13,'text-anchor':'end',class:'eixo',fill:'#B3341A'},'inviável');
    stx(g,{x:px(lim)-6,y:M.t+25,'text-anchor':'end',class:'eixo',fill:'#B3341A'},`abaixo de ${nb(lim)} h`);
  }
  for(let i=0;i<=4;i++){
    const v=y0+(y1-y0)*i/4;
    g.append(s('line',{x1:M.l,x2:W-M.r,y1:py(v),y2:py(v),stroke:'#E4E9E7','stroke-width':1}));
    stx(g,{x:M.l-8,y:py(v)+4,'text-anchor':'end',class:'eixo'},nb(v,3));
  }
  FR.forEach(f=>stx(g,{x:px(f.carga),y:H-M.b+16,'text-anchor':'middle',class:'eixo'},nb(f.carga,0)));
  stx(g,{x:(M.l+W-M.r)/2,y:H-6,'text-anchor':'middle',class:'eixo'},'carga da semana (horas)');
  g.append(s('path',{d:FR.map((f,i)=>`${i?'L':'M'}${px(f.carga)},${py(f.vigor_minimo)}`).join(''),
    fill:'none',stroke:'#0F6E5C','stroke-width':2.4,'stroke-linejoin':'round'}));
  FR.forEach(f=>{
    const c=s('circle',{cx:px(f.carga),cy:py(f.vigor_minimo),r:5.5,fill:'#0F6E5C',stroke:'#FBFCFB','stroke-width':2});
    comDica(c,`<b>${nb(f.carga,0)} h de carga semanal</b><br>pior dia de vigor ${nb(f.vigor_minimo,3)}`+
      `<br>fadiga máxima ${nb(f.fadiga_maxima)}<br>distribuição ${f.horas.map(v=>nb(v,1)).join(' · ')}`);
    g.append(c);
  });
  const ob=s('path',{d:`M${px(OT.OBSERVADO.total)},${py(OT.OBSERVADO.vigor_minimo)-6.5}`+
    `L${px(OT.OBSERVADO.total)+6.5},${py(OT.OBSERVADO.vigor_minimo)}`+
    `L${px(OT.OBSERVADO.total)},${py(OT.OBSERVADO.vigor_minimo)+6.5}`+
    `L${px(OT.OBSERVADO.total)-6.5},${py(OT.OBSERVADO.vigor_minimo)}Z`,
    fill:'#87968F',stroke:'#FBFCFB','stroke-width':2});
  comDica(ob,`<b>calendário observado</b><br>${nb(OT.OBSERVADO.total,1)} h · pior dia de vigor `+
    `${nb(OT.OBSERVADO.vigor_minimo,3)}`);
  g.append(ob);
  stx(g,{x:px(OT.OBSERVADO.total)+11,y:py(OT.OBSERVADO.vigor_minimo)+4,class:'eixo'},'observado');
  stx(g,{x:M.l-8,y:M.t-4,'text-anchor':'end',class:'eixo'},'vigor');
  return g;
}

let estadoTela='visao';
function render(id){
  estadoTela=id;
  document.querySelectorAll('#nav button').forEach(b=>
    b.setAttribute('aria-current',String(b.dataset.tela===id)));
  const [t,sub]=TITULOS[id];
  document.getElementById('tituloTela').textContent=t;
  document.getElementById('subTela').textContent=sub;
  segTopo.hidden=true; segTopo.innerHTML='';
  tela.innerHTML=''; tela.scrollTop=0;
  tela.append(TELAS[id]());
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tela]'); if(b) render(b.dataset.tela);
});
addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')) return;
  const ordem=['visao','mapa','a1','a2','modelos','auditoria','qualidade','base','refs','automacao'];
  const i=ordem.indexOf(estadoTela);
  if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); render(ordem[(i+1)%ordem.length]); }
  if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); render(ordem[(i-1+ordem.length)%ordem.length]); }
});
render('visao');
