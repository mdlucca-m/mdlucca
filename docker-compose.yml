# Subir o LAPE numa máquina própria ou num servidor da universidade:
#   docker compose up -d
# Depois crie o primeiro administrador (só na primeira vez):
#   docker compose exec lape python3 scripts/lape_agent.py usuarios \
#     --criar "Alexandro Andrade" andrade@udesc.br --perfil admin
services:
  lape:
    build: .
    container_name: lape
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LAPE_DB: /dados/db.sqlite
      LAPE_HOST: 0.0.0.0
      LAPE_PORT: "8000"
      # Deixe "1" apenas se o painel puder ser visto sem login.
      LAPE_PUBLIC_DASHBOARD: "0"
      # Marque o cookie como Secure quando houver HTTPS na frente (proxy).
      LAPE_BEHIND_HTTPS: "0"
      LAPE_CONTACT_EMAIL: ${LAPE_CONTACT_EMAIL:-}
      SCOPUS_API_KEY: ${SCOPUS_API_KEY:-}
      SCOPUS_INST_TOKEN: ${SCOPUS_INST_TOKEN:-}
      WOS_API_KEY: ${WOS_API_KEY:-}
      # Primeiro administrador, criado automaticamente na subida inicial.
      LAPE_ADMIN_LOGIN: ${LAPE_ADMIN_LOGIN:-}
      LAPE_ADMIN_PASSWORD: ${LAPE_ADMIN_PASSWORD:-}
      LAPE_ADMIN_NAME: ${LAPE_ADMIN_NAME:-Administracao LAPE}
      # Busca semantica (RAG). Sem chave nenhuma o sistema sobe igual,
      # so que a busca fica lexica; o 'rag status' avisa quando e o caso.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LAPE_EMBED_BACKEND: ${LAPE_EMBED_BACKEND:-auto}
      LAPE_VECTOR_STORE: ${LAPE_VECTOR_STORE:-sqlite}
      LAPE_PG_DSN: ${LAPE_PG_DSN:-}
      LAPE_CORPUS_DIRS: ${LAPE_CORPUS_DIRS:-/app/data/corpus}
    volumes:
      - lape-dados:/dados          # banco de dados (precisa persistir)
      # O contêiner roda como usuário sem privilégios: se der "permission
      # denied" ao ler as planilhas, rode  chmod -R a+rX data/raw
      - ./data/raw:/app/data/raw   # planilhas e XML do Lattes
      - ./data/corpus:/app/data/corpus  # pdf, docx e md a indexar
volumes:
  lape-dados:
