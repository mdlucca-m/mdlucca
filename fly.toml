# Publicação no Fly.io — gera um link https://lape-udesc.fly.dev
#
#   fly launch --no-deploy --copy-config
#   fly volumes create lape_dados --size 1 --region gru
#   fly secrets set LAPE_ADMIN_LOGIN=... LAPE_ADMIN_PASSWORD=... \
#                   SCOPUS_API_KEY=... WOS_API_KEY=...
#   fly deploy
app = "lape-udesc"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  LAPE_DB = "/dados/db.sqlite"
  LAPE_HOST = "0.0.0.0"
  LAPE_PORT = "8000"
  LAPE_BEHIND_HTTPS = "1"
  LAPE_PUBLIC_DASHBOARD = "0"

[[mounts]]
  source = "lape_dados"
  destination = "/dados"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
