<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
__THEME_CSS__

/* ==========================================================================
   Mural — a tela que fica ligada na sala
   Uma coisa por vez, grande o bastante para ler de pé, a três metros. A tela
   troca sozinha; quem passa não opera nada. Por isso não há rolagem: o que
   não cabe na tela não entra no slide, vai para o próximo.
   ========================================================================== */
html, body { height: 100%; overflow: hidden; }
body { background: var(--surface-sunken); }

/* Fundo em movimento lento. Fica atrás de tudo e nunca sob marca de dado —
   as áreas de plotagem têm superfície própria e opaca. */
.aurora { position: fixed; inset: -18%; z-index: 0; pointer-events: none; filter: blur(58px);
  opacity: .5; background:
    radial-gradient(38% 44% at 18% 22%, color-mix(in srgb, var(--series-1) 60%, transparent), transparent 68%),
    radial-gradient(34% 40% at 82% 30%, color-mix(in srgb, var(--series-7) 46%, transparent), transparent 66%),
    radial-gradient(40% 46% at 60% 88%, color-mix(in srgb, var(--series-3) 40%, transparent), transparent 68%);
  animation: deriva 46s ease-in-out infinite alternate; }
@keyframes deriva {
  0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
  50%  { transform: translate3d(3%, 2%, 0) scale(1.07); }
  100% { transform: translate3d(-1%, 3%, 0) scale(1.02); }
}

/* `minmax(0, 1fr)` na coluna: sem isso a grade se dimensiona pelo conteúdo
   mais largo — o cabeçalho — e a página inteira fica mais larga que a tela,
   levando o relógio e a borda direita dos quadros para fora do recorte. */
.mural { position: relative; z-index: 1; height: 100vh; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }

/* ------------------------------------------------------------------ topo */
.progresso { height: 3px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
.progresso i { display: block; height: 100%; width: 0; background: var(--grad-accent);
  box-shadow: 0 0 12px color-mix(in srgb, var(--accent-strong) 80%, transparent); }
.mtopo { display: flex; align-items: center; gap: 16px;
  padding: 14px clamp(18px, 2.4vw, 40px) 10px; }
/* Quem cede espaço é o nome do laboratório, nunca o título da tela: numa
   janela estreita o nome corta com reticências e o assunto continua inteiro. */
.mtopo .marca { display: flex; align-items: center; gap: 12px; min-width: 0;
  flex: 0 1 auto; max-width: 34%; }
.mtopo .marca > span { min-width: 0; }
.mtopo .marca b, .mtopo .marca small { display: block; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.mtopo .marca b { font-size: clamp(15px, 1.25vw, 19px); letter-spacing: -.02em; }
.mtopo .marca small { color: var(--ink-2); font-size: clamp(11px, .8vw, 13px); }
.mtopo .titulo { margin-left: 10px; display: flex; align-items: center; gap: 12px;
  min-width: 0; flex: 1 1 auto; }
.mtopo .titulo h1 { font-size: clamp(19px, 1.9vw, 30px); letter-spacing: -.026em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* nada no topo pode empurrar a linha para além da tela: sem rolagem, o que
   passa da borda some, e some justamente o relógio, que fica na ponta */
.mtopo { min-width: 0; }
.mtopo > * { min-width: 0; }
.mtopo .direita { margin-left: auto; display: flex; align-items: center; gap: 14px;
  flex: 0 1 auto; overflow: hidden; }
.relogio { font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.relogio b { display: block; font-size: clamp(20px, 1.9vw, 30px); letter-spacing: -.03em;
  line-height: 1.05; }
.relogio small { display: block; color: var(--ink-2); font-size: clamp(10.5px, .78vw, 12.5px);
  text-transform: capitalize; }
.selo { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
  font-size: clamp(11px, .82vw, 13px); font-weight: 650; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); white-space: nowrap; flex: none;
  max-width: 22vw; overflow: hidden; text-overflow: ellipsis; }
.relogio small { white-space: nowrap; }
.selo[hidden] { display: none; }   /* inline-flex venceria o [hidden] do HTML */
.selo.vivo { border-color: color-mix(in srgb, var(--good) 45%, transparent); color: var(--good);
  background: color-mix(in srgb, var(--good) 12%, transparent); }
.selo.vivo .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--good);
  animation: bater 2.2s ease-out infinite; }
@keyframes bater { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 65%, transparent); }
  70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.selo.piscou { animation: acende 1.1s ease-out 1; }
@keyframes acende { 0% { background: color-mix(in srgb, var(--good) 42%, transparent); }
  100% { background: color-mix(in srgb, var(--good) 12%, transparent); } }

/* --------------------------------------------------------------- palco */
.palco { position: relative; min-height: 0; padding: 4px clamp(18px, 2.4vw, 40px) 4px;
  display: grid; }
.slide { min-height: 0; display: flex; flex-direction: column; gap: clamp(10px, 1.2vh, 18px);
  animation: entra .58s cubic-bezier(.16, .84, .3, 1) both; }
/* a fila de KPIs tem a altura que tem; o resto ocupa o que sobra da tela,
   para o mural nunca terminar num vão branco embaixo */
.slide > .painel-duplo, .slide > .quadro { flex: 1; min-height: 0; }
@keyframes entra {
  from { opacity: 0; transform: translateY(22px) scale(.988); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}
.slide.saindo { animation: saiu .32s ease-in both; }
@keyframes saiu { to { opacity: 0; transform: translateY(-14px) scale(.99); filter: blur(5px); } }

/* cada filho direto entra um pouco depois do anterior */
.escalona > * { animation: sobe .5s cubic-bezier(.16, .84, .3, 1) both;
  animation-delay: calc(var(--i, 0) * 70ms + 90ms); }
@keyframes sobe { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.linha-kpi { display: grid; gap: clamp(8px, .9vw, 14px);
  grid-template-columns: repeat(auto-fit, minmax(clamp(150px, 13vw, 230px), 1fr)); }
.tile { position: relative; overflow: hidden; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--grad-card), var(--surface);
  box-shadow: var(--shadow); padding: clamp(11px, 1.3vh, 20px) clamp(13px, 1.1vw, 20px);
  display: flex; flex-direction: column; gap: 6px; }
.tile::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--tom, var(--accent-strong)); opacity: .85; }
.tile .topo { display: flex; align-items: center; gap: 9px; }
.tile .nome { font-size: clamp(10px, .72vw, 12px); font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-2); }
.tile .n { font-size: clamp(30px, 3.4vw, 58px); font-weight: 680; letter-spacing: -.038em;
  line-height: 1; font-variant-numeric: tabular-nums; }
.tile .pe { font-size: clamp(11px, .82vw, 13.5px); color: var(--ink-muted); }
.tile .pe b { color: var(--ink-2); font-weight: 650; }

.painel-duplo { display: grid; gap: clamp(10px, 1vw, 18px); min-height: 0;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.painel-duplo.igual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.painel-duplo > .quadro { min-height: 0; }
.quadro { position: relative; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--grad-card), var(--surface); box-shadow: var(--shadow);
  padding: clamp(12px, 1.4vh, 20px) clamp(14px, 1.2vw, 22px); display: flex;
  flex-direction: column; min-height: 0; overflow: hidden; }
.quadro > h2 { display: flex; align-items: center; gap: 10px; font-size: clamp(13px, 1.05vw, 17px);
  margin-bottom: clamp(6px, .9vh, 12px); }
.quadro > h2 small { margin-left: auto; font-weight: 500; color: var(--ink-muted);
  font-size: clamp(10.5px, .76vw, 12.5px); }
.quadro .corpo { min-height: 0; flex: 1; display: flex; flex-direction: column;
  justify-content: center; }
/* Numa TV a altura sobra. O gráfico cresce até ocupar o quadro inteiro: o
   viewBox mantém a proporção e o `meet` centraliza — nada distorce, e o
   desenho fica do tamanho de quem olha de longe. */
.quadro figure.chart { margin: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.quadro figure.chart figcaption, .quadro .chart-tools, .quadro .table-twin { display: none; }
.quadro svg.plot { flex: 1; width: 100%; height: 100%; min-height: 0; }
.quadro svg.plot.round { max-width: none; }

/* lista de prazos e de agenda: uma linha alta, legível de longe */
/* a lista se abre até a altura do quadro: numa TV, seis linhas espremidas no
   meio da tela desperdiçam justamente o que a tela tem de melhor */
.pauta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
  gap: clamp(5px, .7vh, 10px); min-height: 0; flex: 1; justify-content: space-evenly; }
.pauta li { display: flex; align-items: center; gap: clamp(10px, .9vw, 16px);
  padding: clamp(7px, .9vh, 13px) clamp(10px, .8vw, 15px); border-radius: var(--radius-sm);
  background: var(--surface-raised); border: 1px solid var(--border);
  border-left: 4px solid var(--tom, var(--accent-strong)); }
.pauta .quando { min-width: clamp(58px, 5vw, 82px); text-align: center; }
.pauta .quando b { display: block; font-size: clamp(19px, 1.8vw, 30px); line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.pauta .quando small { display: block; font-size: clamp(9.5px, .68vw, 11.5px);
  text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.pauta .oque { min-width: 0; flex: 1; }
.pauta .oque b { display: block; font-size: clamp(13px, 1.05vw, 18px); font-weight: 620;
  letter-spacing: -.014em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pauta .oque small { display: block; color: var(--ink-2); font-size: clamp(11px, .8vw, 13.5px);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contagem { flex: none; font-size: clamp(11px, .8vw, 13.5px); font-weight: 700; padding: 5px 12px;
  border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap;
  color: var(--tom, var(--accent)); border: 1px solid color-mix(in srgb, var(--tom, var(--accent)) 42%, transparent);
  background: color-mix(in srgb, var(--tom, var(--accent)) 13%, transparent); }

/* tabela do slide de áreas */
/* largura fixa: sem isso, um nome de projeto comprido empurra a última
   coluna para fora do quadro, e o mural não tem rolagem para alcançá-la */
.placar { width: 100%; table-layout: fixed; border-collapse: collapse;
  font-size: clamp(11.5px, .86vw, 14.5px); }
.placar th:first-child, .placar td:first-child { width: 52%; }
.placar th:nth-child(2), .placar td:nth-child(2) { width: 24%; }
.placar th:nth-child(n+3), .placar td:nth-child(n+3) { width: 12%; }
.placar th { text-align: left; font-size: clamp(9.5px, .68vw, 11.5px); text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-muted); padding: 0 8px 7px; font-weight: 700; }
.placar td { padding: clamp(6px, 2.4vh, 34px) 8px; border-top: 1px solid var(--grid);
  vertical-align: middle; }
.placar td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.placar .quem { display: flex; align-items: center; gap: 9px; min-width: 0; }
.placar .quem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trilho { height: 8px; border-radius: 999px; background: var(--surface-raised); overflow: hidden;
  min-width: clamp(70px, 9vw, 190px); }
.trilho i { display: block; height: 100%; border-radius: 999px;
  background: var(--tom, var(--accent-strong)); width: 0;
  animation: enche .9s cubic-bezier(.16, .84, .3, 1) forwards; animation-delay: .25s; }
@keyframes enche { to { width: var(--pct, 0%); } }

.vazio { color: var(--ink-muted); font-size: clamp(12px, .9vw, 15px); text-align: center;
  padding: clamp(16px, 3vh, 40px) 0; }

/* --------------------------------------------------------------- rodapé */
.mrodape { display: flex; align-items: center; gap: 14px;
  padding: 8px clamp(18px, 2.4vw, 40px) 14px; }
.pontos { display: flex; gap: 7px; align-items: center; }
.pontos button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: none;
  background: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: none; }
.pontos button.on { width: 26px; border-radius: 999px; background: var(--accent-strong); }
.fita { flex: 1; min-width: 0; overflow: hidden; height: 26px; position: relative;
  mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.fita .trem { position: absolute; display: flex; gap: 34px; white-space: nowrap;
  align-items: center; animation: corre 44s linear infinite; }
.fita .trem span { display: inline-flex; align-items: center; gap: 8px;
  font-size: clamp(11.5px, .84vw, 14px); color: var(--ink-2); }
.fita .trem span b { color: var(--ink); font-weight: 650; }
@keyframes corre { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.controles { display: flex; gap: 6px; opacity: 0; transition: opacity .25s; }
.mural.mexeu .controles { opacity: 1; }
.controles button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
  border-radius: 50%; font-size: 16px; }
.controles button svg.icon { font-size: 17px; }

/* o gráfico se desenha: corte lateral que abre da esquerda para a direita.
   Círculo não aceita corte lateral sem ficar torto — rosca e radar surgem
   por escala, com a mesma duração, para o conjunto entrar junto. */
svg.plot.revela { animation: revela .85s cubic-bezier(.22, .78, .3, 1) both; }
@keyframes revela {
  from { clip-path: inset(0 100% 0 0); opacity: .4; }
  to   { clip-path: inset(0 0 0 0); opacity: 1; }
}
svg.plot.surge { animation: surge .85s cubic-bezier(.16, .84, .3, 1) both; transform-origin: 50% 50%; }
@keyframes surge {
  from { opacity: 0; transform: scale(.86) rotate(-7deg); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .aurora, .fita .trem { animation: none; }
  .trilho i { width: var(--pct, 0%); }
  svg.plot.revela, svg.plot.surge { animation: none; clip-path: none; }
}
@media (max-width: 780px) {
  .painel-duplo, .painel-duplo.igual { grid-template-columns: minmax(0, 1fr); }
  .mtopo .titulo h1 { font-size: 17px; }
  .fita { display: none; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="mural" id="mural">
  <div>
    <div class="progresso"><i id="barra"></i></div>
    <header class="mtopo">
      <div class="marca">
        <span class="ibadge t-azul solid lg" id="marcaIcone" aria-hidden="true"></span>
        <span><b id="labNome">LAPE</b><small id="labSub"></small></span>
      </div>
      <div class="titulo">
        <span id="tituloIcone" aria-hidden="true"></span>
        <h1 id="tituloSlide"></h1>
      </div>
      <div class="direita">
        <span class="selo" id="seloVivo" hidden><span class="ponto"></span><span id="seloTexto">ao vivo</span></span>
        <span class="selo" id="seloFiltro" hidden></span>
        <div class="relogio"><b id="hora">--:--</b><small id="data"></small></div>
      </div>
    </header>
  </div>

  <div class="palco" id="palco" aria-live="polite"></div>

  <footer class="mrodape">
    <div class="pontos" id="pontos" role="tablist" aria-label="Telas do mural"></div>
    <div class="fita" aria-hidden="true"><div class="trem" id="fita"></div></div>
    <div class="controles no-print" id="controles"></div>
  </footer>
</div>
