<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
__THEME_CSS__

/* ==========================================================================
   Mural — a tela que fica ligada na sala
   Uma coisa por vez, grande o bastante para ler de pé, a três metros. A tela
   troca sozinha; quem passa não opera nada. Por isso não há rolagem: o que
   não cabe na tela não entra no slide, vai para o próximo.
   ========================================================================== */
html, body { height: 100%; overflow: hidden; }
body { background: var(--surface-sunken); }

/* Fundo em movimento lento. Fica atrás de tudo e nunca sob marca de dado —
   as áreas de plotagem têm superfície própria e opaca. */
.aurora { position: fixed; inset: -18%; z-index: 0; pointer-events: none; filter: blur(58px);
  opacity: var(--aurora, .5); background:
    radial-gradient(38% 44% at 18% 22%, color-mix(in srgb, var(--series-1) 60%, transparent), transparent 68%),
    radial-gradient(34% 40% at 82% 30%, color-mix(in srgb, var(--series-7) 46%, transparent), transparent 66%),
    radial-gradient(40% 46% at 60% 88%, color-mix(in srgb, var(--series-3) 40%, transparent), transparent 68%);
  animation: deriva 46s ease-in-out infinite alternate; }
@keyframes deriva {
  0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
  50%  { transform: translate3d(3%, 2%, 0) scale(1.07); }
  100% { transform: translate3d(-1%, 3%, 0) scale(1.02); }
}

/* `minmax(0, 1fr)` na coluna: sem isso a grade se dimensiona pelo conteúdo
   mais largo — o cabeçalho — e a página inteira fica mais larga que a tela,
   levando o relógio e a borda direita dos quadros para fora do recorte. */
.mural { position: relative; z-index: 1; height: 100vh; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }

/* ------------------------------------------------------------------ topo */
.progresso { height: calc(3px * var(--zoom, 1)); background: color-mix(in srgb, var(--ink) 9%, transparent); }
.progresso i { display: block; height: 100%; width: 0; background: var(--grad-accent);
  box-shadow: 0 0 12px color-mix(in srgb, var(--accent-strong) 80%, transparent); }
.mtopo { display: flex; align-items: center; gap: 16px;
  padding: 14px clamp(18px, 2.4vw, 40px) 10px; }
/* Quem cede espaço é o nome do laboratório, nunca o título da tela: numa
   janela estreita o nome corta com reticências e o assunto continua inteiro. */
.mtopo .marca { display: flex; align-items: center; gap: 12px; min-width: 0;
  flex: 0 1 auto; max-width: 34%; }
.mtopo .marca > span { min-width: 0; }
.mtopo .marca b, .mtopo .marca small { display: block; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.mtopo .marca b { font-size: clamp(15px, 1.25vw, calc(19px * var(--zoom, 1))); letter-spacing: -.02em; }
.mtopo .marca small { color: var(--ink-2); font-size: clamp(11px, .8vw, calc(13px * var(--zoom, 1))); }
.mtopo .titulo { margin-left: 10px; display: flex; align-items: center; gap: 12px;
  min-width: 0; flex: 1 1 auto; }
.mtopo .titulo h1 { font-size: clamp(19px, 1.9vw, calc(30px * var(--zoom, 1))); letter-spacing: -.026em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* nada no topo pode empurrar a linha para além da tela: sem rolagem, o que
   passa da borda some, e some justamente o relógio, que fica na ponta */
.mtopo { min-width: 0; }
.mtopo > * { min-width: 0; }
/* a direita nunca encolhe: com o botão "Seguir" ao lado do relógio, era o
   relógio que saía cortado pela borda -- quem cede é o título, com
   reticências, e não a hora */
.mtopo .direita { margin-left: auto; display: flex; align-items: center; gap: 14px;
  flex: 0 0 auto; }
.relogio { font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.relogio b { display: block; font-size: clamp(20px, 1.9vw, calc(30px * var(--zoom, 1))); letter-spacing: -.03em;
  line-height: 1.05; }
.relogio small { display: block; color: var(--ink-2); font-size: clamp(10.5px, .78vw, calc(12.5px * var(--zoom, 1)));
  text-transform: capitalize; }
.selo { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
  font-size: clamp(11px, .82vw, calc(13px * var(--zoom, 1))); font-weight: 650; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); white-space: nowrap; flex: none;
  max-width: 22vw; overflow: hidden; text-overflow: ellipsis; }
.relogio small { white-space: nowrap; }
.selo[hidden] { display: none; }   /* inline-flex venceria o [hidden] do HTML */

/* --------------------------------------------------------------- palco */
/* Contra burn-in: esta tela fica ligada o dia inteiro, e o mesmo desenho
   parado no mesmo pixel por horas marca fisicamente telas mais antigas
   (OLED e plasma, mas painéis LCD baratos também sofrem com imagem
   residual). O deslocamento é pequeno demais para notar olhando -- 22
   minutos por volta completa -- mas basta para passear o conteúdo por
   uma faixa de poucos pixels ao longo do dia, sem fixar em lugar nenhum. */
.palco { position: relative; min-height: 0; padding: 4px clamp(18px, 2.4vw, 40px) 4px;
  display: grid; animation: deriva-pixels 1320s linear infinite; }
@keyframes deriva-pixels {
  0%   { transform: translate(0px, 0px); filter: hue-rotate(0deg); }
  20%  { transform: translate(2px, -1px); filter: hue-rotate(1.2deg); }
  40%  { transform: translate(-1px, 2px); filter: hue-rotate(-1deg); }
  60%  { transform: translate(1.5px, 1px); filter: hue-rotate(.6deg); }
  80%  { transform: translate(-2px, -1.5px); filter: hue-rotate(-.8deg); }
  100% { transform: translate(0px, 0px); filter: hue-rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .palco { animation: none; }
}
.slide { min-height: 0; display: flex; flex-direction: column; gap: clamp(10px, 1.2vh, 18px);
  animation: entra .58s cubic-bezier(.16, .84, .3, 1) both; }
/* a fila de KPIs tem a altura que tem; o resto ocupa o que sobra da tela,
   para o mural nunca terminar num vão branco embaixo */
.slide > .painel-duplo, .slide > .quadro { flex: 1; min-height: 0; }
@keyframes entra {
  from { opacity: 0; transform: translateY(22px) scale(.988); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}
.slide.saindo { animation: saiu .32s ease-in both; }
@keyframes saiu { to { opacity: 0; transform: translateY(-14px) scale(.99); filter: blur(5px); } }

/* cada filho direto entra um pouco depois do anterior */
.escalona > * { animation: sobe .5s cubic-bezier(.16, .84, .3, 1) both;
  animation-delay: calc(var(--i, 0) * 70ms + 90ms); }
@keyframes sobe { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.linha-kpi { display: grid; gap: clamp(8px, .9vw, 14px);
  grid-template-columns: repeat(auto-fit, minmax(clamp(150px, 13vw, 230px), 1fr)); }
/* Faixa curta nao estica. `auto-fit` com `1fr` reparte a parede inteira
   entre os cartoes que houver: com seis dá cartao, com dois dá dois
   banners de meia parede cada, e o numero fica perdido num campo de
   branco do tamanho dele. O teto devolve aos cartoes a largura que eles
   tem nas telas de seis, e a fileira fica centrada em vez de esticada.
   O seletor casa quando o ultimo filho esta entre os tres primeiros --
   ou seja, tres cartoes ou menos. Onde `:has` nao existir, volta a
   esticar: torto, e nao quebrado. */
.linha-kpi:has(> :nth-child(-n+3):last-child) {
  grid-template-columns:
    repeat(auto-fit, minmax(clamp(150px, 13vw, 230px), clamp(230px, 24vw, 400px)));
  justify-content: center;
}
.tile { position: relative; overflow: hidden; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--grad-card), var(--surface);
  box-shadow: var(--shadow); padding: clamp(11px, 1.3vh, 20px) clamp(13px, 1.1vw, 20px);
  display: flex; flex-direction: column; gap: 6px; }
.tile::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--tom, var(--accent-strong)); opacity: .85; }
.tile .topo { display: flex; align-items: center; gap: 9px; }
.tile .nome { font-size: clamp(10px, .72vw, calc(12px * var(--zoom, 1))); font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-2); }
.tile .n { font-size: clamp(30px, 3.4vw, calc(58px * var(--zoom, 1))); font-weight: 680; letter-spacing: -.038em;
  line-height: 1; font-variant-numeric: tabular-nums; }
.tile .pe { font-size: clamp(11px, .82vw, calc(13.5px * var(--zoom, 1))); color: var(--ink-muted); }
.tile .pe b { color: var(--ink-2); font-weight: 650; }

.painel-duplo { display: grid; gap: clamp(10px, 1vw, 18px); min-height: 0;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.painel-duplo.igual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.painel-duplo > .quadro { min-height: 0; }

/* Quem bateu ponto agora -- flex-none: nunca cresce à custa do gráfico e
   da rosca abaixo, e some por completo (ver faixaPresenca() no mural.js)
   quando não há ninguém, em vez de mostrar "0 no laboratório" o dia todo. */
.faixa-presenca { flex: none; display: flex; align-items: center; gap: clamp(10px, 1.4vw, 20px);
  flex-wrap: wrap; padding: clamp(8px, 1vh, 12px) clamp(12px, 1.1vw, 18px);
  border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--bom) 35%, var(--border));
  background: color-mix(in srgb, var(--bom) 7%, var(--surface)); }
.faixa-presenca-titulo { display: flex; align-items: center; gap: 8px;
  font-size: clamp(11px, .9vw, 13px); font-weight: 700; color: var(--bom); white-space: nowrap; }
.ponto-vivo { width: 9px; height: 9px; border-radius: 50%; background: var(--bom);
  box-shadow: 0 0 6px 1px color-mix(in srgb, var(--bom) 70%, transparent);
  animation: pontoVivoPulso 1.6s ease-in-out infinite; }
@keyframes pontoVivoPulso { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.faixa-presenca-lista { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-presenca { display: inline-flex; align-items: center; gap: 6px;
  font-size: clamp(10.5px, .85vw, 12.5px); color: var(--ink-2);
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 10px 4px 8px; }
.chip-ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--bom); flex: none; }
.pulso-neon-azul { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-strong) 55%, transparent),
    0 0 8px 1px color-mix(in srgb, var(--accent-strong) 45%, transparent);
  animation: pulsoNeonAzul 2.4s ease-in-out infinite; }
@keyframes pulsoNeonAzul {
  0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-strong) 45%, transparent),
    0 0 6px 1px color-mix(in srgb, var(--accent-strong) 30%, transparent); }
  50% { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent-strong) 85%, transparent),
    0 0 14px 3px color-mix(in srgb, var(--accent-strong) 65%, transparent); }
}
@media (prefers-reduced-motion: reduce) { .pulso-neon-azul { animation: none; } }
.faixa-presenca-leitura { flex: none; width: 100%;
  font-size: clamp(10.5px, .85vw, calc(12.5px * var(--zoom, 1)));
  color: var(--ink-2); padding-top: 2px; }
.faixa-presenca-leitura b { color: var(--accent-strong); font-weight: 700; }
.quadro { position: relative; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--grad-card), var(--surface); box-shadow: var(--shadow);
  padding: clamp(12px, 1.4vh, 20px) clamp(14px, 1.2vw, 22px); display: flex;
  flex-direction: column; min-height: 0; overflow: hidden; }
.quadro > h2 { display: flex; align-items: center; gap: 10px; font-size: clamp(13px, 1.05vw, calc(17px * var(--zoom, 1)));
  margin-bottom: clamp(6px, .9vh, 12px); }
.quadro > h2 small { margin-left: auto; font-weight: 500; color: var(--ink-muted);
  font-size: clamp(10.5px, .76vw, calc(12.5px * var(--zoom, 1))); }
.quadro .corpo { min-height: 0; flex: 1; display: flex; flex-direction: column;
  justify-content: center; }
/* Numa TV a altura sobra. O gráfico cresce até ocupar o quadro inteiro: o
   viewBox mantém a proporção e o `meet` centraliza — nada distorce, e o
   desenho fica do tamanho de quem olha de longe. */
.quadro figure.chart { margin: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.quadro figure.chart figcaption, .quadro .chart-tools, .quadro .table-twin { display: none; }
.quadro svg.plot { flex: 1; width: 100%; height: 100%; min-height: 0; }
.quadro svg.plot.round { max-width: none; }
.onda-liquida { animation: moverOndaLiquida 2.6s linear infinite; }
@keyframes moverOndaLiquida { from { transform: translateX(0); } to { transform: translateX(calc(var(--onda-passo, 20px) * -2)); } }
@media (prefers-reduced-motion: reduce) { .onda-liquida { animation: none; } }
/* Esfera do gráfico de dispersão 3D: brilho fixo na cor da própria série
   (nunca cor nova -- lida de `--cor-esfera`, posta pelo JS), e piscar em
   ciano só quando a linha de pesquisa é destaque real (poucos artigos
   publicados, produção em andamento). */
.esfera-3d circle { filter: drop-shadow(0 0 6px var(--cor-esfera)); }
.esfera-pisca-ciano circle { animation: piscaEsferaCiano 1.7s ease-in-out infinite; }
@keyframes piscaEsferaCiano {
  0%, 100% { filter: drop-shadow(0 0 6px var(--cor-esfera)); opacity: .85; }
  50% { filter: drop-shadow(0 0 16px var(--cor-esfera)); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .esfera-pisca-ciano circle { animation: none; } }

/* lista de prazos e de agenda: uma linha alta, legível de longe */
/* a lista se abre até a altura do quadro: numa TV, seis linhas espremidas no
   meio da tela desperdiçam justamente o que a tela tem de melhor */
.pauta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
  gap: clamp(5px, .7vh, 10px); min-height: 0; flex: 1; justify-content: space-evenly; }
.pauta li { display: flex; align-items: center; gap: clamp(10px, .9vw, 16px);
  padding: clamp(7px, .9vh, 13px) clamp(10px, .8vw, 15px); border-radius: var(--radius-sm);
  background: var(--surface-raised); border: 1px solid var(--border);
  border-left: 4px solid var(--tom, var(--accent-strong)); }
/* Tela de parede em 4K: o TETO de cada tamanho de texto sobe.

   Medido antes de escrever: num monitor de 3840px o layout preenchia a
   largura inteira (nao ha max-width), mas o texto ficava nos MESMOS 15px
   de um Full HD -- porque cada `clamp` tem um maximo, e os maximos foram
   escolhidos para 1920. Os graficos, que sao SVG com viewBox, continuavam
   crescendo. O resultado era uma tela desequilibrada: uma rosca enorme e
   rotulos ilegiveis do outro lado da sala -- que e de onde um mural e
   lido.

   O piso e o termo em `vw` continuam iguais: abaixo de 2200px nada muda,
   porque `--zoom` vale 1. Acima disso o teto dobra, e o 4K passa a se
   comportar como o Full HD se comporta -- proporcionalmente.

   Em `min-width`, e nao em `min-resolution`: o que decide o tamanho do
   texto e o tamanho APARENTE na parede, e um notebook 4K de 15 polegadas
   com o navegador em 3840 CSS px e o mesmo caso de um televisor. Quem
   estiver num 4K de perto tem o zoom do navegador.
*/
@media (min-width: 2200px) { :root { --zoom: 1.65; } }
@media (min-width: 3200px) { :root { --zoom: 1.95; } }

.pauta .quando { min-width: clamp(58px, 5vw, 82px); text-align: center; }
.pauta .quando b { display: block; font-size: clamp(19px, 1.8vw, calc(30px * var(--zoom, 1))); line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.pauta .quando small { display: block; font-size: clamp(9.5px, .68vw, calc(11.5px * var(--zoom, 1)));
  text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
/* A hora, na mesma etiqueta do dia: "quando" e uma informacao so, e
   partir dia/mes de um lado e hora do outro obriga quem le a juntar os
   dois com o olho. Em numero tabular, sem caixa alta -- "14:00" nao e
   sigla -- e no tom do acento, para nao competir com o dia. */
.pauta .quando small.hora { margin-top: 2px; text-transform: none;
  letter-spacing: 0; font-variant-numeric: tabular-nums; font-weight: 650;
  color: var(--accent-strong); }
.pauta .oque { min-width: 0; flex: 1; }
.pauta .oque b { display: block; font-size: clamp(13px, 1.05vw, calc(18px * var(--zoom, 1))); font-weight: 620;
  letter-spacing: -.014em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pauta .oque small { display: block; color: var(--ink-2); font-size: clamp(11px, .8vw, calc(13.5px * var(--zoom, 1)));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contagem { flex: none; font-size: clamp(11px, .8vw, calc(13.5px * var(--zoom, 1))); font-weight: 700; padding: 5px 12px;
  border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap;
  color: var(--tom, var(--accent)); border: 1px solid color-mix(in srgb, var(--tom, var(--accent)) 42%, transparent);
  background: color-mix(in srgb, var(--tom, var(--accent)) 13%, transparent); }

/* tabela do slide de áreas */
/* largura fixa: sem isso, um nome de projeto comprido empurra a última
   coluna para fora do quadro, e o mural não tem rolagem para alcançá-la */
/* ---- as telas da TV: frases, ranking de países e azulejo de texto ---- */
/* O azulejo que mostra texto ("Estudo transversal", "há 3 dias") em vez
   de número: menor, para caber, e sem contar. */
.tile .n.texto { font-size: clamp(17px, 1.6vw, calc(28px * var(--zoom, 1))); letter-spacing: -.01em;
  line-height: 1.15; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* A lista de frases: ícone, negrito e o resto, lida a três metros. */
.frases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
  gap: clamp(6px, 1.2vh, 14px); min-height: 0; overflow: hidden; }
.frases li { display: flex; align-items: flex-start; gap: clamp(9px, .8vw, 14px);
  font-size: clamp(12px, .95vw, calc(16px * var(--zoom, 1))); line-height: 1.4; color: var(--ink-2);
  padding: clamp(6px, .9vh, 12px) clamp(8px, .7vw, 12px); border-radius: 12px;
  background: color-mix(in srgb, var(--surface-raised) 70%, transparent); border: 1px solid var(--border); }
.frases li .ibadge { flex: none; margin-top: 1px; }
.frases li b { color: var(--ink); font-weight: 650; }
/* O ranking dos países: bandeira, nome, barra e número, cada barra com a
   largura do seu valor e todas do mesmo tom -- a cor não distingue país,
   a bandeira distingue. */
.ranking { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
  gap: clamp(5px, 1vh, 12px); min-height: 0; overflow: hidden; }
.ranking li { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 2fr) auto;
  align-items: center; gap: clamp(8px, .8vw, 14px);
  font-size: clamp(12px, .95vw, calc(16px * var(--zoom, 1))); }
.ranking .bandeira { width: clamp(28px, 2.2vw, 40px); height: clamp(20px, 1.6vw, 28px); display: grid;
  place-items: center; border-radius: 5px; overflow: hidden; background: var(--surface-raised);
  box-shadow: inset 0 0 0 1px var(--border); }
.ranking .bandeira svg { width: 100%; height: 100%; display: block; }
.ranking .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: 600; }
.ranking .trilho { height: clamp(8px, .8vw, calc(14px * var(--zoom, 1))); border-radius: 99px; background: var(--surface-raised);
  overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.ranking .trilho i { display: block; height: 100%; width: var(--w, 0%); border-radius: 99px;
  background: linear-gradient(90deg, var(--series-1), var(--accent-strong));
  transform-origin: left; animation: revela-barra .9s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(120ms + var(--i, 0) * 70ms); }
.ranking b { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); min-width: 2.2ch; text-align: right; }
@keyframes revela-barra { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .ranking .trilho i { animation: none; } }
/* O "Top 6" do sunburst: cada linha usa a MESMA cor da fatia do país no
   anel ao lado (contorno + número), pra ligar lista e desenho pelo
   olho -- e acende os dois juntos ao passar o mouse em qualquer um. */
.top-paises { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
  gap: clamp(6px, 1vh, 12px); min-height: 0; overflow: hidden; }
.top-pais { display: flex; align-items: center; gap: clamp(9px, .8vw, 14px);
  padding: clamp(7px, 1vh, 12px) clamp(10px, .9vw, 14px); border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--cor) 35%, var(--border));
  border-left: 3px solid var(--cor);
  background: color-mix(in srgb, var(--cor) 7%, var(--surface-raised));
  transition: background .2s ease, transform .18s ease, box-shadow .2s ease;
  animation: chegar-top-pais .4s ease-out both; animation-delay: calc(var(--i, 0) * 60ms); }
.top-pais:hover { transform: translateX(3px);
  background: color-mix(in srgb, var(--cor) 16%, var(--surface-raised));
  box-shadow: 0 0 18px -6px var(--cor); }
@keyframes chegar-top-pais { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.top-pais-num { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 800; color: var(--surface); background: var(--cor); }
.top-pais-bandeira { flex: none; width: clamp(26px, 2vw, 36px); height: clamp(18px, 1.5vw, 26px); display: grid;
  place-items: center; border-radius: 5px; overflow: hidden; background: var(--surface-raised);
  box-shadow: inset 0 0 0 1px var(--border); }
.top-pais-bandeira svg { width: 100%; height: 100%; display: block; }
.top-pais-nome { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.top-pais-nome b { color: var(--ink); font-size: clamp(12.5px, 1vw, calc(16px * var(--zoom, 1))); font-weight: 700; }
.top-pais-nome small { color: var(--ink-2); font-size: clamp(10.5px, .8vw, 13px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }

.placar { width: 100%; table-layout: fixed; border-collapse: collapse;
  font-size: clamp(11.5px, .86vw, calc(14.5px * var(--zoom, 1))); }
.placar th:first-child, .placar td:first-child { width: 52%; }
.placar th:nth-child(2), .placar td:nth-child(2) { width: 24%; }
.placar th:nth-child(n+3), .placar td:nth-child(n+3) { width: 12%; }
.placar th { text-align: left; font-size: clamp(9.5px, .68vw, calc(11.5px * var(--zoom, 1))); text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-muted); padding: 0 8px 7px; font-weight: 700; }
.placar td { padding: clamp(6px, 2.4vh, 34px) 8px; border-top: 1px solid var(--grid);
  vertical-align: middle; }
.placar td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.placar .quem { display: flex; align-items: center; gap: 9px; min-width: 0; }
.placar .quem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* placar dos mais citados: três colunas, e o título fica com o que sobra.
   A colocação é um número na frente do título, não uma cor: seis matizes
   diferentes fariam a cor significar "1º, 2º, 3º" — e cor de série identifica
   entidade, nunca colocação. */
.placar.citado th:first-child, .placar.citado td:first-child { width: auto; }
.placar.citado th:nth-child(2), .placar.citado td:nth-child(2) { width: 14%; }
.placar.citado th:nth-child(3), .placar.citado td:nth-child(3) { width: 22%; }
.placar .posto { flex: none; width: clamp(22px, 1.9vw, 30px); text-align: center;
  font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink-muted);
  font-size: clamp(11px, .82vw, calc(14px * var(--zoom, 1))); }
.placar td.num.forte { font-size: clamp(15px, 1.35vw, calc(24px * var(--zoom, 1))); font-weight: 680;
  letter-spacing: -.02em; }
/* O cabeçalho da tabela NÃO fica fixo no mural: a folha geral o prende
   no topo para tabelas com rolagem, e aqui não há rolagem -- quando a
   tabela transbordava o cartão, o cabeçalho fixo cobria o primeiro
   nome da equipe. */
.quadro .placar th { position: static; }
/* o cartão alinha pelo topo: centrar uma tabela mais alta que o cartão
   corta a primeira linha por cima e a última por baixo */
.quadro .corpo:has(.placar) { justify-content: flex-start; }

/* as faixas por linha de pesquisa */
.faixas-caixa { display: flex; flex-direction: column; min-height: 0; flex: 1; gap: 10px; }
/* `--c` é a cor de cada parte, posta no elemento pelo mural.js; o padrão aqui
   é para a folha nunca ter um token sem definição */
/* `flex:1` + `space-evenly`, e não `gap` fixo + `justify-content:center` no
   pai (`.faixas-caixa`): com poucas linhas de dado (a maioria dos casos,
   agora que quem tem zero artigo saiu para a nota embaixo -- ver
   `faixasPorLinha`), centrar o bloco inteiro deixava uma faixa enorme e
   vazia em cima E embaixo dele, num quadro do tamanho da parede. Esticando
   a LISTA para preencher a altura, cada linha ganha mais respiro de verdade

.faixas { --c: var(--series-1); list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;

  animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
.faixas .quem { display: flex; align-items: center; gap: 9px; min-width: 0; }
.faixas .quem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

.trilho-faixa { display: flex; height: clamp(16px, 2.2vh, 30px); border-radius: 999px; overflow: hidden;
  background: var(--surface-raised); border: 1px solid var(--border); }
.trilho-faixa .parte { display: flex; align-items: center; justify-content: center; height: 100%;
  width: 0; background: var(--c); animation: enche-faixa .9s cubic-bezier(.16, .84, .3, 1) forwards;
  animation-delay: .3s; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent); }
.trilho-faixa .parte + .parte { border-left: 2px solid var(--surface); }
.trilho-faixa .parte b { font-size: clamp(10px, .8vw, calc(13px * var(--zoom, 1))); color: #fff;
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
@keyframes enche-faixa { to { width: var(--w, 0%); } }
.faixas .total { font-size: clamp(14px, 1.3vw, calc(22px * var(--zoom, 1))); font-weight: 700;
  font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.legenda-faixas { display: flex; gap: 16px; flex-wrap: wrap; font-size: clamp(11px, .8vw, calc(13.5px * var(--zoom, 1)));
  color: var(--ink-2); }
.legenda-faixas span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-faixas i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .trilho-faixa .parte { animation: none; width: var(--w, 0%); } .faixas li { animation: none; } }

.trilho { height: calc(8px * var(--zoom, 1)); border-radius: 999px; background: var(--surface-raised); overflow: hidden;
  min-width: clamp(70px, 9vw, 190px); }
.trilho i { display: block; height: 100%; border-radius: 999px;
  background: var(--tom, var(--accent-strong)); width: 0;
  animation: enche .9s cubic-bezier(.16, .84, .3, 1) forwards; animation-delay: .25s; }
@keyframes enche { to { width: var(--pct, 0%); } }

.vazio { color: var(--ink-muted); font-size: clamp(12px, .9vw, calc(15px * var(--zoom, 1))); text-align: center;
  padding: clamp(16px, 3vh, 40px) 0; }

/* --------------------------------------------------------------- rodapé */
.mrodape { display: flex; align-items: center; gap: 14px;
  padding: 8px clamp(18px, 2.4vw, 40px) 14px; }
.pontos { display: flex; gap: 7px; align-items: center; }
.pontos button { width: calc(9px * var(--zoom, 1));
  height: calc(9px * var(--zoom, 1)); padding: 0; border-radius: 50%; border: none;
  background: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: none; cursor: pointer;
  transition: width .35s cubic-bezier(.34, 1.56, .64, 1), background .18s ease, transform .15s ease; }
.pontos button:hover { background: color-mix(in srgb, var(--ink) 48%, transparent); transform: scale(1.3); }
.pontos button:active { transform: scale(.85); }
.pontos button.on { width: calc(26px * var(--zoom, 1)); border-radius: 999px; background: var(--accent-strong); }
.pontos button.on:hover { transform: none; }
.controles { display: flex; gap: 6px; opacity: 0; transform: translateY(4px);
  transition: opacity .25s, transform .25s; }
.mural.mexeu .controles { opacity: 1; transform: translateY(0); }
.controles button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
  border-radius: 50%; font-size: 16px; cursor: pointer;
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), background .2s ease, box-shadow .2s ease; }
.controles button:hover { transform: translateY(-2px) scale(1.1);
  background: color-mix(in srgb, var(--accent) 22%, var(--surface));
  box-shadow: 0 6px 16px -5px color-mix(in srgb, var(--accent) 60%, transparent); }
.controles button:active { transform: scale(.9); }
.controles button svg.icon { font-size: 17px;
  animation: iconePop .32s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes iconePop {
  0% { transform: scale(.4); opacity: 0; }
  65% { transform: scale(1.18); opacity: 1; }
  100% { transform: scale(1); }
}

/* o gráfico se desenha: corte lateral que abre da esquerda para a direita.
   Círculo não aceita corte lateral sem ficar torto — rosca e radar surgem
   por escala, com a mesma duração, para o conjunto entrar junto. */
svg.plot.revela { animation: revela .85s cubic-bezier(.22, .78, .3, 1) both; }
@keyframes revela {
  from { clip-path: inset(0 100% 0 0); opacity: .4; }
  to   { clip-path: inset(0 0 0 0); opacity: 1; }
}
svg.plot.surge { animation: surge .85s cubic-bezier(.16, .84, .3, 1) both; transform-origin: 50% 50%; }
@keyframes surge {
  from { opacity: 0; transform: scale(.86) rotate(-7deg); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .aurora { animation: none; }
  .trilho i { width: var(--pct, 0%); }
  svg.plot.revela, svg.plot.surge { animation: none; clip-path: none; }
  .controles button svg.icon { animation: none; }
  .pontos button, .controles button, .seguir, .seguir svg.icon, .paletas button,
  .controles, .paletas { transition: none; }
}
/* ==========================================================================
   O mural no visual do Observatório: com `data-paleta` no <html>, os
   cartões viram vidro com borda em degradê e brilho, a aurora fica em
   néon e os gráficos ganham halo. Os tokens vêm do theme.css; aqui é só
   o que muda de forma no mural.
   ========================================================================== */
:root[data-paleta] .aurora { opacity: .7; filter: blur(70px); }
:root[data-paleta] .tile, :root[data-paleta] .quadro, :root[data-paleta] .pauta li {
  background: var(--surface); backdrop-filter: blur(18px) saturate(140%); border-color: transparent;
  box-shadow: none; }
:root[data-paleta] .tile::before, :root[data-paleta] .quadro::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.05) 40%, rgba(139,92,246,.35) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; }
:root[data-paleta] .tile > *, :root[data-paleta] .quadro > * { position: relative; }
:root[data-paleta] .tile::after { width: 4px; box-shadow: 0 0 14px var(--tom, var(--accent-strong)); }
:root[data-paleta] .tile .n { text-shadow: 0 0 18px rgba(255,255,255,.35); font-family: var(--display); }
:root[data-paleta] .pauta li { border-left-color: var(--tom, var(--accent-strong));
  box-shadow: inset 4px 0 12px -6px var(--tom, var(--accent-strong)); }
:root[data-paleta] .trilho i, :root[data-paleta] .trilho-faixa .parte {
  box-shadow: 0 0 12px color-mix(in srgb, var(--tom, var(--c, var(--accent-strong))) 55%, transparent); }
:root[data-paleta] .selo { background: var(--surface); }
:root[data-paleta] .progresso i { background: var(--grad-accent); }
:root[data-paleta] .pontos button.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
:root[data-paleta] .controles button { background: var(--surface); border: 1px solid var(--border); color: var(--ink); }

/* a apresentação: o texto do que se está vendo, embaixo do título, e o
   "Seguir" sempre à vista -- a parede troca sozinha, mas quem está na
   frente dela pode conduzir */
.mtopo .titulo { flex-wrap: wrap; row-gap: 2px; }
.mtopo .titulo .apresenta { flex: 1 0 100%; margin: 4px 0 0 46px; color: var(--ink);
  font-size: clamp(11px, .82vw, calc(13.5px * var(--zoom, 1))); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; padding: 4px 12px; border-radius: 999px; width: fit-content; max-width: calc(100% - 46px);
  border: 1px solid color-mix(in srgb, var(--accent-strong) 55%, transparent);
  background: color-mix(in srgb, var(--accent-strong) 10%, transparent); }
.mtopo .titulo .apresenta:empty { display: none; }
/* no néon a caixa ganha o contorno em degradê das três cores do painel */
:root[data-paleta] .mtopo .titulo .apresenta { border-color: transparent; color: #fff;
  background: linear-gradient(var(--navy-raised), var(--navy-raised)) padding-box,
    linear-gradient(90deg, var(--neon-orange), var(--neon-magenta), var(--neon-cyan)) border-box;
  box-shadow: 0 0 22px -6px var(--neon-magenta); }
.seguir { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
  border: none; font-weight: 700; font-size: clamp(12px, .9vw, calc(14px * var(--zoom, 1))); color: #fff;
  background: var(--grad-accent); box-shadow: 0 0 18px -4px var(--accent-strong); cursor: pointer;
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s ease; }
.seguir:hover { transform: translateY(-2px) scale(1.04);
  box-shadow: 0 8px 24px -5px var(--accent-strong); }
.seguir:active { transform: scale(.95); }
.seguir svg.icon { font-size: 15px; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
.seguir:hover svg.icon { transform: translateX(3px); }
.mrodape .paletas { margin-right: 6px; opacity: 0; transform: translateY(4px);
  transition: opacity .25s, transform .25s; }
.mural.mexeu .paletas { opacity: 1; transform: translateY(0); }

@media (max-width: 780px) {
  .painel-duplo, .painel-duplo.igual { grid-template-columns: minmax(0, 1fr); }
  .mtopo .titulo h1 { font-size: 17px; }
}

/* Acessibilidade: modo alto contraste */
@media (prefers-contrast: more) {
  :root { --accent-strong: #00d9ff; --border: #888; }
  .tile, .quadro { border-color: var(--border) !important; border-width: 2px; }
  .tile .n { font-weight: 900; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
  .seguir { border: 2px solid currentColor; }

  .pontos button.on { border-color: var(--accent); background: var(--accent); }
}

@media (prefers-reduced-motion: reduce) {
  .tile, .quadro, .progresso, .triagem path { animation: none !important; transition: none !important; }
  .saindo { animation: none !important; opacity: 0; }

/* Árvore de Decisões */

  background: linear-gradient(135deg,
    color-mix(in srgb, var(--alerta) 12%, var(--surface)),
    color-mix(in srgb, var(--alerta) 6%, var(--surface))); }
.modulo[data-tipo="team"] { border-color: color-mix(in srgb, var(--series-5) 50%, transparent);
  background: linear-gradient(135deg,

.modulo .valor { font-size: clamp(32px, 4vw, calc(56px * var(--zoom, 1)));
  font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

  gap: clamp(4px, .6vw, 8px); padding: clamp(10px, 1.2vh, 16px);
  border-radius: var(--radius); background: color-mix(in srgb, var(--surface) 50%, transparent);
}

  border: 1px solid var(--border);
