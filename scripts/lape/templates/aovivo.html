<!doctype html>
<html lang="pt-BR" data-theme="dark" data-paleta="marinho">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPE ao vivo</title>
<style>__BASE_CSS__
/* ------------------------------------------------------------------
   LAPE ao vivo -- o Observatório dentro do LAPE.

   O desenho vem do Observatório de Evidências que o laboratório montou
   no Lovable: azul-marinho profundo, cartões de vidro com borda em
   degradê e brilho ao passar o mouse, néon nas cores, números com
   halo. Aqui ele é reescrito em CSS puro, sem Tailwind e sem React,
   para rodar no mesmo servidor que o resto do sistema e funcionar sem
   internet -- é o que faz a página valer num projetor da sala.

   Esta página é escura por natureza: néon sobre branco é só cor
   berrante. Por isso ela fixa `data-theme="dark"` e redefine os
   tokens dos gráficos logo abaixo, em vez de perguntar ao tema geral.
   ------------------------------------------------------------------ */
/* Os tokens de vidro e néon e as paletas de fundo moram na folha geral
   (`:root[data-paleta]`, em theme.css): é a mesma escolha para o ao vivo e
   para o mural. Aqui fica só o que é desta página. */
body { margin: 0; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 26px 26px; }
::selection { background: rgba(139,92,246,.5); }
:focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 2px; border-radius: 6px; }

/* ---- a casca: menu lateral, cabeçalho, palco ---- */
.casca { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
nav.lado { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 14px 24px;
  background: rgba(8,15,38,.8); border-right: 1px solid var(--border); backdrop-filter: blur(20px);
  display: flex; flex-direction: column; gap: 22px; }
.marca { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
.marca .selo { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--neon-orange), var(--neon-magenta), var(--neon-purple));
  color: var(--navy-deep); font-weight: 800; font-family: var(--display); font-size: 13px;
  box-shadow: 0 0 24px -6px rgba(139,92,246,.55); }
.marca b { display: block; font-family: var(--display); font-size: 14px; line-height: 1.15; }
.marca small { color: var(--ink-muted); font-size: 11.5px; }
nav.lado .paginas { display: flex; flex-direction: column; gap: 4px; }
nav.lado .paginas button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: none; border: 1px solid transparent; box-shadow: none; padding: 10px 12px; border-radius: 12px;
  color: var(--ink-2); font-size: 13.5px; font-weight: 550; transition: background .15s, color .15s; }
nav.lado .paginas button svg.icon { color: var(--neon-cyan); font-size: 16px; flex: none; }
nav.lado .paginas button:hover { background: rgba(255,255,255,.08); color: var(--ink); }
nav.lado .paginas button.on { color: var(--ink); font-weight: 700;
  background: linear-gradient(90deg, rgba(59,130,246,.25), rgba(139,92,246,.2));
  border-color: rgba(59,130,246,.4); box-shadow: 0 0 24px -6px rgba(59,130,246,.55); }
nav.lado .paginas button .n { margin-left: auto; font-size: 11px; color: var(--ink-muted);
  font-variant-numeric: tabular-nums; }
nav.lado .rodape-lado { margin-top: auto; border: 1px solid var(--border); background: var(--surface);
  border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--ink-muted); }
nav.lado .rodape-lado b { display: block; color: var(--ink); font-size: 12px; }
nav.lado .ligacoes { display: flex; flex-direction: column; gap: 6px; }
nav.lado .ligacoes a button { width: 100%; text-align: left; font-size: 12.5px; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); box-shadow: none; }
nav.lado .ligacoes a button:hover { color: var(--ink); border-color: var(--border-strong); }

header.topo { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px clamp(14px, 2.4vw, 32px); border-bottom: 1px solid var(--border);
  background: rgba(7,13,31,.6); backdrop-filter: blur(20px); }
header.topo .menu { display: none; }
header.topo .titulo b { display: block; font-family: var(--display); font-size: 15px; }
header.topo .titulo small { color: var(--ink-muted); font-size: 11.5px; }
.chips { display: flex; gap: 4px; background: rgba(255,255,255,.05); border: 1px solid var(--border);
  border-radius: 99px; padding: 3px; }
.chips button { border: none; box-shadow: none; background: none; color: var(--ink-2);
  padding: 6px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600; }
.chips button.on { color: #fff; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
  box-shadow: 0 0 18px -4px rgba(59,130,246,.7); }
.pulso { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 99px; font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; }
.pulso i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
.pulso.on { border-color: rgba(52,211,153,.5); color: var(--ink); }
.pulso.on i { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
.pulso.batendo i { animation: bater .9s ease-out 1; }
@keyframes bater { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }

main.palco { padding: clamp(14px, 2.4vw, 32px); max-width: 1440px; }
.cabeca { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
.cabeca .brasao { width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, rgba(59,130,246,.35), rgba(139,92,246,.35)); color: var(--neon-cyan);
  border: 1px solid var(--border); }
.cabeca .brasao svg.icon { font-size: 20px; }
.cabeca h1 { margin: 0; font-size: clamp(20px, 2.4vw, 28px); }
.cabeca p { margin: 4px 0 0; color: var(--ink-muted); font-size: 13.5px; }
h2.secao { font-size: 17px; margin: 26px 0 12px; }

/* ---- o cartão de vidro ---- */
.glass { position: relative; border-radius: 20px; padding: 18px 20px; background: var(--surface);
  backdrop-filter: blur(18px) saturate(140%); transition: box-shadow .35s ease, transform .35s ease;
  animation: chegar .45s ease-out both; animation-delay: calc(var(--i, 0) * 55ms); overflow: hidden; }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.05) 40%, rgba(139,92,246,.35) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; transition: background .35s ease; }
.glass:hover { box-shadow: 0 0 0 1px rgba(34,211,238,.35), 0 0 32px -8px rgba(59,130,246,.6),
  0 0 48px -16px rgba(139,92,246,.6); }
.glass:hover::before { background: linear-gradient(135deg, rgba(34,211,238,.6), rgba(59,130,246,.3) 50%, rgba(255,61,154,.6)); }
.glass > * { position: relative; }
.glass h3 { margin: 0; font-size: 15px; }
.glass .sub { color: var(--ink-muted); font-size: 12px; margin: 2px 0 12px; }
.glass .rodape { color: var(--ink-muted); font-size: 11.5px; margin-top: 10px; }
.glass .cabecalho { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
@keyframes chegar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.glass .blob { position: absolute; top: -48px; right: -48px; width: 128px; height: 128px; border-radius: 50%;
  filter: blur(40px); opacity: .4; pointer-events: none; background: var(--tom, var(--neon-blue)); }

/* ---- indicadores ---- */
.grade { display: grid; gap: 14px; }
.grade.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grade.meio { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.grade.baixo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grade.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grade + .grade, .grade + .glass, .glass + .grade { margin-top: 14px; }
.kpi-neon { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 120px; }
.kpi-neon .rotulo { font-size: 12px; font-weight: 600; color: var(--ink-muted); display: flex; align-items: center; gap: 7px; }
.kpi-neon .rotulo svg.icon { color: var(--tom, var(--neon-blue)); font-size: 15px; }
.kpi-neon .valor { font-family: var(--display); font-size: clamp(28px, 3vw, 38px); font-weight: 800; line-height: 1.05;
  font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(255,255,255,.35); }
.kpi-neon .pe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px;
  font-size: 11.5px; color: var(--ink-muted); line-height: 1.35; }
.kpi-neon .spark { display: block; max-width: 168px; }
.kpi-neon .spark svg { max-height: 30px; }
.delta { font-size: 12.5px; font-weight: 700; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.delta.up { color: var(--neon-green); } .delta.down { color: var(--neon-red); } .delta.flat { color: var(--ink-muted); }
.delta .vs { color: var(--ink-muted); font-weight: 500; }

/* ---- chip ---- */
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border: 1px solid;
  color: var(--tom, var(--ink-2)); border-color: color-mix(in srgb, var(--tom, var(--ink-2)) 40%, transparent);
  background: color-mix(in srgb, var(--tom, var(--ink-2)) 15%, transparent); white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--tom, var(--ink-2)); box-shadow: 0 0 8px currentColor; }
.chip.solto { text-transform: none; letter-spacing: 0; font-weight: 600; }

/* ---- barras horizontais com trilho e brilho ---- */
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hbars li { display: grid; grid-template-columns: minmax(0, 12rem) 1fr auto; align-items: center; gap: 12px; font-size: 13px; }
.hbars.com-icone li { grid-template-columns: 30px minmax(0, 11rem) 1fr auto; }
.hbars .nome { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbars .trilho { height: 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
.hbars .barra { height: 100%; border-radius: 99px; width: 0; transition: width .8s ease-out;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c2, var(--c)) 60%, transparent), var(--c));
  box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent); }
.hbars .pronta .barra { width: var(--w); }
.hbars .n { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }

/* ---- o funil em camadas, do modelo enviado ---- */
/* o espaço à direita é da porcentagem: sem ele, "72% do anterior" saía
   cortado na borda do cartão */
.funil { list-style: none; margin: 0; padding: 0 118px 0 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.funil li { position: relative; width: var(--w); animation: abrir .5s ease-out both; animation-delay: calc(var(--i) * 80ms); }
.funil .camada { position: relative; height: 54px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
  background: linear-gradient(180deg, var(--c) 0%, color-mix(in srgb, var(--c) 70%, transparent) 60%, color-mix(in srgb, var(--c) 50%, transparent) 100%);
  box-shadow: 0 0 28px -4px var(--c); color: var(--navy-deep); }
.funil .camada::before { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.3), transparent); pointer-events: none; }
.funil .camada span { position: relative; z-index: 1; }
.funil .camada .rot { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.funil .camada .val { font-family: var(--display); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.funil .pct { position: absolute; right: -8px; top: 50%; transform: translate(100%, -50%); font-size: 11px; color: var(--ink-muted); white-space: nowrap; }
@keyframes abrir { from { opacity: 0; transform: scaleX(.6); } to { opacity: 1; transform: none; } }

/* ---- mapa de calor em tabela ---- */
.calor { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12px; }
.calor th { font-weight: 600; color: var(--ink-muted); text-align: center; padding: 0 6px 4px; }
.calor th.linha { text-align: left; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calor td { text-align: center; padding: 9px 8px; border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--c) var(--p, 12%), transparent); }
.calor td.quente { box-shadow: 0 0 12px -2px var(--c); }
.calor td.lacuna { background: repeating-linear-gradient(135deg, rgba(255,122,24,.35) 0 4px, transparent 4px 10px);
  color: var(--neon-orange); font-size: 10px; text-transform: uppercase; border: 1px solid rgba(255,122,24,.4); }
.calor td.erro { background: rgba(244,63,94,.2); color: var(--neon-red); border: 1px solid rgba(244,63,94,.5); }

/* ---- leituras / insights ---- */
.leituras { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.leituras li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; }
.leituras li .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px;
  background: linear-gradient(135deg, var(--neon-orange), var(--neon-magenta)); color: var(--navy-deep);
  font-family: var(--display); font-size: 10.5px; font-weight: 800; }
.leituras li p { margin: 0; font-size: 13.5px; line-height: 1.45; color: rgba(244,247,255,.92); }
.leituras li small { display: block; color: var(--ink-muted); font-size: 11px; margin-top: 3px; }

/* ---- o caminho do artigo (funil colorido do modelo) ---- */
.caminho { display: grid; gap: 10px; max-width: 1100px; }
.etapa { display: grid; grid-template-columns: 44px minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 16px; align-items: center;
  padding: 14px 18px; border-radius: 16px; }
.etapa .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800;
  color: var(--navy-deep); background: var(--tom); font-family: var(--display); font-size: 15px; box-shadow: 0 0 22px -4px var(--tom); }
.etapa .valor { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px color-mix(in srgb, var(--tom) 50%, transparent); }
.etapa .valor small { display: block; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 4px; }
.etapa h4 { margin: 0 0 3px; font-size: 14.5px; }
.etapa .faz { color: var(--ink-2); font-size: 12.5px; }
.etapa a button { white-space: nowrap; background: var(--surface); border: 1px solid var(--border); color: var(--ink); box-shadow: none; }
.etapa a button:hover { border-color: var(--tom); box-shadow: 0 0 16px -4px var(--tom); }
.etapa:nth-child(2) { margin-right: 4%; } .etapa:nth-child(3) { margin-right: 8%; }
.etapa:nth-child(4) { margin-right: 12%; } .etapa:nth-child(5) { margin-right: 16%; } .etapa:nth-child(6) { margin-right: 20%; }

/* ---- os doze olhares ---- */
.doze { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.olhar { display: flex; flex-direction: column; }
.olhar .tipo { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--neon-cyan); margin-bottom: 4px; }
.olhar .pergunta { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
/* a caixa do gráfico cresce com o CONTEÚDO. Com `flex: 1 1 0` (o padrão da
   folha, feito para o mural) a caixa ganhava a altura do cartão e a
   legenda, que vem depois do SVG, saía cortada. */
.olhar .plotbox { flex: 0 0 auto; }
.olhar figure.chart figcaption { display: none; }
.olhar .vazio, .vazio { color: var(--ink-muted); font-size: 13px; padding: 28px 8px; text-align: center; }

/* ---- os gráficos da casa, em néon (o filtro está no theme.css) ---- */
figure.chart figcaption { color: var(--ink-muted); }
.legend { color: var(--ink-2); }
.chart-tools button { background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); box-shadow: none; }
.table-twin, table { color: var(--ink); }
th { background: var(--surface-raised); color: var(--ink-2); }
tbody tr:hover { background: rgba(59,130,246,.1); }

/* ---- bases ---- */
.bases { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.base h3 { font-size: 18px; }
.base .desde { color: var(--ink-muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.base .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.base .nums div { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.base .nums dt { font-size: 11px; color: var(--ink-muted); }
.base .nums dd { margin: 2px 0 0; font-family: var(--display); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.base p.nota { margin: 12px 0 0; font-size: 12.5px; color: rgba(244,247,255,.85); line-height: 1.5; }
.legenda-estados { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

/* ---- miúdos ---- */
.miudos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 14px; }
.miudos div { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.miudos dt { font-size: 11px; color: var(--ink-muted); }
.miudos dd { margin: 2px 0 0; font-family: var(--display); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.equipe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.equipe li { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.equipe li span:last-child { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.conferencia { display: flex; height: 10px; border-radius: 99px; overflow: hidden; border: 1px solid var(--border); margin-top: 8px; }
.conferencia i { display: block; height: 100%; }
.aviso-rodape { color: var(--ink-muted); font-size: 12px; margin-top: 22px; line-height: 1.5; }
h2.secao .icone-tema { vertical-align: middle; margin-right: 8px; }
.linhas-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.linhas-chips .chip { text-transform: none; letter-spacing: 0; font-weight: 600; padding: 3px 10px 3px 4px; gap: 8px; }
.linhas-chips .chip .icone-tema { --tam: 22px; border-radius: 7px; }

/* o cartão que "surge" ao clique: cresce e brilha por um instante */
.glass.surgiu { animation: surge-cartao .55s cubic-bezier(.16,.84,.3,1) both; }
@keyframes surge-cartao { 0% { transform: scale(.96); box-shadow: 0 0 0 0 transparent; }
  40% { transform: scale(1.02); box-shadow: 0 0 0 1px rgba(34,211,238,.5), 0 0 40px -6px var(--accent-strong); }
  100% { transform: none; } }

/* ---- o modo apresentação: a caixa de texto e o "seguir" ---- */
/* centrada por `left/right: 0` + margem automática, e não por `transform`:
   a animação de chegada termina em `transform: none` e apagaria o
   deslocamento -- foi assim que a caixa saiu pela borda direita. */
.apresentacao { position: fixed; left: 0; right: 0; bottom: 18px; margin-inline: auto; z-index: 30;
  width: min(920px, calc(100vw - 32px)); display: grid; grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "texto passos" "fatos fatos";
  gap: 10px 14px; align-items: center; padding: 16px 18px 16px 20px; border-radius: 20px;
  background: rgba(8,15,38,.88); backdrop-filter: blur(22px); border: 1px solid transparent;
  box-shadow: var(--shadow-lg), 0 0 48px -8px var(--neon-magenta), 0 0 60px -20px var(--neon-cyan);
  animation: chegar .4s ease-out both; }
/* o contorno em degradê que corre em volta da caixa: laranja, magenta,
   ciano -- as cores do painel. A animação é UMA volta por chegada, e
   depois o contorno fica parado e aceso: o brilho é do contorno, não um
   pisca-pisca. */
.apresentacao::before { content: ""; position: absolute; inset: -2px; border-radius: 22px; padding: 2px; pointer-events: none;
  background: conic-gradient(from var(--ang, 0deg), var(--neon-orange), var(--neon-magenta), var(--neon-cyan), var(--neon-purple), var(--neon-orange));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
