<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPE ao vivo</title>
<style>__BASE_CSS__
/* ------------------------------------------------------------------
   O painel ao vivo. Uma tela, os números de agora, e o que mudou.
   A régua: cabe num projetor, lê-se a três metros, e cada número vem
   com o do período anterior ao lado -- número sozinho não diz nada.
   ------------------------------------------------------------------ */
body { background: var(--surface-sunken); margin: 0; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1;
  background: var(--grad-malha); background-size: var(--malha-passo) var(--malha-passo);
  opacity: .5; pointer-events: none; }

.topo { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  padding: 10px clamp(14px, 2.2vw, 28px); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topo .marca { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.topo .marca .selo { width: 36px; height: 36px; border-radius: 10px; flex: none;
  background: linear-gradient(145deg, var(--accent-strong), var(--accent-solid));
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12.5px;
  box-shadow: var(--glow); }
.topo .marca b { font-size: 15px; letter-spacing: -.01em; display: block; line-height: 1.1; }
.topo .marca small { color: var(--ink-2); font-size: 11.5px; }
.chips { display: flex; gap: 4px; background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 99px; padding: 3px; }
.chips button { border: none; box-shadow: none; background: none; color: var(--ink-2);
  padding: 6px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600; }
.chips button.on { background: var(--accent-solid); color: #fff; }
.abas { display: flex; gap: 2px; margin-left: auto; }
.abas button { border: none; box-shadow: none; background: none; color: var(--ink-2);
  padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; }
.abas button svg.icon { font-size: 16px; }
.abas button.on { background: var(--accent-wash); color: var(--accent); }
.pulso { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
  border: 1px solid var(--border); border-radius: 99px; font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; }
.pulso i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
.pulso.on { border-color: color-mix(in srgb, var(--good) 46%, transparent); color: var(--ink); }
.pulso.on i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.pulso.batendo i { animation: bater .9s ease-out 1; }
@keyframes bater { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pulso.batendo i { animation: none; } }
.ligacoes { display: flex; gap: 6px; }
.ligacoes a button, .ligacoes button { padding: 6px 11px; font-size: 12.5px; }

main { padding: clamp(14px, 2.2vw, 28px); max-width: 1480px; margin: 0 auto; }
.cabeca { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
.cabeca h1 { font-size: clamp(20px, 2.4vw, 28px); margin: 0; letter-spacing: -.02em; }
.cabeca .hint { color: var(--ink-2); font-size: 13px; }

.grade { display: grid; gap: 14px; }
.grade.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grade.meio { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.grade.baixo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grade + .grade { margin-top: 14px; }

.kpi .value { font-size: clamp(28px, 3.2vw, 40px); }
.kpi .delta { font-size: 13px; }
.kpi .delta .vs { color: var(--ink-muted); font-weight: 500; margin-left: 4px; }
.kpi .semseta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.kpi .spark { margin-top: 10px; }

.card { padding: 16px 18px; }
.card h3 { margin: 0 0 2px; font-size: 14.5px; letter-spacing: -.01em; }
.card .sub { color: var(--ink-2); font-size: 12.5px; margin-bottom: 10px; }
.card .rodape { color: var(--ink-muted); font-size: 11.5px; margin-top: 8px; }

/* a rosca traz a própria legenda, com a contagem de cada fatia */
.rosca { display: grid; justify-items: center; }

/* as leituras: calculadas, e cada uma com a regra de onde saiu */
.leituras { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.leituras li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface-raised); }
.leituras li .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent-wash); color: var(--accent); font-weight: 800; font-size: 12px; }
.leituras li p { margin: 0; font-size: 13.5px; line-height: 1.45; }
.leituras li small { display: block; color: var(--ink-muted); font-size: 11.5px; margin-top: 4px; }

/* o caminho do artigo: seis etapas, cada uma com o que há nela agora */
.caminho { display: grid; gap: 10px; max-width: 1100px; }
.etapa { display: grid; grid-template-columns: 44px minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 16px;
  align-items: center; padding: 14px 18px; border: 1px solid var(--border); border-radius: 14px;
  background: var(--surface); box-shadow: var(--shadow), var(--ring); position: relative; overflow: hidden; }
.etapa::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tom); }
.etapa .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-weight: 800; color: #fff; background: var(--tom); font-size: 15px; }
.etapa .valor { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.etapa .valor small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 4px; letter-spacing: 0; }
.etapa h4 { margin: 0 0 3px; font-size: 14.5px; }
.etapa .faz { color: var(--ink-2); font-size: 12.5px; }
.etapa a button { white-space: nowrap; }
/* a largura cai etapa a etapa: é o desenho do funil sem a mentira da porcentagem */
.etapa:nth-child(2) { margin-right: 4%; } .etapa:nth-child(3) { margin-right: 8%; }
.etapa:nth-child(4) { margin-right: 12%; } .etapa:nth-child(5) { margin-right: 16%; }
.etapa:nth-child(6) { margin-right: 20%; }

/* os doze olhares */
.doze { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.olhar { display: flex; flex-direction: column; }
.olhar .tipo { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin-bottom: 4px; }
.olhar .pergunta { font-size: 14px; font-weight: 650; margin-bottom: 8px; letter-spacing: -.01em; }
/* a caixa do gráfico cresce com o CONTEÚDO. Com `flex: 1 1 0` (o padrão
   da folha, feito para o mural, onde o cartão tem altura própria) a caixa
   ganhava a altura do cartão e não a do gráfico -- e a legenda, que vem
   depois do SVG, saía cortada no rodapé. */
.olhar .plotbox { flex: 0 0 auto; }
.olhar figure.chart figcaption { display: none; }
.olhar .vazio { color: var(--ink-muted); font-size: 13px; padding: 30px 8px; text-align: center; }

.aviso-rodape { color: var(--ink-muted); font-size: 12px; margin-top: 22px; line-height: 1.5; }

@media (max-width: 1100px) {
  .grade.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grade.meio, .grade.baixo { grid-template-columns: minmax(0, 1fr); }
  .doze { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .grade.kpis, .doze { grid-template-columns: minmax(0, 1fr); }
  .etapa { grid-template-columns: 36px minmax(0, 1fr); }
  .etapa .faz-col, .etapa a { grid-column: 2; }
  .etapa { margin-right: 0 !important; }
  .abas { margin-left: 0; width: 100%; overflow-x: auto; }
}
@media print { .topo { position: static; } .abas, .ligacoes, .pulso { display: none; } }
</style>
