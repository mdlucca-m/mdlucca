<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef1f7; --border:#dbe0ea;
  --text:#161a22; --muted:#5c6577; --faint:#8b93a6;
  --accent:#1f3864; --accent-2:#2f6fb5; --ok:#1f7a4d; --warn:#a8650a; --bad:#a52c34;
  --c1:#2f6fb5; --c2:#1f7a4d; --c3:#a8650a; --c4:#7b4fa8; --c5:#0f7b8a; --c6:#a52c34;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#161b23; --surface-2:#1d232d; --border:#2a323f;
  --text:#e6e9ef; --muted:#9aa4b6; --faint:#6d7789;
  --accent:#7aa7e0; --accent-2:#6ea8f0; --ok:#4cc38a; --warn:#e0a458; --bad:#f0736f;
  --c1:#6ea8f0; --c2:#4cc38a; --c3:#e0a458; --c4:#b08ae0; --c5:#4bc4d4; --c6:#f0736f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b23; --surface-2:#1d232d; --border:#2a323f;
  --text:#e6e9ef; --muted:#9aa4b6; --faint:#6d7789;
  --accent:#7aa7e0; --accent-2:#6ea8f0; --ok:#4cc38a; --warn:#e0a458; --bad:#f0736f;
  --c1:#6ea8f0; --c2:#4cc38a; --c3:#e0a458; --c4:#b08ae0; --c5:#4bc4d4; --c6:#f0736f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);padding:7px 13px;font-weight:600;font-size:13px}
button:hover{background:var(--border)}
button.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);font:inherit;font-size:13px}
input:focus,select:focus{outline:2px solid var(--accent-2);outline-offset:-1px}
.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
/* ---------- navegação lateral ---------- */
nav.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--border);padding:22px 14px}
nav.side .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:2px}
nav.side .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
nav.side a{display:block;padding:6.5px 10px;border-radius:8px;color:var(--muted);font-size:13.5px}
nav.side a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
nav.side a.active{background:var(--surface-2);color:var(--accent-2);font-weight:600}
nav.side .group{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  margin:16px 10px 6px;font-weight:700}
main{padding:26px clamp(16px,3vw,40px) 90px;max-width:1400px}
/* ---------- cabeçalho ---------- */
header.page{margin-bottom:18px}
header.page h1{font-size:clamp(21px,2.6vw,29px);letter-spacing:-.02em}
header.page .meta{color:var(--muted);font-size:13.5px;margin-top:7px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);font-size:12px;color:var(--muted);margin:0 6px 4px 0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* ---------- barra de filtros ---------- */
.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:9px;align-items:center;
  flex-wrap:wrap;background:var(--bg);padding:11px 0 12px;margin-bottom:16px;
  border-bottom:1px solid var(--border)}
.toolbar .flabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint)}
.toolbar .search{min-width:230px;flex:1;max-width:340px}
.toolbar .fcount{font-size:12.5px;color:var(--muted);margin-left:auto;
  font-variant-numeric:tabular-nums}
/* ---------- seções ---------- */
section{margin-bottom:40px;scroll-margin-top:64px}
section>h2{font-size:19px;letter-spacing:-.01em;margin-bottom:4px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section>h2 .n{font-size:12.5px;color:var(--faint);font-weight:500}
section>h2 .chip-f{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  background:color-mix(in srgb,var(--c1) 14%,transparent);color:var(--c1);
  border:1px solid color-mix(in srgb,var(--c1) 30%,transparent);
  border-radius:999px;padding:1px 7px;font-weight:700}
section>p.lead{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--border)}
.navbtn{font-size:12.5px;color:var(--muted);padding:5px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface)}
.navbtn:hover{background:var(--surface-2);color:var(--accent-2);text-decoration:none}
/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow)}
.card.clickable{cursor:pointer;transition:transform .12s,border-color .12s}
.card.clickable:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.card h3{font-size:14px;margin-bottom:2px}
.card .hint{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.kpi .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  font-weight:700}
.kpi .value{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--faint);margin-top:2px}
.kpi.accent .value{color:var(--accent-2)}
.rowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.search{padding:7px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--surface);color:var(--text);font-size:13px;min-width:200px}
/* ---------- tabelas ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-2)}
th.asc::after{content:" ▲";font-size:9px}
th.desc::after{content:" ▼";font-size:9px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
tbody tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.title{min-width:270px;max-width:520px}
td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.empty{padding:26px;text-align:center;color:var(--faint);font-size:13.5px}
/* ---------- selos ---------- */
.badge{display:inline-block;padding:1.5px 8px;border-radius:999px;font-size:11.5px;
  font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-producao{background:color-mix(in srgb,var(--c1) 15%,transparent);color:var(--c1);
  border-color:color-mix(in srgb,var(--c1) 30%,transparent)}
.b-submetido{background:color-mix(in srgb,var(--c3) 15%,transparent);color:var(--c3);
  border-color:color-mix(in srgb,var(--c3) 30%,transparent)}
.b-aceito{background:color-mix(in srgb,var(--c5) 15%,transparent);color:var(--c5);
  border-color:color-mix(in srgb,var(--c5) 30%,transparent)}
.b-publicado{background:color-mix(in srgb,var(--c2) 15%,transparent);color:var(--c2);
  border-color:color-mix(in srgb,var(--c2) 30%,transparent)}
.b-rejeitado{background:color-mix(in srgb,var(--c6) 15%,transparent);color:var(--c6);
  border-color:color-mix(in srgb,var(--c6) 30%,transparent)}
.b-neutro{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.prog{display:flex;gap:3px;align-items:center}
.prog i{width:13px;height:7px;border-radius:2px;background:var(--border);display:block}
.prog i.on{background:var(--c2)}
.prog i.sub{background:var(--c3)}
/* ---------- gráficos ---------- */
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--border);stroke-dasharray:2 3}
.bar{transition:opacity .15s}
.bar:hover{opacity:.75}
.vlab{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;
  box-shadow:var(--shadow);max-width:280px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:2px}
/* ---------- calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:12px}
.cal .dow{text-align:center;color:var(--faint);font-size:11px;font-weight:700;padding-bottom:4px}
.cal .day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:7px;border:1px solid transparent;color:var(--muted)}
.cal .day.out{color:var(--faint);opacity:.4}
.cal .day.today{border-color:var(--accent-2);font-weight:700;color:var(--accent-2)}
.cal .day.has{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--text);
  font-weight:600}
.cal .day em{font-style:normal;font-size:9px;color:var(--c1)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead button{width:28px;height:28px;padding:0;font-size:14px;line-height:1}
.agenda{list-style:none;padding:0;margin:0}
.agenda li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.agenda li:last-child{border-bottom:none}
.agenda .when{min-width:62px;text-align:center;background:var(--surface-2);border-radius:8px;
  padding:5px 6px;font-size:11px;color:var(--muted);height:fit-content}
.agenda .when b{display:block;font-size:17px;color:var(--text)}
.agenda .what{font-size:13.5px}
.agenda .what small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
/* ---------- abas ---------- */
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600}
.tabs button.active{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.tabpane{display:none}
.tabpane.active{display:block}
/* ---------- avisos ---------- */
.note{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--c3);
  border-radius:8px;padding:11px 14px;font-size:13px;color:var(--muted)}
.note b{color:var(--text)}
.issues{list-style:none;padding:0;margin:0;font-size:13.5px}
.issues li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--border)}
.issues li:last-child{border-bottom:none}
.issues .n{font-variant-numeric:tabular-nums;font-weight:700}
.issues .n.zero{color:var(--ok)}
.issues .n.some{color:var(--warn)}
.mono{font-family:var(--mono);font-size:12px}
footer{border-top:1px solid var(--border);padding-top:18px;color:var(--faint);font-size:12.5px}
/* ---------- gaveta de detalhes ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,94vw);z-index:80;
  background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer-top{display:flex;justify-content:flex-end;padding:12px 16px 0}
.drawer-body{overflow-y:auto;padding:4px 22px 30px}
.drawer-body h3{font-size:19px;letter-spacing:-.02em;margin-bottom:2px}
.drawer-body h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  margin:20px 0 8px}
.drawer-sub{color:var(--muted);font-size:13px}
.drawer-actions{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.contacts{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);
  background:var(--surface-2);border-radius:9px;padding:11px 14px;margin-top:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0}
/* ---------- flutuantes ---------- */
#themeToggle,#toTop{position:fixed;right:16px;z-index:50;width:38px;height:38px;
  border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);font-size:15px;padding:0}
#themeToggle{bottom:16px}
#toTop{bottom:62px;opacity:0;pointer-events:none;transition:opacity .18s}
#toTop.on{opacity:1;pointer-events:auto}
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:2px;padding:12px}
  nav.side .brand,nav.side .sub,nav.side .group{width:100%}
  nav.side a{padding:5px 9px;font-size:12.5px}
  .toolbar .fcount{margin-left:0;width:100%}
}
@media print{
  nav.side,#themeToggle,#toTop,.tabs,.toolbar,.secnav,.head-actions,.drawer,.scrim{display:none}
  .layout{grid-template-columns:1fr}
  section{break-inside:avoid;page-break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="layout">
<nav class="side" id="nav">
  <div class="brand">LAPE</div>
  <div class="sub">Painel de indicadores</div>
</nav>
<main>
  <header class="page" id="topo">
    <h1 id="labName"></h1>
    <div class="meta" id="labMeta"></div>
    <div class="head-actions" id="actions"></div>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>
</div>
<button id="toTop" title="Voltar ao topo">↑</button>
<button id="themeToggle" title="Alternar tema">◑</button>
<div class="tip" id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detalhes">
  <div class="drawer-top"><button id="drawerClose">Fechar ✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<script id="payload" type="application/json">__DATA__</script>
<script>
__SCRIPT__
</script>
</body>
</html>
