<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
__THEME_CSS__

/* ==========================================================================
   estrutura do painel
   ========================================================================== */
.layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
/* o trilho é sticky e mede 100vh; quem pinta a coluna até o rodapé é a grade */
@media (min-width: 981px) {
  .layout { background: linear-gradient(90deg, var(--surface) 0 243px,
    var(--border) 243px 244px, transparent 244px); }
  nav.side { background: none; border-right: none; }
}

nav.side { position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; }
nav.side .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 18px; }
nav.side .brand .logo { width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  font-weight: 800; font-size: 13px; letter-spacing: .02em; }
nav.side .brand b { display: block; font-size: 15px; }
nav.side .brand small { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 400; }
/* seis seções, uma linha cada: ícone, nome e quantas sub-abas há dentro */
nav.side .navitem { display: flex; align-items: center; gap: 10px; width: 100%;
  text-align: left; background: none; border: none; box-shadow: none; padding: 9px 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13.5px; font-weight: 550;
  position: relative; }
/* pastilha no lugar do traço solto: cada seção passa a ter cor própria, e a
   navegação deixa de ser uma lista cinza de seis linhas iguais */
nav.side .navitem .ibadge { --badge: 30px; }
nav.side .navitem:hover .ibadge { filter: brightness(1.12); }
nav.side .navitem.active .ibadge { box-shadow:
  inset 0 1px 0 color-mix(in srgb, var(--tone) 30%, transparent),
  0 0 0 1px color-mix(in srgb, var(--tone) 46%, transparent),
  0 6px 18px -8px color-mix(in srgb, var(--tone) 90%, transparent); }
nav.side .navitem em { margin-left: auto; font-style: normal; font-size: 11px;
  color: var(--ink-muted); background: var(--surface-raised); border-radius: 999px;
  padding: 1px 7px; font-variant-numeric: tabular-nums; }
nav.side .navitem:hover { background: var(--surface-raised); color: var(--ink); }
nav.side .navitem.active { background: var(--accent-wash); color: var(--accent); font-weight: 700; }
nav.side .navitem.active::before { content: ""; position: absolute; left: -12px; top: 8px;
  bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
nav.side .railfoot { margin: 18px 10px 0; font-size: 11px; color: var(--ink-muted);
  line-height: 1.45; }

/* barra de sub-abas: o segundo nível, sempre visível dentro da seção */
.subnav { position: sticky; top: 0; z-index: 25; display: flex; gap: 4px; align-items: center;
  flex-wrap: wrap; padding: 10px 0; margin-bottom: 2px;
  background: var(--surface-sunken); border-bottom: 1px solid var(--border); }
.subnav .secname { display: inline-flex; align-items: center; gap: 7px; margin-right: 12px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted);
  font-weight: 700; }
.subnav .secname svg.icon { color: var(--accent); font-size: 15px; }
.viewhead h2 .ibadge { --badge: 32px; }
.subnav .subitem { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent;
  background: none; box-shadow: none; color: var(--ink-2); padding: 6px 12px;
  border-radius: 999px; font-size: 13px; font-weight: 550; }
.subnav .subitem svg.icon { color: var(--ink-muted); font-size: 15px; }
.subnav .subitem:hover { background: var(--surface-raised); color: var(--ink);
  border-color: var(--border); }
.subnav .subitem.on { background: var(--accent); border-color: var(--accent);
  color: var(--on-accent); font-weight: 650; }
.subnav .subitem.on svg.icon { color: var(--on-accent); }

main { padding: 24px clamp(16px, 3vw, 38px) 90px; max-width: 1440px; }

header.page { margin-bottom: 16px; }
header.page h1 { font-size: clamp(20px, 2.4vw, 28px); letter-spacing: -.022em; }
header.page .meta { margin-top: 8px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-raised); border: 1px solid var(--border);
  font-size: 12px; color: var(--ink-2); margin: 0 6px 4px 0; }
.pill.live { border-color: color-mix(in srgb, var(--good) 40%, transparent);
  color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

/* barra de filtros: uma só, acima de tudo o que ela recorta */
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 9px; align-items: center;
  flex-wrap: wrap; background: var(--surface-sunken); padding: 11px 0 12px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border); }
.toolbar .flabel { font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-muted); }
.toolbar select { width: auto; min-width: 150px; }
.toolbar .search { width: auto; min-width: 220px; flex: 1; max-width: 320px; }
.toolbar .segwrap { display: flex; align-items: center; gap: 7px; }
.toolbar .segwrap select { min-width: 150px; }
.toolbar .fcount { font-size: 12.5px; color: var(--ink-2); margin-left: auto;
  font-variant-numeric: tabular-nums; }
.segmented { display: inline-flex; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); overflow: hidden; }
.segmented button { border: none; border-radius: 0; padding: 6px 11px; font-size: 12.5px;
  background: var(--surface); color: var(--ink-2); }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button:hover { background: var(--surface-raised); color: var(--ink); }
.segmented button.on { background: var(--accent); color: var(--on-accent); }

.viewhead { margin-bottom: 18px; }
.viewhead h2 { font-size: 19px; display: flex; align-items: center; gap: 9px; }
.viewhead .lead { color: var(--ink-2); font-size: 13.5px; margin: 5px 0 0; max-width: 78ch; }

.rowbar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap; margin-bottom: 10px; }
.rowbar h3 { font-size: 14.5px; }
.search { padding: 7px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); font-size: 13px; min-width: 200px; }

.card.clickable { cursor: pointer; transition: border-color .12s, transform .12s; }
.card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }

/* abas internas de um cartão */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { background: var(--surface-raised); border: 1px solid var(--border);
  color: var(--ink-2); padding: 5px 12px; font-size: 12.5px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tabpane { display: none; }
.tabpane.on { display: block; }

/* explorador */
.explorer-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.explorer-controls .field { min-width: 168px; flex: 1; }
.explorer-controls label { margin-bottom: 5px; }

/* pontes para o mesmo assunto em outra seção */
.related { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 26px; }
.related .flabel { font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-muted); }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 13px;
  font-size: 12.5px; }
.chip svg.icon { color: var(--ink-muted); font-size: 14px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:hover svg.icon { color: var(--accent); }

/* navegação entre sub-abas, no rodapé de cada uma */
.secnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px;
  padding-top: 16px; border-top: 1px solid var(--border); }
.navbtn { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;
  color: var(--ink-2); padding: 8px 14px; }
.navbtn .arrow { color: var(--ink-muted); }
.navbtn:hover { color: var(--accent); }
.navbtn:hover .arrow { color: var(--accent); }

/* o pulso do tempo real: uma piscada curta quando o servidor empurra algo */
.pill.live.push::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--good); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.pill.live.pulse { animation: pulse .9s ease-out 1; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); }
  100% { box-shadow: 0 0 0 9px transparent; }
}

/* durante a recarga: segura o desenho anterior, sem esqueleto e sem salto */
#app.reloading, .reloading { opacity: .55; transition: opacity .15s; }

/* calendário */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 12px; }
.cal .dow { text-align: center; color: var(--ink-muted); font-size: 11px; font-weight: 700;
  padding-bottom: 4px; }
.cal .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; border-radius: 7px; border: 1px solid transparent; color: var(--ink-2); }
.cal .day.out { color: var(--ink-muted); opacity: .4; }
.cal .day.today { border-color: var(--accent); font-weight: 700; color: var(--accent); }
.cal .day.has { background: var(--accent-wash); color: var(--ink); font-weight: 650; }
.cal .day em { font-style: normal; font-size: 9px; color: var(--accent); line-height: 1; }
.calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.calhead button { width: 28px; height: 28px; padding: 0; font-size: 14px; line-height: 1; }
.agenda { list-style: none; padding: 0; margin: 0; }
.agenda li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.agenda li:last-child { border-bottom: none; }
.agenda .when { min-width: 62px; text-align: center; background: var(--surface-raised);
  border-radius: 8px; padding: 5px 6px; font-size: 11px; color: var(--ink-2); height: fit-content; }
.agenda .when b { display: block; font-size: 17px; color: var(--ink); }
.agenda .what { font-size: 13.5px; }
.agenda .what small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 1px; }

/* ==========================================================================
   organograma
   Colunas, não árvore desenhada: a hierarquia de um laboratório é rasa e
   larga, e é a largura que estoura a tela. Cada orientador é uma faixa; a
   linha horizontal nasce no centro da primeira coluna e morre no centro da
   última, e é por isso que o JS informa quantas colunas há (--n).
   ========================================================================== */
.org { --n: 1; }
.org-top { display: flex; justify-content: center; }
.org-stem { width: 2px; height: 22px; margin: 0 auto; background: var(--border-strong); }
.org-scroll { overflow-x: auto; padding-bottom: 6px; }
.org-branches { position: relative; display: grid; gap: 0 14px; padding-top: 22px;
  grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); min-width: min-content; }
.org-branches::before { content: ""; position: absolute; top: 0; height: 2px;
  left: calc(50% / var(--n)); right: calc(50% / var(--n)); background: var(--border-strong); }
.org-branches.sem-topo { padding-top: 0; }
.org-branches.sem-topo::before { display: none; }
.org-branch { position: relative; min-width: 0; }
.org-branch::before { content: ""; position: absolute; top: -22px; left: 50%; width: 2px;
  height: 22px; background: var(--border-strong); }
.org-branches.sem-topo .org-branch::before { display: none; }

.org-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--surface);
  box-shadow: var(--shadow); }
.org-card b { font-size: 13.5px; font-weight: 650; letter-spacing: -.012em; }
.org-card small { font-size: 11.5px; color: var(--ink-2); }
.org-card:hover { border-color: var(--accent); }
.org-card.boss { min-width: 240px; width: auto; align-items: center; text-align: center;
  border-color: var(--accent); background: var(--accent-wash); }
.org-card.boss b { font-size: 15px; }
.org-card.small { padding: 7px 10px; box-shadow: none; background: var(--surface-raised); }
.org-card.small b { font-size: 12.5px; }
.org-card.ghost { background: none; border-style: dashed; box-shadow: none; }
.org-marks { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.org-chip { font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-wash); color: var(--accent); font-variant-numeric: tabular-nums; }
.org-chip.soft { background: var(--surface-hover); color: var(--ink-2); }

/* a haste em L à esquerda de cada orientando: um traço que desce e vira */
.org-kids { list-style: none; margin: 0; padding: 0; }
.org-branch > .org-kids { margin-top: 14px; }
.org-kid { position: relative; padding-left: 16px; margin-top: 8px; }
.org-kid::before { content: ""; position: absolute; left: 0; top: -8px; bottom: 50%;
  width: 2px; background: var(--border); }
.org-kid::after { content: ""; position: absolute; left: 0; top: calc(50% - 1px);
  width: 12px; height: 2px; background: var(--border); }
.org-kid > .org-kids { margin-left: 6px; }
.org-vazio { margin-top: 12px; font-size: 12px; color: var(--ink-muted); font-style: italic; }

/* gaveta de detalhes */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .48); opacity: 0;
  pointer-events: none; transition: opacity .18s; z-index: 70; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(640px, 95vw); z-index: 80;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer.on { transform: translateX(0); }
.drawer-top { display: flex; justify-content: flex-end; padding: 12px 16px 0; }
.drawer-body { overflow-y: auto; padding: 4px 22px 32px; }
.drawer-body h3 { font-size: 19px; letter-spacing: -.02em; margin-bottom: 3px; }
.drawer-body h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-muted); margin: 22px 0 9px; font-weight: 700; }
.drawer-sub { color: var(--ink-2); font-size: 13px; }
.drawer-actions { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.contacts { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2);
  background: var(--surface-raised); border-radius: var(--radius-sm); padding: 11px 14px;
  margin-top: 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin: 0; }
.facts dt { color: var(--ink-2); font-weight: 650; }
.facts dd { margin: 0; }

footer { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 30px;
  color: var(--ink-muted); font-size: 12.5px; }

#themeToggle, #toTop { position: fixed; right: 16px; z-index: 50; width: 38px; height: 38px;
  border-radius: 50%; padding: 0; font-size: 15px; box-shadow: var(--shadow); }
#themeToggle { bottom: 16px; }
#toTop { bottom: 62px; opacity: 0; pointer-events: none; transition: opacity .18s; }
#toTop.on { opacity: 1; pointer-events: auto; }

@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; border-right: none;
    border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 3px; padding: 12px; }
  nav.side .brand, nav.side .railfoot { width: 100%; }
  nav.side .navitem { width: auto; padding: 7px 11px; font-size: 12.5px; }
  nav.side .navitem em, nav.side .navitem.active::before { display: none; }
  .subnav { position: static; }
  .toolbar .fcount { margin-left: 0; width: 100%; }
}
@media print {
  nav.side, .toolbar, .subnav, .head-actions, .secnav, .related, .drawer, .scrim,
  #themeToggle, #toTop { display: none; }
  .layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="side" id="nav" aria-label="Seções do painel">
    <div class="brand">
      <span class="logo" aria-hidden="true">LP</span>
      <span><b>LAPE</b><small>Painel de indicadores</small></span>
    </div>
  </nav>
  <main>
    <header class="page" id="topo">
      <h1 id="labName"></h1>
      <div class="meta" id="labMeta"></div>
      <div class="head-actions no-print" id="actions"></div>
    </header>
    <div class="subnav no-print" id="subnav" role="tablist" aria-label="Sub-abas da seção"></div>
    <div class="toolbar no-print" id="toolbar" role="search" aria-label="Filtros do painel"></div>
    <div id="app"><div id="view"></div></div>
    <footer id="foot"></footer>
  </main>
</div>

<button id="toTop" class="no-print" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>
<button id="themeToggle" class="no-print" title="Alternar tema claro/escuro"
  aria-label="Alternar tema">◑</button>

<div class="scrim no-print" id="scrim"></div>
<aside class="drawer no-print" id="drawer" aria-label="Detalhes" role="dialog" aria-modal="true">
  <div class="drawer-top"><button id="drawerClose" type="button">Fechar ✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
