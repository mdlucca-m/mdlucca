<script>
"use strict";

/* ---------- infraestrutura ---------- */
const VIEW = document.getElementById("view");
const MENU = document.getElementById("menu");
const TOAST = document.getElementById("toast");
let ME = null;
let CACHE = {};

function h(tag, attrs, kids){
  const node = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : (kids ? [kids] : [])).forEach(function (kid){
    if (kid === null || kid === undefined || kid === false) return;
    node.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  });
  return node;
}
async function api(path, method, body){
  const response = await fetch(path, {
    method: method || "GET",
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 401){ location.href = "/entrar?next=/app"; throw new Error("sessão expirada"); }
  const data = await response.json().catch(function (){ return {}; });
  if (!response.ok) throw new Error(data.error || ("erro " + response.status));
  return data;
}
let toastTimer = null;
function toast(message, kind){
  TOAST.textContent = message;
  TOAST.className = "toast on" + (kind === "erro" ? " erro" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ TOAST.className = "toast"; }, 4200);
}
function dt(iso){
  if (!iso) return "—";
  const p = String(iso).slice(0, 10).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(iso);
}
function isoDate(value){ return value ? String(value).slice(0, 10) : ""; }
function rank(role){ return {leitura: 0, integrante: 1, coordenacao: 2, admin: 3}[role] || 0; }
function can(minimum){ return ME && rank(ME.user_role) >= rank(minimum); }

/* ---------- formulários ---------- */
function field(key, label, type, extra){
  return Object.assign({key: key, label: label, type: type || "text"}, extra || {});
}
function buildForm(spec, values, onSubmit){
  values = values || {};
  const grid = h("div", {class: "grid g2"});
  const inputs = {};
  spec.fields.forEach(function (f){
    const id = "f_" + f.key.replace(/\W+/g, "_");
    let input;
    const preset = f.from ? values[f.from] : values[f.key];
    if (f.type === "textarea"){
      input = h("textarea", {id: id, placeholder: f.placeholder || ""});
      input.value = preset || "";
    } else if (f.type === "select"){
      input = h("select", {id: id});
      const options = typeof f.options === "function" ? f.options() : (f.options || []);
      input.appendChild(h("option", {value: "", text: f.placeholder || "— selecione —"}));
      options.forEach(function (opt){
        const value = typeof opt === "object" ? opt.value : opt;
        const text = typeof opt === "object" ? opt.label : opt;
        input.appendChild(h("option", {value: value, text: text}));
      });
      input.value = preset === null || preset === undefined ? "" : String(preset);
    } else if (f.type === "checkbox"){
      input = h("input", {id: id, type: "checkbox"});
      input.checked = !!preset;
    } else {
      input = h("input", {id: id, type: f.type, step: f.step, placeholder: f.placeholder || ""});
      input.value = f.type === "date" ? isoDate(preset) : (preset === null || preset === undefined ? "" : preset);
    }
    if (f.required) input.required = true;
    inputs[f.key] = {input: input, spec: f};
    grid.appendChild(h("div", {class: f.span === "full" ? "full" : null}, [
      h("label", {for: id, text: f.label + (f.required ? " *" : "")}),
      input,
      f.hint ? h("div", {class: "hint", style: "margin-top:4px", text: f.hint}) : null,
    ]));
  });

  const button = h("button", {class: "primary", type: "submit", text: spec.submitLabel || "Salvar"});
  const form = h("form", {}, [
    grid,
    h("div", {class: "actions", style: "margin-top:16px"}, [
      button,
      spec.onCancel ? h("button", {type: "button", class: "ghost", text: "Cancelar",
        onclick: spec.onCancel}) : null,
    ]),
  ]);
  form.addEventListener("submit", async function (ev){
    ev.preventDefault();
    const payload = {};
    for (const key in inputs){
      const {input, spec: f} = inputs[key];
      let value = f.type === "checkbox" ? (input.checked ? "Sim" : "Não") : input.value.trim();
      if (value !== "") payload[key] = value;
    }
    if (spec.extra) Object.assign(payload, spec.extra(values));
    button.disabled = true;
    const original = button.textContent;
    button.textContent = "Salvando…";
    try {
      await onSubmit(payload);
    } catch (e){
      toast(e.message, "erro");
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  });
  return form;
}
function table(cols, rows, emptyMessage){
  if (!rows || !rows.length)
    return h("div", {class: "tw"}, h("div", {class: "empty", text: emptyMessage || "Nada por aqui ainda."}));
  return h("div", {class: "tw"}, h("table", {}, [
    h("thead", {}, h("tr", {}, cols.map(function (c){
      return h("th", {class: c.num ? "num" : null, text: c.label}); }))),
    h("tbody", {}, rows.map(function (row){
      return h("tr", {}, cols.map(function (c){
        const value = c.render ? c.render(row) : row[c.k];
        const cell = h("td", {class: c.num ? "num" : null});
        if (value && typeof value === "object") cell.appendChild(value);
        else cell.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
        return cell;
      }));
    })),
  ]));
}

/* ---------- listas auxiliares ---------- */
async function loadLookups(){
  const [lines, articles, reasons, projects] = await Promise.all([
    api("/api/research-lines?limit=200").catch(function (){ return {items: []}; }),
    api("/api/articles?limit=1000"),
    api("/api/rejection-reasons?limit=200").catch(function (){ return {items: []}; }),
    api("/api/projects?limit=300").catch(function (){ return {items: []}; }),
  ]);
  CACHE.lines = lines.items.map(function (l){ return l.name; });
  CACHE.articles = articles.items;
  CACHE.reasons = reasons.items.map(function (r){ return r.label; });
  CACHE.projects = projects.items;
}
const STATUS_OPTS = ["Em produção", "Submetido", "Em revisão", "Aceito", "Publicado",
                     "Rejeitado", "Arquivado"];
const DECISION_OPTS = ["Em avaliação", "Revisão solicitada", "Aceito", "Rejeitado",
                       "Desk rejection", "Retirado"];
const EVENT_OPTS = ["Reunião", "Coleta", "Defesa", "Qualificação", "Congresso", "Curso",
                    "Seminário", "Visita técnica", "Extensão", "Outro"];
const PROJECT_OPTS = ["Em andamento", "Planejado", "Concluído", "Suspenso"];

/* ---------- telas ---------- */
const VIEWS = {};

VIEWS.perfil = {
  label: "Meu perfil", group: "Meu cadastro",
  async render(){
    const me = await api("/api/researchers/" + ME.id);
    VIEW.innerHTML = "";
    VIEW.appendChild(tituloDaTela("perfil", "Meu perfil"));
    VIEW.appendChild(h("p", {class: "view",
      text: "Estes dados alimentam o índice de pesquisadores, a rede de colaboração e as métricas do painel."}));
    VIEW.appendChild(h("div", {class: "grid g4 sec"}, [
      kpi("Artigos", me.n_articles), kpi("Publicados", me.n_published),
      kpi("Projetos", me.n_projects), kpi("Índice h", me.h_index === null ? "—" : me.h_index),
    ]));
    if (me.h_index_source)
      VIEW.appendChild(h("p", {class: "hint sec", text:
        "Índice h calculado a partir de " + (me.h_index_source === "openalex_author"
          ? "perfil público do OpenAlex (carreira completa)"
          : "artigos deste banco") + (me.metrics_updated_at ? " · atualizado em " + dt(me.metrics_updated_at) : "")}));

    const spec = {fields: [
      field("Nome completo", "Nome completo", "text", {from: "full_name", required: true, span: "full"}),
      field("Nome curto", "Nome de citação", "text", {from: "short_name"}),
      field("Variações", "Variações do nome", "text",
        {hint: "Outras grafias usadas nas planilhas, separadas por ponto e vírgula."}),
      field("Função", "Função no laboratório", "text", {from: "role",
        placeholder: "Coordenação, doutorando, bolsista…"}),
      field("Titulação", "Titulação", "text", {from: "degree", placeholder: "Doutor, Mestre…"}),
      field("Linha de pesquisa", "Linha de pesquisa", "select",
        {from: "research_line", options: function (){ return CACHE.lines; }}),
      field("Instituição", "Instituição", "text", {from: "institution"}),
      field("E-mail", "E-mail", "email", {from: "email"}),
      field("Telefone", "Telefone", "text", {from: "phone"}),
      field("Lattes", "ID Lattes", "text", {from: "lattes_id",
        hint: "Os 16 dígitos do endereço do currículo."}),
      field("ORCID", "ORCID", "text", {from: "orcid",
        hint: "Com ORCID o rastreador identifica sua produção sem risco de homônimo."}),
      field("Resumo", "Minibiografia", "textarea", {from: "bio", span: "full"}),
    ], extra: function (){ return {id: ME.id}; }};

    VIEW.appendChild(h("div", {class: "card sec"}, buildForm(spec, me, async function (payload){
      await api("/api/members", "POST", payload);
      toast("Perfil atualizado.");
      VIEWS.perfil.render();
    })));

    VIEW.appendChild(h("div", {class: "sec"}, [
      h("h3", {text: "Projetos de que participo"}),
      table([
        {k: "name", label: "Projeto"},
        {k: "funder", label: "Financiador"},
        {k: "role", label: "Papel"},
        {k: "status", label: "Situação", render: function (r){
          return h("span", {class: "badge" + (r.status === "em_andamento" ? " ok" : ""),
            text: r.status}); }},
      ], me.project_list, "Você ainda não está vinculado a nenhum projeto."),
    ]));

    VIEW.appendChild(h("div", {class: "sec"}, [
      h("h3", {text: "Meus artigos"}),
      table([
        {k: "title", label: "Título"},
        {k: "status", label: "Situação", render: function (r){
          return h("span", {class: "badge", text: r.status}); }},
        {k: "year_published", label: "Ano", num: true},
        {k: "journal", label: "Periódico"},
        {label: "Citações", num: true, render: function (r){
          return [r.wos_citations, r.scopus_citations, r.openalex_citations]
            .map(function (v){ return v === null || v === undefined ? "—" : v; }).join(" / "); }},
      ], me.articles, "Nenhum artigo com o seu nome ainda."),
      h("p", {class: "hint", style: "margin-top:8px",
        text: "WoS / Scopus / OpenAlex"}),
    ]));

    if (me.coauthors.length) VIEW.appendChild(h("div", {class: "sec"}, [
      h("h3", {text: "Com quem eu mais publico"}),
      table([{k: "full_name", label: "Coautor"}, {k: "n", label: "Artigos em comum", num: true}],
        me.coauthors),
    ]));
  },
};

function kpi(label, value){
  return h("div", {class: "kpi"}, [
    h("div", {class: "label", text: label}),
    h("div", {class: "value", text: value === null || value === undefined ? "—" : value}),
  ]);
}

function crudView(config){
  return {
    label: config.label, group: config.group, minimum: config.minimum,
    async render(){
      VIEW.innerHTML = "";
      VIEW.appendChild(tituloDaTela(config.id, config.label));
      VIEW.appendChild(h("p", {class: "view", text: config.lead}));
      if (config.minimum && !can(config.minimum)){
        VIEW.appendChild(h("div", {class: "card"}, h("div", {class: "empty",
          text: "Somente a coordenação pode alterar estes registros. Você pode consultá-los abaixo."})));
      } else {
        const formHost = h("div", {class: "card sec"});
        const spec = {fields: config.fields, submitLabel: config.submitLabel || "Cadastrar"};
        formHost.appendChild(h("h3", {style: "margin-bottom:12px", text: config.formTitle}));
        formHost.appendChild(buildForm(spec, {}, async function (payload){
          const result = await api("/api/" + config.entity, "POST", payload);
          toast(result.written + " registro(s) gravado(s).");
          await loadLookups();
          VIEWS[config.id].render();
        }));
        VIEW.appendChild(formHost);
      }
      const data = await api("/api/" + config.entity + "?limit=" + (config.limit || 400));
      const bar = h("div", {class: "rowbar"}, [
        h("h3", {text: config.listTitle + " (" + data.count + ")"}),
        h("input", {class: "searchbar", type: "search", placeholder: "Filtrar…",
          oninput: function (ev){
            const term = ev.target.value.toLowerCase();
            host.innerHTML = "";
            host.appendChild(table(config.columns, data.items.filter(function (row){
              return JSON.stringify(row).toLowerCase().includes(term);
            }), "Nenhum registro corresponde ao filtro."));
          }}),
      ]);
      const host = h("div", {}, table(config.columns, data.items));
      VIEW.appendChild(h("div", {class: "sec"}, [bar, host]));
    },
  };
}

VIEWS.artigos = crudView({
  id: "artigos", entity: "articles", label: "Artigos", group: "Produção",
  lead: "Cadastre um artigo novo ou atualize um existente — o título é a chave, então repetir o mesmo título atualiza o registro.",
  formTitle: "Novo artigo / atualizar existente", listTitle: "Artigos no banco",
  fields: [
    field("Título", "Título", "text", {required: true, span: "full"}),
    field("Autores", "Autores", "text", {required: true, span: "full",
      hint: "Separe por ponto e vírgula, na ordem de autoria. Marque o correspondente com *."}),
    field("Responsável", "Responsável"),
    field("Status", "Situação", "select", {options: STATUS_OPTS}),
    field("Linha de pesquisa", "Linha de pesquisa", "select",
      {options: function (){ return CACHE.lines; }}),
    field("Tipo de estudo", "Tipo de estudo", "text", {placeholder: "Ensaio clínico, revisão…"}),
    field("Data de início", "Início do artigo", "date"),
    field("Data da primeira versão", "1ª versão", "date"),
    field("Data segunda versão", "2ª versão", "date"),
    field("Data terceira versão", "3ª versão", "date"),
    field("Data quarta versão", "4ª versão", "date"),
    field("Data versão final", "Versão final", "date"),
    field("Revisão interna", "Revisão interna", "date"),
    field("Data de submissão", "1ª submissão", "date"),
    field("Data do aceite", "Aceite", "date"),
    field("Data de publicação", "Publicação", "date"),
    field("Periódico", "Periódico"),
    field("Ano", "Ano de publicação", "number"),
    field("DOI", "DOI", "text", {hint: "Com DOI o sistema busca citações sozinho."}),
    field("Qualis", "Qualis"),
    field("Fator de impacto", "Fator de impacto", "number", {step: "0.001"}),
    field("Link", "Link"),
    field("Observações", "Observações", "textarea", {span: "full"}),
  ],
  columns: [
    {k: "internal_code", label: "ID"},
    {k: "title", label: "Título"},
    {k: "authors", label: "Autores", render: function (r){
      return r.authors && r.authors.length > 46 ? r.authors.slice(0, 45) + "…" : r.authors; }},
    {k: "status", label: "Situação", render: function (r){
      return h("span", {class: "badge" + (r.status === "publicado" ? " ok" :
        (r.status === "rejeitado" ? " bad" : "")), text: r.status}); }},
    {k: "year_published", label: "Ano", num: true},
    {k: "submission_attempts", label: "Tentativas", num: true},
  ],
});

VIEWS.submissoes = crudView({
  id: "submissoes", entity: "submissions", label: "Submissões", group: "Produção",
  lead: "Registre cada envio a uma revista. A tentativa 2 do mesmo artigo cria o histórico que alimenta os tempos de ressubmissão.",
  formTitle: "Registrar submissão", listTitle: "Submissões registradas",
  fields: [
    field("Artigo", "Artigo", "select", {required: true, span: "full",
      options: function (){
        return CACHE.articles.map(function (a){
          return {value: a.title, label: (a.internal_code ? a.internal_code + " — " : "") + a.title};
        });
      }}),
    field("Tentativa", "Nº da tentativa", "number",
      {hint: "Deixe em branco para numerar automaticamente."}),
    field("Revista", "Revista", "text", {required: true}),
    field("ISSN", "ISSN"),
    field("Data de submissão", "Data da submissão", "date", {required: true}),
    field("Decisão", "Decisão", "select", {options: DECISION_OPTS}),
    field("Data da decisão", "Data da decisão", "date"),
    field("Motivo da recusa", "Motivo da recusa", "select",
      {options: function (){ return CACHE.reasons; }, span: "full"}),
    field("Rodadas", "Rodadas de revisão", "number"),
    field("Observações", "Observações", "textarea", {span: "full"}),
  ],
  columns: [
    {k: "article_title", label: "Artigo", render: function (r){
      return r.article_title && r.article_title.length > 50
        ? r.article_title.slice(0, 49) + "…" : r.article_title; }},
    {k: "attempt_no", label: "Tent.", num: true},
    {k: "journal", label: "Revista"},
    {k: "submitted_on", label: "Submissão", render: function (r){ return dt(r.submitted_on); }},
    {k: "decision", label: "Decisão", render: function (r){
      return h("span", {class: "badge" + (r.decision === "aceito" ? " ok" :
        (r.decision && r.decision.includes("reje") || r.decision === "desk_reject" ? " bad" : " warn")),
        text: r.decision || "—"}); }},
    {k: "decision_on", label: "Decisão em", render: function (r){ return dt(r.decision_on); }},
    {k: "rejection_reason_label", label: "Motivo"},
  ],
});

VIEWS.projetos = crudView({
  id: "projetos", entity: "projects", label: "Projetos", group: "Produção",
  lead: "Projetos de pesquisa e extensão. A coluna de integrantes é o que liga cada pesquisador aos projetos de que participa.",
  formTitle: "Novo projeto", listTitle: "Projetos",
  fields: [
    field("Projeto", "Título do projeto", "text", {required: true, span: "full"}),
    field("Código", "Código", "text", {placeholder: "PROJ-01"}),

    VIEW.appendChild(h("p", {class: "view",
      text: "Rodar os agentes, revisar o que o rastreador encontrou e liberar acesso a novos integrantes."}));

    const agentBox = h("div", {class: "card sec"}, [
      h("h3", {text: "Agentes"}),
      h("p", {class: "hint", style: "margin:4px 0 12px",
        text: "O curador recarrega planilhas e recalcula tudo. O rastreador vai às bases externas — pode levar alguns minutos."}),
      h("div", {class: "actions"}, [
        h("button", {class: "primary", text: "Rodar curador", onclick: function (ev){
          runAgent(ev.target, "/api/agents/curator", {with_tracker: false}); }}),
        h("button", {text: "Rastreador: citações", onclick: function (ev){
          runAgent(ev.target, "/api/agents/tracker", {tasks: ["enriquecer", "citar"]}); }}),
        h("button", {text: "Rastreador: perfis (índice h)", onclick: function (ev){
          runAgent(ev.target, "/api/agents/tracker", {tasks: ["perfis"]}); }}),
        h("button", {text: "Rastreador: descobrir", onclick: function (ev){
          runAgent(ev.target, "/api/agents/tracker", {tasks: ["descobrir"]}); }}),
      ]),
    ]);
    VIEW.appendChild(agentBox);

    /* O convite é o que faz o laboratório entrar sozinho: um link para o
       grupo, cada pessoa escolhe a própria senha, ninguém transmite senha

    const conviteBox = h("div", {class: "card sec"});

        field("perfil", "Perfil", "select",

async function runAgent(button, path, body){
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "Rodando…";
  try {
    await api(path, "POST", body);
    toast("Agente concluído. O painel já reflete os dados novos.");
  } catch (e){
    toast(e.message, "erro");
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}
async function reviewDiscovery(button, id, action){
  button.disabled = true;
  try {
    await api("/api/discoveries/" + id + "/review", "POST", {action: action});
    toast(action === "aceitar" ? "Artigo incorporado ao banco." : "Achado descartado.");
    VIEWS.admin.render();
  } catch (e){
    toast(e.message, "erro");
    button.disabled = false;
  }
}

/* ---------- convites ---------- */
async function desenharConvites(caixa){
  caixa.innerHTML = "";
  caixa.appendChild(h("h3", {text: "Convidar o laboratório"}));
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: "Gere um link e mande no grupo. Quem abrir escolhe a própria senha e "
        + "já cai no cadastro. Você não precisa criar conta por conta, nem passar senha a ninguém."}));

  const nome = h("input", {class: "searchbar", placeholder: "Equipe LAPE 2026", value: "Equipe LAPE"});
  const usos = h("input", {type: "number", min: "1", max: "200", value: "30", style: "max-width:110px"});
  const dias = h("input", {type: "number", min: "1", max: "90", value: "14", style: "max-width:110px"});
  /* Convite de coordenação existe para o caso do professor: ele precisa rodar
     os agentes e convidar os outros, e não faz sentido criar a conta dele à mão
     só por causa do perfil. Admin não entra na lista de propósito — esse se
     eleva depois, com a pessoa já identificada. */
  const perfil = h("select", {style: "max-width:170px"}, [
    h("option", {value: "integrante", text: "Integrante"}),
    h("option", {value: "coordenacao", text: "Coordenação"}),
    h("option", {value: "leitura", text: "Só leitura"}),
  ]);
  perfil.addEventListener("change", function (){
    // convite de coordenação é para uma pessoa específica, não para um grupo
    if (perfil.value === "coordenacao" && usos.value === "30"){
      usos.value = "1";
      nome.value = "Coordenação";
    }
  });
  const saida = h("div", {style: "margin-top:14px"});
  const gerar = h("button", {class: "primary", text: "Gerar link", onclick: async function (){
    gerar.disabled = true;
    try {
      const criado = await api("/api/invites", "POST", {
        nome: nome.value, usos: Number(usos.value) || 30, dias: Number(dias.value) || 14,
        perfil: perfil.value});
      mostrarLink(saida, criado.link, criado);
      const lista = caixa.querySelector("[data-lista]");
      if (lista) await preencherLista(lista);
    } catch (e){ toast(e.message, "erro"); }
    finally { gerar.disabled = false; }
  }});

  caixa.appendChild(h("div", {class: "actions", style: "align-items:flex-end"}, [
    h("div", {}, [h("label", {text: "Nome do convite"}), nome]),
    h("div", {}, [h("label", {text: "Perfil de quem entrar"}), perfil]),
    h("div", {}, [h("label", {text: "Quantas pessoas"}), usos]),
    h("div", {}, [h("label", {text: "Vence em (dias)"}), dias]),
    gerar,
  ]));
  caixa.appendChild(saida);

  const lista = h("div", {"data-lista": "1", style: "margin-top:18px"});
  caixa.appendChild(lista);
  await preencherLista(lista);
}

function mostrarLink(destino, link, criado){
  destino.innerHTML = "";
  const campo = h("input", {value: link, readonly: "readonly",
    style: "width:100%;font-family:var(--mono);font-size:12.5px",
    onclick: function (ev){ ev.target.select(); }});
  const copiar = h("button", {class: "primary", text: "Copiar link", onclick: async function (){
    try { await navigator.clipboard.writeText(link); copiar.textContent = "Copiado!"; }
    catch (e){ campo.select(); copiar.textContent = "Selecionado — use Ctrl+C"; }
    setTimeout(function (){ copiar.textContent = "Copiar link"; }, 2500);
  }});
  destino.appendChild(h("div", {class: "card", style: "background:var(--surface-raised)"}, [
    h("div", {class: "hint", style: "margin-bottom:8px",
      text: "Mande isto para as pessoas do laboratório:"}),
    campo,
    h("div", {class: "actions", style: "margin-top:10px"}, [copiar]),
    h("div", {class: "hint", style: "margin-top:8px",
      text: "Entra como " + ({integrante: "integrante", coordenacao: "coordenação",
             leitura: "só leitura"}[criado.user_role] || criado.user_role)
          + ". Vale para " + criado.max_uses + " pessoa(s) e vence em "
          + dt(criado.expires_at) + "."}),
  ]));
}

async function preencherLista(destino){
  destino.innerHTML = "";
  const convites = await api("/api/invites").catch(function (){ return []; });
  if (!convites.length){
    destino.appendChild(h("div", {class: "empty", text: "Nenhum convite gerado ainda."}));
    return;
  }
  destino.appendChild(h("h3", {text: "Convites", style: "font-size:13.5px;margin-bottom:8px"}));
  destino.appendChild(table(
    ["Nome", "Perfil", "Situação", "Usos", "Vence", ""],
    convites.map(function (c){
      const valido = c.state && c.state.valid;
      return [
        c.label || "—",
        c.user_role,
        h("span", {class: "badge " + (valido ? "s-publicado" : "s-rejeitado"),
                   text: valido ? "ativo" : (c.revoked ? "cancelado"
                        : ((c.state && c.state.reason) || "encerrado"))}),
        c.uses + " de " + c.max_uses,
        dt(c.expires_at),
        h("div", {class: "actions"}, [
          valido ? h("button", {text: "Ver link", onclick: function (ev){
            mostrarLink(ev.target.closest("[data-lista]").parentNode.querySelector("div"),
                        c.link, c);
          }}) : null,
          valido ? h("button", {text: "Cancelar", onclick: async function (){
            if (!confirm("Cancelar este convite? Quem ainda não usou não conseguirá se cadastrar."))
              return;
            await api("/api/invites/" + c.id + "/revogar", "POST", {});
            await preencherLista(destino);
          }}) : null,
        ]),
      ];
    })));
}

/* os mesmos ícones do painel: quem cadastra aqui reconhece a aba lá */
const ICONE = {
  perfil: "pessoas", artigos: "producao", submissoes: "submissao", projetos: "projeto",
  linhas: "linhas", eventos: "calendario", senha: "qualidade", admin: "dados",
};

/* Cabeçalho da tela, com o ícone da seção — o mesmo par do painel. */
function tituloDaTela(id, texto){
  const titulo = h("h2", {class: "view"});
  titulo.appendChild(Icons.get(ICONE[id] || "linha", 19));
  titulo.appendChild(h("span", {text: texto}));
  return titulo;
}

/* ---------- navegação ---------- */
const ORDER = ["perfil", "artigos", "submissoes", "projetos", "linhas", "eventos", "senha", "admin"];

function buildMenu(){
  MENU.innerHTML = "";
  let group = null;
  ORDER.forEach(function (id){
    const view = VIEWS[id];
    if (!view) return;
    if (view.minimum && !can(view.minimum) && id === "admin") return;
    if (view.group !== group){
      group = view.group;
      MENU.appendChild(h("div", {class: "group", text: group}));
    }
    const botao = h("button", {"data-view": id, onclick: function (){ location.hash = id; }});
    botao.appendChild(Icons.get(ICONE[id] || "linha", 17));
    botao.appendChild(h("span", {text: view.label}));
    MENU.appendChild(botao);
  });
}
async function show(id){
  const view = VIEWS[id] || VIEWS.perfil;
  MENU.querySelectorAll("button").forEach(function (b){
    b.classList.toggle("active", b.dataset.view === id);
  });
  VIEW.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    await view.render();
  } catch (e){
    VIEW.innerHTML = "";
    VIEW.appendChild(h("div", {class: "card"}, h("div", {class: "empty", text: e.message})));
  }
}
window.addEventListener("hashchange", function (){
  show(location.hash.replace("#", "") || "perfil");
});
document.getElementById("sair").addEventListener("click", async function (){
  await api("/api/auth/logout", "POST", {});
  location.href = "/entrar";
});

(async function boot(){
  try {
    ME = await api("/api/auth/me");
  } catch (e){
    location.href = "/entrar?next=/app";
    return;
  }
  const who = document.getElementById("who");
  who.appendChild(h("b", {text: ME.full_name}));
  who.appendChild(h("span", {class: "badge", text: ME.user_role || "integrante"}));
  await loadLookups();
  buildMenu();
  await show(location.hash.replace("#", "") || (ME.must_change_password ? "senha" : "perfil"));
  if (ME.must_change_password) toast("Defina uma senha nova para continuar.", "erro");
})();
</script>
