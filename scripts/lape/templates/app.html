<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do integrante — LAPE</title>
<style>__BASE_CSS__
header.top{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--border);padding:11px clamp(14px,3vw,28px);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background:var(--grad-card);
  pointer-events:none}
header.top>*{position:relative}
header.top .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px}
header.top .name{font-weight:700;letter-spacing:-.01em}
header.top .name small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2)}
header.top .spacer{flex:1}
header.top .who{font-size:13px;color:var(--ink-2);text-align:right}
header.top .who b{display:block;color:var(--ink)}
.layout{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0;
  min-height:calc(100vh - 58px)}
@media (min-width:861px){
  .layout{background:linear-gradient(90deg,var(--surface) 0 211px,
    var(--border) 211px 212px,transparent 212px)}
  nav.side{background:none;border-right:none}
}
nav.side{border-right:1px solid var(--border);padding:18px 12px;background:var(--surface)}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;box-shadow:none;padding:9px 11px;border-radius:10px;
  color:var(--ink-2);font-size:13.5px;font-weight:550;position:relative}
nav.side button svg.icon{color:var(--ink-muted);font-size:17px;flex:none}
nav.side button:hover{background:var(--surface-raised);color:var(--ink)}
nav.side button:hover svg.icon{color:var(--ink-2)}
nav.side button.active{background:var(--accent-wash);color:var(--accent);font-weight:700}
nav.side button.active svg.icon{color:var(--accent)}
nav.side button.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;
  width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
nav.side .group{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);
  margin:16px 11px 6px;font-weight:700}
h2.view{display:flex;align-items:center;gap:9px}
h2.view svg.icon{color:var(--accent);font-size:19px}
main{padding:26px clamp(14px,3vw,34px) 70px;max-width:1180px}
h2.view{font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
p.view{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px}
.kpi .label{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;
  font-weight:700}
.kpi .value{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sec{margin-bottom:26px}

/* ---- ponto: o estado tem de ser lido de longe ---- */
.card.marcar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  justify-content:space-between;margin-bottom:22px}
.card.marcar.dentro{border-color:color-mix(in srgb,var(--good) 52%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 22%,transparent)}
.card.marcar .estado{display:flex;align-items:center;gap:12px}
.card.marcar .estado b{font-size:15.5px}
.card.marcar .estado small{display:block;color:var(--ink-2);margin-top:2px}
.acao-ponto{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acao-ponto input{min-width:min(300px,60vw)}
/* verde a pulsar = dentro. O ponto pisca, mas o rótulo ao lado é que
   informa: quem não distingue a cor lê "Dentro desde 14:03" do mesmo jeito. */
.pulso-vivo{width:11px;height:11px;border-radius:50%;background:var(--good);flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);
  animation:bater 2.2s ease-out infinite}
.parado{width:11px;height:11px;border-radius:50%;flex:none;
  background:var(--ink-muted);opacity:.5}
@keyframes bater{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
@media (prefers-reduced-motion: reduce){ .pulso-vivo{animation:none} }
.agora{display:flex;flex-direction:column;gap:9px}
.quem-agora{display:flex;align-items:center;gap:10px;padding:8px 11px;
  border-radius:var(--radius-sm);background:var(--surface-raised);
  border:1px solid var(--border)}
.quem-agora.eu{border-color:var(--accent);background:var(--accent-wash)}
.quem-agora b{font-size:13.5px}
.quem-agora small{display:block;color:var(--ink-2);font-size:12px}
.hint.aviso{color:var(--warning)}
/* Sair não é erro: o botão se distingue pela borda, não pela cor de alerta.
   Vermelho aqui ensinaria a associar "fim do expediente" a problema. */
button.sair-ponto{border-color:var(--ink-muted);font-weight:700}
button.sair-ponto:hover{border-color:var(--ink-2);background:var(--surface-hover)}
.sec h3{font-size:14.5px;margin-bottom:10px}
.rowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.searchbar{max-width:280px}
.pick{cursor:pointer}
.pick:hover{color:var(--accent-strong)}
/* ---- biblioteca ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap}
.chip:hover{border-color:var(--border-strong);color:var(--ink)}
/* O escolhido ganha PESO, e não outro matiz: trocar a cor faria parecer
   que o segmento mudou de categoria, e não que ele está selecionado. */
.chip.on{border-color:var(--accent-strong);color:var(--accent-strong);font-weight:720}
/* Segmento que a busca não achou continua na tela, apagado: sumir com ele
   faria a tela afirmar que ninguém estuda o assunto. */
.chip.vazio{opacity:.5}
.bib-item{margin-bottom:10px;padding:14px 16px}
.bib-topo{display:flex;flex-direction:column;gap:3px}
.bib-autores{margin:6px 0 0;font-size:12px;line-height:1.5}
.bib-item details{margin-top:8px}
.bib-item summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.bib-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bib-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:7px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);font-size:12px;font-weight:600;text-decoration:none}
.bib-link:hover{border-color:var(--border-strong);color:var(--ink)}
/* O que abre o ARTIGO tem peso; o que abre uma busca, não. Quem clica
   esperando o artigo e cai numa busca passa a conferir todos os botões,
   e aí nenhum deles serve para nada. */
.bib-link.direto{border-color:var(--accent-strong);color:var(--accent-strong)}
.bib-link.livre::after{content:"livre";font-size:9.5px;opacity:.75;
  text-transform:uppercase;letter-spacing:.04em}

.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.kpi-simples{flex:1 1 160px;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;background:var(--surface)}
.kpi-simples .rot{font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-muted)}
.kpi-simples .num{font-size:22px;font-weight:750;margin:4px 0 2px;
  font-variant-numeric:tabular-nums}
.grade-bib{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card.mini{padding:12px 14px;margin:0}
.card.mini .num{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.card.mini:hover{border-color:var(--accent-strong)}
table.matriz th{font-weight:650;font-size:12px}
table.matriz td.celula{text-align:center;font-variant-numeric:tabular-nums}

/* ---- auditoria de identidade: fichas repetidas, divididas e vinculo ---- */
.identidade-painel{border-color:color-mix(in srgb,var(--accent-strong) 20%,var(--border))}
.identidade-cabecalho{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.identidade-cabecalho svg.icon{color:var(--accent)}
.identidade-cabecalho h2{font-size:16.5px;margin:0}
.identidade-sub{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}
.identidade-sub:first-of-type{border-top:none;padding-top:0;margin-top:14px}
.identidade-sub-titulo{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.identidade-sub-titulo svg.icon{color:var(--ink-2);font-size:15px}
.identidade-sub-titulo h4{font-size:13px;margin:0}
.identidade-sub-titulo .contagem{margin-left:auto;font-size:11px;font-weight:700;
  color:var(--ink-2);background:var(--surface-raised);border:1px solid var(--border);
  border-radius:999px;padding:2px 9px}
.identidade-sub-titulo .contagem.tem{color:var(--warning);
  border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}
/* Avatar de iniciais: a mesma pessoa tem sempre a mesma cor nas duas telas
   (aqui e no par de fusão), pela mesma regra de hash do nome -- nao muda
   a cada renderizacao nem depende de que outras fichas apareceram junto. */
.pessoa-avatar{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;flex:none;font-size:12.5px;font-weight:750;
  color:var(--cor);background:color-mix(in srgb,var(--cor) 16%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cor) 38%,var(--border))}
.pessoa-avatar.pequeno{width:26px;height:26px;font-size:10.5px}
.par-identidade{display:flex;align-items:center;gap:14px;padding:14px 16px;
  margin-bottom:10px;flex-wrap:wrap}
.par-identidade .quem{display:flex;align-items:center;gap:10px;min-width:0}
.par-identidade .quem b{font-size:13.5px;display:block;line-height:1.3}
.par-identidade .quem small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:1px}
.par-seta{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;
  color:var(--ink-muted)}
.par-seta svg.icon{font-size:16px}
.par-seta small{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap}
.par-identidade .miolo{flex:1 1 auto;min-width:220px}
.par-identidade .acao{flex:none;display:flex;flex-direction:column;align-items:flex-end;
  gap:6px}
.pessoa-linha{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:8px}
.pessoa-linha .miolo{flex:1 1 auto;min-width:0}
.pessoa-linha .miolo b{font-size:13.5px}
.pessoa-linha .miolo small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px}

/* ---- globo ---- */
.globo-palco{display:flex;justify-content:center}
.globo-palco svg{max-width:min(100%,480px);height:auto}
.globo-controles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.linha-tempo{flex:1;min-width:180px;accent-color:var(--accent-strong)}
.bandeiras{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bandeira-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);font-size:12.5px;cursor:pointer}
.bandeira-btn:hover{border-color:var(--accent-strong);color:var(--ink)}
.bandeira-btn .nome{font-weight:620}
.bandeira-btn small{font-variant-numeric:tabular-nums;color:var(--ink-muted)}

/* A atualizacao dos acervos: os botoes, a trilha e o recado.
   A trilha usa --accent-strong, e nao a cor de estado: "em andamento"
   nao e bom nem ruim, e pintar de verde faria a barra dizer que o
   resultado veio bom antes de ele existir. */
.atz{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.atz .botoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.atz .trilha{height:7px;border-radius:99px;background:var(--grid);overflow:hidden}
.atz .trilha i{display:block;height:100%;width:0;border-radius:99px;
  background:var(--accent-strong);transition:width .4s ease}
.atz .trilha.indefinida i{width:35%;animation:atz-vai 1.5s ease-in-out infinite}
@keyframes atz-vai{0%{margin-left:-35%}100%{margin-left:100%}}
.atz .recado{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.atz .recado b{color:var(--ink)}
.atz .parciais{font-size:12px;color:var(--ink-muted);display:flex;gap:10px;
  flex-wrap:wrap}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:3px;padding:10px}
  nav.side .group{width:100%;margin:6px 8px 2px}
  nav.side button{width:auto}
}

/* ---- caminho do artigo: funil temático, hierárquico ----
   Não é um funil de verdade -- cada etapa conta uma coisa diferente
   (referência, registro triado, artigo), sem porcentagem entre elas
   (ver o aviso no fim da lista). A largura decrescente é só a
   metáfora visual de um processo que afunila. */
.caminho-funil{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
  align-items:center;gap:0;max-width:820px;margin-inline:auto}
.etapa-item{display:flex;flex-direction:column;align-items:center;width:100%}
.card.etapa{width:calc(100% - var(--i,0) * 6%);margin-inline:auto;display:flex;
  flex-direction:column;gap:10px;position:relative;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--tom) 30%,transparent),
    0 14px 28px -18px color-mix(in srgb,var(--tom) 55%,transparent);
  animation:etapa-surge .5s cubic-bezier(.16,.84,.3,1) both;
  animation-delay:calc(var(--i,0) * .09s)}
@keyframes etapa-surge{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.etapa-topo{display:flex;align-items:center;gap:14px}
.etapa-titulo h3{margin:0 0 3px;font-size:15px}
.etapa-meio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.etapa-meio .num-grande{font-size:28px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--tom)}
.etapa-baixo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.etapa-saiba{flex:1 1 auto;min-width:200px}
.etapa-saiba summary{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--tom);list-style:none}
.etapa-saiba summary::-webkit-details-marker{display:none}
.etapa-saiba summary::after{content:" ▾"}
.etapa-saiba[open] summary::after{content:" ▴"}
.etapa-saiba ul{list-style:none;margin:8px 0 0;padding:10px 12px;border-radius:10px;
  border-left:3px solid var(--tom);background:color-mix(in srgb,var(--tom) 9%,var(--surface));
  display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
@media not (prefers-reduced-motion: reduce){
  .etapa-saiba[open] ul{animation:caminho-abre .3s ease both}
}
@keyframes caminho-abre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.etapa-conector{width:3px;height:22px;margin:2px 0;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--tom) 35%,transparent)}
.etapa-conector::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--tom2)}
.etapa-conector::before{content:"";position:absolute;left:0;top:-26px;width:100%;height:26px;
  background:linear-gradient(color-mix(in srgb,var(--tom2) 95%,transparent),transparent);
  animation:etapa-flui 1.4s linear infinite}
@keyframes etapa-flui{from{transform:translateY(-26px)}to{transform:translateY(48px)}}
@media (prefers-reduced-motion: reduce){
  .card.etapa{animation:none}
  .etapa-conector::before{animation:none}
}
@media (max-width:860px){
  .card.etapa{width:100%}
  .etapa-baixo{flex-direction:column;align-items:stretch}
}
</style>
</head>

<script>
"use strict";
const C = Charts;

/* ---------- infraestrutura ---------- */
const VIEW = document.getElementById("view");
const MENU = document.getElementById("menu");
const TOAST = document.getElementById("toast");
let ME = null;
let CACHE = {};

function h(tag, attrs, kids){
  const node = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : (kids ? [kids] : [])).forEach(function (kid){
    if (kid === null || kid === undefined || kid === false) return;
    node.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  });
  return node;
}
async function api(path, method, body){
  const response = await fetch(path, {
    method: method || "GET",
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 401){ location.href = "/entrar?next=/app"; throw new Error("sessão expirada"); }
  const data = await response.json().catch(function (){ return {}; });
  /* "rota não encontrada" quase nunca é a tela pedindo coisa errada: é o
     servidor rodando código anterior ao da pasta. As telas são lidas do
     disco a cada acesso e as rotas só quando o processo sobe, então um
     `git pull` sem reiniciar deixa a tela nova batendo numa API velha.
     Vale a pena conferir antes de devolver um erro que não diz o que
     fazer. */
  if (response.status === 404 && /rota n[ãa]o encontrada/i.test(data.error || "")){
    avisarServidorVelho();
  }
  if (!response.ok) throw new Error(data.error || ("erro " + response.status));
  return data;
}

/* O aviso aparece uma vez, no alto da página, e só depois de confirmar
   com o servidor -- acusar "versão velha" por causa de um 404 qualquer
   seria trocar um erro confuso por outro. */
let avisouVelho = false;
async function avisarServidorVelho(){
  if (avisouVelho) return;
  avisouVelho = true;
  let saude;
  try {
    saude = await (await fetch("/api/health")).json();
  } catch (e){ return; }
  const c = (saude || {}).codigo || {};
  if (!c.desatualizado) return;
  const faixa = h("div", {class: "faixa-velha"}, [
    h("b", {text: "O servidor está numa versão anterior à da pasta."}),
    h("span", {text: " As telas já são as novas, mas as rotas não — por isso "
      + "algumas partes desta página dizem “rota não encontrada”. "
      + "Feche a janela preta do LAPE e dê duplo clique em “Subir LAPE” de novo."}),
    h("small", {text: "no ar desde " + (c.subiu_em || "?").replace("T", " ")
      + " · código na pasta de " + (c.codigo_de || "?").replace("T", " ")}),
  ]);
  document.body.insertBefore(faixa, document.body.firstChild);
}
let toastTimer = null;
function toast(message, kind){
  TOAST.textContent = message;
  TOAST.className = "toast on" + (kind === "erro" ? " erro" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ TOAST.className = "toast"; }, 4200);
}
function dt(iso){
  if (!iso) return "—";
  const p = String(iso).slice(0, 10).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(iso);
}
function isoDate(value){ return value ? String(value).slice(0, 10) : ""; }
function rank(role){ return {leitura: 0, integrante: 1, coordenacao: 2, admin: 3}[role] || 0; }
function can(minimum){ return ME && rank(ME.user_role) >= rank(minimum); }

/* ---------- formulários ---------- */
function field(key, label, type, extra){
  return Object.assign({key: key, label: label, type: type || "text"}, extra || {});
}
function buildForm(spec, values, onSubmit){
  values = values || {};
  const grid = h("div", {class: "grid g2"});
  const inputs = {};
  spec.fields.forEach(function (f){
    const id = "f_" + f.key.replace(/\W+/g, "_");
    let input;
    const preset = f.from ? values[f.from] : values[f.key];
    if (f.type === "textarea"){
      input = h("textarea", {id: id, placeholder: f.placeholder || ""});
      input.value = preset || "";
    } else if (f.type === "select"){
      input = h("select", {id: id});
      const options = typeof f.options === "function" ? f.options() : (f.options || []);
      input.appendChild(h("option", {value: "", text: f.placeholder || "— selecione —"}));
      options.forEach(function (opt){
        const value = typeof opt === "object" ? opt.value : opt;
        const text = typeof opt === "object" ? opt.label : opt;
        input.appendChild(h("option", {value: value, text: text}));
      });
      /* Uma lista vazia é um campo que não se pode preencher, e sem
         explicação ele parece defeito -- foi assim que "Orientador" ficou:
         a lista sai de quem tem vínculo de coordenação, professor ou
         pós-doutorado, e ninguém tinha vínculo preenchido, então o único
         item era "— selecione —". O aviso diz onde se resolve. */
      if (!options.length && f.vazio){
        input.disabled = true;
        input.firstChild.textContent = "— nada para escolher —";
        f = Object.assign({}, f, {hint: f.vazio});
      }
      const vazio = preset === null || preset === undefined || preset === "";
      /* O que está gravado e não está na lista entra na lista, marcado.
         Sem isto o navegador simplesmente ignora o valor desconhecido, o
         seletor abre em "— selecione —" e salvar o registro APAGA o que
         lá estava: um artigo cujo tipo de estudo foi digitado à mão antes
         de o campo virar lista, ou cuja linha de pesquisa saiu das opções,
         perderia o dado ao ser editado por qualquer outro motivo. */
      if (!vazio && !options.some(function (opt){
            return String(typeof opt === "object" ? opt.value : opt) === String(preset); })){
        input.appendChild(h("option", {value: String(preset),
          text: String(preset) + " (fora da lista)"}));
      }
      const sugerido = typeof f.padrao === "function" ? f.padrao() : f.padrao;
      input.value = vazio && sugerido && options.indexOf(sugerido) >= 0
        ? sugerido
        : (vazio ? "" : String(preset));
    } else if (f.type === "checkbox"){
      input = h("input", {id: id, type: "checkbox"});
      input.checked = !!preset;
    } else {
      input = h("input", {id: id, type: f.type, step: f.step, placeholder: f.placeholder || ""});
      input.value = f.type === "date" ? isoDate(preset) : (preset === null || preset === undefined ? "" : preset);
    }
    if (f.required) input.required = true;
    inputs[f.key] = {input: input, spec: f};
    grid.appendChild(h("div", {class: f.span === "full" ? "full" : null}, [
      h("label", {for: id, text: f.label + (f.required ? " *" : "")}),
      input,
      f.hint ? h("div", {class: "hint", style: "margin-top:4px", text: f.hint}) : null,
    ]));
  });

  const button = h("button", {class: "primary", type: "submit", text: spec.submitLabel || "Salvar"});
  const form = h("form", {}, [
    grid,
    h("div", {class: "actions", style: "margin-top:16px"}, [
      button,
      spec.onCancel ? h("button", {type: "button", class: "ghost", text: "Cancelar",
        onclick: spec.onCancel}) : null,
    ]),
  ]);
  form.addEventListener("submit", async function (ev){
    ev.preventDefault();
    const payload = {};
    for (const key in inputs){
      const {input, spec: f} = inputs[key];
      let value = f.type === "checkbox" ? (input.checked ? "Sim" : "Não") : input.value.trim();
      /* O campo vazio vai junto, SEMPRE. Sem ele o servidor não tem como
         saber a diferença entre "a pessoa apagou este valor" e "esta coluna
         não veio" -- e como a gravação descarta vazios de propósito (para
         que uma planilha de meia dúzia de colunas não limpe o cadastro
         inteiro), apagar na tela não apagava nada: o Qualis voltava sozinho.

         No cadastro de registro novo mandar o vazio não muda nada: aquele
         caminho descarta vazio de qualquer jeito. Mandar sempre é o que
         faz o formulário de cima também apagar, quando ele descobre que o
         título já existe e a pessoa confirma que quer atualizar. */
      payload[key] = value;
    }
    if (spec.extra) Object.assign(payload, spec.extra(values));
    button.disabled = true;
    const original = button.textContent;
    button.textContent = "Salvando…";
    try {
      await onSubmit(payload);
    } catch (e){
      toast(e.message, "erro");
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  });
  return form;
}
function table(cols, rows, emptyMessage){
  if (!rows || !rows.length)
    return h("div", {class: "tw"}, h("div", {class: "empty", text: emptyMessage || "Nada por aqui ainda."}));
  return h("div", {class: "tw"}, h("table", {}, [
    h("thead", {}, h("tr", {}, cols.map(function (c){
      return h("th", {class: c.num ? "num" : null, text: c.label}); }))),
    h("tbody", {}, rows.map(function (row){
      return h("tr", {}, cols.map(function (c){
        const value = c.render ? c.render(row) : row[c.k];
        const cell = h("td", {class: c.num ? "num" : null});
        if (value && typeof value === "object") cell.appendChild(value);
        else cell.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
        return cell;
      }));
    })),
  ]));
}

async function loadLookups(){
  const [lines, articles, reasons, projects, equipe] = await Promise.all([
    api("/api/research-lines?limit=200").catch(function (){ return {items: []}; }),
    api("/api/articles?limit=1000"),
    api("/api/rejection-reasons?limit=200").catch(function (){ return {items: []}; }),
    api("/api/projects?limit=300").catch(function (){ return {items: []}; }),
    api("/api/equipe").catch(function (){ return {items: []}; }),
  ]);
  /* Só as linhas ativas viram opção. Uma linha que saiu da lista continua
     no banco e continua contando os artigos que já apontavam para ela --
     mas oferecê-la em artigo novo é convidar a coordenação a repovoar
     justamente o que ela acabou de encerrar. A tela de Linhas de pesquisa
     mostra as duas, com selo de encerrada. */
  CACHE.lines = lines.items.filter(function (l){
    return l.active === undefined || l.active === null || !!l.active;
  }).map(function (l){ return l.name; });
  CACHE.articles = articles.items;
  CACHE.reasons = reasons.items.map(function (r){ return r.label; });
  CACHE.projects = projects.items;
  CACHE.equipe = equipe.items;
  /* Só quem orienta entra na lista de orientadores. A pessoa não aparece na
     própria lista: ninguém orienta a si mesmo, e ver o próprio nome ali é
     convite para o clique errado. */
  CACHE.orientadores = equipe.items
    .filter(function (p){ return p.orienta && p.id !== ME.id; })
    .map(function (p){ return p.full_name; });
  /* Coorientação é mais larga: mestrandos e doutorandos coorientam os
     bolsistas, e por isso entram aqui -- e não na lista de orientadores. */
  CACHE.coorientadores = equipe.items
    .filter(function (p){ return (p.coorienta || p.orienta) && p.id !== ME.id; })
    .map(function (p){ return p.full_name; });
  /* No LAPE a orientação é de uma pessoa só. A ficha já abre com o nome
     dela preenchido -- é um select, quem tiver outro orientador troca. O
     servidor só manda o padrão se essa pessoa existir e puder orientar:
     sugerir um nome fora da lista seria um campo que se recusa a gravar
     o que mostra. */
  CACHE.orientadorPadrao =
    equipe.orientador_padrao !== ME.full_name ? equipe.orientador_padrao : null;
}

/* Avatar de iniciais para uma pessoa: mesma cor sempre para o mesmo nome
   (hash do texto, e não a ordem de chegada), para que a ficha "Andrade"
   apareça com a mesma cor no par de fusão e na lista de vínculo. */
function avatarPessoa(nome, pequeno){
  const texto = (nome || "?").trim();
  const partes = texto.split(/\s+/).filter(Boolean);
  const iniciais = ((partes[0] || "?")[0] + (partes.length > 1 ? partes[partes.length - 1][0] : ""))
    .toUpperCase();
  let hash = 0;
  for (let i = 0; i < texto.length; i++) hash = (hash * 31 + texto.charCodeAt(i)) >>> 0;
  const cor = "var(--series-" + ((hash % 8) + 1) + ")";
  return h("span", {class: "pessoa-avatar" + (pequeno ? " pequeno" : ""),
    style: "--cor:" + cor, text: iniciais});
}

function crudView(config){

      VIEW.innerHTML = "";
      VIEW.appendChild(tituloDaTela(config.id, config.label));
      VIEW.appendChild(h("p", {class: "view", text: config.lead}));
      if (config.minimum && !can(config.minimum)){
        VIEW.appendChild(h("div", {class: "card"}, h("div", {class: "empty",
          text: "Somente a coordenação pode alterar estes registros. Você pode consultá-los abaixo."})));
      } else {
        if (config.atalho && can("coordenacao")){
          const estado = h("p", {class: "hint", style: "margin:6px 0 0",
            text: config.atalho.dica});
          const botao = h("button", {class: "primary", text: config.atalho.rotulo,
            onclick: async function (){
              botao.disabled = true;
              const antes = estado.textContent;
              estado.textContent = "Instalando…";
              try {
                const r = await api(config.atalho.rota, "POST", {});
                estado.textContent = config.atalho.contar(r);
                await VIEWS[config.id].render();
              } catch (e){
                estado.textContent = antes;
                toast(e.message, "erro");
              } finally { botao.disabled = false; }
            }});
          VIEW.appendChild(h("div", {class: "card sec"},
            [h("div", {class: "actions"}, [botao]), estado]));
        }
        /* um painel próprio da tela, entre o atalho e o cadastro -- é onde
           a tela de linhas põe o "fundir", que não é cadastro nem atalho */
        if (config.painel && can("coordenacao")){
          const casa = h("div", {class: "card sec"});
          VIEW.appendChild(casa);
          try { await config.painel(casa); } catch (e){ casa.appendChild(h("p", {class: "hint", text: e.message})); }
        }
        const formHost = h("div", {class: "card sec"});
        const titulo = h("h3", {style: "margin-bottom:12px", text: config.formTitle});
        formHost.appendChild(titulo);
        const spec = {fields: config.fields, submitLabel: config.submitLabel || "Cadastrar"};
        const gravar = async function (payload){
          /* O formulário de cima é de CADASTRO, mas gravar um título que
             já existe atualiza o registro existente em silêncio -- é como
             a importação de planilha funciona, e na tela vira armadilha:
             a pessoa acha que está criando, está editando outro registro,
             e o campo que ela esvaziou não é apagado, porque a gravação
             por título descarta vazios de propósito.

             Então se pergunta. E quando a resposta é sim, o pedido vai com
             o id do registro -- que é o caminho onde apagar apaga. */
          if (config.mesmoNome && !payload.registro_id){
            const achado = config.mesmoNome(payload);
            if (achado){
              if (!confirm("Já existe “" + (achado.title || achado.name) + "”.\n\n"
                  + "Atualizar esse registro com o que você preencheu? "
                  + "Campo deixado em branco será apagado.\n\n"
                  + "Cancele se queria cadastrar um registro novo — nesse caso "
                  + "mude o título.")) return;
              payload = Object.assign({}, payload, {registro_id: achado.id});
            }
          }
          const result = await api("/api/" + config.entity, "POST", payload);
          toast(result.written + " registro(s) gravado(s).");
          await loadLookups();
          VIEWS[config.id].render();
        };
        let formulario = buildForm(spec, {}, gravar);
        formHost.appendChild(formulario);
        VIEW.appendChild(formHost);
        /* Carregar um registro existente NO formulário, em vez de exigir que
           a pessoa redigite tudo para "atualizar". É o mesmo formulário e o
           mesmo caminho de gravação — só que já preenchido. */
        config.__carregar = function (row, rotulo){
          const novo = buildForm(Object.assign({}, spec, row ? {
            submitLabel: "Salvar alterações",
            /* O id da ficha aberta viaja junto. Sem ele a identidade do
               registro era o título, e renomear criava um SEGUNDO registro
               deixando o original intacto -- a tela dizia "1 registro
               gravado", a lista continuava igual, e o trabalho de quem
               editou ia junto. */
            extra: function (){ return {registro_id: row.id}; },
            onCancel: function (){ config.__carregar(null); },
          } : {}), row || {}, gravar);
          titulo.textContent = row ? (rotulo || "Editando registro") : config.formTitle;
          formHost.replaceChild(novo, formulario);
          formulario = novo;
          if (row) formHost.scrollIntoView({behavior: "smooth", block: "start"});
        };
      }
      const data = await api("/api/" + config.entity + "?limit=" + (config.limit || 400));
      /* Coluna de ação: um botão por linha, para mexer no registro que já
         existe sem redigitá-lo. Sem isso, "atualizar" significa preencher o
         formulário de novo — e ninguém faz isso, então o dado envelhece. */
      const acoes = [];
      if (config.editavel && config.__carregar) {
        acoes.push(function (row){
          return h("button", {type: "button", class: "ghost", text: "Editar",
            onclick: function (){
              config.__carregar(config.aoEditar ? config.aoEditar(row) : row,
                "Editando: " + (row.title || row.name || row.full_name || "registro"));
            }});
        });
      }
      if (config.acao) {
        acoes.push(function (row){
          return config.acao(row, function (){ VIEWS[config.id].render(); });
        });
      }
      const colunas = acoes.length
        ? config.columns.concat([{ k: "__acao", label: "", render: function (row){
            return h("div", {style: "display:flex;gap:6px;justify-content:flex-end"},
              acoes.map(function (fn){ return fn(row); })); } }])
        : config.columns;
      /* ---- os dois filtros, que se combinam ---- */
      /* Eram um só: uma caixa de texto que procurava o termo no registro
         inteiro. Para achar os bibliométricos você digitava "bibliom" e
         torcia. Os botões dizem QUE tipos existem e quantos há de cada um
         antes de você clicar — e isso a caixa de texto não faz, porque
         para ela o que não foi digitado não existe. */
      const filtro = {termo: "", valor: null};
      const host = h("div", {});
      const contador = h("h3", {});

      function visiveis(){
        return data.items.filter(function (row){
          if (filtro.valor !== null){
            const v = String(row[config.chips.campo] || "");
            /* `""` é o botão "sem tipo declarado": ele não é um valor, é a
               AUSÊNCIA dele, e sem um botão próprio esses registros só
               apareciam em "Todos" — onde se perdem no meio. */
            if (filtro.valor === "" ? v !== "" : v !== filtro.valor) return false;
          }
          if (!filtro.termo) return true;
          return JSON.stringify(row).toLowerCase().includes(filtro.termo);
        });
      }

      function repintar(){
        const lista = visiveis();
        host.innerHTML = "";
        host.appendChild(table(colunas, lista,
          "Nenhum registro corresponde ao filtro."));
        contador.textContent = config.listTitle
          + (lista.length === data.count
             ? " (" + data.count + ")"
             : " (" + lista.length + " de " + data.count + ")");
        if (botoes) botoes.forEach(function (b){
          b.classList.toggle("on", b.__valor === filtro.valor); });
      }

      let botoes = null;
      const barraDeChips = h("div", {class: "chips", style: "margin:0 0 10px"});
      if (config.chips){
        const campo = config.chips.campo;
        const conta = {};
        data.items.forEach(function (row){
          const v = String(row[campo] || "");
          conta[v] = (conta[v] || 0) + 1;
        });
        /* A ordem é a da lista declarada, e não a da contagem: um botão que
           muda de lugar quando alguém cadastra um artigo obriga a pessoa a
           procurar de novo o que ela clicou na semana passada. */
        const declarados = (config.chips.valores || []).slice();
        /* O que está no banco fora da lista entra no fim: é o texto que
           alguém escreveu à mão antes de o campo virar seletor, e esconder
           esses registros faria a soma dos botões não fechar com o total. */
        Object.keys(conta).forEach(function (v){
          if (v !== "" && declarados.indexOf(v) < 0) declarados.push(v);
        });

        const definir = function (valor){
          filtro.valor = valor;
          repintar();
        };
        botoes = [];
        const fazer = function (valor, rotulo, n){
          const b = h("button", {class: "chip" + (n ? "" : " vazio"),
            title: n ? null : "nenhum registro com este tipo ainda",
            text: rotulo + " (" + n + ")"});
          b.__valor = valor;
          b.onclick = function (){ definir(valor); };
          botoes.push(b);
          barraDeChips.appendChild(b);
        };
        fazer(null, "Todos", data.count);
        declarados.forEach(function (v){ fazer(v, v, conta[v] || 0); });
        if (conta[""]) fazer("", config.chips.vazio || "sem declarar", conta[""]);
        VIEW.appendChild(h("div", {class: "sec"}, [
          h("div", {class: "lab", style: "margin-bottom:6px",
            text: config.chips.rotulo || "FILTRAR POR"}),
          barraDeChips,
        ]));
      }

      const bar = h("div", {class: "rowbar"}, [
        contador,
        h("input", {class: "searchbar", type: "search", placeholder: "Filtrar…",
          oninput: function (ev){
            filtro.termo = ev.target.value.toLowerCase();
            repintar();
          }}),
      ]);
      VIEW.appendChild(h("div", {class: "sec"}, [bar, host]));
      repintar();
    },
  };
}

  ],
  editavel: true,
  aoEditar: function (row){
    return Object.assign({}, row, {__situacao: SITUACAO_ROTULO[row.status] || ""});
  },
  /* O título é a identidade do artigo: cadastrar um que já existe é, na
     verdade, editar o que existe. Perguntar antes evita a pessoa achar
     que criou um registro novo quando alterou outro. */
  mesmoNome: function (payload){
    const chave = String(payload["Título"] || "").trim().toLowerCase();
    if (!chave) return null;
    return (CACHE.articles || []).find(function (a){
      return String(a.title || "").trim().toLowerCase() === chave; }) || null;

  /* Excluir existia como necessidade e não como botão: até agora renomear
     um artigo criava uma CÓPIA em vez de alterar o original, e não havia
     rota de exclusão em lugar nenhum do sistema — as cópias ficavam. */

              + r.junto.autores + " autor(es), " + r.junto.submissoes + " submissão(ões))", "ok");
        await loadLookups();
        recarregar();
      } catch (e){
        toast(e.message, "erro");
        ev.target.disabled = false;

  columns: [
    {k: "internal_code", label: "ID"},
    {k: "title", label: "Título"},
    {k: "authors", label: "Autores", render: function (r){
      return r.authors && r.authors.length > 46 ? r.authors.slice(0, 45) + "…" : r.authors; }},
    {k: "status", label: "Situação", render: function (r){
      return h("span", {class: "badge" + (r.status === "publicado" ? " ok" :
        (r.status === "rejeitado" ? " bad" : "")),
        text: rotuloDe(SITUACAO_ROTULO, r.status)}); }},
    {k: "year_published", label: "Ano", num: true},
    {k: "submission_attempts", label: "Tentativas", num: true},
  ],
});

/* O desfecho de uma tentativa que JÁ existe.
   Registrar a recusa não pode obrigar a redigitar revista e data: a
   tentativa está lá, o que falta é dizer como ela terminou. O formulário
   abaixo pergunta só isso, e grava por cima da mesma tentativa — artigo e
   número são a chave, então não nasce submissão duplicada. */
/* O banco guarda a forma canônica ("em_producao"); o formulário mostra o
   rótulo ("Em produção"). Sem a tradução, editar um artigo abriria o
   seletor de situação em branco — e salvar apagaria a situação. */
const SITUACAO_ROTULO = {
  em_producao: "Em produção", submetido: "Submetido", em_revisao: "Em revisão",
  aceito: "Aceito", publicado: "Publicado", rejeitado: "Rejeitado",
  arquivado: "Arquivado",
};

const PROJETO_ROTULO = {
  em_andamento: "Em andamento", planejado: "Planejado",
  concluido: "Concluído", suspenso: "Suspenso",
};

/* O rótulo, e não a forma canônica.
   O banco guarda "em_producao" porque é isso que não muda de acento nem de
   maiúscula. A tela mostrava esse mesmo texto dentro de uma etiqueta, em
   cinco lugares -- lista de artigos, meus artigos, submissões e as duas de
   projetos. Quem lê "em_producao" no painel do laboratório lê um erro de
   sistema; e não era erro, era tradução que faltava. Valor sem tradução
   volta como veio, para nunca desaparecer da tela por não estar no mapa. */
function rotuloDe(mapa, valor){
  if (!valor) return "—";
  return mapa[valor] || valor;
}

const DECISAO_ROTULO = {
  em_avaliacao: "Em avaliação", revisao_solicitada: "Revisão solicitada",
  aceito: "Aceito", rejeitado: "Rejeitado", desk_reject: "Desk rejection",
  retirado: "Retirado",
};

function botaoDeDesfecho(row, recarregar){
  const jaTem = row.decision && row.decision !== "em_avaliacao";
  return h("button", {
    type: "button", class: jaTem ? "ghost" : "",
    text: jaTem ? "Alterar desfecho" : "Registrar desfecho",
    onclick: function (){ abrirDesfecho(row, recarregar); },
  });
}

function abrirDesfecho(row, recarregar){
  const anterior = document.getElementById("desfecho");
  if (anterior) anterior.remove();

  const spec = {
    submitLabel: "Gravar desfecho",
    fields: [
      field("Decisão", "Como terminou", "select",
        {options: DECISION_OPTS, required: true, from: "__decisao"}),
      field("Data da decisão", "Data da resposta", "date", {from: "decision_on"}),
      field("Motivo da recusa", "Motivo da recusa", "select",
        {options: function (){ return CACHE.reasons; }, span: "full",
         from: "rejection_reason_label",
         hint: "Só para recusa. Alimenta o gráfico de motivos no painel."}),
      field("Rodadas", "Rodadas de revisão", "number", {from: "review_rounds"}),
    ],
    /* A chave da tentativa vai junto, sem ser editável: é ela que faz o
       registro cair por cima do que já existe em vez de criar outro. */
    extra: function (){
      return {"Artigo": row.article_title, "Tentativa": row.attempt_no};
    },
    onCancel: function (){ const c = document.getElementById("desfecho"); if (c) c.remove(); },
  };

  const valores = Object.assign({}, row, {__decisao: DECISAO_ROTULO[row.decision] || ""});
  const cartao = h("div", {class: "card sec", id: "desfecho"}, [
    h("h3", {text: "Desfecho da tentativa " + row.attempt_no}),
    h("p", {class: "hint", text: [row.article_title, row.journal,
      row.submitted_on ? "enviado em " + dt(row.submitted_on) : null]
      .filter(Boolean).join(" · ")}),
    h("div", {style: "margin-top:14px"}, buildForm(spec, valores, async function (payload){
      await api("/api/submissions", "POST", payload);
      toast("Desfecho registrado. A situação do artigo foi atualizada.");
      await loadLookups();
      recarregar();
    })),
  ]);
  VIEW.insertBefore(cartao, VIEW.firstChild.nextSibling);
  cartao.scrollIntoView({behavior: "smooth", block: "center"});
}

/* ==================================================================== */
/* Ana — a pergunta em português, a resposta com a fonte junto          */
/*                                                                      */
/* Ana não adivinha: cada pergunta que ela entende está declarada no    */
/* servidor, com a consulta que a responde. Por isso a tela mostra      */
/* sempre três coisas na resposta — a frase, a lista por trás do número */
/* e a FONTE. Sem a fonte, um número na tela é indistinguível de um     */
/* palpite, e é esse número que acaba num relatório da CAPES.           */
/*                                                                      */
/* As perguntas de exemplo vêm do servidor, e não daqui: quem sabe o    */
/* que Ana responde é ela, e uma lista escrita na tela envelheceria em  */
/* silêncio a cada pergunta nova. Vêm já filtradas pelo perfil de quem  */
/* está olhando — oferecer a quem tem leitura uma pergunta que vai ser  */
/* recusada é ensinar o caminho da frustração.                          */
VIEWS.ana = {
  label: "Perguntar à Ana", group: "Laboratório",
  async render(){
    VIEW.innerHTML = "";
    VIEW.appendChild(tituloDaTela("ana", "Perguntar à Ana"));
    VIEW.appendChild(h("p", {class: "view", text:
      "Pergunte em português sobre o laboratório. Ana responde com o que está "
      + "no banco e diz de onde tirou cada número — e quando não sabe, ela diz "
      + "que não sabe, em vez de estimar."}));

    const campo = h("input", {type: "text", id: "ana-pergunta", autocomplete: "off",
      placeholder: "Quantos artigos publicamos este ano?",
      style: "flex:1 1 260px;min-width:0"});
    const botao = h("button", {class: "primary", text: "Perguntar"});
    const resposta = h("div", {id: "ana-resposta"});
    const sugestoes = h("div", {class: "chips", style: "margin-top:12px"});

    async function perguntar(texto){
      if (texto !== undefined) campo.value = texto;
      const pergunta = campo.value.trim();
      resposta.innerHTML = "";
      resposta.appendChild(h("div", {class: "empty", text: "Consultando o banco…"}));
      let d;
      try {
        d = await api("/api/ana?pergunta=" + encodeURIComponent(pergunta));
      } catch (e){
        resposta.innerHTML = "";
        resposta.appendChild(h("div", {class: "card"},
          h("div", {class: "empty", text: e.message})));
        return;
      }
      desenhar(d);
    }

    function desenhar(d){
      resposta.innerHTML = "";
      const cartao = h("div", {class: "card sec"});
      cartao.appendChild(h("p", {style: "margin:0;font-size:15.5px;line-height:1.5",
        text: d.resposta}));

      /* A lista é a conferência: o número sozinho pede fé, e a lista
         deixa quem pergunta discordar dele item a item. */
      if (d.itens && d.itens.length){
        /* Os rótulos das colunas vêm da resposta: "Motriz" embaixo de
           "Quanto" faz a coluna mentir sobre o que há nela. */
        const colunas = d.colunas || ["O quê", "Quanto"];
        cartao.appendChild(table(
          [{k: "rotulo", label: colunas[0]}, {k: "valor", label: colunas[1]}],
          d.itens, "—"));
      }
      if (d.fonte){
        cartao.appendChild(h("p", {class: "hint", style: "margin:10px 0 0",
          text: "de onde saiu: " + d.fonte}));
      }
      resposta.appendChild(cartao);
      preencherSugestoes(d.exemplos);
    }

    function preencherSugestoes(lista){
      if (!lista || !lista.length) return;
      sugestoes.innerHTML = "";
      sugestoes.appendChild(h("span", {class: "hint",
        style: "width:100%;margin:0 0 2px", text: "O que Ana sabe responder:"}));
      lista.forEach(function (x){
        sugestoes.appendChild(h("button", {class: "chip", text: x.pergunta,
          onclick: function (){ perguntar(x.pergunta); }}));
      });
    }

    botao.addEventListener("click", function (){ perguntar(); });
    campo.addEventListener("keydown", function (e){
      if (e.key === "Enter") perguntar();
    });

    VIEW.appendChild(h("div", {class: "card"}, [
      h("div", {style: "display:flex;gap:8px;flex-wrap:wrap"}, [campo, botao]),
      sugestoes,
    ]));
    VIEW.appendChild(resposta);
    /* A pergunta vazia devolve a lista de exemplos: a tela abre já
       dizendo o que dá para perguntar, em vez de um campo em branco. */
    const inicial = await api("/api/ana?pergunta=").catch(function (){ return {}; });
    preencherSugestoes(inicial.exemplos);
    campo.focus();
  },
};

/* Subir sozinho ao ligar o computador.

   Já existia como "Subir sozinho ao ligar.bat", ao lado do "Subir
   LAPE.bat" -- e um arquivo que resolve um problema só serve a quem
   lembra que ele existe. Os dois .bat ainda estão lá e continuam
   valendo: quem aperta aqui e quem dá duplo clique lá mexem na MESMA
   tarefa do Windows, porque o botão chama o mesmo script. */
async function subirSozinho(){
  const caixa = h("div", {class: "card sec"});
  caixa.appendChild(h("h3", {text: "Subir sozinho ao ligar o computador"}));

  const d = await api("/api/ao-ligar").catch(function (e){ return {erro: e.message}; });
  if (d.erro){
    caixa.appendChild(h("p", {class: "hint", text: d.erro}));
    return caixa;
  }
  if (!d.windows){
    /* Fora do Windows o botão não aparece, e a tela diz por quê em vez
       de mostrar um botão que não faria nada. */
    caixa.appendChild(h("p", {class: "hint", text: d.aviso}));
    return caixa;
  }

  const estado = h("p", {style: "margin:4px 0 10px;font-weight:600"});
  const detalhe = h("p", {class: "hint", style: "margin:0 0 12px"});
  const acao = h("button", {});
  const recado = h("div", {style: "margin-top:10px"});

  function pintar(x){
    estado.textContent = x.ligado
      ? "Ligado — o LAPE sobe sozinho quando você entra no Windows."
      : "Desligado — depois de ligar o computador, alguém precisa abrir o LAPE.";
    detalhe.textContent = x.ligado
      ? (x.como === "tarefa"
         ? "Pela tarefa agendada: ela se reergue sozinha se cair e funciona com "
           + "o notebook na bateria."
         : "Pelo atalho na pasta Inicializar. É o caminho de quem não é "
           + "administrador da máquina — sobe junto com o Windows, mas não se "
           + "reergue sozinho se cair.")
      : "A janela preta precisa ficar aberta enquanto o sistema estiver no ar: "
        + "é ela que mantém o endereço de pé.";
    acao.textContent = x.ligado ? "Desligar" : "Ligar";
    acao.className = x.ligado ? "" : "primary";
  }
  pintar(d);

  acao.onclick = async function (){
    const ligar = acao.textContent === "Ligar";
    acao.disabled = true;
    recado.innerHTML = "";
    try {
      const r = await api("/api/ao-ligar", "POST", {ligar: ligar});
      pintar(r);
      toast(ligar ? "O LAPE passa a subir sozinho." : "O LAPE não sobe mais sozinho.");
      /* O que o Windows respondeu vai junto: quando ele cai no atalho em
         vez da tarefa agendada, é nessa linha que isso aparece. */
      if (r.recado) recado.appendChild(h("p", {class: "hint", text: r.recado}));
    } catch (e){
      recado.appendChild(h("p", {class: "aviso", text: e.message}));
    }
    acao.disabled = false;
  };

  caixa.appendChild(estado);
  caixa.appendChild(detalhe);
  caixa.appendChild(acao);
  caixa.appendChild(recado);
  return caixa;
}

/* Atualizar o sistema pelo botão -- dispensa abrir o CMD.

   Chama o MESMO publicar.ps1 do .bat (ver scripts/lape/atualizar.py) e
   solta o processo: quem clicou não fica esperando o script inteiro
   terminar, só o pedido de "começa agora". A troca de verdade acontece
   atrás da tela -- o sistema atual continua no ar enquanto a versão
   nova é testada numa porta separada, e só troca depois de aprovada
   (ver a melhoria em deploy/publicar.ps1). Esta função acompanha a
   troca de fora, perguntando /api/health até ver o serviço cair (a
   troca em si, que leva poucos segundos) e voltar (a versão nova no
   ar) -- sem isso, o botão diria "pronto" achando que nada mudou. */
async function atualizarSistema(){
  const caixa = h("div", {class: "card sec"});
  caixa.appendChild(h("h3", {text: "Atualizar o sistema"}));
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px", text:
    "Puxa o código mais novo do repositório e troca o serviço sozinho — "
    + "o mesmo que rodar .\\deploy\\publicar.ps1 no PowerShell, sem precisar "
    + "abrir a janela preta. O sistema atual continua no ar enquanto a "
    + "versão nova é testada; a troca em si leva poucos segundos."}));

  const acao = h("button", {class: "primary", text: "Atualizar agora"});
  const status = h("p", {style: "margin-top:10px;font-weight:600"});
  const recado = h("div", {style: "margin-top:6px"});

  async function acompanhar(){
    const TENTATIVAS = 90;   // ~90 × 2s = 3 minutos de folga
    let viuQueda = false;
    for (let i = 0; i < TENTATIVAS; i++){
      await new Promise(function (r){ setTimeout(r, 2000); });
      let respondeu = false;
      try {
        const r = await fetch("/api/health", {cache: "no-store"});
        respondeu = r.ok;
      } catch (e){ respondeu = false; }
      if (!respondeu){
        viuQueda = true;
        status.textContent = "Trocando o serviço agora (fora do ar por poucos segundos)...";
        continue;
      }
      if (viuQueda){
        status.textContent = "Sistema atualizado! Recarregando a página...";
        setTimeout(function (){ location.reload(); }, 1200);
        return;
      }
      status.textContent = "Testando a versão nova numa porta separada — o sistema atual continua no ar...";
    }
    status.textContent = "Não confirmei a troca depois de alguns minutos.";
    recado.appendChild(h("p", {class: "hint", text:
      "Pode já ter dado certo mesmo assim — recarregue a página para conferir. "
      + "Se continuar igual, rode .\\deploy\\publicar.ps1 no PowerShell para ver "
      + "a mensagem de erro."}));
  }

  acao.onclick = async function (){
    acao.disabled = true;
    recado.innerHTML = "";
    status.textContent = "Iniciando a atualização...";
    try {
      await api("/api/sistema/atualizar", "POST", {});

      status.textContent = "";
      recado.appendChild(h("p", {class: "aviso", text: e.message}));

    }
  };

  caixa.appendChild(recado);
  return caixa;
}

async function perfilDeAcesso(){
  const caixa = h("div", {class: "card sec"});
  caixa.appendChild(h("h3", {text: "Perfil de acesso"}));
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px", text:
    "O que cada pessoa PODE fazer no sistema. É outra coisa que o vínculo: "
    + "vínculo é o cargo na equipe (Professor(a), Mestrando(a)) e não dá "
    + "permissão nenhuma. Quem precisa ver acervo restrito precisa de "
    + "Coordenação aqui."}));

  const r = await api("/api/equipe/perfis").catch(function (){ return {}; });
  const contas = r.contas || [];
  if (!contas.length){
    caixa.appendChild(h("p", {class: "hint", text:
      "Ninguém tem conta ainda. O acesso se cria por convite, no cartão abaixo."}));
    return caixa;
  }

  /* `table` puro: o estilo base vem do theme.css. Uma classe que nao
     existe no CSS daria a impressao de haver estilo proprio. */
  const tabela = h("table", {});
  tabela.appendChild(h("thead", {}, h("tr", {}, [
    h("th", {text: "Integrante"}), h("th", {text: "Vínculo"}),
    h("th", {text: "Perfil de acesso"}), h("th", {text: ""})])));
  const corpo = h("tbody");
  contas.forEach(function (p){
    const eu = ME && Number(p.id) === Number(ME.id);
    const escolha = h("select", {}, PERFIS.map(function (x){
      const o = h("option", {value: x.value, text: x.label});
      if (x.value === (p.user_role || "integrante")) o.selected = true;
      return o;
    }));
    escolha.disabled = !!eu;
    const recado = h("span", {class: "hint"});
    const gravar = h("button", {text: "Gravar"});
    gravar.disabled = !!eu;
    gravar.onclick = async function (){
      gravar.disabled = true; recado.textContent = "gravando…";
      try {
        const d = await api("/api/equipe/" + p.id + "/perfil", "POST",
                            {user_role: escolha.value});
        recado.textContent = "agora é " + d.user_role;
      } catch (erro){
        recado.textContent = erro.message || "não deu";
      }
      gravar.disabled = false;
    };
    corpo.appendChild(h("tr", {}, [
      h("td", {}, [h("div", {text: p.full_name || p.short_name}),
                   h("small", {class: "hint", text: p.login || ""})]),
      /* o vinculo aparece SÓ para leitura, ao lado da permissão: é a
         confusão entre os dois que faz alguém achar que já deu acesso */
      h("td", {}, h("span", {class: "hint",
        text: (VINCULO_OPTS.find(function (v){ return v.value === p.role; }) || {})
          .label || p.role || "—"})),
      h("td", {}, escolha),
      h("td", {}, eu
        ? h("span", {class: "hint", text: "você — pede a outra pessoa"})
        : h("div", {class: "globo-controles"}, [gravar, recado])),
    ]));
  });
  tabela.appendChild(corpo);
  caixa.appendChild(tabela);
  return caixa;
}
