<style>__BASE_CSS__
header.top{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--border);padding:11px clamp(14px,3vw,28px);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background:var(--grad-card);
  pointer-events:none}
header.top>*{position:relative}
header.top .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px}
header.top .name{font-weight:700;letter-spacing:-.01em}
header.top .name small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2)}
header.top .spacer{flex:1}
header.top .who{font-size:13px;color:var(--ink-2);text-align:right}
header.top .who b{display:block;color:var(--ink)}
.layout{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0;
  min-height:calc(100vh - 58px)}
@media (min-width:861px){
  .layout{background:linear-gradient(90deg,var(--surface) 0 211px,
    var(--border) 211px 212px,transparent 212px)}
  nav.side{background:none;border-right:none}
}
nav.side{border-right:1px solid var(--border);padding:18px 12px;background:var(--surface)}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;box-shadow:none;padding:9px 11px;border-radius:10px;
  color:var(--ink-2);font-size:13.5px;font-weight:550;position:relative}
nav.side button svg.icon{color:var(--ink-muted);font-size:17px;flex:none}
nav.side button:hover{background:var(--surface-raised);color:var(--ink)}
nav.side button:hover svg.icon{color:var(--ink-2)}
nav.side button.active{background:var(--accent-wash);color:var(--accent);font-weight:700}
nav.side button.active svg.icon{color:var(--accent)}
nav.side button.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;
  width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
nav.side .group{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);
  margin:16px 11px 6px;font-weight:700}
h2.view{display:flex;align-items:center;gap:9px}
h2.view svg.icon{color:var(--accent);font-size:19px}
main{padding:26px clamp(14px,3vw,34px) 70px;max-width:1180px}
h2.view{font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
p.view{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px}
.kpi .label{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;
  font-weight:700}
.kpi .value{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sec{margin-bottom:26px}

/* ---- ponto: o estado tem de ser lido de longe ---- */
.card.marcar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  justify-content:space-between;margin-bottom:22px}
.card.marcar.dentro{border-color:color-mix(in srgb,var(--good) 52%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 22%,transparent)}
.card.marcar .estado{display:flex;align-items:center;gap:12px}
.card.marcar .estado b{font-size:15.5px}
.card.marcar .estado small{display:block;color:var(--ink-2);margin-top:2px}
.acao-ponto{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acao-ponto input{min-width:min(300px,60vw)}
/* verde a pulsar = dentro. O ponto pisca, mas o rótulo ao lado é que
   informa: quem não distingue a cor lê "Dentro desde 14:03" do mesmo jeito. */
.pulso-vivo{width:11px;height:11px;border-radius:50%;background:var(--good);flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);
  animation:bater 2.2s ease-out infinite}
.parado{width:11px;height:11px;border-radius:50%;flex:none;
  background:var(--ink-muted);opacity:.5}
@keyframes bater{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
@media (prefers-reduced-motion: reduce){ .pulso-vivo{animation:none} }
.agora{display:flex;flex-direction:column;gap:9px}
.quem-agora{display:flex;align-items:center;gap:10px;padding:8px 11px;
  border-radius:var(--radius-sm);background:var(--surface-raised);
  border:1px solid var(--border)}
.quem-agora.eu{border-color:var(--accent);background:var(--accent-wash)}
.quem-agora b{font-size:13.5px}
.quem-agora small{display:block;color:var(--ink-2);font-size:12px}
.hint.aviso{color:var(--warning)}
/* Sair não é erro: o botão se distingue pela borda, não pela cor de alerta.
   Vermelho aqui ensinaria a associar "fim do expediente" a problema. */
button.sair-ponto{border-color:var(--ink-muted);font-weight:700}
button.sair-ponto:hover{border-color:var(--ink-2);background:var(--surface-hover)}
.sec h3{font-size:14.5px;margin-bottom:10px}
.rowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.searchbar{max-width:280px}
.pick{cursor:pointer}
.pick:hover{color:var(--accent-strong)}
/* ---- biblioteca ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap}
.chip:hover{border-color:var(--border-strong);color:var(--ink)}
/* O escolhido ganha PESO, e não outro matiz: trocar a cor faria parecer
   que o segmento mudou de categoria, e não que ele está selecionado. */
.chip.on{border-color:var(--accent-strong);color:var(--accent-strong);font-weight:720}
/* Segmento que a busca não achou continua na tela, apagado: sumir com ele
   faria a tela afirmar que ninguém estuda o assunto. */
.chip.vazio{opacity:.5}
.bib-item{margin-bottom:10px;padding:14px 16px}
.bib-topo{display:flex;flex-direction:column;gap:3px}
.bib-autores{margin:6px 0 0;font-size:12px;line-height:1.5}
.bib-item details{margin-top:8px}
.bib-item summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.bib-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bib-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;

  color:var(--ink-2);font-size:12px;font-weight:600;text-decoration:none}
.bib-link:hover{border-color:var(--border-strong);color:var(--ink)}
/* O que abre o ARTIGO tem peso; o que abre uma busca, não. Quem clica
   esperando o artigo e cai numa busca passa a conferir todos os botões,

.bib-link.direto{border-color:var(--accent-strong);color:var(--accent-strong)}
.bib-link.livre::after{content:"livre";font-size:9.5px;opacity:.75;

.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.kpi-simples{flex:1 1 160px;border:1px solid var(--border);border-radius:10px;

.kpi-simples .rot{font-size:10.5px;font-weight:700;letter-spacing:.04em;

.kpi-simples .num{font-size:22px;font-weight:750;margin:4px 0 2px;

.grade-bib{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card.mini{padding:12px 14px;margin:0}
.card.mini .num{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.card.mini:hover{border-color:var(--accent-strong)}
table.matriz th{font-weight:650;font-size:12px}
table.matriz td.celula{text-align:center;font-variant-numeric:tabular-nums}

/* ---- globo ---- */
.globo-palco{display:flex;justify-content:center}
.globo-palco svg{max-width:min(100%,480px);height:auto}
.globo-controles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.linha-tempo{flex:1;min-width:180px;accent-color:var(--accent-strong)}
.bandeiras{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bandeira-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;

.bandeira-btn:hover{border-color:var(--accent-strong);color:var(--ink)}
.bandeira-btn .nome{font-weight:620}
.bandeira-btn small{font-variant-numeric:tabular-nums;color:var(--ink-muted)}


@media (max-width:860px){

  nav.side{border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:3px;padding:10px}
  nav.side .group{width:100%;margin:6px 8px 2px}
  nav.side button{width:auto}
}

<script>
"use strict";
const C = Charts;

/* ---------- infraestrutura ---------- */
const VIEW = document.getElementById("view");
const MENU = document.getElementById("menu");
const TOAST = document.getElementById("toast");
let ME = null;
let CACHE = {};

function h(tag, attrs, kids){
  const node = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : (kids ? [kids] : [])).forEach(function (kid){
    if (kid === null || kid === undefined || kid === false) return;
    node.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  });
  return node;
}
async function api(path, method, body){
  const response = await fetch(path, {
    method: method || "GET",
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 401){ location.href = "/entrar?next=/app"; throw new Error("sessão expirada"); }
  const data = await response.json().catch(function (){ return {}; });
  if (!response.ok) throw new Error(data.error || ("erro " + response.status));
  return data;
}
let toastTimer = null;
function toast(message, kind){
  TOAST.textContent = message;
  TOAST.className = "toast on" + (kind === "erro" ? " erro" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ TOAST.className = "toast"; }, 4200);
}
function dt(iso){
  if (!iso) return "—";
  const p = String(iso).slice(0, 10).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(iso);
}
function isoDate(value){ return value ? String(value).slice(0, 10) : ""; }
function rank(role){ return {leitura: 0, integrante: 1, coordenacao: 2, admin: 3}[role] || 0; }
function can(minimum){ return ME && rank(ME.user_role) >= rank(minimum); }

/* ---------- formulários ---------- */
function field(key, label, type, extra){
  return Object.assign({key: key, label: label, type: type || "text"}, extra || {});
}
function buildForm(spec, values, onSubmit){
  values = values || {};
  const grid = h("div", {class: "grid g2"});
  const inputs = {};
  spec.fields.forEach(function (f){
    const id = "f_" + f.key.replace(/\W+/g, "_");
    let input;
    const preset = f.from ? values[f.from] : values[f.key];
    if (f.type === "textarea"){
      input = h("textarea", {id: id, placeholder: f.placeholder || ""});
      input.value = preset || "";
    } else if (f.type === "select"){
      input = h("select", {id: id});
      const options = typeof f.options === "function" ? f.options() : (f.options || []);
      input.appendChild(h("option", {value: "", text: f.placeholder || "— selecione —"}));
      options.forEach(function (opt){
        const value = typeof opt === "object" ? opt.value : opt;
        const text = typeof opt === "object" ? opt.label : opt;
        input.appendChild(h("option", {value: value, text: text}));
      });
      /* Uma lista vazia é um campo que não se pode preencher, e sem
         explicação ele parece defeito -- foi assim que "Orientador" ficou:
         a lista sai de quem tem vínculo de coordenação, professor ou
         pós-doutorado, e ninguém tinha vínculo preenchido, então o único
         item era "— selecione —". O aviso diz onde se resolve. */
      if (!options.length && f.vazio){
        input.disabled = true;
        input.firstChild.textContent = "— nada para escolher —";
        f = Object.assign({}, f, {hint: f.vazio});
      }
      const vazio = preset === null || preset === undefined || preset === "";
      const sugerido = typeof f.padrao === "function" ? f.padrao() : f.padrao;
      input.value = vazio && sugerido && options.indexOf(sugerido) >= 0
        ? sugerido
        : (vazio ? "" : String(preset));
    } else if (f.type === "checkbox"){
      input = h("input", {id: id, type: "checkbox"});
      input.checked = !!preset;
    } else {
      input = h("input", {id: id, type: f.type, step: f.step, placeholder: f.placeholder || ""});
      input.value = f.type === "date" ? isoDate(preset) : (preset === null || preset === undefined ? "" : preset);
    }
    if (f.required) input.required = true;
    inputs[f.key] = {input: input, spec: f};
    grid.appendChild(h("div", {class: f.span === "full" ? "full" : null}, [
      h("label", {for: id, text: f.label + (f.required ? " *" : "")}),
      input,
      f.hint ? h("div", {class: "hint", style: "margin-top:4px", text: f.hint}) : null,
    ]));
  });

  const button = h("button", {class: "primary", type: "submit", text: spec.submitLabel || "Salvar"});
  const form = h("form", {}, [
    grid,
    h("div", {class: "actions", style: "margin-top:16px"}, [
      button,
      spec.onCancel ? h("button", {type: "button", class: "ghost", text: "Cancelar",
        onclick: spec.onCancel}) : null,
    ]),
  ]);
  form.addEventListener("submit", async function (ev){
    ev.preventDefault();
    const payload = {};
    for (const key in inputs){
      const {input, spec: f} = inputs[key];
      let value = f.type === "checkbox" ? (input.checked ? "Sim" : "Não") : input.value.trim();
      if (value !== "") payload[key] = value;
    }
    if (spec.extra) Object.assign(payload, spec.extra(values));
    button.disabled = true;
    const original = button.textContent;
    button.textContent = "Salvando…";
    try {
      await onSubmit(payload);
    } catch (e){
      toast(e.message, "erro");
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  });
  return form;
}
function table(cols, rows, emptyMessage){
  if (!rows || !rows.length)
    return h("div", {class: "tw"}, h("div", {class: "empty", text: emptyMessage || "Nada por aqui ainda."}));
  return h("div", {class: "tw"}, h("table", {}, [
    h("thead", {}, h("tr", {}, cols.map(function (c){
      return h("th", {class: c.num ? "num" : null, text: c.label}); }))),
    h("tbody", {}, rows.map(function (row){
      return h("tr", {}, cols.map(function (c){
        const value = c.render ? c.render(row) : row[c.k];
        const cell = h("td", {class: c.num ? "num" : null});
        if (value && typeof value === "object") cell.appendChild(value);
        else cell.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
        return cell;
      }));
    })),
  ]));
}

/* ---------- listas auxiliares ---------- */
async function loadLookups(){
  const [lines, articles, reasons, projects, equipe] = await Promise.all([
    api("/api/research-lines?limit=200").catch(function (){ return {items: []}; }),
    api("/api/articles?limit=1000"),
    api("/api/rejection-reasons?limit=200").catch(function (){ return {items: []}; }),
    api("/api/projects?limit=300").catch(function (){ return {items: []}; }),
    api("/api/equipe").catch(function (){ return {items: []}; }),
  ]);
  CACHE.lines = lines.items.map(function (l){ return l.name; });
  CACHE.articles = articles.items;
  CACHE.reasons = reasons.items.map(function (r){ return r.label; });
  CACHE.projects = projects.items;
  CACHE.equipe = equipe.items;
  /* Só quem orienta entra na lista de orientadores. A pessoa não aparece na
     própria lista: ninguém orienta a si mesmo, e ver o próprio nome ali é
     convite para o clique errado. */
  CACHE.orientadores = equipe.items
    .filter(function (p){ return p.orienta && p.id !== ME.id; })
    .map(function (p){ return p.full_name; });
  /* No LAPE a orientação é de uma pessoa só. A ficha já abre com o nome
     dela preenchido -- é um select, quem tiver outro orientador troca. O
     servidor só manda o padrão se essa pessoa existir e puder orientar:
     sugerir um nome fora da lista seria um campo que se recusa a gravar
     o que mostra. */
  CACHE.orientadorPadrao =
    equipe.orientador_padrao !== ME.full_name ? equipe.orientador_padrao : null;
}

/* Vocabulário de vínculo, tese e bolsa. É a mesma lista de mapping.VINCULOS,
   repetida aqui para a página abrir sem consultar o servidor — e há teste
   que reprova a divergência entre as duas. */
const VINCULO_OPTS = [
  {value: "coordenacao", label: "Coordenação"},
  {value: "professor", label: "Professor(a)"},
  {value: "pos_doutorado", label: "Pós-doutorado"},
  {value: "doutorando", label: "Doutorando(a)"},
  {value: "mestrando", label: "Mestrando(a)"},
  {value: "bolsista_ic", label: "Bolsista de IC"},
  {value: "bolsista_extensao", label: "Bolsista de extensão"},
  {value: "voluntario", label: "Voluntário(a)"},
  {value: "graduando", label: "Graduando(a)"},
  {value: "tecnico", label: "Técnico(a)"},
  {value: "colaborador", label: "Colaborador(a) externo"},
];
const TESE_TIPO_OPTS = [
  {value: "tese", label: "Tese de doutorado"},
  {value: "dissertacao", label: "Dissertação de mestrado"},
  {value: "tcc", label: "Trabalho de conclusão de curso"},
  {value: "relatorio", label: "Relatório de iniciação científica"},
  {value: "projeto", label: "Projeto de pesquisa"},
];
const TESE_SITUACAO_OPTS = [
  {value: "em_andamento", label: "Em andamento"},
  {value: "coleta", label: "Coleta de dados"},
  {value: "analise", label: "Análise de dados"},
  {value: "qualificacao", label: "Qualificação"},
  {value: "defesa_marcada", label: "Defesa marcada"},
  {value: "concluida", label: "Concluída"},
  {value: "trancada", label: "Trancada"},
];
const STATUS_OPTS = ["Em produção", "Submetido", "Em revisão", "Aceito", "Publicado",
                     "Rejeitado", "Arquivado"];
const DECISION_OPTS = ["Em avaliação", "Revisão solicitada", "Aceito", "Rejeitado",
                       "Desk rejection", "Retirado"];
const EVENT_OPTS = ["Reunião", "Coleta", "Defesa", "Qualificação", "Congresso", "Curso",
                    "Seminário", "Visita técnica", "Extensão", "Outro"];
const PROJECT_OPTS = ["Em andamento", "Planejado", "Concluído", "Suspenso"];

/* ---------- telas ---------- */
const VIEWS = {};

VIEWS.perfil = {
  label: "Meu perfil", group: "Meu cadastro",
  async render(){
    const me = await api("/api/researchers/" + ME.id);
    VIEW.innerHTML = "";
    VIEW.appendChild(tituloDaTela("perfil", "Meu perfil"));
    VIEW.appendChild(h("p", {class: "view",
      text: "Estes dados alimentam o índice de pesquisadores, a rede de colaboração e as métricas do painel."}));
    VIEW.appendChild(h("div", {class: "grid g4 sec"}, [
      kpi("Artigos", me.n_articles), kpi("Publicados", me.n_published),
      kpi("Projetos", me.n_projects), kpi("Índice h", me.h_index === null ? "—" : me.h_index),
    ]));
    if (me.h_index_source)
      VIEW.appendChild(h("p", {class: "hint sec", text:
        "Índice h calculado a partir de " + (me.h_index_source === "openalex_author"
          ? "perfil público do OpenAlex (carreira completa)"
          : "artigos deste banco") + (me.metrics_updated_at ? " · atualizado em " + dt(me.metrics_updated_at) : "")}));

    const spec = {fields: [
      field("Nome completo", "Nome completo", "text", {from: "full_name", required: true, span: "full"}),
      field("Nome curto", "Nome de citação", "text", {from: "short_name"}),
      /* `from: "aliases"` faltava, e sem ele o campo era enfeite: não
         carregava o que estava gravado e não gravava o que se digitava --
         e a tela ainda respondia "Perfil atualizado". */

function crudView(config){
  return {
    label: config.label, group: config.group, minimum: config.minimum,
    async render(){
      VIEW.innerHTML = "";
      VIEW.appendChild(tituloDaTela(config.id, config.label));
      VIEW.appendChild(h("p", {class: "view", text: config.lead}));
      if (config.minimum && !can(config.minimum)){
        VIEW.appendChild(h("div", {class: "card"}, h("div", {class: "empty",
          text: "Somente a coordenação pode alterar estes registros. Você pode consultá-los abaixo."})));
      } else {
        if (config.atalho && can("coordenacao")){
          const estado = h("p", {class: "hint", style: "margin:6px 0 0",
            text: config.atalho.dica});
          const botao = h("button", {class: "primary", text: config.atalho.rotulo,
            onclick: async function (){
              botao.disabled = true;
              const antes = estado.textContent;
              estado.textContent = "Instalando…";
              try {
                const r = await api(config.atalho.rota, "POST", {});
                estado.textContent = config.atalho.contar(r);
                await VIEWS[config.id].render();
              } catch (e){
                estado.textContent = antes;
                toast(e.message, "erro");
              } finally { botao.disabled = false; }
            }});
          VIEW.appendChild(h("div", {class: "card sec"},
            [h("div", {class: "actions"}, [botao]), estado]));
        }
        const formHost = h("div", {class: "card sec"});
        const titulo = h("h3", {style: "margin-bottom:12px", text: config.formTitle});
        formHost.appendChild(titulo);
        const spec = {fields: config.fields, submitLabel: config.submitLabel || "Cadastrar"};
        const gravar = async function (payload){
          const result = await api("/api/" + config.entity, "POST", payload);
          toast(result.written + " registro(s) gravado(s).");
          await loadLookups();
          VIEWS[config.id].render();
        };
        let formulario = buildForm(spec, {}, gravar);
        formHost.appendChild(formulario);
        VIEW.appendChild(formHost);
        /* Carregar um registro existente NO formulário, em vez de exigir que
           a pessoa redigite tudo para "atualizar". É o mesmo formulário e o
           mesmo caminho de gravação — só que já preenchido. */
        config.__carregar = function (row, rotulo){
          const novo = buildForm(Object.assign({}, spec, {
            submitLabel: "Salvar alterações",
            onCancel: function (){ config.__carregar(null); },
          }), row || {}, gravar);
          titulo.textContent = row ? (rotulo || "Editando registro") : config.formTitle;
          formHost.replaceChild(novo, formulario);
          formulario = novo;
          if (row) formHost.scrollIntoView({behavior: "smooth", block: "start"});
        };
      }
      const data = await api("/api/" + config.entity + "?limit=" + (config.limit || 400));
      const bar = h("div", {class: "rowbar"}, [
        h("h3", {text: config.listTitle + " (" + data.count + ")"}),
        h("input", {class: "searchbar", type: "search", placeholder: "Filtrar…",
          oninput: function (ev){
            const term = ev.target.value.toLowerCase();
            host.innerHTML = "";
            host.appendChild(table(colunas, data.items.filter(function (row){
              return JSON.stringify(row).toLowerCase().includes(term);
            }), "Nenhum registro corresponde ao filtro."));
          }}),
      ]);
      /* Coluna de ação: um botão por linha, para mexer no registro que já
         existe sem redigitá-lo. Sem isso, "atualizar" significa preencher o
         formulário de novo — e ninguém faz isso, então o dado envelhece. */
      const acoes = [];
      if (config.editavel && config.__carregar) {
        acoes.push(function (row){
          return h("button", {type: "button", class: "ghost", text: "Editar",
            onclick: function (){
              config.__carregar(config.aoEditar ? config.aoEditar(row) : row,
                "Editando: " + (row.title || row.name || row.full_name || "registro"));
            }});
        });
      }
      if (config.acao) {
        acoes.push(function (row){
          return config.acao(row, function (){ VIEWS[config.id].render(); });
        });
      }
      const colunas = acoes.length
        ? config.columns.concat([{ k: "__acao", label: "", render: function (row){
            return h("div", {style: "display:flex;gap:6px;justify-content:flex-end"},
              acoes.map(function (fn){ return fn(row); })); } }])
        : config.columns;
      const host = h("div", {}, table(colunas, data.items));
      VIEW.appendChild(h("div", {class: "sec"}, [bar, host]));
    },
  };
}

/* O desfecho de uma tentativa que JÁ existe.
   Registrar a recusa não pode obrigar a redigitar revista e data: a
   tentativa está lá, o que falta é dizer como ela terminou. O formulário
   abaixo pergunta só isso, e grava por cima da mesma tentativa — artigo e
   número são a chave, então não nasce submissão duplicada. */
/* O banco guarda a forma canônica ("em_producao"); o formulário mostra o
   rótulo ("Em produção"). Sem a tradução, editar um artigo abriria o
   seletor de situação em branco — e salvar apagaria a situação. */
const SITUACAO_ROTULO = {
  em_producao: "Em produção", submetido: "Submetido", em_revisao: "Em revisão",
  aceito: "Aceito", publicado: "Publicado", rejeitado: "Rejeitado",
  arquivado: "Arquivado",
};

const DECISAO_ROTULO = {
  em_avaliacao: "Em avaliação", revisao_solicitada: "Revisão solicitada",
  aceito: "Aceito", rejeitado: "Rejeitado", desk_reject: "Desk rejection",
  retirado: "Retirado",
};

function botaoDeDesfecho(row, recarregar){
  const jaTem = row.decision && row.decision !== "em_avaliacao";
  return h("button", {
    type: "button", class: jaTem ? "ghost" : "",
    text: jaTem ? "Alterar desfecho" : "Registrar desfecho",
    onclick: function (){ abrirDesfecho(row, recarregar); },
  });
}

function abrirDesfecho(row, recarregar){
  const anterior = document.getElementById("desfecho");
  if (anterior) anterior.remove();

  const spec = {
    submitLabel: "Gravar desfecho",
    fields: [
      field("Decisão", "Como terminou", "select",
        {options: DECISION_OPTS, required: true, from: "__decisao"}),
      field("Data da decisão", "Data da resposta", "date", {from: "decision_on"}),
      field("Motivo da recusa", "Motivo da recusa", "select",
        {options: function (){ return CACHE.reasons; }, span: "full",
         from: "rejection_reason_label",
         hint: "Só para recusa. Alimenta o gráfico de motivos no painel."}),
      field("Rodadas", "Rodadas de revisão", "number", {from: "review_rounds"}),
    ],
    /* A chave da tentativa vai junto, sem ser editável: é ela que faz o
       registro cair por cima do que já existe em vez de criar outro. */
    extra: function (){
      return {"Artigo": row.article_title, "Tentativa": row.attempt_no};
    },
    onCancel: function (){ const c = document.getElementById("desfecho"); if (c) c.remove(); },
  };

  const valores = Object.assign({}, row, {__decisao: DECISAO_ROTULO[row.decision] || ""});
  const cartao = h("div", {class: "card sec", id: "desfecho"}, [
    h("h3", {text: "Desfecho da tentativa " + row.attempt_no}),
    h("p", {class: "hint", text: [row.article_title, row.journal,
      row.submitted_on ? "enviado em " + dt(row.submitted_on) : null]
      .filter(Boolean).join(" · ")}),
    h("div", {style: "margin-top:14px"}, buildForm(spec, valores, async function (payload){
      await api("/api/submissions", "POST", payload);
      toast("Desfecho registrado. A situação do artigo foi atualizada.");
      await loadLookups();
      recarregar();
    })),
  ]);
  VIEW.insertBefore(cartao, VIEW.firstChild.nextSibling);
  cartao.scrollIntoView({behavior: "smooth", block: "center"});
}

async function runAgent(button, path, body){
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "Rodando…";
  try {
    await api(path, "POST", body);
    toast("Agente concluído. O painel já reflete os dados novos.");
  } catch (e){
    toast(e.message, "erro");
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}
async function reviewDiscovery(button, id, action){
  button.disabled = true;
  try {
    await api("/api/discoveries/" + id + "/review", "POST", {action: action});
    toast(action === "aceitar" ? "Artigo incorporado ao banco." : "Achado descartado.");
    VIEWS.admin.render();
  } catch (e){
    toast(e.message, "erro");
    button.disabled = false;

}

async function desenharDuplicatas(caixa){
  caixa.textContent = "";
  caixa.appendChild(h("h3", {text: "Fichas repetidas"}));
  let dados;
  try {
    dados = await api("/api/equipe/duplicatas");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para conferir: " + e.message}));
    return;
  }
  const lista = dados.candidatos || [];
  if (!lista.length){
    caixa.appendChild(h("p", {class: "hint",
      text: "Nenhuma ficha parece repetida. A busca procura sempre a mesma forma: "
          + "uma ficha de um nome só que é o primeiro nome de outra mais completa, "
          + "e que nunca assina artigo junto com ela."}));
    return;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: lista.length + " par(es) parecem a mesma pessoa. Confira um por um: duas "
        + "pessoas com o mesmo primeiro nome têm exatamente esta cara, e juntá-las "
        + "por engano apaga de qual delas era cada artigo."}));

  lista.forEach(function (c){
    const estado = h("p", {class: "hint", style: "margin:6px 0 0", text: c.porque});
    const botao = h("button", {class: "primary",
      text: "Juntar em “" + c.manter.nome + "”",
      onclick: async function (){
        /* Fundir apaga uma ficha. O aviso diz o que some e o que fica --
           e diz antes, que é quando ainda dá para não fazer. */
        if (!confirm("Juntar a ficha “" + c.sumir.nome + "” (" + c.sumir.artigos
            + " artigo(s)) dentro de “" + c.manter.nome + "”?\n\n"
            + "Os artigos passam para " + c.manter.nome + ", a grafia “"
            + c.sumir.nome + "” fica guardada como variação do nome, e a ficha "
            + "antiga deixa de existir. Isto não se desfaz sozinho.")) return;
        botao.disabled = true;
        estado.textContent = "Juntando…";
        try {
          const r = await api("/api/equipe/duplicatas", "POST",
                              {manter: c.manter.id, sumir: c.sumir.id});
          toast(r.sumiu + " virou variação de " + r.manter + " · "
                + r.artigos_agora + " artigo(s) na ficha", "ok");
          await desenharDuplicatas(caixa);
          await loadLookups();
        } catch (e){
          estado.textContent = c.porque;
          toast(e.message, "erro");
        } finally { botao.disabled = false; }
      }});
    caixa.appendChild(h("div", {class: "sec"}, [
      h("p", {style: "margin:0", html:
        "<b>" + c.sumir.nome + "</b> (" + c.sumir.artigos + " artigo(s)) parece ser "
        + "<b>" + c.manter.nome + "</b> (" + c.manter.artigos + " artigo(s))"}),
      estado,
      h("div", {class: "actions", style: "margin-top:10px"}, [botao]),
    ]));
  });
}

/* ==================================================================== */
/* Meu ponto — entrada, saída, e o que estou fazendo                    */
/*                                                                      */
/* Hora presente NÃO é produtividade, e este painel não finge que é: as */
/* horas ficam de um lado, o que saiu de trabalho do outro, e a         */
/* diferença entre as duas é justamente o que há para conversar.        */
/* ==================================================================== */
function horasTexto(h){
  if (h === null || h === undefined) return "—";
  if (h < 1 / 60) return "poucos segundos";
  if (h < 1) return Math.round(h * 60) + " min";
  const inteiras = Math.floor(h);
  const min = Math.round((h - inteiras) * 60);
  return inteiras + "h" + (min ? String(min).padStart(2, "0") : "");
}

function variacaoTexto(v){
  if (v === null || v === undefined) return "sem base para comparar";
  const seta = v > 0 ? "▲" : v < 0 ? "▼" : "=";
  return seta + " " + Math.abs(v).toFixed(0) + "% ante o período anterior";
}

function quadroDeAgora(lista, eu){
  const caixa = h("div", {class: "card"}, [
    h("h3", {}, [Icons.get("pessoas", 16),
      h("span", {text: "No laboratório agora (" + lista.length + ")"})]),
  ]);
  if (!lista.length){
    caixa.appendChild(h("div", {class: "empty",
      text: "Ninguém com entrada em aberto."}));
    return caixa;
  }
  const corpo = h("div", {class: "agora"});
  lista.forEach(function (x){
    corpo.appendChild(h("div", {class: "quem-agora" + (x.member_id === eu ? " eu" : "")}, [
      h("span", {class: "pulso-vivo"}),
      h("div", {}, [
        h("b", {text: x.quem}),
        h("small", {text: (x.atividade || "sem anotar o que está fazendo")
          + " · há " + horasTexto(x.ha_horas)}),
      ]),
    ]));
  });
  caixa.appendChild(corpo);
  return caixa;
}

/* O sinal de vida. Enquanto a tela do ponto estiver aberta e houver uma
   entrada em aberto, avisa o servidor de tempos em tempos que a pessoa
   continua aqui -- e e so por isso que, depois de uma queda de energia, da
   para dizer ate que horas ela ficou. Sem ele, a unica hora conhecida e a
   da entrada, e a sessao inteira se perde.

   Um intervalo so, guardado fora da tela: trocar de aba e voltar chamava
   `render` de novo, e cada visita deixava mais um relogio batendo. */
let PULSO_PONTO = null;
function pulsarPonto(ligado){
  if (PULSO_PONTO){ clearInterval(PULSO_PONTO); PULSO_PONTO = null; }
  if (!ligado) return;
  PULSO_PONTO = setInterval(function (){
    /* Aba em segundo plano nao e sinal de presenca: o navegador mantem o
       relogio rodando com a janela minimizada a noite inteira, e isso
       registraria como trabalho o tempo em que ninguem estava. */
    if (document.hidden) return;
    api("/api/ponto/presente", "POST", {}).catch(function (){ /* volta no proximo */ });
  }, 5 * 60 * 1000);
}

    VIEW.appendChild(tituloDaTela("livro", "Biblioteca"));
    VIEW.appendChild(h("p", {class: "view", text:
      "O que o laboratório lê sobre cada assunto, recolhido das bases e atualizado "
      + "sozinho. Não é triagem de revisão: um artigo estar aqui quer dizer que ele "
      + "está no assunto, e não que responde à pergunta de alguém."}));

    const lista = (await api("/api/bibliotecas")).bibliotecas || [];
    if (!lista.length){
      VIEW.appendChild(h("p", {class: "hint",
        text: "Nenhum acervo instalado ainda."}));
      return;
    }
    if (!BIB.code || !lista.some(function (b){ return b.code === BIB.code; })){
      BIB.code = lista[0].code;
    }

    /* um acervo por cartão, quando houver mais de um */
    if (lista.length > 1){
      VIEW.appendChild(h("div", {class: "chips"}, lista.map(function (b){
        const c = h("button", {class: "chip" + (b.code === BIB.code ? " on" : ""),
          text: b.title + " (" + b.n + ")"});
        c.onclick = function (){ BIB.code = b.code; BIB.segmento = null; show("biblioteca"); };
        return c;
      })));
    }

    /* Duas leituras do mesmo acervo: a lista, para quem quer chegar a um
       artigo, e o mapeamento, para quem quer saber o que o campo está
       fazendo. Separadas porque são perguntas diferentes -- e porque
       desenhar mapa, rede e árvore para quem só queria um PDF é fazer a
       pessoa esperar por algo que ela não pediu. */
    const abas = h("div", {class: "chips", style: "margin:12px 0"});
    [["acervo", "Os artigos", "dados"],
     ["analise", "O mapeamento", "barras"]].forEach(function (x){
      const c = h("button", {class: "chip" + (BIB.aba === x[0] ? " on" : "")});
      c.appendChild(Icons.get(x[2], 13));
      c.appendChild(h("span", {text: x[1]}));
      c.onclick = function (){ BIB.aba = x[0]; show("biblioteca"); };
      abas.appendChild(c);
    });
    VIEW.appendChild(abas);

    if (BIB.aba === "analise"){
      const caixa = h("div", {});
      VIEW.appendChild(caixa);
      await desenharAnalise(caixa, BIB.code);
      return;
    }

    const url = "/api/bibliotecas/" + encodeURIComponent(BIB.code)
      + "?" + new URLSearchParams(
        Object.assign({}, BIB.segmento ? {segmento: BIB.segmento} : {},
                      BIB.pais ? {pais: BIB.pais} : {},
                      BIB.desenho ? {desenho: BIB.desenho} : {},
                      BIB.intervencao ? {intervencao: BIB.intervencao} : {},
                      BIB.q ? {q: BIB.q} : {})).toString();
    const d = await api(url);
    VIEW.appendChild(desenharAcervo(d));
  },
};

function desenharAcervo(d){
  const caixa = h("div", {});
  const b = d.biblioteca;

  caixa.appendChild(h("div", {class: "card sec"}, [
    h("h3", {text: b.title}),
    h("p", {class: "hint", style: "margin:6px 0 10px", text: b.descricao || ""}),
    h("p", {class: "hint", text:
      d.total + " artigo(s) · " + d.com_doi + " com DOI · " + d.livres
      + " com texto livre" + (b.linha ? " · linha: " + b.linha : "")
      + (b.atualizada_em ? " · atualizado em " + b.atualizada_em
         : " · ainda não atualizado")}),
    botaoDeAtualizar(b),
  ]));

  /* ---- onde procurar: os segmentos, com o tamanho de cada um ---- */
  const segs = h("div", {class: "chips", style: "margin:12px 0"});
  const todos = h("button", {class: "chip" + (BIB.segmento ? "" : " on"),
    text: "Todos (" + d.total + ")"});
  todos.onclick = function (){ BIB.segmento = null; show("biblioteca"); };
  segs.appendChild(todos);
  (d.segmentos || []).forEach(function (s){
    /* Segmento vazio aparece com zero, e desligado. Sumir com ele faria a
       tela afirmar que ninguém estuda humor no remo -- quando o certo é
       que a busca não achou, que é outra coisa e merece busca melhor. */
    const c = h("button", {class: "chip" + (s.segmento === BIB.segmento ? " on" : "")
        + (s.n ? "" : " vazio"),
      title: s.erro ? "a última busca falhou: " + s.erro
        : (s.n ? s.n + " artigo(s)" : "a busca não achou nada neste segmento"),
      text: s.segmento + " (" + s.n + ")"});
    if (s.erro) c.appendChild(Icons.get("aviso", 12));
    c.onclick = function (){ BIB.segmento = s.segmento; show("biblioteca"); };
    segs.appendChild(c);
  });
  caixa.appendChild(segs);

  /* ---- a busca dentro do acervo ---- */
  const campo = h("input", {type: "search", placeholder: "procurar no acervo…",
    value: BIB.q});
  campo.onchange = function (){ BIB.q = campo.value.trim(); show("biblioteca"); };
  const linhaDeBusca = [campo];
  /* O recorte que veio do mapa aparece AQUI: sem a pastilha, a lista mostra
     12 de 431 artigos e nada explica o sumiço dos outros 419 -- quem chegou
     pelo mapa sabe por quê, quem voltou dez minutos depois, não. E ela se
     desliga no mesmo lugar. */
  [["pais", "mapa", "Mostrar todos os países"],
   ["desenho", "experimento", "Mostrar todos os desenhos"],
   ["intervencao", "halteres", "Mostrar todas as intervenções"]].forEach(function (x){
    if (!BIB[x[0]]) return;
    const chip = h("button", {class: "chip on", title: x[2]});
    chip.appendChild(Icons.get(x[1], 12));
    chip.appendChild(h("span", {text: BIB[x[0]]}));
    chip.appendChild(Icons.get("filtro", 11));
    chip.onclick = function (){ BIB[x[0]] = null; show("biblioteca"); };
    linhaDeBusca.push(chip);
  });
  caixa.appendChild(h("div", {class: "acao-ponto", style: "margin-bottom:12px"},
                      linhaDeBusca));

  /* ---- os artigos ---- */
  const itens = d.itens || [];
  if (!itens.length){
    caixa.appendChild(h("p", {class: "hint", text: b.atualizada_em
      ? "Nenhum artigo neste recorte."
      : "O acervo ainda não foi atualizado. A coordenação aperta \"Atualizar agora\" "
        + "e as buscas saem para a PubMed."}));
    return caixa;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin-bottom:8px",
    text: itens.length + " artigo(s)" + (BIB.segmento ? " em " + BIB.segmento : "")
      + (BIB.pais ? " com autor de " + BIB.pais : "")
      + (BIB.desenho ? " · " + BIB.desenho : "")
      + (BIB.intervencao ? " · " + BIB.intervencao : "")
      + (BIB.q ? " com \"" + BIB.q + "\"" : "")}));
  itens.forEach(function (x){ caixa.appendChild(cartaoDeArtigo(x)); });
  return caixa;
}

/* ------------------------------------------------------------------ */
/* O mapeamento analítico do acervo                                      */
/* ------------------------------------------------------------------ */
/* As contas são as MESMAS do painel da produção — elas moram no servidor,
   em `analise`, e não são recalculadas aqui. O que muda é o objeto: lá a
   série é o que o LAPE publicou, aqui é a literatura mundial sobre um
   assunto, e a pergunta deixa de ser "como vamos" para ser "o que o campo
   está fazendo, e onde ele parou de crescer". */
/* Quem pediu menos movimento no sistema não recebe um globo girando. A
   bandeira tem guarda no CSS; o giro é um relógio em JavaScript, e por isso
   precisa da sua própria -- uma animação que o CSS não vê é uma animação
   que a preferência de acessibilidade não alcança. */
const MENOS_MOVIMENTO = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const MUNDO = { contorno: null, girando: !MENOS_MOVIMENTO, relogio: null,
                /* graus de longitude; cresce sozinho e nunca zera, porque o
                   resto da divisão já dá a volta */
                lon: -50, ano: null };

async function desenharAnalise(caixa, code){
  let a;
  try { a = await api("/api/bibliotecas/" + encodeURIComponent(code) + "/analise"); }
  catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para analisar: " + e.message}));
    return;
  }
  if (a.vazio){
    caixa.appendChild(h("p", {class: "hint", text:
      "Ainda não dá para mapear: " + a.porque + "."}));
    return;
  }

  caixa.appendChild(h("p", {class: "hint", style: "margin:2px 0 12px", text:
    a.no_recorte + " de " + a.total + " artigos entram no recorte de "
    + a.janela.de + " a " + a.janela.ate + ". Literatura de trinta anos atrás foi "
    + "feita com outro instrumento e sobre outra população — misturar tudo numa "
    + "curva só faz a curva não significar nada."}));

  caixa.appendChild(cartaoDaCurva(a));
  caixa.appendChild(cartaoDoMapa(a, code));
  caixa.appendChild(cartaoDasLeituras(a));
  caixa.appendChild(cartaoDaArvore(a));
  caixa.appendChild(cartaoDasModalidades(a));
  caixa.appendChild(cartaoDoTriangulo(a));
  caixa.appendChild(cartaoDaRede(a));
}

/* ---- a curva do campo, com a faixa e as derivadas ---- */
function cartaoDaCurva(a){
  const g = a.geral;
  const series = [{label: "artigos por ano", values: g.suave,
                   band: g.faixa ? {baixo: g.faixa.baixo, alto: g.faixa.alto} : null}];
  const corpo = h("div", {});
  corpo.appendChild(C.lines({
    labels: a.janela.anos.map(String), series: series, mono: true,
    caption: null, file: "biblioteca-curva",
  }));
  /* A faixa cerca a OBSERVAÇÃO, e não a média. Chamá-la de intervalo de
     confiança da média prometeria uma precisão que vinte pontos anuais não
     dão — e é a mesma ressalva do painel, escrita do mesmo jeito. */
  corpo.appendChild(h("p", {class: "hint", style: "margin-top:8px", text:
    g.faixa ? "A faixa é ±" + g.faixa.k + " desvios do ruído: é onde os pontos "
      + "crus caem, e não um intervalo de confiança da média."
      : "Sem faixa: o ruído da série é pequeno demais para desenhá-la."}));

  const linha = [];
  linha.push(kpiSimples("Tendência", g.tendencia,
    g.crescimento_ao_ano !== null ? g.crescimento_ao_ano + "%/ano" : "sem taxa estimável"));
  linha.push(kpiSimples("Ruído sobre sinal", g.ruido === null ? "—" : g.ruido,
    g.legivel ? "a curva sustenta leitura" : (g.porque || "série curta")));
  linha.push(kpiSimples("Inflexões", g.inflexoes.length,
    g.inflexoes.length ? "anos em que o campo mudou de direção" : "nenhuma virada"));
  corpo.appendChild(h("div", {class: "kpis"}, linha));

  if (g.inflexoes.length){
    corpo.appendChild(h("ul", {class: "hint"}, g.inflexoes.slice(-4).map(function (i){
      return h("li", {text: i.ano + ": " + i.leitura});
    })));
  }
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("linhas", 16),
                 h("span", {text: "Como o campo se move"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px", text:
      "A série é anual e discreta: o que se calcula são diferenças finitas "
      + "centrais, não derivadas contínuas. Antes de derivar, a série passa por "
      + "mediana móvel e suavização, e o que sobra da subtração é o ruído."}),
    corpo,
  ]);
}

function kpiSimples(rotulo, valor, pe){
  return h("div", {class: "kpi-simples"}, [
    h("div", {class: "rot", text: rotulo}),
    h("div", {class: "num", text: String(valor)}),
    h("small", {class: "hint", text: pe || ""}),
  ]);
}

/* ---- o mapa, girando, e o clique que recorta o acervo ---- */
function cartaoDoMapa(a, code){
  const paises = a.paises.todos || [];
  const quadros = (a.espaco_tempo || {}).quadros || [];
  const palco = h("div", {class: "globo-palco"});
  const corpo = h("div", {});
  const legenda = h("p", {class: "hint", style: "margin:8px 0 0"});

  /* O quadro do ano é ACUMULADO: o mapa de um ano só pisca, porque a maior
     parte dos países publica um artigo a cada três anos. Acumulado responde
     "quanto já se produziu até aqui", que é a leitura que um mapa sustenta. */
  function valoresDoAno(ano){
    if (ano === null) {
      const v = {};
      paises.forEach(function (p){ v[p.pais] = p.n; });
      return v;
    }
    const quadro = quadros.find(function (q){ return q.ano === ano; });
    return quadro ? quadro.paises : {};
  }

  let foco = null;
  function pintar(){
    palco.innerHTML = "";
    palco.appendChild(C.globo({
      world: MUNDO.contorno || [], values: valoresDoAno(MUNDO.ano),
      rotacao: MUNDO.lon, foco: foco, caption: null, file: "biblioteca-globo",
      loadingMessage: "Carregando o contorno do mundo…",
    }));
    const v = valoresDoAno(MUNDO.ano);
    const quantos = Object.keys(v).filter(function (k){ return v[k]; }).length;
    legenda.textContent = MUNDO.ano === null
      ? quantos + " país(es) no acervo inteiro"
      : "até " + MUNDO.ano + ": " + quantos + " país(es), "
        + Object.keys(v).reduce(function (t, k){ return t + v[k]; }, 0) + " artigo(s)";
  }

  function parar(){
    MUNDO.girando = false;
    if (MUNDO.relogio){ clearInterval(MUNDO.relogio); MUNDO.relogio = null; }
  }
  function girar(){
    if (MENOS_MOVIMENTO) return;
    if (MUNDO.relogio) clearInterval(MUNDO.relogio);
    MUNDO.relogio = setInterval(function (){
      /* Aba escondida não anima. O navegador mantém o relógio rodando com a
         janela minimizada, e girar um globo que ninguém vê é gastar bateria
         para nada -- num laboratório com a tela ligada o dia inteiro, isso
         não é detalhe. */
      if (document.hidden) return;
      MUNDO.lon = (MUNDO.lon + 1.6) % 360;
      pintar();
    }, 80);
  }

  /* ---- controles: girar, e a linha do tempo ---- */
  const controles = h("div", {class: "globo-controles"});
  const alterna = h("button", {class: "chip on"});
  function rotulo(){
    alterna.textContent = "";
    alterna.appendChild(Icons.get(MUNDO.girando ? "pausa" : "tocar", 13));
    alterna.appendChild(h("span", {text: MUNDO.girando ? "Parar" : "Girar"}));
  }
  alterna.onclick = function (){
    if (MUNDO.girando) parar(); else { MUNDO.girando = true; girar(); }
    rotulo();
  };
  rotulo();
  controles.appendChild(alterna);

  if (quadros.length){
    const anos = quadros.map(function (q){ return q.ano; });
    const faixa = h("input", {type: "range", class: "linha-tempo",
      min: String(anos[0]), max: String(anos[anos.length - 1]),
      value: String(MUNDO.ano === null ? anos[anos.length - 1] : MUNDO.ano)});
    const tudo = h("button", {class: "chip" + (MUNDO.ano === null ? " on" : ""),
      text: "Acervo inteiro"});
    faixa.oninput = function (){
      MUNDO.ano = Number(faixa.value);
      tudo.classList.remove("on");
      pintar();
    };
    tudo.onclick = function (){ MUNDO.ano = null; tudo.classList.add("on"); pintar(); };
    controles.appendChild(tudo);
    controles.appendChild(faixa);
  }
  corpo.appendChild(palco);
  corpo.appendChild(controles);
  corpo.appendChild(legenda);

  /* ---- as bandeiras: clicar recorta o acervo por país ---- */
  const bandeiras = h("div", {class: "bandeiras"});
  paises.slice(0, 24).forEach(function (p){
    const b = h("button", {class: "bandeira-btn", title: p.n + " artigo(s) de " + p.pais});
    /* O desenho, e não o emoji: o Windows mostra o par de indicadores
       regionais como as duas letras do código, e a lista de países aparecia
       como "US BR AU" onde deviam estar as bandeiras. */
    if (p.iso) { const f = h("span", {class: "tremula"}); f.appendChild(Bandeiras.get(p.iso, p.pais)); b.appendChild(f); }
    b.appendChild(h("span", {class: "nome", text: p.pais}));
    b.appendChild(h("small", {text: String(p.n)}));
    b.onmouseenter = function (){ parar(); rotulo(); foco = p.pais; pintar(); };
    b.onclick = function (){
      /* Clicar no país recorta o ACERVO por ele, e não escreve o nome numa
         caixa de busca: "Itália" não está no título nem no resumo da maioria
         dos artigos feitos na Itália. */
      BIB.pais = p.pais; BIB.aba = "acervo"; show("biblioteca");
    };
    bandeiras.appendChild(b);
  });
  corpo.appendChild(bandeiras);

  if (a.paises.sem_pais){
    corpo.appendChild(h("p", {class: "hint", style: "margin-top:8px", text:
      a.paises.sem_pais + " artigo(s) sem país: a base não trouxe a afiliação de "
      + "quem assina. Não é que o estudo não tenha país — é que não sabemos qual."}));
  }

  pintar();
  if (MUNDO.girando) girar();
  if (!MUNDO.contorno){
    fetch("/api/geo/mundo.json").then(function (r){ return r.json(); })
      .then(function (d){ MUNDO.contorno = d.paises || d; pintar(); })
      .catch(function (){ /* o globo segue dizendo que está carregando */ });
  }
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("mapa", 16), h("span", {text: "Onde, e desde quando"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px", text:
      "O país vem da afiliação de quem assina, e não da revista: uma revista "
      + "holandesa publica o mundo inteiro, e contar por revista responderia "
      + "\"onde se publica\", que é outra pergunta. Arraste a linha do tempo para "
      + "ver o campo crescer; passe o ponteiro numa bandeira para localizar o país "
      + "no globo; clique para abrir o acervo dele."}),
    corpo,
  ]);
}

/* ---- desenho do estudo e intervenção ---- */
/* Duas leituras que vêm do que a BASE declara -- tipo de publicação e
   descritor MeSH, que são curadoria da PubMed. Quem não tem essa curadoria
   aparece como "não classificado", e não diluído nos outros: um acervo em
   que 40% dos estudos viram "transversal" por omissão é pior do que um que
   admite o buraco. */
function cartaoDasLeituras(a){
  function grade(titulo, dados, campo, icone, explica){
    const chips = h("div", {class: "chips"}, (dados.todos || [])
      .filter(function (x){ return x.n; })
      .map(function (x){
        const c = h("button", {class: "chip", text: x.rotulo + " (" + x.n + ")"});
        c.onclick = function (){
          BIB[campo] = x.rotulo; BIB.aba = "acervo"; show("biblioteca"); };
        return c;
      }));
    const corpo = [h("p", {class: "hint", style: "margin:4px 0 10px", text: explica})];
    if (dados.com_leitura){
      corpo.push(C.bars({
        items: (dados.todos || []).filter(function (x){ return x.n; })
          .map(function (x){ return {label: x.rotulo, value: x.n}; }),
        mono: true, labelWidth: 170, unit: "artigos", caption: null,
        file: "biblioteca-" + campo,
      }));
    }
    corpo.push(chips);
    if (dados.sem_leitura){
      corpo.push(h("p", {class: "hint", style: "margin-top:10px", text:
        dados.sem_leitura + " de " + (dados.sem_leitura + dados.com_leitura)
        + " artigo(s) sem leitura: vieram da Scopus ou da Web of Science, que não "
        + "devolvem tipo de publicação nem descritor na busca. Não é que sejam de "
        + "outro desenho — é que ninguém disse qual."}));
    }
    return h("div", {class: "card sec"}, [
      h("h3", {}, [Icons.get(icone, 16), h("span", {text: titulo})]),
    ].concat(corpo));
  }

  const caixa = h("div", {});
  caixa.appendChild(grade("Desenho do estudo", a.desenhos || {}, "desenho", "experimento",
    "Um desenho por artigo, o mais forte que a base declarou: meta-análise ganha "
    + "de revisão, revisão de ensaio. Somar os dois faria o total dos desenhos "
    + "passar do total de artigos, e aí nenhum percentual significa nada."));
  caixa.appendChild(grade("Intervenção testada", a.intervencoes || {}, "intervencao",
    "halteres",
    "Aqui um artigo pode ser de várias: um ensaio que compara treino resistido "
    + "com mindfulness é dos dois."));
  return caixa;
}

/* ---- a árvore que decide se a curva de uma modalidade pode ser lida ---- */
function cartaoDaArvore(a){
  const d = a.decisao;
  const quais = function (lista){ return lista.length ? lista.join(", ") : null; };
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("processo", 16),
                 h("span", {text: "A árvore que decide se a curva pode ser lida"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px", text:
      "As mesmas três perguntas que o cálculo faz, com quantas modalidades caem "
      + "de cada lado. É por aqui que se vê POR QUE uma modalidade não tem curva, "
      + "em vez de descobrir isso um cartão vazio de cada vez."}),
    C.fluxo({
      caption: null, file: "biblioteca-decisao",
      nodes: [
        {id: "raiz", label: "Modalidades", valor: d.total, nota: "no recorte",
         tom: "entrada", coluna: 0},
        {id: "q1", label: d.min_anos + " anos com dado?",
         valor: (d.total - d.curtos.n) + "/" + d.total, nota: "mínimo para série",
         tom: "decisao", coluna: 1},
        {id: "curta", label: "Sem série", valor: d.curtos.n, nota: "falta história",
         tom: "descarte", coluna: 2, dica: quais(d.curtos.quais)},
        {id: "q2", label: "Ruído domina?", valor: d.ruidosos.n,
         nota: "razão ≥ " + d.ruido_alto, tom: "decisao", coluna: 2},
        {id: "ruido", label: "Só variação", valor: d.ruidosos.n, nota: "sem tendência",
         tom: "alerta", coluna: 3, dica: quais(d.ruidosos.quais)},
        {id: "q3", label: "Tem inflexão?", valor: d.viraram.n, nota: "Δ² troca de sinal",
         tom: "decisao", coluna: 3},
        {id: "virada", label: "Curva com virada", valor: d.viraram.n,
         nota: "há ano a explicar", tom: "saida", coluna: 4,
         dica: quais(d.viraram.quais)},
        {id: "lisa", label: "Tendência lisa", valor: d.lisos.n,
         nota: "sobe ou desce sem virar", tom: "saida", coluna: 4,
         dica: quais(d.lisos.quais)},
      ],

        {de: "raiz", para: "q1"},
        {de: "q1", para: "curta", rotulo: "não", tom: "descarte"},
        {de: "q1", para: "q2", rotulo: "sim", tom: "saida"},
        {de: "q2", para: "ruido", rotulo: "sim", tom: "alerta"},
        {de: "q2", para: "q3", rotulo: "não", tom: "saida"},
        {de: "q3", para: "virada", rotulo: "sim", tom: "saida"},
        {de: "q3", para: "lisa", rotulo: "não", tom: "passo"},

}

/* ---- uma curva por modalidade ---- */
function cartaoDasModalidades(a){
  const grade = h("div", {class: "grade-bib"});
  (a.segmentos || []).forEach(function (s){
    const corpo = [
      h("div", {class: "num", text: String(s.n)}),
      h("small", {class: "hint", text: "artigo(s)"}),
      C.sparkline(s.suave, {}),
      h("small", {class: "hint", text: s.legivel
        ? s.tendencia + (s.crescimento_ao_ano !== null
            ? " · " + s.crescimento_ao_ano + "%/ano" : "")
        : (s.porque || "série curta")}),
    ];
    if (s.inflexoes && s.inflexoes.length){
      const ultima = s.inflexoes[s.inflexoes.length - 1];
      corpo.push(h("small", {class: "hint", text: "inflexão em " + ultima.ano}));
    }
    const cartao = h("div", {class: "card mini"}, [h("b", {text: s.segmento})].concat(corpo));
    cartao.onclick = function (){ BIB.segmento = s.segmento; BIB.aba = "acervo"; show("biblioteca"); };
    cartao.style.cursor = "pointer";
    grade.appendChild(cartao);
  });
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("trofeu", 16), h("span", {text: "Cada modalidade no tempo"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px",
      text: "Clique numa modalidade para abrir o acervo dela."}),
    grade,
  ]);
}

/* ---- modalidade x país ---- */
function cartaoDoTriangulo(a){
  const t = a.triangulo;
  const conta = {};
  (t.celulas || []).forEach(function (c){ conta[c.x + "||" + c.y] = c.n; });
  const teto = Math.max.apply(null, (t.celulas || []).map(function (c){ return c.n; })
                                     .concat([1]));
  const cabeca = h("tr", {}, [h("th", {text: t.eixo_y + " ↓ / " + t.eixo_x + " →"})]
    .concat(t.colunas.map(function (x){ return h("th", {class: "num", text: x}); })));
  const corpo = h("tbody", {}, t.linhas.map(function (y){
    return h("tr", {}, [h("th", {text: y})].concat(t.colunas.map(function (x){
      const n = conta[x + "||" + y] || 0;
      /* Um matiz só, do fraco ao forte: é magnitude, não identidade.
         Célula vazia fica sem tinta — zero não é o tom mais claro, é a
         ausência de cruzamento. */
      return h("td", {class: "num celula",
        style: n ? "background:color-mix(in srgb, " + C.token("--accent-strong")
          + " " + Math.round(14 + 62 * n / teto) + "%, transparent)" : null,
        title: n ? y + " × " + x + ": " + n + " artigo(s)" : "sem cruzamento",
        text: n ? String(n) : ""});
    })));
  }));
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("hierarquia", 16),
                 h("span", {text: "Modalidade × país"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px", text:
      "É a face que o acervo sustenta. Triangular construto × intervenção × "
      + "desfecho, como o painel faz com a produção do LAPE, exigiria ler os "
      + "métodos de cada artigo — e isso o título e o resumo não dizem de maneira "
      + "confiável. Prometer a triangulação completa a partir do resumo seria dar "
      + "rigor de fachada a um palpite."}),
    h("div", {class: "tw"}, h("table", {class: "matriz"},
      [h("thead", {}, cabeca), corpo])),
  ]);
}

/* ---- quem escreve com quem ---- */
function cartaoDaRede(a){
  const r = a.rede;
  const corpo = h("div", {});
  if (!r.nos.length){
    corpo.appendChild(h("p", {class: "hint", text:
      "Nenhum par de autores assina " + r.minimo + " artigos ou mais neste acervo."}));
  } else {
    /* O contrato do gráfico é `links` com `source`/`target`, e `weight` nos
       nós -- não `edges`/`value`. Com os nomes errados o desenho não dá
       erro: ele calcula raio a partir de `undefined` e escreve NaN no
       atributo, e o navegador some com o círculo. Uma rede vazia que não
       reclama é exatamente o tipo de defeito que passa despercebido. */
    corpo.appendChild(C.network({
      nodes: r.nos.map(function (n){
        return {id: n.id, label: n.nome, weight: n.n, degree: n.n}; }),
      links: r.arestas.map(function (e){
        return {source: e.de, target: e.para, weight: e.peso}; }),
      unit: "artigos", caption: null, file: "biblioteca-rede",
    }));
  }
  /* A ressalva vem do servidor junto com o dado, e não é escrita aqui:
     quem consumir este payload por outro caminho precisa recebê-la junto. */
  corpo.appendChild(h("p", {class: "hint", style: "margin-top:8px", text: r.ressalva}));
  return h("div", {class: "card sec"}, [
    h("h3", {}, [Icons.get("rede", 16), h("span", {text: "Quem escreve com quem"})]),
    h("p", {class: "hint", style: "margin:4px 0 10px", text:
      "Pares que assinam pelo menos " + r.minimo + " artigos juntos, entre os "
      + r.autores + " autores do acervo."}),
    corpo,
  ]);
}

function cartaoDeArtigo(x){
  const topo = h("div", {class: "bib-topo"}, [
    h("b", {text: x.title || "(sem título)"}),
    h("small", {class: "hint", text:
      [x.journal, x.year, (x.segmentos || []).join(" · "),
       x.desenho, x.intervencao].filter(Boolean).join(" · ")}),
  ]);
  const links = h("div", {class: "bib-links"}, (x.links || []).map(function (l){
    /* O que abre o artigo e o que abre uma BUSCA ficam visualmente
       separados: quem clica esperando o artigo e cai numa busca passa a
       conferir todos os botões, e aí nenhum serve. */
    return h("a", {class: "bib-link" + (l.tipo === "direto" ? " direto" : "")
        + (l.livre ? " livre" : ""),
      href: l.url, target: "_blank", rel: "noopener", title: l.dica,
      text: l.base + (l.tipo === "busca" ? " ↗" : "")});
  }));
  const corpo = [topo];
  if (x.authors) corpo.push(h("p", {class: "hint bib-autores", text: x.authors}));
  if (x.abstract){
    const resumo = h("details", {}, [h("summary", {text: "Resumo"}),
                                     h("p", {class: "hint", text: x.abstract})]);
    corpo.push(resumo);
  }
  corpo.push(links);
  return h("div", {class: "card bib-item"}, corpo);
}

function botaoDeAtualizar(b){
  if (!can("coordenacao")) return h("p", {class: "hint",
    text: "Quem atualiza o acervo é a coordenação."});
  const estado = h("span", {class: "hint"});
  const botao = h("button", {class: "primary"});
  botao.appendChild(Icons.get("atualizar", 15));
  botao.appendChild(h("span", {text: "Atualizar agora"}));
  botao.onclick = async function (){
    botao.disabled = true;
    estado.textContent = "Perguntando à PubMed, uma busca por segmento… "
      + "isto leva alguns minutos.";
    try {
      const r = await api("/api/bibliotecas/" + encodeURIComponent(b.code)
                          + "/atualizar", "POST", {});
      estado.textContent = r.novos + " artigo(s) novo(s) de " + r.achados
        + " achado(s), em " + r.buscas + " busca(s)"
        + (r.erros ? " — " + r.erros + " busca(s) falharam" : "") + ".";
      await show("biblioteca");
    } catch (e){
      estado.textContent = "Não deu: " + e.message;
    } finally { botao.disabled = false; }
  };
  return h("div", {class: "acao-ponto"}, [botao, estado]);
}

VIEWS.ponto = {
  label: "Meu ponto", group: "Meu dia",
  async render(){
    const d = await api("/api/ponto");
    pulsarPonto(!!(d.resumo || {}).aberto);
    const r = d.resumo;
    VIEW.innerHTML = "";
    VIEW.appendChild(tituloDaTela("ponto", "Meu ponto"));
    VIEW.appendChild(h("p", {class: "view", text:
      "Marque a entrada quando começar e a saída quando parar. Hora registrada não "
      + "é produção — por isso o que o laboratório publicou aparece ao lado, e não "
      + "misturado."}));

    /* ---- o botão, e o estado em que ele está ---- */
    const dentro = !!r.aberto;
    const painel = h("div", {class: "card marcar" + (dentro ? " dentro" : "")});
    painel.appendChild(h("div", {class: "estado"}, [
      h("span", {class: dentro ? "pulso-vivo" : "parado"}),
      h("div", {}, [
        h("b", {text: dentro
          ? "Dentro desde " + String(r.aberto.entrada).slice(11, 16)
            + " · há " + horasTexto(r.aberto.ha_horas)
          : "Fora"}),
        h("small", {text: dentro
          ? (r.aberto.atividade || "sem anotar o que você está fazendo")
          : "Nenhuma entrada em aberto."}),
      ]),
    ]));

    const oque = h("input", {type: "text", placeholder: "O que você está fazendo?",
      value: dentro ? (r.aberto.atividade || "") : ""});
    const botao = h("button", {class: dentro ? "sair-ponto" : "primary"});
    botao.appendChild(Icons.get(dentro ? "pausa" : "tocar", 16));
    botao.appendChild(h("span", {text: dentro ? "Marcar saída" : "Marcar entrada"}));
    botao.onclick = async function (){
      botao.disabled = true;
      try {
        if (dentro){
          const saiu = await api("/api/ponto/sair", "POST", {});
          toast(saiu.fechou ? "Saída marcada — " + horasTexto(saiu.horas) + " nesta sessão."
                            : saiu.porque);
        } else {
          await api("/api/ponto/entrar", "POST", {atividade: oque.value});
          toast("Entrada marcada. Bom trabalho.");
        }
        await show("ponto");
      } catch (e){ toast(e.message, "erro"); botao.disabled = false; }
    };
    const linha = h("div", {class: "acao-ponto"}, [oque, botao]);
    if (dentro){
      const anotar = h("button", {class: "ghost"});
      anotar.appendChild(Icons.get("etiqueta", 15));
      anotar.appendChild(h("span", {text: "Anotar"}));
      anotar.onclick = async function (){
        await api("/api/ponto/anotar", "POST", {atividade: oque.value});
        toast("Anotado.");
        await show("ponto");
      };
      linha.insertBefore(anotar, botao);
    }
    painel.appendChild(linha);
    VIEW.appendChild(painel);

    /* ---- três velocímetros: hoje, semana, mês ---- */
    /* A escala de cada um é a meta do período, não o máximo histórico: o
       ponteiro tem de dizer "quanto do dia" e não "quanto do recorde". */
    const metas = {dia: 8, semana: 40, mes: 160};
    VIEW.appendChild(h("div", {class: "grid g3 sec"},
      [["dia", "Hoje"], ["semana", "Esta semana"], ["mes", "Este mês"]].map(function (par){
        const bloco = r[par[0]];
        const cartao = h("div", {class: "card"}, [
          h("h3", {}, [Icons.get("relogio", 16), h("span", {text: par[1]})]),
        ]);
        cartao.appendChild(C.gauge({
          value: bloco.horas, max: metas[par[0]],
          display: horasTexto(bloco.horas), unit: "de " + metas[par[0]] + "h",
        }));
        cartao.appendChild(h("div", {class: "hint", text: variacaoTexto(bloco.variacao)}));
        if (bloco.esquecidas)
          cartao.appendChild(h("div", {class: "hint aviso", text:
            bloco.esquecidas + " entrada(s) sem saída, fechadas pelo sistema — "
            + "não entraram na conta."}));
        return cartao;
      })));

    /* ---- a curva dos dias ---- */
    VIEW.appendChild(h("div", {class: "card sec"}, [
      h("h3", {}, [Icons.get("linhas", 16), h("span", {text: "Últimos 30 dias"})]),
      C.lines({
        labels: d.serie.map(function (x){ return x.dia.slice(5); }),
        series: [{name: "Horas registradas",
                  values: d.serie.map(function (x){ return x.horas; })}],
        height: 220, unit: "h",
      }),
    ]));

    /* ---- o que saiu de trabalho, ao lado das horas ---- */
    const prod = d.producao;
    VIEW.appendChild(h("div", {class: "grid g4 sec"}, [
      kpi("Publicados (30 d)", prod.publicados), kpi("Aceitos", prod.aceitos),
      kpi("Submetidos", prod.submetidos), kpi("Iniciados", prod.iniciados),
    ]));

    VIEW.appendChild(h("div", {class: "sec"}, quadroDeAgora(d.agora, ME.id)));

    /* ---- as sessões, para conferir e corrigir ---- */
    const tabela = h("table", {});
    tabela.appendChild(h("thead", {}, h("tr", {}, ["Dia", "Entrada", "Saída", "Duração",
      "O que fez"].map(function (t){ return h("th", {text: t}); }))));
    const tbody = h("tbody");
    d.historico.forEach(function (x){
      tbody.appendChild(h("tr", {}, [
        h("td", {text: String(x.entrada).slice(0, 10)}),
        h("td", {text: String(x.entrada).slice(11, 16)}),
        h("td", {text: x.saida ? String(x.saida).slice(11, 16) : "em aberto"}),
        /* Sessão que o sistema fechou sozinho mostra a hora COM a marca de
           estimativa. Antes dizia só "não medida" e valia zero -- uma tarde
           inteira de trabalho cortada por falta de luz desaparecia da conta
           sem que nada na tela dissesse que ela existiu. */
        h("td", {}, x.estimado
          ? [h("span", {text: horasTexto(x.horas)}),
             h("small", {class: "hint", style: "margin-left:6px", text: "estimada"})]
          : [h("span", {text: x.horas ? horasTexto(x.horas)
              : (x.fechado_sozinho ? "sem sinal" : "—")})]),
        h("td", {text: x.atividade || "—"}),
      ]));
    });
    tabela.appendChild(tbody);
    const temEstimada = d.historico.some(function (x){ return x.estimado; });
    VIEW.appendChild(h("div", {class: "card sec"}, [
      h("h3", {}, [Icons.get("dados", 16), h("span", {text: "Minhas sessões"})]),
      h("div", {class: "tw"}, tabela),
      h("p", {class: "hint", text: temEstimada
        ? "\"Estimada\" é sessão que você não encerrou e o sistema fechou no último "
          + "minuto em que soube que você ainda estava aqui — foi assim que a tarde "
          + "interrompida pela falta de luz não virou zero. Conta nas somas, e dá "
          + "para corrigir à mão se o horário não estiver certo."
        : "Sessão que você não encerrar é fechada pelo sistema no último minuto em "
          + "que ele soube que você ainda estava aqui, e aparece marcada como "
          + "estimada."}),
    ]));
  },
};

/* Cabeçalho da tela, com o ícone da seção — o mesmo par do painel. */
function tituloDaTela(id, texto){
  const titulo = h("h2", {class: "view"});
  titulo.appendChild(Icons.get(ICONE[id] || "linha", 19));
  titulo.appendChild(h("span", {text: texto}));
  return titulo;
}

/* ---------- navegação ---------- */
/* A ordem do menu e explicita, e uma tela que nao esteja aqui simplesmente
   nao aparece -- registrar em VIEWS nao basta. Custou uma tela invisivel
   para descobrir isso. */
const ORDER = ["ponto", "perfil", "artigos", "submissoes", "projetos", "linhas",
               "biblioteca", "eventos", "senha", "admin"];

function buildMenu(){
  MENU.innerHTML = "";
  let group = null;
  ORDER.forEach(function (id){
    const view = VIEWS[id];
    if (!view) return;
    if (view.minimum && !can(view.minimum) && id === "admin") return;
    if (view.group !== group){
      group = view.group;
      MENU.appendChild(h("div", {class: "group", text: group}));
    }
    const botao = h("button", {"data-view": id, onclick: function (){ location.hash = id; }});
    botao.appendChild(Icons.get(ICONE[id] || "linha", 17));
    botao.appendChild(h("span", {text: view.label}));
    MENU.appendChild(botao);
  });
}
async function show(id){
  const view = VIEWS[id] || VIEWS.perfil;
  MENU.querySelectorAll("button").forEach(function (b){
    b.classList.toggle("active", b.dataset.view === id);
  });
  VIEW.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    await view.render();
  } catch (e){
    VIEW.innerHTML = "";
    VIEW.appendChild(h("div", {class: "card"}, h("div", {class: "empty", text: e.message})));
  }
}
window.addEventListener("hashchange", function (){
  show(location.hash.replace("#", "") || "perfil");
});
document.getElementById("sair").addEventListener("click", async function (){
  await api("/api/auth/logout", "POST", {});
  location.href = "/entrar";
});

(async function boot(){
  try {
    ME = await api("/api/auth/me");
  } catch (e){
    location.href = "/entrar?next=/app";
    return;
  }
  const who = document.getElementById("who");
  who.appendChild(h("b", {text: ME.full_name}));
  who.appendChild(h("span", {class: "badge", text: ME.user_role || "integrante"}));
  await loadLookups();
  buildMenu();
  await show(location.hash.replace("#", "") || (ME.must_change_password ? "senha" : "perfil"));
  if (ME.must_change_password) toast("Defina uma senha nova para continuar.", "erro");
})();
