async function runAgent(button, path, body){
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "Rodando…";
  try {
    await api(path, "POST", body);
    toast("Agente concluído. O painel já reflete os dados novos.");
  } catch (e){
    toast(e.message, "erro");
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}
async function reviewDiscovery(button, id, action){
  button.disabled = true;
  try {
    await api("/api/discoveries/" + id + "/review", "POST", {action: action});
    toast(action === "aceitar" ? "Artigo incorporado ao banco." : "Achado descartado.");
    VIEWS.admin.render();
  } catch (e){
    toast(e.message, "erro");
    button.disabled = false;
  }
}

/* ---------- convites ---------- */
async function desenharRotina(box){
  box.innerHTML = "";
  box.appendChild(h("h3", {text: "O que roda sozinho"}));
  let r;
  try { r = await api("/api/rotina"); }
  catch (e){ box.appendChild(h("p", {class: "hint", text: e.message})); return; }
  box.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: (r.ligada
      ? "Ligada: o servidor confere a cada " + Math.round(r.checagem_s / 60) + " min se algum passo venceu e roda. "
      : "Desligada (LAPE_ROTINA=0): nada roda sem o botão. ")
      + "O Lattes não tem API — a produção nova vem da PubMed e da OpenAlex, para as pessoas declaradas em "
      + "Produção › Importar. Nada é apagado nem sobrescrito: só entra o que falta."}));
  const tabela = h("table", {}, [
    h("thead", {}, [h("tr", {}, ["Passo", "A cada", "Última boa", "Trouxe", "Situação", "Próxima"].map(function (t){ return h("th", {text: t}); }))]),
    h("tbody", {}, r.passos.map(function (p){
      return h("tr", {}, [
        h("td", {text: p.rotulo}),
        h("td", {text: p.intervalo_h >= 24 ? (p.intervalo_h / 24) + " dia(s)" : p.intervalo_h + " h"}),
        h("td", {text: p.ultima_boa ? String(p.ultima_boa).replace("T", " ").slice(0, 16) : "nunca"}),
        h("td", {text: p.trouxe === null || p.trouxe === undefined ? "—" : String(p.trouxe)}),
        h("td", {text: (p.status === "ok" ? "ok" : p.status) + (p.mensagem ? " — " + p.mensagem : ""), title: p.mensagem || ""}),
        h("td", {text: p.vencido ? "vencida — roda na próxima checagem" : (p.proxima ? String(p.proxima).replace("T", " ") : "—")}),
      ]);
    })),
  ]);
  box.appendChild(h("div", {style: "overflow-x:auto"}, [tabela]));
  const botao = h("button", {class: "primary", text: r.rodando ? "Rodando " + (r.passo || "") + "…" : "Rodar agora",
    disabled: !!r.rodando, onclick: async function (){
      botao.disabled = true;
      try {
        const s = await api("/api/rotina/rodar", "POST", {});
        toast("Rotina iniciada: " + s.passos.join(", ") + ". Ela roda ao lado; volte aqui em alguns minutos.", "ok");
        setTimeout(function (){ desenharRotina(box); }, 15000);
      } catch (e){ toast(e.message, "erro"); botao.disabled = false; }
    }});
  box.appendChild(h("div", {class: "actions"}, [botao]));
}

async function desenharSepararConta(caixa){
  caixa.textContent = "";
  caixa.appendChild(h("div", {class: "identidade-sub-titulo"}, [
    Icons.get("balanca", 15), h("h4", {text: "Ficha dividida — uma ficha com duas pessoas"}),
  ]));
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: "Quando alguém entrou e o nome que aparece é o de outra pessoa (aconteceu com "
        + "os Vieiras), o acesso caiu na ficha errada. Escolha o login, escreva o nome certo, "
        + "e o acesso, as sessões e o ponto vão para uma ficha nova. Os artigos ficam na antiga "
        + "— confira a autoria depois."}));
  let contas;
  try { contas = (await api("/api/equipe/perfis")).contas || []; }
  catch (e){ caixa.appendChild(h("p", {class: "hint", text: "Não deu para listar os acessos: " + e.message})); return; }
  if (!contas.length){ caixa.appendChild(h("p", {class: "hint", text: "Ninguém tem acesso ainda."})); return; }
  const sel = h("select", {}, contas.map(function (c){
    return h("option", {value: c.login, text: (c.full_name || "?") + " — " + c.login}); }));
  let avatar = avatarPessoa((contas[0] || {}).full_name, true);
  const porNome = new Map(contas.map(function (c){ return [c.login, c.full_name]; }));
  sel.addEventListener("change", function (){
    const novo = avatarPessoa(porNome.get(sel.value), true);
    avatar.replaceWith(novo);
    avatar = novo;
  });
  const nome = h("input", {type: "text", placeholder: "Nome certo da pessoa", style: "min-width:16rem"});
  const botao = h("button", {class: "primary", text: "Separar", onclick: async function (){
    if (!nome.value.trim()){ toast("Escreva o nome certo", "erro"); return; }
    if (!confirm("Tirar o acesso " + sel.value + " da ficha atual e pô-lo numa ficha nova chamada \u201c" + nome.value.trim() + "\u201d?")) return;
    botao.disabled = true;
    try {
      const r = await api("/api/equipe/separar", "POST", {login: sel.value, nome: nome.value.trim()});
      toast("\u201c" + r.para.nome + "\u201d agora tem a própria ficha; \u201c" + r.de.nome + "\u201d ficou com os artigos.", "ok");
      await loadLookups();
      await desenharSepararConta(caixa);
    } catch (e){ toast(e.message, "erro"); } finally { botao.disabled = false; }
  }});
  caixa.appendChild(h("div", {class: "actions", style: "display:flex;gap:8px;flex-wrap:wrap;align-items:center"},
    [avatar, sel, Icons.get("proximo", 14), nome, botao]));
}

async function desenharDuplicatas(caixa){
  caixa.textContent = "";
  const titulo = h("div", {class: "identidade-sub-titulo"}, [
    Icons.get("espelho", 15), h("h4", {text: "Fichas repetidas — a mesma pessoa em duas fichas"}),
  ]);
  caixa.appendChild(titulo);
  let dados;
  try {
    dados = await api("/api/equipe/duplicatas");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para conferir: " + e.message}));
    return;
  }
  const lista = dados.candidatos || [];
  titulo.appendChild(h("span", {class: "contagem" + (lista.length ? " tem" : ""),
    text: lista.length ? lista.length + " par(es)" : "em dia"}));
  if (!lista.length){
    caixa.appendChild(h("p", {class: "hint",
      text: "Nenhuma ficha parece repetida. A busca procura sempre a mesma forma: "
          + "uma ficha de um nome só que é o primeiro nome de outra mais completa, "
          + "e que nunca assina artigo junto com ela."}));
    return;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: lista.length + " par(es) parecem a mesma pessoa. Confira um por um: duas "
        + "pessoas com o mesmo primeiro nome têm exatamente esta cara, e juntá-las "
        + "por engano apaga de qual delas era cada artigo."}));

  lista.forEach(function (c){
    const estado = h("p", {class: "hint", style: "margin:2px 0 0", text: c.porque});
    const botao = h("button", {class: "primary",
      text: "Juntar em “" + c.manter.nome + "”",
      onclick: async function (){
        /* Fundir apaga uma ficha. O aviso diz o que some e o que fica --
           e diz antes, que é quando ainda dá para não fazer. */
        if (!confirm("Juntar a ficha “" + c.sumir.nome + "” (" + c.sumir.artigos
            + " artigo(s)) dentro de “" + c.manter.nome + "”?\n\n"
            + "Os artigos passam para " + c.manter.nome + ", a grafia “"
            + c.sumir.nome + "” fica guardada como variação do nome, e a ficha "
            + "antiga deixa de existir. Isto não se desfaz sozinho.")) return;
        botao.disabled = true;
        estado.textContent = "Juntando…";
        try {
          const r = await api("/api/equipe/duplicatas", "POST",
                              {manter: c.manter.id, sumir: c.sumir.id});
          toast(r.sumiu + " virou variação de " + r.manter + " · "
                + r.artigos_agora + " artigo(s) na ficha", "ok");
          await desenharDuplicatas(caixa);
          await loadLookups();
        } catch (e){
          estado.textContent = c.porque;
          toast(e.message, "erro");
        } finally { botao.disabled = false; }
      }});
    caixa.appendChild(h("div", {class: "card par-identidade"}, [
      h("div", {class: "quem"}, [avatarPessoa(c.sumir.nome), h("div", {}, [
        h("b", {text: c.sumir.nome}), h("small", {text: c.sumir.artigos + " artigo(s)"}),
      ])]),
      h("div", {class: "par-seta"}, [Icons.get("proximo", 16), h("small", {text: "parece ser"})]),
      h("div", {class: "quem"}, [avatarPessoa(c.manter.nome), h("div", {}, [
        h("b", {text: c.manter.nome}), h("small", {text: c.manter.artigos + " artigo(s)"}),
      ])]),
      h("div", {class: "miolo"}, [estado]),
      h("div", {class: "acao"}, [botao]),
    ]));
  });
}

/* Ligar artigo a linha de pesquisa pelo título.

   A proposta sai do servidor com a evidência ao lado -- quais palavras do
   título casaram com quais palavras-chave da linha --, e nada é gravado
   sem alguém mandar. Vem em três blocos, e os três dizem alguma coisa: o
   que dá para ligar, o que ficou ambíguo entre duas linhas, e o que
   nenhuma palavra alcançou. Os dois últimos não são falha do método: são
   onde falta palavra-chave na linha, ou onde o título é genérico demais
   para decidir sem ler o artigo. */
async function desenharLinhasPorTitulo(caixa){
  caixa.textContent = "";
  caixa.appendChild(h("h3", {text: "Ligar artigos às linhas de pesquisa pelo título"}));
  let dados;
  try {
    dados = await api("/api/linhas/sugerir");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para conferir: " + e.message}));
    return;
  }
  if (!dados.linhas){
    caixa.appendChild(h("p", {class: "hint",
      text: "Nenhuma linha de pesquisa ativa cadastrada. Instale as linhas do LAPE "
          + "antes de ligar artigo nenhum."}));
    return;
  }
  const sug = dados.sugestoes || [], amb = dados.ambiguos || [], nada = dados.sem_indicio || [];
  caixa.appendChild(h("div", {class: "grid g3 sec"}, [
    kpi("Sem linha declarada", dados.total_sem_linha),
    kpi("Dá para ligar", sug.length),
    kpi("Precisam de leitura", amb.length + nada.length),
  ]));
  if (!dados.total_sem_linha){
    caixa.appendChild(h("p", {class: "hint",
      text: "Todos os artigos já têm linha declarada."}));
    return;
  }
  if (!sug.length){
    caixa.appendChild(h("p", {class: "hint",
      text: "Nenhum título deu evidência suficiente. Quando um assunto se repete e "
          + "não é reconhecido, acrescente a palavra às palavras-chave da linha, "
          + "em Linhas de pesquisa — é de lá que a comparação sai."}));
  } else {
    caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
      text: sug.length + " artigo(s) têm no título as palavras de uma linha só. "
          + "Confira e desmarque o que não couber: o que ficar marcado é gravado, "
          + "e artigo que já tem linha nunca é sobrescrito."}));

    const marcados = new Map(sug.map(function (x){ return [x.artigo_id, x.linha_id]; }));
    sug.forEach(function (x){
      const alvo = h("input", {type: "checkbox", checked: true});
      alvo.addEventListener("change", function (){
        if (alvo.checked) marcados.set(x.artigo_id, x.linha_id);
        else marcados.delete(x.artigo_id);
      });
      caixa.appendChild(h("label", {class: "sugestao"}, [
        alvo,
        h("span", {}, [
          h("b", {text: x.titulo}),
          h("small", {text: "→ " + x.linha + "  ·  casou em: "
            + (x.termos || []).join(", ")
            + (x.segundo ? "  ·  2ª colocada: " + x.segundo : "")}),
        ]),
      ]));
    });

    const estado = h("p", {class: "hint", style: "margin:10px 0 0"});
    const gravar = h("button", {class: "primary", text: "Ligar os marcados",
      onclick: async function (){
        const pares = Array.from(marcados, function (par){
          return {artigo_id: par[0], linha_id: par[1]}; });
        if (!pares.length){ estado.textContent = "Nada marcado."; return; }
        gravar.disabled = true;
        estado.textContent = "Gravando…";
        try {
          const r = await api("/api/linhas/ligar", "POST", {ligacoes: pares});
          estado.textContent = r.ligados + " artigo(s) ligados."
            + (r.pulados && r.pulados.length ? " " + r.pulados.length + " pulado(s)." : "");
          await desenharLinhasPorTitulo(caixa);
        } catch (e){
          estado.textContent = "Não deu para gravar: " + e.message;
          gravar.disabled = false;
        }
      }});
    caixa.appendChild(h("div", {style: "margin-top:12px"}, [gravar]));
    caixa.appendChild(estado);
  }

  if (amb.length){
    caixa.appendChild(h("details", {class: "sec"}, [
      h("summary", {text: amb.length + " ambíguo(s): duas linhas disputam o mesmo título"}),
      h("p", {class: "hint", text: "Nenhum deles foi proposto. Um título que fala de "
        + "dor e de idosos ao mesmo tempo pertence a quem escreveu o artigo, não a "
        + "esta conta."}),
      h("ul", {class: "listinha"}, amb.slice(0, 40).map(function (x){
        return h("li", {}, [h("b", {text: x.titulo}),
          h("small", {text: (x.disputam || []).join("  ×  ")})]);
      })),
    ]));
  }
  if (nada.length){
    caixa.appendChild(h("details", {class: "sec"}, [
      h("summary", {text: nada.length + " sem indício no título"}),
      h("p", {class: "hint", text: "Nenhuma palavra-chave das linhas apareceu. "
        + "Ou o título é genérico, ou falta palavra na linha."}),
      h("ul", {class: "listinha"}, nada.slice(0, 40).map(function (x){
        return h("li", {}, [h("b", {text: x.titulo})]);
      })),
    ]));
  }
}

async function desenharVinculo(caixa){
  caixa.textContent = "";
  const titulo = h("div", {class: "identidade-sub-titulo"}, [
    Icons.get("etiqueta", 15), h("h4", {text: "Vínculo — pesquisadores do LAPE e coautores"}),
  ]);
  caixa.appendChild(titulo);
  let dados;
  try {
    dados = await api("/api/equipe/vinculo");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para conferir: " + e.message}));
    return;
  }
  const c = dados.contagem || {};
  const pendentes = (c.a_confirmar || 0) + (c.soltas || 0);
  titulo.appendChild(h("span", {class: "contagem" + (pendentes ? " tem" : ""),
    text: pendentes ? pendentes + " pendente(s)" : "em dia"}));
  caixa.appendChild(h("div", {class: "grid g4 sec"}, [
    kpi("Pesquisadores do LAPE", c.pesquisadores),
    kpi("Coautores", c.coautores),
    kpi("A confirmar", c.a_confirmar),
    kpi("Fichas vazias", c.soltas || 0),
  ]));

  /* A ficha sem vínculo E sem artigo nenhum não é coautor de coisa alguma
     — chamá-la assim seria inventar uma autoria. Também não é integrante:
     é resto de importação, nome digitado duas vezes, cadastro começado e
     abandonado. Enquanto fica ativa, conta na equipe e aparece como "sem
     vínculo declarado" no painel. O lugar dela não é o lixo: é arquivada,
     que some de toda contagem e deixa a ficha no banco. */
  const vazias = dados.soltas || [];
  if (vazias.length){
    const estadoVazias = h("p", {class: "hint", style: "margin:8px 0 0"});
    const arquivar = h("button", {text: "Arquivar as " + vazias.length + " fichas vazias",
      onclick: async function (){
        if (!confirm("Arquivar " + vazias.length + " ficha(s) sem vínculo e sem "
            + "artigo nenhum?\n\nElas somem da contagem de equipe e continuam "
            + "no banco. Dá para desfazer.")) return;
        arquivar.disabled = true;
        estadoVazias.textContent = "Arquivando…";
        try {
          const r = await api("/api/equipe/vinculo/lote", "POST",
            {acao: "arquivar", ids: vazias.map(function (p){ return p.id; })});
          estadoVazias.textContent = r.movidas + " ficha(s) arquivadas.";
          if (r.desfazer.length){
            estadoVazias.appendChild(document.createTextNode("  "));
            estadoVazias.appendChild(h("button", {text: "Desfazer",
              onclick: async function (){
                await api("/api/equipe/vinculo/lote", "POST",
                  {acao: "arquivar", ativo: true, ids: r.desfazer});
                await desenharVinculo(caixa);
              }}));
          }
        } catch (e){
          estadoVazias.textContent = "Não deu para arquivar: " + e.message;
          arquivar.disabled = false;
        }
      }});
    caixa.appendChild(h("div", {class: "sec"}, [
      h("p", {class: "hint", text: vazias.length + " ficha(s) estão sem vínculo "
        + "declarado E sem nenhum artigo assinado. Não são coautores — não "
        + "assinaram nada — e não são integrantes. São registros que viraram "
        + "nada, e enquanto ficam ativos inflam a contagem da equipe."}),
      h("details", {}, [
        h("summary", {text: "ver os nomes"}),
        h("ul", {class: "listinha"}, vazias.slice(0, 80).map(function (p){
          return h("li", {}, [h("b", {text: p.full_name})]);
        })),
      ]),
      h("div", {style: "margin-top:10px"}, [arquivar]),
      estadoVazias,
    ]));
  }

  const lista = dados.candidatos || [];
  if (!lista.length){
    caixa.appendChild(h("p", {class: "hint",
      text: "Nenhuma ficha pendente. Daqui para a frente, quem aparece só como autor "
          + "de um artigo entra como coautor — assinar um artigo com o laboratório "
          + "não torna ninguém integrante dele."}));
    return;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: lista.length + " ficha(s) estão contando como pesquisador do LAPE sem "
        + "nenhum sinal de vínculo: sem função, sem e-mail, sem Lattes, sem data de "
        + "entrada, sem conta, sem projeto e sem atividade — só artigos assinados. "
        + "Pode ser coautor de fora, e pode ser gente da casa que ninguém terminou "
        + "de cadastrar: as duas fichas são idênticas daqui. Confira uma por uma."}));

  /* Uma de cada vez é o cuidado certo com três fichas e o jeito de não
     fazer nada com cinquenta e quatro — e enquanto não se faz, o
     organograma fica com cinquenta e quatro pessoas sem vínculo no meio.
     O botão de lote existe para esse caso, e vem com a volta ao lado:
     marcar como coautor não apaga ficha, artigo nem autoria, então
     desfazer é um pedido só. */
  if (lista.length >= 5){
    const estadoLote = h("p", {class: "hint", style: "margin:10px 0 0"});
    const emLote = h("button", {text: "Marcar as " + lista.length + " como coautores",
      onclick: async function (){
        if (!confirm("Marcar " + lista.length + " ficha(s) como coautores?\n\n"
            + "Elas saem do organograma e da contagem de integrantes, e continuam "
            + "ligadas aos artigos que assinaram. Dá para desfazer.")) return;
        emLote.disabled = true;
        estadoLote.textContent = "Marcando…";
        try {
          const r = await api("/api/equipe/vinculo/lote", "POST",
            {ids: lista.map(function (p){ return p.id; }), coautor: true});
          estadoLote.textContent = r.movidos + " ficha(s) marcadas como coautores."
            + (r.recusados.length ? "  " + r.recusados.length + " recusada(s): "
               + r.recusados.map(function (x){ return x.motivo; })[0] : "");
          if (r.desfazer.length){
            estadoLote.appendChild(document.createTextNode("  "));
            estadoLote.appendChild(h("button", {text: "Desfazer",
              onclick: async function (){
                await api("/api/equipe/vinculo/lote", "POST",
                  {ids: r.desfazer, coautor: false});
                await desenharVinculo(caixa);
              }}));
          }
        } catch (e){
          estadoLote.textContent = "Não deu para marcar: " + e.message;
          emLote.disabled = false;
        }
      }});
    caixa.appendChild(h("div", {style: "margin:6px 0 4px"}, [emLote]));
    caixa.appendChild(estadoLote);
  }

  lista.forEach(function (p){
    const estado = h("p", {class: "hint", style: "margin:6px 0 0",
      text: (p.exemplos || "").split(" | ").slice(0, 2).join(" · ")});
    const acao = function (coautor, rotulo, classe){
      const botao = h("button", {class: classe, text: rotulo, onclick: async function (){
        botao.disabled = true;
        estado.textContent = "Gravando…";
        try {
          const r = await api("/api/equipe/vinculo", "POST", {id: p.id, coautor: coautor});
          toast(r.quem + " agora é " + r.categoria, "ok");
          await desenharVinculo(caixa);
          await loadLookups();
        } catch (e){
          toast(e.message, "erro");
          botao.disabled = false;
        }
      }});
      return botao;
    };
    caixa.appendChild(h("div", {class: "card pessoa-linha"}, [
      avatarPessoa(p.full_name),
      h("div", {class: "miolo"}, [
        h("b", {text: p.full_name}),
        h("small", {text: p.n_artigos + " artigo(s), nenhum outro vínculo"}),
        estado,
      ]),
      /* Os dois botões lado a lado, e não um só. Um botão "marcar como
         coautor" sozinho faria a tela parecer ter uma resposta certa; a
         ficha vazia da professora tem exatamente esta cara, e confirmá-la
         como integrante é uma decisão tão válida quanto a outra -- e tira
         a pessoa da lista, que é o que encerra a revisão. */
      h("div", {class: "actions", style: "margin:0;flex:none"}, [
        acao(true, "É coautor", "primary"),
        acao(false, "É do LAPE", ""),
      ]),
    ]));
  });
}

async function desenharMetas(caixa){
  caixa.textContent = "";
  caixa.appendChild(h("h3", {text: "Metas do ano"}));
  let dados;
  try {
    dados = await api("/api/metas");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para carregar: " + e.message}));
    return;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: "O painel conta o que aconteceu; sem meta ao lado, o número não se "
        + "interpreta — 13 publicações é muito ou pouco dependendo de quanto se "
        + "pretendia. A meta é decisão da coordenação: o sistema não sugere, só "
        + "mede a distância e projeta onde o ano deve terminar. Deixe em branco "
        + "para o indicador ficar sem meta."}));

  (dados.indicadores || []).forEach(function (ind){
    const linha = (dados.indicadores || []).find(function (x){ return x.codigo === ind.codigo; });
    const campo = h("input", {type: "number", min: "0", max: "1000", style: "width:90px",
      value: linha && linha.meta !== null && linha.meta !== undefined
        ? String(linha.meta) : ""});
    const estado = h("p", {class: "hint", style: "margin:6px 0 0",
      text: linha ? (linha.realizado + " até agora · " + linha.veredito) : ind.ajuda});
    const botao = h("button", {class: "primary", text: "Gravar", onclick: async function (){
      botao.disabled = true;
      const antes = estado.textContent;
      estado.textContent = "Gravando…";
      try {
        await api("/api/metas", "POST",
          {ano: dados.ano, codigo: ind.codigo, meta: campo.value});
        toast(ind.rotulo + (campo.value ? " — meta " + campo.value : " sem meta"), "ok");
        await desenharMetas(caixa);
      } catch (e){
        estado.textContent = antes;
        toast(e.message, "erro");
        botao.disabled = false;
      }
    }});
    caixa.appendChild(h("div", {class: "sec"}, [
      h("div", {style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap"}, [
        h("b", {text: ind.rotulo, style: "min-width:210px"}), campo, botao,
      ]),
      h("p", {class: "hint", style: "margin:6px 0 0", text: ind.ajuda}),
      estado,
    ]));
  });
}

async function desenharIndiceH(caixa){
  caixa.textContent = "";
  caixa.appendChild(h("h3", {text: "Índice h dos pesquisadores"}));
  let dados;
  try {
    dados = await api("/api/equipe/indice-h");
  } catch (e){
    caixa.appendChild(h("p", {class: "hint", text: "Não deu para carregar: " + e.message}));
    return;
  }
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: "O número que vale é o que a coordenação confere na base e escreve aqui — "
        + "nenhum recálculo o sobrescreve. As colunas ao lado são estimativas do "
        + "próprio sistema: o cálculo com os artigos deste banco sai baixo porque "
        + "ignora a carreira anterior ao laboratório, e o perfil público do OpenAlex "
        + "sai alto porque junta homônimo e conta duplicata. Divergência entre eles é "
        + "informação, por isso ficam à vista. Deixe o campo vazio para tirar a "
        + "declaração e voltar à estimativa."}));

  const linhas = dados.itens || [];
  if (!linhas.length){
    caixa.appendChild(h("p", {class: "hint", text: "Nenhum pesquisador do LAPE cadastrado."}));
    return;
  }
  linhas.forEach(function (p){
    const sit = p.situacao || {};
    const campo = h("input", {type: "number", min: "0", max: "300",
      style: "width:84px", value: p.h_index_declarado === null
        || p.h_index_declarado === undefined ? "" : String(p.h_index_declarado)});
    const base = h("select", {});
    base.appendChild(h("option", {value: "", text: "— base —"}));
    (dados.bases || []).forEach(function (b){
      base.appendChild(h("option", {value: b, text: b}));
    });
    base.value = p.h_index_declarado_base || "";
    const estado = h("p", {class: "hint", style: "margin:6px 0 0", text: sit.recado || ""});
    const botao = h("button", {class: "primary", text: "Gravar", onclick: async function (){
      botao.disabled = true;
      const antes = estado.textContent;
      estado.textContent = "Gravando…";
      try {
        const r = await api("/api/equipe/indice-h", "POST",
          {id: p.id, h_index: campo.value, base: base.value});
        toast(r.quem + (r.h_index === null ? " voltou para a estimativa"
                                           : " — índice h " + r.h_index), "ok");
        await desenharIndiceH(caixa);
      } catch (e){
        estado.textContent = antes;
        toast(e.message, "erro");
        botao.disabled = false;
      }
    }});
    const est = sit.estimativas || {};
    /* As estimativas ficam em texto apagado ao lado, e não numa coluna com
       o mesmo peso do declarado: são referência para conferir, não
       alternativas entre as quais escolher. */
    const comparar = [
      est.scopus === null || est.scopus === undefined ? null : "Scopus " + est.scopus,
      est.wos === null || est.wos === undefined ? null : "WoS " + est.wos,
      p.h_index_source === "openalex_author" ? "OpenAlex " + p.h_index : null,
      p.h_index_source === "banco_lape" ? "artigos deste banco " + p.h_index : null,
    ].filter(Boolean).join(" · ");

    caixa.appendChild(h("div", {class: "sec"}, [
      h("div", {style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap"}, [
        h("b", {text: p.full_name, style: "min-width:180px"}),
        campo, base, botao,
        sit.a_conferir ? h("span", {class: "badge", text: sit.origem === "declarado"
          ? "a reconferir" : "não conferido"}) : h("span", {class: "badge ok", text: "conferido"}),
      ]),
      comparar ? h("p", {class: "hint", style: "margin:6px 0 0",
        text: "o sistema estima: " + comparar}) : null,
      estado,
    ].filter(Boolean)));
  });
}

async function desenharConvites(caixa){
  caixa.innerHTML = "";
  caixa.appendChild(h("h3", {text: "Convidar o laboratório"}));
  caixa.appendChild(h("p", {class: "hint", style: "margin:4px 0 12px",
    text: "Gere um link e mande no grupo. Quem abrir escolhe a própria senha e "
        + "já cai no cadastro. Você não precisa criar conta por conta, nem passar senha a ninguém."}));

  const nome = h("input", {class: "searchbar", placeholder: "Equipe LAPE 2026", value: "Equipe LAPE"});
  const usos = h("input", {type: "number", min: "1", max: "200", value: "30", style: "max-width:110px"});
  const dias = h("input", {type: "number", min: "1", max: "90", value: "14", style: "max-width:110px"});
  /* Convite de coordenação existe para o caso do professor: ele precisa rodar
     os agentes e convidar os outros, e não faz sentido criar a conta dele à mão
     só por causa do perfil. Admin não entra na lista de propósito — esse se
     eleva depois, com a pessoa já identificada. */
  const perfil = h("select", {style: "max-width:170px"}, [
    h("option", {value: "integrante", text: "Integrante"}),
    h("option", {value: "coordenacao", text: "Coordenação"}),
    h("option", {value: "leitura", text: "Só leitura"}),
  ]);
  perfil.addEventListener("change", function (){
    // convite de coordenação é para uma pessoa específica, não para um grupo
    if (perfil.value === "coordenacao" && usos.value === "30"){
      usos.value = "1";
      nome.value = "Coordenação";
    }
  });
  const saida = h("div", {style: "margin-top:14px"});
  const gerar = h("button", {class: "primary", text: "Gerar link", onclick: async function (){
    gerar.disabled = true;
    try {
      const criado = await api("/api/invites", "POST", {
        nome: nome.value, usos: Number(usos.value) || 30, dias: Number(dias.value) || 14,
        perfil: perfil.value});
      mostrarLink(saida, criado.link, criado);
      const lista = caixa.querySelector("[data-lista]");
      if (lista) await preencherLista(lista);
    } catch (e){ toast(e.message, "erro"); }
    finally { gerar.disabled = false; }
  }});

  caixa.appendChild(h("div", {class: "actions", style: "align-items:flex-end"}, [
    h("div", {}, [h("label", {text: "Nome do convite"}), nome]),
    h("div", {}, [h("label", {text: "Perfil de quem entrar"}), perfil]),
    h("div", {}, [h("label", {text: "Quantas pessoas"}), usos]),
    h("div", {}, [h("label", {text: "Vence em (dias)"}), dias]),
    gerar,
  ]));
  caixa.appendChild(saida);

  const lista = h("div", {"data-lista": "1", style: "margin-top:18px"});
  caixa.appendChild(lista);
  await preencherLista(lista);
}

function mostrarLink(destino, link, criado){
  destino.innerHTML = "";
  const campo = h("input", {value: link, readonly: "readonly",
    style: "width:100%;font-family:var(--mono);font-size:12.5px",
    onclick: function (ev){ ev.target.select(); }});
  const copiar = h("button", {class: "primary", text: "Copiar link", onclick: async function (){
    try { await navigator.clipboard.writeText(link); copiar.textContent = "Copiado!"; }
    catch (e){ campo.select(); copiar.textContent = "Selecionado — use Ctrl+C"; }
    setTimeout(function (){ copiar.textContent = "Copiar link"; }, 2500);
  }});

/* ==================================================================== */
/* Meu ponto — entrada, saída, e o que estou fazendo                    */
/*                                                                      */
/* Hora presente NÃO é produtividade, e este painel não finge que é: as */
/* horas ficam de um lado, o que saiu de trabalho do outro, e a         */
/* diferença entre as duas é justamente o que há para conversar.        */
/* ==================================================================== */
function horasTexto(h){
  if (h === null || h === undefined) return "—";
  if (h < 1 / 60) return "poucos segundos";
  if (h < 1) return Math.round(h * 60) + " min";
  const inteiras = Math.floor(h);
  const min = Math.round((h - inteiras) * 60);
  return inteiras + "h" + (min ? String(min).padStart(2, "0") : "");
}

function variacaoTexto(v){
  if (v === null || v === undefined) return "sem base para comparar";
  const seta = v > 0 ? "▲" : v < 0 ? "▼" : "=";
  return seta + " " + Math.abs(v).toFixed(0) + "% ante o período anterior";
}

/* O sinal de vida. Enquanto a tela do ponto estiver aberta e houver uma
   entrada em aberto, avisa o servidor de tempos em tempos que a pessoa
   continua aqui -- e e so por isso que, depois de uma queda de energia, da
   para dizer ate que horas ela ficou. Sem ele, a unica hora conhecida e a
   da entrada, e a sessao inteira se perde.

   Um intervalo so, guardado fora da tela: trocar de aba e voltar chamava
   `render` de novo, e cada visita deixava mais um relogio batendo. */
let PULSO_PONTO = null;
function pulsarPonto(ligado){
  if (PULSO_PONTO){ clearInterval(PULSO_PONTO); PULSO_PONTO = null; }
  if (!ligado) return;
  PULSO_PONTO = setInterval(function (){
    /* Aba em segundo plano nao e sinal de presenca: o navegador mantem o
       relogio rodando com a janela minimizada a noite inteira, e isso
       registraria como trabalho o tempo em que ninguem estava. */
    if (document.hidden) return;
    api("/api/ponto/presente", "POST", {}).catch(function (){ /* volta no proximo */ });
  }, 5 * 60 * 1000);
}

/* ------------------------------------------------------------------ */
/* A biblioteca: o acervo de leitura, por assunto e por segmento         */
/* ------------------------------------------------------------------ */
/* Existe para a equipe parar de refazer a mesma busca. O acervo e uma
   busca GUARDADA que roda sozinha, e a tela mostra onde procurar antes de
   mostrar o que ha: uma lista de quatrocentos artigos sem recorte e
   exatamente o que as pessoas ja tinham antes de existir biblioteca. */
const BIB = { code: null, segmento: null, q: "", pais: null, aba: "acervo",
              desenho: null, intervencao: null, lista: [],
              recarregarAoFim: false };

/* As bases que o sistema nao alcanca: a estrategia para copiar, e o campo
   para colar de volta o que a base exportar.

   Sem este segundo lado, a estrategia guardada seria so um texto bonito:
   o resultado voltaria numa planilha na maquina de alguem, e o acervo
   ficaria em zero para sempre. E o acervo em zero ao lado de uma
   estrategia bem escrita e pior que nenhum dos dois -- parece feito.

   Fica fora do `<details>` do dono porque nao e decisao rara: e o
   trabalho em si, e quem abre este acervo abre para fazer isso. */
async function basesSemApi(code){
  const caixa = h("div", {});
  const r = await api("/api/bibliotecas/" + encodeURIComponent(code)
                      + "/estrategias?manuais=1").catch(function (){ return {}; });
  const lista = (r.estrategias || []).filter(function (x){ return !x.segmento; });
  if (!lista.length) return caixa;

  const bloco = h("details", {class: "cartao", style: "margin:12px 0"});
  bloco.appendChild(h("summary", {text: "Bases sem API — " + lista.length
    + " estratégias para rodar à mão"}));
  const corpo = h("div", {style: "margin-top:10px"});
  bloco.appendChild(corpo);
  corpo.appendChild(h("p", {class: "hint", text:
    "Estas bases não têm API aberta. A estratégia está montada na sintaxe de "
    + "cada uma: copie, rode na base com o seu acesso, exporte em RIS, BibTeX, "
    + "nbib ou CSV, e cole o conteúdo do arquivo de volta aqui."}));

  lista.forEach(function (x){
    const item = h("div", {class: "cartao", style: "margin-top:10px"});
    item.appendChild(h("h4", {style: "margin:0", text: x.rotulo}));
    if (x.porque_manual) item.appendChild(h("p", {class: "hint", text: x.porque_manual}));
    if (x.rodada_em){
      item.appendChild(h("p", {class: "hint", text: "Última vez: " + x.rodada_em
        + " — " + x.achados + " registro(s), " + x.novos + " novo(s)."}));
    }

    const estrategia = h("textarea", {rows: "4", readonly: "readonly",
      style: "width:100%;font-family:var(--mono);font-size:11.5px"});
    estrategia.value = x.query;
    item.appendChild(estrategia);

    const copiar = h("button", {class: "botao", text: "Copiar a estratégia"});
    const aviso = h("span", {class: "hint"});
    copiar.onclick = async function (){
      try {
        await navigator.clipboard.writeText(x.query);
        aviso.textContent = "copiada";
      } catch (erro){
        /* sem permissão de área de transferência -- e ela some em página
           servida sem HTTPS. Seleciona, e a pessoa dá Ctrl+C: melhor que
           um botão que não faz nada e não diz por quê. */
        estrategia.focus(); estrategia.select();
        aviso.textContent = "selecionada — aperte Ctrl+C";
      }
    };
    item.appendChild(h("div", {class: "globo-controles"}, [copiar, aviso]));

    if (can("coordenacao")){
      const colado = h("textarea", {rows: "4", placeholder:
        "Cole aqui o conteúdo do arquivo exportado (RIS, BibTeX, nbib ou CSV)",
        style: "width:100%;margin-top:8px"});
      item.appendChild(colado);
      const enviar = h("button", {class: "botao", text: "Trazer para o acervo"});
      const saida = h("span", {class: "hint"});
      enviar.onclick = async function (){
        if (!colado.value.trim()){ saida.textContent = "cole o arquivo primeiro"; return; }
        enviar.disabled = true; saida.textContent = "lendo…";
        try {
          const d = await api("/api/bibliotecas/" + encodeURIComponent(code) + "/colar",
                              "POST", {base: x.base, texto: colado.value});
          saida.textContent = d.achados + " registro(s), " + d.novos + " novo(s), "
            + d.repetidos + " já estavam.";
          colado.value = "";
          show("biblioteca");
        } catch (erro){
          saida.textContent = erro.message || "não deu para ler esse arquivo";
        }
        enviar.disabled = false;
      };
      item.appendChild(h("div", {class: "globo-controles"}, [enviar, saida]));
    }
    corpo.appendChild(item);
  });
  caixa.appendChild(bloco);
  return caixa;
}

/* De quem e o acervo, e se ele e so dessa pessoa.

   Fica atras de um `<details>` fechado de proposito: e uma decisao rara e
   de consequencia -- restringir esconde o acervo do resto da equipe --, e
   um seletor sempre aberto ao lado da lista de artigos convida ao clique
   distraido.

   O que esta caixa NAO promete: sigilo. O banco deste sistema vai
   versionado no repositorio, e enquanto o repositorio for publico um
   acervo "restrito" chega ao GitHub junto com os outros. A frase esta na
   tela porque quem le "restrito" supoe outra coisa, e supor errado aqui
   e guardar no lugar errado. */
async function donoDoAcervo(acervo){
  const caixa = h("details", {class: "cartao", style: "margin:12px 0"});
  caixa.appendChild(h("summary", {text: acervo.restrita
    ? "Acervo restrito — mudar o dono" : "Deixar este acervo com uma pessoa só"}));
  const corpo = h("div", {style: "margin-top:10px"});
  caixa.appendChild(corpo);

  const equipe = ((await api("/api/equipe").catch(function (){ return {}; })).items) || [];
  const quem = h("select", {}, [h("option", {value: "", text: "— acervo aberto à equipe —"})]
    .concat(equipe.filter(function (p){ return !p.is_external; }).map(function (p){
      const o = h("option", {value: String(p.id),
        text: p.full_name || p.short_name || ("#" + p.id)});
      if (String(p.id) === String(acervo.dono_id)) o.selected = true;
      return o;
    })));
  const linha = h("div", {class: "globo-controles"}, [
    h("label", {class: "hint", text: "Dono"}), quem]);
  corpo.appendChild(linha);

  const botao = h("button", {class: "botao", text: "Gravar"});
  const recado = h("span", {class: "hint"});
  botao.onclick = async function (){
    botao.disabled = true;
    recado.textContent = "gravando…";
    try {
      const r = await api("/api/bibliotecas/" + encodeURIComponent(acervo.code) + "/dono",
                          "POST", {dono_id: quem.value || null});
      recado.textContent = r.restrita
        ? "Restrito ao dono e à coordenação."
        : "Aberto à equipe.";
      show("biblioteca");
    } catch (erro){
      recado.textContent = erro.message || "não deu para gravar";
      botao.disabled = false;
    }
  };
  corpo.appendChild(h("div", {class: "globo-controles"}, [botao, recado]));
  corpo.appendChild(h("p", {class: "hint", style: "margin-top:10px", html:
    "Sem dono, o acervo aparece para toda a equipe. Com dono, aparece só para "
    + "ele e para a coordenação.<br>"
    + "<b>Isto não é sigilo.</b> O banco deste sistema vai versionado no "
    + "repositório: enquanto ele for público, um acervo restrito chega ao "
    + "GitHub junto com os outros. Para o acervo ser de uma pessoa de verdade, "
    + "o repositório precisa ser privado."}));
  return caixa;
}

      + "sozinho. Não é triagem de revisão: um artigo estar aqui quer dizer que ele "
      + "está no assunto, e não que responde à pergunta de alguém."}));

        return c;
      })));
    }

    const atual = lista.find(function (b){ return b.code === BIB.code; }) || {};
    if (atual.restrita){
      /* Quem abre um acervo restrito precisa saber que ele É restrito, e
         de quem. Sem isso, a pessoa recolhe leitura num acervo achando
         que a equipe está vendo, ou o contrário. */

         `html`. É a regra desta casa para tudo que não foi escrito aqui. */
      VIEW.appendChild(h("p", {class: "aviso"}, [
