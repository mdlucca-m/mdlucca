<title>Sistema Analista — BRUMS × HIIT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#16233a;--line:#243449;--ink:#e9eef7;--mut:#93a4bd;--dim:#67789a;
--blue:#4aa3e0;--teal:#2fd0c0;--gold:#f0b53f;--red:#ff7a7a;--vio:#b58cff;--green:#4fe0a3;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:16px;font-weight:700}header h1 b{color:var(--teal)}
header .kpis{margin-left:auto;display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--mut)}
header .kpis b{color:var(--ink)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
aside .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 8px 6px}
aside button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
aside button:hover{background:var(--panel2);color:var(--ink)}
aside button.on{background:var(--panel2);color:var(--teal);font-weight:600}
main{overflow-y:auto;padding:18px 22px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.filters .fl{display:flex;gap:6px;align-items:center}
.filters label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:16px;padding:4px 11px;cursor:pointer;font-size:12px}
.chip.on{background:var(--teal);color:#04231f;border-color:var(--teal);font-weight:700}
h2{font-size:20px;margin-bottom:4px}.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1050px){.g3,.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px}
.stat{font-family:var(--mono)}.stat .v{font-size:26px;font-weight:700}.stat .k{font-size:11px;color:var(--mut);margin-top:2px}
canvas{width:100%;display:block}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px}
.btn.on{background:var(--blue);color:#04121f;border-color:var(--blue);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--mono)}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--panel)}
.tablewrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pill{border-radius:14px;padding:2px 9px;font-size:11px;font-weight:700}
.dl{background:var(--gold);color:#241a00;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:12.5px}
.note{color:var(--dim);font-size:11.5px;font-style:italic;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
<div id="app">
<header><h1><b>◈</b> Sistema Analista — BRUMS × HIIT</h1>

 items.forEach((it,i)=>{const y=pad.t+i*bh;const x0=X(0),x1=X(it.v);x.fillStyle=it.c||'#4aa3e0';x.fillRect(Math.min(x0,x1),y+bh*0.18,Math.abs(x1-x0),bh*0.64);
  x.fillStyle='#93a4bd';x.font='11px '+ (opts.mono?'ui-monospace':'system-ui');x.textAlign='right';x.fillText(it.l,pad.l-6,y+bh/2+4);
  x.fillStyle='#e9eef7';x.textAlign=it.v>=0?'left':'right';x.font='10px ui-monospace';x.fillText((opts.fmt?opts.fmt(it.v):it.v.toFixed(2)),x1+(it.v>=0?4:-4),y+bh/2+4);});
 if(mn<0){x.strokeStyle='#67789a';x.beginPath();x.moveTo(X(0),pad.t);x.lineTo(X(0),H-pad.b);x.stroke();}}
function lineChart(sel,series,opts){opts=opts||{};const[c,x]=cv(document.querySelector(sel).clientWidth,opts.h||240);document.querySelector(sel).appendChild(c);
 const W=c._w,H=c._h,pad={l:38,r:14,t:12,b:26};const all=series.flatMap(s=>s.data.map(d=>d.y)).filter(v=>v!=null);
 const yr=[opts.y0!=null?opts.y0:Math.min(...all),Math.max(...all)];const xr=[1,7];const[X,Y]=axes(x,W,H,pad,xr,yr,[],[]);
 [2,4,7].forEach(d=>{x.fillStyle='rgba(240,181,63,.08)';x.fillRect(X(d)-8,pad.t,16,H-pad.t-pad.b);});
 for(let d=1;d<=7;d++){x.fillStyle='#67789a';x.textAlign='center';x.font='10px ui-monospace';x.fillText('D'+d,X(d),H-pad.b+14);}
 series.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=2.4;x.beginPath();let st=false;s.data.forEach(d=>{if(d.y==null)return;const px=X(d.x),py=Y(d.y);st?x.lineTo(px,py):x.moveTo(px,py);st=true;});x.stroke();
  s.data.forEach(d=>{if(d.y==null)return;x.fillStyle=s.c;x.beginPath();x.arc(X(d.x),Y(d.y),3,0,7);x.fill();});});}
function scatter(sel,pts,opts){opts=opts||{};const[c,x]=cv(document.querySelector(sel).clientWidth,opts.h||300);document.querySelector(sel).appendChild(c);
 const W=c._w,H=c._h,pad={l:40,r:14,t:12,b:30};const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const xr=[Math.min(...xs),Math.max(...xs)],yr=[Math.min(...ys),Math.max(...ys)];
 const[X,Y]=axes(x,W,H,pad,xr,yr,[],[]);pts.forEach(p=>{x.fillStyle='rgba(74,163,224,.55)';x.beginPath();x.arc(X(p.x),Y(p.y),3.2,0,7);x.fill();});
 // regression line
 const mx=mean(xs),my=mean(ys);let b1=0,dd=0;for(let i=0;i<pts.length;i++){b1+=(xs[i]-mx)*(ys[i]-my);dd+=(xs[i]-mx)**2;}b1/=dd;const b0=my-b1*mx;
 x.strokeStyle='#f0b53f';x.lineWidth=2;x.beginPath();x.moveTo(X(xr[0]),Y(b0+b1*xr[0]));x.lineTo(X(xr[1]),Y(b0+b1*xr[1]));x.stroke();
 x.fillStyle='#67789a';x.textAlign='center';x.fillText(opts.xl||'',W/2,H-6);x.save();x.translate(12,H/2);x.rotate(-Math.PI/2);x.fillText(opts.yl||'',0,0);x.restore();}

function vDescr(rs,k){const a=col(rs,k);if(!a.length)return{};return{n:a.length,media:mean(a),dp:sd(a),med:quant(a,.5),piso:100*a.filter(v=>v===0).length/a.length};}

const RENDER={
 overview(){let h=`<h2>Visão geral</h2><div class="sub">Painel dinâmico — os cartões recalculam conforme os filtros acima.</div>`;
  const rs=recs();const kpi=(v,k,c)=>`<div class="card stat"><div class="v" style="color:${c}">${v}</div><div class="k">${k}</div></div>`;
  const ice=icebergByDay();
  h+=`<div class="grid g4">${kpi(rs.length,'observações filtradas','#2fd0c0')}${kpi(vDescr(rs,'PTH').media?.toFixed(1)??'—','PTH médio','#b58cff')}${kpi(vDescr(rs,'FadFis').media?.toFixed(1)??'—','fadiga física média','#ff7a7a')}${kpi((ice[7]??NaN).toFixed?ice[7]?.toFixed(0)+'%':'—','iceberg no Dia 7','#f0b53f')}</div>`;
  h+=`<div class="grid g2" style="margin-top:14px">${card('Trajetória do eixo energia–fadiga (média/dia)','<div id="c1"></div>')}${card('Efeito piso (% no mínimo)','<div id="c2"></div>')}</div>`;
  mount(h);
  lineChart('#c1',['FadFis','Fadiga','Vigor','PTH'].map(k=>({c:COL[k],data:[1,2,3,4,5,6,7].map(d=>({x:d,y:dayMean(k,d)}))})),{y0:0});
  document.querySelector('#c1').insertAdjacentHTML('afterend','<div class="legend"><span><i style="background:#ff7a7a"></i>Fad.física</span><span><i style="background:#f0b53f"></i>Fadiga</span><span><i style="background:#2fd0c0"></i>Vigor</span><span><i style="background:#b58cff"></i>PTH</span></div>');
  barChart('#c2',[...S,'FadFis'].map(k=>({l:lab(k),v:vDescr(rs,k).piso||0,c:(vDescr(rs,k).piso>=40?'#ff7a7a':'#2fd0c0')})),{max:100,fmt:v=>v.toFixed(0)+'%'});
 },
 explore(){let h=`<h2>Explorador de variáveis</h2><div class="sub">Escolha a variável — distribuição, trajetória e descritivas recalculam ao vivo.</div>`;
  h+=`<div class="btns" id="vb">${ALLV.map(k=>`<button class="btn ${state.v1===k?'on':''}" data-v="${k}">${lab(k)}</button>`).join('')}</div>`;
  h+=`<div class="grid g2">${card('Distribuição','<div id="cd"></div>')}${card('Média por dia (dois passos)','<div id="ct"></div>')}</div>`;
  h+=`<div id="ds" style="margin-top:14px"></div>`;mount(h);
  document.querySelectorAll('#vb button').forEach(b=>b.onclick=()=>{state.v1=b.dataset.v;RENDER.explore();});
  const rs=recs(),k=state.v1,a=col(rs,k);
  hist('#cd',a,COL[k]);
  lineChart('#ct',[{c:COL[k],data:[1,2,3,4,5,6,7].map(d=>({x:d,y:dayMean(k,d,true)}))}],{y0:0});
  const dsc=vDescr(rs,k);const kv=(v,l)=>`<div class="card stat"><div class="v">${v}</div><div class="k">${l}</div></div>`;
  document.querySelector('#ds').innerHTML=`<div class="grid g4">${kv(dsc.media?.toFixed(2)??'—','média')}${kv(dsc.dp?.toFixed(2)??'—','desvio-padrão')}${kv(dsc.med?.toFixed(1)??'—','mediana')}${kv((dsc.piso?.toFixed(1)??'—')+'%','no piso (=0)')}</div>`;
 },
 corr(){let h=`<h2>Correlações</h2><div class="sub">Matriz de Pearson (obs. filtradas). Clique numa célula para ver a dispersão.</div>`;
  h+=card('Matriz de correlações','<div id="hm"></div>')+`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 id="scT">Dispersão: ${lab(state.v1)} × ${lab(state.v2)}</h3><div id="sc"></div></div>${card('Como ler','<p style="color:#93a4bd;font-size:13px;line-height:1.6">Tons quentes = correlação positiva; frios = negativa. A dispersão traz a reta de regressão. Ajuste os filtros para ver como as associações mudam por dia, momento ou atleta.</p>')}</div>`;
  mount(h);heatmap('#hm');drawScatter();
 },
 acute(){let h=`<h2>Resposta aguda pré→pós</h2><div class="sub">dz por observação (pós−pré), pareado por atleta×dia, nas obs. filtradas.</div>`;
  h+=card('Tamanho de efeito (dz) por variável','<div id="ca"></div>')+`<div class="note">Positivo = aumenta do pré ao pós. Cálculo ao vivo sobre os pares filtrados (n=<span id="npair"></span>).</div>`;mount(h);
  const P=pairs();document.querySelector('#npair')&&(document.querySelector('#npair').textContent=P.length);
  const items=[...S,'PTH','FadFis','FadMen'].map(k=>{const dl=P.map(o=>(o.pos[k]!=null&&o.pre[k]!=null)?o.pos[k]-o.pre[k]:null).filter(v=>v!=null);const dz=dl.length>2?mean(dl)/sd(dl):0;return{l:lab(k),v:dz,c:dz>=0?'#ff7a7a':'#2fd0c0',k};}).sort((a,b)=>b.v-a.v);
  barChart('#ca',items,{h:300,min:-0.6,max:1.0});
 },
 hiit(){let h=`<h2>HIIT × técnico-tático</h2><div class="sub">Médias por atleta (dias 2–7) e prevalência do perfil iceberg.</div>`;
  h+=`<div class="grid g2">${card('HIIT vs. sem HIIT (nível do dia)','<div id="ch"></div>')}${card('Perfil iceberg por dia','<div id="ci"></div>')}</div>`;mount(h);
  const tr=r=>r.d>=2&&r.d<=7;const rs=D.records.filter(r=>tr(r)&&(state.ath==='all'||r.a===state.ath)&&(state.mom==='all'||r.m===state.mom));
  function pa(hiit,k){const by={};rs.forEach(r=>{if((r.h===1)!==hiit)return;if(r[k]==null)return;(by[r.a]=by[r.a]||[]).push(r[k]);});const ms=Object.values(by).map(mean);return ms.length?mean(ms):null;}
  const items=[...S,'PTH','FadFis'].map(k=>{const d=(pa(true,k)??0)-(pa(false,k)??0);return{l:lab(k),v:d,c:d>=0?'#ff7a7a':'#2fd0c0'};}).sort((a,b)=>b.v-a.v);
  barChart('#ch',items,{h:300,min:-0.6,max:2.6});
  const ice=icebergByDay();lineChart('#ci',[{c:'#2fd0c0',data:[1,2,3,4,5,6,7].map(d=>({x:d,y:ice[d]}))}],{h:300,y0:0});
 },
 reliab(){let h=`<h2>Confiabilidade (α de Cronbach)</h2><div class="sub">Recalculada ao vivo dos itens, respeitando os filtros.</div>`;
  h+=card('α por subescala','<div id="cr"></div>')+`<div class="note">Linha implícita: critério 0,70. Filtrar por poucos dias/atleta reduz a amostra e pode instabilizar o α.</div>`;mount(h);
  const rs=recs();barChart('#cr',S.map(k=>{const a=alpha(rs,k);return{l:k,v:isNaN(a)?0:a,c:(a>=0.7?'#2fd0c0':'#f0b53f')};}).sort((x,y)=>y.v-x.v),{max:1,min:0,fmt:v=>v.toFixed(2)});
 },
 multi(){const m=D.precomp.multi;let h=`<h2>Confirmação multivariada</h2><div class="sub">Resultados do modelo (pré-computados; agregados por atleta).</div>`;
  h+=`<div class="grid g2">`+m.map(r=>`<div class="card stat"><div class="k">${r.conj}</div><div class="v" style="color:#4aa3e0">F${r.df.replace(' ','')}=${r.F}</div><div class="k">p=${r.p} · D=${r.D}</div></div>`).join('')+`</div>`;
  h+=card('Decomposição de variância — traço × dia × estado','<div id="cv"></div>');mount(h);stackVar('#cv');
 },
 compl(){let h=`<h2>Análises complementares</h2><div class="sub">Mudança semanal, tipologia e rede (pré-computadas).</div>`;
  h+=`<div class="grid g2">${card('Mudança semanal D1→D7 (dz, IC95%)','<div id="cw"></div>')}${card('Rede de subescalas — centralidade','<div id="cnet"></div>')}</div>`;
  const cl=D.precomp.cluster;const parts=Object.entries(cl).sort((a,b)=>b[1]-a[1]);const names=['Resiliente','Perturbado','Extremo'];
  h+=`<div class="grid g3" style="margin-top:14px">`+parts.map((p,i)=>`<div class="card stat"><div class="v" style="color:${['#2fd0c0','#f0b53f','#ff7a7a'][i]}">${p[1]}</div><div class="k">${names[i]} (cluster)</div></div>`).join('')+`</div>`;
  mount(h);
  barChart('#cw',D.precomp.weekly.map(w=>({l:lab(w.v),v:w.dz,c:w.dz>=0?'#ff7a7a':'#2fd0c0'})),{min:-1.5,max:2.2,h:220});
  barChart('#cnet',D.precomp.network.map(nn=>({l:nn.sub,v:nn.forca,c:nn.sub==='Depressão'?'#4aa3e0':'#67789a'})),{min:0,max:1.4,h:220,fmt:v=>v.toFixed(2)});
 },
 data(){let h=`<h2>Tabela de dados</h2><div class="sub">Base analítica filtrada (${recs().length} de ${D.n} observações). Atletas anonimizados.</div>`;
  h+=`<div class="btns"><button class="dl" id="dlcsv">⭳ Baixar CSV</button></div><div class="tablewrap"><table id="dt"></table></div>`;mount(h);
  const rs=recs();const cols=['a','d','m','h',...S,'PTH','FadFis','FadMen','EstFis','EstMen'];
  const th=cols.map(c=>`<th>${c==='a'?'Atleta':c==='d'?'Dia':c==='m'?'Mom':c==='h'?'HIIT':lab(c)}</th>`).join('');
  const body=rs.slice(0,600).map(r=>'<tr>'+cols.map(c=>`<td>${r[c]==null?'':(c==='h'?(r[c]?'sim':'—'):r[c])}</td>`).join('')+'</tr>').join('');
  document.querySelector('#dt').innerHTML=`<thead><tr>${th}</tr></thead><tbody>${body}</tbody>`;
  document.getElementById('dlcsv').onclick=()=>{const csv=[cols.join(',')].concat(rs.map(r=>cols.map(c=>r[c]==null?'':r[c]).join(','))).join('\n');const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='brums_hiit_filtrado.csv';a.click();};
 }
};
function hist(sel,a,c){const[cc,x]=cv(document.querySelector(sel).clientWidth,220);document.querySelector(sel).appendChild(cc);const W=cc._w,H=cc._h,pad={l:34,r:12,t:10,b:24};
 if(!a.length)return;const mn=Math.min(...a),mx=Math.max(...a),nb=Math.min(16,Math.max(6,Math.round(Math.sqrt(a.length))));const bw=(mx-mn)/nb||1;const bins=Array(nb).fill(0);a.forEach(v=>{let i=Math.min(nb-1,Math.floor((v-mn)/bw));bins[i]++;});
 const[X,Y]=axes(x,W,H,pad,[mn,mx],[0,Math.max(...bins)],[],[]);for(let i=0;i<nb;i++){const x0=X(mn+i*bw),x1=X(mn+(i+1)*bw);x.fillStyle=c;x.fillRect(x0+1,Y(bins[i]),x1-x0-2,Y(0)-Y(bins[i]));}}
function dayMean(k,d,twoStep){const rs=D.records.filter(r=>r.d===d&&(state.mom==='all'||r.m===state.mom)&&(state.ath==='all'||r.a===state.ath)&&r[k]!=null);if(!rs.length)return null;
 if(twoStep){const by={};rs.forEach(r=>{(by[r.a]=by[r.a]||[]).push(r[k]);});return mean(Object.values(by).map(mean));}return mean(rs.map(r=>r[k]));}
function icebergByDay(){const o={};for(let d=1;d<=7;d++){const rs=D.records.filter(r=>r.d===d&&(state.mom==='all'||r.m===state.mom)&&(state.ath==='all'||r.a===state.ath));const ok=rs.filter(r=>r.Vigor!=null&&['Tensão','Depressão','Raiva','Fadiga','Confusão'].every(s=>r[s]!=null));o[d]=ok.length?100*ok.filter(r=>r.Vigor>Math.max(r.Tensão,r.Depressão,r.Raiva,r.Fadiga,r.Confusão)).length/ok.length:null;}return o;}
function heatmap(sel){const rs=recs();const vars=ALLV;const[c,x]=cv(document.querySelector(sel).clientWidth,Math.min(560,vars.length*34+60));document.querySelector(sel).appendChild(c);
 const W=c._w,H=c._h,pad={l:96,t:76};const cw=(W-pad.l-10)/vars.length,chh=(H-pad.t-10)/vars.length;
 vars.forEach((vy,i)=>vars.forEach((vx,j)=>{const r=pear(rs,vx,vy);const t=(r+1)/2;const col=r>=0?`rgba(240,120,90,${Math.abs(r)})`:`rgba(74,163,224,${Math.abs(r)})`;x.fillStyle=isNaN(r)?'#111c2e':col;x.fillRect(pad.l+j*cw,pad.t+i*chh,cw-2,chh-2);
  if(!isNaN(r)){x.fillStyle=Math.abs(r)>0.5?'#fff':'#93a4bd';x.font='9px ui-monospace';x.textAlign='center';x.fillText(r.toFixed(2),pad.l+j*cw+cw/2,pad.t+i*chh+chh/2+3);}}));
 x.fillStyle='#93a4bd';x.font='10px system-ui';vars.forEach((v,i)=>{x.textAlign='right';x.fillText(lab(v).slice(0,10),pad.l-4,pad.t+i*chh+chh/2+3);x.save();x.translate(pad.l+i*cw+cw/2,pad.t-4);x.rotate(-Math.PI/4);x.textAlign='left';x.fillText(lab(v).slice(0,10),0,0);x.restore();});
 c.onclick=e=>{const rect=c.getBoundingClientRect();const mx=(e.clientX-rect.left)*(c._w/rect.width),my=(e.clientY-rect.top)*(c._h/rect.height);const j=Math.floor((mx-pad.l)/cw),i=Math.floor((my-pad.t)/chh);if(i>=0&&j>=0&&i<vars.length&&j<vars.length){state.v2=vars[i];state.v1=vars[j];document.getElementById('scT').textContent=`Dispersão: ${lab(state.v1)} × ${lab(state.v2)}`;document.querySelector('#sc').innerHTML='';drawScatter();}};}
function drawScatter(){const rs=recs();const pts=rs.filter(r=>r[state.v1]!=null&&r[state.v2]!=null).map(r=>({x:r[state.v1],y:r[state.v2]}));const el=document.querySelector('#sc');if(!el)return;el.innerHTML='';if(pts.length<3){el.innerHTML='<p class="note">Poucos dados.</p>';return;}scatter('#sc',pts,{xl:lab(state.v1),yl:lab(state.v2)});const r=pear(rs,state.v1,state.v2);el.insertAdjacentHTML('beforeend',`<div class="note">r de Pearson = <b style="color:#f0b53f">${r.toFixed(2)}</b> · n=${pts.length}</div>`);}
function stackVar(sel){const[c,x]=cv(document.querySelector(sel).clientWidth,260);document.querySelector(sel).appendChild(c);const W=c._w,H=c._h,pad={l:40,r:12,t:10,b:60};const V=D.precomp.var;const bw=(W-pad.l-pad.r)/V.length;const[X,Y]=axes(x,W,H,pad,[0,V.length],[0,100],[],[]);
 V.forEach((v,i)=>{let base=0;[['traco','#122b45'],['dia','#4aa3e0'],['estado','#2fd0c0']].forEach(([kk,cc])=>{const h=(H-pad.t-pad.b)*v[kk]/100;x.fillStyle=cc;x.fillRect(pad.l+i*bw+bw*0.2,H-pad.b-base-h,bw*0.6,h);base+=h;});x.save();x.translate(pad.l+i*bw+bw/2,H-pad.b+12);x.rotate(-Math.PI/5);x.fillStyle='#93a4bd';x.font='10px system-ui';x.textAlign='right';x.fillText(v.sub,0,0);x.restore();});
 document.querySelector(sel).insertAdjacentHTML('afterend','<div class="legend"><span><i style="background:#122b45"></i>traço (atleta)</span><span><i style="background:#4aa3e0"></i>dia</span><span><i style="background:#2fd0c0"></i>estado agudo</span></div>');}
function render(){kpis();(RENDER[state.tab]||RENDER.overview)();}
buildNav();buildFilters();render();addEventListener('resize',()=>render());
</script>
