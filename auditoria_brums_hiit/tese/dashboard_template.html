<style>
*{box-sizing:border-box}
:root{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0;
 --head:#0f2036;
 --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
 --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}}
:root[data-theme="dark"]{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}
:root[data-theme="light"]{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0; --head:#0f2036;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#eaf0f9;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px -6px rgba(0,0,0,.5)}
.top .brand{font-family:var(--serif);font-weight:600;font-size:17px;margin-right:auto}
.top .brand .ac{color:#2fd0c0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#b7c6dd;border:1px solid transparent;border-radius:8px;padding:7px 11px;font-family:var(--sans);font-size:12.5px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:#2fd0c0;color:#062018;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 3px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h3{font-family:var(--sans);font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .pill{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:2px 8px;margin-left:auto}
canvas{display:block;width:100%}
.note{color:var(--faint);font-size:12px;margin-top:8px}
/* dynamic table */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tbar input{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-family:var(--sans);font-size:13px}
.tbar .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;background:var(--card)}
th:hover{color:var(--ink)}
th .ar{opacity:.4;font-size:9px}
th.sort .ar{opacity:1;color:var(--teal)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr:hover{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600}
.c-sim{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.c-nao{background:color-mix(in srgb,var(--faint) 16%,transparent);color:var(--faint)}
.pos{color:var(--coral);font-weight:600}.neg{color:var(--teal);font-weight:600}
section{scroll-margin-top:70px}
footer{color:var(--faint);font-size:12px;border-top:1px solid var(--line);margin-top:30px;padding:18px 0 40px}
footer a{color:var(--mut)}
</style>

<div class="top">
 <div class="brand">◈ Dashboard analítico — BRUMS <span class="ac">×</span> HIIT</div>
 <nav id="nav"></nav>
</div>
<div class="wrap" id="app"></div>
<script>window.DATA=%%DATA%%;</script>
<script>
const D=window.DATA, root=document.documentElement;
const LAB={PTH:'PTH (TMD)',FadFis:'Fadiga física',Fadiga:'Fadiga',Vigor:'Vigor',FadMen:'Fadiga mental','Tensão':'Tensão','Depressão':'Depressão',Raiva:'Raiva','Confusão':'Confusão'};
const cv=(c)=>getComputedStyle(root).getPropertyValue('--'+c).trim();
const fmt=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d).replace('.',',');
const pf=(p)=>p==null?'—':(p<0.001?'<0,001':fmt(p,3));

/* ---------- dynamic table: sortable headers + search ---------- */
function dtable(host, cols, rows){
 // cols: [{k,label,num,render}]
 const wrap=document.createElement('div');
 const bar=document.createElement('div'); bar.className='tbar';
 const inp=document.createElement('input'); inp.placeholder='filtrar…';
 const cnt=document.createElement('span'); cnt.className='cnt';
 bar.append(inp,cnt); wrap.append(bar);
 const tw=document.createElement('div'); tw.className='tw';
 const tbl=document.createElement('table'); tw.append(tbl); wrap.append(tw); host.append(wrap);
 let sortK=null, dir=1, filter='';
 function draw(){
  const q=filter.toLowerCase();
  let rs=rows.filter(r=>!q||cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)));
  if(sortK){const c=cols.find(x=>x.k===sortK);rs=rs.slice().sort((a,b)=>{let x=a[sortK],y=b[sortK];if(c.num){x=+x;y=+y}if(x==null)return 1;if(y==null)return -1;return x<y?-1*dir:x>y?dir:0;});}
  let h='<thead><tr>'+cols.map(c=>`<th data-k="${c.k}" class="${sortK===c.k?'sort':''}">${c.label} <span class="ar">${sortK===c.k?(dir>0?'▲':'▼'):'↕'}</span></th>`).join('')+'</tr></thead>';
  h+='<tbody>'+rs.map(r=>'<tr>'+cols.map(c=>{const v=c.render?c.render(r[c.k],r):(r[c.k]??'—');return `<td class="${c.num?'num':''}">${v}</td>`;}).join('')+'</tr>').join('')+'</tbody>';
  tbl.innerHTML=h; cnt.textContent=rs.length+'/'+rows.length;
  tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)dir*=-1;else{sortK=k;dir=1;}draw();});
 }
 inp.oninput=()=>{filter=inp.value;draw();}; draw();
}
function card(title,pill){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${title}${pill?`<span class="pill">${pill}</span>`:''}</h3>`;return c;}

/* ---------- horizontal bar chart (canvas) ---------- */
function barChart(host,items,opts){
 opts=opts||{}; const c=document.createElement('canvas'); host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1), W=host.clientWidth, H=opts.h||(items.length*30+26);
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const vals=items.flatMap(i=>[i.v,i.lo,i.hi].filter(v=>v!=null));
 let mn=Math.min(0,...vals),mx=Math.max(0,...vals);if(opts.min!=null)mn=opts.min;if(opts.max!=null)mx=opts.max;
 const padL=opts.l||96,padR=46,padT=4,padB=4,bh=(H-padT-padB)/items.length;
 const X=v=>padL+(v-mn)/(mx-mn||1)*(W-padL-padR);
 const ink=cv('ink'),mut=cv('mut'),line=cv('line');
 if(mn<0){x.strokeStyle=line;x.beginPath();x.moveTo(X(0),padT);x.lineTo(X(0),H-padB);x.stroke();}
 const base=opts.base!=null?opts.base:(mn<0?0:mn);
 items.forEach((it,i)=>{const y=padT+i*bh,cc=cv(it.c||'blue');
  x.fillStyle=cc;const x0=X(base),x1=X(it.v);roundRect(x,Math.min(x0,x1),y+bh*0.2,Math.abs(x1-x0),bh*0.6,3);x.fill();
  if(it.lo!=null&&it.hi!=null){x.strokeStyle=cc;x.globalAlpha=.55;x.lineWidth=1.6;x.beginPath();x.moveTo(X(it.lo),y+bh/2);x.lineTo(X(it.hi),y+bh/2);x.stroke();x.globalAlpha=1;}
  x.fillStyle=mut;x.font='11px '+cv('sans').replace(/,.*/,'');x.textAlign='right';x.fillText(it.l,padL-8,y+bh/2+4);
  x.fillStyle=ink;x.font='700 11px '+cv('mono').replace(/,.*/,'');x.textAlign=it.v>=0?'left':'right';x.fillText((opts.fmt?opts.fmt(it.v):fmt(it.v)),x1+(it.v>=0?5:-5),y+bh/2+4);});
}
function roundRect(x,a,b,w,h,r){r=Math.min(r,h/2,Math.abs(w)/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

/* ---------- build sections ---------- */
const SEC=[]; function sec(id,title){const s=document.createElement('section');s.id=id;const el=document.getElementById('app');el.append(s);SEC.push([id,title]);return s;}

/* VISÃO GERAL */
(function(){const s=sec('geral','Visão geral');
 const rep={n:D.mod.n_atletas};
 s.innerHTML='<h2>Visão geral</h2><p class="sub">Síntese quantitativa do estudo — auditoria, medida, resposta e carga. Todos os números reproduzidos por código; ver as abas para as tabelas dinâmicas.</p>';
 const k=document.createElement('div');k.className='kpis';
 const A=D.inf.A_aguda.find(r=>r.var==='FadFis');
 const roc=D.roc.pre_vs_pos.find(r=>r.var==='FadFis');
 const kpis=[['27','atletas'],['456','observações'],['135','pares pré/pós'],['77/84','checagens'],
  [fmt(A.dz),'dz fad. física'],[fmt(D.adv.CFA_DWLS.CFI),'CFI (CFA)'],[fmt(D.adv.HTMT_max),'HTMT máx'],[fmt(roc.AUC),'AUC pré×pós']];
 k.innerHTML=kpis.map(([b,sp])=>`<div class="kpi"><b>${b}</b><span>${sp}</span></div>`).join('');
 s.append(k);
 const g=document.createElement('div');g.className='grid2';s.append(g);
 const c1=card('Resposta aguda pré→pós — dz (IC95%)','misto + FDR');const d1=document.createElement('div');c1.append(d1);g.append(c1);
 const c2=card('Fator de Bayes (BF₁₀, escala log)','JZS');const d2=document.createElement('div');c2.append(d2);g.append(c2);
 const c3=card('ROC — AUC para separar pós de pré','diagnóstico');const d3=document.createElement('div');c3.append(d3);g.append(c3);
 const c4=card('ICC do atleta por subescala','traço estável');const d4=document.createElement('div');c4.append(d4);g.append(c4);
 requestAnimationFrame(()=>{
  barChart(d1,D.inf.A_aguda.slice().sort((a,b)=>a.dz-b.dz).map(r=>({l:r.label,v:r.dz,lo:r.ic[0],hi:r.ic[1],c:r.dz>=0?'coral':'teal'})),{min:-1,max:1.7});
  const bf=Object.entries(D.adv.bayes_JZS_agregado_por_atleta).map(([k,v])=>({k,...v}));
  const bn={FadFis:'Fadiga física',esc_vigor:'Vigor',PTH:'PTH',esc_fadiga:'Fadiga',esc_confusao:'Confusão',esc_tensao:'Tensão',esc_depressao:'Depressão',esc_raiva:'Raiva',FadMen:'Fadiga mental'};
  barChart(d2,bf.sort((a,b)=>a.BF10-b.BF10).map(r=>({l:bn[r.k]||r.k,v:Math.log10(r.BF10),c:r.BF10>=3?'coral':(r.BF10<=1/3?'teal':'gold')})),{fmt:v=>fmt(Math.pow(10,v),Math.pow(10,v)<100?2:0),min:-1,max:3.6});
  barChart(d3,D.roc.pre_vs_pos.slice().sort((a,b)=>a.AUC-b.AUC).map(r=>({l:r.label,v:r.AUC,c:r.AUC>=0.7?'coral':'blue'})),{min:0.5,max:0.8});
  barChart(d4,D.inf.E_icc_atleta.slice().sort((a,b)=>a.ICC_atleta-b.ICC_atleta).map(r=>({l:r.label,v:r.ICC_atleta,c:'blue'})),{min:0,max:0.8});
 });
})();

/* DESCRITIVA & NORMALIDADE */
(function(){const s=sec('descr','Descritiva');
 s.innerHTML='<h2>Descritiva e testes (paramétricos e não-paramétricos)</h2><p class="sub">Descritivas por variável com normalidade (Shapiro–Wilk) e a comparação pré→pós t pareado vs. Wilcoxon. As duas famílias concordam em todas as variáveis.</p>';
 const c1=card('Descritivas + normalidade (amostra completa)','Shapiro');s.append(c1);
 dtable(c1,[{k:'label',label:'Variável'},{k:'media',label:'M',num:true,render:v=>fmt(v)},{k:'dp',label:'DP',num:true,render:v=>fmt(v)},{k:'mediana',label:'Md',num:true,render:v=>fmt(v,1)},{k:'IQR',label:'IQR',num:true,render:v=>fmt(v,1)},{k:'assimetria',label:'Assim.',num:true,render:v=>fmt(v)},{k:'piso_pct',label:'% piso',num:true,render:v=>fmt(v,1)},{k:'shapiro_W',label:'Shapiro W',num:true,render:v=>fmt(v)},{k:'normal',label:'Normal?',render:v=>`<span class="chip ${v?'c-sim':'c-nao'}">${v?'sim':'não'}</span>`}],D.descr.A_descritivas);
 const c2=card('Pré→pós: paramétrico (t) vs. não-paramétrico (Wilcoxon)','n=27');s.append(c2);
 dtable(c2,[{k:'label',label:'Variável'},{k:'normalidade_dif',label:'Dif. normal?'},{k:'p_t',label:'t: p',num:true,render:pf},{k:'dz',label:'dz',num:true,render:v=>fmt(v)},{k:'wilcoxon_p',label:'Wilcoxon: p',num:true,render:pf},{k:'rbc',label:'RBC',num:true,render:v=>fmt(v)},{k:'concordam',label:'Concordam?',render:v=>`<span class="chip ${v?'c-sim':'c-nao'}">${v?'sim':'não'}</span>`}],D.descr.B_param_vs_naoparam);
})();

/* CONFIABILIDADE & INVARIÂNCIA */
(function(){const s=sec('conf','Confiabilidade');
 const inv=D.conf.B_invariancia;
 s.innerHTML='<h2>Confiabilidade e invariância da medida</h2><p class="sub">Consistência interna por subescala (α de Cronbach com IC95%, ω de McDonald, r inter-item) e invariância métrica pré→pós — congruência de cargas de Tucker φ = '+fmt(inv.tucker_phi)+' (≥ 0,95): a escala mede o mesmo construto antes e depois do microciclo. Significância prática: onde o IC do α cruza 0,70, a subescala é limítrofe, não reprovada.</p>';
 const c1=card('Confiabilidade por subescala','α · ω · IC95%');s.append(c1);
 dtable(c1,[
  {k:'sub',label:'Subescala'},
  {k:'alpha',label:'α',num:true,render:v=>`<b>${fmt(v)}</b>`},
  {k:'alpha_ic',label:'IC95% (α)',render:v=>`[${fmt(v[0])}; ${fmt(v[1])}]`},
  {k:'omega',label:'ω',num:true,render:v=>fmt(v)},
  {k:'r_inter_item',label:'r inter-item',num:true,render:v=>fmt(v)},
  {k:'adequada',label:'α≥0,70?',render:(v,r)=>`<span class="chip ${v?'c-sim':'c-nao'}">${v?'sim':(r.ic_atinge_070?'limítrofe':'não')}</span>`},
 ],D.conf.A_confiabilidade);
 const c2=card('α de Cronbach (IC95%) por subescala','Tucker φ '+fmt(inv.tucker_phi));const d2=document.createElement('div');c2.append(d2);s.append(c2);
 requestAnimationFrame(()=>{barChart(d2,D.conf.A_confiabilidade.slice().sort((a,b)=>a.alpha-b.alpha).map(r=>({l:r.sub,v:r.alpha,lo:r.alpha_ic[0],hi:r.alpha_ic[1],c:r.adequada?'teal':'coral'})),{min:0,max:1});});
 c2.insertAdjacentHTML('beforeend',`<p class="note">Linha prática em 0,70. CFI por grupo: pré ${fmt(inv.CFI_pre)} · pós ${fmt(inv.CFI_pos)}. Item excluído por variância degenerada: ${inv.itens_excluidos.join(', ')||'—'}. Invariância métrica ${inv.invariancia_metrica?'<b>sustentada</b>':'não sustentada'}.</p>`);
})();

/* RESPOSTA AGUDA */
(function(){const s=sec('aguda','Resposta aguda');
 s.innerHTML='<h2>Resposta aguda pré→pós</h2><p class="sub">Teste pareado + Wilcoxon, tamanho de efeito dz com IC95% (bootstrap) e p corrigido por FDR. Clique nos cabeçalhos para ordenar; use o filtro para buscar.</p>';
 const c=card('Resposta aguda — todas as variáveis','n=27 · atleta como unidade');s.append(c);
 dtable(c,[
  {k:'label',label:'Variável'},
  {k:'delta',label:'Δ',num:true,render:v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`},
  {k:'dz',label:'dz',num:true,render:(v)=>`<b>${v>=0?'+':''}${fmt(v)}</b>`},
  {k:'ic',label:'IC95%',render:v=>`[${fmt(v[0])}; ${fmt(v[1])}]`},
  {k:'t',label:'t',num:true,render:v=>fmt(v)},
  {k:'p',label:'p',num:true,render:v=>pf(v)},
  {k:'wilcoxon_p',label:'Wilcoxon p',num:true,render:v=>pf(v)},
  {k:'p_FDR',label:'p (FDR)',num:true,render:v=>pf(v)},
  {k:'sig',label:'Sobrevive',render:v=>`<span class="chip ${v?'c-sim':'c-nao'}">${v?'sim':'—'}</span>`},
 ],D.inf.A_aguda);
})();

/* HIIT & DIA */
(function(){const s=sec('hiit','HIIT & dia');
 s.innerHTML='<h2>Efeito do HIIT, acúmulo e interação</h2><p class="sub">Modelos mistos com o atleta como unidade.</p>';
 const c1=card('HIIT vs. técnico-tático (nível do dia)','ΔPTH +2,43');
 dtable(c1,[{k:'y',label:'Variável',render:v=>LAB[v]||v},{k:'efeito_HIIT',label:'Δ (HIIT−sem)',num:true,render:v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`},{k:'p',label:'p',num:true,render:pf},{k:'icc',label:'ICC',num:true,render:v=>fmt(v)}],D.mod.C_efeito_HIIT_nivel_dia);s.append(c1);
 const c2=card('Acúmulo no microciclo (inclinação/dia, aleatória)','crescimento');
 dtable(c2,[{k:'y',label:'Variável',render:v=>LAB[v]||v},{k:'inclinacao_por_dia',label:'Inclinação/dia',num:true,render:v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`},{k:'p',label:'p',num:true,render:pf},{k:'var_inclinacao_atleta',label:'Var. inclinação',num:true,render:v=>fmt(v)}],D.mod.B_acumulo_microciclo);s.append(c2);
 const c3=card('Interação Condição × Momento','o HIIT muda o salto agudo?');
 dtable(c3,[{k:'y',label:'Variável',render:v=>LAB[v]||v},{k:'interacao',label:'pós × HIIT',num:true,render:v=>fmt(v)},{k:'p',label:'p',num:true,render:pf}],D.mod.D_interacao_condicao_momento);s.append(c3);
})();

/* PSICOMETRIA */
(function(){const s=sec('psico','Psicometria');
 s.innerHTML='<h2>Psicometria</h2><p class="sub">CFA (DWLS), correlações policóricas (HTMT), TRI/GRM e fator de Bayes. Ajuste do CFA: CFI '+fmt(D.adv.CFA_DWLS.CFI)+' · TLI '+fmt(D.adv.CFA_DWLS.TLI)+' · RMSEA '+fmt(D.adv.CFA_DWLS.RMSEA)+'.</p>';
 const ld=Object.entries(D.adv.CFA_DWLS.loadings_std).map(([it,v])=>({item:it,carga:v}));
 const c1=card('CFA — cargas padronizadas por item','DWLS');
 dtable(c1,[{k:'item',label:'Item'},{k:'carga',label:'Carga',num:true,render:v=>fmt(v)}],ld);s.append(c1);
 const bf=Object.entries(D.adv.bayes_JZS_agregado_por_atleta).map(([k,v])=>{const bn={FadFis:'Fadiga física',esc_vigor:'Vigor',PTH:'PTH',esc_fadiga:'Fadiga',esc_confusao:'Confusão',esc_tensao:'Tensão',esc_depressao:'Depressão',esc_raiva:'Raiva',FadMen:'Fadiga mental'};return{label:bn[k]||k,t:v.t,BF10:v.BF10,ev:v.BF10>=3?'efeito':(v.BF10<=1/3?'equivalência':'inconclusivo')};});
 const c2=card('Fator de Bayes (JZS) — Δ agudo','BF₁₀');

/* ROC DAS DERIVADAS */
(function(){const s=sec('rocd','ROC das derivadas');
 const rd=D.rocd;
 s.innerHTML='<h2>Curva ROC das derivadas — taxa de variação como diagnóstico</h2><p class="sub">Usa a <b>derivada aguda</b> (Δ = pós−pré por atleta-dia) como escore, em vez do nível, para separar dia de HIIT (2/4/7) de sem HIIT (1/3/5/6). '+rd.n+' pares; IC95% por bootstrap agrupado por atleta. A derivada é um diagnóstico <b>fraco</b> e <b>não supera o nível</b> — a assinatura do HIIT está no nível diário, não no salto agudo.</p>';
 const c1=card('AUC da derivada vs. nível para separar dia de HIIT','bootstrap por atleta');s.append(c1);
 dtable(c1,[{k:'var',label:'Variável'},{k:'AUC_derivada',label:'AUC derivada',num:true,render:v=>`<b>${fmt(v)}</b>`},{k:'IC_derivada',label:'IC95% (deriv.)',render:v=>`[${fmt(v[0])}; ${fmt(v[1])}]`},{k:'AUC_nivel',label:'AUC nível',num:true,render:v=>fmt(v)},{k:'ganho',label:'Ganho',num:true,render:v=>`<span class="${v>0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`}],rd.resultados);
 const c2=card('AUC derivada × nível','vermelho=derivada · azul=nível');const d2=document.createElement('div');c2.append(d2);s.append(c2);
 requestAnimationFrame(()=>{const items=[];rd.resultados.slice().reverse().forEach(r=>{items.push({l:r.var+' (deriv.)',v:r.AUC_derivada,c:'coral'});items.push({l:r.var+' (nível)',v:r.AUC_nivel,c:'blue'});});
   barChart(d2,items,{min:0.5,max:0.7,l:150,fmt:v=>fmt(v)});});
 c2.insertAdjacentHTML('beforeend','<p class="note">Linha do acaso em 0,50. Só a fadiga física passa de 0,55 pela derivada; o PTH em nível (0,60) supera sua derivada (0,50).</p>');
})();
