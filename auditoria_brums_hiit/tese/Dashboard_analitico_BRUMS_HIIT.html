<style>
*{box-sizing:border-box}
:root{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0;
 --head:#0f2036;
 --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
 --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}}
:root[data-theme="dark"]{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}
:root[data-theme="light"]{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0; --head:#0f2036;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#eaf0f9;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px -6px rgba(0,0,0,.5)}
.top .brand{font-family:var(--serif);font-weight:600;font-size:17px;margin-right:auto}
.top .brand .ac{color:#2fd0c0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#b7c6dd;border:1px solid transparent;border-radius:8px;padding:7px 11px;font-family:var(--sans);font-size:12.5px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:#2fd0c0;color:#062018;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 3px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h3{font-family:var(--sans);font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .pill{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:2px 8px;margin-left:auto}
canvas{display:block;width:100%}
.note{color:var(--faint);font-size:12px;margin-top:8px}
/* dynamic table */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tbar input{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-family:var(--sans);font-size:13px}
.tbar .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;background:var(--card)}
th:hover{color:var(--ink)}
th .ar{opacity:.4;font-size:9px}
th.sort .ar{opacity:1;color:var(--teal)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr:hover{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600}
.c-sim{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.c-nao{background:color-mix(in srgb,var(--faint) 16%,transparent);color:var(--faint)}
.pos{color:var(--coral);font-weight:600}.neg{color:var(--teal);font-weight:600}
section{scroll-margin-top:70px}
footer{color:var(--faint);font-size:12px;border-top:1px solid var(--line);margin-top:30px;padding:18px 0 40px}
footer a{color:var(--mut)}
</style>

const fmt=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d).replace('.',',');
const pf=(p)=>p==null?'—':(p<0.001?'<0,001':fmt(p,3));

/* ---------- dynamic table: sortable headers + search ---------- */
function dtable(host, cols, rows){
 // cols: [{k,label,num,render}]
 const wrap=document.createElement('div');
 const bar=document.createElement('div'); bar.className='tbar';
 const inp=document.createElement('input'); inp.placeholder='filtrar…';
 const cnt=document.createElement('span'); cnt.className='cnt';
 bar.append(inp,cnt); wrap.append(bar);
 const tw=document.createElement('div'); tw.className='tw';
 const tbl=document.createElement('table'); tw.append(tbl); wrap.append(tw); host.append(wrap);
 let sortK=null, dir=1, filter='';
 function draw(){
  const q=filter.toLowerCase();
  let rs=rows.filter(r=>!q||cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)));
  if(sortK){const c=cols.find(x=>x.k===sortK);rs=rs.slice().sort((a,b)=>{let x=a[sortK],y=b[sortK];if(c.num){x=+x;y=+y}if(x==null)return 1;if(y==null)return -1;return x<y?-1*dir:x>y?dir:0;});}
  let h='<thead><tr>'+cols.map(c=>`<th data-k="${c.k}" class="${sortK===c.k?'sort':''}">${c.label} <span class="ar">${sortK===c.k?(dir>0?'▲':'▼'):'↕'}</span></th>`).join('')+'</tr></thead>';
  h+='<tbody>'+rs.map(r=>'<tr>'+cols.map(c=>{const v=c.render?c.render(r[c.k],r):(r[c.k]??'—');return `<td class="${c.num?'num':''}">${v}</td>`;}).join('')+'</tr>').join('')+'</tbody>';
  tbl.innerHTML=h; cnt.textContent=rs.length+'/'+rows.length;
  tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)dir*=-1;else{sortK=k;dir=1;}draw();});
 }
 inp.oninput=()=>{filter=inp.value;draw();}; draw();
}
function card(title,pill){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${title}${pill?`<span class="pill">${pill}</span>`:''}</h3>`;return c;}

/* ---------- horizontal bar chart (canvas) ---------- */
function barChart(host,items,opts){
 opts=opts||{}; const c=document.createElement('canvas'); host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1), W=host.clientWidth, H=opts.h||(items.length*30+26);
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const vals=items.flatMap(i=>[i.v,i.lo,i.hi].filter(v=>v!=null));
 let mn=Math.min(0,...vals),mx=Math.max(0,...vals);if(opts.min!=null)mn=opts.min;if(opts.max!=null)mx=opts.max;
 const padL=opts.l||96,padR=46,padT=4,padB=4,bh=(H-padT-padB)/items.length;
 const X=v=>padL+(v-mn)/(mx-mn||1)*(W-padL-padR);
 const ink=cv('ink'),mut=cv('mut'),line=cv('line');
 if(mn<0){x.strokeStyle=line;x.beginPath();x.moveTo(X(0),padT);x.lineTo(X(0),H-padB);x.stroke();}
 const base=opts.base!=null?opts.base:(mn<0?0:mn);
 items.forEach((it,i)=>{const y=padT+i*bh,cc=cv(it.c||'blue');
  x.fillStyle=cc;const x0=X(base),x1=X(it.v);roundRect(x,Math.min(x0,x1),y+bh*0.2,Math.abs(x1-x0),bh*0.6,3);x.fill();
  if(it.lo!=null&&it.hi!=null){x.strokeStyle=cc;x.globalAlpha=.55;x.lineWidth=1.6;x.beginPath();x.moveTo(X(it.lo),y+bh/2);x.lineTo(X(it.hi),y+bh/2);x.stroke();x.globalAlpha=1;}
  x.fillStyle=mut;x.font='11px '+cv('sans').replace(/,.*/,'');x.textAlign='right';x.fillText(it.l,padL-8,y+bh/2+4);
  x.fillStyle=ink;x.font='700 11px '+cv('mono').replace(/,.*/,'');x.textAlign=it.v>=0?'left':'right';x.fillText((opts.fmt?opts.fmt(it.v):fmt(it.v)),x1+(it.v>=0?5:-5),y+bh/2+4);});
}
function roundRect(x,a,b,w,h,r){r=Math.min(r,h/2,Math.abs(w)/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

/* ---------- gauge dial (canvas) ---------- */
function gauge(host,g){
 const c=document.createElement('canvas');host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1),W=host.clientWidth,H=132;
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const cx=W/2,cy=H-18,R=Math.min(W/2-8,90),lw=15;
 const A0=Math.PI*1.02,A1=Math.PI*1.98; // 180°+ arc
 const T=v=>A0+(v-g.min)/(g.max-g.min||1)*(A1-A0);
 // zone arcs
 (g.zones||[]).forEach(z=>{x.strokeStyle=cv(z[2]);x.globalAlpha=.85;x.lineWidth=lw;x.lineCap='butt';
  x.beginPath();x.arc(cx,cy,R,T(z[0]),T(z[1]));x.stroke();});
 x.globalAlpha=1;
 // needle
 const vv=Math.max(g.min,Math.min(g.max,g.v)),a=T(vv);
 x.strokeStyle=cv('ink');x.lineWidth=2.5;x.lineCap='round';
 x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*(R-2),cy+Math.sin(a)*(R-2));x.stroke();
 x.fillStyle=cv('ink');x.beginPath();x.arc(cx,cy,4.5,0,7);x.fill();
 // value + label
 const disp=g.fmt==='pct'?fmt(g.v,0)+'%':(g.fmt==='auc'?fmt(g.v):(g.fmt==='d3'?fmt(g.v,3):fmt(g.v)));
 x.fillStyle=cv('ink');x.textAlign='center';x.font='700 27px '+cv('serif').replace(/,.*/,'');
 x.fillText(disp,cx,cy-14);
 x.fillStyle=cv('faint');x.font='9.5px '+cv('mono').replace(/,.*/,'');
 x.fillText(fmt(g.min,g.min%1?1:0)+(g.fmt==='pct'?'':'')+'  …  '+fmt(g.max,g.max%1?1:0),cx,cy+14);
}

/* ---------- radar chart (canvas) ---------- */
function radar(host,axes,series,opts){
 opts=opts||{};const c=document.createElement('canvas');host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1),W=host.clientWidth,H=opts.h||300;
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-40,N=axes.length,mx=opts.max||10;
 const ang=i=>-Math.PI/2+i/N*2*Math.PI;
 const pt=(i,r)=>[cx+Math.cos(ang(i))*R*r/mx,cy+Math.sin(ang(i))*R*r/mx];
 const line=cv('line'),mut=cv('mut'),faint=cv('faint');
 // rings
 x.strokeStyle=line;x.fillStyle=faint;x.lineWidth=1;
 for(let g=1;g<=4;g++){const rr=mx*g/4;x.globalAlpha=.6;x.beginPath();
  for(let i=0;i<=N;i++){const[px,py]=pt(i%N,rr);i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}
 x.globalAlpha=1;
 // spokes + labels
 for(let i=0;i<N;i++){const[px,py]=pt(i,mx);x.strokeStyle=line;x.globalAlpha=.6;x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();x.globalAlpha=1;
  const[lx,ly]=pt(i,mx*1.14);x.fillStyle=mut;x.font='11px '+cv('sans').replace(/,.*/,'');
  x.textAlign=Math.abs(lx-cx)<6?'center':(lx>cx?'left':'right');x.textBaseline='middle';x.fillText(axes[i],lx,ly);}
 // series polygons
 series.forEach(se=>{const col=cv(se.c);
  x.beginPath();se.vals.forEach((v,i)=>{const[px,py]=pt(i,v);i?x.lineTo(px,py):x.moveTo(px,py);});x.closePath();
  x.fillStyle=col;x.globalAlpha=.16;x.fill();x.globalAlpha=1;x.strokeStyle=col;x.lineWidth=2;x.stroke();
  se.vals.forEach((v,i)=>{const[px,py]=pt(i,v);x.fillStyle=col;x.beginPath();x.arc(px,py,3,0,7);x.fill();});});
}

/* ---------- 4D bubble chart (canvas): x, y, size, colour ---------- */
function bubble4d(host,pts,opts){
 opts=opts||{};const c=document.createElement('canvas');host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1),W=host.clientWidth,H=opts.h||330;
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const padL=54,padR=18,padT=30,padB=44;
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),ss=pts.map(p=>p.s),gs=pts.map(p=>p.g);
 let xmn=Math.min(...xs,opts.x0??0),xmx=Math.max(...xs);let ymn=Math.min(...ys,0),ymx=Math.max(...ys);
 const pad=(a,b)=>{const d=(b-a)*0.12||1;return[a-d,b+d];};[xmn,xmx]=pad(xmn,xmx);[ymn,ymx]=pad(ymn,ymx);
 const smx=Math.max(...ss),gmn=Math.min(...gs),gmx=Math.max(...gs);
 const X=v=>padL+(v-xmn)/(xmx-xmn||1)*(W-padL-padR);
 const Y=v=>H-padB-(v-ymn)/(ymx-ymn||1)*(H-padT-padB);
 const Rr=s=>7+Math.sqrt(s/smx)*26;
 const ink=cv('ink'),mut=cv('mut'),line=cv('line'),faint=cv('faint');
 // grid + zero lines
 x.strokeStyle=line;x.lineWidth=1;x.globalAlpha=.7;
 if(xmn<0&&xmx>0){x.beginPath();x.moveTo(X(0),padT);x.lineTo(X(0),H-padB);x.stroke();}
 if(ymn<0&&ymx>0){x.beginPath();x.moveTo(padL,Y(0));x.lineTo(W-padR,Y(0));x.stroke();}
 x.globalAlpha=1;
 // axes
 x.strokeStyle=line;x.lineWidth=1.3;x.beginPath();x.moveTo(padL,padT);x.lineTo(padL,H-padB);x.lineTo(W-padR,H-padB);x.stroke();
 x.fillStyle=mut;x.font='11px '+cv('sans').replace(/,.*/,'');
 x.textAlign='center';x.fillText(opts.xlab||'x',padL+(W-padL-padR)/2,H-8);
 x.save();x.translate(13,padT+(H-padT-padB)/2);x.rotate(-Math.PI/2);x.textAlign='center';x.fillText(opts.ylab||'y',0,0);x.restore();
 // two-hue diverging colour by g (teal→coral)
 function mix(t){const a=cv('teal').match(/\w\w/g).map(h=>parseInt(h,16)),b=cv('coral').match(/\w\w/g).map(h=>parseInt(h,16));
  return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';}
 pts.forEach(p=>{const px=X(p.x),py=Y(p.y),r=Rr(p.s),t=(p.g-gmn)/(gmx-gmn||1);
  x.fillStyle=mix(t);x.globalAlpha=.55;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  x.globalAlpha=1;x.lineWidth=1.5;x.strokeStyle=mix(t);x.stroke();
  x.fillStyle=ink;x.font='700 11px '+cv('sans').replace(/,.*/,'');x.textAlign='center';x.textBaseline='middle';
  let ly=py-r-8;if(ly<padT+4)ly=py+r+12;x.fillText(p.l,px,ly);});
}

/* ---------- monitoring line chart (canvas): bands + series ---------- */
function monitor(host,days,series,opts){
 opts=opts||{};const c=document.createElement('canvas');host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1),W=host.clientWidth,H=opts.h||300;
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const padL=42,padR=66,padT=14,padB=42;
 let mn=opts.min??0,mx=opts.max??10;
 const X=i=>padL+i/(days.length-1||1)*(W-padL-padR);
 const Y=v=>H-padB-(v-mn)/(mx-mn||1)*(H-padT-padB);
 const ink=cv('ink'),mut=cv('mut'),line=cv('line'),faint=cv('faint');
 // zone bands
 (opts.bands||[]).forEach(b=>{x.fillStyle=cv(b[2]);x.globalAlpha=.10;x.fillRect(padL,Y(b[1]),W-padL-padR,Y(b[0])-Y(b[1]));});
 x.globalAlpha=1;
 // gridlines y
 x.strokeStyle=line;x.fillStyle=faint;x.font='10px '+cv('mono').replace(/,.*/,'');x.textAlign='right';x.textBaseline='middle';
 for(let g=0;g<=5;g++){const v=mn+(mx-mn)*g/5,yy=Y(v);x.globalAlpha=.5;x.beginPath();x.moveTo(padL,yy);x.lineTo(W-padR,yy);x.stroke();x.globalAlpha=1;x.fillText(fmt(v,0),padL-6,yy);}
 // HIIT day markers
 (opts.hiit||[]).forEach(d=>{const i=days.indexOf(d);if(i<0)return;x.strokeStyle=cv('coral');x.globalAlpha=.35;x.setLineDash([4,4]);x.beginPath();x.moveTo(X(i),padT);x.lineTo(X(i),H-padB);x.stroke();x.setLineDash([]);x.globalAlpha=1;});
 // x labels
 x.fillStyle=mut;x.font='10.5px '+cv('sans').replace(/,.*/,'');x.textAlign='center';x.textBaseline='top';
 days.forEach((d,i)=>x.fillText('D'+d+((opts.hiit||[]).includes(d)?'▲':''),X(i),H-padB+7));
 // series
 series.forEach(se=>{const col=cv(se.c);x.strokeStyle=col;x.lineWidth=2.2;x.beginPath();
  se.vals.forEach((v,i)=>{i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});x.stroke();
  se.vals.forEach((v,i)=>{x.fillStyle=col;x.beginPath();x.arc(X(i),Y(v),3.2,0,7);x.fill();});
  // direct label at last point
  const li=se.vals.length-1;x.fillStyle=col;x.font='700 11px '+cv('sans').replace(/,.*/,'');x.textAlign='left';x.textBaseline='middle';x.fillText(se.l,X(li)+6,Y(se.vals[li]));});
}

/* CÁLCULO · LIMITES E DERIVADAS */
(function(){const s=sec('calc','Cálculo');
 const L=D.lim, aj=L.ajuste;
 s.innerHTML='<h2>Cálculo — limites e derivadas da trajetória de fadiga</h2><p class="sub">Formaliza o acúmulo com o cálculo. Ajuste saturante f(t)=L−(L−f₁)·e^(−k(t−1)) à fadiga física média diária (L='+fmt(aj.L)+'; k='+fmt(aj.k)+'; R²='+fmt(aj.R2)+'). A <b>derivada</b> f′(t) é a velocidade de acúmulo/dia; a razão incremental converge para f′('+fmt(L.t0,0)+')='+fmt(L.f_linha_analitica)+' quando h→0 (definição por limite). A derivada é positiva e decrescente (f″<0): acumula cada vez mais devagar e satura no limite lim(t→∞) f(t)=L≈'+fmt(L.limite_L)+'. No modelo fitness–fadiga, a derivada zera no ponto crítico t*='+fmt(L.t_critico)+' (pico de fadiga aguda).</p>';
 const g=document.createElement('div');g.className='grid2';s.append(g);
 const c1=card('Definição por limite — razão incremental em t₀='+fmt(L.t0,0),'[f(t₀+h)−f(t₀)]/h → f′(t₀)');s.append(c1);g.append(c1);
 dtable(c1,[{k:'h',label:'h (incremento)',num:true,render:v=>fmt(v,v<0.01?3:2)},{k:'quociente',label:'quociente',num:true,render:v=>fmt(v,4)}],
   L.razoes.concat([{h:0,quociente:L.f_linha_analitica}]).map(r=>({h:r.h,quociente:r.quociente})));
 c1.insertAdjacentHTML('beforeend','<p class="note">O quociente incremental converge para a derivada analítica f′('+fmt(L.t0,0)+')=<b>'+fmt(L.f_linha_analitica)+'</b> à medida que h→0 — a definição de derivada por limite, verificada numericamente.</p>');
 const c2=card('Derivada f′(t) por dia — velocidade de acúmulo','ajuste saturante');const d2=document.createElement('div');c2.append(d2);s.append(c2);g.append(c2);
 requestAnimationFrame(()=>{barChart(d2,L.derivadas.map(r=>({l:'Dia '+r.dia,v:r.f_linha,c:r.f_linha>=0?'coral':'teal'})),{min:0,max:2,l:70,fmt:v=>fmt(v)});});
 c2.insertAdjacentHTML('beforeend','<p class="note">f′(t) positiva e decrescente: a fadiga acumula, mas cada vez mais devagar (f″<0), saturando em L≈'+fmt(L.limite_L)+'.</p>');
 const c3=card('Função, 1ª e 2ª derivadas por dia','f · f′ · f″');s.append(c3);
 dtable(c3,[{k:'dia',label:'Dia'},{k:'f',label:'f(t)',num:true,render:v=>fmt(v)},{k:'f_linha',label:"f′(t)",num:true,render:v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`},{k:'f_2linha',label:'f″(t)',num:true,render:v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${fmt(v)}</span>`}],L.derivadas);
 c3.insertAdjacentHTML('beforeend','<p class="note">Limite do acúmulo: lim(t→∞) f(t)=L≈'+fmt(L.limite_L)+'. Modelo fitness–fadiga: derivada zero em t*='+fmt(L.t_critico)+' (nadir do estado / pico de fadiga aguda); depois relaxa à linha de base.</p>');
})();

nav.innerHTML=SEC.map(([id,t],i)=>`<button data-s="${id}" class="${i===0?'on':''}">${t}</button>`).join('');
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.s).scrollIntoView({behavior:'smooth',block:'start'});});
addEventListener('scroll',()=>{let cur=SEC[0][0];for(const [id] of SEC){if(document.getElementById(id).getBoundingClientRect().top<90)cur=id;}nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.s===cur));},{passive:true});
addEventListener('resize',()=>{document.querySelectorAll('canvas').forEach(c=>c.remove());/* charts fixed on load; simplest: reload */});
</script>
