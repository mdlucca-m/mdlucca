<style>
*{box-sizing:border-box}
:root{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0;
 --head:#0f2036;
 --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
 --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}}
:root[data-theme="dark"]{
 --bg:#0b1220; --card:#141f34; --ink:#eaf0f9; --mut:#9fb0ca; --faint:#67789a; --line:#243449;
 --teal:#2fd0c0; --coral:#ff8080; --gold:#f2bd52; --blue:#54a8e6; --violet:#b394ff; --head:#0a1424;
}
:root[data-theme="light"]{
 --bg:#eef2f8; --card:#ffffff; --ink:#16273d; --mut:#5b6b82; --faint:#8595ad; --line:#e2e8f1;
 --teal:#0e9c90; --coral:#c0392b; --gold:#b0790f; --blue:#245c8b; --violet:#7a4fb0; --head:#0f2036;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#eaf0f9;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px -6px rgba(0,0,0,.5)}
.top .brand{font-family:var(--serif);font-weight:600;font-size:17px;margin-right:auto}
.top .brand .ac{color:#2fd0c0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#b7c6dd;border:1px solid transparent;border-radius:8px;padding:7px 11px;font-family:var(--sans);font-size:12.5px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:#2fd0c0;color:#062018;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 3px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h3{font-family:var(--sans);font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .pill{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:2px 8px;margin-left:auto}
canvas{display:block;width:100%}
.note{color:var(--faint);font-size:12px;margin-top:8px}
/* dynamic table */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tbar input{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-family:var(--sans);font-size:13px}
.tbar .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;background:var(--card)}
th:hover{color:var(--ink)}
th .ar{opacity:.4;font-size:9px}
th.sort .ar{opacity:1;color:var(--teal)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr:hover{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600}
.c-sim{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.c-nao{background:color-mix(in srgb,var(--faint) 16%,transparent);color:var(--faint)}
.pos{color:var(--coral);font-weight:600}.neg{color:var(--teal);font-weight:600}
section{scroll-margin-top:70px}
footer{color:var(--faint);font-size:12px;border-top:1px solid var(--line);margin-top:30px;padding:18px 0 40px}
footer a{color:var(--mut)}
</style>

const fmt=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d).replace('.',',');

/* ---------- dynamic table: sortable headers + search ---------- */
function dtable(host, cols, rows){
 // cols: [{k,label,num,render}]
 const wrap=document.createElement('div');
 const bar=document.createElement('div'); bar.className='tbar';
 const inp=document.createElement('input'); inp.placeholder='filtrar…';
 const cnt=document.createElement('span'); cnt.className='cnt';
 bar.append(inp,cnt); wrap.append(bar);
 const tw=document.createElement('div'); tw.className='tw';
 const tbl=document.createElement('table'); tw.append(tbl); wrap.append(tw); host.append(wrap);
 let sortK=null, dir=1, filter='';
 function draw(){
  const q=filter.toLowerCase();
  let rs=rows.filter(r=>!q||cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)));
  if(sortK){const c=cols.find(x=>x.k===sortK);rs=rs.slice().sort((a,b)=>{let x=a[sortK],y=b[sortK];if(c.num){x=+x;y=+y}if(x==null)return 1;if(y==null)return -1;return x<y?-1*dir:x>y?dir:0;});}
  let h='<thead><tr>'+cols.map(c=>`<th data-k="${c.k}" class="${sortK===c.k?'sort':''}">${c.label} <span class="ar">${sortK===c.k?(dir>0?'▲':'▼'):'↕'}</span></th>`).join('')+'</tr></thead>';
  h+='<tbody>'+rs.map(r=>'<tr>'+cols.map(c=>{const v=c.render?c.render(r[c.k],r):(r[c.k]??'—');return `<td class="${c.num?'num':''}">${v}</td>`;}).join('')+'</tr>').join('')+'</tbody>';
  tbl.innerHTML=h; cnt.textContent=rs.length+'/'+rows.length;
  tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)dir*=-1;else{sortK=k;dir=1;}draw();});
 }
 inp.oninput=()=>{filter=inp.value;draw();}; draw();
}
function card(title,pill){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${title}${pill?`<span class="pill">${pill}</span>`:''}</h3>`;return c;}

/* ---------- horizontal bar chart (canvas) ---------- */
function barChart(host,items,opts){
 opts=opts||{}; const c=document.createElement('canvas'); host.append(c);
 const dpr=Math.min(2,devicePixelRatio||1), W=host.clientWidth, H=opts.h||(items.length*30+26);
 c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);
 const vals=items.flatMap(i=>[i.v,i.lo,i.hi].filter(v=>v!=null));
 let mn=Math.min(0,...vals),mx=Math.max(0,...vals);if(opts.min!=null)mn=opts.min;if(opts.max!=null)mx=opts.max;
 const padL=opts.l||96,padR=46,padT=4,padB=4,bh=(H-padT-padB)/items.length;
 const X=v=>padL+(v-mn)/(mx-mn||1)*(W-padL-padR);
 const ink=cv('ink'),mut=cv('mut'),line=cv('line');
 if(mn<0){x.strokeStyle=line;x.beginPath();x.moveTo(X(0),padT);x.lineTo(X(0),H-padB);x.stroke();}
 const base=opts.base!=null?opts.base:(mn<0?0:mn);
 items.forEach((it,i)=>{const y=padT+i*bh,cc=cv(it.c||'blue');
  x.fillStyle=cc;const x0=X(base),x1=X(it.v);roundRect(x,Math.min(x0,x1),y+bh*0.2,Math.abs(x1-x0),bh*0.6,3);x.fill();
  if(it.lo!=null&&it.hi!=null){x.strokeStyle=cc;x.globalAlpha=.55;x.lineWidth=1.6;x.beginPath();x.moveTo(X(it.lo),y+bh/2);x.lineTo(X(it.hi),y+bh/2);x.stroke();x.globalAlpha=1;}
  x.fillStyle=mut;x.font='11px '+cv('sans').replace(/,.*/,'');x.textAlign='right';x.fillText(it.l,padL-8,y+bh/2+4);
  x.fillStyle=ink;x.font='700 11px '+cv('mono').replace(/,.*/,'');x.textAlign=it.v>=0?'left':'right';x.fillText((opts.fmt?opts.fmt(it.v):fmt(it.v)),x1+(it.v>=0?5:-5),y+bh/2+4);});
}
function roundRect(x,a,b,w,h,r){r=Math.min(r,h/2,Math.abs(w)/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

  barChart(d3,D.roc.pre_vs_pos.slice().sort((a,b)=>a.AUC-b.AUC).map(r=>({l:r.label,v:r.AUC,c:r.AUC>=0.7?'coral':'blue'})),{min:0.5,max:0.8});
