# Deploy na Render (https://render.com) — 1 clique a partir do repo.
# IMPORTANTE: o disco persistente (/data) preserva os alunos/sessoes/links
# entre deploys. Disco persistente exige plano pago (starter). No plano free
# (sem disco) o banco e recriado a cada deploy — bom so para demonstracao.
services:
  - type: web
    name: mdlucca-biomecanica
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MDLUCCA_DB
        value: /data/db.sqlite
      # Licenca white-label: cole o token assinado (scripts/make_license.py issue)
      # no painel da Render (marcado sync:false = segredo, nao vai pro repo).
      # Sem isto, endpoints do produto respondem 402. Alternativa p/ a SUA
      # instancia dona: MDLUCCA_DEV=1 (libera tudo, sem checagem de licenca).
      - key: MDLUCCA_LICENSE
        sync: false
      # Marca branca opcional (JSON): nome, cor, logo. Ex.: {"name":"Studio X"}
      - key: MDLUCCA_BRAND
        sync: false
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
