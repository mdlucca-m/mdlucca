<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinâmica do Humor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg0:#070a10; --bg1:#0c141f; --bg2:#0f1826;
  --glass:rgba(17,26,39,.58); --glass2:rgba(23,33,49,.66); --stroke:rgba(120,150,190,.16);
  --ink:#e9eef6; --muted:#93a3b8; --faint:#61748c;
  --vigor:#33c2ad; --fadiga:#ff7a45; --pth:#8b7bf0; --tensao:#4d9de0; --depressao:#c56bd6; --raiva:#e0525b; --confusao:#f0a848;
  --good:#2ff0cf; --warn:#ffc24d; --crit:#ff5c72; --accent:#2ff0cf;
  --shadow:0 22px 60px -24px rgba(0,0,0,.78);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Manrope",system-ui,sans-serif; color:var(--ink); min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 720px at 82% -10%,rgba(139,123,240,.16),transparent 60%),
    radial-gradient(1000px 640px at -6% 110%,rgba(51,194,173,.13),transparent 58%),
    linear-gradient(158deg,var(--bg0),var(--bg1) 46%,var(--bg2));}
#rain{position:fixed; inset:0; z-index:0; pointer-events:none}
.shell{position:relative; z-index:2; display:grid; grid-template-columns:262px 1fr; min-height:100vh}

/* ---------- SIDEBAR ---------- */
.side{position:sticky; top:0; align-self:start; height:100vh; display:flex; flex-direction:column; gap:14px; padding:20px 16px;
  background:linear-gradient(180deg,rgba(15,23,36,.82),rgba(12,19,30,.62)); backdrop-filter:blur(20px) saturate(1.2);
  border-right:1px solid var(--stroke); overflow-y:auto}
.side::-webkit-scrollbar{width:7px}.side::-webkit-scrollbar-thumb{background:rgba(120,150,190,.2); border-radius:7px}
.side-brand{display:flex; align-items:center; gap:12px; padding:4px 6px 10px}
.logo{width:42px; height:42px; display:grid; place-items:center; font-size:22px; border-radius:13px;
  background:linear-gradient(150deg,rgba(90,211,196,.28),rgba(139,123,240,.22)); border:1px solid var(--stroke); box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.side-brand .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent)}
.side-title{font-family:"Sora",sans-serif; font-weight:800; font-size:17px; letter-spacing:-.01em; line-height:1.1}
.side-nav{display:flex; flex-direction:column; gap:3px}
.navitem{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:12px; cursor:pointer; color:var(--muted);
  border:1px solid transparent; transition:.2s; font-size:13.5px; font-weight:500}
.navitem .ico{width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center; color:var(--faint); transition:.2s}
.navitem .ico svg{width:20px; height:20px}
.navitem .n,.navitem{}
.navnum{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--faint)}
.navitem:hover{color:var(--ink); background:rgba(120,150,190,.08)}
.navitem:hover .ico{color:var(--accent)}
.navitem[aria-current="true"]{color:#04120f; background:linear-gradient(180deg,#6ee3d2,#33c2ad); border-color:transparent; box-shadow:0 10px 24px -12px rgba(51,194,173,.75); font-weight:600}
.navitem[aria-current="true"] .ico,.navitem[aria-current="true"] .navnum{color:rgba(4,18,15,.6)}
.side-seg{margin-top:auto; padding:12px 8px 4px; border-top:1px solid var(--stroke)}
.seg-lab{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; display:flex; align-items:center; gap:7px}
.var-chips{display:flex; flex-wrap:wrap; gap:6px}
.vchip{display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  padding:5px 9px; border-radius:9px; border:1px solid var(--stroke); background:var(--glass); cursor:pointer; transition:.18s}
.vchip .dot{width:9px; height:9px; border-radius:50%}
.vchip:hover{color:var(--ink); border-color:rgba(120,150,190,.34)}
.vchip[aria-pressed="true"]{color:var(--ink); background:var(--glass2); border-color:rgba(90,211,196,.55); box-shadow:0 0 0 1px rgba(90,211,196,.25) inset}
.nav-group{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
  padding:14px 11px 6px; display:flex; align-items:center; gap:8px}
.nav-group::after{content:""; flex:1; height:1px; background:var(--stroke)}
.nav-group.first{padding-top:2px}

/* ---------- STEP NAV (guia: anterior / próximo) ---------- */
.stepnav{display:flex; gap:12px; margin-top:28px; padding-top:20px; border-top:1px solid var(--stroke); flex-wrap:wrap}
.stepbtn{flex:1 1 200px; min-width:0; display:flex; align-items:center; gap:13px; padding:13px 16px; border-radius:15px;
  border:1px solid var(--stroke); background:var(--glass2); cursor:pointer; text-align:left; color:inherit; font:inherit;
  transition:transform .2s, border-color .2s, background .2s}
.stepbtn:hover{border-color:rgba(90,211,196,.5); transform:translateY(-1px); background:var(--glass)}
.stepbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.stepbtn.next{flex-direction:row-reverse; text-align:right}
.stepbtn .sarr{font-size:22px; font-weight:700; color:var(--accent); line-height:1; flex:0 0 auto}
.stepbtn .slab{display:block; font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.stepbtn .stt{display:block; font-family:"Sora",sans-serif; font-weight:600; font-size:14px; margin-top:3px; letter-spacing:-.01em}
.stepbtn.ghost{visibility:hidden}

/* ---------- APP MAIN ---------- */
.app{min-width:0; display:flex; flex-direction:column; overflow-x:hidden}
canvas.chart{max-width:100%}
.topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:16px 26px; background:linear-gradient(180deg,rgba(10,16,25,.7),rgba(10,16,25,.15)); backdrop-filter:blur(12px); border-bottom:1px solid var(--stroke)}
.crumb{display:flex; align-items:center; gap:11px}
.crumb .cico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--accent);background:var(--glass);border:1px solid var(--stroke)}
.crumb .ct{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.crumb h1{font-family:"Sora",sans-serif; font-weight:700; font-size:19px; margin:0; letter-spacing:-.01em}
.meta{display:flex; gap:8px; flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted); background:var(--glass); border:1px solid var(--stroke); border-radius:999px; padding:6px 11px}
.chip b{color:var(--ink)}
.stage{padding:24px 26px 70px; perspective:1800px}
.panel{background:var(--glass); border:1px solid var(--stroke); border-radius:22px; padding:24px; backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:var(--shadow); transform-style:preserve-3d; opacity:0; transform:translateY(14px) rotateX(7deg)}
.panel.in{opacity:1; transform:none; transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1)}

.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
.section-head h2{font-family:"Sora",sans-serif; font-weight:700; font-size:21px; margin:0; letter-spacing:-.01em}
.section-head .tag{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent); letter-spacing:.1em; text-transform:uppercase}
.lead{color:var(--muted); font-size:13.5px; line-height:1.62; max-width:76ch; margin:9px 0 20px}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:14px; margin-bottom:20px}
.kpi{background:var(--glass2); border:1px solid var(--stroke); border-radius:16px; padding:15px 16px; position:relative; overflow:hidden; transition:transform .25s; transform-style:preserve-3d}
.kpi .lab{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.kpi .val{font-family:"Sora",sans-serif; font-weight:800; font-size:29px; line-height:1.05; margin-top:6px; letter-spacing:-.02em}
.kpi .cap{font-size:11.5px; color:var(--faint); margin-top:3px}
.kpi .stripe{position:absolute; left:0; top:0; bottom:0; width:4px}
.kpi .mico{position:absolute; top:12px; right:12px; width:26px; height:26px; display:grid; place-items:center; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid var(--stroke)}
.kpi .mico svg{width:15px; height:15px}
.kpi.act{cursor:pointer} .kpi.act::after{content:"↗"; position:absolute; bottom:10px; right:12px; font-size:11px; color:var(--faint); opacity:0; transition:.2s; font-family:"IBM Plex Mono",monospace}
.kpi.act:hover{border-color:rgba(90,211,196,.45)} .kpi.act:hover::after{opacity:1}
.dossier{background:linear-gradient(150deg,var(--glass2),var(--glass)); border:1px solid var(--stroke); border-radius:18px; padding:20px 22px; margin-bottom:20px; position:relative; overflow:hidden}
.dossier .dhead{display:flex; align-items:center; gap:13px; margin-bottom:12px; flex-wrap:wrap}
.dossier .dglyph{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:#06121a}
.dossier .dglyph svg{width:23px; height:23px}
.dossier h3{font-family:"Sora",sans-serif; font-weight:700; font-size:20px; margin:0; letter-spacing:-.01em}
.dossier .dtxt{color:var(--muted); font-size:13.5px; line-height:1.65; max-width:82ch}
.dossier .dtxt b{color:var(--ink); font-weight:600}
.vbadges{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
.vbadge{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:5px 10px; border-radius:999px; border:1px solid var(--stroke); display:flex; align-items:center; gap:6px}
.vbadge .bd{width:7px; height:7px; border-radius:50%}
.vsel{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
.vsel .vs{display:flex; align-items:center; gap:7px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); padding:7px 12px; border-radius:11px; border:1px solid var(--stroke); background:var(--glass); cursor:pointer; transition:.18s}
.vsel .vs .dot{width:10px;height:10px;border-radius:50%}
.vsel .vs:hover{color:var(--ink); border-color:rgba(120,150,190,.34)}
.vsel .vs[aria-pressed="true"]{color:#06121a; border-color:transparent}

.grid2{display:grid; grid-template-columns:1fr; gap:18px}
@media(min-width:1040px){.grid2{grid-template-columns:1.12fr .88fr}}
.card{background:var(--glass2); border:1px solid var(--stroke); border-radius:16px; padding:16px; transition:transform .25s, border-color .25s}
.card:hover{border-color:rgba(120,150,190,.28); transform:translateY(-2px)}
.card h3{font-family:"Sora",sans-serif; font-weight:600; font-size:14.5px; margin:0 0 4px}
.card .note{font-size:11.5px; color:var(--faint); margin:0 0 12px}
.host{position:relative; width:100%}
canvas.chart{display:block; width:100%; height:auto}
.legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:12px}
.legend .it{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; font-family:"IBM Plex Mono",monospace}
.legend .it .dot{width:12px; height:12px; border-radius:4px}
.legend .it.off{opacity:.35; text-decoration:line-through}
.legend .it.selon{color:var(--ink); background:var(--glass2); border:1px solid rgba(120,150,190,.34); border-radius:9px; padding:5px 10px}

table.dyn{width:100%; border-collapse:collapse; font-size:12.5px}
table.dyn th,table.dyn td{padding:8px 10px; text-align:right; border-bottom:1px solid rgba(120,150,190,.1); font-variant-numeric:tabular-nums; font-family:"IBM Plex Mono",monospace}
table.dyn th:first-child,table.dyn td:first-child{text-align:left; font-family:"Manrope",sans-serif}
table.dyn thead th{color:var(--muted); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; position:sticky; top:0; background:linear-gradient(180deg,rgba(23,33,49,.97),rgba(23,33,49,.74)); white-space:nowrap}
table.dyn thead th:hover{color:var(--ink)} table.dyn thead th .ar{color:var(--accent); font-size:9px; margin-left:3px}
table.dyn tbody tr{transition:background .15s} table.dyn tbody tr:hover{background:rgba(90,211,196,.06)}
table.dyn tbody tr.hlrow{background:rgba(90,211,196,.1)}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:10.5px; font-family:"IBM Plex Mono",monospace}
.pill.grande{background:rgba(224,82,91,.16); color:#ff8a92}.pill.médio{background:rgba(240,168,72,.16); color:#ffc27a}
.pill.pequeno{background:rgba(77,157,224,.16); color:#8fc4f2}.pill.trivial{background:rgba(120,150,190,.14); color:var(--muted)}
.sig{color:var(--good); font-weight:600}.pos{color:#ff9166}.neg{color:#5ad3c4}
.tablewrap{overflow-x:auto; margin-top:6px}
.decflow{display:flex; flex-direction:column; margin-top:6px}
.dec{position:relative; padding:15px 18px 16px 58px; border:1px solid var(--stroke); border-radius:16px; background:var(--glass2); margin-bottom:12px; transition:transform .2s, border-color .2s}
.dec:hover{transform:translateY(-2px); border-color:rgba(120,150,190,.3)}
.dec .num{position:absolute; left:16px; top:15px; width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font:700 12px "IBM Plex Mono",monospace; color:#04120f; background:linear-gradient(180deg,#6ee3d2,#33c2ad)}
.dec .step{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.dec .decision{font-family:"Sora",sans-serif; font-weight:700; font-size:15px; margin:2px 0 5px}
.dec .decision .ar{color:var(--accent); margin:0 6px}
.dec .why{color:var(--muted); font-size:13px; line-height:1.56}
.dec .why b{color:var(--ink)}
.stepper{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px}
.stepbtn{display:flex; align-items:center; gap:8px; font:600 12px "Manrope",sans-serif; color:var(--muted); background:var(--glass); border:1px solid var(--stroke); border-radius:11px; padding:8px 12px; cursor:pointer; transition:.18s}
.stepbtn .sn{font-family:"IBM Plex Mono",monospace; font-size:10px; width:18px; height:18px; display:grid; place-items:center; border-radius:6px; background:rgba(120,150,190,.16); color:var(--muted)}
.stepbtn:hover{color:var(--ink); border-color:rgba(120,150,190,.34)}
.stepbtn[aria-current="true"]{color:#04120f; background:linear-gradient(180deg,#6ee3d2,#33c2ad); border-color:transparent; box-shadow:0 8px 20px -12px rgba(51,194,173,.7)}
.stepbtn[aria-current="true"] .sn{background:rgba(4,18,15,.22); color:#04120f}
.pathnav{display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:12px}
.navbtn{font:600 13px "Manrope",sans-serif; color:var(--ink); background:var(--glass2); border:1px solid var(--stroke); border-radius:12px; padding:11px 18px; cursor:pointer; transition:.18s}
.navbtn:hover:not([disabled]){border-color:rgba(120,150,190,.4); transform:translateY(-1px)}
.navbtn[disabled]{opacity:.38; cursor:default}
.navbtn.primary{color:#04120f; background:linear-gradient(180deg,#6ee3d2,#33c2ad); border-color:transparent}
.pathpos{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted)}
.flowrow{display:flex; flex-wrap:wrap; align-items:center; margin:6px -6px}
.fbox{flex:1 1 150px; min-width:135px; background:var(--glass2); border:1px solid var(--stroke); border-radius:14px; padding:14px 15px; margin:6px; transition:transform .25s}
.fbox:hover{transform:translateY(-3px) rotateX(4deg)}
.fbox .fk{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:3px}
.fbox .ft{font-family:"Sora",sans-serif; font-weight:700; font-size:13.5px}
.fbox .fs{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.42}
.farrow{color:var(--accent); font-size:20px; padding:0 1px; flex:0 0 auto}
.deckdots{display:flex; gap:7px; justify-content:center; margin-top:16px}
.d2{width:9px; height:9px; border-radius:50%; background:rgba(120,150,190,.3); cursor:pointer; transition:.2s; border:none; padding:0}
.d2[aria-current="true"]{background:linear-gradient(180deg,#6ee3d2,#33c2ad); transform:scale(1.3)}
.slidehead{font-family:"Sora",sans-serif; font-weight:700; font-size:22px; margin:2px 0 4px; letter-spacing:-.01em}
.slidesub{color:var(--muted); font-size:13.5px; margin-bottom:16px; max-width:72ch; line-height:1.55}
.flowcanvas{overflow-x:auto; padding:10px 2px 14px; -webkit-overflow-scrolling:touch}
.flowinner{position:relative}
.fnode{position:absolute; display:flex; align-items:center; gap:10px; background:var(--glass2); border:1px solid var(--stroke); border-radius:14px; padding:11px 13px; box-shadow:var(--shadow); z-index:2; opacity:0; cursor:pointer; transform:translateY(8px); transition:opacity .45s, transform .45s, border-color .2s}
.fnode.in{opacity:1; transform:none}
.fnode:hover{border-color:rgba(90,211,196,.6); transform:translateY(-2px)}
.fnode:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.fngo{margin-left:auto; color:var(--faint); font-size:20px; font-weight:700; line-height:1; transition:.2s}
.fnode:hover .fngo{color:var(--accent); transform:translateX(2px)}
.fni{width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border-radius:10px; background:rgba(120,150,190,.14)}
.fni svg{width:19px; height:19px}
.fntitle{font-family:"Sora",sans-serif; font-weight:700; font-size:12.5px; line-height:1.12}
.fnsub{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.25}
.wires{position:absolute; inset:0; z-index:1; pointer-events:none}
.wire{fill:none; stroke:rgba(120,150,190,.34); stroke-width:2.6}
.wire.flow{stroke:var(--accent); stroke-width:2.8; stroke-dasharray:6 9; animation:dashmove 1.5s linear infinite; filter:drop-shadow(0 0 3px rgba(47,240,207,.35))}
/* ---------- ÁRVORE DE DECISÕES ---------- */
.dtree{margin-top:6px}
.dnode{position:relative}
.dq{display:flex; align-items:center; gap:12px; background:var(--glass2); border:1px solid var(--stroke); border-left:3px solid var(--accent); border-radius:14px; padding:12px 15px; box-shadow:var(--shadow)}
.dq .di{width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:9px; background:rgba(90,211,196,.14); color:var(--accent)}
.dq .di svg{width:18px; height:18px}
.dq .dqt{font-family:"Sora",sans-serif; font-weight:700; font-size:14px; line-height:1.2}
.dq .dqs{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35}
.dchildren{margin:0 0 0 27px; padding-left:22px; border-left:2px dashed var(--stroke)}
.dbranch{position:relative; margin-top:14px}
.dbranch::before{content:""; position:absolute; left:-22px; top:13px; width:20px; height:2px; background:var(--stroke)}
.dlabel{display:inline-flex; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:3px 10px; border-radius:999px; margin-bottom:8px; border:1px solid var(--stroke); color:var(--muted)}
.dlabel.yes{color:#7ee3c6; border-color:rgba(90,211,196,.4); background:rgba(90,211,196,.08)}
.dlabel.no{color:#f0a878; border-color:rgba(240,138,72,.35); background:rgba(240,138,72,.08)}
.dleaf{display:flex; align-items:flex-start; gap:12px; background:var(--glass); border:1px solid var(--stroke); border-radius:13px; padding:11px 14px; transition:transform .2s, border-color .2s}
.dleaf.link{cursor:pointer}
.dleaf.link:hover{border-color:rgba(90,211,196,.5); transform:translateY(-1px)}
.dleaf .li{width:28px; height:28px; flex:0 0 28px; display:grid; place-items:center; border-radius:8px}
.dleaf .li svg{width:16px; height:16px}
.dleaf .lt{font-family:"Sora",sans-serif; font-weight:600; font-size:13px; line-height:1.2}
.dleaf .ld{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.45}
.dleaf .lex{font-size:10.5px; color:var(--faint); margin-top:4px; font-style:italic}
.dleaf .dgo{margin-left:auto; color:var(--faint); font-size:18px; font-weight:700; align-self:center}
.dleaf.link:hover .dgo{color:var(--accent)}
.dqgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.drules{margin:8px 0 0; padding-left:18px; color:var(--muted); font-size:12.5px; line-height:1.7}
.drules b{color:var(--ink)}
@media(max-width:640px){.dchildren{margin-left:13px; padding-left:12px} .dbranch::before{left:-12px; width:10px} .dqgrid{grid-template-columns:1fr}}

  const proto=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    ${chip("bolt","Intensidade",P.int)}${chip("split","Estrutura",P.estrut)}${chip("clock","Recupera\u00e7\u00e3o",P.rec)}
    ${chip("trend","Velocidade",P.vel)}${chip("wave","Dist\u00e2ncia",P.dist)}${chip("layers","Volume total",P.distot)}</div>`;
  const rows=HIITPROTO.ses.map(s=>`<tr><td><b>${s.s}</b></td><td>${s.dia}</td><td style="text-align:center">${s.fcmax}</td><td style="text-align:center">${s.fcpos}</td><td style="text-align:center">+${s.dfc}</td><td style="text-align:center">${num(s.pse,1)}</td><td style="text-align:center">${s.trimp}</td><td style="text-align:center">${s.spse}</td><td style="text-align:center">${s.dist}</td></tr>`).join("");
  c.innerHTML=`<h3>Protocolo e carga interna do HIIT (TIAI)</h3><p class="note">3 sess\u00f5es (S1=D2 \u00b7 S2=D4 \u00b7 S3=D7) \u00b7 esfor\u00e7os intermitentes a <b>104% do pico de velocidade do T-CAR</b> em 4 blocos de 4 min com 3 min de recupera\u00e7\u00e3o</p>
   ${proto}
   <div class="tablewrap"><table class="dyn"><thead><tr><th>Sess\u00e3o</th><th>Dia</th><th>FCm\u00e1x (bpm)</th><th>FC p\u00f3s</th><th>\u0394FC</th><th>PSE (0\u201310)</th><th>TRIMP</th><th>sPSE (u.a.)</th><th>Dist\u00e2ncia (m)</th></tr></thead><tbody>${rows}</tbody></table></div>

    g.fillStyle=C.muted;g.font='10px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="bottom";g.fillText("PC1 · "+Math.round(P.ve[0]*100)+"%",cxp+R,cyp+16);
    g.save();g.translate(cxp-14,cyp-R);g.rotate(-Math.PI/2);g.textAlign="left";g.fillText("PC2 · "+Math.round(P.ve[1]*100)+"%",0,0);g.restore();
  });attachHits(cv);
}

/* ===================== TABLES ===================== */
function dynTable(host,cols,rows,fmt,hlRowLabel){
  const wrap=document.createElement("div");wrap.className="tablewrap";const t=document.createElement("table");t.className="dyn";let sortCol=-1,dir=1;
  function render(){const body=rows.map(r=>r.slice());if(sortCol>=0)body.sort((a,b)=>{let x=a[sortCol],y=b[sortCol];x=typeof x==="number"?x:parseFloat(String(x).replace(",","."))||String(x);y=typeof y==="number"?y:parseFloat(String(y).replace(",","."))||String(y);return (x>y?1:x<y?-1:0)*dir;});
    t.innerHTML="<thead><tr>"+cols.map((c,i)=>`<th data-i="${i}">${c}${sortCol===i?` <span class="ar">${dir>0?"▲":"▼"}</span>`:""}</th>`).join("")+"</tr></thead><tbody>"+body.map(r=>`<tr class="${hlRowLabel&&r[0]===hlRowLabel?'hlrow':''}">`+r.map((v,i)=>`<td>${fmt?fmt(i,v,r):v}</td>`).join("")+"</tr>").join("")+"</tbody>";
    t.querySelectorAll("th").forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(sortCol===i)dir*=-1;else{sortCol=i;dir=1;}render();});}
  render();wrap.appendChild(t);host.appendChild(wrap);
}

/* ===================== 3D TILT ===================== */
function tilt(el){if(rm)return;el.querySelectorAll(".kpi").forEach(k=>{k.addEventListener("mousemove",e=>{const r=k.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;k.style.transform=`rotateX(${(-py*7).toFixed(2)}deg) rotateY(${(px*8).toFixed(2)}deg) translateZ(6px)`;});k.addEventListener("mouseleave",()=>k.style.transform="");});}

  blk("grid","1 · De onde vêm os dados","A base do estudo","<b>27 atletas</b> de handebol masculino de elite, <b>456 respostas</b> ao longo de <b>7 dias</b> (21–27/04/2024), 3 momentos por dia (manhã/tarde/noite). Instrumentos: <b>BRUMS</b> (6 dimensões do humor + PTH), fadiga física/mental percebidas, <b>Epworth</b> (sonolência) e <b>PSS</b> (estresse), <b>carga interna do HIIT</b> (FC/PSE por sessão) e o teste <b>T-CAR</b> (aptidão aeróbia). Tudo auditado contra os bancos originais: as datas, a contagem de atletas e as médias batem; corrigimos armadilhas (datas de nascimento na coluna de data; nomes com erro de digitação) usando o carimbo de envio e a chave de anonimização.",[["visao","Visão geral"],["descr","Descritiva"],["fisico","Teste físico"]],C.tensao);

  blk("shield","3 · Por que cada análise (o método)","As escolhas e seus porquês","<b>Por que testes não-paramétricos?</b> Os escores do BRUMS não seguem distribuição normal e têm forte efeito de piso (Shapiro-Wilk) → <b>Friedman</b> (comparar os 7 dias) e <b>Wilcoxon</b> (D1 vs D7), com <b>W de Kendall</b> e <b>dz</b> como tamanhos de efeito (o <i>p</i> diz se mudou; o efeito diz <i>quanto</i>). <b>Por que derivadas e curvas?</b> Comparar só D1 com D7 diz que mudou; a <b>velocidade (1ª derivada)</b> e a <b>inflexão (2ª derivada)</b> dizem <b>quando e como</b>. <b>Por que separar por tipo de dia?</b> Porque carga igual (HIIT vs jogo) pode ter significados diferentes — daí o <b>modelo misto</b>, que controla a posição na semana e usa todos os atletas. <b>Por que perfis?</b> Traduzem as seis dimensões numa forma única e clinicamente legível.",[["analise","Análise estatística"],["arvore","Árvore de decisões"],["robustez","Sensibilidade & robustez"]],C.warn);
  blk("trend","4 · Resultado principal — o eixo energia–fadiga","Vigor cai, fadiga sobe","A deterioração concentra-se num <b>eixo dominante</b>: o <b>vigor cai</b> (D1 7,6 → D7 4,5; dz −0,95, efeito grande) e a <b>fadiga sobe</b> (4,0 → 7,5; dz +0,72), enquanto as dimensões negativas ficam junto ao piso. As curvas de vigor e fadiga <b>se cruzam</b> (~dias 2,9/3,6/5,7): a fadiga passa a superar o vigor no fim da semana. É a <b>erosão do perfil iceberg</b> — sinal de sobrecarga funcional, não de humor negativo generalizado.",[["d17","D1 → D7"],["curvas","Curvas por variável"],["limites","Limites & derivadas"],["traj","Trajetórias"]],C.vigor);
  blk("split","5 · As negativas SÃO informativas (por tipo de estímulo)","Jogo × HIIT: assinaturas opostas","Parecia que as negativas eram só ruído de piso — mas elas <b>respondem ao tipo de estímulo</b>. Com carga física equivalente (mesmo vigor/fadiga no meio da semana), as negativas são <b>menores no dia de jogo</b> que no HIIT: raiva (dz −0,48), depressão (−0,43), confusão (−0,49). O <b>HIIT é aversivo</b> (sobe raiva/confusão); o <b>jogo é protetor do humor</b>. É um <b>segundo eixo de informação</b> — a qualidade afetiva da carga.",[["negdia","Negativas por tipo de dia"],["framework","Framework do microciclo"]],C.raiva);
  blk("moon","6 · Sono e estresse confirmam a leitura","Mais sonolentos, não mais estressados","A <b>sonolência (Epworth) sobe</b> ao longo da semana (dz +0,58; p=0,019) e acompanha a fadiga (ρ +0,34) — marcador de necessidade de recuperação. Já o <b>estresse (PSS) fica estável</b> e é o mais baixo nos dias de jogo. Ou seja: os atletas ficam <b>fisicamente desgastados e sonolentos, mas não psicologicamente estressados</b> — evidência independente de <b>sobrecarga funcional sem distresse</b>.",[["sono","Sono & Estresse"]],C.pth);
  blk("bolt","7 · A carga que produziu tudo isso (HIIT)","O estímulo e sua assinatura","Três sessões de HIIT (D2/D4/D7) a <b>104% do pico de velocidade do T-CAR</b>, em <b>4 séries de 4 min com 3 min de recuperação</b> (~2.929 m/sessão; FCmáx ~182 bpm). A carga <b>acumula</b>: na última sessão a FCmáx cai e a PSE/ΔFC/sPSE sobem. Os dias sem HIIT <b>não são leves</b> — incluem força e amistosos, com pico de volume em D5–D6.",[["hiit","Dias com/sem HIIT"]],C.fadiga);
  blk("shield","8 · Rastreio de risco (saúde mental / lesão)","Perfis negativos como triagem","Os perfis de risco (iceberg/everest invertido) aparecem em <b>18,7%</b> dos atleta-dias e a barbatana de tubarão (sobrecarga) concentra-se no HIIT. Seis atletas repetem perfil negativo (candidatos a acompanhamento). <b>Viabilidade demonstrada</b>, mas <b>sem validação com lesão</b> neste microciclo (as lesões do banco são de torneio posterior, n=3) — é um instrumento de <b>triagem</b>, não uma relação causal.",[["risco","Perfis de risco"],["perfis","Perfis de humor"]],C.crit);
  blk("focus","9 · Discussão — o que tudo isso significa","Dois eixos, uma conclusão","O humor de atletas de elite num microciclo tem <b>dois eixos independentes</b>: um <b>energético</b> (vigor/fadiga/sono), que responde à <b>quantidade</b> de carga e se acumula; e um <b>afetivo-negativo</b> (raiva/confusão/estresse), que responde à <b>qualidade</b> do estímulo. Monitorar os dois separa a <b>fadiga funcional</b> (esperada, reversível — o preço do treino) do <b>estresse aversivo</b> (sinal de alerta). Método robusto: os achados centrais sobrevivem a filtros, à remoção de qualquer atleta (LOAO) e a diferentes suavizadores — não dependem de uma escolha analítica.",[["framework","Framework"],["robustez","Robustez"]],C.good);
  blk("ruler","10 · Limitações","O que este estudo não pode afirmar","Grupo único (sem controle) — descreve a dinâmica, não isola o efeito causal de um estímulo. O <b>Friedman</b> usa casos completos (n=19). A classificação de perfis depende do método (centroide na amostra). E <b>não há desfechos de lesão vinculados</b> a este microciclo. Nada disso invalida os achados centrais (grandes, consistentes, robustos), mas delimita o que se pode concluir.",null,C.muted);
  const jump=document.createElement("div");jump.className="legend";jump.style.marginTop="16px";h.appendChild(jump);
  h.querySelectorAll(".jlink").forEach(b=>b.onclick=()=>go(b.dataset.go));
}},

{id:"multivar",lab:"Estrutura multivariada",icon:"scatter",render(h){

  tilt(h);
  const g1=cards(h,`<div class="card"><h3>Ordenação PCoA + agrupamento não supervisionado</h3><p class="note">cada ponto é uma observação (atleta×dia); o algoritmo separou dois perfis · ● centroides</p><div class="host" id="h_ord"></div></div><div class="card"><h3>Trajetória semanal do centroide do perfil</h3><p class="note">D1 → D7 no mesmo mapa (zoom): o perfil médio desloca-se rumo à perturbação</p><div class="host" id="h_traj"></div></div>`);
  drawOrd($("#h_ord",g1));
  drawTraj($("#h_traj",g1));
  const L=MV.load.PCo1,D=["Tensão","Depressão","Raiva","Vigor","Fadiga","Confusão"];
  const strong=D.map((d,i)=>[d,L[i]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  h.insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:16px;border-left:3px solid var(--accent)"><h3>O que o algoritmo encontrou</h3><p class="note" style="font-size:13.5px;line-height:1.62;color:var(--ink)"><b>O eixo dominante (PCo1, ${Math.round(MV.var[0]*100)}%) é o de energia ↔ perturbação:</b> o vigor (${String(L[3].toFixed(2)).replace(".",",")}) puxa para um lado; depressão (${String(L[1].toFixed(2)).replace(".",",")}), fadiga (${String(L[4].toFixed(2)).replace(".",",")}), raiva (${String(L[2].toFixed(2)).replace(".",",")}) e confusão (${String(L[5].toFixed(2)).replace(".",",")}) para o outro. Os <b>dois perfis</b> que o k-means isolou sem rótulos são um estado <b style="color:${C.vigor}">recuperado</b> (vigor alto, negativas baixas; ${MV.cl.n[0]} obs.) e um estado de <b style="color:${C.raiva}">perturbação</b> (fadiga, depressão, raiva e confusão elevadas, vigor baixo; ${MV.cl.n[1]} obs.) — a mesma dicotomia <i>iceberg → barbatana de tubarão</i> descrita nos perfis, agora emergindo da própria estrutura dos dados. A trajetória dos centroides diários e a <b>PERMANOVA (p = 0,002)</b> confirmam, de forma independente, o deslocamento rumo à perturbação ao longo da semana.</p></div>`);
  h.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}},

{id:"hiit",lab:"Dias com/sem HIIT",icon:"pulse",render(h){

  h.insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:16px;border-left:3px solid var(--accent)"><p class="note" style="font-size:13.5px;line-height:1.64;color:var(--ink)"><b>Síntese do framework:</b> o microciclo combina estímulos de naturezas diferentes. O <b>eixo energia–fadiga</b> (vigor↓, fadiga↑, sono↑) responde à <b>carga física</b> e se acumula rumo ao D7. As <b>dimensões negativas e o estresse</b> respondem à <b>qualidade do estímulo</b>: sobem no HIIT (aversivo) e caem no jogo (engajante). Monitorar os dois eixos separa <b>fadiga funcional</b> (esperada, reversível) de <b>estresse aversivo</b> (sinal de alerta) — mesmo quando a carga externa é a mesma.</p></div>`);

  [["hiit","Dias com/sem HIIT"],["negdia","Negativas por tipo de dia"],["sono","Sono & Estresse"],["curvas","Curvas por variável"]].forEach(([id,lb])=>{const b=document.createElement("span");b.className="it";b.style.cursor="pointer";b.innerHTML=`<span class="dot" style="background:${C.vigor}"></span>${lb} ›`;b.onclick=()=>go(id);jump.appendChild(b);});
  h.appendChild(jump);
}},
{id:"preditivo",lab:"Modelos preditivos",icon:"trend",render(h){
  head(h,"modelagem avançada","Modelos preditivos, de crescimento e de aprendizado","Curvas de crescimento (modelos mistos), um modelo preditivo do humor e a curva de aprendizado. A leitura é honesta: <b>tendência clara no grupo</b>, <b>previsão individual limitada</b> — o que reforça a interpretação por tendências, não por leitura isolada de um atleta.");
  const g1=cards(h,`<div class="card"><h3>Curvas de crescimento (modelos mistos)</h3><p class="note">trajetória populacional do eixo energia-fadiga · intercepto e inclinação por atleta</p><div class="host" id="h_grow"></div></div><div class="card"><h3>Efeito do dia (termo fixo)</h3><p class="note">modelo misto por dimensão</p><div class="host" id="k_grow"></div></div>`);
  lineChart($("#h_grow",g1),DIM.filter(d=>["vigor","fadiga","pth"].includes(d.k)),{ymax:9});
  $("#k_grow",g1).innerHTML=`<div class="kpis"><div class="kpi"><span class="stripe" style="background:${C.vigor}"></span><div class="lab">Vigor</div><div class="val" style="color:${C.vigor};font-size:22px">cai</div><div class="cap">dia p = 0,003 · desacelera</div></div><div class="kpi"><span class="stripe" style="background:${C.fadiga}"></span><div class="lab">Fadiga</div><div class="val" style="color:${C.fadiga};font-size:22px">+0,3/dia</div><div class="cap">acúmulo linear</div></div><div class="kpi"><span class="stripe" style="background:${C.pth}"></span><div class="lab">PTH</div><div class="val" style="color:${C.pth};font-size:22px">em U</div><div class="cap">cai e volta a subir</div></div></div>`;
  const g2=cards(h,`<div class="card"><h3>Modelo preditivo · curva ROC</h3><p class="note">fase tardia (D5–7) vs inicial (D1–3) a partir do perfil de humor · validação cruzada por atleta</p><div id="k_pred"></div><div class="host" id="h_roc"></div></div><div class="card"><h3>Curva de aprendizado</h3><p class="note">AUC de treino e de validação cruzada por tamanho do conjunto de treino</p><div class="host" id="h_learn"></div></div>`);
  $("#k_pred",g2).innerHTML=`<div class="kpis" style="margin-bottom:4px"><div class="kpi"><span class="stripe" style="background:${C.warn}"></span><div class="lab">AUC (CV)</div><div class="val" style="color:${C.warn};font-size:22px">0,58</div><div class="cap">± 0,04 · previsão individual fraca</div></div><div class="kpi"><span class="stripe" style="background:${C.fadiga}"></span><div class="lab">Maior preditor</div><div class="val" style="color:${C.fadiga};font-size:20px">Fadiga</div><div class="cap">coef. padronizado +0,39</div></div></div>`;
  drawROC($("#h_roc",g2));
  drawLearn($("#h_learn",g2));
  const g3=cards(h,`<div class="card"><h3>Comparação de modelos · AUC</h3><p class="note">mesma tarefa e validação por atleta · logística vs gradient boosting (XGBoost, LightGBM)</p><div class="host" id="h_mbars"></div></div><div class="card"><h3>Leitura do teste de robustez</h3><p class="note">o que a comparação revela</p><div id="k_mbars"></div></div>`);
  drawModelBars($("#h_mbars",g3));
  $("#k_mbars",g3).innerHTML=`<div class="kpis" style="margin-bottom:8px"><div class="kpi"><span class="stripe" style="background:${C.tensao}"></span><div class="lab">Logística</div><div class="val" style="color:${C.tensao};font-size:22px">0,58</div><div class="cap">teto</div></div><div class="kpi"><span class="stripe" style="background:${C.fadiga}"></span><div class="lab">XGBoost</div><div class="val" style="color:${C.fadiga};font-size:22px">0,50</div><div class="cap">no acaso</div></div><div class="kpi"><span class="stripe" style="background:${C.vigor}"></span><div class="lab">LightGBM</div><div class="val" style="color:${C.vigor};font-size:22px">0,50</div><div class="cap">no acaso</div></div></div><p class="note" style="font-size:12.5px;line-height:1.6;color:var(--muted)">Modelos flexíveis (captam interações e não linearidades) <b style="color:var(--ink)">não superam</b> — nem igualam — a logística simples. O limite não é a forma do modelo, é a <b style="color:var(--ink)">ausência de sinal individual</b> explorável. Confirma a curva de aprendizado.</p>`;
  h.insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:18px;border-left:3px solid var(--accent)"><p class="note" style="font-size:13px;line-height:1.62;color:var(--muted)">A curva de aprendizado fica <b style="color:var(--ink)">plana e baixa</b> (~0,58, pouco acima do acaso 0,50), com pequena distância entre treino e validação: não é <i>overfitting</i>, é <b style="color:var(--ink)">sinal individual limitado</b>. Os modelos mistos, ao contrário, mostram uma <b style="color:var(--ink)">tendência populacional clara</b> — a mensagem prática é ler o grupo, e o indivíduo apenas acima da mudança mínima detectável (MDC).</p></div>`);
}},
{id:"analise",lab:"Análise estatística",icon:"flow",render(h){
  head(h,"passo a passo","Análise estatística — caminho guiado","Percorra a análise em ordem. A cada passo: a decisão e o seu porquê, com o resultado ao lado. Use a trilha numerada ou os botões Anterior / Próximo. Os passos de derivadas e cruzamentos usam a variável escolhida na segmentação lateral.");
  const selK=HLK()||"vigor",selLab=DERIV.vars[selK].lab;
  const STEPS=[
   {lab:"Normalidade",tag:"Distribuição dos dados",title:"Shapiro-Wilk <span class='ar'>→</span> estatística não paramétrica",
    why:"As dimensões negativas foram <b>não normais</b>, com assimetria e forte efeito de piso (muitos zeros). A escolha do teste segue a distribuição, não a preferência: por isso, testes não paramétricos para todas as dimensões.",
    reading:"Piso (% de escores nulos) por dimensão: quanto maior, menos a média informa.",
    draw:host=>barChart(host,SNR.map(r=>({lab:r[0],v:r[4],c:r[4]>=50?C.crit:r[4]>=25?C.warn:C.good})),{ymax:100,dec:0,unit:"%"})},
   {lab:"Comparações",tag:"Testes não paramétricos",title:"Wilcoxon (pareado) e Friedman (7 dias)",
    why:"São <b>medidas repetidas em grupo único</b>: cada atleta é o seu próprio controle. Wilcoxon compara dois momentos pareados (D1×D7, pré×pós); Friedman testa a mudança ao longo dos sete dias.",
    reading:"Trajetórias diárias: o vigor cai e a fadiga sobe ao longo da semana.",
    draw:host=>lineChart(host,DIM.filter(d=>["vigor","fadiga","pth"].includes(d.k)),{ymax:9})},
   {lab:"Efeito",tag:"Relevância, não só significância",title:"Tamanho de efeito (dz) ao lado do p",
    why:"Um <b>p</b> pequeno diz que a mudança dificilmente é acaso, mas não diz se ela importa. O <b>tamanho de efeito</b> corrige as armadilhas do n grande e do n pequeno — por isso vem sempre ao lado do p.",
    reading:"dz do D1→D7: efeito grande no vigor (−0,95) e médio na fadiga (+0,72).",
    draw:host=>lolliChart(host,D17.map(r=>({lab:r[0],v:r[4],mag:r[5]})))},
   {lab:"MANOVA",tag:"Confirmação global",title:"MANOVA + correção de Bonferroni",
    why:"Confirma, de forma <b>multivariada e conservadora</b>, que o estado mudou como um todo, controlando a correlação entre dimensões. Após Bonferroni, só vigor e fadiga permanecem significativos — o que concentra o efeito no eixo energia-fadiga.",
    reading:"Separação forte entre o primeiro e o último dia.",
    draw:host=>{host.innerHTML=`<div class="kpis"><div class="kpi"><span class="stripe" style="background:${C.pth}"></span><div class="lab">Wilks λ</div><div class="val" style="color:${C.pth}">0,181</div><div class="cap">p < 0,001 · separação forte</div></div><div class="kpi"><span class="stripe" style="background:${C.vigor}"></span><div class="lab">Após Bonferroni</div><div class="val" style="font-size:20px">Vigor + Fadiga</div><div class="cap">só o eixo energia-fadiga resiste</div></div></div>`;}},
   {lab:"PERMANOVA",tag:"Multivariada não paramétrica",title:"PERMANOVA + PERMDISP (permutação restrita ao atleta)",
    why:"A MANOVA e o Hotelling assumem <b>normalidade multivariada</b> — que os dados não têm. A <b>PERMANOVA</b> testa o mesmo deslocamento do perfil por <b>permutação restrita ao atleta</b> (respeitando as medidas repetidas), sem esse pressuposto: é a peça que torna a multivariada <b>coerente</b> com a rota não paramétrica. O <b>PERMDISP</b> separa deslocamento de posição de mera diferença de dispersão.",
    reading:"Deslocamento do perfil pré×pós e ao longo da semana; R² pequeno = efeito real mas de baixa fração de variância.",
    draw:host=>{host.innerHTML=`<div class="kpis"><div class="kpi"><span class="stripe" style="background:${C.fadiga}"></span><div class="lab">Pré × pós</div><div class="val" style="color:${C.fadiga}">p = 0,002</div><div class="cap">pseudo-F=2,52 · R²=1,0% · PERMDISP p=0,34 (locação limpa)</div></div><div class="kpi"><span class="stripe" style="background:${C.vigor}"></span><div class="lab">Ao longo da semana</div><div class="val" style="color:${C.vigor}">p = 0,002</div><div class="cap">momento (pré/interm./pós): pseudo-F=1,75 · robustez</div></div></div><p class="note" style="margin-top:12px;font-size:12.5px;color:var(--muted)">O Hotelling paramétrico ficou limítrofe (p=0,054) por baixo poder e tensão com a normalidade — fica como verificação de sensibilidade, não como contradição.</p>`;}},
   {lab:"ICC",tag:"Confiabilidade e limiares",title:"ICC + MDC <span class='ar'>→</span> tendências de grupo",
    why:"O ICC mede a consistência das medidas repetidas; dele deriva a mudança mínima detectável (MDC). Como a MDC individual é alta, a interpretação apoia-se em <b>tendências de grupo</b>, não em leituras isoladas de um atleta.",
    reading:"ICC(2,1) por dimensão: moderado a bom; mais baixo em raiva e confusão.",
    draw:host=>barChart(host,ICC.map(r=>({lab:r[0],v:r[1],c:r[1]>=.5?C.good:C.warn})),{ymax:1,dec:2})},
   {lab:"AFC",tag:"Estrutura das medidas",title:"Análise fatorial confirmatória (6 fatores)",
    why:"Antes de interpretar, confirma-se que os itens do BRUMS medem as <b>seis dimensões</b> esperadas. O item invariante <b>tensao_1</b> (“Apavorado”, 99,6% no piso) foi excluído por inviabilizar a estimação; o modelo de <b>23 itens</b> manteve ajuste aceitável. A consistência interna (<b>ômega de McDonald</b>) é alta no eixo energia-fadiga e nas dimensões negativas mais endossadas.",
    reading:"Ajuste: CFI 0,87 · TLI 0,85 · RMSEA 0,08 · SRMR 0,09. Barras: ômega (ω) por dimensão.",
    draw:host=>{host.insertAdjacentHTML("beforeend",`<div class="kpis"><div class="kpi"><span class="stripe" style="background:${C.vigor}"></span><div class="lab">CFI / TLI</div><div class="val" style="color:${C.vigor}">0,87 / 0,85</div><div class="cap">ajuste aceitável · 6 fatores, 23 itens</div></div><div class="kpi"><span class="stripe" style="background:${C.fadiga}"></span><div class="lab">RMSEA / SRMR</div><div class="val" style="color:${C.fadiga}">0,08 / 0,09</div><div class="cap">item tensao_1 (99,6% piso) excluído</div></div></div>`);const dv=document.createElement("div");dv.className="host";host.appendChild(dv);barChart(dv,OMEGA.map(r=>({lab:r[0],v:r[1],c:r[1]>=.7?C.good:r[1]>=.5?C.warn:C.crit})),{ymax:1,dec:2});}},
   {lab:"TRI",tag:"Resposta ao item",title:"Modelo de resposta gradual (Samejima)",
    why:"Detalha o funcionamento de cada item no contínuo do traço: a <b>discriminação (a)</b> mostra quais itens separam melhor os níveis. Os itens do <b>eixo energia-fadiga</b> são os mais discriminativos; itens travados no piso (<b>Sonolento</b>, <b>Alerta</b>) têm discriminação próxima de zero — degenerescência amostral, não falha do item.",
    reading:"Discriminação (a) por item: alta na fadiga (Esgotado 2,2) e no vigor (Disposição 2,2); baixa nos itens de piso.",
    draw:host=>barChart(host,TRIA.map(r=>({lab:r[0],v:r[1],c:r[1]>=1?C.good:r[1]>=.5?C.warn:C.crit})),{ymax:2.4,dec:2})},
   {lab:"Perfis",tag:"Perfis de humor",title:"Classificação + qui-quadrado + regressão logística",
    why:"O qui-quadrado <b>não</b> foi significativo (p = 0,111) por baixa contagem por célula (poucos atletas em 6 perfis), não por ausência de migração. A <b>regressão logística</b> confirma a tendência (OR = 1,37 por dia).",
    reading:"Iceberg 41%→10%; barbatana de tubarão 7%→14% do D1 ao D7 (n=27→21).",
    draw:host=>groupChart(host,PERFIS.map(r=>({lab:r[0],vals:[r[1],r[2]]})),[{lab:"Dia 1",c:C.vigor},{lab:"Dia 7",c:C.fadiga}],{ymax:14})},
   {lab:"Derivadas",tag:"Forma temporal",title:"Suavização por spline + 2ª derivada",
    why:"Comparar só D1 com D7 diz que mudou; a <b>derivada</b> diz quando e como. A spline separa a tendência do ruído; a 2ª derivada localiza o <b>ponto de inflexão</b> (~dia 3,8), a fronteira entre prontidão e acúmulo.",
    reading:selLab+": trajetória, velocidade (1ª derivada) e aceleração (2ª derivada).",
    draw:host=>drawDeriv(host,selK)},
   {lab:"Cruzamentos",tag:"Ajuste polinomial e cruzamentos",title:"Polinômio de grau 3 (2 resoluções) + cruzamentos exatos",
    why:"O polinômio resume a trajetória em uma equação (R² = 0,96 vigor) e reproduz a mesma inflexão em duas resoluções — quando um achado sobrevive a métodos diferentes, é robusto (triangulação). Os cruzamentos datam a inversão do eixo (dias 2,9, 3,6 e 5,7).",
    reading:"Vigor e fadiga se cruzam (dias 2,9, 3,6 e 5,7); a linha em destaque é "+selLab+".",
    draw:host=>{let series=DIM.filter(d=>d.k==="vigor"||d.k==="fadiga");let ex=DIM.filter(d=>d.k===selK&&d.k!=="vigor"&&d.k!=="fadiga");if(!ex.length)ex=DIM.filter(d=>d.k==="pth");lineChart(host,series.concat(ex),{ymax:9,crosses:CROSS,hlk:selK});}},
   {lab:"Sinal/ruído",tag:"Qualidade do sinal",title:"Razão sinal/ruído <span class='ar'>→</span> foco no eixo",
    why:"Vigor (S/R = 8,4) e fadiga (6,7) têm tendência limpa; as negativas (2,7–4,4) são dominadas por ruído e piso. Junto da psicometria e do PCA, é a <b>terceira via independente</b> que fundamenta centrar o monitoramento no par vigor-fadiga.",
    reading:"Razão sinal/ruído por dimensão (verde ≥ 5; vermelho < 3).",
    draw:host=>barChart(host,SNR.map(r=>({lab:r[0],v:r[3],c:r[3]>=5?C.good:r[3]>=3?C.warn:C.crit})),{ymax:9,dec:1})},
   {lab:"Agudo/crônico",tag:"Microestrutura da fadiga",title:"Efeito agudo × crônico e transições sequenciais",
    why:"Cada dia foi partido em efeito agudo (pré→pós) e de recuperação (pós→pré do dia seguinte). O padrão em <b>dente de serra</b>, com recuperação apenas parcial, é a definição operacional do sobre-esforço funcional.",
    reading:"Agudo (intradia) vs crônico (D1→D7): o desgaste é sobretudo crônico.",
    draw:host=>groupSigned(host,DK.map(k=>({lab:DERIV.vars[k].lab,vals:[DERIV.ac[k].ag,DERIV.ac[k].cr],sig:DERIV.ac[k].sig})),[{lab:"Agudo (intradia)",c:C.fadiga},{lab:"Crônico (D1→D7)",c:C.pth}])},
   {lab:"PCA",tag:"Estrutura dimensional",title:"Análise de componentes principais",
    why:"A PCA resume as seis dimensões: o 1º componente é um eixo geral de perturbação (as negativas juntas) e o <b>vigor aponta no sentido oposto</b>. Reforça, por via exploratória e independente, a centralidade do eixo energia-fadiga.",
    reading:"Círculo de correlação: o vigor se opõe ao bloco das dimensões negativas.",
    draw:host=>pcaCircle(host)}
  ];
  let cur=0;
  const path=document.createElement("div");path.className="stepper";h.appendChild(path);
  const body=document.createElement("div");h.appendChild(body);
  const nav=document.createElement("div");nav.className="pathnav";h.appendChild(nav);
  STEPS.forEach((s,i)=>{const b=document.createElement("button");b.className="stepbtn";b.innerHTML=`<span class="sn">${i+1}</span>${s.lab}`;b.onclick=()=>{cur=i;renderStep();};path.appendChild(b);});
  function renderStep(){
    path.querySelectorAll(".stepbtn").forEach((b,i)=>b.setAttribute("aria-current",i===cur?"true":"false"));
    const s=STEPS[cur];body.innerHTML="";
    body.insertAdjacentHTML("beforeend",`<div class="dec" style="padding-left:58px"><span class="num">${cur+1}</span><div class="step">${s.tag}</div><div class="decision">${s.title}</div><div class="why">${s.why}</div></div>`);
    const rc=document.createElement("div");rc.className="card";rc.innerHTML=`<h3>Resultado</h3><p class="note">${s.reading}</p>`;const rh=document.createElement("div");rh.className="host";rc.appendChild(rh);body.appendChild(rc);
    s.draw(rh);
    nav.innerHTML=`<button class="navbtn" ${cur===0?"disabled":""} data-a="p">← Anterior</button><span class="pathpos">${cur+1} / ${STEPS.length} · ${s.lab}</span><button class="navbtn primary" ${cur===STEPS.length-1?"disabled":""} data-a="n">Próximo →</button>`;
    const pb=nav.querySelector('[data-a="p"]'),nb=nav.querySelector('[data-a="n"]');
    if(pb)pb.onclick=()=>{if(cur>0){cur--;renderStep();}};
    if(nb)nb.onclick=()=>{if(cur<STEPS.length-1){cur++;renderStep();}};
  }
  renderStep();
}},
{id:"arvore",lab:"Árvore de decisões",icon:"tree",render(h){
  head(h,"lógica do método","Árvore de decisões analíticas","Como cada método foi escolhido, ramificando pelas propriedades dos dados. As caixas com <span style='color:var(--accent)'>›</span> abrem a análise correspondente.");
  const L=(t,d,o={})=>({leaf:1,t,d,ex:o.ex,color:o.color||C.muted,go:o.go,icon:o.icon||"grid"});
  const TREE={q:"Distribuição da variável?",sub:"teste de Shapiro-Wilk (distribuição bruta e escores de mudança)",icon:"shield",branches:[
    {label:"Normal",cls:"yes",child:L("Via paramétrica (não aplicável)","nenhuma das seis dimensões do BRUMS seguiu distribuição normal — a rota adotada é integralmente não paramétrica",{color:C.muted,icon:"bars"})},
    {label:"Não normal (humor / BRUMS)",cls:"no",child:{q:"Efeito de piso?",sub:"proporção de escores nulos por dimensão",icon:"deriv",branches:[
      {label:"Severo (≥ 50% zeros)",cls:"no",child:L("Leitura por prevalência e perfil + cautela","dimensões negativas (depressão, raiva, tensão, confusão): sinal fraco (S/R < 4); lidas por perfil e migração, não pela média",{ex:"sentinelas de estados raros",color:C.crit,go:"perfis",icon:"layers"})},
      {label:"Baixo (vigor, fadiga)",cls:"yes",child:{q:"Qual comparação?",sub:"sinal forte (S/R 8,4 e 6,7) → análise quantitativa completa",icon:"flow",branches:[
        {label:"2 momentos pareados",cls:"opt",child:L("Wilcoxon + dz","pré×pós e D1×D7; cada atleta é o seu próprio controle",{color:C.fadiga,go:"agudo",icon:"pulse"})},
        {label:"7 dias (medidas repetidas)",cls:"opt",child:L("Friedman + W de Kendall","mudança ao longo da semana",{color:C.tensao,go:"dias",icon:"cal"})},
        {label:"Associação entre dimensões",cls:"opt",child:L("Spearman (ρ)","correlação de postos",{color:C.confusao,go:"corr",icon:"scatter"})},
        {label:"Forma temporal",cls:"opt",child:L("Spline + 1ª/2ª derivada · polinômio grau 3","inflexão (2ª derivada = 0, ~dia 4); grau escolhido por R² ajustado; cruzamentos exatos",{ex:"velocidade e aceleração do desgaste",color:C.confusao,go:"limites",icon:"deriv"})},
        {label:"Perfil multivariado (6 dimensões)",cls:"opt",child:{q:"Pressupostos multivariados?",sub:"normalidade multivariada e homogeneidade das covariâncias",icon:"split",branches:[
          {label:"Atendidos",cls:"yes",child:L("MANOVA / Hotelling T² + Bonferroni","confirmação paramétrica global (Wilks λ = 0,181)",{color:C.pth,go:"d17",icon:"layers"})},
          {label:"Violados (Henze-Zirkler p<0,001; M de Box p<0,001)",cls:"no",child:L("PERMANOVA + PERMDISP","permutação restrita ao atleta (respeita medidas repetidas); pré×pós p=0,002; PERMDISP separa locação de dispersão",{ex:"a peça coerente com a rota não paramétrica",color:C.raiva,go:"analise",icon:"flow"})}
        ]}}
      ]}}
    ]}}
  ]};
  function renderTree(n){
    if(n.leaf){const lk=n.go?" link":"";return `<div class="dleaf${lk}"${n.go?` data-go="${n.go}"`:""}><span class="li" style="background:${n.color}22;color:${n.color}">${ICONS[n.icon]||ICONS.grid}</span><div><div class="lt">${n.t}</div><div class="ld">${n.d}</div>${n.ex?`<div class="lex">${n.ex}</div>`:""}</div>${n.go?`<span class="dgo">›</span>`:""}</div>`;}
    const kids=n.branches.map(b=>`<div class="dbranch"><span class="dlabel ${b.cls}">${b.label}</span>${renderTree(b.child)}</div>`).join("");
    return `<div class="dnode"><div class="dq"><span class="di">${ICONS[n.icon]||ICONS.grid}</span><div><div class="dqt">${n.q}</div>${n.sub?`<div class="dqs">${n.sub}</div>`:""}</div></div><div class="dchildren">${kids}</div></div>`;
  }
  const wrap=document.createElement("div");wrap.className="dtree";wrap.innerHTML=renderTree(TREE);h.appendChild(wrap);
  h.insertAdjacentHTML("beforeend",
   `<div class="card" style="margin-top:20px;border-left:3px solid ${C.tensao}"><h3>Trilha paralela · qualidade das medidas</h3><p class="note">aplicada a todas as dimensões, antes da interpretação — clique para abrir</p><div class="dqgrid">`
   +`<div class="dleaf link" data-go="conf"><span class="li" style="background:${C.tensao}22;color:${C.tensao}">${ICONS.shield}</span><div><div class="lt">ICC + MDC / SWC</div><div class="ld">confiabilidade entre dias → limiares de mudança → tendências de grupo</div></div><span class="dgo">›</span></div>`
   +`<div class="dleaf link" data-go="conf"><span class="li" style="background:${C.good}22;color:${C.good}">${ICONS.shield}</span><div><div class="lt">α de Cronbach + ω de McDonald</div><div class="ld">consistência interna: alta no eixo energia-fadiga</div></div><span class="dgo">›</span></div>`
   +`<div class="dleaf link" data-go="conf"><span class="li" style="background:${C.vigor}22;color:${C.vigor}">${ICONS.grid}</span><div><div class="lt">AFC (6 fatores, 23 itens)</div><div class="ld">estrutura confirmada; item de piso tensao_1 excluído (CFI 0,87)</div></div><span class="dgo">›</span></div>`
   +`<div class="dleaf link" data-go="analise"><span class="li" style="background:${C.pth}22;color:${C.pth}">${ICONS.flow}</span><div><div class="lt">TRI (resposta gradual)</div><div class="ld">funcionamento dos itens; discriminação alta na fadiga e no vigor</div></div><span class="dgo">›</span></div>`
   +`</div></div>`
   +`<div class="card" style="margin-top:16px;border-left:3px solid var(--accent)"><h3>Regras transversais (sempre aplicadas)</h3><ul class="drules"><li><b>Tamanho de efeito ao lado do p</b> — relevância, não só significância.</li><li><b>Unidade amostral = o atleta</b> — a agregação por atleta corrige a pseudorreplicação das medidas repetidas.</li><li><b>Triangulação</b> — cada conclusão é sustentada por métodos independentes (multivariado, dinâmico e de sinal/ruído).</li><li><b>α = 5%</b>, com correção de multiplicidade quando aplicável (Bonferroni).</li></ul></div>`
   +`<div class="card" style="margin-top:20px;border-left:3px solid ${C.raiva}"><h3>Por que este modelo é mais robusto que o SPSS clássico</h3><p class="note">o que muda ao trocar a rotina de ANOVA/teste t por um fluxo escolhido pelas propriedades dos dados</p>`
   +`<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px">`
   +`<div style="flex:1 1 270px;background:var(--glass2);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.crit};margin-bottom:8px">Abordagem clássica · ANOVA / t no SPSS</div><ul class="drules" style="margin:0"><li>Exige <b>normalidade e esfericidade</b> — violadas pelo efeito de piso.</li><li>Trata o <b>tempo como categoria</b> — descarta a <i>forma</i> da mudança.</li><li>Sensível a <b>assimetria e zeros</b> nas dimensões negativas.</li><li>Atletas <b>intercambiáveis</b> — ignora a trajetória individual.</li><li>Responde só <b>“mudou?”</b> — não quando, quão rápido nem com que confiança.</li></ul></div>`
   +`<div style="flex:1 1 270px;background:rgba(90,211,196,.06);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.good};margin-bottom:8px">Este modelo · pipeline triangulado</div><ul class="drules" style="margin:0"><li><b>PERMANOVA</b> — sem normalidade; permutação restrita ao atleta.</li><li><b>Spline + derivadas</b> — velocidade, aceleração e <b>inflexão (~dia 4)</b>.</li><li><b>Modelos mistos</b> — trajetória individual (intercepto/inclinação).</li><li><b>Sinal/ruído + MDC</b> — qualificam <i>onde</i> a leitura é confiável.</li><li><b>AFC/TRI</b> e <b>teto preditivo honesto</b> (logística 0,58 ≥ XGBoost/LightGBM).</li></ul></div>`
   +`</div>`
   +`<div style="margin-top:14px;border-top:1px solid var(--stroke);padding-top:12px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px">Onde está a inovação</div><p class="note" style="font-size:13.5px;line-height:1.62;color:var(--ink);margin:0">Nenhuma técnica é nova isolada — elas vivem dispersas (processamento de sinais, ecologia, psicometria, estatística longitudinal). O ineditismo é <b>integrá-las num único fluxo para o monitoramento diário do humor no esporte coletivo</b> — domínio que se acomodou à ANOVA/t sobre amostras pequenas e piso, justo onde esses testes falham — importando <b>cálculo</b> (derivadas, limites, inflexão) e <b>teoria de sinais</b> (filtragem, S/R) para ler estados psicológicos, com a árvore acima tornando a escolha do método função explícita dos dados.</p></div></div>`);
  h.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}},

     host.insertAdjacentHTML("beforeend",`<div class="card"><h3>${vLab()} em uma frase</h3><p class="note" style="font-size:14px;line-height:1.65;color:var(--ink)">${vLab()} ${dir} de ${num(s.d1,1)} para ${num(s.d7,1)} do D1 ao D7 (efeito ${mag}, dz ${(s.dz>=0?"+":"")+num(s.dz,2)}), com inflexão ${s.infl!=null?"por volta do "+dcomma(s.infl):"não detectada"} e razão sinal/ruído de ${num(s.snr,1)} — ${s.snr>=5?"tendência limpa e confiável":s.snr>=3?"sinal moderado":"sinal fraco, dominado pelo piso"}.</p></div>`);

function mag(dz){const a=Math.abs(dz);return a>=0.8?"grande":a>=0.5?"médio":a>=0.2?"pequeno":"trivial";}
function sg(x,d=2){return (x>=0?"+":"")+num(x,d);}
function pfmt(p){return p<0.001?"< 0,001":("= "+num(p,3));}
function pShort(p){return p<0.001?"p<0,001":"p="+num(p,3);}
function chipv(c,t){return `<span class="vbadge"><span class="bd" style="background:${c}"></span>${t}</span>`;}
function badges(k){const s=DERIV.stats[k];return [
  chipv(s.icc>=.75?C.good:s.icc>=.5?C.warn:C.crit,"confiab. "+(s.icc>=.75?"boa":s.icc>=.5?"moderada":"baixa")),
  chipv(s.snr>=5?C.good:s.snr>=3?C.warn:C.crit,"S/R "+num(s.snr,1)),
  chipv(Math.abs(s.dz)>=.8?C.crit:Math.abs(s.dz)>=.5?C.warn:C.muted,"efeito "+mag(s.dz)),
  chipv(C.pth,Math.abs(s.cr)>Math.abs(s.ag)*2?"mudança crônica":"agudo + crônico")].join("");}
function narr(k){const s=DERIV.stats[k],v=DERIV.vars[k];
  const nat=Math.abs(s.cr)>Math.abs(s.ag)*2?"predominantemente crônica, por acúmulo entre os dias":"resultante tanto do estímulo agudo quanto do acúmulo entre os dias";
  const inf=s.infl?`apresentou inflexão por volta do <b>dia ${num(s.infl,1)}</b>`:"não apresentou inflexão nítida";
  const snrtxt=s.snr>=5?"tendência limpa e confiável":s.snr>=3?"tendência moderada":"variação dominada por ruído, a interpretar com cautela";
  return `<b>${v.lab}</b> teve média semanal de <b>${num(s.m,1)} ± ${num(s.sd,1)}</b> (CV ${num(s.cv,0)}%) e piso de <b>${num(s.floor,0)}%</b> de escores nulos. A confiabilidade entre dias foi <b>${num(s.icc,2)}</b> (MDC95 ${num(s.mdc95,1)} pontos). Ao longo da semana a variação foi <b>${s.fp<0.05?"significativa":"não significativa"}</b> (Friedman χ² = ${num(s.chi,1)}, p ${pfmt(s.fp)}; W = ${num(s.W,2)}). Do primeiro ao sétimo dia passou de <b>${num(s.d1,1)}</b> para <b>${num(s.d7,1)}</b> (${sg(s.delta,1)}; dz ${sg(s.dz)}, efeito <b>${mag(s.dz)}</b>). A mudança foi ${nat} (agudo ${sg(s.ag)}, crônico ${sg(s.cr)}). A curva ${inf}, com velocidade de pico de ${sg(s.vpk,1)} ponto por dia (dia ${num(s.vpkx,1)}). A razão sinal/ruído foi <b>${num(s.snr,1)}</b>, o que indica ${snrtxt}.`;}
function kpi(icon,lab,val,cap,color,goto){const d=document.createElement("div");d.className="kpi act";
  d.innerHTML=`<span class="stripe" style="background:${color}"></span><span class="mico" style="color:${color}">${icon}</span><div class="lab">${lab}</div><div class="val" style="font-size:21px">${val}</div><div class="cap">${cap}</div>`;
  if(goto)d.onclick=()=>go(goto);d.title=lab+" — abrir análise";return d;}
function momentos(k){const items=[],s=DERIV.stats[k];
  if(s.sig17)items.push(`<b>D1 → D7</b>: ${sg(s.delta,1)} · dz ${sg(s.dz)} · ${pShort(s.p17)}`);
  if(s.sigpp)items.push(`<b>Pré vs pós da semana</b>: dz ${sg(s.dzpp)} · ${pShort(s.ppp)}`);
  DERIV.trans.forEach(t=>{const o=t.v[k];if(o.sig)items.push(`<b>${t.lab}</b> (${t.tipo.toLowerCase()}): dz ${sg(o.dz)}`);});
  for(let d=2;d<=7;d++){const o=DERIV.prepos_dia[String(d)][k];if(o.sig)items.push(`<b>Dia ${d} · pré→pós</b>: dz ${sg(o.dz)}`);}
  if(!items.length)return `<p class="note" style="margin-top:8px">Nenhuma transição isolada alcançou significância estatística — coerente com o efeito de piso e com uma variação distribuída ao longo da semana.</p>`;
  return `<div class="tablewrap"><table class="dyn"><tbody>`+items.map(i=>`<tr><td>${i}</td></tr>`).join("")+`</tbody></table></div>`;}

/* ===================== SIDEBAR + ROUTER ===================== */
const nav=$("#nav"),stage=$("#stage"),varchips=$("#varchips"),segchips=$("#segchips");
/* ordem por lógica, agrupada: pontos de entrada primeiro, depois panorama, resultados e aprofundamento.
   NAVGROUPS é a única fonte de verdade — dela derivam a ordem, a numeração e a navegação anterior/próximo. */
const NAVGROUPS=[
  {lab:"Comece por aqui",          ids:["apresentacao","resultados","pipeline"]},
  {lab:"Método & decisões",        ids:["framework","analise","arvore","robustez"]},
  {lab:"1 · Qualidade das medidas",ids:["conf","distrib"]},
  {lab:"2 · Descritiva",           ids:["visao","descr"]},
  {lab:"3 · Variação & perfis",    ids:["d17","dias","perfis","risco"]},
  {lab:"4 · Estrutura multivariada",ids:["pca","multivar"]},
  {lab:"5 · Dinâmica temporal",    ids:["limites","curvas","traj","snr"]},
  {lab:"6 · Resposta aguda",       ids:["agudo","agcron","intraentre","variancia","hiit","negdia","sono"]},
  {lab:"7 · Relações & predição",  ids:["corr","preditivo"]},
  {lab:"8 · Aptidão física",       ids:["fisico"]}
];
const ORDER=NAVGROUPS.flatMap(g=>g.ids);
SECTIONS.sort((a,b)=>{const ia=ORDER.indexOf(a.id),ib=ORDER.indexOf(b.id);return (ia<0?99:ia)-(ib<0?99:ib);});
const secById=id=>SECTIONS.find(x=>x.id===id);
let _ni=0;
NAVGROUPS.forEach((gp,gi)=>{const gl=document.createElement("div");gl.className="nav-group"+(gi===0?" first":"");gl.textContent=gp.lab;nav.appendChild(gl);
  gp.ids.forEach(id=>{const s=secById(id);if(!s)return;_ni++;
    const b=document.createElement("div");b.className="navitem";b.setAttribute("role","button");b.setAttribute("tabindex","0");b.dataset.id=s.id;b.title=s.lab;
    b.innerHTML=`<span class="ico">${ICONS[s.icon]||ICONS.grid}</span><span>${s.lab}</span><span class="navnum">${String(_ni).padStart(2,"0")}</span>`;
    b.onclick=()=>go(s.id);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(s.id);}};nav.appendChild(b);});});
function addStepNav(host,id){const i=ORDER.indexOf(id);if(i<0)return;
  const prev=i>0?secById(ORDER[i-1]):null,next=i<ORDER.length-1?secById(ORDER[i+1]):null;
  const foot=document.createElement("div");foot.className="stepnav";
  const cell=(s,kind)=>s?`<button class="stepbtn ${kind}" type="button" data-go="${s.id}"><span class="sarr">${kind==="prev"?"‹":"›"}</span><span class="stx"><span class="slab">${kind==="prev"?"Anterior":"Próximo"}</span><span class="stt">${s.lab}</span></span></button>`:`<span class="stepbtn ghost"></span>`;
  foot.innerHTML=cell(prev,"prev")+cell(next,"next");host.appendChild(foot);
  foot.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));}
// variable chips (global segmentation)
function buildChips(){varchips.innerHTML="";const all=document.createElement("span");all.className="vchip";all.dataset.k="";all.innerHTML=`<span class="dot" style="background:linear-gradient(90deg,${C.vigor},${C.pth})"></span>Todas`;all.onclick=()=>setVar(null);varchips.appendChild(all);
  DK.forEach(k=>{const v=DERIV.vars[k];const c=document.createElement("span");c.className="vchip";c.dataset.k=k;c.innerHTML=`<span class="dot" style="background:${v.c}"></span>${v.lab}`;c.onclick=()=>setVar(k);varchips.appendChild(c);});syncChips();buildSeg();}
/* recortes analíticos: botões rápidos que abrem a lente correspondente */
const SEG=[["visao","Semana inteira",C.vigor],["curvas","Curvas & derivadas",C.confusao],["hiit","Com / sem HIIT",C.tensao],["agudo","Pré / pós",C.fadiga],["perfis","Perfis de humor",C.pth],["fisico","Aptidão física",C.good],["preditivo","Predição",C.raiva]];
function buildSeg(){segchips.innerHTML="";SEG.forEach(([id,lab,c])=>{const b=document.createElement("span");b.className="vchip";b.dataset.seg=id;b.innerHTML=`<span class="dot" style="background:${c}"></span>${lab}`;b.onclick=()=>go(id);segchips.appendChild(b);});}
function syncSeg(){segchips.querySelectorAll(".vchip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.seg===CUR?"true":"false"));}
function syncChips(){varchips.querySelectorAll(".vchip").forEach(c=>c.setAttribute("aria-pressed",(c.dataset.k||null)===GLOBAL.varKey?"true":"false"));}
function setVar(k){GLOBAL.varKey=k;syncChips();go("visao");}
buildChips();
let CUR="visao";
function go(id){const s=SECTIONS.find(x=>x.id===id)||SECTIONS[0];CUR=s.id;
  nav.querySelectorAll(".navitem").forEach(b=>b.setAttribute("aria-current",b.dataset.id===s.id?"true":"false"));syncSeg();
  $("#crumbico").innerHTML=ICONS[s.icon]||ICONS.grid;$("#crumbtitle").textContent=s.lab;$("#crumbtag").textContent=(s.render.tag||"análise");
  stage.className="panel";stage.innerHTML="";requestAnimationFrame(()=>{s.render(stage);addStepNav(stage,s.id);requestAnimationFrame(()=>stage.classList.add("in"));});
  try{window.scrollTo(0,0);}catch(e){}
  history.replaceState(null,"","#"+id);}
go((location.hash||"").slice(1)||"apresentacao");
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>go(CUR),220);});
</script>
