   +`<div class="card" style="margin-top:20px;border-left:3px solid ${C.raiva}"><h3>Por que este modelo é mais robusto que o SPSS clássico</h3><p class="note">o que muda ao trocar a rotina de ANOVA/teste t por um fluxo escolhido pelas propriedades dos dados</p>`
   +`<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px">`
   +`<div style="flex:1 1 270px;background:var(--glass2);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.crit};margin-bottom:8px">Abordagem clássica · ANOVA / t no SPSS</div><ul class="drules" style="margin:0"><li>Exige <b>normalidade e esfericidade</b> — violadas pelo efeito de piso.</li><li>Trata o <b>tempo como categoria</b> — descarta a <i>forma</i> da mudança.</li><li>Sensível a <b>assimetria e zeros</b> nas dimensões negativas.</li><li>Atletas <b>intercambiáveis</b> — ignora a trajetória individual.</li><li>Responde só <b>“mudou?”</b> — não quando, quão rápido nem com que confiança.</li></ul></div>`
   +`<div style="flex:1 1 270px;background:rgba(90,211,196,.06);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.good};margin-bottom:8px">Este modelo · pipeline triangulado</div><ul class="drules" style="margin:0"><li><b>PERMANOVA</b> — sem normalidade; permutação restrita ao atleta.</li><li><b>Spline + derivadas</b> — velocidade, aceleração e <b>inflexão (~dia 4)</b>.</li><li><b>Modelos mistos</b> — trajetória individual (intercepto/inclinação).</li><li><b>Sinal/ruído + MDC</b> — qualificam <i>onde</i> a leitura é confiável.</li><li><b>AFC/TRI</b> e <b>teto preditivo honesto</b> (logística 0,58 ≥ XGBoost/LightGBM).</li></ul></div>`
   +`</div>`
   +`<div style="margin-top:14px;border-top:1px solid var(--stroke);padding-top:12px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px">Onde está a inovação</div><p class="note" style="font-size:13.5px;line-height:1.62;color:var(--ink);margin:0">Nenhuma técnica é nova isolada — elas vivem dispersas (processamento de sinais, ecologia, psicometria, estatística longitudinal). O ineditismo é <b>integrá-las num único fluxo para o monitoramento diário do humor no esporte coletivo</b> — domínio que se acomodou à ANOVA/t sobre amostras pequenas e piso, justo onde esses testes falham — importando <b>cálculo</b> (derivadas, limites, inflexão) e <b>teoria de sinais</b> (filtragem, S/R) para ler estados psicológicos, com a árvore acima tornando a escolha do método função explícita dos dados.</p></div></div>`);

function mag(dz){const a=Math.abs(dz);return a>=0.8?"grande":a>=0.5?"médio":a>=0.2?"pequeno":"trivial";}
function sg(x,d=2){return (x>=0?"+":"")+num(x,d);}
function pfmt(p){return p<0.001?"< 0,001":("= "+num(p,3));}
function pShort(p){return p<0.001?"p<0,001":"p="+num(p,3);}
function chipv(c,t){return `<span class="vbadge"><span class="bd" style="background:${c}"></span>${t}</span>`;}
function badges(k){const s=DERIV.stats[k];return [
  chipv(s.icc>=.75?C.good:s.icc>=.5?C.warn:C.crit,"confiab. "+(s.icc>=.75?"boa":s.icc>=.5?"moderada":"baixa")),
  chipv(s.snr>=4?C.good:s.snr>=2?C.warn:C.crit,"S/R "+num(s.snr,1)),
  chipv(Math.abs(s.dz)>=.8?C.crit:Math.abs(s.dz)>=.5?C.warn:C.muted,"efeito "+mag(s.dz)),
  chipv(C.pth,Math.abs(s.cr)>Math.abs(s.ag)*2?"mudança crônica":"agudo + crônico")].join("");}
function narr(k){const s=DERIV.stats[k],v=DERIV.vars[k];
  const nat=Math.abs(s.cr)>Math.abs(s.ag)*2?"predominantemente crônica, por acúmulo entre os dias":"resultante tanto do estímulo agudo quanto do acúmulo entre os dias";
  const inf=s.infl?`apresentou inflexão por volta do <b>dia ${num(s.infl,1)}</b>`:"não apresentou inflexão nítida";
  const snrtxt=s.snr>=4?"tendência limpa e confiável":s.snr>=2?"tendência clara, com oscilação relevante":"variação dominada por ruído/piso, a interpretar com cautela";
  return `<b>${v.lab}</b> teve média semanal de <b>${num(s.m,1)} ± ${num(s.sd,1)}</b> (CV ${num(s.cv,0)}%) e piso de <b>${num(s.floor,0)}%</b> de escores nulos. A confiabilidade entre dias foi <b>${num(s.icc,2)}</b> (MDC95 ${num(s.mdc95,1)} pontos). Ao longo da semana a variação foi <b>${s.fp<0.05?"significativa":"não significativa"}</b> (Friedman χ² = ${num(s.chi,1)}, p ${pfmt(s.fp)}; W = ${num(s.W,2)}). Do primeiro ao sétimo dia passou de <b>${num(s.d1,1)}</b> para <b>${num(s.d7,1)}</b> (${sg(s.delta,1)}; dz ${sg(s.dz)}, efeito <b>${mag(s.dz)}</b>). A mudança foi ${nat} (agudo ${sg(s.ag)}, crônico ${sg(s.cr)}). A curva ${inf}, com velocidade de pico de ${sg(s.vpk,1)} ponto por dia (dia ${num(s.vpkx,1)}). A razão sinal/ruído foi <b>${num(s.snr,1)}</b>, o que indica ${snrtxt}.`;}
function kpi(icon,lab,val,cap,color,goto){const d=document.createElement("div");d.className="kpi act";
  d.innerHTML=`<span class="stripe" style="background:${color}"></span><span class="mico" style="color:${color}">${icon}</span><div class="lab">${lab}</div><div class="val" style="font-size:21px">${val}</div><div class="cap">${cap}</div>`;
  if(goto)d.onclick=()=>go(goto);d.title=lab+" — abrir análise";return d;}
function momentos(k){const items=[],s=DERIV.stats[k];
  if(s.sig17)items.push(`<b>D1 → D7</b>: ${sg(s.delta,1)} · dz ${sg(s.dz)} · ${pShort(s.p17)}`);
  if(s.sigpp)items.push(`<b>Pré vs pós da semana</b>: dz ${sg(s.dzpp)} · ${pShort(s.ppp)}`);
  DERIV.trans.forEach(t=>{const o=t.v[k];if(o.sig)items.push(`<b>${t.lab}</b> (${t.tipo.toLowerCase()}): dz ${sg(o.dz)}`);});
  for(let d=2;d<=7;d++){const o=DERIV.prepos_dia[String(d)][k];if(o.sig)items.push(`<b>Dia ${d} · pré→pós</b>: dz ${sg(o.dz)}`);}
  if(!items.length)return `<p class="note" style="margin-top:8px">Nenhuma transição isolada alcançou significância estatística — coerente com o efeito de piso e com uma variação distribuída ao longo da semana.</p>`;
  return `<div class="tablewrap"><table class="dyn"><tbody>`+items.map(i=>`<tr><td>${i}</td></tr>`).join("")+`</tbody></table></div>`;}

/* ===================== SIDEBAR + ROUTER ===================== */
const nav=$("#nav"),stage=$("#stage"),varchips=$("#varchips"),segchips=$("#segchips");
/* ordem por lógica, agrupada: pontos de entrada primeiro, depois panorama, resultados e aprofundamento.
   NAVGROUPS é a única fonte de verdade — dela derivam a ordem, a numeração e a navegação anterior/próximo. */
const NAVGROUPS=[
  {lab:"Comece por aqui",          ids:["apresentacao","resultados","pipeline"]},
  {lab:"Método & decisões",        ids:["framework","analise","arvore","robustez"]},
  {lab:"1 · Qualidade & descritiva",ids:["conf","visao","descr","distrib"]},
  {lab:"2 · Variação & perfis",    ids:["d17","dias","perfis","risco"]},
  {lab:"3 · Estrutura multivariada",ids:["multivar"]},
  {lab:"4 · Dinâmica temporal",    ids:["curvas","traj","limites","snr"]},
  {lab:"5 · Resposta aguda (pré→pós)",ids:["agudo"]},
  {lab:"6 · Tipo de dia (HIIT · jogo · sono)",ids:["hiit","negdia","sono"]},
  {lab:"7 · Relações & predição",  ids:["corr","preditivo","iot","atletas","individual"]},
  {lab:"8 · Síntese · triangulação",ids:["triangulacao"]},
  {lab:"9 · Aptidão física",       ids:["fisico"]}
];
const ORDER=NAVGROUPS.flatMap(g=>g.ids);
SECTIONS.sort((a,b)=>{const ia=ORDER.indexOf(a.id),ib=ORDER.indexOf(b.id);return (ia<0?99:ia)-(ib<0?99:ib);});
const secById=id=>SECTIONS.find(x=>x.id===id);
let _ni=0;
NAVGROUPS.forEach((gp,gi)=>{const gl=document.createElement("div");gl.className="nav-group"+(gi===0?" first":"");gl.textContent=gp.lab;nav.appendChild(gl);
  gp.ids.forEach(id=>{const s=secById(id);if(!s)return;_ni++;
    const b=document.createElement("div");b.className="navitem";b.setAttribute("role","button");b.setAttribute("tabindex","0");b.dataset.id=s.id;b.title=s.lab;
    b.innerHTML=`<span class="ico">${ICONS[s.icon]||ICONS.grid}</span><span>${s.lab}</span><span class="navnum">${String(_ni).padStart(2,"0")}</span>`;
    b.onclick=()=>go(s.id);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(s.id);}};nav.appendChild(b);});});
function addStepNav(host,id){const i=ORDER.indexOf(id);if(i<0)return;
  const prev=i>0?secById(ORDER[i-1]):null,next=i<ORDER.length-1?secById(ORDER[i+1]):null;
  const foot=document.createElement("div");foot.className="stepnav";
  const cell=(s,kind)=>s?`<button class="stepbtn ${kind}" type="button" data-go="${s.id}"><span class="sarr">${kind==="prev"?"‹":"›"}</span><span class="stx"><span class="slab">${kind==="prev"?"Anterior":"Próximo"}</span><span class="stt">${s.lab}</span></span></button>`:`<span class="stepbtn ghost"></span>`;
  foot.innerHTML=cell(prev,"prev")+cell(next,"next");host.appendChild(foot);
  foot.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));}
// variable chips (global segmentation)
function buildChips(){varchips.innerHTML="";const all=document.createElement("span");all.className="vchip";all.dataset.k="";all.innerHTML=`<span class="dot" style="background:linear-gradient(90deg,${C.vigor},${C.pth})"></span>Todas`;all.onclick=()=>setVar(null);varchips.appendChild(all);
  DK.forEach(k=>{const v=DERIV.vars[k];const c=document.createElement("span");c.className="vchip";c.dataset.k=k;c.innerHTML=`<span class="dot" style="background:${v.c}"></span>${v.lab}`;c.onclick=()=>setVar(k);varchips.appendChild(c);});syncChips();buildSeg();}
/* recortes analíticos: botões rápidos que abrem a lente correspondente */
const SEG=[["visao","Semana inteira",C.vigor],["curvas","Curvas & derivadas",C.confusao],["hiit","Com / sem HIIT",C.tensao],["agudo","Pré / pós",C.fadiga],["perfis","Perfis de humor",C.pth],["fisico","Aptidão física",C.good],["preditivo","Predição",C.raiva]];
function buildSeg(){segchips.innerHTML="";SEG.forEach(([id,lab,c])=>{const b=document.createElement("span");b.className="vchip";b.dataset.seg=id;b.innerHTML=`<span class="dot" style="background:${c}"></span>${lab}`;b.onclick=()=>go(id);segchips.appendChild(b);});}
function syncSeg(){segchips.querySelectorAll(".vchip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.seg===CUR?"true":"false"));}
function syncChips(){varchips.querySelectorAll(".vchip").forEach(c=>c.setAttribute("aria-pressed",(c.dataset.k||null)===GLOBAL.varKey?"true":"false"));}
function setVar(k){GLOBAL.varKey=k;syncChips();go("visao");}
buildChips();
let CUR="visao";
function go(id){const s=SECTIONS.find(x=>x.id===id)||SECTIONS[0];CUR=s.id;
  nav.querySelectorAll(".navitem").forEach(b=>b.setAttribute("aria-current",b.dataset.id===s.id?"true":"false"));syncSeg();
  $("#crumbico").innerHTML=ICONS[s.icon]||ICONS.grid;$("#crumbtitle").textContent=s.lab;$("#crumbtag").textContent=(s.render.tag||"análise");
  stage.className="panel";stage.innerHTML="";requestAnimationFrame(()=>{s.render(stage);addStepNav(stage,s.id);animateKPIs(stage);requestAnimationFrame(()=>stage.classList.add("in"));});
  try{window.scrollTo(0,0);}catch(e){}
  history.replaceState(null,"","#"+id);}
go((location.hash||"").slice(1)||"apresentacao");
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>go(CUR),220);});
</script>
