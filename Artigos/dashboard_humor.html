   +`</div></div>`
   +`<div class="card" style="margin-top:16px;border-left:3px solid var(--accent)"><h3>Regras transversais (sempre aplicadas)</h3><ul class="drules"><li><b>Tamanho de efeito ao lado do p</b> — relevância, não só significância.</li><li><b>Unidade amostral = o atleta</b> — a agregação por atleta corrige a pseudorreplicação das medidas repetidas.</li><li><b>Triangulação</b> — cada conclusão é sustentada por métodos independentes (multivariado, dinâmico e de sinal/ruído).</li><li><b>α = 5%</b>, com correção de multiplicidade quando aplicável (Bonferroni).</li></ul></div>`
   +`<div class="card" style="margin-top:20px;border-left:3px solid ${C.raiva}"><h3>Por que este modelo é mais robusto que o SPSS clássico</h3><p class="note">o que muda ao trocar a rotina de ANOVA/teste t por um fluxo escolhido pelas propriedades dos dados</p>`
   +`<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px">`
   +`<div style="flex:1 1 270px;background:var(--glass2);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.crit};margin-bottom:8px">Abordagem clássica · ANOVA / t no SPSS</div><ul class="drules" style="margin:0"><li>Exige <b>normalidade e esfericidade</b> — violadas pelo efeito de piso.</li><li>Trata o <b>tempo como categoria</b> — descarta a <i>forma</i> da mudança.</li><li>Sensível a <b>assimetria e zeros</b> nas dimensões negativas.</li><li>Atletas <b>intercambiáveis</b> — ignora a trajetória individual.</li><li>Responde só <b>“mudou?”</b> — não quando, quão rápido nem com que confiança.</li></ul></div>`
   +`<div style="flex:1 1 270px;background:rgba(90,211,196,.06);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:${C.good};margin-bottom:8px">Este modelo · pipeline triangulado</div><ul class="drules" style="margin:0"><li><b>PERMANOVA</b> — sem normalidade; permutação restrita ao atleta.</li><li><b>Spline + derivadas</b> — velocidade, aceleração e <b>inflexão (~dia 4)</b>.</li><li><b>Modelos mistos</b> — trajetória individual (intercepto/inclinação).</li><li><b>Sinal/ruído + MDC</b> — qualificam <i>onde</i> a leitura é confiável.</li><li><b>AFC/TRI</b> e <b>teto preditivo honesto</b> (logística 0,58 ≥ XGBoost/LightGBM).</li></ul></div>`
   +`</div>`
   +`<div style="margin-top:14px;border-top:1px solid var(--stroke);padding-top:12px"><div class="fk" style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px">Onde está a inovação</div><p class="note" style="font-size:13.5px;line-height:1.62;color:var(--ink);margin:0">Nenhuma técnica é nova isolada — elas vivem dispersas (processamento de sinais, ecologia, psicometria, estatística longitudinal). O ineditismo é <b>integrá-las num único fluxo para o monitoramento diário do humor no esporte coletivo</b> — domínio que se acomodou à ANOVA/t sobre amostras pequenas e piso, justo onde esses testes falham — importando <b>cálculo</b> (derivadas, limites, inflexão) e <b>teoria de sinais</b> (filtragem, S/R) para ler estados psicológicos, com a árvore acima tornando a escolha do método função explícita dos dados.</p></div></div>`);
  h.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}},

{id:"multipl",lab:"Multiplicidade (FDR/Bonferroni)",icon:"shield",render(h){
  head(h,"método · comparações múltiplas","Mapa de multiplicidade","Muitos testes foram conduzidos ao longo do estudo. Aqui a <b>família confirmatória primária</b> — a variação semanal do humor — reúne-se num quadro único e recebe, de forma explícita, duas correções: o <b>FDR</b> de Benjamini-Hochberg (controla a proporção de falsos positivos) e o <b>Bonferroni</b> (controla qualquer falso positivo). Fica transparente quais achados sobrevivem à multiplicidade.");
  const pf=v=>v==null?"—":(v<0.001?"< 0,001":num(v,3));
  kpiFut(h,[
    ["Testes na família",String(MULT.n_total),"Wilcoxon D1×D7 (7) + Friedman (7)",C.pth,null,MIC.cal],
    ["Sig. sem correção",String(MULT.n_bruto),"p < 0,05 bruto",C.warn,null,MIC.signal],
    ["Sobrevivem ao FDR",String(MULT.n_fdr),MULT.sobrevivem_fdr.join(", "),C.good,null,MIC.target],
    ["Sobrevivem ao Bonferroni",String(MULT.n_bonf),"critério mais conservador",C.vigor,null,MIC.focus]]);
  const g1=cards(h,`<div class="card"><h3>Funil de sobrevivência</h3><p class="note">quantos achados restam a cada nível de rigor</p><div class="host" id="ml_fun"></div></div><div class="card"><h3>O que sobrevive</h3><p class="note">dimensões cujo efeito semanal resiste à correção</p><div id="ml_s"></div></div>`);
  funnelChart($("#ml_fun",g1),[
    {lab:MULT.n_total+" testes",sub:"família confirmatória primária",c:C.pth},
    {lab:MULT.n_bruto+" sem correção",sub:"p < 0,05 bruto",c:C.warn},
    {lab:MULT.n_fdr+" com FDR",sub:"Benjamini-Hochberg",c:C.good},
    {lab:MULT.n_bonf+" com Bonferroni",sub:"critério conservador",c:C.vigor}],{h:300});
  $("#ml_s",g1).innerHTML=`<div style="display:flex;flex-direction:column;gap:8px">`+MULT.tests.filter(t=>t.sig_fdr).map(t=>`<div style="border:1px solid var(--stroke);border-left:3px solid ${C.good};border-radius:9px;padding:8px 11px;background:var(--glass)"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12.5px">${t.dim_lab} <span style="color:var(--muted);font-weight:500">· ${t.teste}</span></b>${t.sig_bonf?`<span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:${C.vigor};border:1px solid ${rgba(C.vigor,.5)};border-radius:999px;padding:1px 7px">Bonferroni</span>`:`<span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:${C.good};border:1px solid ${rgba(C.good,.5)};border-radius:999px;padding:1px 7px">FDR</span>`}</div><div class="note" style="font-size:11px;margin-top:2px">p ${pf(t.p)} → FDR ${pf(t.p_fdr)}</div></div>`).join("")+`</div><p class="note" style="font-size:11.5px;line-height:1.55;margin-top:9px;color:var(--muted)">Os sobreviventes concentram-se no <b>eixo energético</b> (vigor, fadiga) e nas dimensões de padrão semanal forte; os afetivos pequenos não sobrevivem, o que reforça a leitura por <b>tendência convergente</b>.</p>`;
  const g2=document.createElement("div");g2.className="card";g2.style.marginTop="16px";g2.innerHTML=`<h3>Todos os testes da família</h3><p class="note">p bruto, p corrigido por FDR e por Bonferroni · dentro de cada família</p><div id="ml_tab"></div>`;h.appendChild(g2);
  const rows=MULT.tests.map(t=>[t.teste,t.dim_lab,pf(t.p),pf(t.p_fdr),pf(t.p_bonf),t.sig_fdr?(t.sig_bonf?"✓ Bonferroni":"✓ FDR"):"—"]);
  dynTable($("#ml_tab",g2),["Teste","Dimensão","p bruto","p FDR","p Bonf","Sobrevive"],rows,(i,v)=>i===5&&String(v).indexOf("✓")>=0?`<span style="color:${C.good}">${v}</span>`:v);
  h.insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:14px;border-left:3px solid var(--accent)"><p class="note" style="font-size:13px;line-height:1.62;color:var(--ink)"><b>Leitura.</b> Dos ${MULT.n_total} testes da família primária, ${MULT.n_bruto} são significativos sem correção, mas apenas ${MULT.n_fdr} sobrevivem ao FDR e ${MULT.n_bonf} ao Bonferroni. A honestidade da multiplicidade confirma o núcleo do estudo: o <b>eixo energético</b> é robusto, ao passo que os efeitos afetivos, pequenos e numerosos, devem ser lidos como <b>tendência convergente</b>, e não como achados isolados.</p></div>`);
}},
{id:"rsm",lab:"Superfície de resposta",icon:"pca",render(h){
  head(h,"delineamento de superfície de respostas · 2ª ordem","Superfície de resposta — carga aguda × carga cumulativa","Um modelo de <b>2ª ordem</b> (RSM) mapeia como a resposta varia no espaço de <b>carga aguda</b> (sRPE do dia) × <b>carga cumulativa</b> (horas) e localiza o <b>ponto estacionário</b> por análise canônica (autovalores da curvatura). Escolha a resposta — a superfície e a leitura são replotadas.");
  h.insertAdjacentHTML("beforeend",`<div class="card" style="border-left:3px solid var(--warn)"><p class="note" style="font-size:12.5px;line-height:1.6;color:var(--muted)"><b>Natureza do delineamento (ressalva):</b> os fatores são <b>observados</b> (o plano de carga da equipe), não manipulados como num delineamento experimental (central composite/Box-Behnken); variam só no <b>nível-dia</b> — apenas <b>${RSM.n_pontos_delineamento} pontos de delineamento</b>, correlacionados entre si (ρ=${num(RSM.rho_fatores,2)}, não ortogonal). Logo a curvatura é <b>exploratória</b>, não confirmatória, e isto <b>não é otimização causal</b> — mapeia a resposta à carga, não prescreve a carga ótima. É a extensão de 2ª ordem do modelo dose-resposta.</p></div>`);
  const RC={vigor:C.vigor,fadiga:C.fadiga,pth:C.pth,epworth:C.tensao};

  const bar=document.createElement("div");bar.className="var-chips";bar.style.margin="2px 0 12px";h.appendChild(bar);
  let cur=RSM.rsm[0].resp;

  const g1=cards(h,`<div class="card"><h3 id="rs_t">Superfície ajustada</h3><p class="note">cor = resposta prevista · ● dias observados (1–7) · ✛ ponto estacionário (quando dentro da região)</p><div class="host" id="rs_h"></div></div><div class="card"><h3 id="rs_rt">Análise canônica</h3><p class="note">coeficientes, curvatura e ponto estacionário</p><div id="rs_r"></div></div>`);

    const natC=r.natureza==="máximo"?C.good:r.natureza==="mínimo"?C.crit:C.warn;
    const row=(lab,val,p,sig)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--stroke)"><span class="note" style="font-size:12px">${lab}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:${sig?C.good:'var(--ink)'}">${val} ${p!=null?`· p ${pf(p)}${sig?' ★':''}`:''}</span></div>`;
    $("#rs_r",g1).innerHTML=`<div style="margin-bottom:8px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="p8kc" style="flex:1;min-width:96px"><div class="p8kl">R² (marginal)</div><div class="p8kv" style="font-size:17px;color:${col}">${r.r2!=null?num(r.r2,2):"—"}</div></span>
        <span class="p8kc" style="flex:1;min-width:96px"><div class="p8kl">Curvatura</div><div class="p8kv" style="font-size:15px;color:${r.sig_curv?C.good:'var(--muted)'}">p ${pf(r.p_curv)}${r.sig_curv?' ★':''}</div></span>
        <span class="p8kc" style="flex:1;min-width:110px"><div class="p8kl">Ponto estacionário</div><div class="p8kv" style="font-size:14px;color:${natC}">${r.natureza}</div></span>
      </div></div>
      ${row("Carga aguda (linear)",sg(r.b1,2),r.p1,r.p1<0.05)}
      ${row("Carga cumulativa (linear)",sg(r.b2,2),r.p2,r.p2<0.05)}
      ${row("Aguda² (curvatura)",sg(r.b11,2),r.p11,r.p11<0.05)}
      ${row("Cumulativa² (curvatura)",sg(r.b22,2),r.p22,r.p22<0.05)}
      ${row("Interação aguda×cumulativa",sg(r.b12,2),r.p12,r.p12<0.05)}
      <div class="note" style="font-size:11.5px;line-height:1.6;margin-top:9px;color:var(--muted)">Autovalores da curvatura: <b style="color:var(--ink)">${r.eig1!=null?num(r.eig1,2):"—"}</b> e <b style="color:var(--ink)">${r.eig2!=null?num(r.eig2,2):"—"}</b> → <b style="color:${natC}">${r.natureza}</b>. Localização (unidades brutas): sRPE ≈ <b>${r.est_srpe!=null?r.est_srpe:"—"}</b> · carga acumulada ≈ <b>${r.est_acum_h!=null?num(r.est_acum_h,1):"—"} h</b> — <b style="color:${r.dentro_regiao?C.good:C.warn}">${r.dentro_regiao?"dentro":"fora"} da região observada</b>${r.dentro_regiao?"":" (extrapolação — não interpretável como ótimo)"}. Modelo: ${r.metodo==="misto"?"misto (intercepto por atleta)":"OLS cluster-robusto"}, n=${r.n}.</div>`;
  }

  const g2=document.createElement("div");g2.className="card";g2.style.marginTop="16px";
  g2.innerHTML=`<h3>Comparativo das respostas</h3><p class="note">R², significância da curvatura e natureza do ponto estacionário · clique numa linha para focar</p><div id="rs_tab"></div>`;h.appendChild(g2);
  const rows=RSM.rsm.map(r=>[r.resp_lab,r.r2!=null?num(r.r2,2):"—",(r.p_curv!=null?(r.p_curv<0.001?"<0,001":num(r.p_curv,3)):"—")+(r.sig_curv?" ★":""),r.natureza,r.dentro_regiao?"dentro":"fora"]);
  dynTable($("#rs_tab",g2),["Resposta","R²","Curvatura (p)","Estacionário","Região"],rows,(i,v)=>v);
  h.insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:14px;border-left:3px solid var(--accent)"><p class="note" style="font-size:13px;line-height:1.64;color:var(--ink)"><b>Leitura.</b> A superfície <b>detecta curvatura</b> em vigor, fadiga e sonolência (a resposta à carga não é puramente linear), mas o <b>R² é baixo</b> (a maior parte da variância é entre-atletas, não explicada pela carga de nível-dia) e os pontos estacionários costumam ser <b>selas</b> ou cair <b>fora da faixa observada</b>. Ou seja: dentro deste microciclo <b>não há um "pico" de carga ótima nítido</b> no espaço aguda×cumulativa — coerente com o achado de que a leitura é de <b>tendência de grupo</b>, e a dose-resposta individual exigiria carga por atleta (agenda de pesquisa).</p></div>`);
}},

{id:"rede",lab:"Rede & dinâmica temporal",icon:"nodes",render(h){
  head(h,"estrutura & precedência temporal","Rede psicométrica e dinâmica defasada","Duas leituras que complementam a PCA e o AR(1). A <b>rede gaussiana (GGM)</b> mostra as <b>correlações parciais</b> — a associação entre duas medidas controlando todas as demais —, revelando quais dimensões se ligam diretamente. O <b>painel cruzado defasado (CLPM)</b> testa <b>precedência temporal</b>: se uma dimensão num dia ajuda a prever a de outra no dia seguinte, além da própria inércia.");
  kpiFut(h,[
    ["Nós",String(NET.nodes.length),"6 dimensões + sono + estresse",C.vigor,null,ICONS.nodes],

    ["Precedência temporal",(NET.clpm.filter(c=>c.sig).length||"nenhuma")+"","defasagens cruzadas significativas",C.warn,null,MIC.deriv]]);
  const g1=cards(h,`<div class="card"><h3>Rede de correlações parciais (GGM)</h3><p class="note">nó = dimensão (tamanho ∝ força na rede) · aresta verde = positiva · vermelha = negativa · espessura ∝ |parcial|</p><div class="host" id="net_h"></div></div><div class="card"><h3>Ligações diretas mais fortes</h3><p class="note">associação controlando todas as demais</p><div id="net_t"></div></div>`);
  networkGraph($("#net_h",g1),NET.nodes,NET.edges);
  $("#net_t",g1).innerHTML=`<div style="display:flex;flex-direction:column;gap:7px">`+NET.top_edges.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--stroke);border-left:3px solid ${e.w>0?C.good:C.crit};border-radius:9px;padding:7px 11px;background:var(--glass)"><b style="font-size:12.5px">${e.a_lab} · ${e.b_lab}</b><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:${e.w>0?C.good:C.crit}">${sg(e.w)}</span></div>`).join("")+`</div><p class="note" style="font-size:11.5px;line-height:1.55;margin-top:9px;color:var(--muted)">As negativas ligam-se entre si (depressão–confusão, fadiga–raiva) e o vigor liga-se <b>negativamente</b> à fadiga e à sonolência — a mesma dicotomia energia ↔ perturbação, agora como rede de dependências diretas.</p>`;
  const cc=document.createElement("div");cc.className="card";cc.style.marginTop="16px";
  const LV=NET.lag_vars;
  let mh=`<h3>Precedência temporal · painel cruzado defasado (CLPM)</h3><p class="note">célula = efeito de X no dia sobre Y no dia seguinte (β padronizado), controlando Y do dia · ★ p&lt;0,05 · laranja = positivo, verde = negativo</p><div class="tablewrap"><table class="dyn"><thead><tr><th style="text-align:left">X (dia) &nbsp;·&nbsp; Y (dia+1) →</th>`+LV.map(v=>`<th style="text-align:center">${v.lab}</th>`).join("")+`</tr></thead><tbody>`;
  LV.forEach(xr=>{mh+=`<tr><td><b>${xr.lab}</b></td>`;LV.forEach(yc=>{
    if(xr.id===yc.id){mh+=`<td style="text-align:center;color:var(--faint);background:rgba(120,150,190,.06)">·</td>`;return;}
    const cell=NET.clpm.find(c=>c.x===xr.id&&c.y===yc.id);
    if(!cell){mh+=`<td style="text-align:center;color:var(--faint)">–</td>`;return;}
    const col=cell.sig?(cell.beta>0?C.fadiga:C.good):"var(--muted)";
    mh+=`<td style="text-align:center;color:${col};font-family:'IBM Plex Mono',monospace;font-weight:${cell.sig?700:400}">${sg(cell.beta)}${cell.sig?" ★":""}</td>`;});mh+=`</tr>`;});
  mh+=`</tbody></table></div>`;
  const nsig=NET.clpm.filter(c=>c.sig).length;
  mh+=`<p class="note" style="font-size:12.5px;line-height:1.6;margin-top:10px;color:var(--muted)">${nsig?`<b>${nsig}</b> defasagem(ns) cruzada(s) atingiram significância.`:`<b>Resultado nulo honesto:</b> nenhuma defasagem cruzada atingiu significância.`} No nível do dia, a dinâmica é dominada pela <b>inércia de cada dimensão</b> (autorregressão) e pela associação <b>no mesmo dia</b> (a rede acima), e não por precedência temporal clara entre dimensões — coerente com o T curto e o n pequeno.</p>`;
  cc.innerHTML=mh;h.appendChild(cc);

}},

/* ---- RADAR / teia: morfologia multidimensional (z-escore), muito visual e comparativo ---- */
function radarChart(host,axes,series,{h=380,zmin=-2,zmax=2,rings=[-1,0,1],hlIdx=-1}={}){
  const {cv,g}=mk(host,h),w=cv._w,N=axes.length,cx=w*0.40,cy=h/2+4,R=Math.min(cx-8,cy-52);
  const ang=i=>-Math.PI/2+i/N*2*Math.PI, rad=v=>R*Math.max(0,Math.min(1,(v-zmin)/(zmax-zmin)));
  const ringPath=(rv)=>{g.beginPath();for(let i=0;i<=N;i++){const a=ang(i%N),rr2=rad(rv),x=cx+Math.cos(a)*rr2,y=cy+Math.sin(a)*rr2;i?g.lineTo(x,y):g.moveTo(x,y);}};
  anim(1500,prog=>{g.clearRect(0,0,w,h);cv._hits=[];
    g.lineWidth=1;g.strokeStyle="rgba(120,150,190,.14)";[zmin,...rings,zmax].forEach(rv=>{ringPath(rv);g.stroke();});
    g.setLineDash([4,4]);g.strokeStyle="rgba(120,150,190,.42)";ringPath(0);g.stroke();g.setLineDash([]);
    axes.forEach((ax,i)=>{const a=ang(i),on=i===hlIdx;
      g.strokeStyle=on?rgba(ax.color||C.accent,.55):"rgba(120,150,190,.13)";g.lineWidth=on?2:1;
      g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.stroke();
      const lx=cx+Math.cos(a)*(R+22),ly=cy+Math.sin(a)*(R+22);
      if(on){g.save();g.shadowColor=rgba(ax.color||C.accent,.8);g.shadowBlur=12;}
      g.fillStyle=ax.color||C.muted;g.font=(on?'800 ':'700 ')+'11px "IBM Plex Mono",monospace';
      g.textAlign=Math.abs(Math.cos(a))<0.3?"center":(Math.cos(a)>0?"left":"right");g.textBaseline="middle";g.fillText(ax.lab,lx,ly);if(on)g.restore();});
    series.forEach(s=>{const pts=s.vals.map((v,i)=>{const a=ang(i),rr2=rad(v)*prog;return [cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2];});
      g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
      g.fillStyle=rgba(s.c,.13);g.fill();g.shadowColor=rgba(s.c,.6);g.shadowBlur=13;g.strokeStyle=s.c;g.lineWidth=2.4;g.stroke();g.restore();
      if(prog>=1)pts.forEach((p,i)=>{g.save();g.shadowColor=rgba(s.c,.75);g.shadowBlur=8;g.fillStyle=lighten(s.c,.3);g.beginPath();g.arc(p[0],p[1],3.6,0,7);g.fill();g.restore();
        cv._hits.push({x:p[0]-8,y:p[1]-8,w:16,h:16,tip:`<b>${axes[i].lab}</b> · ${s.lab}<br>z = ${sg(s.vals[i],2)}`});});});
    if(prog>=1){const lx=Math.min(cx+R+34,w-150);let ly=cy-series.length*13;g.textAlign="left";g.textBaseline="middle";
      series.forEach(s=>{g.save();g.shadowColor=rgba(s.c,.5);g.shadowBlur=8;g.fillStyle=s.c;rr(g,lx,ly-4,15,8,3);g.fill();g.restore();
        g.fillStyle=C.ink;g.font='600 12.5px "Manrope",sans-serif';g.fillText(s.lab,lx+21,ly);ly+=25;});
      g.fillStyle=C.faint;g.font='9.5px "IBM Plex Mono",monospace';g.fillText("anel tracejado = média da amostra (z=0)",lx,ly+2);}
  });attachHits(cv);
}

/* ---- GRÁFICO DE INTERAÇÃO fatorial: tipo de dia (x) × momento (linhas pré/pós) ---- */
function interactionChart(host,cells,{h=350,dimLab=""}={}){

  const get=(dl,mo)=>cells.find(c=>c.day_lab===dl&&c.momento===mo);
  const lo=Math.min(...cells.map(c=>c.media-c.epm)),hi=Math.max(...cells.map(c=>c.media+c.epm));
  const ymin=Math.max(0,lo-0.4),ymax=hi+0.4,x0=pad.l,x1=w-pad.r,y0=h-pad.b,y1=pad.t;
  const Y=v=>y0+(y1-y0)*((v-ymin)/(ymax-ymin)),X=i=>x0+(x1-x0)*(days.length>1?i/(days.length-1):.5);
  anim(1500,prog=>{g.clearRect(0,0,w,h);cv._hits=[];
    g.font='9px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="middle";g.fillStyle=C.faint;for(let i=0;i<=4;i++){const val=ymin+(ymax-ymin)*i/4,y=y0+(y1-y0)*i/4;g.fillText(val.toFixed(1).replace(".",","),x0-6,y);}
    days.forEach((d,i)=>{g.fillStyle=C.muted;g.font='700 11px "IBM Plex Mono",monospace';g.textAlign="center";g.textBaseline="top";g.fillText(d,X(i),y0+8);});
    moms.forEach(([mo,lab,col])=>{const pts=days.map((d,i)=>{const c=get(d,mo);return c?[X(i),Y(c.media),c]:null;}).filter(Boolean);
      const n=Math.max(2,Math.ceil(pts.length*Math.min(1,prog*1.25)));
      g.save();g.strokeStyle=col;g.lineWidth=3.6;g.lineJoin="round";g.lineCap="round";g.shadowColor=rgba(col,.5);g.shadowBlur=10;g.beginPath();for(let i=0;i<n;i++){i?g.lineTo(pts[i][0],pts[i][1]):g.moveTo(pts[i][0],pts[i][1]);}g.stroke();g.restore();
      pts.forEach((p,i)=>{if(i>=n)return;const c=p[2];
        if(prog>=1){g.strokeStyle=rgba(col,.55);g.lineWidth=1.5;g.beginPath();g.moveTo(p[0],Y(c.media-c.epm));g.lineTo(p[0],Y(c.media+c.epm));g.stroke();
          g.beginPath();g.moveTo(p[0]-3,Y(c.media-c.epm));g.lineTo(p[0]+3,Y(c.media-c.epm));g.moveTo(p[0]-3,Y(c.media+c.epm));g.lineTo(p[0]+3,Y(c.media+c.epm));g.stroke();}
        g.save();g.shadowColor=rgba(col,.85);g.shadowBlur=9;g.fillStyle=lighten(col,.16);g.beginPath();g.arc(p[0],p[1],5.2,0,7);g.fill();g.restore();
        if(prog>=1)cv._hits.push({x:p[0]-9,y:p[1]-9,w:18,h:18,tip:`<b>${dimLab}</b> · ${c.day_lab} ${lab}<br>${num(c.media,2)} ± ${num(c.epm,2)} (n=${c.n})`});});});
  });attachHits(cv);
  const lg=document.createElement("div");lg.className="legend";lg.innerHTML=moms.map(([mo,lab,col])=>`<span class="it"><span class="dot" style="width:12px;height:12px;border-radius:50%;background:${col}"></span>${lab}-treino</span>`).join("")+`<span class="it" style="color:var(--faint)">linhas não paralelas = interação</span>`;host.appendChild(lg);
}
/* ---- FOREST de IRR (GLM): ponto + IC, linha de referência em IRR=1, escala log ---- */
function irrForest(host,rows){
  const H=Math.max(200,rows.length*36+58),{cv,g}=mk(host,H),w=cv._w,pad={l:154,r:52,t:14,b:34};
  const lo=Math.min(1,...rows.map(r=>r.lo)),hi=Math.max(1,...rows.map(r=>r.hi));
  const lmin=Math.log(Math.max(0.2,lo*0.9)),lmax=Math.log(hi*1.1);
  const X=v=>pad.l+(w-pad.l-pad.r)*((Math.log(v)-lmin)/(lmax-lmin)),y0=pad.t,rh=(H-pad.t-pad.b)/rows.length;
  anim(1200,prog=>{g.clearRect(0,0,w,H);cv._hits=[];
    g.strokeStyle="rgba(233,238,246,.3)";g.setLineDash([4,4]);g.lineWidth=1;g.beginPath();g.moveTo(X(1),pad.t);g.lineTo(X(1),H-pad.b);g.stroke();g.setLineDash([]);
    g.fillStyle=C.faint;g.font='9px "IBM Plex Mono",monospace';g.textAlign="center";g.textBaseline="top";
    [0.5,1,1.5,2,3].forEach(t=>{if(Math.log(t)>=lmin&&Math.log(t)<=lmax)g.fillText(String(t).replace(".",","),X(t),H-pad.b+6);});
    rows.forEach((r,i)=>{const cy=y0+rh*i+rh/2,pr=stag(prog,i,rows.length,.5),col=r.sig?(r.irr>=1?C.fadiga:C.vigor):C.faint;
      g.fillStyle=r.sig?C.ink:C.muted;g.font=(r.sig?'700 ':'')+'11px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="middle";g.fillText(r.lab,pad.l-10,cy);
      const xL=X(r.lo),xH=X(r.hi),xP=X(r.irr);
      g.strokeStyle=rgba(col,.7);g.lineWidth=2;g.beginPath();g.moveTo(xL,cy);g.lineTo(xL+(xH-xL)*pr,cy);g.stroke();
      if(pr>=1)[xL,xH].forEach(x=>{g.beginPath();g.moveTo(x,cy-4);g.lineTo(x,cy+4);g.stroke();});
      g.save();g.shadowColor=rgba(col,.75);g.shadowBlur=8;g.fillStyle=lighten(col,.15);g.beginPath();g.arc(xP,cy,5*pr,0,7);g.fill();g.restore();
      if(pr>=1){g.fillStyle=r.sig?C.ink:C.muted;g.font='700 10.5px "Space Grotesk",sans-serif';g.textAlign="left";g.textBaseline="middle";g.fillText(num(r.irr,2),Math.min(xH,w-pad.r)+7,cy);
        if(r.sig)sigStar(g,xP,cy-11,11);
        cv._hits.push({x:xL-4,y:cy-9,w:xH-xL+8,h:18,tip:`<b>${r.lab}</b><br>IRR ${num(r.irr,2)} · IC[${num(r.lo,2)}, ${num(r.hi,2)}]${r.sig?' · <b style="color:#ffd34d">sig</b>':''}`});}});
  });attachHits(cv);
}
/* ---- REGRESSÃO: dispersão + reta linear + curva logarítmica ---- */
function scatterFit(host,rec,{h=350,xlab="Pico de velocidade do T-CAR (km/h)",thr=null}={}){
  const pts=rec.pts,{cv,g}=mk(host,h),w=cv._w,pad={l:48,r:18,t:16,b:44};

  const xr=(xmax-xmin)||1,yr=(ymax-ymin)||1,x0=pad.l,x1=w-pad.r,y0=h-pad.b,y1=pad.t;
  const X=v=>x0+(x1-x0)*((v-(xmin-xr*0.06))/(xr*1.12)),Y=v=>y0+(y1-y0)*((v-(ymin-yr*0.09))/(yr*1.18));

    g.fillStyle=C.faint;g.font='9px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="middle";
    for(let i=0;i<=4;i++){const v=(ymin-yr*0.09)+(yr*1.18)*i/4;g.fillText(num(v,1),x0-6,Y(v));}
    g.textAlign="center";g.textBaseline="top";
    for(let i=0;i<=4;i++){const v=(xmin-xr*0.06)+(xr*1.12)*i/4;g.fillText(num(v,1),X(v),y0+6);}
    g.fillStyle=C.muted;g.font='10px "IBM Plex Mono",monospace';g.fillText(xlab,(x0+x1)/2,y0+24);
    const N=42,seg=Math.max(2,Math.floor(N*Math.min(1,prog*1.2)));
    g.save();g.strokeStyle=C.fadiga;g.lineWidth=3;g.shadowColor=rgba(C.fadiga,.4);g.shadowBlur=7;g.beginPath();
    for(let i=0;i<seg;i++){const xv=xmin+xr*i/(N-1),yv=rec.a_lin+rec.b_lin*xv;i?g.lineTo(X(xv),Y(yv)):g.moveTo(X(xv),Y(yv));}g.stroke();g.restore();

    pts.forEach((p,i)=>{const pr=stag(prog,i,pts.length,0.4);if(pr<=0)return;g.save();g.shadowColor=rgba(col,.55);g.shadowBlur=7;g.fillStyle=rgba(col,.8);g.beginPath();g.arc(X(p[0]),Y(p[1]),4.2*pr,0,7);g.fill();g.restore();
      if(prog>=1)cv._hits.push({x:X(p[0])-6,y:Y(p[1])-6,w:12,h:12,tip:`PV ${num(p[0],1)} km/h · ${rec.dim_lab} ${num(p[1],1)}`});});
  });attachHits(cv);
  const lg=document.createElement("div");lg.className="legend";lg.innerHTML=`<span class="it"><span class="dot" style="background:${col}"></span>atletas (n=${pts.length})</span><span class="it"><span class="dot" style="background:${C.fadiga}"></span>linear · R²=${num(rec.r2_lin,2)}</span><span class="it"><span class="dot" style="background:${C.pth}"></span>logarítmico · R²=${num(rec.r2_log,2)}</span><span class="it" style="color:var(--faint)">ρ=${num(rec.spearman,2)}</span>`;host.appendChild(lg);

/* ---- REGRESSÃO livre X×Y: dispersão + reta de mínimos quadrados (calcula o ajuste) ---- */
function scatterXY(host,pts,{h=350,xlab="",ylab="",xc}={}){
  const col=xc||C.tensao,n=pts.length,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mxb=xs.reduce((a,b)=>a+b,0)/n,myb=ys.reduce((a,b)=>a+b,0)/n;
  let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){const dx=xs[i]-mxb,dy=ys[i]-myb;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
  const b=sxx?sxy/sxx:0,a=myb-b*mxb,r=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
  const {cv,g}=mk(host,h),w=cv._w,pad={l:46,r:18,t:16,b:44};
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const xr=(xmax-xmin)||1,yr=(ymax-ymin)||1,x0=pad.l,x1=w-pad.r,y0=h-pad.b,y1=pad.t;
  const X=v=>x0+(x1-x0)*((v-(xmin-xr*0.07))/(xr*1.14)),Y=v=>y0+(y1-y0)*((v-(ymin-yr*0.09))/(yr*1.18));
  anim(1300,prog=>{g.clearRect(0,0,w,h);cv._hits=[];
    g.fillStyle=C.faint;g.font='9px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="middle";
    for(let i=0;i<=4;i++){const v=(ymin-yr*0.09)+(yr*1.18)*i/4;g.fillText(num(v,1),x0-6,Y(v));}
    g.textAlign="center";g.textBaseline="top";
    for(let i=0;i<=4;i++){const v=(xmin-xr*0.07)+(xr*1.14)*i/4;g.fillText(num(v,1),X(v),y0+6);}
    g.fillStyle=C.muted;g.font='10px "IBM Plex Mono",monospace';g.fillText(xlab,(x0+x1)/2,y0+24);
    const N=42,seg=Math.max(2,Math.floor(N*Math.min(1,prog*1.2)));
    g.save();g.strokeStyle=C.good;g.lineWidth=3;g.shadowColor=rgba(C.good,.4);g.shadowBlur=7;g.beginPath();
    for(let i=0;i<seg;i++){const xv=xmin-xr*0.03+(xr*1.06)*i/(N-1),yv=a+b*xv;i?g.lineTo(X(xv),Y(yv)):g.moveTo(X(xv),Y(yv));}g.stroke();g.restore();
    pts.forEach((p,i)=>{const pr=stag(prog,i,n,0.4);if(pr<=0)return;g.save();g.shadowColor=rgba(col,.55);g.shadowBlur=7;g.fillStyle=rgba(col,.8);g.beginPath();g.arc(X(p[0]),Y(p[1]),4.2*pr,0,7);g.fill();g.restore();
      if(prog>=1)cv._hits.push({x:X(p[0])-6,y:Y(p[1])-6,w:12,h:12,tip:`${xlab} ${num(p[0],1)} · ${ylab} ${num(p[1],1)}`});});
  });attachHits(cv);
  const dir=b>=0?"positiva":"negativa";
  const lg=document.createElement("div");lg.className="legend";lg.innerHTML=`<span class="it"><span class="dot" style="background:${col}"></span>atletas (n=${n})</span><span class="it"><span class="dot" style="background:${C.good}"></span>reta (inclinação ${sg(b,2)})</span><span class="it" style="color:var(--ink)">r = ${sg(r,2)} · R² = ${num(r*r,2)} · relação ${dir}</span>`;host.appendChild(lg);
}
/* ---- MAPA MENTAL: raiz → eixos → dimensões, com conectores curvos coloridos (estilo mapa mental) ---- */
function mindMap(host,spec){
  const rootW=228,brW=214,lfW=200,H0=60,gapY=15,PADL=12,COLGAP=74,yTop=14;
  const branches=spec.branches;let idx=0;
  branches.forEach(br=>{br._lcy=br.leaves.map(()=>{const c=yTop+H0/2+idx*(H0+gapY);idx++;return c;});br._cy=(br._lcy[0]+br._lcy[br._lcy.length-1])/2;});
  const totalH=idx*(H0+gapY)-gapY,x0=PADL,x1=x0+rootW+COLGAP,x2=x1+brW+COLGAP,W=x2+lfW+PADL,Hc=yTop+totalH+yTop,rootCy=yTop+totalH/2;
  const canvas=document.createElement("div");canvas.className="flowcanvas";const inner=document.createElement("div");inner.className="flowinner";inner.style.width=W+"px";inner.style.height=Hc+"px";canvas.appendChild(inner);host.appendChild(canvas);
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");svg.setAttribute("class","wires");svg.setAttribute("width",W);svg.setAttribute("height",Hc);inner.appendChild(svg);
  let wi=0;
  const wire=(xa,ya,xb,yb,col)=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",`M${xa} ${ya} C ${xa+52} ${ya}, ${xb-52} ${yb}, ${xb} ${yb}`);p.setAttribute("class","wire flow");p.style.stroke=col;p.style.filter=`drop-shadow(0 0 4px ${rgba(col,.55)})`;p.style.animationDelay=(wi++*0.12)+"s";svg.appendChild(p);
    [[xa,ya],[xb,yb]].forEach(([px,py])=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",px);c.setAttribute("cy",py);c.setAttribute("r",3.6);c.setAttribute("fill",col);c.style.filter=`drop-shadow(0 0 5px ${col})`;svg.appendChild(c);});};
  const node=(x,cy,w,d)=>{const el=document.createElement("div");el.className="fnode";el.style.left=x+"px";el.style.top=(cy-H0/2)+"px";el.style.width=w+"px";el.style.minHeight=H0+"px";
    el.innerHTML=`${icHD(d.ic,d.c,{size:36,spin:!!d.spin})}<div class="fnt"><div class="fntitle">${d.t}</div><div class="fnsub">${d.s||""}</div></div>${d.go?'<span class="fngo">›</span>':''}`;
    if(d.go){el.setAttribute("role","button");el.tabIndex=0;el.title="Abrir: "+d.t;el.onclick=()=>go(d.go);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(d.go);}};}else el.style.cursor="default";
    inner.appendChild(el);return el;};
  branches.forEach(br=>{wire(x0+rootW,rootCy,x1,br._cy,br.c);br.leaves.forEach((lf,li)=>wire(x1+brW,br._cy,x2,br._lcy[li],lf.c||br.c));});
  node(x0,rootCy,rootW,Object.assign({spin:true},spec.root));
  branches.forEach(br=>{node(x1,br._cy,brW,br);br.leaves.forEach((lf,li)=>node(x2,br._lcy[li],lfW,lf));});
  [...inner.querySelectorAll(".fnode")].forEach((el,i)=>setTimeout(()=>el.classList.add("in"),110+i*65));
}
/* ---- barras divergentes com estrela de significância (comparação por variável) ---- */
function signedBars(host,rows,{h=320,unit="",dec=2}={}){
  const {cv,g}=mk(host,h),w=cv._w,pad={l:18,r:14,t:24,b:56};
  const amax=Math.max(0.001,...rows.map(r=>Math.abs(r.v)))*1.20;
  const x0=pad.l,x1=w-pad.r,y0=pad.t,y1=h-pad.b,cy=(y0+y1)/2,half=(y1-y0)/2,n=rows.length,step=(x1-x0)/n,bw=Math.min(48,step*0.58);
  anim(1300,prog=>{g.clearRect(0,0,w,h);cv._hits=[];
    g.strokeStyle="rgba(120,150,190,.34)";g.lineWidth=1;g.beginPath();g.moveTo(x0,cy);g.lineTo(x1,cy);g.stroke();
    g.fillStyle=C.faint;g.font='9px "IBM Plex Mono",monospace';g.textAlign="left";g.textBaseline="middle";g.fillText("0",x0+2,cy-8);
    rows.forEach((r,i)=>{const cx=x0+step*i+step/2,pr=stag(prog,i,n,0.5),hgt=Math.abs(r.v)/amax*half*pr,up=r.v>=0,by=up?cy-hgt:cy;
      glossBar(g,cx-bw/2,by,bw,Math.max(hgt,0.4),r.c,{dir:'v',glow:.5,r:5});
      if(prog>0.55){g.fillStyle=C.ink;g.font='700 11px "Space Grotesk",sans-serif';g.textAlign="center";g.textBaseline=up?"bottom":"top";g.fillText(sg(r.v,dec)+unit,cx,up?by-5:by+hgt+5);}
      if(r.sig&&prog>=1)sigStar(g,cx+bw/2+1,up?by-11:by+hgt+15,12);
      g.save();g.translate(cx,y1+11);g.rotate(-.52);g.fillStyle=r.c;g.font='700 10px "IBM Plex Mono",monospace';g.textAlign="right";g.textBaseline="middle";g.fillText(r.lab,0,0);g.restore();
      if(prog>=1)cv._hits.push({x:cx-bw/2,y:Math.min(by,cy)-16,w:bw,h:hgt+32,tip:`<b>${r.lab}</b><br>${sg(r.v,dec)}${unit}${r.sig?' · <b style="color:#ffd34d">significativo</b>':''}`});});
  });attachHits(cv);
}
function badges(k){const s=DERIV.stats[k];return [
  chipv(s.icc>=.75?C.good:s.icc>=.5?C.warn:C.crit,"confiab. "+(s.icc>=.75?"boa":s.icc>=.5?"moderada":"baixa")),
  chipv(s.snr>=4?C.good:s.snr>=2?C.warn:C.crit,"S/R "+num(s.snr,1)),
  chipv(Math.abs(s.dz)>=.8?C.crit:Math.abs(s.dz)>=.5?C.warn:C.muted,"efeito "+mag(s.dz)),
  chipv(C.pth,Math.abs(s.cr)>Math.abs(s.ag)*2?"mudança crônica":"agudo + crônico")].join("");}
function narr(k){const s=DERIV.stats[k],v=DERIV.vars[k];
  const nat=Math.abs(s.cr)>Math.abs(s.ag)*2?"predominantemente crônica, por acúmulo entre os dias":"resultante tanto do estímulo agudo quanto do acúmulo entre os dias";
  const inf=s.infl?`apresentou inflexão por volta do <b>dia ${num(s.infl,1)}</b>`:"não apresentou inflexão nítida";
  const snrtxt=s.snr>=4?"tendência limpa e confiável":s.snr>=2?"tendência clara, com oscilação relevante":"variação dominada por ruído/piso, a interpretar com cautela";
  return `<b>${v.lab}</b> teve média semanal de <b>${num(s.m,1)} ± ${num(s.sd,1)}</b> (CV ${num(s.cv,0)}%) e piso de <b>${num(s.floor,0)}%</b> de escores nulos. A confiabilidade entre dias foi <b>${num(s.icc,2)}</b> (MDC95 ${num(s.mdc95,1)} pontos). Ao longo da semana a variação foi <b>${s.fp<0.05?"significativa":"não significativa"}</b> (Friedman χ² = ${num(s.chi,1)}, p ${pfmt(s.fp)}; W = ${num(s.W,2)}). Do primeiro ao sétimo dia passou de <b>${num(s.d1,1)}</b> para <b>${num(s.d7,1)}</b> (${sg(s.delta,1)}; dz ${sg(s.dz)}, efeito <b>${mag(s.dz)}</b>). A mudança foi ${nat} (agudo ${sg(s.ag)}, crônico ${sg(s.cr)}). A curva ${inf}, com velocidade de pico de ${sg(s.vpk,1)} ponto por dia (dia ${num(s.vpkx,1)}). A razão sinal/ruído foi <b>${num(s.snr,1)}</b>, o que indica ${snrtxt}.`;}
function kpi(icon,lab,val,cap,color,goto){const d=document.createElement("div");d.className="kpi act";

});}
function momentos(k){const items=[],s=DERIV.stats[k];
  if(s.sig17)items.push(`<b>D1 → D7</b>: ${sg(s.delta,1)} · dz ${sg(s.dz)} · ${pShort(s.p17)}`);
  if(s.sigpp)items.push(`<b>Pré vs pós da semana</b>: dz ${sg(s.dzpp)} · ${pShort(s.ppp)}`);
  DERIV.trans.forEach(t=>{const o=t.v[k];if(o.sig)items.push(`<b>${t.lab}</b> (${t.tipo.toLowerCase()}): dz ${sg(o.dz)}`);});
  for(let d=2;d<=7;d++){const o=DERIV.prepos_dia[String(d)][k];if(o.sig)items.push(`<b>Dia ${d} · pré→pós</b>: dz ${sg(o.dz)}`);}
  if(!items.length)return `<p class="note" style="margin-top:8px">Nenhuma transição isolada alcançou significância estatística — coerente com o efeito de piso e com uma variação distribuída ao longo da semana.</p>`;
  return `<div class="tablewrap"><table class="dyn"><tbody>`+items.map(i=>`<tr><td>${i}</td></tr>`).join("")+`</tbody></table></div>`;}
